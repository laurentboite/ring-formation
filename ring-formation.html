<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scality RING — Formation Interactive</title>
<style>
:root{--bg:#0f1117;--bg2:#1a1f2e;--bg3:#242938;--bg4:#2d3346;--acc:#f26522;--acc2:#ff8c4a;--ok:#22c55e;--err:#ef4444;--warn:#f59e0b;--info:#3b82f6;--t1:#e2e8f0;--t2:#94a3b8;--t3:#64748b;--bdr:#2d3346;--code:#0a0d14}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--t1);display:flex;min-height:100vh;overflow:hidden}
.sb{width:252px;min-width:252px;background:var(--bg2);border-right:1px solid var(--bdr);display:flex;flex-direction:column;height:100vh;overflow-y:auto;transition:width .25s ease,min-width .25s ease}
.sb-logo{padding:18px 16px;border-bottom:1px solid var(--bdr);display:flex;align-items:flex-start;gap:6px}
.sb-logo h1{font-size:15px;font-weight:800;color:var(--acc);letter-spacing:.3px}
.sb-logo p{font-size:11px;color:var(--t3);margin-top:2px}
.sb-nav{flex:1;padding:8px 0}
.nav-sec{padding:10px 16px 4px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--t3)}
.ni{display:flex;align-items:center;gap:8px;padding:9px 14px;cursor:pointer;transition:all .15s;border-left:3px solid transparent;font-size:12.5px;color:var(--t2)}
.ni:hover{background:var(--bg4);color:var(--t1)}
.ni.active{background:rgba(242,101,34,.12);border-left-color:var(--acc);color:var(--acc)}
.ni .nid{font-size:10px;font-weight:700;background:var(--bg3);padding:2px 5px;border-radius:4px;min-width:26px;text-align:center}
.ni.active .nid{background:var(--acc);color:#fff}
.ni .ntxt{flex:1;line-height:1.3}
.ni .nbadge{font-size:10px;padding:1px 6px;border-radius:8px;font-weight:600}
.ni.done .nbadge{background:rgba(34,197,94,.15);color:var(--ok)}
.ni.partial .nbadge{background:rgba(245,158,11,.15);color:var(--warn)}
.sb-foot{padding:14px;border-top:1px solid var(--bdr)}
.sb-logo-txt{flex:1;min-width:0;overflow:hidden}
.sb-toggle{background:none;border:none;cursor:pointer;color:var(--t3);padding:3px 5px;border-radius:4px;font-size:18px;line-height:1;transition:color .15s,background .15s;flex-shrink:0;margin-top:1px}
.sb-toggle:hover{color:var(--acc);background:var(--bg3)}
.sb.collapsed{width:52px;min-width:52px;overflow-x:hidden}
.sb.collapsed .sb-logo{justify-content:center;padding:14px 0}
.sb.collapsed .sb-logo-txt{display:none}
.sb.collapsed .nav-sec{display:none}
.sb.collapsed .ni .ntxt,.sb.collapsed .ni .nbadge{display:none}
.sb.collapsed .ni{justify-content:center;padding:8px 0}
.sb.collapsed .sb-foot{display:none}


.tot-box{background:var(--bg3);border-radius:8px;padding:12px;text-align:center}
.tot-box .tl{font-size:11px;color:var(--t3);margin-bottom:2px}
.tot-box .tv{font-size:26px;font-weight:800;color:var(--acc);line-height:1}
.tot-box .ts{font-size:11px;color:var(--t2);margin-top:2px}
.main{flex:1;overflow-y:auto;height:100vh}
.home{padding:36px 40px;display:none}
.home.show{display:block}
.home-hdr h1{font-size:28px;font-weight:800;background:linear-gradient(135deg,var(--acc),#ff9d6e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
.home-hdr p{color:var(--t2);font-size:14px;margin-bottom:28px}
.stats-row{display:flex;gap:12px;margin-bottom:28px}
.stat-card{background:var(--bg3);border:1px solid var(--bdr);border-radius:10px;padding:14px 18px;flex:1}
.stat-card .sv{font-size:22px;font-weight:800}
.stat-card .sl{font-size:11px;color:var(--t3);margin-top:2px}
.sv.col-acc{color:var(--acc)}.sv.col-ok{color:var(--ok)}.sv.col-info{color:#93c5fd}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.mc{background:var(--bg3);border:1px solid var(--bdr);border-radius:12px;padding:18px;cursor:pointer;transition:all .2s;position:relative}
.mc:hover{border-color:var(--acc);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.35)}
.mc.done{border-color:rgba(34,197,94,.3)}
.mc .mid{font-size:10px;font-weight:700;color:var(--acc);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.mc .mtit{font-size:15px;font-weight:600;margin-bottom:6px;line-height:1.3}
.mc .mdesc{font-size:12px;color:var(--t3);line-height:1.5}
.mc .mfoot{margin-top:14px;display:flex;align-items:center;gap:8px}
.pbar{flex:1;height:4px;background:var(--bg2);border-radius:2px;overflow:hidden}
.pfill{height:100%;border-radius:2px;transition:width .4s}
.pfill.acc{background:var(--acc)}.pfill.ok{background:var(--ok)}
.msc{font-size:11px;color:var(--t3);white-space:nowrap}
.mp{display:none;flex-direction:column;height:100vh}
.mp.show{display:flex}
.mphdr{padding:18px 32px;border-bottom:1px solid var(--bdr);background:var(--bg2);display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:10;flex-shrink:0}
.backbtn{background:var(--bg3);border:1px solid var(--bdr);color:var(--t2);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px;transition:all .15s}
.backbtn:hover{border-color:var(--acc);color:var(--acc)}
.mphdr-info{flex:1}
.mph-id{font-size:10px;color:var(--acc);font-weight:700;text-transform:uppercase;letter-spacing:1px}
.mph-title{font-size:18px;font-weight:700}
.tabs{display:flex;gap:4px}
.tbtn{padding:7px 14px;border-radius:6px;border:1px solid var(--bdr);background:transparent;color:var(--t2);cursor:pointer;font-size:12.5px;transition:all .15s}
.tbtn.active{background:var(--acc);border-color:var(--acc);color:#fff}
.mpbody{flex:1;overflow-y:auto}
.theory{padding:28px 4vw;max-width:none;display:none}
.theory.show{display:block}
.theory h2{font-size:22px;font-weight:700;color:var(--acc);margin:28px 0 12px;padding-bottom:7px;border-bottom:1px solid var(--bdr)}
.theory h2:first-child{margin-top:0}
.theory h3{font-size:17px;font-weight:600;margin:20px 0 8px;color:var(--t1)}
.theory p{margin-bottom:12px;color:var(--t2);font-size:16px;line-height:1.75}
.theory ul,.theory ol{margin:8px 0 12px 24px;color:var(--t2);font-size:16px}
.theory li{margin-bottom:5px;line-height:1.6}
.theory strong{color:var(--t1)}
code{background:var(--code);color:#7dd3fc;padding:2px 5px;border-radius:3px;font-family:'SF Mono','Fira Code',monospace;font-size:11.5px}
pre{background:var(--code);border:1px solid var(--bdr);border-radius:8px;padding:14px;overflow-x:auto;margin:10px 0;font-family:'SF Mono','Fira Code',monospace;font-size:11.5px;line-height:1.7;color:#a5f3fc}
pre code{background:none;padding:0;color:inherit}
.theory table{width:100%;border-collapse:collapse;margin:14px 0;font-size:15px}
.theory th{background:var(--bg3);padding:11px 14px;text-align:left;font-weight:600;color:var(--t1);border-bottom:2px solid var(--acc)}
.theory td{padding:11px 14px;border-bottom:1px solid var(--bdr);color:var(--t2);vertical-align:top}
.theory tr:hover td{background:rgba(255,255,255,.02)}
.alert{border-radius:7px;padding:13px 16px;margin:12px 0;font-size:12.5px;display:flex;gap:8px;line-height:1.5}
.alert-w{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);color:#fbbf24}
.alert-i{background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.3);color:#93c5fd}
.alert-d{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#fca5a5}
.alert-s{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);color:#86efac}
.kbox{background:rgba(242,101,34,.06);border:1px solid rgba(242,101,34,.2);border-radius:9px;padding:14px 18px;margin:18px 0}
.kbox h3{color:var(--acc)!important;margin-top:0!important;font-size:11.5px!important;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px!important}
.kbox ul{margin:0!important;list-style:none!important}
.kbox li{padding:3px 0;display:flex;gap:8px;color:var(--t2);font-size:13px}
.kbox li::before{content:'→';color:var(--acc);flex-shrink:0}
.adiag{background:var(--code);border:1px solid var(--bdr);border-radius:7px;padding:16px;font-family:'SF Mono',monospace;font-size:13px;line-height:1.85;color:#7dd3fc;margin:10px 0;white-space:pre;overflow-x:auto}
.quiz{padding:28px 4vw;max-width:none;display:none}
.quiz.show{display:block}
.quiz-hdr{margin-bottom:22px}
.quiz-hdr h2{font-size:21px;font-weight:700;margin-bottom:4px}
.quiz-hdr p{color:var(--t3);font-size:12.5px}
.qcard{background:var(--bg3);border:1px solid var(--bdr);border-radius:11px;padding:18px;margin-bottom:14px;transition:border-color .2s}
.qcard.answered{border-color:var(--bg4)}
.qnum{font-size:10px;color:var(--acc);font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:7px}
.qtxt{font-size:16px;font-weight:500;margin-bottom:16px;line-height:1.55;color:var(--t1)}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{display:flex;align-items:flex-start;gap:9px;padding:9px 13px;background:var(--bg2);border:1px solid var(--bdr);border-radius:7px;cursor:pointer;transition:all .15s;font-size:13px;color:var(--t2);line-height:1.5}
.opt:hover:not(.locked){border-color:var(--acc);color:var(--t1);background:var(--bg4)}
.opt.sel{border-color:var(--acc);background:rgba(242,101,34,.1);color:var(--t1)}
.opt.correct{border-color:var(--ok);background:rgba(34,197,94,.1);color:#86efac}
.opt.wrong{border-color:var(--err);background:rgba(239,68,68,.1);color:#fca5a5}
.opt.locked{cursor:default}
.opt .ol{font-weight:700;color:var(--acc);min-width:14px;flex-shrink:0;margin-top:1px}
.opt.correct .ol,.opt.wrong .ol{color:inherit}
.expl{margin-top:10px;padding:9px 13px;background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.2);border-radius:7px;font-size:12px;color:#93c5fd;display:none;line-height:1.5}
.expl.show{display:block}
.qa{margin-top:20px;display:flex;gap:10px;align-items:center}
.btn{padding:9px 18px;border-radius:7px;border:none;cursor:pointer;font-size:13.5px;font-weight:500;transition:all .15s}
.btn-p{background:var(--acc);color:#fff}.btn-p:hover{background:var(--acc2)}
.btn-s{background:var(--bg3);color:var(--t2);border:1px solid var(--bdr)}.btn-s:hover{border-color:var(--acc);color:var(--acc)}
.btn-ok{background:var(--ok);color:#fff}.btn-ok:hover{background:#16a34a}
.btn-i{background:var(--info);color:#fff}.btn-i:hover{background:#2563eb}
.result-box{background:var(--bg3);border-radius:12px;padding:24px;margin-top:20px;text-align:center;display:none}
.result-box.show{display:block}
.rscore{font-size:52px;font-weight:800;margin:10px 0 4px}
.rscore.ex{color:var(--ok)}.rscore.gd{color:var(--warn)}.rscore.po{color:var(--err)}
.rlabel{font-size:17px;font-weight:600;margin-bottom:6px}
.rmsg{font-size:13px;color:var(--t3);margin-bottom:18px}
.rnext{display:flex;gap:10px;justify-content:center}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:3px}
.gloss-alpha{display:flex;flex-wrap:wrap;gap:5px;padding:13px 36px;border-bottom:1px solid var(--bdr);background:var(--bg2);position:sticky;top:0;z-index:5}
.gl-al{padding:3px 9px;border-radius:5px;background:var(--bg3);border:1px solid var(--bdr);color:var(--t2);font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;user-select:none}
.gl-al:hover{border-color:var(--acc);color:var(--acc)}
.gloss-lhdr{font-size:20px;font-weight:800;color:var(--acc);padding:22px 36px 8px;border-bottom:1px solid var(--bdr);scroll-margin-top:56px}
.gloss-entry{padding:13px 36px 15px;border-bottom:1px solid rgba(45,51,70,.5);transition:background .15s}
.gloss-entry:hover{background:rgba(255,255,255,.02)}
.gl-term{font-size:14px;font-weight:700;color:var(--t1);margin-bottom:4px}
.gl-def{font-size:13px;color:var(--t2);line-height:1.65;margin-bottom:5px}
.gl-ref{font-size:11.5px;color:var(--acc);cursor:pointer;font-weight:600}
.gl-ref:hover{color:var(--acc2);text-decoration:underline}

.lang-toggle{display:flex;gap:4px;align-items:center;padding:0 8px 8px 8px;justify-content:flex-end}
.sb.collapsed .lang-toggle{justify-content:center;padding:4px 0 8px}
.flag-btn{background:none;border:1.5px solid transparent;border-radius:5px;cursor:pointer;font-size:18px;line-height:1;padding:2px 5px;opacity:.45;transition:opacity .15s,border-color .15s}
.flag-btn:hover{opacity:.8}
.flag-btn.flag-active{opacity:1;border-color:var(--acc)}
</style>

<script>
var MODS=[
{id:'01',num:'01',title:'Architecture RING',desc:'Structure 4 couches, routage P2P, Bizstorenode et Biziod',
content:'<h2>Qu\'est-ce que le Scality RING ?</h2><p>Le RING est une solution de <strong>stockage objet distribué scale-out</strong> développé par Scality. Il stocké des objets (fichiers, blobs, données binaires) de façon redondante sur un cluster de serveurs physiques standards. Ses caractéristiques fondamentales sont :</p><ul><li><strong>Scalabilité horizontale (scale-out)</strong> : on ajoute des serveurs au cluster pour augmenter la capacité et les performances, sans interruption de service.</li><li><strong>Pas de point unique de défaillance (SPOF)</strong> : il n\'existe aucun nœud maître, aucun coordinateur central. Tout nœud peut traiter n\'importe quelle requête.</li><li><strong>Adressage par contenu</strong> : chaque objet est identifié par un identifiant unique (hash ou clé) qui determine mécaniquement sa localisation dans le cluster.</li><li><strong>Durabilité configurable</strong> : la redondance est ajustable — réplication simple (COS) pour les petits objets et métadonnées, erasure coding (ARC) pour les grands objets.</li></ul><h2>Architecture en 4 Couches</h2><p>Le RING est organisé en <strong>4 couches superposées</strong> a responsabilites distinctes. Cette séparation permet de faire évoluer chaque couche indépendamment :</p><div class="adiag">  APPLICATIONS CLIENTES (S3 SDK, NFS, SMB, HTTP...)\n          |\n+--------------------------------------------------+\n|  COUCHE 1 : CONNECTORS                          |\n|  S3 . sproxyd . NFSv3 . NFSv4 . SMB . FUSE . CDMI  |\n|  Traduit le protocole client en opérations RING  |\n+--------------------------------------------------+\n          |\n+--------------------------------------------------+\n|  COUCHE 2 : STORAGE NODES (Bizstorenode)        |\n|  6 nodes virtuels par serveur physique          |\n|  Possède un segment du keyspace P2P global      |\n|  Route ou répond aux requêtes objet             |\n+--------------------------------------------------+\n          |\n+--------------------------------------------------+\n|  COUCHE 3 : IO DAEMONS (Biziod)                 |\n|  1 daemon par disque physique                   |\n|  Écrit/lit dans les fichiers container sur HDD  |\n|  Maintient l\'index de clés sur SSD              |\n+--------------------------------------------------+\n          |\n+--------------------------------------------------+\n|  COUCHE 4 : STOCKAGE PHYSIQUE                   |\n|  SSD : index Biziod (lookups rapides)           |\n|  HDD : fichiers container (données brutes)      |\n+--------------------------------------------------+</div><h2>Couche 1 — Les Connectors</h2><p>Les <strong>Connectors</strong> sont les points d\'entrée du RING pour les applications clientes. Chaque connector traduit un protocole standard en opérations internes RING (PUT, GET, DELETE sur un objet identifié par sa clé) :</p><table><tr><th>Connector</th><th>Protocole</th><th>Cas d\'usage</th></tr><tr><td>S3 Connector</td><td>HTTP/S3 AWS-compatible</td><td>Applications cloud-native, backup, archivage</td></tr><tr><td>sproxyd</td><td>HTTP REST natif Scality</td><td>Applications internes Scality, SOFS</td></tr><tr><td>NFSv3 / NFSv4</td><td>NFS</td><td>Accès fichiers Linux, montages NFS classiques</td></tr><tr><td>SMB/CIFS</td><td>SMB 3.0</td><td>Partages Windows, Active Directory</td></tr><tr><td>FUSE</td><td>POSIX/FUSE</td><td>Montage local direct sur le serveur connector</td></tr><tr><td>CDMI</td><td>CDMI/HTTP</td><td>API standard SNIA Cloud Storage</td></tr></table><p>Les Connectors sont <strong>decoples des Storage Nodes</strong> : ils peuvent être sur des serveurs dédiés ou co-localises selon l\'architecture. Un Connector défaillant n\'affecte pas la disponibilité des données — un autre Connector sur un autre serveur prend le relais.</p><h2>Couche 2 — Le Bizstorenode (Storage Node Virtuel)</h2><p>Le <strong>Bizstorenode</strong> est le nœud de stockage virtuel. C\'est le composant central du RING au niveau logiciel. Voici ses caractéristiques détaillées :</p><h3>Multiples instances par serveur physique</h3><p>Un serveur physique héberge <strong>exactement 6 Bizstorenode</strong>. Ce nombre n\'est pas arbitraire : il permet de presenter suffisamment de segments distincts dans le keyspace global pour garantir un bon équilibre de charge et une distribution uniforme des données, même sur de petits clusters.</p><h3>Le keyspace et le routage P2P</h3><p>L\'ensemble des objets possibles est defini par un <strong>espace d\'adresses (keyspace)</strong> — un espace circulaire de hashes (par exemple 0 a 2^128). Cet espace est decoupu en segments, et chaque Bizstorenode est responsable d\'un ou plusieurs segments :</p><div class="adiag">Keyspace circulaire (vue simplifiée 3 serveurs = 18 Bizstorenode) :\n\n        0                  2^128\n        +------+------+------+------+------+------+\n        | bsn1 | bsn2 | bsn3 | bsn4 | ... | bsn18|\n        +------+------+------+------+------+------+\n            |                       |\n        Serveur 1               Serveur 3\n\nHash(clé_objet) -> position dans le keyspace\n                -> Bizstorenode responsable identifié</div><p>Quand un Connector reçoit un PUT ou GET, il calcule le hash de la clé de l\'objet, l\'envoie a n\'importe quel Bizstorenode du cluster. Ce Bizstorenode, grâce a la table de routage P2P, sait s\'il est responsable de cette clé ou doit la <strong>router vers le bon node</strong> en O(log N) sauts maximum.</p><h3>Responsabilites du Bizstorenode</h3><ul><li><strong>Reception des requêtes</strong> : reçoit les PUT/GET/DELETE des Connectors</li><li><strong>Routage P2P</strong> : transmet la requête au node responsable si nécessaire</li><li><strong>Gestion de la redondance</strong> : coordonne l\'écriture des répliques COS ou des fragments ARC sur les Biziod cibles</li><li><strong>Maintenance du keyspace</strong> : lors d\'ajout/retrait de nodes, le Bizstorenode gère le transfert des segments (Relocation, Balance)</li><li><strong>Communication avec MESA</strong> : met a jour l\'index des objets dans la base distribuée interne</li></ul><h2>Couche 3 — Le Biziod (IO Daemon par Disque)</h2><p>Le <strong>Biziod</strong> (Biz IO Daemon) est le daemon d\'entrée/sortie de bas niveau. Il est instancie a raison d\'<strong>un Biziod par disque physique</strong> du serveur. C\'est lui qui gère physiquement les lectures et écritures.</p><h3>Séparation Index / Données</h3><p>Le Biziod maintient deux structures de données fondamentalement séparées sur deux types de supports différents :</p><table><tr><th>Structure</th><th>Support</th><th>Contenu</th><th>Pourquoi</th></tr><tr><td><strong>Index</strong></td><td>SSD</td><td>Table de correspondance : clé objet -> position dans le container HDD</td><td>Lookup O(1) sur chaque requête : la latence SSD (0.1ms) vs HDD (5ms) multiplie les IOPS par 50</td></tr><tr><td><strong>Données</strong></td><td>HDD</td><td>Contenu binaire brut des objets (ou fragments ARC)</td><td>Les HDD offrent le meilleur ratio capacité/coût pour les données sequentielles</td></tr></table><h3>Les fichiers container</h3><p>Sur le HDD, le Biziod n\'écrit pas un fichier par objet (ce qui serait catastrophique pour le système de fichiers). Il utilisé des <strong>fichiers container de taille fixe</strong> (pré-alloués) :</p><ul><li>Chaque container est un gros fichier pré-alloué sur le HDD (ex : 1 GB ou plus)</li><li>Les objets sont écrits sequentiellement dans ces containers (append-only)</li><li>L\'index SSD pointe vers la position exacte (container + offset) de chaque objet</li><li>La pré-allocation élimine la fragmentation et les appels système <code>fallocate</code> repetes</li><li>Lors de la suppression d\'un objet, sa position est marquée "libre" dans l\'index — le Garbage Collector recycle ensuite cet espace</li></ul><h3>Avantages de cette architecture Biziod</h3><ul><li><strong>Isolation des pannes</strong> : un disque HDD qui tombe n\'affecte que son Biziod. Les autres Biziod sur le même serveur continuent.</li><li><strong>Scalabilité interne</strong> : ajouter des disques = ajouter des Biziod = augmenter la capacité et le parallélisme I/O</li><li><strong>Predictabilite</strong> : les containers pré-alloués garantissent des performances I/O stables sans fragmentation</li></ul><h2>Couche 4 — Le Stockage Physique</h2><p>La couche physique distingue deux rôles complémentaires :</p><ul><li><strong>SSD (Solid State Drive)</strong> : exclusivement pour les index Biziod. Chaque disque HDD du serveur a son SSD associé. La règle absolue : <em>jamais l\'index sur HDD, jamais les données sur SSD</em>.</li><li><strong>HDD (Hard Disk Drive)</strong> : contient les fichiers container. La capacité brute du RING est la somme des HDD de tous les serveurs du cluster.</li></ul><div class="alert alert-w">Attention : si un SSD d\'index tombe en panne (sans perte du HDD de données associé), les données ne sont pas perdues mais l\'index doit être reconstruit. Cette opération peut prendre plusieurs heures. Toujours utiliser des SSD en RAID1 ou surveiller leur sante via S.M.A.R.T.</div><h2>Le Protocole Peer-to-Peer — Fonctionnement Detaille</h2><p>Le RING n\'a <strong>aucun coordinateur central</strong>. Voici comment une requête GET est traitée :</p><ol><li>Le Connector calcule <code>hash(clé_objet)</code> et envoie la requête GET a n\'importe quel Bizstorenode du cluster.</li><li>Ce Bizstorenode consulte sa <strong>table de routage P2P locale</strong> pour determiner si la clé appartient a son segment ou a un autre node.</li><li>Si ce n\'est pas son segment, il <strong>route la requête vers le node responsable</strong> (en O(log N) sauts).</li><li>Le node responsable identifié les Biziod cibles (réplication COS ou fragments ARC).</li><li>Les Biziod consultent leur index SSD, lisent les données depuis le container HDD et répondent.</li><li>La réponse remonte vers le Connector qui la renvoie au client.</li></ol><p>Ce modèle sans coordinateur central élimine le goulot d\'etranglement habituel des architectures maître/esclave et permet une scalabilité lineaire théorique.</p><h2>Configuration de Référence : RING 3 Serveurs</h2><p>Un cluster RING minimal de production comporte <strong>3 serveurs</strong>. Voici les paramètres de redondance applicables dans cette configuration :</p><table><tr><th>Type de donnée</th><th>Mécanisme</th><th>Nombre</th><th>Tolérance</th></tr><tr><td>Grands objets (data)</td><td>ARC 7+5</td><td>12 fragments sur 3 serveurs</td><td>Perte de 5 fragments quelconques</td></tr><tr><td>Petits objets (data)</td><td>COS 3</td><td>3 copies intégrales</td><td>Perte de 1 serveur complet</td></tr><tr><td>Métadonnées SOFS</td><td>COS 4+</td><td>4 copies minimum</td><td>Perte de 1 serveur complet</td></tr><tr><td>Métadonnées S3</td><td>COS 5</td><td>5 copies</td><td>Quorum majoritaire</td></tr></table><div class="alert alert-d">Règle absolue sur un RING 3 serveurs : ne jamais avoir 2 serveurs en panne simultanément. Avec seulement 1 serveur disponible, le quorum des métadonnées S3 (COS 5) ne peut plus être garanti et les opérations d\'écriture seront bloquées.</div><h2>Scalabilité — Ajout de Serveurs</h2><p>Le RING est concu pour la croissance lineaire. Quand on ajoute un serveur :</p><ol><li>6 nouveaux Bizstorenode sont déclarés et rejoignent le cluster (nodeJoin).</li><li>Ces nouveaux nodes obtiennent des segments du keyspace des anciens nodes (Relocation).</li><li>Les objets correspondants sont migres automatiquement en arrière-plan (Balance).</li><li>La capacité totale et le parallélisme I/O augmentent lineairement.</li></ol><p>Il n\'y a pas de limite théorique au nombre de serveurs. Les clusters Scality en production peuvent atteindre plusieurs centaines de nœuds.</p><h2>Keyspace RING — Distribution des Données</h2><p>Le <strong>keyspace</strong> definit comment les clés d\'objets sont distribuées sur les nœuds du RING via le protocole Chord. C\'est la "carte" qui indique a quel bizstorenode appartient chaque clé.</p><h3>Fichiers du keyspace</h3><table><tr><th>Fichier</th><th>Rôle</th></tr><tr><td><code>keyspace.json</code></td><td>Configuration reelle du keyspace : répartition des segments de clés entre les bizstorenode. Génère par l\'outil ExVT Scality.</td></tr><tr><td><code>sprov_context.json</code></td><td>Contexte de provisionnement : configuration du cluster (nombre de serveurs, disques, protection ARC/COS).</td></tr><tr><td><code>sprov_model.json</code></td><td>Modèle de provisionnement : paramètres de calcul du keyspace optimal pour la configuration matérielle.</td></tr></table><h3>Keyspace précalculé vs custom</h3><p>Scality fournit des <strong>keyspaces précalculés</strong> pour les configurations standard (ex: 6 serveurs 2 sites, 12 serveurs 3 sites). Si la configuration n\'est pas standard (nombre inhabituel de serveurs, diskgroups spécifiques), un <strong>keyspace custom</strong> doit être calcule par l\'équipe ExVT Scality et applique manuellement après installation.</p><pre># Appliquer un keyspace custom après installation\nringsh supervisor nodeJoinAll DATA   # rejoindre tous les nœuds au RING DATA\nringsh supervisor nodeJoinAll META   # rejoindre tous les nœuds au RING META\n\n# Vérifier via le dashboard RING Administration Interface\n# Opérations -> Ring Status -> tous les nœuds IN_SERVICE</pre><p class="alert-i">Le keyspace impacte directement la distribution des données et la performance. Une mauvaise configuration du keyspace peut créer des "hot spots" (surcharge de certains nœuds). L\'équipe ExVT Scality valide et calcule les keyspaces pour garantir une distribution optimale.</p><div class="kbox"><h3>Points Clés a Retenir</h3><ul><li>4 couches distinctes : Connectors -> Bizstorenode -> Biziod -> Disques physiques</li><li>6 Bizstorenode par serveur physique : segment du keyspace P2P chacun</li><li>1 Biziod par disque physique : index sur SSD, données en containers pré-alloués sur HDD</li><li>Routage P2P distribué par hash : pas de SPOF, O(log N) sauts maximum</li><li>RING 3 serveurs : ARC 7+5 (data), COS 3 (petits objets), COS 4+ (meta SOFS), COS 5 (meta S3)</li><li>Scalabilité lineaire : ajout de serveurs sans interruption de service</li></ul></div>',
quiz:[
  {q:"Combien de Bizstorenode sont déployés sur chaque serveur physique RING ?",opts:["3","4","6","12"],ans:2,expl:"Il y a exactement 6 Bizstorenode par serveur physique. Chacun détient une partition du keyspace global."},
  {q:"Où le Biziod stocke-t-il l'index des objets pour des performances optimales ?",opts:["HDD (grande capacité)","SSD (accès rapide)","RAM (volatile)","Base de données externe"],ans:1,expl:"L'index est sur SSD pour des lookups rapides. Les données elles-mêmes sont sur HDD dans des fichiers container de taille fixe."},
  {q:"Dans un RING 3 serveurs, combien de répliques pour les métadonnées S3 ?",opts:["3","4","5","7"],ans:2,expl:"Les métadonnées S3 utilisent 5 répliques COS pour une haute disponibilité et la résilience du quorum."},
  {q:"Quel protocole le RING utilise-t-il pour le routage distribué entre nodes ?",opts:["HTTP/REST","TCP direct","Peer-to-Peer (P2P)","gRPC"],ans:2,expl:"Le RING utilisé un protocole P2P. Le hash de la clé détermine les nodes responsables, sans coordinateur central."},
  {q:"Quelle couche expose les protocoles d'accès aux applications (S3, NFS, SMB...) ?",opts:["Biziod","Bizstorenode","Connectors","MESA"],ans:2,expl:"Les Connectors sont la couche la plus haute. Ils exposent S3, sproxyd, NFS, SMB, FUSE, CDMI aux applications clientes."},
  {q:"Quels sont les 3 fichiers qui composent le keyspace d'un RING Scality ?",opts:["keyspace.json, partition.json, ring.json","keyspace.json, sprov_context.json, sprov_model.json","keyspace.cfg, nodes.json, meta.json","ring.conf, keyspace.map, chord.json"],ans:1,expl:"Le keyspace RING est défini par : keyspace.json (structure des partitions Chord), sprov_context.json (contexte de déploiement), sprov_model.json (modèle de réplication)."},
  {q:"Quel est le rôle du RING META par rapport au RING DATA ?",opts:["RING META stocké les données brutes, RING DATA les métadonnées","RING META gère les métadonnées et index, RING DATA stocké les objets","Ce sont deux noms pour le même ring","RING META est un backup de RING DATA"],ans:1,expl:"Le RING est logiquement divisé : META pour les métadonnées/index (MESA, Chord), DATA pour les blobs d'objets. Les deux sont des rings Chord indépendants."},
  {q:"Pourquoi le RING n'a-t-il pas de coordinateur central pour le routage des requêtes ?",opts:["Pour des raisons de coût de licence","Pour éliminer le point de défaillance unique et passer à l'échelle horizontalement","Parce que HTTP ne supporte pas les coordinateurs","Pour des raisons de sécurité uniquement"],ans:1,expl:"Un coordinateur central serait un SPOF (Single Point of Failure) et un goulot d'étranglement. Avec P2P, chaque nœud peut router vers le bon destinataire via le hash Chord, assurant la scalabilité et la résilience."},
  {q:"Que se passe-t-il si un Bizstorenode tombe alors que son voisin est déjà OOS ?",opts:["Le ring continue normalement car les autres nœuds prennent le relais","La protection peut être dégradée selon le COS : si le nombre de fragments survivants passe sous le seuil de reconstruction, des données peuvent devenir irrécupérables","Le ring se met automatiquement en pause","Tous les nœuds passent en OOS"],ans:1,expl:"La résilience du RING dépend du COS et du schéma ARC ou réplication. Si trop de fragments/répliques sont perdus simultanément (dépassant la tolérance du COS), certains objets peuvent devenir inaccessibles ou irrécupérables."},
  {q:"Quel est le rôle de l'algorithme Chord dans le RING ?",opts:["Chiffrer les données au repos","Calculer quel(s) nœud(s) est responsable d'une clé donnée via un espace d'adressage circulaire","Compresser les données avant stockage","Gérer l'authentification des nœuds"],ans:1,expl:"Chord est l'algorithme DHT (Distributed Hash Table) du RING. Il mappe chaque clé d'objet à un point dans un espace circulaire et détermine deterministiquement quels nœuds en sont responsables, sans annuaire central."}
],
title_en:'RING Architecture',
desc_en:'4-layer structure, P2P routing, Bizstorenode and Biziod',
content_en:'<h2>What is the Scality RING?</h2><p>The RING is a <strong>scale-out distributed object storage</strong> solution developed by Scality. It stores objects (files, blobs, binary data) redundantly across a cluster of standard physical servers. Its fundamental characteristics are:</p><ul><li><strong>Horizontal scalability (scale-out)</strong>: servers are added to the cluster to increase capacity and performance, without service interruption.</li><li><strong>No single point of failure (SPOF)</strong>: there is no master node, no central coordinator. Any node can process any request.</li><li><strong>Content addressing</strong>: each object is identified by a unique identifier (hash or key) that mechanically determines its location within the cluster.</li><li><strong>Configurable durability</strong>: redundancy is adjustable — simple replication (COS) for small objects and metadata, erasure coding (ARC) for large objects.</li></ul><h2>4-Layer Architecture</h2><p>The RING is organized into <strong>4 stacked layers</strong> with distinct responsibilities. This separation allows each layer to evolve independently:</p><div class="adiag">  CLIENT APPLICATIONS (S3 SDK, NFS, SMB, HTTP...)\n          |\n+--------------------------------------------------+\n|  LAYER 1 : CONNECTORS                           |\n|  S3 . sproxyd . NFSv3 . NFSv4 . SMB . FUSE . CDMI  |\n|  Translates client protocol into RING operations |\n+--------------------------------------------------+\n          |\n+--------------------------------------------------+\n|  LAYER 2 : STORAGE NODES (Bizstorenode)         |\n|  6 virtual nodes per physical server            |\n|  Owns a segment of the global P2P keyspace      |\n|  Routes or responds to object requests          |\n+--------------------------------------------------+\n          |\n+--------------------------------------------------+\n|  LAYER 3 : IO DAEMONS (Biziod)                  |\n|  1 daemon per physical disk                     |\n|  Reads/writes to container files on HDD         |\n|  Maintains the key index on SSD                 |\n+--------------------------------------------------+\n          |\n+--------------------------------------------------+\n|  LAYER 4 : PHYSICAL STORAGE                     |\n|  SSD : Biziod index (fast lookups)              |\n|  HDD : container files (raw data)               |\n+--------------------------------------------------+</div><h2>Layer 1 — The Connectors</h2><p>The <strong>Connectors</strong> are the RING entry points for client applications. Each connector translates a standard protocol into internal RING operations (PUT, GET, DELETE on an object identified by its key):</p><table><tr><th>Connector</th><th>Protocol</th><th>Use case</th></tr><tr><td>S3 Connector</td><td>HTTP/S3 AWS-compatible</td><td>Cloud-native applications, backup, archiving</td></tr><tr><td>sproxyd</td><td>Native Scality HTTP REST</td><td>Scality internal applications, SOFS</td></tr><tr><td>NFSv3 / NFSv4</td><td>NFS</td><td>Linux file access, classic NFS mounts</td></tr><tr><td>SMB/CIFS</td><td>SMB 3.0</td><td>Windows shares, Active Directory</td></tr><tr><td>FUSE</td><td>POSIX/FUSE</td><td>Direct local mount on the connector server</td></tr><tr><td>CDMI</td><td>CDMI/HTTP</td><td>SNIA Cloud Storage standard API</td></tr></table><p>The Connectors are <strong>decoupled from the Storage Nodes</strong>: they can reside on dedicated servers or be co-located depending on the architecture. A failed Connector does not affect data availability — another Connector on another server takes over.</p><h2>Layer 2 — The Bizstorenode (Virtual Storage Node)</h2><p>The <strong>Bizstorenode</strong> is the virtual storage node. It is the central software component of the RING. Its detailed characteristics are as follows:</p><h3>Multiple instances per physical server</h3><p>A physical server hosts <strong>exactly 6 Bizstorenode instances</strong>. This number is not arbitrary: it provides enough distinct segments in the global keyspace to guarantee good load balancing and uniform data distribution, even on small clusters.</p><h3>The keyspace and P2P routing</h3><p>The set of all possible objects is defined by an <strong>address space (keyspace)</strong> — a circular hash space (e.g. 0 to 2^128). This space is divided into segments, and each Bizstorenode is responsible for one or more segments:</p><div class="adiag">Circular keyspace (simplified view: 3 servers = 18 Bizstorenode):\n\n        0                  2^128\n        +------+------+------+------+------+------+\n        | bsn1 | bsn2 | bsn3 | bsn4 | ... | bsn18|\n        +------+------+------+------+------+------+\n            |                       |\n        Server 1                Server 3\n\nHash(object_key) -> position in the keyspace\n                -> responsible Bizstorenode identified</div><p>When a Connector receives a PUT or GET, it computes the hash of the object key and sends the request to any Bizstorenode in the cluster. That Bizstorenode, using its local P2P routing table, determines whether the key falls within its own segment or must be <strong>routed to the correct node</strong> in O(log N) hops at most.</p><h3>Bizstorenode responsibilities</h3><ul><li><strong>Request reception</strong>: receives PUT/GET/DELETE requests from Connectors</li><li><strong>P2P routing</strong>: forwards the request to the responsible node if necessary</li><li><strong>Redundancy management</strong>: coordinates the writing of COS replicas or ARC fragments to the target Biziod instances</li><li><strong>Keyspace maintenance</strong>: when nodes are added or removed, the Bizstorenode manages segment transfers (Relocation, Balance)</li><li><strong>Communication with MESA</strong>: updates the object index in the internal distributed database</li></ul><h2>Layer 3 — The Biziod (IO Daemon per Disk)</h2><p>The <strong>Biziod</strong> (Biz IO Daemon) is the low-level I/O daemon. One Biziod is instantiated per <strong>physical disk</strong> on the server. It is responsible for physically managing all reads and writes.</p><h3>Index / Data separation</h3><p>The Biziod maintains two fundamentally separate data structures on two different types of storage media:</p><table><tr><th>Structure</th><th>Media</th><th>Content</th><th>Reason</th></tr><tr><td><strong>Index</strong></td><td>SSD</td><td>Lookup table: object key -> position in the HDD container</td><td>O(1) lookup on every request: SSD latency (0.1 ms) vs HDD (5 ms) multiplies IOPS by 50</td></tr><tr><td><strong>Data</strong></td><td>HDD</td><td>Raw binary content of objects (or ARC fragments)</td><td>HDDs offer the best capacity/cost ratio for sequential data</td></tr></table><h3>Container files</h3><p>On the HDD, the Biziod does not write one file per object (which would be catastrophic for the filesystem). Instead it uses <strong>fixed-size container files</strong> (pre-allocated):</p><ul><li>Each container is a large pre-allocated file on the HDD (e.g. 1 GB or more)</li><li>Objects are written sequentially into these containers (append-only)</li><li>The SSD index points to the exact position (container + offset) of each object</li><li>Pre-allocation eliminates fragmentation and repeated <code>fallocate</code> system calls</li><li>When an object is deleted, its position is marked free in the index — the Garbage Collector then recycles that space</li></ul><h3>Benefits of the Biziod architecture</h3><ul><li><strong>Fault isolation</strong>: a failed HDD only affects its own Biziod. The other Biziod instances on the same server continue operating.</li><li><strong>Internal scalability</strong>: adding disks = adding Biziod instances = increasing capacity and I/O parallelism</li><li><strong>Predictability</strong>: pre-allocated containers guarantee stable I/O performance without fragmentation</li></ul><h2>Layer 4 — Physical Storage</h2><p>The physical layer distinguishes two complementary roles:</p><ul><li><strong>SSD (Solid State Drive)</strong>: exclusively for Biziod indexes. Each HDD on the server has an associated SSD. The absolute rule: <em>never put the index on HDD, never put data on SSD</em>.</li><li><strong>HDD (Hard Disk Drive)</strong>: holds the container files. The raw capacity of the RING is the sum of all HDDs across all servers in the cluster.</li></ul><div class="alert alert-w">Warning: if an index SSD fails (without losing the associated data HDD), data is not lost but the index must be rebuilt. This operation can take several hours. Always use SSDs in RAID1 or monitor their health via S.M.A.R.T.</div><h2>The Peer-to-Peer Protocol — Detailed Operation</h2><p>The RING has <strong>no central coordinator</strong>. Here is how a GET request is processed:</p><ol><li>The Connector computes <code>hash(object_key)</code> and sends the GET request to any Bizstorenode in the cluster.</li><li>That Bizstorenode consults its <strong>local P2P routing table</strong> to determine whether the key belongs to its segment or to another node.</li><li>If it is not its segment, it <strong>routes the request to the responsible node</strong> (in O(log N) hops).</li><li>The responsible node identifies the target Biziod instances (COS replication or ARC fragments).</li><li>The Biziod instances consult their SSD index, read the data from the HDD container, and respond.</li><li>The response travels back up to the Connector, which returns it to the client.</li></ol><p>This coordinator-free model eliminates the bottleneck typical of master/slave architectures and enables theoretically linear scalability.</p><h2>Reference Configuration: 3-Server RING</h2><p>A minimal production RING cluster has <strong>3 servers</strong>. The following redundancy parameters apply in this configuration:</p><table><tr><th>Data type</th><th>Mechanism</th><th>Count</th><th>Tolerance</th></tr><tr><td>Large objects (data)</td><td>ARC 7+5</td><td>12 fragments across 3 servers</td><td>Loss of any 5 fragments</td></tr><tr><td>Small objects (data)</td><td>COS 3</td><td>3 full copies</td><td>Loss of 1 complete server</td></tr><tr><td>SOFS metadata</td><td>COS 4+</td><td>4 copies minimum</td><td>Loss of 1 complete server</td></tr><tr><td>S3 metadata</td><td>COS 5</td><td>5 copies</td><td>Majority quorum</td></tr></table><div class="alert alert-d">Absolute rule on a 3-server RING: never have 2 servers failing simultaneously. With only 1 server available, the S3 metadata quorum (COS 5) can no longer be guaranteed and write operations will be blocked.</div><h2>Scalability — Adding Servers</h2><p>The RING is designed for linear growth. When a server is added:</p><ol><li>6 new Bizstorenode instances are declared and join the cluster (nodeJoin).</li><li>These new nodes receive keyspace segments from existing nodes (Relocation).</li><li>The corresponding objects are migrated automatically in the background (Balance).</li><li>Total capacity and I/O parallelism increase linearly.</li></ol><p>There is no theoretical limit to the number of servers. Scality production clusters can reach several hundred nodes.</p><h2>RING Keyspace — Data Distribution</h2><p>The <strong>keyspace</strong> defines how object keys are distributed across the RING nodes via the Chord protocol. It is the map that indicates which Bizstorenode owns each key.</p><h3>Keyspace files</h3><table><tr><th>File</th><th>Role</th></tr><tr><td><code>keyspace.json</code></td><td>Actual keyspace configuration: distribution of key segments among Bizstorenode instances. Generated by the Scality ExVT tool.</td></tr><tr><td><code>sprov_context.json</code></td><td>Provisioning context: cluster configuration (number of servers, disks, ARC/COS protection).</td></tr><tr><td><code>sprov_model.json</code></td><td>Provisioning model: parameters for computing the optimal keyspace for the hardware configuration.</td></tr></table><h3>Pre-calculated vs custom keyspace</h3><p>Scality provides <strong>pre-calculated keyspaces</strong> for standard configurations (e.g. 6 servers across 2 sites, 12 servers across 3 sites). If the configuration is non-standard (unusual number of servers, specific diskgroups), a <strong>custom keyspace</strong> must be calculated by the Scality ExVT team and applied manually after installation.</p><pre># Apply a custom keyspace after installation\nringsh supervisor nodeJoinAll DATA   # join all nodes to the DATA RING\nringsh supervisor nodeJoinAll META   # join all nodes to the META RING\n\n# Verify via the RING Administration Interface dashboard\n# Operations -> Ring Status -> all nodes IN_SERVICE</pre><p class="alert-i">The keyspace directly impacts data distribution and performance. A poorly configured keyspace can create hot spots (overloading certain nodes). The Scality ExVT team validates and computes keyspaces to guarantee optimal distribution.</p><div class="kbox"><h3>Key Takeaways</h3><ul><li>4 distinct layers: Connectors -> Bizstorenode -> Biziod -> Physical disks</li><li>6 Bizstorenode per physical server: each owns a segment of the P2P keyspace</li><li>1 Biziod per physical disk: index on SSD, data in pre-allocated containers on HDD</li><li>Distributed P2P routing by hash: no SPOF, O(log N) hops maximum</li><li>3-server RING: ARC 7+5 (data), COS 3 (small objects), COS 4+ (SOFS metadata), COS 5 (S3 metadata)</li><li>Linear scalability: add servers without service interruption</li></ul></div>',
quiz_en:[
  {q:"How many Bizstorenode instances are deployed on each physical RING server?",opts:["3","4","6","12"],ans:2,expl:"There are exactly 6 Bizstorenode instances per physical server. Each holds a partition of the global keyspace."},
  {q:"Where does the Biziod store the object index for optimal performance?",opts:["HDD (high capacity)","SSD (fast access)","RAM (volatile)","External database"],ans:1,expl:"The index is on SSD for fast lookups. The data itself is on HDD in fixed-size container files."},
  {q:"On a 3-server RING, how many replicas are used for S3 metadata?",opts:["3","4","5","7"],ans:2,expl:"S3 metadata uses 5 COS replicas for high availability and quorum resilience."},
  {q:"What protocol does the RING use for distributed routing between nodes?",opts:["HTTP/REST","Direct TCP","Peer-to-Peer (P2P)","gRPC"],ans:2,expl:"The RING uses a P2P protocol. The key hash determines the responsible nodes, with no central coordinator."},
  {q:"Which layer exposes access protocols to applications (S3, NFS, SMB...)?",opts:["Biziod","Bizstorenode","Connectors","MESA"],ans:2,expl:"The Connectors are the topmost layer. They expose S3, sproxyd, NFS, SMB, FUSE, and CDMI to client applications."},
  {q:"What are the 3 files that make up the keyspace of a Scality RING?",opts:["keyspace.json, partition.json, ring.json","keyspace.json, sprov_context.json, sprov_model.json","keyspace.cfg, nodes.json, meta.json","ring.conf, keyspace.map, chord.json"],ans:1,expl:"The RING keyspace is defined by: keyspace.json (Chord partition structure), sprov_context.json (deployment context), sprov_model.json (replication model)."},
  {q:"What is the role of RING META compared to RING DATA?",opts:["RING META stores raw data, RING DATA stores metadata","RING META manages metadata and indexes, RING DATA stores objects","They are two names for the same ring","RING META is a backup of RING DATA"],ans:1,expl:"The RING is logically divided: META for metadata/indexes (MESA, Chord), DATA for object blobs. Both are independent Chord rings."},
  {q:"Why does the RING have no central coordinator for request routing?",opts:["For licensing cost reasons","To eliminate the single point of failure and scale horizontally","Because HTTP does not support coordinators","For security reasons only"],ans:1,expl:"A central coordinator would be a SPOF (Single Point of Failure) and a bottleneck. With P2P, every node can route to the correct destination via the Chord hash, ensuring scalability and resilience."},
  {q:"What happens if a Bizstorenode fails while its neighbor is already OOS?",opts:["The ring continues normally because other nodes take over","Protection may be degraded depending on the COS: if the number of surviving fragments drops below the reconstruction threshold, some data may become unrecoverable","The ring automatically pauses","All nodes go OOS"],ans:1,expl:"RING resilience depends on the COS and the ARC or replication scheme. If too many fragments/replicas are lost simultaneously (exceeding the COS tolerance), some objects may become inaccessible or unrecoverable."},
  {q:"What is the role of the Chord algorithm in the RING?",opts:["Encrypt data at rest","Compute which node(s) are responsible for a given key via a circular address space","Compress data before storage","Manage node authentication"],ans:1,expl:"Chord is the RING DHT (Distributed Hash Table) algorithm. It maps each object key to a point in a circular space and deterministically identifies which nodes are responsible for it, without a central directory."}
]},
{id:'02',num:'02',title:'Stockage : ARC et COS',desc:'Erasure coding ARC, réplication COS, seuils et durabilité',
content:'<h2>Pourquoi deux mécanismes de stockage ?</h2><p>Le RING n\'utilisé pas une stratégie unique de protection des données. Il choisit automatiquement le mécanisme le plus adapte selon la <strong>taille de l\'objet</strong> :</p><ul><li>La <strong>réplication (COS)</strong> est simple, rapide a lire, mais coûteuse en espace disque : stocker 1 objet en COS 3 consomme 3x son volume.</li><li>L\'<strong>erasure coding (ARC)</strong> est plus economique en espace pour les gros objets, au prix d\'une complexité de calcul supplémentaire (encodage/decodage).</li></ul><p>Un <strong>seuil de taille configurable</strong> séparé les deux zones : en dessous du seuil -> COS, au dessus -> ARC. Typiquement ce seuil est entre 1 et 10 MB selon le profil de charge.</p><h2>COS — Chain of Servers (Réplication)</h2><p>COS signifie <strong>Chain of Servers</strong>. L\'objet est stocké en copie intégrale sur N Bizstorenode distincts, chacun sur un serveur physique différent.</p><h3>Écriture COS (ex : COS 3)</h3><ol><li>Le Connector envoie l\'objet au Bizstorenode responsable de la clé (node "primaire").</li><li>Le node primaire écrit l\'objet dans son Biziod local.</li><li>Il <strong>relaie en parallèle</strong> l\'objet aux 2 nodes "secondaires" de la chaine.</li><li>Chaque node secondaire confirme l\'écriture.</li><li>Quand les 3 écritures sont confirmées, le PUT retourne succes au client.</li></ol><h3>Lecture COS</h3><p>La lecture peut se faire depuis <strong>n\'importe lequel des N nodes</strong> qui possèdent une copie. Le RING choisit le node le plus disponible (load balancing). En cas de panne d\'un node, les autres servent automatiquement les lectures sans intervention.</p><h3>Usages de COS dans le RING</h3><table><tr><th>Usage</th><th>Facteur COS</th><th>Justification</th></tr><tr><td>Petits objets (data)</td><td>COS 3</td><td>Accès rapide, réplication simple sur 3 serveurs</td></tr><tr><td>Métadonnées SOFS</td><td>COS 4+</td><td>Criticité haute : les métadonnées SOFS pilotent tout le filesystem</td></tr><tr><td>Métadonnées S3</td><td>COS 5</td><td>Résilience maximale du quorum : 5 copies pour le calcul de majorite</td></tr></table><h2>ARC — Adaptive Reed-Solomon Coding (Erasure Coding)</h2><p>ARC est une implémentation d\'<strong>erasure coding bas sur les codes de Reed-Solomon</strong>. C\'est la même technologie utilisée dans les CD/DVD pour corriger les erreurs de lecture. Appliquee au stockage distribué, elle permet de reconstituer des données manquantes a partir de fragments partiels.</p><h3>Principe mathematique</h3><p>Un objet est <strong>découpé en K fragments de données</strong> et <strong>M fragments de parite</strong> sont calcules mathematiquement :</p><div class="adiag">Objet original (100 MB) avec ARC 7+5 :\n\nDecoupage en 7 fragments de données égaux :\n  [D1: 14.3MB] [D2: 14.3MB] [D3: 14.3MB] [D4: 14.3MB]\n  [D5: 14.3MB] [D6: 14.3MB] [D7: 14.3MB]\n\nCalcul de 5 fragments de parite (Reed-Solomon) :\n  [P1: 14.3MB] [P2: 14.3MB] [P3: 14.3MB] [P4: 14.3MB] [P5: 14.3MB]\n\nTotal stocké : 12 x 14.3 MB = 171.4 MB (vs 300 MB en COS 3)\nRatio d\'efficacité : 100/171.4 = 58%\n\nPour reconstruire : n\'importe quels 7 fragments sur 12 suffisent.</div><h3>Écriture ARC</h3><ol><li>Le Bizstorenode reçoit l\'objet et l\'encode : calcul des K+M fragments.</li><li>Les K+M fragments sont distribués sur K+M Biziod distincts (max 1 par serveur physique dans un cluster bien dimensionne).</li><li>Chaque Biziod écrit son fragment dans son container HDD.</li><li>Quand tous les fragments sont confirmes, le PUT retourne succes.</li></ol><h3>Lecture ARC</h3><p>Le Bizstorenode récupère au minimum K fragments parmi les K+M disponibles et recalcule l\'objet original par decodage Reed-Solomon. Si certains fragments sont sur des nœuds lents ou indisponibles, le RING peut récupérer K fragments depuis les nœuds les plus rapides.</p><h3>Reconstruction (Rebuild)</h3><p>Si M fragments ou moins sont perdus (panne de disque, panne de serveur), le RING peut <strong>reconstruire automatiquement les fragments manquants</strong> en tâche de fond (tâche Rebuild) :</p><ol><li>Détection : le RING détecte que des fragments sont manquants.</li><li>Récupération : lecture des K fragments restants.</li><li>Decodage : reconstruction de l\'objet original en mémoire.</li><li>Re-encodage : calcul des fragments manquants.</li><li>Écriture : les fragments reconstruits sont écrits sur des Biziod de remplacement.</li></ol><div class="alert alert-d">Si plus de M fragments (ici 5) sont perdus simultanément, l\'objet est irrécupérable. C\'est l\'état ARC_REBUILD_NOK. Sur un RING 3 serveurs, 5 fragments peuvent être distribués sur 1 serveur complet -> la perte de 1 serveur entier est tolérée en ARC 7+5.</div><h2>Comparaison COS vs ARC</h2><table><tr><th>Critere</th><th>COS 3</th><th>ARC 7+5</th></tr><tr><td>Overhead espace</td><td>200% (3x le volume)</td><td>71% (1.71x le volume)</td></tr><tr><td>Tolérance pannes</td><td>1 serveur complet</td><td>5 fragments quelconques</td></tr><tr><td>Latence lecture</td><td>Très faible (copie directe)</td><td>Faible (decode si fragment manquant)</td></tr><tr><td>Latence écriture</td><td>Faible (réplication parallèle)</td><td>Modérée (encodage + 12 écritures)</td></tr><tr><td>Usage optimal</td><td>Petits objets, métadonnées</td><td>Gros objets (video, backup, archives)</td></tr><tr><td>CPU</td><td>Minimal</td><td>Encodage/decodage Reed-Solomon</td></tr></table><h2>Le Seuil de Taille (Threshold)</h2><p>La decision COS/ARC est prise automatiquement par le RING selon un seuil configurable :</p><ul><li>Objets <strong>en dessous du seuil</strong> : stored as COS (réplication intégrale)</li><li>Objets <strong>au dessus du seuil</strong> : stored as ARC (erasure coding)</li><li>Le seuil est configuré au niveau du RING et s\'applique globalement</li><li>Valeur typique : entre 1 MB et 10 MB selon le profil applicatif</li></ul><div class="alert alert-i">Un seuil bas (ex: 1 MB) protège les performances de lecture des petits objets mais augmente l\'overhead espace. Un seuil haut (ex: 10 MB) maximise l\'efficacité disque mais soumet plus d\'objets aux latences d\'encodage ARC.</div><div class="kbox"><h3>Points Clés a Retenir</h3><ul><li>COS = réplication intégrale sur N serveurs : simple, rapide, mais espace x N</li><li>ARC = erasure coding K+M : efficacité 58% (7+5), tolere la perte de M fragments</li><li>ARC 7+5 : 12 fragments, n\'importe quels 7 sur 12 reconstituent l\'objet</li><li>COS pour petits objets et métadonnées ; ARC pour grands objets</li><li>Seuil configurable : en dessous -> COS, au dessus -> ARC</li><li>ARC_REBUILD_NOK = plus de M fragments perdus = perte de données irrécupérable</li></ul></div>',
quiz:[
  {q:"Que signifie ARC dans le contexte Scality ?",opts:["Advanced Réplication Cluster","Adaptive Ring Coding","Automatic Redundancy Check","Archive Ring Copy"],ans:1,expl:"ARC = Adaptive Ring Coding. C'est le schéma d'erasure coding propriétaire de Scality, distribué les fragments sur plusieurs nœuds selon le COS."},
  {q:"Qu'est-ce qu'un COS dans Scality RING ?",opts:["Class of Service : règle de protection (répliques, ARC, domaines)","Certificate of Storage : document de certification","Cost of Storage : coût par Go","Chain of Service : séquence de traitement"],ans:0,expl:"COS = Class of Service. Définit comment les données sont protégées : nombre de répliques ou schéma ARC, et les failure domains utilisés."},
  {q:"Quel est l'avantage principal de l'erasure coding ARC vs la réplication classique ?",opts:["Accès plus rapide aux données","Meilleure efficacité du stockage (moins d'overhead)","Chiffrement automatique","Déduplication des données"],ans:1,expl:"ARC nécessite moins d'espace que la réplication N×. Ex: ARC 8+4 consomme 1.5× la taille originale vs 3× pour 3 répliques, avec une tolérance aux pannes équivalente."},
  {q:"Qu'est-ce qu'un Failure Domain dans le contexte ARC ?",opts:["Un disque défaillant","Une unité de panne indépendante (nœud, rack, DC) pour la distribution des fragments","Un seuil d'alarme Prometheus","Un COS dégradé"],ans:1,expl:"Le Failure Domain définit l'unité de panne. ARC garantit que les fragments d'un même objet sont sur des domaines distincts, assurant la survie même en cas de panne complète d'un domaine."},
  {q:"Dans un schéma ARC 8+4, combien de fragments peuvent être perdus sans perte de données ?",opts:["2","4","8","6"],ans:1,expl:"Dans ARC 8+4, on génère 4 fragments de parité pour 8 fragments de données, soit 12 fragments au total. On peut perdre jusqu'à 4 fragments (le nombre de fragments de parité) sans perte de données."},
  {q:"Pourquoi ne pas utiliser systématiquement ARC au lieu de la réplication pour tous les objets ?",opts:["ARC est plus coûteux en licences","ARC a un coût CPU pour l'encodage/décodage et une latence plus élevée, défavorable pour les petits objets ou les accès très fréquents","La réplication supporte plus de failure domains","ARC n'est pas supporté sur les petits clusters"],ans:1,expl:"L'erasure coding nécessite un calcul d'encodage à l'écriture et de décodage à la lecture (si fragments manquants). Pour les petits objets ou les accès intensifs, la réplication simple offre de meilleures performances."},
  {q:"Qu'arrive-t-il à un objet ARC quand un nœud tombe et que le rebuild n'a pas encore eu lieu ?",opts:["L'objet est immédiatement inaccessible","L'objet reste accessible tant que le nombre de fragments survivants est suffisant pour reconstruire les données originales","L'objet est copié sur un nœud de secours avant la panne","L'accès est redirigé vers le site DR"],ans:1,expl:"Avec ARC 8+4 par exemple, l'objet reste lisible avec seulement 8 fragments parmi les 12. Le système reconstruit à la volée les données manquantes depuis les fragments survivants, de manière transparente pour le client."},
  {q:"Comment le COS influence-t-il la décision de placement des fragments ARC sur les nœuds ?",opts:["Le COS ne concerne que la réplication, pas ARC","Le COS définit le nombre de failure domains requis, garantissant que chaque fragment est sur un domaine de panne distinct","Le placement est aléatoire quels que soient les paramètres COS","Le COS indique uniquement la taille maximale des objets"],ans:1,expl:"Le COS spécifie les failure domains (nœud, rack, datacenter). Le ring s'assuré que chaque fragment ARC est placé dans un failure domain différent, de sorte que la perte d'un domaine entier ne perde qu'un seul fragment."}
],
title_en:'Storage: ARC and COS',
desc_en:'ARC erasure coding, COS replication, thresholds and durability',
content_en:'<h2>Why two storage mechanisms?</h2><p>The RING does not use a single data protection strategy. It automatically selects the most appropriate mechanism based on <strong>object size</strong>:</p><ul><li><strong>Replication (COS)</strong> is simple and fast to read, but costly in disk space: storing 1 object with COS 3 consumes 3 times its volume.</li><li><strong>Erasure coding (ARC)</strong> is more space-efficient for large objects, at the cost of additional computational complexity (encoding/decoding).</li></ul><p>A <strong>configurable size threshold</strong> separates the two zones: below the threshold -> COS, above -> ARC. Typically this threshold is between 1 and 10 MB depending on the workload profile.</p><h2>COS — Chain of Servers (Replication)</h2><p>COS stands for <strong>Chain of Servers</strong>. The object is stored as a full copy on N distinct Bizstorenode instances, each on a different physical server.</p><h3>COS write (e.g. COS 3)</h3><ol><li>The Connector sends the object to the Bizstorenode responsible for the key (the primary node).</li><li>The primary node writes the object to its local Biziod.</li><li>It <strong>relays in parallel</strong> the object to the 2 secondary nodes in the chain.</li><li>Each secondary node confirms the write.</li><li>Once all 3 writes are confirmed, the PUT returns success to the client.</li></ol><h3>COS read</h3><p>A read can be served from <strong>any of the N nodes</strong> that hold a copy. The RING selects the most available node (load balancing). If a node fails, the others automatically serve reads without any intervention.</p><h3>COS usage in the RING</h3><table><tr><th>Usage</th><th>COS factor</th><th>Justification</th></tr><tr><td>Small objects (data)</td><td>COS 3</td><td>Fast access, simple replication across 3 servers</td></tr><tr><td>SOFS metadata</td><td>COS 4+</td><td>High criticality: SOFS metadata drives the entire filesystem</td></tr><tr><td>S3 metadata</td><td>COS 5</td><td>Maximum quorum resilience: 5 copies for majority calculation</td></tr></table><h2>ARC — Adaptive Reed-Solomon Coding (Erasure Coding)</h2><p>ARC is an implementation of <strong>erasure coding based on Reed-Solomon codes</strong>. It is the same technology used in CDs/DVDs to correct read errors. Applied to distributed storage, it allows missing data to be reconstructed from partial fragments.</p><h3>Mathematical principle</h3><p>An object is <strong>split into K data fragments</strong> and <strong>M parity fragments</strong> are computed mathematically:</p><div class="adiag">Original object (100 MB) with ARC 7+5:\n\nSplit into 7 equal data fragments:\n  [D1: 14.3MB] [D2: 14.3MB] [D3: 14.3MB] [D4: 14.3MB]\n  [D5: 14.3MB] [D6: 14.3MB] [D7: 14.3MB]\n\nCompute 5 parity fragments (Reed-Solomon):\n  [P1: 14.3MB] [P2: 14.3MB] [P3: 14.3MB] [P4: 14.3MB] [P5: 14.3MB]\n\nTotal stored: 12 x 14.3 MB = 171.4 MB (vs 300 MB with COS 3)\nStorage efficiency ratio: 100/171.4 = 58%\n\nTo reconstruct: any 7 fragments out of 12 are sufficient.</div><h3>ARC write</h3><ol><li>The Bizstorenode receives the object and encodes it: computes the K+M fragments.</li><li>The K+M fragments are distributed across K+M distinct Biziod instances (at most 1 per physical server in a properly sized cluster).</li><li>Each Biziod writes its fragment to its HDD container.</li><li>Once all fragments are confirmed, the PUT returns success.</li></ol><h3>ARC read</h3><p>The Bizstorenode retrieves at least K fragments out of the K+M available and reconstructs the original object by Reed-Solomon decoding. If some fragments are on slow or unavailable nodes, the RING can retrieve K fragments from the fastest nodes.</p><h3>Reconstruction (Rebuild)</h3><p>If M fragments or fewer are lost (disk failure, server failure), the RING can <strong>automatically rebuild the missing fragments</strong> as a background task (Rebuild task):</p><ol><li>Detection: the RING detects that fragments are missing.</li><li>Recovery: reads the remaining K fragments.</li><li>Decoding: reconstructs the original object in memory.</li><li>Re-encoding: computes the missing fragments.</li><li>Write: the reconstructed fragments are written to replacement Biziod instances.</li></ol><div class="alert alert-d">If more than M fragments (here 5) are lost simultaneously, the object is unrecoverable. This is the ARC_REBUILD_NOK state. On a 3-server RING, 5 fragments may be distributed across 1 complete server -> the loss of an entire server is tolerated with ARC 7+5.</div><h2>COS vs ARC Comparison</h2><table><tr><th>Criterion</th><th>COS 3</th><th>ARC 7+5</th></tr><tr><td>Space overhead</td><td>200% (3x the volume)</td><td>71% (1.71x the volume)</td></tr><tr><td>Fault tolerance</td><td>1 complete server</td><td>Any 5 fragments</td></tr><tr><td>Read latency</td><td>Very low (direct copy)</td><td>Low (decode only if fragment missing)</td></tr><tr><td>Write latency</td><td>Low (parallel replication)</td><td>Moderate (encoding + 12 writes)</td></tr><tr><td>Optimal usage</td><td>Small objects, metadata</td><td>Large objects (video, backup, archives)</td></tr><tr><td>CPU</td><td>Minimal</td><td>Reed-Solomon encoding/decoding</td></tr></table><h2>The Size Threshold</h2><p>The COS/ARC decision is made automatically by the RING based on a configurable threshold:</p><ul><li>Objects <strong>below the threshold</strong>: stored as COS (full replication)</li><li>Objects <strong>above the threshold</strong>: stored as ARC (erasure coding)</li><li>The threshold is configured at the RING level and applies globally</li><li>Typical value: between 1 MB and 10 MB depending on the application profile</li></ul><div class="alert alert-i">A low threshold (e.g. 1 MB) protects the read performance of small objects but increases space overhead. A high threshold (e.g. 10 MB) maximizes disk efficiency but subjects more objects to ARC encoding latency.</div><div class="kbox"><h3>Key Takeaways</h3><ul><li>COS = full replication on N servers: simple, fast, but N times the space</li><li>ARC = erasure coding K+M: 58% efficiency (7+5), tolerates loss of M fragments</li><li>ARC 7+5: 12 fragments, any 7 out of 12 reconstruct the object</li><li>COS for small objects and metadata; ARC for large objects</li><li>Configurable threshold: below -> COS, above -> ARC</li><li>ARC_REBUILD_NOK = more than M fragments lost = unrecoverable data loss</li></ul></div>',
quiz_en:[
  {q:"What does ARC stand for in the Scality context?",opts:["Advanced Replication Cluster","Adaptive Ring Coding","Automatic Redundancy Check","Archive Ring Copy"],ans:1,expl:"ARC = Adaptive Ring Coding. It is Scality proprietary erasure coding scheme, distributing fragments across multiple nodes according to the COS."},
  {q:"What is a COS in Scality RING?",opts:["Class of Service: protection rule (replicas, ARC, domains)","Certificate of Storage: certification document","Cost of Storage: cost per GB","Chain of Service: processing sequence"],ans:0,expl:"COS = Class of Service. Defines how data is protected: number of replicas or ARC scheme, and the failure domains used."},
  {q:"What is the main advantage of ARC erasure coding over classic replication?",opts:["Faster data access","Better storage efficiency (less overhead)","Automatic encryption","Data deduplication"],ans:1,expl:"ARC requires less space than N-way replication. E.g. ARC 8+4 consumes 1.5x the original size vs 3x for 3 replicas, with equivalent fault tolerance."},
  {q:"What is a Failure Domain in the ARC context?",opts:["A failed disk","An independent failure unit (node, rack, DC) for fragment distribution","A Prometheus alert threshold","A degraded COS"],ans:1,expl:"The Failure Domain defines the unit of failure. ARC guarantees that fragments of the same object are placed on distinct domains, ensuring survival even in the event of a complete domain failure."},
  {q:"In an ARC 8+4 scheme, how many fragments can be lost without data loss?",opts:["2","4","8","6"],ans:1,expl:"In ARC 8+4, 4 parity fragments are generated for 8 data fragments, totaling 12 fragments. Up to 4 fragments (the number of parity fragments) can be lost without data loss."},
  {q:"Why not use ARC instead of replication for all objects?",opts:["ARC is more expensive in licensing","ARC has a CPU cost for encoding/decoding and higher latency, which is unfavorable for small objects or very frequent access","Replication supports more failure domains","ARC is not supported on small clusters"],ans:1,expl:"Erasure coding requires encoding computation on write and decoding on read (if fragments are missing). For small objects or intensive access patterns, simple replication offers better performance."},
  {q:"What happens to an ARC object when a node fails and the rebuild has not yet occurred?",opts:["The object is immediately inaccessible","The object remains accessible as long as the number of surviving fragments is sufficient to reconstruct the original data","The object is copied to a standby node before the failure","Access is redirected to the DR site"],ans:1,expl:"With ARC 8+4 for example, the object remains readable with just 8 of the 12 fragments. The system reconstructs the missing data on the fly from the surviving fragments, transparently to the client."},
  {q:"How does the COS influence ARC fragment placement decisions across nodes?",opts:["COS only applies to replication, not ARC","The COS defines the required number of failure domains, ensuring each fragment is placed in a distinct failure domain","Placement is random regardless of COS parameters","The COS only indicates the maximum object size"],ans:1,expl:"The COS specifies failure domains (node, rack, datacenter). The ring ensures each ARC fragment is placed in a different failure domain, so that the loss of an entire domain loses only a single fragment."}
]},
{id:'03',num:'03',title:'MESA et Métadonnées',desc:'Base NoSQL interne MESA, Failure Domains, index S3',
content:'<h2>MESA — La Base NoSQL Interne du RING</h2><p><strong>MESA</strong> est l\'acronyme de la base de données NoSQL interne, entièrement distribuée dans le RING. Contrairement aux solutions qui dependent d\'une base externe (ZooKeeper, etcd, Cassandra...), MESA est <strong>nativement intégrée</strong> dans les Bizstorenode et utilisé le même protocole P2P de routage que le reste du RING.</p><h3>Rôle de MESA</h3><p>MESA joue le rôle d\'<strong>index global des objets</strong>. Quand un objet est écrit dans le RING :</p><ol><li>Le Bizstorenode crée une entrée MESA contenant : la clé de l\'objet, sa taille, son type (COS ou ARC), les emplacements physiques de ses répliques/fragments (serveur + disque + offset), et ses métadonnées applicatives (Content-Type, tags, etc.).</li><li>Cette entrée est elle-même stockée en COS sur plusieurs Bizstorenode (redondance des métadonnées internes).</li><li>Lors d\'un GET, le RING retrouve d\'abord l\'entrée MESA pour connaitre l\'emplacement des données, puis les lit directement.</li></ol><h3>Architecture MESA</h3><div class="adiag">Écriture objet "monimage.jpg" :\n\n1. PUT(monimage.jpg) arrive sur Bizstorenode-A\n2. Bizstorenode-A calcule hash("monimage.jpg") -> 0xA3F2...\n3. Écrit les données ARC sur les Biziod cibles\n4. Crée une entrée MESA :\n   {\n     key:      "monimage.jpg",\n     size:     5200000,\n     type:     "ARC 7+5",\n     fragments:[ {srv:1,disk:3,offset:0x1A4000},\n                 {srv:2,disk:1,offset:0x2C8000}, ... ]\n   }\n5. L\'entrée MESA est elle-même stockée en COS sur 3 Bizstorenode</div><h3>Distribution et consistance de MESA</h3><ul><li>Les entrées MESA sont distribuées sur tous les Bizstorenode, en suivant le même partitionnement P2P que les données.</li><li>MESA utilisé un modèle de <strong>consistance éventuelle</strong> : les lectures peuvent temporairement retourner des versions legèrement antérieures, mais la cohérence est garantie a terme.</li><li>Le Garbage Collector s\'appuie sur MESA pour identifier les chunks orphelins (écrits sur disque mais dont l\'entrée MESA a ete supprimée).</li></ul><h2>RING DATA vs RING META — Architecture S3</h2><p>Pour le connector S3, Scality utilisé une architecture a <strong>deux RINGs distincts</strong> :</p><div class="adiag">+-------------------+        +-------------------+\n|   RING DATA       |        |   RING META       |\n|                   |        |                   |\n|  Objets S3        |        |  Métadonnées S3   |\n|  (contenu brut)   |        |  (buckets, ACL,   |\n|  ARC ou COS       |        |   tags, version)  |\n|                   |        |  COS 5 répliques  |\n+-------------------+        +-------------------+\n         ^                            ^\n         |                            |\n         +----------+  +--------------+\n                    |  |\n              Cloudserver (S3 API)\n                    |\n               Client S3</div><p>Cette séparation offre plusieurs avantages :</p><ul><li><strong>Scalabilité indépendante</strong> : on peut augmenter RING META sans toucher RING DATA et inversement.</li><li><strong>Protection renforcée des métadonnées</strong> : COS 5 pour les métadonnées S3 (vs COS 3 pour les données) car les métadonnées sont le catalogue de référence — les perdre serait pire que perdre les données elles-mêmes.</li><li><strong>Performance</strong> : le RING META peut être configuré avec des disques plus rapides car les métadonnées sont de petits objets fréquemment accedes.</li></ul><h2>Failure Domains — Zones de Défaillance</h2><p>Un <strong>Failure Domain</strong> (ou Zone) est un groupe de serveurs susceptibles de tomber simultanément pour une raison commune : même rack (même alimentation, même switch), même salle, même datacenter. La configuration des Failure Domains informe le RING de la topologie physique pour placer les répliques de façon optimale.</p><h3>Règles de placement</h3><p>Le RING s\'assuré que les répliques d\'un même objet sont <strong>placées dans des Failure Domains distincts</strong> :</p><div class="adiag">Exemple : COS 5 avec 3 Failure Domains (A, B, C)\n\nObjet X -> 5 répliques réparties :\n  Réplique 1 -> Zone A (serveur 1)\n  Réplique 2 -> Zone A (serveur 2)\n  Réplique 3 -> Zone B (serveur 3)\n  Réplique 4 -> Zone B (serveur 4)\n  Réplique 5 -> Zone C (serveur 5)\n\nPanne Zone A complete -> 3 répliques encore disponibles\n                      -> Quorum S3 (3/5) maintenu\n                      -> Service intact</div><h3>Configuration minimale</h3><ul><li>RING 3 serveurs : 3 zones indépendantes (1 serveur = 1 zone) est le minimum recommande.</li><li>La perte d\'une zone entière doit laisser assez de répliques pour maintenir le quorum.</li><li>Pour COS 5 : quorum = 3 répliques minimum -> on peut perdre 2 répliques (donc une zone de 2 serveurs max).</li></ul><div class="alert alert-w">Si les serveurs ne sont pas affectes a des Failure Domains distincts, le RING peut placer plusieurs répliques du même objet sur des serveurs du même rack. La panne du rack perd alors toutes ces répliques simultanément -> risque de perte de données.</div><h2>XDM — Extended Data Management (S3 Connector)</h2><p>XDM est la couche logicielle qui constitue le <strong>S3 Connector complet</strong>. Elle regroupé plusieurs services interdependants :</p><table><tr><th>Composant</th><th>Rôle</th><th>Technologie</th></tr><tr><td><strong>Cloudserver</strong></td><td>Expose l\'API S3 compatible AWS. Traduit les requêtes S3 en opérations RING DATA + RING META.</td><td>Node.js</td></tr><tr><td><strong>MongoDB</strong></td><td>Stocké les métadonnées S3 structurées (liste des buckets, ACL, tags, versions). C\'est la base de données persistante du S3 Connector.</td><td>MongoDB ReplicaSet</td></tr><tr><td><strong>Redis-Sentinel</strong></td><td>Cache distribué pour les métadonnées chaudes (lookups fréquents). HA assuré par Sentinel. Accelere les LIST et GET sur les métadonnées.</td><td>Redis + Sentinel</td></tr><tr><td><strong>Backbeat</strong></td><td>Gère les workflows asynchrones S3 : Cross-Region Réplication (CRR), Object Lifecycle, Ingestion depuis sources externes.</td><td>Node.js, Kafka</td></tr><tr><td><strong>Prometheus</strong></td><td>Collecte et stocké les metriques du S3 Connector pour le monitoring Grafana.</td><td>Prometheus TSDB</td></tr></table><h3>Cross-Region Réplication (CRR) via Backbeat</h3><p>Le CRR permet de répliquer automatiquement les objets S3 vers un ou plusieurs clusters distants :</p><ul><li>La réplication est <strong>asynchrone</strong> : l\'écriture sur le cluster source reussit immédiatement, la réplication vers la cible se fait en arrière-plan.</li><li>Backbeat maintient une <strong>queue de réplication</strong> (Kafka) : si le cluster cible est temporairement indisponible, les objets sont répliques des que la connectivité est rétablie.</li><li>Le statut de réplication de chaque objet est suivi via un flag de métadonnée (<code>x-amz-replication-status</code>).</li><li>Attention : si on upgrade depuis une version &lt; 9.5.2.0 avec CRR actif, une <strong>procédure de pre-upgrade CRR obligatoire</strong> doit être exécutée avant l\'upgrade.</li></ul><div class="kbox"><h3>Points Clés a Retenir</h3><ul><li>MESA = index interne distribué : clé -> localisation physique des données</li><li>Separations RING DATA (objets) / RING META (métadonnées S3, COS 5)</li><li>Failure Domains : placement des répliques dans des zones distinctes (anti-correlation de pannes)</li><li>XDM = Cloudserver + MongoDB + Redis-Sentinel + Backbeat + Prometheus</li><li>CRR (Backbeat) = réplication asynchrone inter-clusters via queue Kafka</li><li>MongoDB = source de verite des métadonnées S3 (Redis = cache)</li></ul></div><h2>repd et Raft Sessions — Le Service de Métadonnées Stateful</h2><p>Le S3 Connector ne stocké pas ses métadonnées dans MongoDB uniquement. Il dispose d\'un service de métadonnées <strong>stateful fortement consistant</strong> base sur le protocole de consensus <strong>Raft</strong>. Ce service est expose via le daemon <code>repd</code>.</p><h3>repd — Réplication Daemon</h3><p><code>repd</code> est le daemon qui expose l\'API du service de métadonnées S3. Il gère les lectures et écritures sur les métadonnées de buckets et d\'objets. Il existe en deux variantes :</p><ul><li><code>repd</code> : métadonnées S3 objets et buckets</li><li><code>repd-vault</code> : métadonnées IAM (comptes, utilisateurs, groupes, policies)</li></ul><p>Chaque instance repd participe a un <strong>groupe Raft (Raft session)</strong> qui garantit la cohérence forte des métadonnées même en cas de panne partielle.</p><h3>Raft Sessions — Principe</h3><p>Raft est un algorithme de consensus distribué. Dans le contexte S3 Scality, chaque <strong>Raft session</strong> est un groupe de nœuds repd qui s\'accordent sur l\'état des métadonnées :</p><div class="adiag">Raft Session "metadata-0" (exemple a 5 nœuds) :\n\n  [Leader repd-1]  &lt;-- écritures forcées sur le leader\n       |                  le leader réplique vers les followers\n  [Follower repd-2]\n  [Follower repd-3]  &gt;-- n\'importe lequel peut servir les lectures\n  [Follower repd-4]\n  [Follower repd-5]\n\nQuorum = ceil(5/2)+1 = 3 nœuds minimum\nSi leader tombe -> election automatique d\'un nouveau leader</div><h3>Règles du quorum Raft</h3><ul><li>Pour <strong>écrire</strong> des métadonnées : le leader doit obtenir la confirmation d\'une <strong>majorite des nœuds</strong> (quorum = N/2 + 1).</li><li>Pour <strong>lire</strong> : n\'importe quel follower peut servir la lecture (cohérence éventuelle) ou le leader pour une cohérence forte.</li><li>Si le leader tombe : les followers <strong>déclenchent une election</strong> pour elire un nouveau leader (quelques secondes max).</li><li>Si plus de la moitie des nœuds tombent : le quorum est perdu, les <strong>écritures sont bloquées</strong> jusqu\'a rétablissement.</li></ul><h3>Alertes Prometheus liees aux Raft sessions</h3><table><tr><th>Alerte Prometheus</th><th>Sever
