ite</th><th>Signification</th><th>Action</th></tr><tr><td>S3RaftNoLeaderCritical</td><td>CRITIQUE</td><td>Aucun leader dans la session depuis 5 min. Les écritures de métadonnées sont bloquées.</td><td>Vérifier l\'état des nœuds repd, redémarrer si nécessaire.</td></tr><tr><td>S3RaftNotEnoughFollowersCritical</td><td>CRITIQUE</td><td>Moins de 3 followers : quorum en danger. Une autre panne suffit a bloquer les écritures.</td><td>Vérifier la connectivité, redémarrer les nœuds repd en erreur.</td></tr><tr><td>S3RaftNotEnoughFollowersWarning</td><td>Avertissement</td><td>Exactement 3 followers : quorum minimal maintenu mais fragile.</td><td>Surveiller, preparer une intervention preventive.</td></tr><tr><td>S3RaftElectionWarning</td><td>Avertissement</td><td>Trop d\'elections en 5 minutes : instabilité du cluster Raft (réseau ou CPU).</td><td>Investiguer la latence réseau entre nœuds repd.</td></tr><tr><td>S3RaftFollowerDesynchCritical</td><td>CRITIQUE</td><td>Les followers ne rattrapent pas le leader (gap > 10000 opérations). Retard de réplication.</td><td>Vérifier les I/O et la bande passante réseau des nœuds followers.</td></tr><tr><td>S3RepdServerDownCritical</td><td>CRITIQUE</td><td>Le service repd est complètement indisponible.</td><td>Redémarrer repd en urgence.</td></tr><tr><td>S3MetadataVaultServerDownCritical</td><td>CRITIQUE</td><td>Le service repd-vault (IAM) est indisponible : authentification S3 bloquée.</td><td>Redémarrer repd-vault en urgence.</td></tr></table><div class="alert alert-d">Si S3RaftNoLeaderCritical se déclenche, toutes les écritures S3 (PUT, DELETE, création de bucket) sont bloquées jusqu\'a l\'election d\'un nouveau leader. Les lectures restent fonctionnelles. Temps de résolution d\'une election normale : quelques secondes. Si le quorum est perdu (plus de N/2 nœuds DOWN), intervention manuelle requise.</div><div class="kbox"><h3>Points Clés repd / Raft Sessions</h3><ul><li>repd = daemon du service de métadonnées S3 stateful (fort consistant via Raft)</li><li>repd-vault = variante pour les métadonnées IAM (comptes, users, policies)</li><li>Raft session = groupe de nœuds repd avec 1 leader + N followers</li><li>Quorum = ceil(N/2)+1 nœuds : requis pour chaque écriture de métadonnée</li><li>Election automatique si le leader tombe (quelques secondes)</li><li>Quorum perdu -> écritures S3 bloquées, lectures OK</li><li>Surveiller : S3RaftNoLeaderCritical et S3RaftNotEnoughFollowersCritical</li></ul></div>',
quiz:[
  {q:"Quel algorithme de consensus MESA utilise-t-il pour la cohérence des métadonnées ?",opts:["Paxos","Raft","PBFT","Zab (ZooKeeper)"],ans:1,expl:"MESA utilisé Raft pour le consensus. Un leader est élu dans chaque groupe ; toutes les écritures passent par lui, garantissant la cohérence."},
  {q:"Que se passe-t-il si le leader Raft d'un groupe MESA devient indisponible ?",opts:["Le groupe refuse toutes les opérations","Les followers élissent automatiquement un nouveau leader","Le ring passe en mode lecture seule","Un opérateur doit intervenir manuellement"],ans:1,expl:"Raft prévoit l'élection automatique d'un nouveau leader parmi les followers après un timeout. Le service reprend sans intervention manuelle."},
  {q:"Quel est le quorum minimal pour un groupe Raft de 5 membres ?",opts:["2","3","4","5"],ans:1,expl:"Le quorum est floor(N/2)+1 = 3 pour 5 membres. Il faut 3 nœuds disponibles pour élire un leader et accepter des écritures."},
  {q:"Quel backend de base de données repd utilise-t-il localement sur chaque nœud ?",opts:["MongoDB","PostgreSQL","LevelDB","SQLite"],ans:2,expl:"repd utilisé LevelDB comme store clé-valeur embarqué pour les métadonnées locales. C'est léger, rapide et sans daemon externe requis."},
  {q:"Pourquoi MESA utilise-t-il Raft plutôt qu'une simple réplication master-slave ?",opts:["Raft est plus simple à implémenter","Raft garantit la cohérence forte et l'élection automatique du leader sans intervention manuelle, contrairement à une réplication master-slave classique","Master-slave est trop lent","Raft consomme moins de ressources"],ans:1,expl:"La réplication master-slave classique nécessite une intervention manuelle en cas de panne du master. Raft automatise l'élection du leader et garantit qu'un seul leader est actif à tout moment, assurant la cohérence des données."},
  {q:"Que signifie le terme 'split-brain' dans le contexte d'un cluster Raft ?",opts:["Un bug dans le code Raft","Situation où deux sous-groupes pensent chacun être le leader et acceptent des écritures divergentes, causant une incohérence","Un nœud qui redémarre trop souvent","Un disque SSD défaillant"],ans:1,expl:"Raft est précisément conçu pour prévenir le split-brain. Le quorum garantit qu'un seul leader peut être élu à la fois. Sans quorum, le groupe refuse les écritures plutôt que de risquer une incohérence."},
  {q:"Combien de nœuds peut-on perdre dans un groupe Raft de 7 membres tout en maintenant le service ?",opts:["1","2","3","4"],ans:2,expl:"Avec 7 membres, le quorum est floor(7/2)+1 = 4. On peut perdre 7-4 = 3 nœuds tout en maintenant le quorum et donc le service. C'est pourquoi les groupes Raft sont souvent dimensionnés en nombre impair."},
  {q:"Quel est l'impact sur les performances d'MESA si le leader Raft est sur un nœud distant réseau ?",opts:["Aucun impact, Raft gère la latence","Toutes les écritures subissent la latence réseau aller-retour vers le leader avant d'être confirmées, dégradant le débit d'écriture","Raft redirige automatiquement les écritures vers le nœud local","Le leader est toujours sur le nœud local"],ans:1,expl:"Dans Raft, toutes les écritures passent par le leader. Si le leader est éloigné réseau, chaque écriture subit la latence réseau. C'est pourquoi la colocalisation des groupes Raft sur des nœuds proches est recommandée."}
],
title_en:'MESA and Metadata',
desc_en:'MESA internal NoSQL database, Failure Domains, S3 index',
content_en:'<h2>MESA — The RING Internal NoSQL Database</h2><p><strong>MESA</strong> is the acronym for the internal NoSQL database, fully distributed within the RING. Unlike solutions that rely on an external database (ZooKeeper, etcd, Cassandra...), MESA is <strong>natively integrated</strong> into the Bizstorenode instances and uses the same P2P routing protocol as the rest of the RING.</p><h3>Role of MESA</h3><p>MESA acts as the <strong>global object index</strong>. When an object is written to the RING:</p><ol><li>The Bizstorenode creates a MESA entry containing: the object key, its size, its type (COS or ARC), the physical locations of its replicas/fragments (server + disk + offset), and its application metadata (Content-Type, tags, etc.).</li><li>This entry is itself stored as COS across multiple Bizstorenode instances (redundancy of internal metadata).</li><li>During a GET, the RING first retrieves the MESA entry to find the data location, then reads the data directly.</li></ol><h3>MESA Architecture</h3><div class="adiag">Object write "myimage.jpg":\n\n1. PUT(myimage.jpg) arrives on Bizstorenode-A\n2. Bizstorenode-A computes hash("myimage.jpg") -> 0xA3F2...\n3. Writes ARC data to target Biziod instances\n4. Creates a MESA entry:\n   {\n     key:      "myimage.jpg",\n     size:     5200000,\n     type:     "ARC 7+5",\n     fragments:[ {srv:1,disk:3,offset:0x1A4000},\n                 {srv:2,disk:1,offset:0x2C8000}, ... ]\n   }\n5. The MESA entry is itself stored as COS on 3 Bizstorenode instances</div><h3>MESA distribution and consistency</h3><ul><li>MESA entries are distributed across all Bizstorenode instances, following the same P2P partitioning as the data.</li><li>MESA uses an <strong>eventual consistency</strong> model: reads may temporarily return slightly older versions, but consistency is guaranteed over time.</li><li>The Garbage Collector relies on MESA to identify orphaned chunks (written to disk but whose MESA entry has been deleted).</li></ul><h2>RING DATA vs RING META — S3 Architecture</h2><p>For the S3 connector, Scality uses an architecture with <strong>two distinct RINGs</strong>:</p><div class="adiag">+-------------------+        +-------------------+\n|   RING DATA       |        |   RING META       |\n|                   |        |                   |\n|  S3 Objects       |        |  S3 Metadata      |\n|  (raw content)    |        |  (buckets, ACL,   |\n|  ARC or COS       |        |   tags, version)  |\n|                   |        |  COS 5 replicas   |\n+-------------------+        +-------------------+\n         ^                            ^\n         |                            |\n         +----------+  +--------------+\n                    |  |\n              Cloudserver (S3 API)\n                    |\n               S3 Client</div><p>This separation offers several advantages:</p><ul><li><strong>Independent scalability</strong>: RING META can be scaled up without touching RING DATA and vice versa.</li><li><strong>Enhanced metadata protection</strong>: COS 5 for S3 metadata (vs COS 3 for data) because metadata is the reference catalog — losing it would be worse than losing the data itself.</li><li><strong>Performance</strong>: RING META can be configured with faster disks since metadata consists of small, frequently accessed objects.</li></ul><h2>Failure Domains — Fault Zones</h2><p>A <strong>Failure Domain</strong> (or Zone) is a group of servers that may fail simultaneously for a common reason: same rack (same power supply, same switch), same room, same datacenter. Configuring Failure Domains informs the RING of the physical topology so it can place replicas optimally.</p><h3>Placement rules</h3><p>The RING ensures that replicas of the same object are <strong>placed in distinct Failure Domains</strong>:</p><div class="adiag">Example: COS 5 with 3 Failure Domains (A, B, C)\n\nObject X -> 5 replicas distributed:\n  Replica 1 -> Zone A (server 1)\n  Replica 2 -> Zone A (server 2)\n  Replica 3 -> Zone B (server 3)\n  Replica 4 -> Zone B (server 4)\n  Replica 5 -> Zone C (server 5)\n\nComplete Zone A failure -> 3 replicas still available\n                        -> S3 quorum (3/5) maintained\n                        -> Service intact</div><h3>Minimum configuration</h3><ul><li>3-server RING: 3 independent zones (1 server = 1 zone) is the recommended minimum.</li><li>The loss of an entire zone must leave enough replicas to maintain the quorum.</li><li>For COS 5: quorum = minimum 3 replicas -> up to 2 replicas can be lost (therefore a zone with at most 2 servers).</li></ul><div class="alert alert-w">If servers are not assigned to distinct Failure Domains, the RING may place multiple replicas of the same object on servers in the same rack. A rack failure would then lose all those replicas simultaneously -> risk of data loss.</div><h2>XDM — Extended Data Management (S3 Connector)</h2><p>XDM is the software layer that constitutes the complete <strong>S3 Connector</strong>. It groups several interdependent services:</p><table><tr><th>Component</th><th>Role</th><th>Technology</th></tr><tr><td><strong>Cloudserver</strong></td><td>Exposes the AWS-compatible S3 API. Translates S3 requests into RING DATA + RING META operations.</td><td>Node.js</td></tr><tr><td><strong>MongoDB</strong></td><td>Stores structured S3 metadata (bucket list, ACL, tags, versions). It is the persistent database of the S3 Connector.</td><td>MongoDB ReplicaSet</td></tr><tr><td><strong>Redis-Sentinel</strong></td><td>Distributed cache for hot metadata (frequent lookups). HA provided by Sentinel. Accelerates LIST and GET operations on metadata.</td><td>Redis + Sentinel</td></tr><tr><td><strong>Backbeat</strong></td><td>Manages asynchronous S3 workflows: Cross-Region Replication (CRR), Object Lifecycle, ingestion from external sources.</td><td>Node.js, Kafka</td></tr><tr><td><strong>Prometheus</strong></td><td>Collects and stores S3 Connector metrics for Grafana monitoring.</td><td>Prometheus TSDB</td></tr></table><h3>Cross-Region Replication (CRR) via Backbeat</h3><p>CRR allows S3 objects to be automatically replicated to one or more remote clusters:</p><ul><li>Replication is <strong>asynchronous</strong>: the write to the source cluster succeeds immediately, and replication to the target occurs in the background.</li><li>Backbeat maintains a <strong>replication queue</strong> (Kafka): if the target cluster is temporarily unavailable, objects are replicated as soon as connectivity is restored.</li><li>The replication status of each object is tracked via a metadata flag (<code>x-amz-replication-status</code>).</li><li>Note: if upgrading from a version &lt; 9.5.2.0 with active CRR, a <strong>mandatory CRR pre-upgrade procedure</strong> must be executed before the upgrade.</li></ul><div class="kbox"><h3>Key Takeaways</h3><ul><li>MESA = distributed internal index: key -> physical location of data</li><li>Separation of RING DATA (objects) / RING META (S3 metadata, COS 5)</li><li>Failure Domains: replica placement in distinct zones (failure anti-correlation)</li><li>XDM = Cloudserver + MongoDB + Redis-Sentinel + Backbeat + Prometheus</li><li>CRR (Backbeat) = asynchronous inter-cluster replication via Kafka queue</li><li>MongoDB = source of truth for S3 metadata (Redis = cache)</li></ul></div><h2>repd and Raft Sessions — The Stateful Metadata Service</h2><p>The S3 Connector does not store its metadata solely in MongoDB. It also has a <strong>strongly consistent stateful metadata service</strong> based on the <strong>Raft</strong> consensus protocol. This service is exposed via the <code>repd</code> daemon.</p><h3>repd — Replication Daemon</h3><p><code>repd</code> is the daemon that exposes the S3 metadata service API. It handles reads and writes on bucket and object metadata. It comes in two variants:</p><ul><li><code>repd</code>: S3 object and bucket metadata</li><li><code>repd-vault</code>: IAM metadata (accounts, users, groups, policies)</li></ul><p>Each repd instance participates in a <strong>Raft group (Raft session)</strong> that guarantees strong metadata consistency even in the event of a partial failure.</p><h3>Raft Sessions — Principle</h3><p>Raft is a distributed consensus algorithm. In the Scality S3 context, each <strong>Raft session</strong> is a group of repd nodes that agree on the state of the metadata:</p><div class="adiag">Raft Session "metadata-0" (example with 5 nodes):\n\n  [Leader repd-1]  &lt;-- writes are forced through the leader\n       |                  the leader replicates to followers\n  [Follower repd-2]\n  [Follower repd-3]  &gt;-- any of them can serve reads\n  [Follower repd-4]\n  [Follower repd-5]\n\nQuorum = ceil(5/2)+1 = 3 nodes minimum\nIf leader fails -> automatic election of a new leader</div><h3>Raft quorum rules</h3><ul><li>To <strong>write</strong> metadata: the leader must obtain confirmation from a <strong>majority of nodes</strong> (quorum = N/2 + 1).</li><li>To <strong>read</strong>: any follower can serve the read (eventual consistency) or the leader for strong consistency.</li><li>If the leader fails: followers <strong>trigger an election</strong> to elect a new leader (a few seconds at most).</li><li>If more than half the nodes fail: the quorum is lost, <strong>writes are blocked</strong> until service is restored.</li></ul><h3>Prometheus alerts related to Raft sessions</h3><table><tr><th>Prometheus Alert</th><th>Severity</th><th>Meaning</th><th>Action</th></tr><tr><td>S3RaftNoLeaderCritical</td><td>CRITICAL</td><td>No leader in the session for 5 minutes. Metadata writes are blocked.</td><td>Check the state of repd nodes, restart if necessary.</td></tr><tr><td>S3RaftNotEnoughFollowersCritical</td><td>CRITICAL</td><td>Fewer than 3 followers: quorum at risk. One more failure is enough to block writes.</td><td>Check connectivity, restart repd nodes in error.</td></tr><tr><td>S3RaftNotEnoughFollowersWarning</td><td>WARNING</td><td>Exactly 3 followers: minimum quorum maintained but fragile.</td><td>Monitor, prepare a preventive intervention.</td></tr><tr><td>S3RaftElectionWarning</td><td>WARNING</td><td>Too many elections within 5 minutes: Raft cluster instability (network or CPU).</td><td>Investigate network latency between repd nodes.</td></tr><tr><td>S3RaftFollowerDesynchCritical</td><td>CRITICAL</td><td>Followers are not catching up with the leader (gap > 10,000 operations). Replication lag.</td><td>Check I/O and network bandwidth on follower nodes.</td></tr><tr><td>S3RepdServerDownCritical</td><td>CRITICAL</td><td>The repd service is completely unavailable.</td><td>Restart repd immediately.</td></tr><tr><td>S3MetadataVaultServerDownCritical</td><td>CRITICAL</td><td>The repd-vault service (IAM) is unavailable: S3 authentication is blocked.</td><td>Restart repd-vault immediately.</td></tr></table><div class="alert alert-d">If S3RaftNoLeaderCritical fires, all S3 writes (PUT, DELETE, bucket creation) are blocked until a new leader is elected. Reads remain functional. Resolution time for a normal election: a few seconds. If the quorum is lost (more than N/2 nodes DOWN), manual intervention is required.</div><div class="kbox"><h3>Key Takeaways — repd / Raft Sessions</h3><ul><li>repd = S3 stateful metadata service daemon (strongly consistent via Raft)</li><li>repd-vault = variant for IAM metadata (accounts, users, policies)</li><li>Raft session = group of repd nodes with 1 leader + N followers</li><li>Quorum = ceil(N/2)+1 nodes: required for each metadata write</li><li>Automatic election if the leader fails (a few seconds)</li><li>Quorum lost -> S3 writes blocked, reads OK</li><li>Monitor: S3RaftNoLeaderCritical and S3RaftNotEnoughFollowersCritical</li></ul></div>',
quiz_en:[
  {q:"What consensus algorithm does MESA use for metadata consistency?",opts:["Paxos","Raft","PBFT","Zab (ZooKeeper)"],ans:1,expl:"MESA uses Raft for consensus. A leader is elected in each group; all writes go through it, guaranteeing consistency."},
  {q:"What happens if the Raft leader of a MESA group becomes unavailable?",opts:["The group refuses all operations","Followers automatically elect a new leader","The ring switches to read-only mode","An operator must intervene manually"],ans:1,expl:"Raft provides for the automatic election of a new leader among followers after a timeout. The service resumes without manual intervention."},
  {q:"What is the minimum quorum for a Raft group of 5 members?",opts:["2","3","4","5"],ans:1,expl:"The quorum is floor(N/2)+1 = 3 for 5 members. 3 nodes must be available to elect a leader and accept writes."},
  {q:"What database backend does repd use locally on each node?",opts:["MongoDB","PostgreSQL","LevelDB","SQLite"],ans:2,expl:"repd uses LevelDB as an embedded key-value store for local metadata. It is lightweight, fast, and requires no external daemon."},
  {q:"Why does MESA use Raft rather than simple master-slave replication?",opts:["Raft is simpler to implement","Raft guarantees strong consistency and automatic leader election without manual intervention, unlike classic master-slave replication","Master-slave is too slow","Raft consumes fewer resources"],ans:1,expl:"Classic master-slave replication requires manual intervention when the master fails. Raft automates leader election and guarantees that only one leader is active at any time, ensuring data consistency."},
  {q:"What does the term 'split-brain' mean in the context of a Raft cluster?",opts:["A bug in the Raft code","A situation where two sub-groups each believe they are the leader and accept divergent writes, causing inconsistency","A node that restarts too often","A failed SSD"],ans:1,expl:"Raft is precisely designed to prevent split-brain. The quorum guarantees that only one leader can be elected at a time. Without a quorum, the group refuses writes rather than risk inconsistency."},
  {q:"How many nodes can be lost in a Raft group of 7 members while still maintaining service?",opts:["1","2","3","4"],ans:2,expl:"With 7 members, the quorum is floor(7/2)+1 = 4. Up to 7-4 = 3 nodes can be lost while maintaining the quorum and therefore the service. This is why Raft groups are often sized with an odd number of members."},
  {q:"What is the performance impact on MESA if the Raft leader is on a network-distant node?",opts:["No impact, Raft handles latency","All writes incur the round-trip network latency to the leader before being confirmed, degrading write throughput","Raft automatically redirects writes to the local node","The leader is always on the local node"],ans:1,expl:"In Raft, all writes go through the leader. If the leader is network-distant, each write incurs network latency. This is why co-locating Raft groups on nearby nodes is recommended."}
]},
{id:'04',num:'04',title:'Connectors',desc:'S3, sproxyd, NFS, SMB, FUSE, CDMI — protocoles et contraintes',
content:'<h2>Rôle des Connectors dans l\'Architecture RING</h2><p>Les Connectors sont la <strong>couche d\'interface</strong> entre les applications clientes et le coeur de stockage RING. Chaque connector est un service indépendant qui traduit un protocole standard (S3, NFS, SMB...) en opérations internes RING (PUT/GET/DELETE d\'objets identifiés par hash). Ils peuvent être déployés sur des serveurs dédiés ou co-localises selon la charge.</p><h2>S3 Connector — Le Plus Complet</h2><p>Le S3 Connector expose une <strong>API compatible Amazon S3</strong>. C\'est le connector le plus utilisé en production pour les architectures cloud-native.</p><h3>Opérations supportées</h3><ul><li><strong>Gestion des buckets</strong> : CreateBucket, DeleteBucket, ListBuckets, GetBucketAcl, PutBucketPolicy, GetBucketLocation</li><li><strong>Gestion des objets</strong> : PutObject, GetObject, DeleteObject, HeadObject, CopyObject, ListObjects (V1 et V2)</li><li><strong>Multipart Upload</strong> : CreateMultipartUpload, UploadPart, CompleteMultipartUpload, AbortMultipartUpload (pour les très gros objets)</li><li><strong>Versioning</strong> : activation par bucket, ListObjectVersions, DeleteMarker</li><li><strong>ACL et Policies</strong> : PutBucketAcl, PutObjectAcl, PutBucketPolicy</li><li><strong>Metadata</strong> : custom headers <code>x-amz-meta-*</code>, tags, Content-Type</li></ul><h3>Architecture interne du S3 Connector</h3><div class="adiag">Client S3\n    |\n  HTTPS:443\n    |\nCloudserver (Node.js) -- API S3 layer\n    |           |\nRING DATA   MongoDB / Redis\n(objets)    (métadonnées S3)\n    |\nBackbeat -- CRR, Lifecycle, Ingestion</div><h2>sproxyd — Le Connector REST Natif</h2><p>sproxyd est le <strong>connector HTTP REST natif de Scality</strong>. Contrairement au S3 Connector, il n\'a pas de notion de bucket ni de namespace : chaque objet est identifié uniquement par son <strong>hash</strong>. C\'est l\'interface la plus basse et la plus performante.</p><h3>Architecture sproxyd</h3><div class="adiag">Client HTTP\n    |\n  Port 81 (Apache httpd)\n    |\nmod_fastcgi\n    |\n  Port 10000 (daemon sproxyd)\n    |\nBizstorenode (PUT/GET/DELETE par hash)</div><h3>Opérations sproxyd</h3><ul><li><strong>PUT</strong> : <code>PUT /proxy/chord/&lt;hash&gt;</code> -> stocké l\'objet sous ce hash</li><li><strong>GET</strong> : <code>GET /proxy/chord/&lt;hash&gt;</code> -> récupère l\'objet</li><li><strong>DELETE</strong> : <code>DELETE /proxy/chord/&lt;hash&gt;</code> -> supprimé l\'objet</li></ul><p>sproxyd est utilisé en interne par SOFS (sfused passe par sproxyd pour lire/écrire les blobs dans le RING). Certaines applications haute performance utilisent sproxyd directement car il évite la couche métadonnées S3.</p><h2>NFS sur S3 — Semantique et Contraintes</h2><p>NFS sur S3 monté un <strong>bucket S3 comme un point de montage NFS</strong>. C\'est pratique pour offrir un accès fichier a des applications qui ne supportent pas S3 natif. Mais la semantique est celle de l\'objet, pas du fichier :</p><div class="alert alert-d">Contrainte fondamentale : NFS sur S3 ne supporte PAS les mises a jour partielles (pwrite, seek+write). Chaque écriture sur un fichier réécrit l\'objet S3 en entier. Les applications qui font des écritures partielles (SQLite, certains journaux) ne sont PAS compatibles avec NFS sur S3.</div><h3>NFSv3 sur S3</h3><ul><li>Services : sfused + membershipd (même que SOFS)</li><li>Kerberos : <strong>non supporte</strong></li><li>Buckets : uniquement des buckets <strong>non-versions</strong></li><li>Semantique POSIX partielle : pas de locks distribués fiables</li></ul><h3>NFSv3+v4 sur S3 (ganesha)</h3><ul><li>Services : NFS-Ganesha + membershipd</li><li>Version NFS supportée : <strong>uniquement NFSv4.0</strong> (pas 4.1, pas 4.2)</li><li>Kerberos : <strong>supporte</strong> (contrairement a NFSv3)</li><li>Utilisé NFS-Ganesha comme serveur NFS userspace (plus flexible que le NFS kernel)</li></ul><h2>SMB/CIFS — Accès Windows</h2><p>Le connector SMB expose les volumes SOFS comme des partages Windows via le protocole <strong>SMB 3.0</strong>. Il est base sur Samba (SerNet-Samba).</p><h3>Composants SMB</h3><table><tr><th>Service</th><th>Rôle</th></tr><tr><td>sfused</td><td>Monte le volume SOFS localement (FUSE)</td></tr><tr><td>smbd</td><td>Serveur SMB principal (partages de fichiers)</td></tr><tr><td>nmbd</td><td>Resolveur NetBIOS (navigation réseau Windows)</td></tr><tr><td>winbindd</td><td>Intégration Active Directory (optionnel, requis pour AD)</td></tr><tr><td>CTDB</td><td>Clustering Samba pour la haute disponibilité (VIP failover)</td></tr></table><h3>Intégration Active Directory</h3><p>Quand Active Directory est configuré, les utilisateurs Windows s\'authentifient avec leurs credentials AD sur les partages SMB. La jointure au domaine se fait avec :</p><pre>net ads join -U administrator</pre><p>Le fichier de config principal est <code>/etc/scality/cifs/smb.conf</code>. La règle critique : le module <code>ring</code> doit être en <strong>première position</strong> dans <code>vfs objects</code>.</p><h2>FUSE — Montage Local</h2><p>Le connector FUSE (localfs) monté le volume SOFS directement sur le serveur connector via FUSE (Filesystem in Userspace). C\'est le mode le plus simple :</p><ul><li>Accès POSIX complet depuis le serveur local uniquement</li><li>Services : sfused + membershipd</li><li>Usage : scripts d\'administration, ingestion locale de données</li><li>Pas d\'accès réseau direct (contrairement a NFS/SMB)</li></ul><h2>CDMI — Cloud Data Management Interface</h2><p>CDMI est un protocole standard SNIA pour le stockage cloud. Le connector Scality CDMI est base sur le daemon <code>dewpoint</code> :</p><ul><li>Nécessite un serveur HTTP (Apache ou nginx) avec FastCGI</li><li>Monte un point de montage FUSE local comme base de données</li><li>Supporte les opérations CDMI standard : containers, data objects, queries</li></ul><div class="alert alert-d">Le connector Zimbra est officiellement DEPRECIEE. Ne pas l\'utiliser dans les nouveaux déploiements ni pour les upgrades.</div><div class="kbox"><h3>Points Clés a Retenir</h3><ul><li>S3 Connector : API AWS-compatible complete (versioning, ACL, multipart, CRR)</li><li>sproxyd : REST natif par hash, port Apache 81, port daemon 10000</li><li>NFS sur S3 : PAS de mise a jour partielle, buckets non-versions, NFSv4.0 seulement</li><li>NFSv3 sur S3 : pas Kerberos ; NFSv3+v4 (ganesha) : Kerberos OK, v4.0 seulement</li><li>SMB : base SerNet-Samba, vfs objects = ring en PREMIER, CTDB pour HA</li><li>Zimbra connector DEPRECIEE</li></ul></div>',
quiz:[
  {q:"Quel composant Scality expose l'API S3 compatible AWS ?",opts:["sproxyd","Cloudserver","bucketd","MESA"],ans:1,expl:"Cloudserver est l'implémentation Scality du protocole S3. Il reçoit les requêtes S3 des clients et les traduit en opérations sproxyd/bucketd."},
  {q:"Quelle est la fonction de sproxyd dans l'architecture RING ?",opts:["Gestion des buckets S3","Daemon HTTP de stockage d'objets exposant une API REST interne","Authentification des utilisateurs","Monitoring des disques"],ans:1,expl:"sproxyd est le daemon HTTP qui reçoit les données des connectors et les écrit dans le ring via biziod. C'est le point d'entrée des données dans le ring DATA."},
  {q:"Quelle interface POSIX sfused expose-t-il pour SOFS ?",opts:["iSCSI","NFS uniquement","Point de montage FUSE (filesystem en espace utilisateur)","SMB uniquement"],ans:2,expl:"sfused utilisé FUSE (Filesystem in Userspace) pour exposer le namespace SOFS comme un répertoire local standard, sans module noyau. NFS et SMB s'appuient ensuite sur ce montage."},
  {q:"Quel protocole SOFS utilise-t-il pour les clients Windows ?",opts:["NFS v4","FUSE","SMB/CIFS via Samba","WebDAV"],ans:2,expl:"SOFS expose les partages Windows via Samba qui implémente le protocole SMB/CIFS. sfused monté le filesystem SOFS localement, Samba l'exporte aux clients Windows."},
  {q:"Que gère bucketd dans l'architecture S3 Scality ?",opts:["Les accès réseau S3","Les métadonnées des buckets (liste objets, ACL, versioning)","Le chiffrement des données","Les métriques Prometheus"],ans:1,expl:"bucketd est le service de métadonnées S3 : il stocké la liste des objets, les ACL, le versioning, les tags. Il utilisé LevelDB comme backend et est distinct de MESA."},
  {q:"Pourquoi sproxyd expose-t-il une API REST interne plutôt que directement l'API S3 ?",opts:["Pour des raisons de sécurité","sproxyd est une API de stockage bas niveau optimisée pour les écritures dans le ring, séparée de la logique protocole S3 gérée par Cloudserver","sproxyd ne supporte pas HTTPS","L'API S3 est trop complexe pour le ring"],ans:1,expl:"La séparation des responsabilités est clé : Cloudserver gère la logique protocole S3 (auth, ACL, versioning) et sproxyd gère le stockage pur dans le ring. Cette architecture permet de remplacer ou mettre à l'échelle chaque couche indépendamment."},
  {q:"Que se passe-t-il si bucketd est indisponible alors que sproxyd fonctionne ?",opts:["Le stockage des données est impossible","Les données peuvent être écrites dans le ring via sproxyd mais les métadonnées S3 (liste d'objets, ACL) ne sont pas mises à jour, rendant les objets invisibles via S3","Tout le service S3 fonctionne normalement","sproxyd prend automatiquement le relais de bucketd"],ans:1,expl:"bucketd et sproxyd sont des services distincts. Sans bucketd, les opérations S3 nécessitant des métadonnées (LIST, HEAD, GET avec métadonnées) échouent. sproxyd seul peut traiter des écritures bas niveau mais les objets sont orphelins dans les métadonnées S3."},
  {q:"Quel est l'avantage de FUSE pour sfused par rapport à un module noyau ?",opts:["FUSE est plus rapide","Un crash de sfused n'entraîne pas de kernel panic, les mises à jour ne nécessitent pas de recompilation noyau, et le déploiement est simplifié","FUSE supporte plus de systèmes de fichiers","FUSE consomme moins de RAM"],ans:1,expl:"FUSE s'exécute en espace utilisateur : un crash de sfused est isolé et ne crash pas le noyau. Pas besoin de recompiler le noyau à chaque mise à jour de sfused. Le débugage et le déploiement sont simplifiés."}
],
title_en:'Connectors',
desc_en:'S3, sproxyd, NFS, SMB, FUSE, CDMI — protocols and constraints',
content_en:'<h2>Role of Connectors in the RING Architecture</h2><p>Connectors are the <strong>interface layer</strong> between client applications and the RING storage core. Each connector is an independent service that translates a standard protocol (S3, NFS, SMB...) into internal RING operations (PUT/GET/DELETE of hash-identified objects). They can be deployed on dedicated servers or co-located depending on the workload.</p><h2>S3 Connector — The Most Complete</h2><p>The S3 Connector exposes an <strong>Amazon S3-compatible API</strong>. It is the most widely used connector in production for cloud-native architectures.</p><h3>Supported operations</h3><ul><li><strong>Bucket management</strong>: CreateBucket, DeleteBucket, ListBuckets, GetBucketAcl, PutBucketPolicy, GetBucketLocation</li><li><strong>Object management</strong>: PutObject, GetObject, DeleteObject, HeadObject, CopyObject, ListObjects (V1 and V2)</li><li><strong>Multipart Upload</strong>: CreateMultipartUpload, UploadPart, CompleteMultipartUpload, AbortMultipartUpload (for very large objects)</li><li><strong>Versioning</strong>: per-bucket activation, ListObjectVersions, DeleteMarker</li><li><strong>ACL and Policies</strong>: PutBucketAcl, PutObjectAcl, PutBucketPolicy</li><li><strong>Metadata</strong>: custom headers <code>x-amz-meta-*</code>, tags, Content-Type</li></ul><h3>S3 Connector internal architecture</h3><div class="adiag">Client S3\\n    |\\n  HTTPS:443\\n    |\\nCloudserver (Node.js) -- API S3 layer\\n    |           |\\nRING DATA   MongoDB / Redis\\n(objets)    (métadonnées S3)\\n    |\\nBackbeat -- CRR, Lifecycle, Ingestion</div><h2>sproxyd — The Native REST Connector</h2><p>sproxyd is Scality\'s <strong>native HTTP REST connector</strong>. Unlike the S3 Connector, it has no concept of bucket or namespace: each object is identified solely by its <strong>hash</strong>. It is the lowest-level and highest-performance interface.</p><h3>sproxyd architecture</h3><div class="adiag">Client HTTP\\n    |\\n  Port 81 (Apache httpd)\\n    |\\nmod_fastcgi\\n    |\\n  Port 10000 (daemon sproxyd)\\n    |\\nBizstorenode (PUT/GET/DELETE par hash)</div><h3>sproxyd operations</h3><ul><li><strong>PUT</strong>: <code>PUT /proxy/chord/&lt;hash&gt;</code> — stores the object under this hash</li><li><strong>GET</strong>: <code>GET /proxy/chord/&lt;hash&gt;</code> — retrieves the object</li><li><strong>DELETE</strong>: <code>DELETE /proxy/chord/&lt;hash&gt;</code> — deletes the object</li></ul><p>sproxyd is used internally by SOFS (sfused goes through sproxyd to read/write blobs in the RING). Some high-performance applications use sproxyd directly because it bypasses the S3 metadata layer.</p><h2>NFS on S3 — Semantics and Constraints</h2><p>NFS on S3 mounts an <strong>S3 bucket as an NFS mount point</strong>. This is convenient for providing file access to applications that do not natively support S3. However, the semantics are those of object storage, not a filesystem:</p><div class="alert alert-d">Fundamental constraint: NFS on S3 does NOT support partial updates (pwrite, seek+write). Every write to a file rewrites the entire S3 object. Applications that perform partial writes (SQLite, certain journals) are NOT compatible with NFS on S3.</div><h3>NFSv3 on S3</h3><ul><li>Services: sfused + membershipd (same as SOFS)</li><li>Kerberos: <strong>not supported</strong></li><li>Buckets: only <strong>non-versioned</strong> buckets</li><li>Partial POSIX semantics: no reliable distributed locks</li></ul><h3>NFSv3+v4 on S3 (ganesha)</h3><ul><li>Services: NFS-Ganesha + membershipd</li><li>Supported NFS version: <strong>NFSv4.0 only</strong> (not 4.1, not 4.2)</li><li>Kerberos: <strong>supported</strong> (unlike NFSv3)</li><li>Uses NFS-Ganesha as a userspace NFS server (more flexible than kernel NFS)</li></ul><h2>SMB/CIFS — Windows Access</h2><p>The SMB connector exposes SOFS volumes as Windows shares via the <strong>SMB 3.0</strong> protocol. It is based on Samba (SerNet-Samba).</p><h3>SMB components</h3><table><tr><th>Service</th><th>Role</th></tr><tr><td>sfused</td><td>Mounts the SOFS volume locally (FUSE)</td></tr><tr><td>smbd</td><td>Main SMB server (file shares)</td></tr><tr><td>nmbd</td><td>NetBIOS resolver (Windows network browsing)</td></tr><tr><td>winbindd</td><td>Active Directory integration (optional, required for AD)</td></tr><tr><td>CTDB</td><td>Samba clustering for high availability (VIP failover)</td></tr></table><h3>Active Directory integration</h3><p>When Active Directory is configured, Windows users authenticate with their AD credentials on SMB shares. Domain join is performed with:</p><pre>net ads join -U administrator</pre><p>The main configuration file is <code>/etc/scality/cifs/smb.conf</code>. Critical rule: the <code>ring</code> module must be in <strong>first position</strong> in <code>vfs objects</code>.</p><h2>FUSE — Local Mount</h2><p>The FUSE connector (localfs) mounts the SOFS volume directly on the connector server via FUSE (Filesystem in Userspace). This is the simplest mode:</p><ul><li>Full POSIX access from the local server only</li><li>Services: sfused + membershipd</li><li>Use cases: administration scripts, local data ingestion</li><li>No direct network access (unlike NFS/SMB)</li></ul><h2>CDMI — Cloud Data Management Interface</h2><p>CDMI is an SNIA standard protocol for cloud storage. The Scality CDMI connector is based on the <code>dewpoint</code> daemon:</p><ul><li>Requires an HTTP server (Apache or nginx) with FastCGI</li><li>Mounts a local FUSE mount point as its data store</li><li>Supports standard CDMI operations: containers, data objects, queries</li></ul><div class="alert alert-d">The Zimbra connector is officially DEPRECATED. Do not use it in new deployments or upgrades.</div><div class="kbox"><h3>Key Takeaways</h3><ul><li>S3 Connector: complete AWS-compatible API (versioning, ACL, multipart, CRR)</li><li>sproxyd: native REST by hash, Apache port 81, daemon port 10000</li><li>NFS on S3: NO partial updates, non-versioned buckets, NFSv4.0 only</li><li>NFSv3 on S3: no Kerberos; NFSv3+v4 (ganesha): Kerberos OK, v4.0 only</li><li>SMB: SerNet-Samba based, vfs objects = ring FIRST, CTDB for HA</li><li>Zimbra connector DEPRECATED</li></ul></div>',
quiz_en:[
  {q:"Which Scality component exposes an AWS-compatible S3 API?",opts:["sproxyd","Cloudserver","bucketd","MESA"],ans:1,expl:"Cloudserver is Scality's implementation of the S3 protocol. It receives S3 requests from clients and translates them into sproxyd/bucketd operations."},
  {q:"What is the function of sproxyd in the RING architecture?",opts:["S3 bucket management","HTTP daemon for object storage exposing an internal REST API","User authentication","Disk monitoring"],ans:1,expl:"sproxyd is the HTTP daemon that receives data from connectors and writes it into the ring via biziod. It is the data entry point into the data ring."},
  {q:"What POSIX interface does sfused expose for SOFS?",opts:["iSCSI","NFS only","A FUSE mount point (filesystem in userspace)","SMB only"],ans:2,expl:"sfused uses FUSE (Filesystem in Userspace) to expose the SOFS namespace as a standard local directory, without a kernel module. NFS and SMB then build on top of this mount."},
  {q:"Which protocol does SOFS use for Windows clients?",opts:["NFS v4","FUSE","SMB/CIFS via Samba","WebDAV"],ans:2,expl:"SOFS exposes Windows shares via Samba, which implements the SMB/CIFS protocol. sfused mounts the SOFS filesystem locally, and Samba exports it to Windows clients."},
  {q:"What does bucketd manage in the Scality S3 architecture?",opts:["S3 network access","Bucket metadata (object listing, ACL, versioning)","Data encryption","Prometheus metrics"],ans:1,expl:"bucketd is the S3 metadata service: it stores the object list, ACLs, versioning, and tags. It uses LevelDB as a backend and is distinct from MESA."},
  {q:"Why does sproxyd expose an internal REST API rather than the S3 API directly?",opts:["For security reasons","sproxyd is a low-level storage API optimized for writes into the ring, separate from the S3 protocol logic handled by Cloudserver","sproxyd does not support HTTPS","The S3 API is too complex for the ring"],ans:1,expl:"Separation of concerns is key: Cloudserver handles S3 protocol logic (auth, ACL, versioning) and sproxyd handles pure storage in the ring. This architecture allows each layer to be replaced or scaled independently."},
  {q:"What happens if bucketd is unavailable while sproxyd is still running?",opts:["Data storage becomes impossible","Data can be written to the ring via sproxyd but S3 metadata (object listing, ACL) is not updated, making objects invisible via S3","The entire S3 service continues normally","sproxyd automatically takes over from bucketd"],ans:1,expl:"bucketd and sproxyd are distinct services. Without bucketd, S3 operations requiring metadata (LIST, HEAD, GET with metadata) fail. sproxyd alone can process low-level writes but the objects are orphaned from S3 metadata."},
  {q:"What is the advantage of FUSE for sfused compared to a kernel module?",opts:["FUSE is faster","A crash of sfused does not cause a kernel panic, updates do not require kernel recompilation, and deployment is simplified","FUSE supports more filesystems","FUSE uses less RAM"],ans:1,expl:"FUSE runs in userspace: a crash of sfused is isolated and does not crash the kernel. No need to recompile the kernel on each sfused update. Debugging and deployment are simplified."}
]},
{id:'05',num:'05',title:'Monitoring et Observabilite',desc:'Supervisor, Prometheus sizing, Grafana, ringsh, SupAPI',
content:'<h2>Le Scality Supervisor — Portail Central d\'Administration</h2><p>Le <strong>Supervisor</strong> est l\'interface web centralisée pour administrer l\'ensemble du cluster RING. Il s\'appuie sur <strong>Salt</strong> (gestion de configuration distribuée) pour orchestrer les opérations sur tous les serveurs. Accès obligatoirement en <strong>HTTPS</strong> : <code>https://&lt;supervisor-fqdn&gt;</code>.</p><h3>Sections principales du Supervisor</h3><table><tr><th>Section</th><th>Contenu</th></tr><tr><td><strong>Dashboard</strong></td><td>Vue globale de l\'état du cluster : RINGs, nodes, disques, alertes actives en temps reel</td></tr><tr><td><strong>Administration</strong></td><td>Paramètres RING (join_auto, rebuild_auto, chordpurge), gestion des disques, expansion du cluster</td></tr><tr><td><strong>Monitoring</strong></td><td>Metriques temps reel, lien vers Grafana, historique des alertes Nagios</td></tr><tr><td><strong>Tasks</strong></td><td>Suivi des tâches en cours (Balance, Rebuild, GC, Repair) avec progression et logs</td></tr><tr><td><strong>Identity</strong></td><td>Gestion des utilisateurs et rôles (SSO depuis 9.4.0)</td></tr><tr><td><strong>Logs</strong></td><td>Agrégation centralisée des logs de tous les composants du cluster</td></tr></table><h3>États du RING dans le Supervisor</h3><table><tr><th>État affiche</th><th>Signification</th><th>Action</th></tr><tr><td>RUN</td><td>RING nominal, toutes les tâches exécutées correctement</td><td>Aucune</td></tr><tr><td>RUN + CONF_MISMATCH</td><td>RING opérationnel mais configuration différente entre nodes (normal post-upgrade Supervisor)</td><td>Continuer l\'upgrade des nodes</td></tr><tr><td>INCOMPLETE</td><td>Des objets ont moins de répliques que requis</td><td>Laisser Rebuild/Repair travailler ; investiguer si persistant</td></tr><tr><td>ARC_REBUILD_NOK</td><td>Reconstruction ARC impossible (trop de fragments perdus)</td><td>Contacter Scality Support IMMEDIATEMENT</td></tr><tr><td>SPLIT LOOP</td><td>Partitionnement réseau entre nodes</td><td>Diagnostiquer la connectivité réseau</td></tr></table><h2>SupAPI — Automatisation via REST</h2><p>Toutes les actions disponibles dans l\'UI du Supervisor sont également exposées via l\'<strong>API REST (SupAPI)</strong>. C\'est la base pour l\'automatisation, les scripts de maintenance et l\'intégration dans des outils tiers (Ansible, scripts d\'ops, ITSM).</p><h3>Accès et authentification</h3><ul><li>Documentation interactive Swagger : <code>https://&lt;supervisor&gt;/apidoc/</code></li><li>Authentification par token <strong>JWT</strong> : obtenu via POST sur l\'endpoint de login</li><li>Le token a une durée de vie limitée (configurable, typiquement 1 heure)</li><li>Toutes les requêtes portent le header <code>Authorization: Bearer &lt;token&gt;</code></li></ul><h3>Exemples d\'appels API courants</h3><pre># Obtenir un token JWT\ncurl -k -X POST https://supervisor/api/v0.1/auth/login \\\n  -H "Content-Type: application/json" \\\n  -d \'{"username":"admin","password":"monmotdepasse"}\'\n\n# Lister les RINGs du cluster\ncurl -k -H "Authorization: Bearer $TOKEN" \\\n  https://supervisor/api/v0.1/ring\n\n# État d\'un RING spécifique\ncurl -k -H "Authorization: Bearer $TOKEN" \\\n  https://supervisor/api/v0.1/ring/myring/status\n\n# Lister les disques d\'un node\ncurl -k -H "Authorization: Bearer $TOKEN" \\\n  https://supervisor/api/v0.1/node/storage1/disk</pre><h2>Prometheus — Architecture de Collecte de Metriques</h2><p>La collecte de metriques du RING est assurée par <strong>Prometheus</strong>, déployé sur des serveurs dédiés. Prometheus scrape périodiquement les endpoints <code>/metrics</code> de chaque composant RING et stocké les séries temporelles dans sa base de données interne (TSDB). <strong>Grafana</strong> interroge ensuite Prometheus pour construire les tableaux de bord.</p><h3>Modèle de sharding Prometheus</h3><p>Pour les grands clusters, un seul Prometheus ne peut pas ingerer toutes les metriques a temps. Scality utilisé un modèle de <strong>shards Prometheus</strong>, chaque shard couvrant un sous-ensemble de nodes :</p><div class="adiag">Formule : nb_shards = ceil(N_storage_nodes / 12)\n          nb_nœuds_prometheus = nb_shards x 2  (paire HA)\n\nTableau récapitulatif :\n  N nodes  | Shards | Nœuds Prometheus\n  ---------+--------+------------------\n     1-12  |   1    |        2\n    13-24  |   2    |        4\n    25-36  |   3    |        6\n    37-48  |   4    |        8</div><h3>Espace disque minimum sur /var</h3><table><tr><th>Configuration du cluster</th><th>Espace /var minimum</th></tr><tr><td>Moins de 12 storage nodes</td><td>Standard (50 GB)</td></tr><tr><td>&gt;= 12 nodes + 2 clusters S3 META (S3MC)</td><td><strong>100 GB</strong></td></tr><tr><td>&gt;= 18 nodes + 3 clusters S3 META (S3MC)</td><td><strong>150 GB</strong></td></tr></table><div class="alert alert-w">Vérifier AVANT tout upgrade que /var dispose de l\'espace suffisant. Un manque d\'espace en cours d\'upgrade bloqué le processus dans un état intermédiaire difficile a corriger.</div><h2>ringsh — Diagnostic CLI du cluster</h2><p><code>ringsh</code> permet d\'interroger l\'état du cluster directement en ligne de commande sur le Supervisor. Utile pour le diagnostic rapide et la vérification d\'état sans passer par l\'UI. Les commandes de maintenance (nodeLeave, nodeJoin, ringConfigSet) sont traitées dans le module <em>Maintenance RING</em>.</p><h3>Commandes de consultation</h3><pre># Lister et état des RINGs\nringsh supervisor ringList              # lister tous les RINGs\nringsh supervisor ringStatus &lt;RING&gt;    # état d\'un RING (RUN/INCOMPLETE...)\n\n# Lister et état des nodes\nringsh supervisor nodeList &lt;RING&gt;      # lister les nodes d\'un RING\nringsh supervisor nodeStatus &lt;NODE&gt;:/ # état détaillé d\'un node</pre><h3>États d\'un node (nodeStatus)</h3><ul><li><strong>RUN</strong> : node actif, participe au RING, répond aux requêtes</li><li><strong>OUT_OF_SERVICE</strong> : node en maintenance, retire du RING</li><li><strong>JOINING</strong> : node en cours de rejoindre le RING</li><li><strong>LEAVING</strong> : node en cours de quitter le RING</li></ul><h2>Grafana et Nagios</h2><ul><li><strong>Grafana</strong> : interface graphique de visualisation des metriques Prometheus. Dashboards pré-configurés par Scality inclus avec le Supervisor.</li><li><strong>Nagios</strong> : outil d\'alerting traditionnel. Les checks Scality s\'integrent dans une infrastructure Nagios existante pour générer des alertes PagerDuty/mail/SMS.</li></ul><h2>Troubleshooting S3 "UNAVAILABLE" dans le Supervisor GUI</h2><p>Depuis RING 9.5, le calcul du statut S3 dans le Supervisor est base sur <strong>Prometheus/Thanos</strong> (et non plus Elasticsearch). Quand S3 apparait "UNAVAILABLE" en rouge dans le GUI, la procédure de diagnostic est :</p><pre># 1. Vérifier les alertes Prometheus actives pour S3\n# URL directe :\nhttps://&lt;supervisor_fqdn&gt;/prometheus/alerts\n\n# 2. Ou via PromQL dans Grafana Explore :\nring_alerts{domain="s3", alertstate="firing"}\n\n# 3. Health check S3 manuel\n/usr/bin/scality-compute-s3-health -c /etc/scality/s3-healthcheck/config.yaml\n\n# 4. Vérifier le cron health check\nls -lh /etc/cron.d/scality-compute-s3-health</pre><p>Causes fréquentes de "S3 UNAVAILABLE" après RING 9.5 :</p><ul><li>Un container S3 en crash (vérifier avec <code>ctrctl ps</code> sur les nœuds md)</li><li>Une alerte Raft active (S3RaftNoLeaderCritical, S3RaftNotEnoughFollowersCritical)</li><li>Prometheus lui-même en erreur (vérifier le scrape des metriques S3)</li><li>Pic errone de metriques après un restart Prometheus — attendre 2-3 minutes</li></ul><h2>Prometheus Sharding (RING 9.5+)</h2><p>Depuis RING 9.5, Prometheus peut être <strong>sharde</strong> sur plusieurs serveurs pour les grands clusters. Chaque shard surveille un sous-ensemble des serveurs.</p><table><tr><th>Aspect</th><th>Detail</th></tr><tr><td>Outil de gestion</td><td><code>pdesc_manager.py</code> — gère les rôles Prometheus dans le fichier cluster.csv</td></tr><tr><td>Configuration</td><td>Dans scality-common.sls : <code>prometheus.shards.shard1.monitored_servers</code></td></tr><tr><td>Après modification</td><td><code>salt \'*\' saltutil.refresh_pillar</code> puis <code>salt-run state.orchestrate prometheus.orchestrate</code></td></tr><tr><td>Upgrade</td><td>A l\'upgrade RING 9.5, accepter les nouvelles règles de sharding proposées par pdesc_manager.py</td></tr></table><h2>Scality Cloud Monitor</h2><p>Le <strong>Scality Cloud Monitor</strong> est un service optionnel qui réplique les dashboards Grafana et les alertes vers le cloud Scality. Il permet a l\'équipe Support Scality de surveiller le cluster client en temps reel.</p><ul><li>Activation via ticket support Scality (pas de configuration manuelle)</li><li>Les dashboards L1/L2 sont répliquer automatiquement</li><li>Aucune donnée client n\'est transmise, uniquement les metriques</li><li>Vérifier l\'activation : <code>Cloud Monitor: Yes/No</code> dans la page client Confluence</li></ul><h2>Collecte de Logs : Fluent-bit et Loki</h2><p>Depuis RING 9.5, la stack d\'observabilite couvre les <strong>metriques</strong> (Prometheus/Thanos) ET les <strong>logs</strong> (Fluent-bit + Loki). Les deux convergent dans Grafana.</p><h3>Fluent-bit — L\'agent de collecte</h3><p><strong>Fluent-bit</strong> est un agent de collecte de logs ultra-leger (&lt; 1 MB RAM) déployé sur chaque nœud. Il lit les logs système et applicatifs et les forward vers :</p><ul><li><strong>Loki</strong> : centralisation et consultation dans Grafana</li><li><strong>ClickHouse</strong> (port 8123) : logs d\'accès S3 pour analytics</li></ul><p>Fluent-bit joue pour les logs le même rôle que node_exporter pour les metriques : agent léger sur chaque nœud, sans impact sur le service RING.</p><h3>Loki — Agrégation de logs</h3><p><strong>Loki</strong> (Grafana Labs) centralise et indexe les logs du cluster. Contrairement a Elasticsearch, Loki <strong>n\'indexe que les métadonnées (labels)</strong> et non le contenu — bien moins gourmand en ressources.</p><table><tr><th>Caractéristique</th><th>Loki</th><th>Elasticsearch (ancien)</th></tr><tr><td>Indexation</td><td>Labels seulement</td><td>Full-text complet</td></tr><tr><td>Consommation RAM</td><td>Faible</td><td>Elevee</td></tr><tr><td>Intégration Grafana</td><td>Native</td><td>Via plugin</td></tr><tr><td>Usage dans RING</td><td>Depuis 9.5</td><td>Supprimé en 9.5.0</td></tr></table><div class="alert alert-i"><strong>Grafana comme interface unique :</strong> Grafana peut afficher metriques (Prometheus/Thanos) et logs (Loki) dans le même dashboard — correlation directe entre un pic de latence et les lignes de log correspondantes.</div><h3>Impact d\'une panne</h3><ul><li>Fluent-bit tombe : logs non centralises, toujours accessibles localement. Aucun impact service RING.</li><li>Loki tombe : logs inaccessibles depuis Grafana, presents localement. Aucun impact service RING.</li><li>ClickHouse tombe : S3 Analytics indisponible, Fluent-bit buffeurise. Aucun impact opérations S3.</li></ul><div class="kbox"><h3>Points Clés a Retenir</h3><ul><li>Supervisor = portail HTTPS centralise : Dashboard, Tasks, Monitoring, Identity, Logs</li><li>SupAPI Swagger : https://supervisor/apidoc/ — toutes les actions UI disponibles en REST</li><li>Authentification API : token JWT (Authorization: Bearer)</li><li>Prometheus sharding : ceil(N/12) shards, 2 nœuds par shard (paire HA)</li><li>/var : 100 GB min pour 12 nodes + 2 S3MC ; 150 GB pour 18 nodes + 3 S3MC</li><li>ringsh diagnostic : ringStatus, nodeStatus, nodeList — consultation uniquement (maintenance dans module MD)</li></ul></div>',
quiz:[
  {q:"Quel outil Scality surveille et redémarre automatiquement les services en cas de crash ?",opts:["Prometheus","MARS","Supervisor (supervisord)","Grafana"],ans:2,expl:"Supervisor (supervisord) est le daemon de surveillance des processus. Il démarre les services Scality et les redémarre automatiquement s'ils crashent."},
  {q:"Quelle commande ringsh affiche l'état de santé global du ring ?",opts:["ringHealth","ringStatus","ringCheck","ringList"],ans:1,expl:"ringStatus donne un aperçu global de l'état du ring : nombre de nœuds, statut, alertes actives. C'est la première commande à exécuter pour un diagnostic rapide."},
  {q:"Quel composant collecte les métriques des nœuds RING pour Prometheus ?",opts:["Grafana","AlertManager","MARS (Module d'Alarmes et de Remontée de Supervision)","Thanos"],ans:2,expl:"MARS collecte et normalise les événements d'alarme de chaque nœud et les expose au format Prometheus. C'est le pont entre les composants internes et le système de monitoring."},
  {q:"Quelle est la différence entre Prometheus et Thanos dans le contexte RING ?",opts:["Thanos remplace Prometheus","Prometheus collecte en temps réel, Thanos assuré la rétention long terme et la vue multi-cluster","Grafana utilisé Thanos, pas Prometheus","Thanos est un agent sur chaque nœud"],ans:1,expl:"Prometheus scrape les métriques à court terme. Thanos étend Prometheus avec du stockage long terme et permet d'agréger les métriques de plusieurs clusters dans Grafana."},
  {q:"À quoi sert la SupAPI ?",opts:["Superviser les backups","Interface REST pour contrôler/surveiller les processus supervisord sur chaque nœud","Configurer les alertes Prometheus","Gérer les quotas S3"],ans:1,expl:"SupAPI (Supervisor API) expose une interface REST permettant aux outils de monitoring et d'automation d'interroger et de contrôler supervisord sans connexion SSH directe."},
  {q:"Quelle commande ringsh liste tous les nœuds du ring avec leur statut ?",opts:["nodeStatus","ringStatus","nodeList","ringNodes"],ans:2,expl:"nodeList affiche la liste de tous les nœuds avec leur état (IN_SERVICE, OOS, OOS_PERM...). nodeStatus donne le détail d'un nœud spécifique."},
  {q:"Un opérateur remarque que Prometheus n'a plus de données depuis 2 heures. Quelle est la première cause à investiguer ?",opts:["Arrêter Grafana et le redémarrer","Vérifier que les exporters (MARS, node_exporter) sont actifs sur les nœuds et que Prometheus peut les joindre réseau","Augmenter la rétention Prometheus","Vider le cache Grafana"],ans:1,expl:"Si Prometheus n'a plus de données, la cause la plus probable est que le scrape échoue : exporter arrêté, problème réseau entre Prometheus et les nœuds, ou configuration de scrape incorrecte. Le restart de Grafana ne résoudrait rien car Grafana ne collecte pas les métriques."},
  {q:"Pourquoi utiliser AlertManager avec Prometheus plutôt que de gérer les alertes directement dans Grafana ?",opts:["Grafana ne supporte pas les alertes","AlertManager gère le routage, la déduplication, le groupement et les silences d'alertes de manière centralisée, indépendamment de la visualisation","AlertManager est moins cher","Prometheus n'envoie pas les alertes à Grafana"],ans:1,expl:"AlertManager sépare la logique d'alerte de la visualisation. Il gère la déduplication (évite le flood d'alertes), le groupement, le routage vers différents canaux (email, PagerDuty, Slack) et les silences planifiés — fonctions absentes de Grafana."}
],
title_en:'Monitoring and Observability',
desc_en:'Supervisor, Prometheus sizing, Grafana, ringsh, SupAPI',
content_en:'<h2>The Scality Supervisor — Central Administration Portal</h2><p>The <strong>Supervisor</strong> is the centralized web interface for administering the entire RING cluster. It relies on <strong>Salt</strong> (distributed configuration management) to orchestrate operations across all servers. Access is strictly via <strong>HTTPS</strong>: <code>https://&lt;supervisor-fqdn&gt;</code>.</p><h3>Main Supervisor sections</h3><table><tr><th>Section</th><th>Content</th></tr><tr><td><strong>Dashboard</strong></td><td>Global view of cluster health: RINGs, nodes, disks, active alerts in real time</td></tr><tr><td><strong>Administration</strong></td><td>RING parameters (join_auto, rebuild_auto, chordpurge), disk management, cluster expansion</td></tr><tr><td><strong>Monitoring</strong></td><td>Real-time metrics, link to Grafana, Nagios alert history</td></tr><tr><td><strong>Tasks</strong></td><td>Tracking of running tasks (Balance, Rebuild, GC, Repair) with progress and logs</td></tr><tr><td><strong>Identity</strong></td><td>User and role management (SSO since 9.4.0)</td></tr><tr><td><strong>Logs</strong></td><td>Centralized log aggregation from all cluster components</td></tr></table><h3>RING states in the Supervisor</h3><table><tr><th>Displayed state</th><th>Meaning</th><th>Action</th></tr><tr><td>RUN</td><td>RING nominal, all tasks executing correctly</td><td>None</td></tr><tr><td>RUN + CONF_MISMATCH</td><td>RING operational but configuration differs between nodes (normal post-Supervisor upgrade)</td><td>Continue upgrading the nodes</td></tr><tr><td>INCOMPLETE</td><td>Some objects have fewer replicas than required</td><td>Let Rebuild/Repair work; investigate if persistent</td></tr><tr><td>ARC_REBUILD_NOK</td><td>ARC reconstruction impossible (too many fragments lost)</td><td>Contact Scality Support IMMEDIATELY</td></tr><tr><td>SPLIT LOOP</td><td>Network partition between nodes</td><td>Diagnose network connectivity</td></tr></table><h2>SupAPI — Automation via REST</h2><p>All actions available in the Supervisor UI are also exposed via the <strong>REST API (SupAPI)</strong>. This is the foundation for automation, maintenance scripts, and integration with third-party tools (Ansible, ops scripts, ITSM).</p><h3>Access and authentication</h3><ul><li>Interactive Swagger documentation: <code>https://&lt;supervisor&gt;/apidoc/</code></li><li>Authentication via <strong>JWT</strong> token: obtained via POST on the login endpoint</li><li>The token has a limited lifetime (configurable, typically 1 hour)</li><li>All requests carry the header <code>Authorization: Bearer &lt;token&gt;</code></li></ul><h3>Common API call examples</h3><pre># Obtain a JWT token\\ncurl -k -X POST https://supervisor/api/v0.1/auth/login \\\\\\n  -H "Content-Type: application/json" \\\\\\n  -d \'{"username":"admin","password":"mypassword"}\'\\n\\n# List RINGs in the cluster\\ncurl -k -H "Authorization: Bearer $TOKEN" \\\\\\n  https://supervisor/api/v0.1/ring\\n\\n# Status of a specific RING\\ncurl -k -H "Authorization: Bearer $TOKEN" \\\\\\n  https://supervisor/api/v0.1/ring/myring/status\\n\\n# List disks on a node\\ncurl -k -H "Authorization: Bearer $TOKEN" \\\\\\n  https://supervisor/api/v0.1/node/storage1/disk</pre><h2>Prometheus — Metrics Collection Architecture</h2><p>RING metrics collection is handled by <strong>Prometheus</strong>, deployed on dedicated servers. Prometheus periodically scrapes the <code>/metrics</code> endpoints of each RING component and stores time series in its internal database (TSDB). <strong>Grafana</strong> then queries Prometheus to build dashboards.</p><h3>Prometheus sharding model</h3><p>For large clusters, a single Prometheus instance cannot ingest all metrics in time. Scality uses a <strong>Prometheus shard</strong> model, with each shard covering a subset of nodes:</p><div class="adiag">Formula: nb_shards = ceil(N_storage_nodes / 12)\\n         nb_prometheus_nodes = nb_shards x 2  (HA pair)\\n\\nSummary table:\\n  N nodes  | Shards | Prometheus nodes\\n  ---------+--------+------------------\\n     1-12  |   1    |        2\\n    13-24  |   2    |        4\\n    25-36  |   3    |        6\\n    37-48  |   4    |        8</div><h3>Minimum disk space on /var</h3><table><tr><th>Cluster configuration</th><th>Minimum /var space</th></tr><tr><td>Fewer than 12 storage nodes</td><td>Standard (50 GB)</td></tr><tr><td>&gt;= 12 nodes + 2 S3 META clusters (S3MC)</td><td><strong>100 GB</strong></td></tr><tr><td>&gt;= 18 nodes + 3 S3 META clusters (S3MC)</td><td><strong>150 GB</strong></td></tr></table><div class="alert alert-w">Verify BEFORE any upgrade that /var has sufficient space. A lack of space during an upgrade will block the process in an intermediate state that is difficult to recover from.</div><h2>ringsh — Cluster CLI Diagnostic Tool</h2><p><code>ringsh</code> allows querying the cluster state directly from the command line on the Supervisor. Useful for quick diagnostics and health checks without going through the UI. Maintenance commands (nodeLeave, nodeJoin, ringConfigSet) are covered in the RING Maintenance module.</p><h3>Read-only commands</h3><pre># List and status of RINGs\\nringsh supervisor ringList              # list all RINGs\\nringsh supervisor ringStatus &lt;RING&gt;    # status of a RING (RUN/INCOMPLETE...)\\n\\n# List and status of nodes\\nringsh supervisor nodeList &lt;RING&gt;      # list nodes in a RING\\nringsh supervisor nodeStatus &lt;NODE&gt;:/ # detailed status of a node</pre><h3>Node states (nodeStatus)</h3><ul><li><strong>RUN</strong>: node active, participating in the RING, responding to requests</li><li><strong>OUT_OF_SERVICE</strong>: node under maintenance, removed from the RING</li><li><strong>JOINING</strong>: node in the process of joining the RING</li><li><strong>LEAVING</strong>: node in the process of leaving the RING</li></ul><h2>Grafana and Nagios</h2><ul><li><strong>Grafana</strong>: graphical interface for visualizing Prometheus metrics. Pre-configured Scality dashboards included with the Supervisor.</li><li><strong>Nagios</strong>: traditional alerting tool. Scality checks integrate into an existing Nagios infrastructure to generate PagerDuty/email/SMS alerts.</li></ul><h2>Troubleshooting S3 "UNAVAILABLE" in the Supervisor GUI</h2><p>Since RING 9.5, the S3 status calculation in the Supervisor is based on <strong>Prometheus/Thanos</strong> (no longer Elasticsearch). When S3 appears as "UNAVAILABLE" in red in the GUI, the diagnostic procedure is:</p><pre># 1. Check active Prometheus alerts for S3\\nhttps://&lt;supervisor_fqdn&gt;/prometheus/alerts\\n\\n# 2. Or via PromQL in Grafana Explore:\\nring_alerts{domain="s3", alertstate="firing"}\\n\\n# 3. Manual S3 health check\\n/usr/bin/scality-compute-s3-health -c /etc/scality/s3-healthcheck/config.yaml\\n\\n# 4. Check the health check cron\\nls -lh /etc/cron.d/scality-compute-s3-health</pre><p>Common causes of "S3 UNAVAILABLE" after RING 9.5:</p><ul><li>An S3 container in crash (check with <code>ctrctl ps</code> on md nodes)</li><li>An active raft alert (S3RaftNoLeaderCritical, S3RaftNotEnoughFollowersCritical)</li><li>Prometheus itself in error (check S3 metrics scrape)</li><li>Spurious metrics spike after a Prometheus restart — wait 2-3 minutes</li></ul><h2>Prometheus Sharding (RING 9.5+)</h2><p>Since RING 9.5, Prometheus can be <strong>sharded</strong> across multiple servers for large clusters. Each shard monitors a subset of servers.</p><table><tr><th>Aspect</th><th>Detail</th></tr><tr><td>Management tool</td><td><code>pdesc_manager.py</code> — manages Prometheus roles in the cluster.csv file</td></tr><tr><td>Configuration</td><td>In scality-common.sls: <code>prometheus.shards.shard1.monitored_servers</code></td></tr><tr><td>After modification</td><td><code>salt \'*\' saltutil.refresh_pillar</code> then <code>salt-run state.orchestrate prometheus.orchestrate</code></td></tr><tr><td>Upgrade</td><td>When upgrading to RING 9.5, accept the new sharding rules proposed by pdesc_manager.py</td></tr></table><h2>Scality Cloud Monitor</h2><p>The <strong>Scality Cloud Monitor</strong> is an optional service that replicates Grafana dashboards and alerts to the Scality cloud. It allows the Scality Support team to monitor the customer cluster in real time.</p><ul><li>Activation via Scality support ticket (no manual configuration)</li><li>L1/L2 dashboards replicated automatically</li><li>No customer data transmitted, only metrics</li><li>Check activation status: <code>Cloud Monitor: Yes/No</code> on the customer Confluence page</li></ul><h2>Log Collection: Fluent-bit and Loki</h2><p>Since RING 9.5, the observability stack covers both <strong>metrics</strong> (Prometheus/Thanos) and <strong>logs</strong> (Fluent-bit + Loki). Both converge in Grafana.</p><h3>Fluent-bit — The collection agent</h3><p><strong>Fluent-bit</strong> is an ultra-lightweight log collection agent (&lt; 1 MB RAM) deployed on each node. It reads system and application logs and forwards them to:</p><ul><li><strong>Loki</strong>: centralization and browsing in Grafana</li><li><strong>ClickHouse</strong> (port 8123): S3 access logs for analytics</li></ul><p>Fluent-bit plays the same role for logs as node_exporter does for metrics: a lightweight agent on each node, with no impact on the RING service.</p><h3>Loki — Log aggregation</h3><p><strong>Loki</strong> (Grafana Labs) centralizes and indexes cluster logs. Unlike Elasticsearch, Loki <strong>indexes only metadata (labels)</strong> and not the content — far less resource-intensive.</p><table><tr><th>Characteristic</th><th>Loki</th><th>Elasticsearch (legacy)</th></tr><tr><td>Indexing</td><td>Labels only</td><td>Full-text complete</td></tr><tr><td>RAM consumption</td><td>Low</td><td>High</td></tr><tr><td>Grafana integration</td><td>Native</td><td>Via plugin</td></tr><tr><td>Usage in RING</td><td>Since 9.5</td><td>Removed in 9.5.0</td></tr></table><div class="alert alert-i"><strong>Grafana as a single interface:</strong> Grafana can display both metrics (Prometheus/Thanos) and logs (Loki) in the same dashboard — enabling direct correlation between a latency spike and the corresponding log lines.</div><h3>Impact of a failure</h3><ul><li>Fluent-bit down: logs not centralized, still accessible locally. No RING service impact.</li><li>Loki down: logs inaccessible from Grafana, present locally. No RING service impact.</li><li>ClickHouse down: S3 Analytics unavailable, Fluent-bit buffers. No impact on S3 operations.</li></ul><div class="kbox"><h3>Key Takeaways</h3><ul><li>Supervisor = centralized HTTPS portal: Dashboard, Tasks, Monitoring, Identity, Logs</li><li>SupAPI Swagger: https://supervisor/apidoc/ — all UI actions available via REST</li><li>API authentication: JWT token (Authorization: Bearer)</li><li>Prometheus sharding: ceil(N/12) shards, 2 nodes per shard (HA pair)</li><li>/var: 100 GB min for 12 nodes + 2 S3MC; 150 GB for 18 nodes + 3 S3MC</li><li>ringsh diagnostics: ringStatus, nodeStatus, nodeList — read-only (maintenance in MD module)</li></ul></div>',
quiz_en:[
  {q:"Which Scality tool monitors and automatically restarts services in the event of a crash?",opts:["Prometheus","MARS","Supervisor (supervisord)","Grafana"],ans:2,expl:"Supervisor (supervisord) is the process monitoring daemon. It starts Scality services and automatically restarts them if they crash."},
  {q:"Which ringsh command displays the overall health status of the ring?",opts:["ringHealth","ringStatus","ringCheck","ringList"],ans:1,expl:"ringStatus gives a global overview of the ring state: number of nodes, status, active alerts. It is the first command to run for a quick diagnostic."},
  {q:"Which component collects metrics from RING nodes for Prometheus?",opts:["Grafana","AlertManager","MARS (Monitoring Alarm and Reporting System)","Thanos"],ans:2,expl:"MARS collects and normalizes alarm events from each node and exposes them in Prometheus format. It is the bridge between internal components and the monitoring system."},
  {q:"What is the difference between Prometheus and Thanos in the RING context?",opts:["Thanos replaces Prometheus","Prometheus collects in real time, Thanos provides long-term retention and a multi-cluster view","Grafana uses Thanos, not Prometheus","Thanos is an agent on each node"],ans:1,expl:"Prometheus scrapes short-term metrics. Thanos extends Prometheus with long-term storage and allows aggregating metrics from multiple clusters in Grafana."},
  {q:"What is SupAPI used for?",opts:["Supervising backups","REST interface to control/monitor supervisord processes on each node","Configuring Prometheus alerts","Managing S3 quotas"],ans:1,expl:"SupAPI (Supervisor API) exposes a REST interface allowing monitoring and automation tools to query and control supervisord without a direct SSH connection."},
  {q:"Which ringsh command lists all nodes in the ring with their status?",opts:["nodeStatus","ringStatus","nodeList","ringNodes"],ans:2,expl:"nodeList displays the list of all nodes with their state (IN_SERVICE, OOS, OOS_PERM...). nodeStatus gives the detail of a specific node."},
  {q:"An operator notices that Prometheus has had no data for 2 hours. What is the first cause to investigate?",opts:["Stop Grafana and restart it","Verify that exporters (MARS, node_exporter) are active on the nodes and that Prometheus can reach them over the network","Increase Prometheus retention","Clear the Grafana cache"],ans:1,expl:"If Prometheus has no data, the most likely cause is that scraping is failing: an exporter is down, there is a network issue between Prometheus and the nodes, or the scrape configuration is incorrect. Restarting Grafana would not help since Grafana does not collect metrics."},
  {q:"Why use AlertManager with Prometheus rather than managing alerts directly in Grafana?",opts:["Grafana does not support alerts","AlertManager handles routing, deduplication, grouping, and alert silencing in a centralized way, independently of visualization","AlertManager is less expensive","Prometheus does not send alerts to Grafana"],ans:1,expl:"AlertManager separates alerting logic from visualization. It handles deduplication (prevents alert flooding), grouping, routing to different channels (email, PagerDuty, Slack), and scheduled silences — features absent from Grafana."}
]},
{id:'06',num:'06',title:'Gestion des Disques',desc:'Biziod, biziotools, scaldisk, états des disques, OOS_PERM',
content:'<h2>Les Deux Outils de Gestion des Disques</h2><p>Scality fournit deux outils CLI complémentaires pour la gestion des disques, operant a des niveaux d\'abstraction différents :</p><h3>biziotools — Niveau Biziod (bas niveau)</h3><p><code>biziotools</code> interagit directement avec le daemon Biziod. Il permet d\'inspecter les structures internes de stockage :</p><ul><li><strong>Lister les fichiers container</strong> sur un disque donne (leur taille, leur taux de remplissage)</li><li><strong>Inspecter les chunks</strong> a l\'interieur des containers (clé, taille, offset)</li><li><strong>Vérifier la cohérence</strong> entre l\'index SSD et les données HDD</li><li><strong>Forcer le flush</strong> des écritures en attente dans un Biziod</li></ul><pre># Exemples biziotools\nbiziotools list-containers /data/disk01\nbiziotools chunk-info /data/disk01 &lt;chunk_id&gt;\nbiziotools check-index /data/disk01</pre><h3>scaldisk — Niveau Cluster (haut niveau)</h3><p><code>scaldisk</code> opere au niveau du cluster pour la gestion du cycle de vie des disques :</p><ul><li><strong>Déclarer un nouveau disque</strong> dans le RING (après ajout physique)</li><li><strong>Retirer un disque</strong> proprement (évacuation des données avant decommission)</li><li><strong>Vérifier la sante</strong> d\'un disque (état SMART, erreurs I/O recentes)</li><li><strong>Forcer l\'état OOS</strong> d\'un disque défaillant pour protection immédiate</li></ul><pre># Exemples scaldisk\nscaldisk list                   # état de tous les disques\nscaldisk add /dev/sdb           # ajouter un disque au RING\nscaldisk evacuate /dev/sdb      # évacuer les données avant retrait\nscaldisk set-oos /dev/sdb       # forcer OOS d\'urgence</pre><h2>Cycle de Vie et États des Disques</h2><p>Chaque disque dans le RING passe par plusieurs états au cours de sa vie. Comprendre ces états est essentiel pour la gestion proactive :</p><div class="adiag">+--------+     +----------+     +-------+     +---------+\n|  NEW   | --> |   OK     | --> | WARN  | --> |  ERROR  |\n+--------+     +----------+     +-------+     +---------+\n(déclaré)      (opérationnel)   (premiers      (erreurs\n                                 signaux)       significatives)\n                                                    |\n                                                    v\n                                               +--------+     +-----------+\n                                               |  OOS   | --> | OOS_PERM  |\n                                               +--------+     +-----------+\n                                               (retrait        (remplacement\n                                                temporaire)     physique)</div><table><tr><th>État</th><th>Signification détaillée</th><th>Action opérationnelle</th></tr><tr><td><code>OK</code></td><td>Disque pleinement opérationnel. Aucune erreur SMART, I/O normaux, taux de remplissage acceptable.</td><td>Aucune. Surveiller via Grafana.</td></tr><tr><td><code>WARNING</code></td><td>Premiers signaux de dégradation : compteurs SMART en augmentation, quelques erreurs I/O sporadiques, latences élevées occasionnelles. Disque encore fonctionnel.</td><td>Planifier le remplacement prochainement. Augmenter la fréquence de monitoring.</td></tr><tr><td><code>ERROR</code></td><td>Erreurs I/O significatives et répétées. Le disque répond encore mais de façon non fiable. Le RING peut avoir marqué certains objets comme INCOMPLETE.</td><td>Planifier le remplacement urgent. Vérifier l\'état des données (Rebuild en cours ?).</td></tr><tr><td><code>OOS</code></td><td>Out of Service temporaire. Le disque est retire du RING mais peut être remis en service. Le RING reconstruit les données manquantes sur d\'autres disques.</td><td>Maintenance en cours (remplacement temporaire, firmware update...). Ne pas laisser trop longtemps.</td></tr><tr><td><code>OOS_PERM</code></td><td>Out of Service Permanent. Le disque est definitivement déclaré hors service. Le RING a reconstruit ou est en train de reconstruire les données manquantes.</td><td><strong>Remplacer physiquement le disque. Ne JAMAIS le remettre en service.</strong></td></tr></table><div class="alert alert-d">OOS_PERM est irréversible : une fois un disque marqué OOS_PERM, il ne peut plus rejoindre le RING. Tenter de le remettre manuellement en service sans suivre la procédure de déclaration d\'un nouveau disque corromprait l\'index MESA.</div><h2>Procédure de Remplacement d\'un Disque</h2><ol><li><strong>Détection</strong> : le Supervisor ou Grafana alerte sur un disque ERROR ou OOS_PERM.</li><li><strong>Évacuation logicielle</strong> : le disque passe en OOS, le RING lance le Rebuild pour reconstituer les données manquantes sur d\'autres disques disponibles.</li><li><strong>Attendre le Rebuild</strong> : ne pas remplacer physiquement avant que le RING soit revenu en état RUN (toutes les données du disque ont ete reconstituées ailleurs).</li><li><strong>Remplacement physique</strong> : changer le disque défaillant.</li><li><strong>Déclaration</strong> : utiliser <code>scaldisk add</code> pour déclarer le nouveau disque dans le RING.</li><li><strong>Rééquilibrage</strong> : le RING lance automatiquement un Balance pour répartir les données sur le nouveau disque.</li></ol><div class="alert alert-w">Remplacer un disque OOS_PERM AVANT la fin du Rebuild est risque : si un autre disque tombe en panne pendant la reconstruction, on peut atteindre le seuil de perte de données (plus de M fragments ARC perdus simultanément).</div><h2>Gestion de la Capacité Disque</h2><p>La surveillance du taux de remplissage des disques est critique. Deux seuils déclenchent des alertes dans le Supervisor :</p><ul><li><strong>DISK USAGE WARNING</strong> : un seuil configurable (ex: 75%) est atteint. Alerte preventive.</li><li><strong>DISK_FULL</strong> : le disque est plein. Le RING ne peut plus écrire de nouvelles données sur ce disque. État critique necessitant une action immédiate (ajout de capacité ou suppression de données).</li></ul><h2>L\'Index SSD — Criticité et Protection</h2><p>L\'index SSD de chaque Biziod est le composant le plus critique du système de stockage physique. Sa perte (sans perte du HDD associé) ne cause pas de perte de données mais nécessite une reconstruction coûteuse :</p><ul><li>La reconstruction de l\'index consiste a relire <em>tous les containers HDD</em> pour reconstruire la table de correspondance cle->offset.</li><li>Cette opération peut durer plusieurs heures sur de grands disques (plusieurs TB).</li><li>Pendant la reconstruction, le Biziod ne répond pas : ses données semblent manquantes, ce qui peut déclencher un Rebuild ARC inutile.</li></ul><p>Bonnes pratiques pour les SSD d\'index :</p><ul><li>Utiliser des SSD <strong>entreprise</strong> avec protection anti-panne de courant (condensateurs)</li><li>Monitorer le niveau d\'usure (wear level) via S.M.A.R.T.</li><li>Envisager RAID1 sur les SSD d\'index pour les environnements critiques</li></ul><h2>Remplacement d\'un Disque DATA</h2><p>Quand un disque DATA tombe en panne, la procédure de remplacement suit des étapes precises pour éviter toute perte de données. Le RING doit être sain (protection intègre) avant de commencer.</p><h3>Procédure scaldisk (étapes clés)</h3><div class="adiag">1. Marquer le disque comme hors service permanent\n   scaldisk iods set disk07 OOS_PERM\n   -> Le RING cesse d\'utiliser ce disque et lance le Rebuild sur les autres\n\n2. Arrêter le service scality-iod pour ce disque\n   systemctl stop scality-iod@disk07\n\n3. Remplacement physique du disque (intervention hardware)\n\n4. Déclarer le nouveau disque dans Salt/scaldisk\n   scaldisk add -c /dev/sdX        # ajoute le nouveau disque\n   # ou\n   scaldisk replace -c /dev/sdX -d disk07  # remplacement direct (avec RAID plugin)\n\n5. Créer un nouveau store sur le disque\n   bizioopen -c -N disk07 bizobj://DATA_RING\n\n6. Effacer le flag OOS_PERM\n   scaldisk iods clear disk07\n   -> Le RING
