tion</th><th>Impact keyspace</th></tr><tr><td><strong>Disk Expansion</strong></td><td>Ajout de disques sur des serveurs existants. Procedure simple : scaldisk add sur chaque serveur.</td><td>Pas de modification du keyspace. Le RING reequilibre automatiquement.</td></tr><tr><td><strong>Server Expansion</strong></td><td>Ajout de nouveaux serveurs au RING. Plus complexe : necessite la mise a jour du keyspace et la validation Scality.</td><td>Nouveau keyspace calcule par l\'equipe ExVT Scality. Application via procedure dediee.</td></tr></table><p class="alert-d"><strong>Validation Scality obligatoire</strong> avant toute expansion serveurs. Soumettre un ticket de validation via Zendesk avec la configuration actuelle et prevue. Une expansion non validee peut desequilibrer le RING et degrader les performances.</p><h3>Verifier l\'equilibre du RING apres expansion</h3><pre># Etat de la memoire et des disques sur tous les noeuds\ndate; salt -s \'*\' cmd.run \'free -h\'\ndate; salt -s \'*\' cmd.run \'df -h\'\n\n# Status du RING\nringsh supervisor ringStatus DATA\n\n# Si le RING est desequilibre apres ajout de disques :\n# Utiliser l\'outil scality-official-tooling/capacity_and_balances</pre><div class="kbox"><h3>Points Cles a Retenir</h3><ul><li>biziotools = niveau Biziod (containers, chunks, index) -- outil bas niveau</li><li>scaldisk = niveau cluster (declaration, evacuation, sante) -- outil haut niveau</li><li>Cycle : OK -> WARNING -> ERROR -> OOS -> OOS_PERM (irreversible)</li><li>OOS_PERM = remplacement physique obligatoire, ne JAMAIS remettre en service</li><li>Attendre la fin du Rebuild avant de remplacer physiquement</li><li>SSD d\'index : critique, reconstruction longue si perdu, monitorer le wear level</li></ul></div>',
quiz:[
{q:"Que signifie l'etat OOS_PERM pour un disque RING ?",opts:["Out Of Space Permanently (disque plein)","Out Of Service Permanent (disque a remplacer physiquement)","Offline Temporarily (maintenance)","Operational System Paused"],ans:1,expl:"OOS_PERM = Out Of Service Permanent. Le disque est definitivement hors service et doit etre remplace physiquement. Le RING aura reconstruit les donnees manquantes."},
{q:"Quel outil CLI gere les disques au niveau bas (fichiers container, chunks Biziod) ?",opts:["scaldisk","ringsh","biziotools","diskctl"],ans:2,expl:"biziotools opere au niveau bas du Biziod (fichiers container, chunks). scaldisk est le niveau superieur."},
{q:"Pourquoi l'index Biziod doit-il etre sur un SSD dedie ?",opts:["Economie d'espace","Performance critique : lookups rapides pour chaque acces objet","Durabilite superieure","Exigence de licence Scality"],ans:1,expl:"L'index SSD permet des lookups ultra-rapides sur chaque requete. Mettre l'index sur HDD degraderait massivement les performances I/O."},
{q:"Un disque passe en etat ERROR. Quelle est la premiere action recommandee ?",opts:["Supprimer le disque immediatement","Planifier le remplacement -- il est encore fonctionnel","Reformater le disque","Arreter le serveur storage"],ans:1,expl:"Un disque ERROR est encore fonctionnel mais presente des erreurs I/O significatives. On planifie le remplacement. OOS_PERM serait l'etat qui necessite un remplacement immediat."},
{q:"Lors du remplacement d'un disque chiffre LUKS, quelle option scaldisk est obligatoire ?",opts:["scaldisk replace --encrypt","scaldisk replace --luks","scaldisk add --luks-key","scaldisk replace --nbde"],ans:1,expl:"scaldisk replace --luks est l'option specifique pour les disques chiffres. Elle genere une nouvelle cle LUKS et configure le dechiffrement automatique via NBDE/TANG+clevis. Sans cette option, le nouveau disque ne sera pas chiffre, creant une incoherence de securite."},
{q:"Quelle difference operationnelle distingue une 'Disk Expansion' d'une 'Server Expansion' dans RING ?",opts:["Disk Expansion = ajout de serveurs ; Server Expansion = ajout de disques","Disk Expansion = ajout de disques sur serveurs existants (pas de changement keyspace) ; Server Expansion = ajout de serveurs (validation keyspace ExVT obligatoire)","Les deux sont identiques","Disk Expansion est online ; Server Expansion necessite une maintenance"],ans:1,expl:"Disk Expansion (nouveaux disques sur serveurs existants) ne modifie pas le keyspace. Server Expansion (nouveaux serveurs) redistribue le keyspace Chord et necessite une validation par l'equipe ExVT Scality avant mise en production — sans quoi les donnees peuvent etre mal distribuees."}
]},
{id:'M7',num:'07',title:'Taches RING',desc:'Balance, GC, Rebuild, Repair, Purge, Relocation et throttling',
content:'<h2>Vue d\'Ensemble des Taches de Fond</h2><p>Le RING execute en permanence des <strong>taches de fond (background tasks)</strong> pour maintenir l\'integrite, l\'equilibre et la disponibilite des donnees. Ces taches sont orchestrees par le Supervisor et s\'executent de facon asynchrone sans impacter (idealement) les I/O de production. Chacune repond a un besoin precis :</p><table><tr><th>Tache</th><th>Declencheur principal</th><th>Objectif</th><th>Priorite</th></tr><tr><td><strong>Rebuild</strong></td><td>Fragments ARC manquants (panne disque/serveur)</td><td>Reconstituer les fragments ARC perdus</td><td>HAUTE</td></tr><tr><td><strong>Repair</strong></td><td>Repliques COS insuffisantes</td><td>Ramener COS au nombre de repliques requis</td><td>HAUTE</td></tr><tr><td><strong>Balance</strong></td><td>Desequilibre de charge entre nodes</td><td>Repartir les donnees uniformement</td><td>MOYENNE</td></tr><tr><td><strong>Relocation</strong></td><td>Ajout de nouveaux nodes (expansion)</td><td>Migrer les objets vers les nouveaux nodes</td><td>MOYENNE</td></tr><tr><td><strong>Garbage Collector</strong></td><td>Deletion d\'objets / fragments orphelins</td><td>Liberer l\'espace disque des objets supprimes</td><td>BASSE</td></tr><tr><td><strong>Purge</strong></td><td>Versioning S3 / anciennes versions</td><td>Supprimer les versions d\'objets obsoletes</td><td>BASSE</td></tr><tr><td><strong>Chord Purge</strong></td><td>Fin de maintenance d\'un node</td><td>Nettoyer les entrees P2P obsoletes</td><td>BASSE</td></tr></table><h2>Rebuild — La Tache la Plus Critique</h2><p>Le <strong>Rebuild</strong> est la tache la plus importante car elle protege directement contre la perte de donnees. Elle est declenchee automatiquement des qu\'un fragment ARC est detecte comme manquant.</p><h3>Deroulement d\'un Rebuild ARC</h3><ol><li><strong>Detection</strong> : un Biziod cible est inaccessible. Le Bizstorenode responsable detecte que le fragment est manquant.</li><li><strong>Evaluation</strong> : combien de fragments sont disponibles ? Si &gt;= K fragments disponibles, le Rebuild est possible.</li><li><strong>Recuperation</strong> : le RING lit les K fragments disponibles depuis leurs Biziod respectifs.</li><li><strong>Decodage</strong> : l\'objet original est reconstruit en memoire (decodage Reed-Solomon).</li><li><strong>Re-encodage</strong> : les fragments manquants sont recalcules.</li><li><strong>Ecriture</strong> : les nouveaux fragments sont ecrits sur des Biziod de remplacement (autre disque, autre serveur).</li><li><strong>Mise a jour MESA</strong> : l\'entree MESA est mise a jour avec les nouveaux emplacements.</li></ol><div class="alert alert-d">Si le nombre de fragments disponibles tombe en dessous de K (seuil minimum pour le decodage), le Rebuild echoue et l\'objet est irrecuperable. Le RING passe en etat ARC_REBUILD_NOK. Contacter Scality Support immediatement.</div><h3>Suivi du Rebuild</h3><p>Le Rebuild est visible dans la section Tasks du Supervisor avec :</p><ul><li>Nombre d\'objets en cours de reconstruction</li><li>Vitesse de progression (objets/heure)</li><li>Estimation du temps restant</li></ul><h2>Repair — Reconstruction des Repliques COS</h2><p>Le <strong>Repair</strong> est l\'equivalent du Rebuild pour les objets en replication COS. Il est declenche quand un objet COS a moins de repliques que le facteur requis :</p><ul><li>Le RING detecte qu\'un objet COS 3 n\'a que 2 repliques (panne d\'un node).</li><li>Une des repliques existantes est lue.</li><li>L\'objet est reecrit sur un Bizstorenode disponible pour recreer la 3eme replique manquante.</li><li>MESA est mise a jour.</li></ul><p>L\'etat <code>INCOMPLETE</code> dans le Supervisor indique que des objets ont un nombre insuffisant de repliques COS (Repair en attente ou en cours).</p><h2>Balance — Equilibrage des Donnees</h2><p>Le <strong>Balance</strong> est declenche lorsqu\'une inegalite de remplissage est detectee entre Bizstorenode. Les scenarios classiques :</p><ul><li><strong>Apres un upgrade</strong> : un node arrete et redemmarre vide peut attirer moins de nouvelles donnees que les autres.</li><li><strong>Apres un Rebuild intensif</strong> : certains disques sont plus charges que d\'autres apres la reconstruction.</li><li><strong>Apres une expansion</strong> : les nouveaux nodes sont vides, les anciens sont pleins.</li></ul><div class="alert alert-w">Lors d\'un upgrade RING, ne pas passer au serveur suivant tant que le Balance n\'est pas termine sur le serveur precedent. Un Balance interrompu laisse le RING dans un etat desequilibre qui risque de provoquer un DISK_FULL premature sur certains nodes.</div><h2>Relocation — Migration Lors d\'une Expansion</h2><p>Quand de nouveaux Bizstorenode rejoignent le RING (expansion), ils obtiennent des segments du keyspace des anciens nodes. La <strong>Relocation</strong> migre les objets correspondants vers leur nouvel emplacement :</p><ol><li>Calcul des nouveaux segments de keyspace pour les nouveaux nodes.</li><li>Pour chaque objet dont la cle appartient desormais a un nouveau node : lecture depuis l\'ancien emplacement, ecriture vers le nouveau.</li><li>Mise a jour MESA.</li><li>Suppression de l\'ancienne copie (GC).</li></ol><h2>Garbage Collector — Nettoyage des Orphelins</h2><p>Le <strong>GC</strong> libere l\'espace occupe par des chunks qui ne sont plus references dans MESA :</p><ul><li>Chunks ecrits mais dont l\'objet a ete supprime ensuite</li><li>Fragments partiels d\'une ecriture avortee (timeout, erreur reseau)</li><li>Anciennes versions d\'objets dont le Purge n\'a pas encore ete execute</li></ul><p>Le GC tourne en basse priorite car il n\'est pas urgent — les chunks orphelins n\'affectent pas la disponibilite, seulement la capacite disque disponible.</p><h2>Throttling — Controle de l\'Impact sur la Production</h2><p>Chaque tache peut etre <strong>throttlee</strong> pour limiter son impact sur les I/O de production. Le Throttling est configurable :</p><ul><li><strong>Par tache</strong> : Rebuild peut etre throttle a 50 MB/s, GC a 10 MB/s</li><li><strong>Par priorite</strong> : les I/O de production sont toujours prioritaires sur les taches de fond</li><li><strong>Plage horaire</strong> : possibilite de n\'executer les taches lourdes que la nuit</li></ul><p>Configuration via l\'Administration du Supervisor : <code>Administration &gt; General &gt; Task Throttling</code></p><h2>Parametres de Controle des Taches (ringsh)</h2><pre># Mode maintenance : desactiver les taches automatiques\nringsh supervisor ringConfigSet &lt;RING&gt; join_auto 0        # desactive auto-join\nringsh supervisor ringConfigSet &lt;RING&gt; rebuild_auto 0     # desactive auto-rebuild\nringsh supervisor ringConfigSet &lt;RING&gt; chordpurge_enable 0 # desactive chord purge\n\n# Reprise normale apres maintenance\nringsh supervisor ringConfigSet &lt;RING&gt; join_auto 2        # reactive auto-join\nringsh supervisor ringConfigSet &lt;RING&gt; rebuild_auto 1     # reactive auto-rebuild\nringsh supervisor ringConfigSet &lt;RING&gt; chordpurge_enable 1 # reactive chord purge</pre><div class="kbox"><h3>Points Cles a Retenir</h3><ul><li>Rebuild = reconstitution fragments ARC perdus (tache la plus critique, priorite haute)</li><li>Repair = reconstitution repliques COS manquantes (meme priorite)</li><li>ARC_REBUILD_NOK = Rebuild impossible car trop de fragments perdus (perte de donnees)</li><li>Balance = reequilibrage du remplissage entre nodes (apres upgrade/expansion)</li><li>Relocation = migration des objets vers les nouveaux nodes lors d\'une expansion</li><li>GC = nettoyage des chunks orphelins (libere espace, basse priorite)</li><li>Throttling = limite l\'impact des taches sur les I/O de production</li></ul></div>',
quiz:[
{q:"Quelle tache RING reconstruit les fragments ARC manquants apres une panne de disque ?",opts:["Repair","Rebuild","Balance","GC"],ans:1,expl:"Rebuild reconstruit les fragments ARC perdus en utilisant les fragments restants. Repair s'occupe des repliques COS manquantes."},
{q:"Quelle tache RING supprime les objets orphelins non references dans MESA ?",opts:["Purge","Repair","Garbage Collector","Balance"],ans:2,expl:"Le Garbage Collector (GC) supprime les chunks non references dans MESA (objets orphelins). Purge supprime les anciennes versions d'objets."},
{q:"Quelle tache est declenchee lors d'une expansion du RING (ajout de serveurs) ?",opts:["GC","Rebuild","Relocation","Purge"],ans:2,expl:"La Relocation deplace les objets vers les nouveaux nodes lors d'une expansion. Le Balance reequilibre egalement les donnees."},
{q:"Lors d'un upgrade RING, quel etat doit etre atteint avant de passer au serveur suivant ?",opts:["CONF_MISMATCH BALANCING","RUN (avec ou sans CONF_MISMATCH)","INCOMPLETE","SPLIT LOOP"],ans:1,expl:"Avant d'upgrader le serveur suivant, attendre que le RING soit en etat RUN (CONF_MISMATCH est acceptable). Cela garantit que la tolerance aux pannes est restauree."}
]},
{id:'M8',num:'08',title:'Gestion des Erreurs',desc:'INCOMPLETE, ARC_REBUILD_NOK, CONF_MISMATCH, SPLIT LOOP et resolutions',
content:'<h2>Tableau de Reference des Etats d\'Erreur</h2><table><tr><th>Etat</th><th>Severite</th><th>Impact immediat</th><th>Action requise</th></tr><tr><td><code>INCOMPLETE</code></td><td>Avertissement</td><td>Certains objets sous-repliques, risque si autre panne</td><td>Surveiller le Rebuild/Repair</td></tr><tr><td><code>ARC_REBUILD_NOK</code></td><td>CRITIQUE</td><td>Donnees potentiellement irrecuperables</td><td>Contacter Scality Support IMMEDIATEMENT</td></tr><tr><td><code>DISK_FULL</code></td><td>CRITIQUE</td><td>Ecritures bloquees sur ce disque</td><td>Liberer de l\'espace ou ajouter de la capacite</td></tr><tr><td><code>DISK USAGE WARNING</code></td><td>Avertissement</td><td>Disque approche de la saturation</td><td>Planifier ajout de capacite</td></tr><tr><td><code>CONF_MISMATCH</code></td><td>Informatif</td><td>Aucun (normal post-upgrade Supervisor)</td><td>Rien -- se corrige lors de l\'upgrade des nodes</td></tr><tr><td><code>SPLIT LOOP</code></td><td>CRITIQUE</td><td>Partitionnement du cluster, risque de split-brain</td><td>Diagnostiquer reseau, ne pas ecrire</td></tr><tr><td><code>NOT STABILIZED</code></td><td>Transitoire</td><td>RING en cours de convergence (normal post-join/leave)</td><td>Attendre la stabilisation automatique</td></tr></table><h2>INCOMPLETE — Analyse Detaillee</h2><p>L\'etat INCOMPLETE signifie que le RING a detecte des objets dont le nombre de repliques (COS) ou de fragments valides (ARC) est inferieur au minimum requis. C\'est une alerte preventive — les donnees sont encore accessibles mais moins bien protegees.</p><h3>Causes courantes</h3><ul><li>Panne d\'un serveur storage (un node est DOWN ou en OOS)</li><li>Panne d\'un disque (un Biziod ne repond plus)</li><li>Congestion reseau causant des timeouts d\'ecriture</li><li>Phase transitoire apres un nodeLeave (normal, temporaire)</li></ul><h3>Resolution</h3><ul><li>Les taches <strong>Rebuild</strong> (pour ARC) et <strong>Repair</strong> (pour COS) corrigent automatiquement l\'INCOMPLETE.</li><li>Si le node/disque est en panne permanente, il faut le remplacer et laisser le Rebuild se terminer.</li><li>Si l\'INCOMPLETE persiste sans raison apparente (tous les nodes sont UP), investiguer les logs Biziod.</li></ul><h2>ARC_REBUILD_NOK — Urgence Absolue</h2><div class="alert alert-d">ARC_REBUILD_NOK est l\'etat le plus grave du RING. Il indique que des objets ARC ont perdu plus de M fragments (le nombre de fragments de parite) simultanement. Ces objets sont mathematiquement irrecuperables — aucune reconstruction n\'est possible.</div><h3>Causes</h3><ul><li>Panne simultanee de plusieurs serveurs/disques (par exemple : incendie, coupure de courant affectant plusieurs racks)</li><li>Bug dans le Rebuild qui a echoue silencieusement sur plusieurs fragments</li><li>Corruption de donnees systematique (bit rot sur plusieurs disques sans ECC)</li></ul><h3>Procedure d\'urgence</h3><ol><li><strong>Stopper toutes les ecritures</strong> si possible pour eviter d\'aggraver la situation.</li><li><strong>Contacter Scality Support immediatement</strong> avec les logs du Supervisor.</li><li><strong>Ne pas tenter de correction manuelle</strong> — les procedures Scality Support sont specifiques a chaque cas.</li><li><strong>Evaluer les sauvegardes</strong> disponibles pour les objets affectes.</li></ol><h2>CONF_MISMATCH — Etat Normal Post-Upgrade</h2><div class="alert alert-i">CONF_MISMATCH ne represente AUCUN risque pour les donnees. C\'est simplement une indication que les packages logiciels ne sont pas tous a la meme version sur tous les nodes. Il est ATTENDU apres l\'upgrade du Supervisor et avant l\'upgrade des storage nodes.</div><h3>Causes</h3><ul><li>Le Supervisor vient d\'etre upgrade mais les storage nodes ont encore l\'ancienne version.</li><li>Un node a ete ajoute recemment avec une version differente.</li></ul><h3>Resolution</h3><ul><li>CONF_MISMATCH <strong>disparait automatiquement</strong> quand tous les storage nodes sont upgrages a la meme version.</li><li>Ne <strong>JAMAIS</strong> cliquer "Apply Configuration" dans l\'UI pendant un upgrade : cela appliquerait la configuration de la nouvelle version sur des nodes avec l\'ancien code, causant une interruption de service.</li></ul><h2>SPLIT LOOP — Partitionnement Reseau</h2><p>Le <strong>SPLIT LOOP</strong> (ou split brain) est un des etats les plus dangereux. Il survient quand le cluster se divise en deux groupes de nodes qui ne peuvent plus communiquer entre eux :</p><div class="adiag">Etat normal :\n[Node1] --- [Node2] --- [Node3] --- [Node4] --- [Node5]\n   Tous se voient, quorum maintenu\n\nSPLIT LOOP :\n[Node1] --- [Node2]    X    [Node3] --- [Node4] --- [Node5]\nGroupe A (2 nodes)          Groupe B (3 nodes)\n\nProbleme : les 2 groupes peuvent accepter des ecritures independantes\n           -> Risque de divergence des donnees</div><h3>Causes</h3><ul><li>Panne d\'un switch reseau central</li><li>Probleme de cable entre des segments du reseau</li><li>Configuration VLAN incorrecte</li><li>Saturation de bande passante reseau inter-nodes</li></ul><h3>Procedure de resolution</h3><ol><li><strong>Stopper immediatement les ecritures</strong> sur les deux groupes si possible.</li><li><strong>Diagnostiquer la connectivite</strong> : ping entre tous les nodes, verifier les interfaces reseau, les switches.</li><li><strong>Corriger la cause reseau</strong> (remplacer le switch, reparer le cable, corriger la config VLAN).</li><li>Une fois la connectivite retablie, le RING se re-synchronise automatiquement (NOT_STABILIZED puis RUN).</li><li>Verifier l\'integrite des donnees avec Scality Support si des ecritures ont eu lieu pendant le split.</li></ol><h2>Analyse des Logs — Outils</h2><pre># Logs sproxyd (erreurs HTTP 5xx)\ngrep \'http_code="5\' /var/log/scality-sproxyd.log\n\n# Rechercher une requete par son ID\ngrep \'reqid="0000653D0000D09"\' /var/log/scality-sproxyd.log\n\n# Verifier les processus sproxyd\nnetstat -tnlp | grep :81     # Apache frontal\nnetstat -tnlp | grep :10000  # Daemon sproxyd\n\n# Logs Bizstorenode\ncat /var/log/scality-node/current\n\n# Logs Biziod (par disque)\ncat /var/log/scality-biziod-&lt;disk_id&gt;/current</pre><h2>P1 Troubleshooting — Arbre de Decision</h2><p>Un incident P1 correspond a une <strong>interruption totale de service</strong> ou une <strong>degradation majeure</strong> impactant les utilisateurs finaux. La procedure de diagnostic suit un arbre de decision structure.</p><h3>Arbre de decision P1</h3><div class="adiag">SYMPTOMES P1 :\n"It\'s slow" / Latences elevees / Timeouts / Erreurs 500 en masse\n\nETAPE 1 : Verifier la sante globale du RING\n  ringsh supervisor ringStatus DATA\n  ringsh supervisor ringStatus META\n  -> Si RING degraded/rebuilding : voir module M7 (taches RING)\n  -> Si RING OK : passer a l\'etape 2\n\nETAPE 2 : Verifier la sante des disques et serveurs\n  scaldisk iods list          # disques OOS ?\n  salt -s \'*\' cmd.run \'df -h\' # espace disque OK ?\n  salt -s \'*\' cmd.run \'free -h\' # RAM OK ?\n  -> Si disque plein/OOS : traiter en priorite\n\nETAPE 3 : Verifier le reseau\n  # Verifier les retransmissions TCP (doit etre ~0)\n  # Tester le debit entre noeuds avec iperf3\n  # Verifier la coherence MTU (jumbo frames)\n  -> Si retransmissions > 0 : probleme reseau, escalader\n\nETAPE 4 : Si S3 en erreur\n  -> Verifier les containers S3 (ctrctl ps)\n  -> Verifier les alertes Raft (Prometheus)\n  -> Suivre une requete dans les logs S3\n\nETAPE 5 : Si SOFS en erreur\n  -> Verifier CTDB et sfused (voir module MA)</div><h3>Commandes de diagnostic S3 rapide</h3><pre># Taux d\'erreurs S3 en temps reel (necessite pv installe)\ntail -f /var/log/s3/scality-s3/logs/s3-0.log | grep elapsed | pv -i 1 -l -r > /dev/null\n\n# Taux de 500 en temps reel\ntail -f /var/log/s3/scality-s3/logs/s3-0.log | grep \'"httpCode":5\' | pv -i 1 -l -r > /dev/null\n\n# Suivre une requete lente par son request_id\ngrep "request_id_from_500_log" /var/log/s3/scality-s3/logs/*.log\n\n# Identifier si la latence vient des metadonnees (bucketd/repd)\n# ou du stockage (sproxyd → RING)\negrep \'elapsed\' /var/log/s3/scality-s3/logs/s3-0.log | awk -F\'elapsed":\' \'{print $2}\' | sort -n | tail -20\n\n# Health check S3 complet\n/usr/bin/scality-compute-s3-health -d -c /etc/scality/s3-healthcheck/config.yaml 2>&1</pre><div class="kbox"><h3>Points Cles a Retenir</h3><ul><li>INCOMPLETE = sous-replication temporaire (Rebuild/Repair corrige automatiquement)</li><li>ARC_REBUILD_NOK = URGENCE : donnees irrecuperables, Scality Support immediatement</li><li>CONF_MISMATCH = NORMAL post-upgrade Supervisor, ne JAMAIS cliquer Apply Config</li><li>SPLIT LOOP = partitionnement reseau : stopper les ecritures, reparer le reseau</li><li>DISK_FULL = saturation disque : aucune nouvelle ecriture possible sur ce disque</li><li>sproxyd : port 81 (Apache), port 10000 (daemon interne)</li></ul></div>',
quiz:[
{q:"Quelle erreur RING indique que la reconstruction ARC a echoue et que des donnees sont en danger ?",opts:["INCOMPLETE","CONF_MISMATCH","ARC_REBUILD_NOK","SPLIT LOOP"],ans:2,expl:"ARC_REBUILD_NOK indique que le Rebuild ARC a echoue. Si trop de fragments sont perdus, les donnees peuvent etre irrecuperables. Contacter Scality Support immediatement."},
{q:"L'etat CONF_MISMATCH apparait apres l'upgrade du Supervisor. Que faites-vous ?",opts:["Cliquer Apply configuration immediatement","Redemarrer le Supervisor","Ne rien faire -- c'est normal, se corrige lors de l'upgrade des storage nodes","Appeler Scality Support"],ans:2,expl:"CONF_MISMATCH est normal apres l'upgrade du Supervisor. Il disparait quand les storage nodes sont upgrades. Ne JAMAIS cliquer Apply configuration."},
{q:"Quel etat RING indique un partitionnement reseau (split brain) entre groupes de nodes ?",opts:["INCOMPLETE","NOT STABILIZED","SPLIT LOOP","DISK_FULL"],ans:2,expl:"SPLIT LOOP indique que des groupes de nodes ne se voient plus mutuellement (partitionnement reseau). Ne pas ecrire de donnees jusqu'a resolution."},
{q:"Sur quel port Apache le daemon sproxyd recoit-il les requetes entrantes ?",opts:["80","81","443","10000"],ans:1,expl:"Le daemon sproxyd ecoute sur le port Apache 81. Le port 10000 est utilise pour la communication interne FastCGI -> sproxyd."},
{q:"Lors d'un incident P1, quelle est la sequence correcte de triage initial recommandee par Scality ?",opts:["S3 logs → disk health → network → RING status","RING status → disk health → network → S3/SOFS","Network → RING status → S3 → disk health","Disk health → RING status → S3 → network"],ans:1,expl:"La decision tree P1 Scality part du bas vers le haut : RING status global (RUN/INCOMPLETE/NOT STABILIZED) → sante disques (OOS_PERM/ERROR) → reseau (MTU/perte paquets) → services applicatifs (S3/SOFS). Commencer par les logs applicatifs sans verifier la couche inferieure retarde le diagnostic."},
{q:"Pour suivre une requete S3 precise a travers tous les logs CloudServer, quel identifiant utilise-t-on ?",opts:["Le bucket name + timestamp","request_id (present dans tous les logs pour une meme requete)","L'adresse IP du client","L'ETag de l'objet"],ans:1,expl:"request_id est l'identifiant unique genere par CloudServer par requete S3. Il est present dans tous les fichiers s3-*.log pour une meme requete. grep <request_id> /var/log/scality/s3-*.log permet de retrouver le cycle complet d'une requete et d'identifier l'etape en echec."}
]},
{id:'M9',num:'09',title:'Securite et Administration',desc:'Roles, SSO, Fail2ban, ordre de demarrage/arret',
content:'<h2>Les 4 Roles du RING — Matrice de Permissions</h2><p>Le Supervisor utilise un modele de <strong>Role-Based Access Control (RBAC)</strong> avec 4 roles predefined. Chaque utilisateur se voit assigner un ou plusieurs roles lors de sa creation dans l\'interface Identity.</p><table><tr><th>Role</th><th>Lecture</th><th>Ecriture</th><th>Cas d\'usage</th></tr><tr><td><strong>RING Admin</strong></td><td>Tout</td><td>Tout</td><td>Administrateur systeme Scality. Acces complet a toutes les operations : configuration RING, gestion des disques, upgrade, utilisateurs.</td></tr><tr><td><strong>Identity Manager</strong></td><td>Tout (lecture seule)</td><td>Gestion des utilisateurs UNIQUEMENT</td><td>Responsable securite ou DBA qui gere les acces sans pouvoir modifier la configuration du RING.</td></tr><tr><td><strong>Monitoring Manager</strong></td><td>Tout</td><td>Dashboards Grafana uniquement</td><td>Equipe monitoring/NOC qui visualise et personnalise les dashboards sans pouvoir modifier le RING.</td></tr><tr><td><strong>RING Viewer</strong></td><td>Tout (lecture seule)</td><td>Aucune</td><td>Auditeurs, equipes applicatives qui ont besoin de visibilite sur l\'etat du stockage sans droit de modification.</td></tr></table><div class="alert alert-i">Un meme utilisateur peut avoir plusieurs roles. Par exemple, un administrateur senior peut etre a la fois RING Admin et Identity Manager.</div><h2>Authentification SSO — Depuis RING 9.4.0</h2><p>Avant RING 9.4.0, l\'authentification des utilisateurs du Supervisor etait geree de facon basique (LDAP ou comptes locaux simples). Depuis <strong>9.4.0</strong>, le Supervisor integre un systeme de <strong>Single Sign-On (SSO)</strong> complet base sur un Identity Provider (IdP) interne.</p><h3>Premiers pas apres l\'installation</h3><ul><li>Credentials initiaux : <code>admin</code> / <code>Default_passw0rd</code></li><li><strong>Changer le mot de passe immediatement</strong> apres la premiere connexion</li><li>Creer les utilisateurs supplementaires via l\'interface <code>Identity</code> du Supervisor</li></ul><h3>Gestion des utilisateurs (interface Identity)</h3><ul><li>Creation : nom, email, mot de passe, role(s) assigne(s)</li><li>Politique de mot de passe : longueur minimum, complexite, expiration configurable</li><li>Desactivation d\'un compte sans le supprimer (audit trail preserve)</li><li>Export/import de la liste des utilisateurs (utile lors d\'upgrades)</li></ul><div class="alert alert-w">Lors d\'un upgrade depuis une version &lt; 9.4.0 vers 9.4.0+ : le systeme d\'authentification change completement. Les anciens comptes ne sont pas migres automatiquement. Il faut <strong>exporter la liste des utilisateurs AVANT l\'upgrade</strong> et les recreer manuellement dans la nouvelle interface Identity. Utiliser la variable d\'environnement <code>SCALITY_SUPERVISOR_FQDN</code> lors de la migration SSO.</div><h3>Migration SSO (upgrade depuis &lt; 9.4.0)</h3><pre># Avant l\'upgrade : noter tous les utilisateurs existants\n# Apres l\'upgrade du Supervisor :\nexport SCALITY_SUPERVISOR_FQDN=supervisor.mondomaine.com\n# Puis recreer les utilisateurs via l\'interface Identity</pre><h2>Authentication Throttling — Fail2ban</h2><p>Le Supervisor integre <strong>Fail2ban</strong> pour se proteger contre les attaques par force brute sur l\'interface d\'authentification :</p><ul><li><strong>Principe</strong> : apres N tentatives d\'authentification echouees depuis la meme IP, Fail2ban bloque cette IP pendant une duree configurable.</li><li><strong>Configuration</strong> : Administration &gt; Security &gt; Authentication Throttling dans le Supervisor</li><li><strong>Parametres</strong> : seuil de tentatives (defaut: 5), duree de blocage (defaut: 10 min), liste blanche d\'IPs exemptees</li><li><strong>Logs</strong> : les IP bloquees sont loggees dans <code>/var/log/fail2ban.log</code> sur le Supervisor</li></ul><pre># Debloquer une IP manuellement (si admin se bloque lui-meme)\nfail2ban-client set supervisor unbanip &lt;adresse_ip&gt;\n\n# Voir les IPs actuellement bloquees\nfail2ban-client status supervisor</pre><h2>Communications HTTPS et Certificats TLS</h2><p>Toutes les communications vers et depuis le Supervisor sont obligatoirement chiffrees en <strong>HTTPS/TLS</strong> :</p><ul><li>Certificat auto-signe genere a l\'installation (a remplacer par un certificat CA en production)</li><li>Certificat configurable dans <code>/etc/scality/supervisor/ssl/</code></li><li>Les Connectors communiquent avec le Supervisor via HTTPS (agents Salt)</li><li>Le port HTTPS du Supervisor est 443 par defaut</li></ul><h2>Ordre d\'Arret et de Demarrage — Regle Absolue</h2><p>L\'ordre des operations d\'arret et de demarrage du cluster est <strong>non-negociable</strong>. Un ordre incorrect provoque des erreurs visibles par les clients ou des interruptions de service evitables.</p><div class="adiag">ARRET (ordre obligatoire) :\n  1. CONNECTORS  (S3, NFS, SMB, sproxyd, FUSE...)\n       -> Les clients recoivent un signal propre d\'indisponibilite\n       -> Les ecritures en cours se terminent ou sont annulees proprement\n  2. STORAGE SERVERS  (systemctl stop scality-node)\n       -> Les Bizstorenode s\'arretent proprement\n       -> Les donnees en buffer sont flushees sur les Biziod\n  3. SUPERVISOR\n       -> L\'orchestrateur s\'arrete en dernier\n\nDEMARRAGE (ordre strictement inverse) :\n  1. SUPERVISOR\n       -> L\'orchestrateur doit etre operationnel en premier\n  2. STORAGE SERVERS  (systemctl start scality-node)\n       -> Les nodes rejoignent le RING (nodeJoin automatique si join_auto=2)\n  3. CONNECTORS\n       -> Les acces clients sont retablis uniquement quand le RING est stable</div><div class="alert alert-d">Si les Storage Servers sont arretes AVANT les Connectors : les Connectors continuent de recevoir des requetes clients mais ne peuvent plus acceder aux donnees -> erreurs 5xx visibles par les applications. Toujours arreter les Connectors en premier.</div><h2>Securite Reseau</h2><ul><li><strong>Reseau de stockage (backend)</strong> : reseau dedie entre Bizstorenode/Biziod, isole du reseau client pour la performance et la securite. Typiquement un reseau 10 GbE ou 25 GbE dedie.</li><li><strong>Reseau management</strong> : acces SSH au Supervisor et aux serveurs, isole du reseau client.</li><li><strong>Reseau client (frontend)</strong> : connexions des Connectors vers les applications clientes.</li></ul><div class="kbox"><h3>Points Cles a Retenir</h3><ul><li>4 roles RBAC : RING Admin (tout), Identity Manager (users), Monitoring Manager (read+Grafana), RING Viewer (read-only)</li><li>SSO depuis 9.4.0 : credentials initiaux admin/Default_passw0rd, changer immediatement</li><li>Upgrade depuis &lt;9.4.0 : exporter les users AVANT, les recreer dans Identity apres</li><li>Fail2ban : protection brute force, configurable dans le Supervisor</li><li>Arret : Connectors -> Storage Servers -> Supervisor (obligatoire dans cet ordre)</li><li>Demarrage : Supervisor -> Storage Servers -> Connectors (ordre inverse)</li></ul></div>',
quiz:[
{q:"Quel role RING permet uniquement de gerer les utilisateurs ?",opts:["RING Admin","Identity Manager","Monitoring Manager","RING Viewer"],ans:1,expl:"Identity Manager a acces uniquement a la gestion des utilisateurs. Il peut lire (pas ecrire) le reste du Supervisor."},
{q:"Dans quel ordre doit-on arreter les composants d'un RING en production ?",opts:["Supervisor -> Storage -> Connectors","Storage -> Connectors -> Supervisor","Connectors -> Storage -> Supervisor","Connectors -> Supervisor -> Storage"],ans:2,expl:"L'ordre correct est : Connectors d'abord, puis Storage Servers, puis Supervisor. Le demarrage est l'inverse."},
{q:"Quel outil protege le Supervisor contre les attaques par brute force ?",opts:["Nagios","Prometheus","Fail2ban","ModSecurity"],ans:2,expl:"Fail2ban est utilise pour l'Authentication Throttling. Il bloque les IPs apres N tentatives d'authentification echouees."},
{q:"Depuis quelle version du RING le SSO est-il disponible sur le Supervisor ?",opts:["9.2.0","9.3.0","9.4.0","9.5.0"],ans:2,expl:"Le SSO (Single Sign-On) a ete introduit dans RING 9.4.0. Avant cette version, les utilisateurs etaient geres differemment."}
]},
{id:'MA',num:'A',title:'SOFS — Configuration Complete',desc:'Architecture SOFS, connectors, SMB/NFS, Recycle, Quotas, DLM',
content:'<h2>Qu\'est-ce que SOFS ?</h2><p><strong>SOFS (Scale-Out File System)</strong> est une couche d\'abstraction qui presente le stockage objet du RING sous la forme d\'un <strong>systeme de fichiers POSIX</strong>. Chaque fichier SOFS est mappe a un unique blob dans le RING (relation 1:1) : le nom du fichier est utilise comme cle, et le contenu est stocke comme un objet RING via le protocole sproxyd.</p><p>SOFS permet aux applications traditionnelles (qui parlent NFS ou SMB) d\'utiliser la puissance du RING Scality sans modification, tout en beneficiant de ses avantages (scale-out, haute disponibilite, replication geographique).</p><h2>Architecture SOFS — Vue d\'Ensemble</h2><div class="adiag">     APPLICATIONS CLIENTES\n   (Windows, Linux, CDMI...)\n           |\n   [Reseau public / LAN]\n           |\n+----------+----------+\n| Connector A         |  &lt;-- reseau prive --&gt;  | Connector B         |\n| sfused              |                         | sfused              |\n| membershipd         |                         | membershipd         |\n| smbd/nmbd (SMB)     |                         | smbd/nmbd (SMB)     |\n| CTDB (clustering)   |                         | CTDB (clustering)   |\n+----------+----------+                         +--------------------+\n           |                                             |\n           +------------------+------------------------+\n                              |\n                     ZooKeeper Cluster\n                     (DLM, coordination)\n                              |\n           +------------------+------------------------+\n           |                                           |\n     RING DATA (objets SOFS)              RING META (metadonnees SOFS, COS 4+)</div><h2>Les Composants Cles de SOFS</h2><h3>sfused — Le Driver FUSE</h3><p><code>sfused</code> est le daemon qui monte le volume SOFS localement via FUSE (Filesystem in Userspace). Il traduit les appels syscall POSIX (open, read, write, mkdir...) en operations RING :</p><ul><li>Une <code>read()</code> sur un fichier devient un <code>GET sproxyd</code> vers le RING</li><li>Une <code>write()</code> devient un <code>PUT sproxyd</code> (remplacement complet de l\'objet)</li><li>Un <code>mkdir()</code> cree une entree de metadonnee dans le RING META (COS 4+)</li><li>Son fichier de configuration principal : <code>/etc/scality/sfused.conf</code> (format JSON)</li></ul><h3>membershipd — Appartenance au Volume</h3><p><code>membershipd</code> est le daemon qui gere l\'<strong>appartenance du connector au volume SOFS</strong>. Il s\'enregistre aupres de ZooKeeper pour indiquer que ce connector est actif sur ce volume :</p><ul><li>Permet au DLM de savoir quels connectors sont actifs sur le volume</li><li>Coordonne le failover : si un connector tombe, membershipd le detecte et libere ses verrous DLM</li><li>S\'execute en parallele avec sfused sur chaque serveur connector</li></ul><h3>ZooKeeper — Coordination Distribuee</h3><p>ZooKeeper est le service de coordination distribue utilise par SOFS pour :</p><ul><li><strong>DLM (Distributed Lock Manager)</strong> : arbitre les verrous sur les fichiers entre plusieurs connectors</li><li><strong>Membership</strong> : registre des connectors actifs sur chaque volume</li><li><strong>Quorum</strong> : ZooKeeper fonctionne en mode quorum (3 ou 5 noeuds recommandes)</li></ul><div class="alert alert-w">ZooKeeper est OBLIGATOIRE quand plusieurs connectors accedent simultanement au meme volume SOFS. Sans ZooKeeper/DLM, des ecritures concurrentes de plusieurs connectors provoqueraient des corruptions de donnees.</div><h2>Les 5 Types de Connectors SOFS</h2><table><tr><th>Connector</th><th>Services actifs</th><th>Protocole</th><th>Specificites</th></tr><tr><td><strong>FUSE (localfs)</strong></td><td>sfused + membershipd</td><td>POSIX local</td><td>Acces fichier local uniquement, pas d\'acces reseau direct aux clients</td></tr><tr><td><strong>SMB/CIFS</strong></td><td>sfused + membershipd + smbd + nmbd + winbindd*</td><td>SMB 3.0</td><td>AD optionnel, CTDB pour HA/VIP, module ring en premier dans vfs objects</td></tr><tr><td><strong>NFSv3</strong></td><td>sfused + membershipd + nfsd kernel</td><td>NFS v3</td><td>Kerberos NON supporte, semantique POSIX complete</td></tr><tr><td><strong>NFSv3+v4</strong></td><td>ganesha + membershipd</td><td>NFS v3 et v4.0</td><td>Kerberos supporte (v4 seulement), NFSv4.0 uniquement (pas 4.1/4.2)</td></tr><tr><td><strong>CDMI</strong></td><td>dewpoint + sfused + membershipd</td><td>CDMI/HTTP</td><td>Apache/nginx + FastCGI, standard SNIA Cloud Storage</td></tr></table><p>*winbindd est optionnel. Il est requis uniquement pour l\'integration Active Directory (authentification des utilisateurs Windows).</p><h2>Features SOFS — Description Detaillee</h2><h3>MARS — Replication Multisite Asynchrone</h3><p>MARS (Multi-site Asynchronous Replication for SOFS) permet de repliquer un volume SOFS vers un site distant :</p><ul><li><strong>Asynchrone</strong> : les ecritures sur le site source sont confirmees immediatement, la replication vers le site cible se fait en arriere-plan</li><li><strong>Use cases</strong> : Plan de Reprise d\'Activite (PRA), protection anti-ransomware (le site replique est en read-only)</li><li>Tous les connectors du volume doivent etre configures pour participer a MARS</li></ul><h3>DLM — Distributed Lock Manager</h3><p>Le DLM gere les verrous distribues sur les fichiers SOFS :</p><ul><li>Indispensable quand plusieurs connectors (ex: 2 serveurs SMB en cluster) accedent au meme volume</li><li>Evite les corruptions dues aux ecritures concurrentes sur le meme fichier</li><li>Repose sur ZooKeeper pour la coordination inter-connectors</li><li>Configure dans <code>/etc/scality/sfused.conf</code> section DLM</li></ul><h3>CTDB — Clustering SMB</h3><p>CTDB (Cluster Trivial DataBase) est la technologie de clustering Samba qui permet :</p><ul><li><strong>VIP failover</strong> : une IP virtuelle flotte entre les noeuds SMB. En cas de panne d\'un noeud, les clients reconnectent automatiquement via la VIP sans reconfiguration</li><li><strong>Load balancing</strong> : distribution des connexions SMB actives entre les noeuds du cluster</li><li><strong>Session persistence</strong> : les sessions SMB sont partagees entre noeuds pour eviter les interruptions</li></ul><h2>Configuration SMB Complete</h2><h3>Fichiers de configuration</h3><ul><li><code>/etc/scality/cifs/smb.conf</code> : configuration principale (SerNet-Samba)</li><li><code>/etc/scality/cifs/global_names.conf</code> : nom du serveur, workgroup</li><li><code>/etc/scality/cifs/global_ad.conf</code> : configuration Active Directory</li></ul><h3>Exemple de configuration</h3><pre>## global_names.conf\nnetbios name = STORAGESRV01\nserver string = Scality SOFS SMB Server\nworkgroup = MONDOMAINE\n\n## global_ad.conf (si Active Directory)\nsecurity = ads\nrealm = MONDOMAINE.LOCAL\nidmap config MONDOMAINE : backend = rid\nidmap config MONDOMAINE : range = 2600000-4999999\n\n## smb.conf (partage SOFS)\n[sofs-share]\n  path = /sofs/volume1\n  read only = no\n  vfs objects = ring catia fruit streams_xattr acl_xattr\n  nt acl support = yes\n  inherit acls = Yes\n  map acl inherit = Yes</pre><div class="alert alert-d">CRITIQUE : <code>ring</code> doit toujours etre en PREMIER dans <code>vfs objects</code>. Exemple correct : <code>vfs objects = ring catia fruit streams_xattr acl_xattr</code>. Si ring n\'est pas en premier, les ACL et les metadonnees ne sont pas correctement stockees dans le RING, causant des corruptions silencieuses.</div><h3>Rejoindre le domaine Active Directory</h3><pre># Rejoindre le domaine AD\nnet ads join -U administrator\n\n# Verifier l\'adhesion\nnet ads info\n\n# Lister les utilisateurs AD accessibles\nwbinfo -u</pre><h2>SOFS Recycle — Corbeille Distribuee</h2><p>La SOFS Recycle est une fonctionnalite de <strong>corbeille versionnee</strong> qui permet de recuperer des fichiers supprimes. Quand un fichier est supprime, au lieu d\'etre detruit, il est deplace dans un repertoire <code>.recycle</code> special.</p><h3>Trois modes de fonctionnement</h3><table><tr><th>Mode</th><th>Parametre</th><th>Qui voit .recycle</th><th>Qui peut restaurer/vider</th></tr><tr><td>Invisible</td><td>invisible=true</td><td>Admin uniquement (hidden)</td><td>Admin uniquement</td></tr><tr><td>Privileged</td><td>privileged=true</td><td>Tout le monde</td><td>Admin uniquement</td></tr><tr><td>Standard</td><td>privileged=false</td><td>Tout le monde</td><td>Owner du fichier + Admin</td></tr></table><h3>Structure de /etc/scality/sfused.conf</h3><pre>{\n  "recycle": {\n    "enable": true,\n    "versioning": true,    // garder plusieurs versions du meme fichier\n    "privileged": false,   // owner peut restaurer\n    "root_name": ".recycle"\n  },\n  "lifecycle_policy": {\n    "enable": true,\n    "base_path": ".recycle",\n    "max_versions_per_hour": 60,\n    "max_versions_per_day": 999999,\n    "max_versions_per_week": 999999,\n    "max_versions_per_month": 999999,\n    "time_frame_days": 31,     // garder pendant 31 jours max\n    "workers": 4\n  }\n}</pre><div class="alert alert-d">La lifecycle_policy est OBLIGATOIRE si la Recycle est activee. Sans elle, la corbeille grossit indefiniment jusqu\'a saturer le volume SOFS et bloquer toutes les ecritures.</div><h2>Quotas SOFS</h2><p>Les quotas SOFS permettent de limiter l\'espace utilise au niveau du volume, d\'un utilisateur ou d\'un groupe. Ils sont geres via l\'<strong>adminapi REST</strong> de sfused (socket Unix local) :</p><h3>Types de quotas</h3><ul><li><strong>Quota volume</strong> : taille maximale du volume SOFS entier</li><li><strong>Quota utilisateur</strong> : espace max par utilisateur (UID)</li><li><strong>Quota groupe</strong> : espace max par groupe (GID)</li></ul><h3>Commandes de gestion des quotas</h3><pre># Recuperer le socket adminapi\nSOCKET=$(cat /var/run/scality/scality-sfused-adminapi)\n\n# Lire le quota volume actuel\ncurl -s $SOCKET/fs/quota/volume | python3 -m json.tool\n\n# Modifier le quota volume (editer /tmp/volume_quota.json)\ncurl -s $SOCKET/fs/quota/volume --output /tmp/volume_quota.json\nvim /tmp/volume_quota.json\ncurl -s -XPUT $SOCKET/fs/quota/volume -T /tmp/volume_quota.json\n\n# Quota utilisateur (uid 1234)\ncurl -s $SOCKET/fs/quota/user/1234 | python3 -m json.tool</pre><div class="kbox"><h3>Points Cles a Retenir</h3><ul><li>sfused = driver FUSE qui traduit les syscalls POSIX en operations RING (sproxyd)</li><li>membershipd = enregistrement du connector dans ZooKeeper</li><li>DLM + ZooKeeper = OBLIGATOIRE si plusieurs connectors acces au meme volume</li><li>CTDB = VIP failover + clustering Samba pour la HA SMB</li><li>vfs objects : "ring" doit TOUJOURS etre en PREMIER position</li><li>Recycle Recycle : 3 modes ; lifecycle_policy OBLIGATOIRE pour eviter saturation</li><li>Quotas : volume / user / group via adminapi REST sur socket Unix local</li></ul></div>',
quiz:[
{q:"Un volume SOFS est accede par 4 connectors simultanement. Quelle feature est OBLIGATOIRE pour eviter les corruptions ?",opts:["MARS","Volume Protection","DLM (Distributed Lock Manager)","SOFS Recycle"],ans:2,expl:"Le DLM (Distributed Lock Manager) est obligatoire quand plusieurs connectors acces au meme volume SOFS. Il coordonne les verrous distribues et necessite un cluster ZooKeeper."},
{q:"Dans smb.conf : vfs objects = acl_xattr ring streams_xattr. Quel probleme cela pose-t-il ?",opts:["Aucun probleme, l'ordre n'importe pas","Le module ring doit etre en PREMIER position","acl_xattr est incompatible avec ring","streams_xattr doit etre en dernier"],ans:1,expl:"Le module 'ring' DOIT etre positionne en premier dans vfs objects. La config correcte : vfs objects = ring streams_xattr acl_xattr. Toute autre position cause des dysfonctionnements."},
{q:"La corbeille SOFS est active avec privileged=true. Un utilisateur veut recuperer son fichier supprime. Peut-il le faire ?",opts:["Oui, il peut toujours restaurer ses propres fichiers","Non, seul l'administrateur peut vider la corbeille avec privileged=true","Oui, mais uniquement dans les 30 minutes","Non, il faut privileged=false ET invisible=false"],ans:1,expl:"Avec privileged=true, SEUL l'administrateur peut retirer du contenu de la corbeille. Pour que l'utilisateur puisse restaurer : privileged=false."},
{q:"Pourquoi une lifecycle_policy est-elle OBLIGATOIRE quand la SOFS Recycle est active ?",opts:["Pour definir les permissions ACL","Pour eviter que la corbeille se remplisse indefiniment","Pour activer le versioning","Pour configurer le DLM"],ans:1,expl:"Sans lifecycle_policy, la corbeille grossit indefiniment jusqu'a saturer le volume SOFS. La lifecycle_policy purge automatiquement les versions selon des regles temporelles."},
{q:"Quel est le fichier de configuration principal du daemon sfused ?",opts:["/etc/samba/smb.conf","/etc/scality/sfused.conf","/etc/scality/cifs/smb.conf","/srv/scality/sfused.json"],ans:1,expl:"Le fichier /etc/scality/sfused.conf est le fichier de configuration JSON du daemon sfused. Il contient la configuration generale, recycle, lifecycle_policy, DLM, etc."}
]},
{id:'MB',num:'B',title:'Procedure d\'Upgrade RING',desc:'Prerequis, chemins de version, sequence Supervisor -> Storage -> Connectors',
content:'<h2>Principes Fondamentaux de l\'Upgrade RING</h2><p>Un upgrade RING est une <strong>operation critique</strong> qui doit etre planifiee rigoureusement. La regle d\'or : <strong>un seul composant a la fois, dans l\'ordre prescrit, avec validation a chaque etape</strong>. Un upgrade mal execute peut causer une interruption de service ou, dans les cas extremes, une perte de donnees.</p><h2>Matrice de Compatibilite des Versions</h2><div class="alert alert-d">Upgrade direct RING 7 vers RING 9 : STRICTEMENT INTERDIT. La base de donnees MESA et le format des containers Biziod ont change de facon incompatible entre RING 7 et RING 9. Un upgrade direct corromprait les donnees.</div><table><tr><th>Version source</th><th>Version cible</th><th>Chemin</th></tr><tr><td>RING 7.x</td><td>RING 9.x</td><td>INTERDIT direct. Aller RING 7 -> RING 8 -> RING 9</td></tr><tr><td>RING 8.x</td><td>RING 9.5.2</td><td>Direct supporte</td></tr><tr><td>RING 9.0 - 9.4</td><td>RING 9.5.2</td><td>Direct supporte</td></tr><tr><td>SOFS connectors &lt; 8.5.8.7</td><td>RING 9</td><td>Upgrade intermediaire obligatoire vers 8.5.8.7 d\'abord</td></tr><tr><td>SOFS connectors 9.0 ou 9.1</td><td>RING 9.2+</td><td>Arreter TOUS les connectors du volume avant d\'upgrader le premier</td></tr></table><h3>Cas special SOFS 9.0/9.1 -> 9.2+</h3><p>Entre RING 9.1 et 9.2, le <strong>format de stockage des metadonnees SOFS a change</strong>. Un connector 9.1 et un connector 9.2 sur le meme volume sont incompatibles. La procedure est :</p><ol><li>Arreter TOUS les connectors SOFS du volume simultanement</li><li>Upgrader tous les connectors en une seule fenetre de maintenance</li><li>Redemarrer tous les connectors</li></ol><h2>Prerequis — Checklist Pre-Upgrade</h2><h3>1. Ticket Scality Support (OBLIGATOIRE)</h3><p>Avant tout upgrade, <strong>ouvrir un ticket Scality Support</strong> est OBLIGATOIRE. L\'equipe Support :</p><ul><li>Valide que l\'environnement est pret pour l\'upgrade (version courante, OS, espace disque)</li><li>Confirme le chemin de version exact (pas d\'etape intermediaire oubliee)</li><li>Est disponible pour assister en cas de probleme pendant l\'upgrade</li></ul><h3>2. Terminal persistant (Tmux ou Screen)</h3><p>Une deconnexion SSH en milieu d\'upgrade est catastrophique. Tmux et Screen maintiennent la session active meme si la connexion est interrompue :</p><pre># Demarrer une session tmux\ntmux new -s upgrade\n\n# Se rattacher apres deconnexion\ntmux attach -t upgrade\n\n# Ou avec Screen\nscreen -S upgrade\nscreen -r upgrade  # rattachement</pre><h3>3. Verifications pre-upgrade</h3><pre># Verifier le RING est en etat RUN\nringsh supervisor ringList\nringsh supervisor ringStatus &lt;RING&gt;\n\n# Verifier l\'espace /var\ndf -h /var\n\n# Verifier PermitRootLogin\ngrep PermitRootLogin /etc/ssh/sshd_config\n\n# Verifier la version scaldisk (doit = version RING courante)\nscaldisk --version</pre><h3>4. Cas CRR pre-upgrade</h3><div class="alert alert-w">Si le Cross-Region Replication (CRR) est active sur le S3 Connector ET que vous upgradez depuis une version &lt; 9.5.2.0, une <strong>procedure de pre-upgrade CRR obligatoire</strong> doit etre executee. Elle vide les queues de replication en attente avant l\'upgrade pour eviter toute corruption. Contacter Scality Support pour la procedure exacte.</div><h2>Sequence Complete d\'Upgrade</h2><div class="adiag">PHASE 1 : PREPARATION\n  1. Verifier versions + matrice de compatibilite\n  2. Ouvrir ticket Scality Support\n  3. Executer CRR pre-upgrade si applicable\n  4. Ouvrir terminal Tmux/Screen\n  5. Verifier etat RING : RUN obligatoire\n  6. Telecharger archive .run + verifier sha256\n  7. Uploader sur le Supervisor\n  8. chmod +x installer.run\n  9. FORCE_PY3=1 ./installer.run -y --extract-only\n 10. Verifier role Prometheus (si upgrade depuis &lt; 9.5.0)\n 11. /srv/scality/bin/precheck_upgrade --offline\n 12. Migration SSO si upgrade depuis &lt; 9.4.0.0\n\nPHASE 2 : UPGRADE SUPERVISOR\n 13. /srv/scality/scripts/prepare_upgrade\n     -> Attendre : "prepare_upgrade completed successfully"\n 14. salt \'*\' state.sls scality.req.platform.kernel\n     -> Met a jour les parametres kernel sysctl sur tous les serveurs\n 15. /srv/scality/scripts/supervisor_upgrade\n     -> Attendre : "supervisor_upgrade completed successfully"\n     -> Le Supervisor redemmarre\n     -> L\'UI affiche CONF_MISMATCH -> NORMAL, NE PAS CLIQUER Apply Config\n\nPHASE 3 : UPGRADE STORAGE SERVERS (un par un)\n 16. Pour chaque storage server :\n     a. Entrer en mode maintenance (tous les RINGs)\n     b. Verifier etat RING : RUN ou CONF_MISMATCH uniquement\n     c. nodeLeave -> attendre etat OUT_OF_SERVICE\n     d. systemctl stop scality-node\n     e. yum update packages scality\n     f. systemctl start scality-node\n     g. nodeJoin -> attendre etat RUN\n     h. Appliquer logging + sagentd\n     i. Passer au serveur SUIVANT seulement si RUN\n 17. Exit maintenance mode (tous les RINGs)\n\nPHASE 4 : UPGRADE CONNECTORS SOFS (si applicable)</div><h2>Phase 3 — Upgrade d\'un Storage Server en Detail</h2><h3>Etape a : Mode maintenance</h3><pre># Pour CHAQUE RING du cluster\nfor RING in $(ringsh supervisor ringList | grep -v "^$"); do\n  echo "Maintenance mode pour RING: $RING"\n  ringsh supervisor ringConfigSet ${RING} join_auto 0\n  ringsh supervisor ringConfigSet ${RING} rebuild_auto 0\n  ringsh supervisor ringConfigSet ${RING} chordpurge_enable 0\ndone</pre><h3>Etape b : Verifier l\'etat du RING</h3><pre>ringsh supervisor ringStatus &lt;RING&gt;\n# Doit afficher : RUN ou CONF_MISMATCH RUN\n# JAMAIS commencer si : INCOMPLETE, SPLIT LOOP, ARC_REBUILD_NOK</pre><h3>Etape c : nodeLeave</h3><pre># Retirer tous les nodes du serveur du RING\nfor NODE in $(ringsh supervisor nodeList &lt;RING&gt; | grep storage_server_name); do\n  ringsh supervisor nodeLeave ${NODE}:/\ndone\n# Attendre que tous les nodes soient en etat OUT_OF_SERVICE\nwatch -n5 "ringsh supervisor nodeList &lt;RING&gt;"</pre><h3>Etapes d-e-f : Upgrade packages</h3><pre># Sur le serveur storage (via SSH)\nsystemctl stop scality-node\n\n# Deverrouiller les packages (si RING >= 8.3.0)\nyum versionlock delete python3-scaldisk scality-node\n\n# Mettre a jour les packages Scality\nyum update --disableplugin=versionlock \\*scality\\*\nyum clean all\n\ndystemctl start scality-node</pre><h3>Etape g : nodeJoin et validation</h3><pre># Rejoindre le RING\nfor NODE in $(ringsh supervisor nodeList &lt;RING&gt; | grep storage_server_name); do\n  ringsh supervisor nodeJoin ${NODE}:/\ndone\n\n# Attendre l\'etat RUN\nwatch -n5 "ringsh supervisor ringStatus &lt;RING&gt;"\n# NE PAS passer au serveur suivant avant d\'avoir RUN</pre><h3>Etape h : Appliquer la configuration de logging</h3><pre>salt-call state.apply scality.node.log\nsalt-call state.apply scality.sagentd.registered</pre><h3>Etape 17 : Sortie du mode maintenance (APRES tous les serveurs)</h3><pre>for RING in $(ringsh supervisor ringList | grep -v "^$"); do\n  ringsh supervisor ringConfigSet ${RING} join_auto 2\n  ringsh supervisor ringConfigSet ${RING} rebuild_auto 1\n  ringsh supervisor ringConfigSet ${RING} chordpurge_enable 1\ndone</pre><h2>Phase 4 — Upgrade des Connectors SOFS</h2><p>Les connectors SOFS sont upgrages <strong>en dernier</strong>, apres tous les storage nodes. Regles importantes :</p><ul><li>Les connectors SOFS peuvent generalement etre upgrages un par un (service continu si plusieurs connectors par volume)</li><li><strong>Exception SOFS 9.1 -> 9.2+</strong> : tous les connectors du volume doivent etre arretes avant d\'upgrader le premier (voir matrice de compatibilite)</li><li>Avant l\'upgrade d\'un connector : verifier que sfused et membershipd sont en etat sain</li><li>Apres l\'upgrade : verifier que le volume est monte et accessible</li></ul><pre># Pre-check connector SOFS avant upgrade\nsystemctl status scality-sfused\nsystemctl status scality-membershipd\ndf -h /sofs/volume1  # verifier le montage</pre><div class="kbox"><h3>Points Cles a Retenir</h3><ul><li>RING 7 -> RING 9 INTERDIT directement : passer par RING 8 obligatoirement</li><li>Ticket Scality Support OBLIGATOIRE avant de commencer</li><li>Tmux/Screen OBLIGATOIRE : une deconnexion SSH en cours d\'upgrade est catastrophique</li><li>Ordre strict : Supervisor -> Storage Servers (UN PAR UN) -> Connectors SOFS</li><li>Entre chaque storage server : attendre RUN (CONF_MISMATCH accepte, INCOMPLETE interdit)</li><li>CONF_MISMATCH post-upgrade Supervisor = NORMAL, NE PAS cliquer Apply Config</li><li>CRR pre-upgrade : obligatoire si CRR actif et upgrade depuis &lt; 9.5.2.0</li></ul></div>',
quiz:[
{q:"Vous avez un RING en version 7.8. Pouvez-vous upgrader directement vers 9.5.2 ?",opts:["Oui, si la version est recente","Non -- passage obligatoire par RING 8 d'abord","Oui, mais uniquement avec l'installeur offline","Non -- il faut d'abord aller en 7.9 puis 8.x puis 9.x"],ans:1,expl:"Un upgrade direct de RING 7 vers RING 9 est INTERDIT. Il faut obligatoirement passer par RING 8. Contacter Scality Support pour definir le chemin exact."},
{q:"Apres l'upgrade du Supervisor, l'UI affiche CONF_MISMATCH. Que faites-vous ?",opts:["Cliquer Apply configuration immediatement","Redemarrer le Supervisor","Ne rien faire -- c'est normal, se corrige lors de l'upgrade des storage nodes","Appeler Scality Support -- c'est un bug critique"],ans:2,expl:"CONF_MISMATCH apres l'upgrade du Supervisor est NORMAL. Il disparaitra lors de l'upgrade des storage nodes. Cliquer Apply = interruption de service."},
{q:"Vous upgradez un storage server. Le RING est en etat INCOMPLETE avant de commencer. Que faites-vous ?",opts:["Continuer -- INCOMPLETE est acceptable","Stopper et corriger l'etat INCOMPLETE avant tout upgrade","C'est pareil que CONF_MISMATCH","Contacter Scality mais continuer en parallele"],ans:1,expl:"L'upgrade ne peut commencer que si le RING est en etat RUN ou CONF_MISMATCH. INCOMPLETE indique des donnees insuffisamment repliquees -- upgrader dans cet etat risque une perte de donnees."},
{q:"Vous avez des SOFS connectors en version 9.1 a upgrader vers 9.5.2. Quelle est la contrainte critique ?",opts:["Upgrade un connector a la fois, le volume reste disponible","Arreter TOUS les connectors du volume avant d'upgrader le premier","Faire l'upgrade intermediaire vers 8.5.8.7 d'abord","Mettre le volume en read-only pendant l'upgrade"],ans:1,expl:"De RING 9.1 vers 9.2+, le format de metadonnees SOFS change. Les connectors <9.2 et >=9.2 ne sont pas compatibles sur le meme volume. TOUS les connectors doivent etre arretes avant d'upgrader le premier."},
{q:"Quel terminal est recommande par Scality pour lancer les upgrades RING ?",opts:["PuTTY","Tmux ou Screen -- maintiennent la session en cas de deconnexion","SSH simple","WinSCP"],ans:1,expl:"Scality recommande Tmux (Unix) ou Screen (Linux). Ces multiplexeurs maintiennent la session active meme si la connexion SSH est interrompue. Une deconnexion en milieu d'upgrade serait catastrophique."},
{q:"Quelle est l'etape obligatoire AVANT de telecharger et d'appliquer l'upgrade RING ?",opts:["Sauvegarder tous les buckets S3","Arreter tous les connectors SOFS","Ouvrir un ticket Scality Support","Desactiver Prometheus"],ans:2,expl:"Ouvrir un ticket Scality Support EST OBLIGATOIRE avant de commencer un upgrade RING. L'equipe valide la readiness du systeme et peut assister en cas de probleme."}
]},
{id:'MC',num:'C',title:'S3 Connector — repd et Raft',desc:'Architecture interne S3 : repd, Raft sessions, bucketd, vault, alertes',
content:'<h2>Architecture Interne du S3 Connector</h2><p>Le S3 Connector Scality est une pile de <strong>services conteneurise (Docker)</strong> qui offre une API S3 compatible AWS. La plupart de ces services sont <strong>stateless</strong> (ils peuvent etre redemarres ou scales independamment), a l\'exception du service de metadonnees stateful base sur <strong>Raft</strong>.</p><div class="adiag">+----------------------------------------------------------+\n|                   S3 CONNECTOR STACK                    |\n|                                                          |\n|  [S3 Frontend]  &lt;-- load balancer HTTP                  |\n|       |                                                  |\n|  [Cloudserver]  -- API S3 (stateless, scalable)          |\n|    /       \\                                             |\n| [Vault]   [S3 Metadata]                                  |\n| (IAM)     (buckets/objets)                               |\n|    |            |                                        |\n| [repd-vault] [repd]  -- services STATEFUL (Raft)         |\n|                |                                         |\n|        [RING DATA via sproxyd]                           |\n+----------------------------------------------------------+\n\nServices ancillaires :\n  Backbeat (CRR/Lifecycle) . Redis-Sentinel . Prometheus\n  Zookeeper . UTAPI (facturation)</div><h2>Les Services du S3 Connector</h2><table><tr><th>Service</th><th>Stateful ?</th><th>Role</th></tr><tr><td><strong>S3 Frontend</strong></td><td>Non</td><td>Load balancer HTTP devant Cloudserver. Termine le TLS.</td></tr><tr><td><strong>Cloudserver</strong></td><td>Non</td><td>Implémente l\'API S3 AWS. Traduit les requetes S3 en appels Vault (IAM) + S3 Metadata + RING sproxyd.</td></tr><tr><td><strong>Vault</strong></td><td>Non</td><td>Service IAM : authentifie les requetes S3 (access key / secret key), gere les comptes, users, groupes, policies.</td></tr><tr><td><strong>bucketd</strong></td><td>Non</td><td>Service de gestion des buckets. Interface entre Cloudserver et le service de metadonnees.</td></tr><tr><td><strong>repd</strong></td><td><strong>Oui (Raft)</strong></td><td>Service de metadonnees S3 : stocke de facon durable et consistante les metadonnees de buckets et d\'objets.</td></tr><tr><td><strong>repd-vault</strong></td><td><strong>Oui (Raft)</strong></td><td>Service de metadonnees IAM : stocke les comptes, users, groupes, policies de facon durable.</td></tr><tr><td><strong>Redis-Sentinel</strong></td><td>Partiel</td><td>Cache distribue pour les metadonnees chaudes. Accelere les lookups. Sentinel assure la HA de Redis.</td></tr><tr><td><strong>Backbeat</strong></td><td>Partiel</td><td>Workflows asynchrones : CRR (replication inter-clusters), Lifecycle (expiration objets), Ingestion.</td></tr><tr><td><strong>Prometheus</strong></td><td>Oui</td><td>Collecte les metriques de tous les services S3. Alimente Grafana.</td></tr><tr><td><strong>ZooKeeper</strong></td><td>Oui</td><td>Coordination distribuee pour Backbeat et certains services S3.</td></tr><tr><td><strong>UTAPI</strong></td><td>Non</td><td>Utilization API : mesure et expose la consommation par compte/bucket pour la facturation.</td></tr></table><h2>repd — Le Service de Metadonnees Stateful</h2><p><code>repd</code> (Replication Daemon) est <strong>le coeur stateful du S3 Connector</strong>. C\'est lui qui assure la persistance et la coherence forte des metadonnees S3. Il est critique car :</p><ul><li>Chaque PUT S3 ecrit des metadonnees dans repd (cle, taille, ETag, ACL, tags, version...)</li><li>Chaque GET S3 lit les metadonnees depuis repd pour localiser l\'objet dans le RING</li><li>Chaque LIST S3 parcourt les metadonnees dans repd pour retourner la liste des objets d\'un bucket</li></ul><h3>Backend de stockage de repd : LevelDB</h3><p>repd expose une API de metadonnees. En interne, les donnees sont persistees dans un moteur de stockage embarque. Le backend utilise par defaut est <strong>LevelDB</strong>, developpe par Google :</p><ul><li><strong>LevelDB</strong> : base cle-valeur embarquee (pas de serveur separe), stockage sur disque en "sorted string tables" (SST files). Tres performante pour les ecritures sequentielles et les lectures d\'objets individuels. Chaque session Raft (chaque noeud repd) maintient son propre fichier LevelDB local — Raft garantit que tous les noeuds voient les memes donnees.</li><li><strong>MongoDB</strong> : backend alternatif supporte pour les tres grands volumes de metadonnees (millions de buckets/objets). Externe a repd, necessite son propre cluster.</li></ul><p class="alert-i"><strong>Note sur RocksDB :</strong> RocksDB (fork de LevelDB par Facebook, plus performant) n\'est <strong>pas mentionne dans la documentation officielle Scality RING 9.5</strong>. Ne pas confondre : c\'est LevelDB qui est le backend embarque de repd dans la version actuelle.</p><h2>Raft Sessions — Le Protocole de Consensus</h2><p>Raft est un algorithme de consensus distribue cree pour etre <strong>comprehensible et correct</strong>. Il est utilise par repd pour garantir que toutes les instances du service de metadonnees voient les memes donnees dans le meme ordre.</p><h3>Composants d\'une Raft Session</h3><div class="adiag">Raft Session "s3-metadata-0" (5 noeuds) :\n\nEtat initial (tout va bien) :\n  [Node1: LEADER] -- repond aux ecritures, replique vers followers\n  [Node2: follower] -- replique depuis le leader\n  [Node3: follower] -- replique depuis le leader\n  [Node4: follower] -- replique depuis le leader\n  [Node5: follower] -- replique depuis le leader\n\n  Quorum ecriture = 3/5 noeuds (majorite simple)\n  Quorum lecture = 1 noeud (n\'importe lequel)\n\nSi Node1 (leader) tombe :\n  [Node1: DOWN]\n  [Node2: CANDIDATE] -- declenche une election\n  [Node3: follower]  -- vote pour Node2\n  [Node4: follower]  -- vote pour Node2\n  [Node5: follower]  -- vote pour Node2\n  -> Node2 elu nouveau LEADER en quelques secondes\n  -> Quorum = 3/4 = OK, ecritures reprennent</div><h3>Les 3 etats d\'un noeud Raft</h3><table><tr><th>Etat</th><th>Description</th><th>Quand</th></tr><tr><td><strong>Leader</strong></td><td>Noeud qui gere toutes les ecritures. Il envoie les "heartbeats" aux followers pour signaler qu\'il est vivant. Il replique chaque ecriture vers les followers avant de confirmer au client.</td><td>Elu par vote majoritaire. 1 seul leader par session a tout moment.</td></tr><tr><td><strong>Follower</strong></td><td>Noeud passif qui repond aux requetes du leader (replication). Peut servir les lectures selon la configuration. Si il ne recoit plus de heartbeat, il devient Candidate.</td><td>Etat par defaut de tous les noeuds sauf le leader.</td></tr><tr><td><strong>Candidate</strong></td><td>Noeud qui a declare son intention d\'etre leader et demande des votes. Si il obtient la majorite, il devient Leader.</td><td>Quand un follower timeout sans heartbeat du leader.</td></tr></table><h3>Numeros de sequence Raft (metriques cles)</h3><p>Chaque entree du log Raft est numerotee sequentiellement. Ces numeros permettent de detecter les desynchronisations :</p><ul><li><code>raft_aseq</code> : "applied sequence" — dernier index applique a la base de donnees locale</li><li><code>raft_cseq</code> : "commit sequence" — dernier index valide par le quorum (commite)</li><li><code>raft_bseq</code> : "base sequence" — premier index encore en memoire (avant compaction)</li><li><code>raft_term</code> : numero du "mandat" du leader actuel (incremente a chaque election)</li></ul><p>Une alerte <code>S3RaftFollowerDesynchCritical</code> se declenche si : <code>max(cseq) - min(cseq) &gt; 10000</code> — un follower est a plus de 10000 operations de retard par rapport au leader.</p><h2>Diagnostiquer une Raft Session en Probleme</h2><h3>Verifier l\'etat de la session</h3><pre># Depuis le Supervisor ou un noeud du cluster S3\n# Les metriques Raft sont exposees par Prometheus\n# Interroger Prometheus directement :\ncurl -s http://prometheus:9090/api/v1/query \\\n  \'?query=s3_metadata_stateful_raft_is_leader\' | python3 -m json.tool\n\n# Resultat : 1 = leader, 0 = follower/candidate\n# Verifier qu\'il y a exactement 1 leader par session</pre><h3>Scénarios d\'incidents Raft</h3><table><tr><th>Scenario</th><th>Alerte</th><th>Impact</th><th>Resolution</th></tr><tr><td>Leader tombe</td><td>S3RaftNoLeaderCritical (apres 5 min)</td><td>Ecritures S3 bloquees temporairement</td><td>L\'election automatique resout en quelques secondes. Si bloque : redemarrer les noeuds repd un par un.</td></tr><tr><td>2 noeuds DOWN sur 5</td><td>S3RaftNotEnoughFollowersWarning</td><td>Quorum maintenu (3/5) mais fragile</td><td>Redemarrer ou remplacer les noeuds DOWN rapidement.</td></tr><tr><td>3 noeuds DOWN sur 5</td><td>S3RaftNotEnoughFollowersCritical</td><td>Quorum perdu : ecritures BLOQUEES</td><td>Urgence : restaurer au moins 1 noeud DOWN pour retrouver 3/5 noeuds actifs.</td></tr><tr><td>Elections repetees</td><td>S3RaftElectionWarning</td><td>Instabilite : performances degradees, risque de perte de leader</td><td>Investiguer la latence reseau et la charge CPU des noeuds repd.</td></tr><tr><td>Follower en retard</td><td>S3RaftFollowerDesynchCritical</td><td>Le follower a un etat ancien (peut servir des lectures perimees)</td><td>Verifier les I/O et la bande passante. Redemarrer le follower en retard.</td></tr></table><h2>bucketd — Gestionnaire de Buckets</h2><p><code>bucketd</code> est le service intermediaire entre Cloudserver et repd. Il ne stocke pas lui-meme des donnees : il <strong>orchestre les operations sur les buckets</strong> en dialoguant avec repd.</p><h3>Flux d\'une requete ListObjects</h3><div class="adiag">Client S3 : GET /?list-type=2\n       |\n       v\n  [S3 Frontend]  (load balancer)\n       |\n       v\n  [Cloudserver]  -- recoit la requete, authentifie via Vault\n       |\n       v\n   [bucketd]     -- traduit la requete en scan d\'index de metadonnees\n       |\n       v\n   [repd]        -- parcourt le LevelDB local (Raft leader)\n                     retourne la liste paginee\n       |\n       v\n  [Cloudserver]  -- formate la reponse XML S3\n       |\n       v\n   Client S3 : reponse XML avec la liste des objets</div><h3>Operations gerees par bucketd</h3><table><tr><th>Operation S3</th><th>Role de bucketd</th></tr><tr><td>CreateBucket</td><td>Cree l\'entree de bucket dans repd (namespace, versioning, ACL)</td></tr><tr><td>DeleteBucket</td><td>Verifie que le bucket est vide puis supprime l\'entree dans repd</td></tr><tr><td>ListObjects / ListObjectsV2</td><td>Scan pagine de l\'index de metadonnees dans repd</td></tr><tr><td>GetBucketVersioning</td><td>Lit la configuration de versioning du bucket dans repd</td></tr><tr><td>PutBucketAcl / Policy</td><td>Ecrit les ACL/policies du bucket dans repd</td></tr></table><p class="alert-d"><strong>S3BucketdDownCritical</strong> : si bucketd est DOWN, toutes les operations sur les buckets sont bloquees (CreateBucket, DeleteBucket, ListObjects) meme si Cloudserver est UP. Les GET/PUT d\'objets individuels existants peuvent continuer si Cloudserver peut contourner bucketd pour les metadonnees d\'objet simples.</p><h2>Redis-Sentinel — Cache Distribue Haute Disponibilite</h2><p>XDM utilise <strong>Redis-Sentinel</strong> pour fournir une base de donnees en memoire hautement disponible. Comme le decrit la documentation Scality : <em>"Redis-Sentinel is useful for short-term database needs, such as for a quick or temporary job, or for sharing as a shared database between two or more services."</em></p><h3>Services utilisant Redis-Sentinel</h3><table><tr><th>Service</th><th>Usage de Redis</th></tr><tr><td><strong>Backbeat (CRR)</strong></td><td>Stocke l\'etat de pause/resume de la replication inter-clusters. Redis conserve la file des objets en attente de replication et les flags pause/retry.</td></tr><tr><td><strong>Cloudserver</strong></td><td>Cache de sessions et de metadonnees chaudes. Reduit la pression sur repd pour les objets frequemment accedes.</td></tr><tr><td><strong>Backbeat API</strong></td><td>Base partagee pour les jobs Backbeat (lifecycle, ingestion). Coordonne les workers Backbeat.</td></tr></table><h3>Architecture Redis-Sentinel</h3><div class="adiag">Redis-Sentinel sur 3 noeuds (exemple) :\n\n  [Sentinel-1]  [Sentinel-2]  [Sentinel-3]\n       |              |              |\n       +----[Redis Master]----+\n       |                     |\n  [Redis Replica-1]   [Redis Replica-2]\n\nRole des sentinels :\n  - Surveille la sante du master en permanence\n  - Si master tombe : vote a la majorite pour promouvoir un replica\n  - Notifie les clients du nouveau master\n\nRisque : Redis est IN-MEMORY. Un restart = perte des donnees non flushees.\nUsage dans RING = donnees TEMPORAIRES uniquement (jobs, cache, flags CRR).</div><p class="alert-w"><strong>Important :</strong> Redis-Sentinel garantit la HA mais <strong>pas</strong> la durabilite. Les donnees Redis ne sont pas persistees de facon fiable. Pour les metadonnees S3 durables, c\'est repd (LevelDB + Raft) qui est utilise, pas Redis.</p><h2>Vault — Service IAM</h2><p><code>vault</code> est le service d\'<strong>Identity and Access Management (IAM)</strong> du S3 Connector. Il gere :</p><ul><li><strong>Comptes S3</strong> : creation, suppression, listing</li><li><strong>Utilisateurs IAM</strong> : cles d\'acces (AccessKey/SecretKey), permissions</li><li><strong>Groupes et Roles</strong> : politiques d\'acces multi-utilisateurs</li><li><strong>Policies</strong> : politiques JSON compatibles AWS IAM (Allow/Deny)</li></ul><p>Vault s\'appuie sur <code>repd-vault</code> pour stocker ses donnees de facon durable via Raft. L\'alerte <code>S3VaultDownCritical</code> bloque toute authentification S3 : aucune requete ne peut etre validee.</p><div class="kbox"><h3>Points Cles a Retenir</h3><ul><li>repd = daemon de metadonnees S3 STATEFUL (Raft) : cle pour chaque PUT/GET/LIST</li><li>repd-vault = meme principe pour les metadonnees IAM (comptes, users, policies)</li><li>Raft session = Leader (1) + Followers (N) : quorum = N/2+1 noeuds</li><li>S3RaftNoLeaderCritical = ecritures S3 bloquees, election auto en quelques secondes</li><li>S3RaftNotEnoughFollowersCritical = quorum perdu (>N/2 noeuds DOWN) = ecritures BLOQUEES</li><li>bucketd = orchestre les operations sur les buckets (ListObjects, CreateBucket...)</li><li>Vault = IAM/authentification (cles d\'acces, policies)</li><li>raft_term = numero du mandat du leader (incremente a chaque election)</li><li>LevelDB = backend embarque de repd (par defaut) — NOT RocksDB ni MongoDB</li><li>Redis-Sentinel = cache IN-MEMORY pour CRR pause/retry, Cloudserver, Backbeat API — pas de durabilite forte</li></ul></div>',
quiz:[
{q:"Quel daemon du S3 Connector est STATEFUL et utilise le protocole Raft pour la coherence ?",opts:["Cloudserver","Backbeat","repd","S3 Frontend"],ans:2,expl:"repd (Replication Daemon) est le service STATEFUL qui stocke les metadonnees S3 via Raft. Cloudserver et S3 Frontend sont stateless."},
{q:"Dans une Raft session a 5 noeuds, combien de noeuds DOWN peut-on tolerrer tout en maintenant le quorum d'ecriture ?",opts:["1","2","3","4"],ans:1,expl:"Quorum = N/2+1 = 3 noeuds sur 5. On peut perdre 5-3=2 noeuds. Si on en perd 3, le quorum est perdu et les ecritures S3 sont bloquees."},
{q:"Quelle alerte Prometheus indique qu'une Raft session n'a plus de leader depuis 5 minutes ?",opts:["S3RaftElectionWarning","S3RaftFollowerDesynchCritical","S3RaftNoLeaderCritical","S3RepdServerDownCritical"],ans:2,expl:"S3RaftNoLeaderCritical se declenche quand aucun leader n\'existe dans la session depuis 5 minutes. Les ecritures S3 sont bloquees jusqu\'a election d\'un nouveau leader."},
{q:"Que mesure la metrique raft_term dans une Raft session ?",opts:["Le nombre total d'objets","Le numero du mandat du leader (incremente a chaque election)","La latence moyenne des ecritures","Le nombre de followers actifs"],ans:1,expl:"raft_term est le numero du 'mandat' du leader actuel. Il est incremente a chaque election. Un raft_term qui augmente frequemment indique une instabilite du cluster (S3RaftElectionWarning)."},
{q:"Le service Vault du S3 Connector est en panne (S3VaultDownCritical). Quel est l'impact immédiat ?",opts:["Les objets S3 sont illisibles","Toute authentification S3 est bloquee : aucune requete ne peut etre validee","Seuls les PUT sont bloques, les GET fonctionnent","Backbeat s'arrete"],ans:1,expl:"Vault est le service IAM du S3 Connector. Sans Vault, aucune cle d\'acces ne peut etre validee. Toutes les requetes S3 echouent avec une erreur 403 InvalidAccessKeyId, qu\'elles soient en lecture ou ecriture."},
{q:"Quel service du S3 Connector est responsable de la liste des objets dans un bucket (ListObjects) ?",opts:["Cloudserver uniquement","repd directement","bucketd","Vault"],ans:2,expl:"bucketd est le service intermediaire qui gere les operations sur les buckets : ListObjects, creation/suppression de bucket, ACL et policies de bucket. L'alerte S3BucketdDownCritical bloque ces operations."},
{q:"Quel est le backend de stockage utilise par defaut dans repd pour persister les metadonnees S3 ?",opts:["RocksDB","MongoDB","Redis","LevelDB"],ans:3,expl:"repd utilise LevelDB (base cle-valeur embarquee de Google) comme backend par defaut. Chaque noeud repd maintient son propre fichier LevelDB local. Raft garantit que tous les noeuds voient les memes donnees. RocksDB n\'est pas mentionne dans la documentation Scality RING 9.5."},
{q:"Pour quels services Redis-Sentinel est-il utilise dans le S3 Connector Scality ?",opts:["Stockage durable des metadonnees S3","CRR pause/retry, CloudServer sessions, Backbeat API","Authentification IAM uniquement","Metriques Prometheus"],ans:1,expl:"Selon la documentation Scality (RING_Reference section 9.7) : XDM utilise Redis-Sentinel pour CRR (pause et retry), CloudServer et Backbeat API. Redis est IN-MEMORY et sert pour des besoins de COURT TERME. Les metadonnees S3 durables sont dans repd/LevelDB."},
{q:"Quel est le role des sentinels dans l\'architecture Redis-Sentinel ?",opts:["Stocker les metadonnees S3","Surveiller la sante du master et promouvoir un replica en cas de panne","Remplacer bucketd pour la gestion des buckets","Replier le trafic S3 vers un datacenter secondaire"],ans:1,expl:"Les sentinels surveillent en permanence la sante du master Redis. En cas de panne, ils votent a la majorite pour promouvoir un replica en nouveau master, assurant la haute disponibilite. Redis reste IN-MEMORY : les donnees non flushees peuvent etre perdues au restart."}
]}
,
{id:'MD',num:'D',title:'Maintenance RING — Salt, GC, Orphans',desc:'SaltStack de Scality, cycle de vie des donnees (GC/Purge/Relocation), types d\'orphelins et commandes de nettoyage',
content:'<h2>Salt / SaltStack — L\'Outil de Configuration de Scality</h2><p>Scality RING utilise <strong>SaltStack</strong> comme outil de gestion de configuration et d\'orchestration. "Salt" dans les commandes Scality fait toujours reference a SaltStack — un logiciel de gestion d\'infrastructure comparable a Ansible ou Puppet, et <strong>non</strong> un "sel" cryptographique pour les hachages.</p><h3>Architecture SaltStack dans RING</h3><div class="adiag">Architecture Salt dans Scality RING :\n\n  [Salt Master]  -- sur le SUPERVISOR\n       |\n       |-- commandes/etats/pillar\n       |\n  +----+----+----+----+\n  |    |    |    |    |\n [Salt Minion] x N    -- sur chaque serveur RING\n (storage, connector, monitoring...)\n\nConfiguration :\n  /srv/scality/pillar/scality-common.sls  -- parametres globaux\n  /srv/scality/salt/                      -- etats Salt (formulas)\n  /srv/scality/bin/bootstrap              -- script d\'initialisation</div><h3>Commandes Salt courantes dans RING</h3><table><tr><th>Commande</th><th>Effet</th></tr><tr><td><code>salt \'*\' saltutil.refresh_pillar</code></td><td>Recharge la configuration (pillar) sur tous les noeuds. A executer apres toute modification de scality-common.sls.</td></tr><tr><td><code>salt-run state.orchestrate prometheus.orchestrate</code></td><td>Deploy ou reconfigure l\'infrastructure Prometheus/Alertmanager. A executer apres toute modification de la configuration de monitoring.</td></tr><tr><td><code>salt -G \'roles:ROLE_STORE\' state.sls scality.garbage_collector.configured</code></td><td>Applique la configuration du Garbage Collector sur tous les serveurs de stockage.</td></tr><tr><td><code>salt -G \'roles:ROLE_SUP\' state.sls ...</code></td><td>Applique un etat Salt uniquement sur le Supervisor.</td></tr><tr><td><code>salt &lt;minion_id&gt; grains.get prometheus_ip</code></td><td>Recupere la valeur d\'un "grain" (metadonnee de noeud) — utile pour les remplacements de noeud.</td></tr></table><p class="alert-i"><
