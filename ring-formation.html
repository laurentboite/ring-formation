{id:'16',num:'16',title:'Multi-site et Disaster Recovery',desc:'Topologies stretched vs asynchrone, Warm Standby (WSB), procédures de failover/failback, bseq de rattrapage',
content:'<h2>Topologies Multi-Sites Scality</h2><p>Scality RING supporte deux paradigmes de déploiement multi-sites fondamentalement différents :</p><table><tr><th>Modèle</th><th>RPO</th><th>Basculement</th><th>Description</th></tr><tr><td><strong>Stretched (geo-etire)</strong></td><td>0 (synchrone)</td><td>Automatique (secondes)</td><td>Un seul RING logique reparti physiquement sur 2 ou 3 sites. Les écritures sont synchrones entre sites. La perte d\'un site ne cause pas de perte de données.</td></tr><tr><td><strong>Asynchrone (CRR)</strong></td><td>Non nul (minutes)</td><td>Manuel</td><td>Deux RINGs indépendants avec réplication asynchrone via CRR/Backbeat. RPO = temps de lag de réplication. Basculement manuel require.</td></tr></table><h3>Topologies Stretched Supportees</h3><div class="adiag">Topologies geographiques supportées (Stretched) :\n\n  3 SITES (failover automatique si 1 site tombe) :\n  Site A (4 serveurs) + Site B (4 serveurs) + Site C (4 serveurs)\n  -> Perte d\'un site : quorum maintenu (2/3 sites)\n  -> 12 serveurs minimum\n\n  2 SITES + WITNESS :\n  Site A (majority : 5 md) + Site B (minority : 3 md) + Site C (1 witness)\n  -> Witness = ZooKeeper seul, pas de données\n  -> Perte du Site B : failover automatique (majority + witness)\n  -> Perte du Site A : failover manuel requis\n  -> 9 serveurs minimum + 1 witness\n\n  Metadata S3 (repd) :\n  5 nœuds actifs (md1 a md5) + 1 Warm Standby (wsb1)\n  Les nœuds sont répartis entre les sites selon la topologie</div><h2>Warm Standby (WSB)</h2><p>Le <strong>Warm Standby</strong> est un nœud metadata passif qui suit en "shadow" un nœud actif. Il est pré-configuré mais n\'est pas membre actif des sessions Raft.</p><table><tr><th>Aspect</th><th>Nœud Actif (md)</th><th>Warm Standby (wsb)</th></tr><tr><td>Nom dans l\'inventaire</td><td><code>md1-cluster1</code></td><td><code>wsb1-cluster1</code></td></tr><tr><td>Membre Raft</td><td>Oui (vote pour les elections)</td><td>Non (spectateur, suit le journal)</td></tr><tr><td>Trafic S3</td><td>Oui (serveur des requêtes)</td><td>Non (aucun trafic en mode standby)</td></tr><tr><td>Activation</td><td>Toujours actif</td><td>Activate via Ansible (<code>-t DR</code>) en cas de perte de site</td></tr></table><h3>Metriques de suivi du rattrapage : bseq</h3><p>La metrique <code>bseq</code> (backup sequence) indique le dernier index du journal Raft copie sur un nœud. Elle est critique pour valider qu\'un nœud (ou WSB) a bien rattrape le leader avant d\'activer un basculement :</p><pre># Vérifier les sequences Raft de tous les nœuds\ncurl -s http://prometheus:9090/api/v1/query \\\n  \'?query=s3_metadata_stateful_raft_bseq\'\n\n# Un nœud est "a jour" quand son bseq = cseq du leader\n# Pendant le rattrapage : bseq < cseq (ecart decreissant)</pre><h2>Procédures de Failover et Failback</h2><h3>Perte du site MINORITY (scenario simple)</h3><div class="adiag">État initial : Site A (majority) + Site B (minority, DOWN)\n\n  md1-cluster1 (Site A) : LEADER  [UP]\n  md2-cluster1 (Site A) : follower [UP]\n  md3-cluster1 (Site A) : follower [UP]\n  md4-cluster1 (Site B) : follower [DOWN] <- site perdu\n  md5-cluster1 (Site B) : follower [DOWN] <- site perdu\n  wsb1-cluster1 (Site B): standby  [DOWN]\n\n  Quorum = 3/5 = OK (majority intact)\n  Impact : warnings mais le S3 continue a fonctionner\n  Action : reparer ou remplacer les nœuds Site B</div><h3>Perte du site MAJORITY (scenario critique)</h3><div class="adiag">État : Site A (majority, DOWN) + Site B (minority)\n\n  md1 a md3 (Site A) : [DOWN]\n  md4-cluster1 (Site B) : follower [UP]\n  md5-cluster1 (Site B) : follower [UP]\n  wsb1-cluster1 (Site B): standby  [UP]\n\n  Quorum = 2/5 < 3 = PERDU -> S3 bloqué !\n\n  Procédure de DR (failover vers Site B) :\n  1. Vérifier que wsb1 a un bseq recent (pas trop de lag)\n  2. ansible-playbook ... -t DR  # active wsb1 comme membre Raft\n  3. ZooKeeper reconfiguré : 5 -> 3 participants\n  4. Nouveau quorum = 2/3 nœuds = OK\n  5. Redis Sentinel reset : redis-cli sentinel reset scality-s3\n  6. S3 reprend sur Site B seul\n\n  RTO : quelques minutes a quelques heures</div><h3>Failback — Retour a la normale</h3><p>Après la restauration du site majority (Site A) :</p><ol><li>Vérifier les stats Backbeat CRR (backlog proche de zero) avant de basculer</li><li>Arrêter les containers S3 sur Site B (avant de reajouter Site A pour éviter des corruptions metadata)</li><li>Rejoindre les nœuds Site A comme followers (bseq doit rattraper le leader)</li><li>Attendre que bseq soit a parite avec cseq sur tous les nœuds Site A</li><li>Utiliser <code>crrExistingObjects.js --target-replication-status REPLICA</code> pour re-synchroniser les objets créés pendant le DR</li><li>Rebasculer le leader vers Site A (optionnel, le RING se rééquilibre seul)</li><li>Désactiver wsb1 et le remettre en mode standby</li></ol><p class="alert-d"><strong>Critique :</strong> Ne jamais reajouter le site récupère sans s\'assurer que les containers S3 sont arrêtés dessus. Un site qui "revient" avec des données plus anciennes et qui commence a répondre aux requêtes peut créer des corruptions metadata (split brain).</p><div class="kbox"><h3>Points Clés a Retenir</h3><ul><li>Stretched = 1 RING logique, synchrone, RPO=0, failover auto (3 sites) ou manuel (2 sites)</li><li>Asynchrone (CRR) = 2 RINGs indépendants, RPO non nul, failover toujours manuel</li><li>WSB (Warm Standby) = nœud passif pré-configuré, active via Ansible -t DR</li><li>bseq = backup sequence : metrique pour vérifier le rattrapage d\'un nœud après une panne</li><li>Perte minority = quorum maintenu, S3 continue ; perte majority = DR obligatoire</li><li>Failback : toujours arrêter les containers sur le site récupère AVANT de le reajouter</li><li>Redis Sentinel reset obligatoire après failover : redis-cli sentinel reset scality-s3</li></ul></div>',
quiz:[
  {q:"Quelle est la différence entre une architecture stretched et une architecture asynchrone multi-site ?",opts:["Il n'y a pas de différence","Stretched : un seul ring couvrant deux sites (synchrone). Asynchrone : deux rings indépendants avec CRR","Stretched est plus lent","Asynchrone ne supporte pas le DR"],ans:1,expl:"Architecture stretched = un ring physiquement réparti sur 2 sites, écritures synchrones. Architecture asynchrone = 2 rings indépendants reliés par CRR, RPO non nul mais meilleure isolation des pannes."},
  {q:"Que signifie WSB (Warm Standby) ?",opts:["Write Standby Buffer","Warm Standby : site secondaire recevant les données en quasi-temps réel, prêt pour bascule rapide","Wide Scale Backup","Working Standby Bandwidth"],ans:1,expl:"Warm Standby (WSB) est un mode où le site secondaire reçoit les données via CRR et est maintenu 'chaud' (prêt). La bascule est rapide car les données sont déjà présentes, contrairement à un Cold Standby."},
  {q:"Qu'est-ce que le RPO ?",opts:["Recovery Point Objective : perte de données maximale tolérée en cas de sinistre","Recovery Process Order : ordre de redémarrage des services","Ring Protection Object : objet de protection du ring","Remote Proxy Opération"],ans:0,expl:"RPO (Recovery Point Objective) définit la perte de données maximale tolérée, exprimée en durée. Un RPO de 15 minutes signifie que 15 minutes de données peuvent être perdues en cas de sinistre."},
  {q:"Qu'est-ce que le RTO ?",opts:["Ring Topology Order","Recovery Time Objective : durée maximale tolérée d'interruption de service","Real-Time Opération","Réplication Timeout Object"],ans:1,expl:"RTO (Recovery Time Objective) définit combien de temps le service peut rester indisponible après un incident. Il dicte la rapidité nécessaire de la procédure de failover."},
  {q:"Lors d'un failover vers le site secondaire, quelle est la première étape ?",opts:["Supprimer les données du site primaire","Vérifier la cohérence des données répliquées (lag CRR, bseq de rattrapage) avant de basculer le DNS","Reformater le site primaire","Désactiver Backbeat"],ans:1,expl:"Avant tout failover, vérifier le lag CRR et la cohérence via les bseq permet d'évaluer la perte de données potentielle (RPO effectif) et de décider si la bascule est acceptable."},
  {q:"Pourquoi une architecture stretched a-t-elle un RPO de zéro mais un RTO potentiellement plus élevé qu'une architecture asynchrone ?",opts:["C'est l'inverse : RPO non nul et RTO faible","RPO=0 car toute écriture est confirmée sur les deux sites synchroniquement. Mais si le lien inter-sites est coupé, le ring ne peut plus écrire (split-brain), augmentant potentiellement le RTO","L'architecture stretched n'a pas de RPO","RPO=0 uniquement pour les métadonnées"],ans:1,expl:"En architecture stretched, chaque écriture attend la confirmation des deux sites : RPO=0. Mais en cas de coupure du lien inter-sites, le ring se fragmente et peut refuser les écritures pour éviter le split-brain, impactant le RTO. L'architecture asynchrone tolère la coupure du lien (site local continue) mais au prix d'un RPO non nul."},
  {q:"Qu'est-ce qu'un Cold Standby par opposition à un Warm Standby ?",opts:["Un site Cold Standby est plus froid physiquement","Un site Cold Standby ne reçoit pas de données en temps réel : les données y sont copiées périodiquement (backup). La bascule est plus longue car il faut restaurer les données récentes","Un site Cold Standby est identique à un Warm Standby","Le Cold Standby est en lecture seule"],ans:1,expl:"Cold Standby : les données sont copiées périodiquement (ex: backup nocturne). RPO = temps depuis le dernier backup. La bascule nécessite une restauration. Warm Standby : données répliquées quasi en temps réel via CRR, bascule rapide avec RPO proche de zéro."},
  {q:"Comment tester un plan de DR sans impacter la production ?",opts:["Il est impossible de tester un DR sans impact","Effectuer des exercices de failover sur un environnement de test isolé, ou des tests partiels (failover d'un subset de buckets) en production avec retour en arrière planifié","Simuler uniquement sur papier","Attendre un vrai incident pour tester"],ans:1,expl:"Les tests DR doivent être réguliers pour valider les procédures et mesurer RTO/RPO réels. La bonne pratique est de tester sur un environnement de staging ou d'effectuer des drills partiels en production (failover d'un bucket non critique) avec procédure de rollback documentée."}
],
title_en:'Multi-Site and Disaster Recovery',
desc_en:'Stretched vs asynchronous topologies, Warm Standby (WSB), failover/failback procedures, bseq catch-up',
content_en:'<h2>Scality Multi-Site Topologies</h2><p>Scality RING supports two fundamentally different multi-site deployment paradigms:</p><table><tr><th>Model</th><th>RPO</th><th>Failover</th><th>Description</th></tr><tr><td><strong>Stretched (geo-stretched)</strong></td><td>0 (synchronous)</td><td>Automatic (seconds)</td><td>A single logical RING spread physically across 2 or 3 sites. Writes are synchronous between sites. The loss of one site causes no data loss.</td></tr><tr><td><strong>Asynchronous (CRR)</strong></td><td>Non-zero (minutes)</td><td>Manual</td><td>Two independent RINGs with asynchronous replication via CRR/Backbeat. RPO = replication lag time. Manual failover required.</td></tr></table><h3>Supported Stretched Topologies</h3><div class="adiag">Supported geographic topologies (Stretched):\n\n  3 SITES (automatic failover if 1 site goes down):\n  Site A (4 servers) + Site B (4 servers) + Site C (4 servers)\n  -> Loss of one site: quorum maintained (2/3 sites)\n  -> 12 servers minimum\n\n  2 SITES + WITNESS:\n  Site A (majority: 5 md) + Site B (minority: 3 md) + Site C (1 witness)\n  -> Witness = ZooKeeper only, no data\n  -> Loss of Site B: automatic failover (majority + witness)\n  -> Loss of Site A: manual failover required\n  -> 9 servers minimum + 1 witness\n\n  S3 Metadata (repd):\n  5 active nodes (md1 to md5) + 1 Warm Standby (wsb1)\n  Nodes are distributed across sites according to the topology</div><h2>Warm Standby (WSB)</h2><p>The <strong>Warm Standby</strong> is a passive metadata node that shadows an active node. It is pre-configured but is not an active member of Raft sessions.</p><table><tr><th>Aspect</th><th>Active Node (md)</th><th>Warm Standby (wsb)</th></tr><tr><td>Name in inventory</td><td><code>md1-cluster1</code></td><td><code>wsb1-cluster1</code></td></tr><tr><td>Raft Member</td><td>Yes (votes in elections)</td><td>No (observer, follows the journal)</td></tr><tr><td>S3 Traffic</td><td>Yes (serves requests)</td><td>No (no traffic in standby mode)</td></tr><tr><td>Activation</td><td>Always active</td><td>Activated via Ansible (<code>-t DR</code>) upon site loss</td></tr></table><h3>Catch-up tracking metric: bseq</h3><p>The <code>bseq</code> (backup sequence) metric indicates the last Raft journal index copied to a node. It is critical for validating that a node (or WSB) has caught up with the leader before activating a failover:</p><pre># Check Raft sequences for all nodes\ncurl -s http://prometheus:9090/api/v1/query \\\n  \'?query=s3_metadata_stateful_raft_bseq\'\n\n# A node is "up to date" when its bseq = leader\'s cseq\n# During catch-up: bseq &lt; cseq (decreasing gap)</pre><h2>Failover and Failback Procedures</h2><h3>Loss of the MINORITY site (simple scenario)</h3><div class="adiag">Initial state: Site A (majority) + Site B (minority, DOWN)\n\n  md1-cluster1 (Site A): LEADER  [UP]\n  md2-cluster1 (Site A): follower [UP]\n  md3-cluster1 (Site A): follower [UP]\n  md4-cluster1 (Site B): follower [DOWN] &lt;- site lost\n  md5-cluster1 (Site B): follower [DOWN] &lt;- site lost\n  wsb1-cluster1 (Site B): standby  [DOWN]\n\n  Quorum = 3/5 = OK (majority intact)\n  Impact: warnings but S3 continues to operate\n  Action: repair or replace Site B nodes</div><h3>Loss of the MAJORITY site (critical scenario)</h3><div class="adiag">State: Site A (majority, DOWN) + Site B (minority)\n\n  md1 to md3 (Site A): [DOWN]\n  md4-cluster1 (Site B): follower [UP]\n  md5-cluster1 (Site B): follower [UP]\n  wsb1-cluster1 (Site B): standby  [UP]\n\n  Quorum = 2/5 &lt; 3 = LOST -&gt; S3 blocked!\n\n  DR procedure (failover to Site B):\n  1. Verify wsb1 has a recent bseq (not too much lag)\n  2. ansible-playbook ... -t DR  # activates wsb1 as Raft member\n  3. ZooKeeper reconfigured: 5 -&gt; 3 participants\n  4. New quorum = 2/3 nodes = OK\n  5. Redis Sentinel reset: redis-cli sentinel reset scality-s3\n  6. S3 resumes on Site B alone\n\n  RTO: a few minutes to a few hours</div><h3>Failback — Return to normal</h3><p>After restoration of the majority site (Site A):</p><ol><li>Verify Backbeat CRR stats (backlog close to zero) before switching back</li><li>Stop S3 containers on Site B (before re-adding Site A to avoid metadata corruption)</li><li>Re-join Site A nodes as followers (bseq must catch up with the leader)</li><li>Wait until bseq is at parity with cseq on all Site A nodes</li><li>Use <code>crrExistingObjects.js --target-replication-status REPLICA</code> to re-synchronize objects created during DR</li><li>Switch the leader back to Site A (optional, the RING rebalances on its own)</li><li>Deactivate wsb1 and put it back in standby mode</li></ol><p class="alert-d"><strong>Critical:</strong> Never re-add the recovered site without ensuring that S3 containers are stopped on it. A site that comes back with older data and starts answering requests can cause metadata corruption (split brain).</p><div class="kbox"><h3>Key Takeaways</h3><ul><li>Stretched = 1 logical RING, synchronous, RPO=0, automatic failover (3 sites) or manual (2 sites)</li><li>Asynchronous (CRR) = 2 independent RINGs, non-zero RPO, always manual failover</li><li>WSB (Warm Standby) = pre-configured passive node, activated via Ansible -t DR</li><li>bseq = backup sequence: metric to verify a node\'s catch-up after a failure</li><li>Minority loss = quorum maintained, S3 continues; majority loss = DR mandatory</li><li>Failback: always stop containers on the recovered site BEFORE re-adding it</li><li>Redis Sentinel reset mandatory after failover: redis-cli sentinel reset scality-s3</li></ul></div>',
quiz_en:[
  {q:"What is the difference between a stretched architecture and an asynchronous multi-site architecture?",opts:["There is no difference","Stretched: a single RING spanning two sites (synchronous). Asynchronous: two independent RINGs with CRR","Stretched is slower","Asynchronous does not support DR"],ans:1,expl:"Stretched architecture = one RING physically distributed across 2 sites, synchronous writes. Asynchronous architecture = 2 independent RINGs connected by CRR, non-zero RPO but better fault isolation."},
  {q:"What does WSB (Warm Standby) mean?",opts:["Write Standby Buffer","Warm Standby: a secondary site receiving data in near-real-time, ready for fast failover","Wide Scale Backup","Working Standby Bandwidth"],ans:1,expl:"Warm Standby (WSB) is a mode where the secondary site receives data via CRR and is kept warm (ready). Failover is fast because data is already present, unlike Cold Standby."},
  {q:"What is RPO?",opts:["Recovery Point Objective: maximum tolerated data loss in the event of a disaster","Recovery Process Order: restart order of services","Ring Protection Object: RING protection object","Remote Proxy Operation"],ans:0,expl:"RPO (Recovery Point Objective) defines the maximum tolerated data loss, expressed as a duration. An RPO of 15 minutes means that 15 minutes of data may be lost in a disaster."},
  {q:"What is RTO?",opts:["Ring Topology Order","Recovery Time Objective: maximum tolerated duration of service interruption","Real-Time Operation","Replication Timeout Object"],ans:1,expl:"RTO (Recovery Time Objective) defines how long the service can remain unavailable after an incident. It dictates how quickly the failover procedure must be executed."},
  {q:"During a failover to the secondary site, what is the first step?",opts:["Delete data from the primary site","Verify replicated data consistency (CRR lag, catch-up bseq) before switching DNS","Reformat the primary site","Disable Backbeat"],ans:1,expl:"Before any failover, verifying CRR lag and consistency via bseq values allows you to assess potential data loss (effective RPO) and decide whether the failover is acceptable."},
  {q:"Why does a stretched architecture have an RPO of zero but a potentially higher RTO than an asynchronous architecture?",opts:["It is the reverse: non-zero RPO and low RTO","RPO=0 because every write is confirmed on both sites synchronously. But if the inter-site link is cut, the RING can no longer write (split-brain), potentially increasing RTO","The stretched architecture has no RPO","RPO=0 only for metadata"],ans:1,expl:"In a stretched architecture, each write waits for confirmation from both sites: RPO=0. But if the inter-site link is cut, the RING fragments and may refuse writes to avoid split-brain, impacting RTO. The asynchronous architecture tolerates link failure (local site continues) but at the cost of a non-zero RPO."},
  {q:"What is a Cold Standby as opposed to a Warm Standby?",opts:["A Cold Standby site is physically colder","A Cold Standby site does not receive data in real time: data is copied periodically (backup). Failover takes longer because recent data must be restored","A Cold Standby is identical to a Warm Standby","Cold Standby is read-only"],ans:1,expl:"Cold Standby: data is copied periodically (e.g., nightly backup). RPO = time since last backup. Failover requires a restore. Warm Standby: data replicated in near-real-time via CRR, fast failover with near-zero RPO."},
  {q:"How do you test a DR plan without impacting production?",opts:["It is impossible to test DR without impact","Conduct failover exercises in an isolated test environment, or partial tests (failover of a subset of buckets) in production with a planned rollback","Simulate on paper only","Wait for a real incident to test"],ans:1,expl:"DR tests must be regular to validate procedures and measure actual RTO/RPO. Best practice is to test in a staging environment or perform partial drills in production (failover of a non-critical bucket) with a documented rollback procedure."}
]}

{id:'17',num:'17',title:'Features Avancees S3',desc:'Lifecycle policies, UTAPI/SUR (metriques facturation), rate limiting, S3 Analytics ClickHouse, Server Access Logging, Bucket Notifications',
content:'<h2>Lifecycle Policies — Expiration Automatique</h2><p>Les <strong>lifecycle policies</strong> permettent d\'automatiser la gestion du cycle de vie des objets S3 : expiration automatique, suppression de versions, nettoyage des uploads incomplets. Elles sont configurées en JSON compatible AWS.</p><h3>Opérations disponibles</h3><table><tr><th>Action</th><th>Description</th></tr><tr><td><strong>Expire</strong></td><td>Supprimé les objets après N jours ou a une date donnée. Sur bucket versionne : crée un delete marker.</td></tr><tr><td><strong>NoncurrentVersionExpiration</strong></td><td>Supprimé les anciennes versions d\'objets après N jours de non-currentite.</td></tr><tr><td><strong>ExpireObjectDeleteMarkers</strong></td><td>Supprimé les delete markers "orphelins" (qui n\'ont plus aucune version sous eux).</td></tr><tr><td><strong>AbortIncompleteMultipartUpload</strong></td><td>Abandonne les MPUs incomplets après N jours. Critique pour libérer l\'espace des uploads abandonnes.</td></tr></table><h3>Exemple de policy JSON</h3><pre>{\n  "Rules": [\n    {\n      "ID": "expire-old-versions",\n      "Status": "Enabled",\n      "Filter": {"Prefix": "archive/"},\n      "NoncurrentVersionExpiration": {"NoncurrentDays": 30}\n    },\n    {\n      "ID": "cleanup-failed-uploads",\n      "Status": "Enabled",\n      "Filter": {},\n      "AbortIncompleteMultipartUpload": {"DaysAfterInitiation": 7}\n    }\n  ]\n}</pre><p class="alert-i"><strong>Filtrage par tag :</strong> Les règles avec filtre par tag sont plus coûteuses — elles necessitent des appels metadata supplémentaires pour lire les tags de chaque objet. Privilegier les filtres par prefixe quand c\'est possible.</p><p><strong>Exclusions :</strong> La variable <code>env_backbeat_lifecycle_conductor_filter_enabled</code> permet d\'exclure des buckets ou comptes entiers du scan lifecycle — utile pour les buckets a très forte activite.</p><p class="alert-w"><strong>Attention :</strong> Les suppressions par lifecycle ne generent <strong>pas</strong> d\'événements <code>ObjectRemoved</code> dans les Bucket Notifications. Utiliser <code>LifecycleExpiration:Delete</code> a la place.</p><h2>UTAPI et SUR — Metriques de Consommation</h2><p>Scality propose deux services complémentaires pour mesurer la consommation de stockage S3, essentiels en environnement <strong>multi-tenant</strong> (facturation par compte ou bucket).</p><table><tr><th>Service</th><th>Rôle</th><th>Usage</th></tr><tr><td><strong>UTAPI v2</strong></td><td>API REST authentifiée (SigV4) qui expose : nombre d\'objets, octets stockés, bande passante, opérations — par compte, bucket ou utilisateur.</td><td>Facturation, rapports de consommation. Permission IAM : <code>utapi:ListMetrics</code>.</td></tr><tr><td><strong>SUR</strong> (Scality Utilization Reporting, depuis 9.5.0)</td><td>Service plus robuste qui ingere le journal Raft de chaque session pour calculer la consommation. Dispose d\'un mode "Repair" (scan complet) active automatiquement au premier demarrage.</td><td>Reporting de stockage fiable. Incompatible avec une migration de bucket en cours.</td></tr></table><p><strong>Quotas par compte :</strong> <code>vaultclient create-account --quota &lt;bytes&gt;</code> (0 = pas de quota). Enforces en temps reel par UTAPI v2.</p><h2>Rate Limiting par Bucket (depuis 9.5.2.0)</h2><p>Le rate limiting par bucket protège les SLAs en evitant qu\'un tenant "bruyant" sature le cluster pour les autres. Configuré via une API REST avec un utilisateur service dédié.</p><table><tr><th>Paramètre</th><th>Description</th></tr><tr><td><code>rate_limiting_default_bucket_rps_limit</code></td><td>Limite en requêtes par seconde (RPS) par bucket par défaut.</td></tr><tr><td><code>rate_limiting_default_burst_capacity</code></td><td>Capacité de burst (pics courts toleres au-dessus de la limite).</td></tr><tr><td><code>rate_limiting_bucket_config_cache_ttl</code></td><td>TTL du cache de configuration (ms). Un changement de limite peut prendre jusqu\'a 30 secondes a se propager.</td></tr></table><p>Un depassement de limite retourne <strong>HTTP 429 "SlowDown"</strong> — identique au comportement AWS S3, donc transparent pour les clients compatibles AWS.</p><h2>S3 Analytics — ClickHouse (depuis 9.5.0)</h2><p><strong>S3 Analytics</strong> collecte toutes les opérations S3 depuis CloudServer, les envoie via <strong>FluentBit</strong> a <strong>ClickHouse</strong> (base de données columnaire OLAP). Il alimente les dashboards Grafana de monitoring S3 et de Lifecycle.</p><ul><li>Remplace complètement Elasticsearch/Logstash (deprecated depuis 9.5.0)</li><li>6 nœuds recommandes pour 500 millions opérations/jour</li><li>100 GB minimum de stockage par nœud</li><li>ZooKeeper coordonne les nœuds ClickHouse</li><li>Extension par shards <strong>irréversible</strong></li></ul><h2>Server Access Logging (depuis 9.5.2.0)</h2><p>Le <strong>Server Access Logging (SAL)</strong> enregistre toutes les requêtes S3 sur un bucket source et les écrit sous forme d\'objets dans un bucket cible. Utile pour l\'audit et la facturation.</p><ul><li>Pipeline : CloudServer → FluentBit → log-courier → bucket cible</li><li>Livraison asynchrone par batch — pas d\'ordre garanti, possible duplication</li><li>Le bucket cible ne devrait <strong>pas être le même</strong> que la source (feedback loop)</li></ul><h2>Bucket Notifications</h2><p>Les <strong>Bucket Notifications</strong> envoient des événements S3 vers des queues externes (style SNS) lorsque des opérations sont effectuées sur un bucket.</p><table><tr><th>Événement</th><th>Déclenche par</th></tr><tr><td><code>ObjectCreated:*</code></td><td>PUT, POST, COPY, CompleteMultipartUpload</td></tr><tr><td><code>ObjectRemoved:*</code></td><td>DELETE explicite par un client (pas par lifecycle)</td></tr><tr><td><code>LifecycleExpiration:Delete</code></td><td>Suppression par une règle lifecycle Expire</td></tr><tr><td><code>LifecycleExpiration:DeleteMarkerCreated</code></td><td>Création d\'un delete marker par lifecycle</td></tr><tr><td><code>ObjectTagging:Put / Delete</code></td><td>Modification des tags d\'un objet</td></tr></table><p>Le format ARN de destination Scality : <code>arn:scality:bucketnotif:::nom_destination</code>. Backend : Kafka.</p><h2>Terraform Provider pour S3 Scality</h2><p>Scality fournit un <strong>provider Terraform officiel</strong> pour provisionner des ressources S3 (buckets, comptes IAM, policies) en infrastructure-as-code. Disponible sur <code>github.com/scality/scality-s3-tf-modules</code>.</p><h3>Ressources supportées</h3><table><tr><th>Ressource Terraform</th><th>Equivalent S3</th></tr><tr><td><code>scality_s3_bucket</code></td><td>Création/configuration de bucket (versioning, lifecycle, ACL)</td></tr><tr><td><code>scality_iam_account</code></td><td>Compte IAM Vault</td></tr><tr><td><code>scality_iam_user</code></td><td>Utilisateur IAM avec access key/secret key</td></tr><tr><td><code>scality_iam_policy</code></td><td>Policy IAM JSON (Allow/Deny)</td></tr></table><pre># Exemple de configuration Terraform\nterraform {\n  required_providers {\n    scality = {\n      source = "scality/s3"\n    }\n  }\n}\n\nresource "scality_s3_bucket" "mon_bucket" {\n  bucket = "mon-bucket-prod"\n  versioning_enabled = true\n  lifecycle_rules = [...]\n}</pre><p class="alert-i"><strong>Cas d\'usage :</strong> Provisionnement automatise de centaines de buckets S3 avec des configurations standardisées (lifecycle, ACL, notifications). Utile dans les environnements DevOps avec GitOps et CI/CD.</p><h2>Apache Spark et le RING — Séparation Compute / Storage</h2><p><strong>Apache Spark</strong> est un moteur de traitement distribué open-source. Il n\'est <strong>pas un composant interne du RING</strong> — il interagit avec le RING exclusivement via l\'API S3 standard.</p><div class="alert alert-i"><strong>Architecture data lake :</strong> Spark (compute) &lt;-&gt; API S3 &lt;-&gt; RING (storage). Le RING stocké les données (Parquet, CSV, JSON...). Spark lit et écrit ces objets via S3. Ni le RING ne sait que c\'est Spark, ni Spark n\'a besoin de connaitre l\'architecture interne du RING.</div><h3>Cas d\'usage typiques</h3><ul><li><strong>Data lake analytics</strong> : Spark SQL sur tables Parquet dans le RING</li><li><strong>Machine learning</strong> : datasets de training lus par Spark MLlib depuis le RING</li><li><strong>ETL batch</strong> : transformation de données lues depuis et écrites dans le RING</li></ul><h3>Configuration Spark pour le RING</h3><pre>spark.hadoop.fs.s3a.endpoint=https://&lt;ring-s3-endpoint&gt;\nspark.hadoop.fs.s3a.access.key=&lt;access_key&gt;\nspark.hadoop.fs.s3a.secret.key=&lt;secret_key&gt;\nspark.hadoop.fs.s3a.path.style.access=true</pre><div class="kbox"><h3>Points Clés a Retenir</h3><ul><li>Lifecycle : Expire, NoncurrentVersionExpiration, ExpireDeleteMarkers, AbortIncompleteMultipartUpload</li><li>Filtre tag = coûteux (appels metadata extra) ; privilegier les filtres prefix</li><li>Lifecycle ne génère pas ObjectRemoved → utiliser LifecycleExpiration:Delete dans les Notifications</li><li>UTAPI = API facturation (RPS par compte/bucket) ; SUR = reporting robuste via journal Raft</li><li>Rate limiting = HTTP 429 SlowDown ; propagation config jusqu\'a 30s (cache TTL)</li><li>S3 Analytics = ClickHouse remplace Elasticsearch depuis 9.5.0</li><li>SAL = audit logs par bucket, batch asynchrone, pas de duplication garantie</li></ul></div>',
quiz:[
  {q:"Que permet une Lifecycle Policy S3 ?",opts:["Chiffrer automatiquement les objets","Définir des règles de cycle de vie : transition vers autre tier, expiration, suppression versions anciennes","Répliquer les objets vers un autre bucket","Auditer les accès aux objets"],ans:1,expl:"Les Lifecycle Policies automatisent la gestion du cycle de vie des objets : transition vers stockage moins cher après X jours, expiration des objets, suppression des versions non courantes."},
  {q:"Qu'est-ce que le Rate Limiting dans Cloudserver ?",opts:["Limite la taille maximale des objets","Contrôle du débit de requêtes S3 par compte ou bucket pour protéger le ring","Limitation de la réplication CRR","Contrôle du nombre de buckets par compte"],ans:1,expl:"Le rate limiting dans Cloudserver limite le nombre de requêtes S3 par seconde par compte ou bucket. Protège le ring contre les surcharges et garantit une QoS équitable entre tenants."},
  {q:"Quelle technologie S3 Analytics Scality utilise-t-il ?",opts:["Apache Spark","Elasticsearch","ClickHouse","MongoDB"],ans:2,expl:"Scality S3 Analytics utilisé ClickHouse, une base de données analytique colonnaire hautes performances. Elle ingère les logs d'accès S3 et permet des requêtes analytiques rapides."},
  {q:"Que sont les Bucket Notifications ?",opts:["Emails envoyés quand un bucket est plein","Mécanisme notifiant un système externe (webhook, Kafka) lors d'événements S3 (création, suppression d'objet)","Alertes Prometheus par bucket","Notifications SMB SOFS"],ans:1,expl:"Les Bucket Notifications envoient des événements S3 (PUT, DELETE...) vers des endpoints externes (webhooks, Kafka topics). Permet d'intégrer S3 dans des architectures event-driven."},
  {q:"Qu'est-ce que le Server Access Logging S3 ?",opts:["Logs supervisord du Cloudserver","Journalisation détaillée de toutes les requêtes S3 vers un bucket de logs dédié, pour audit et compliance","Logs de monitoring Prometheus","Logs de réplication CRR"],ans:1,expl:"Server Access Logging journalise chaque requête S3 (qui, quoi, quand, depuis où) dans un bucket de logs. Essentiel pour l'audit, la sécurité et la conformité réglementaire."},
  {q:"Comment fonctionne le Legal Hold ?",opts:["Verrou sur un bucket entier","Verrou par objet empêchant toute suppression/modification, indépendant de la retention policy, jusqu'à levée explicite","Limite automatique de 7 ans","Verrou réseau sur le bucket"],ans:1,expl:"Legal Hold est un verrou par objet indépendant de la retention policy. Même si la période de retention est expirée, l'objet ne peut être supprimé tant que le Legal Hold est actif. Utile pour la préservation de preuves."},
  {q:"Quelle est la différence entre KMS interne Vault et KMIP ?",opts:["Il n'y a pas de différence","KMS interne : Vault gère les clés (simple, tout-en-un). KMIP : intégration d'un KMS externe via protocole standard (HSM, compliance certifiée)","KMIP est plus simple","KMS interne ne chiffré pas les données"],ans:1,expl:"KMS interne (Vault) est intégré et simple à configurer. KMIP permet d'intégrer un KMS externe certifié (HSM physique, Thales, HashiCorp) pour des exigences de conformité strictes (FIPS 140-2, CC)."},
  {q:"Un client multi-tenant veut garantir qu'un seul tenant ne peut pas saturer la capacité S3. Quelle feature utiliser ?",opts:["Object Lock en mode Governance","Rate Limiting par compte, combiné à des quotas de stockage par bucket via UTAPI","Lifecycle Policy avec expiration automatique","Bucket Notifications pour alerter en cas de surcharge"],ans:1,expl:"Le Rate Limiting limite le débit de requêtes par compte (protège contre les pics CPU/réseau), et UTAPI permet de surveiller et appliquer des quotas de stockage. Les deux ensemble garantissent l'isolation des ressources entre tenants."},
  {q:"Pourquoi le S3 Versioning est-il un prérequis pour activer Object Lock ?",opts:["C'est une contrainte arbitraire de l'implémentation Scality","Object Lock garantit l'immutabilité de chaque version d'un objet ; sans versioning, il n'y aurait pas de concept de 'version protégée' et un PUT écraserait l'objet existant","Le versioning améliore les performances d'Object Lock","Object Lock fonctionne aussi sans versioning"],ans:1,expl:"Object Lock opère au niveau de la version d'objet. Avec le versioning, chaque PUT crée une nouvelle version — l'ancienne version protégée est préservée. Sans versioning, un PUT remplacerait l'objet, contournant la protection WORM. Le versioning est donc structurellement nécessaire à Object Lock."},
  {q:"Quand utiliser des Bucket Notifications plutôt qu'un polling régulier de l'API S3 LIST ?",opts:["Jamais : le polling est toujours préférable","Dès que la latence de détection doit être faible et que le volume d'événements est élevé : les notifications sont plus efficaces et moins coûteuses en requêtes S3","Les Bucket Notifications ne sont pas supportées par Scality","Le polling est obligatoire pour les intégrations Kafka"],ans:1,expl:"Le polling S3 LIST à haute fréquence génère beaucoup de requêtes API et détecte les événements avec retard. Les Bucket Notifications envoient l'événement en temps quasi-réel dès qu'il se produit, sans requête active. Pour les architectures event-driven (pipelines de traitement d'images, indexation temps réel), les notifications sont bien supérieures."}
],
title_en:'Advanced S3 Features',
desc_en:'Lifecycle policies, UTAPI/SUR (billing metrics), rate limiting, S3 Analytics ClickHouse, Server Access Logging, Bucket Notifications',
content_en:'<h2>Lifecycle Policies — Automatic Expiration</h2><p><strong>Lifecycle policies</strong> allow you to automate S3 object lifecycle management: automatic expiration, version deletion, and cleanup of incomplete uploads. They are configured in AWS-compatible JSON.</p><h3>Available operations</h3><table><tr><th>Action</th><th>Description</th></tr><tr><td><strong>Expire</strong></td><td>Deletes objects after N days or at a given date. On a versioned bucket: creates a delete marker.</td></tr><tr><td><strong>NoncurrentVersionExpiration</strong></td><td>Deletes old object versions after N days of non-currency.</td></tr><tr><td><strong>ExpireObjectDeleteMarkers</strong></td><td>Deletes orphaned delete markers (that have no remaining version beneath them).</td></tr><tr><td><strong>AbortIncompleteMultipartUpload</strong></td><td>Aborts incomplete MPUs after N days. Critical for freeing space from abandoned uploads.</td></tr></table><h3>Example JSON policy</h3><pre>{\n  "Rules": [\n    {\n      "ID": "expire-old-versions",\n      "Status": "Enabled",\n      "Filter": {"Prefix": "archive/"},\n      "NoncurrentVersionExpiration": {"NoncurrentDays": 30}\n    },\n    {\n      "ID": "cleanup-failed-uploads",\n      "Status": "Enabled",\n      "Filter": {},\n      "AbortIncompleteMultipartUpload": {"DaysAfterInitiation": 7}\n    }\n  ]\n}</pre><p class="alert-i"><strong>Tag-based filtering:</strong> Rules with tag filters are more expensive — they require additional metadata calls to read the tags of each object. Prefer prefix-based filters when possible.</p><p><strong>Exclusions:</strong> The variable <code>env_backbeat_lifecycle_conductor_filter_enabled</code> allows excluding entire buckets or accounts from the lifecycle scan — useful for very high-activity buckets.</p><p class="alert-w"><strong>Warning:</strong> Lifecycle deletions do <strong>not</strong> generate <code>ObjectRemoved</code> events in Bucket Notifications. Use <code>LifecycleExpiration:Delete</code> instead.</p><h2>UTAPI and SUR — Consumption Metrics</h2><p>Scality provides two complementary services for measuring S3 storage consumption, essential in <strong>multi-tenant</strong> environments (billing per account or bucket).</p><table><tr><th>Service</th><th>Role</th><th>Usage</th></tr><tr><td><strong>UTAPI v2</strong></td><td>Authenticated REST API (SigV4) exposing: object count, bytes stored, bandwidth, operations — per account, bucket, or user.</td><td>Billing, consumption reports. IAM permission: <code>utapi:ListMetrics</code>.</td></tr><tr><td><strong>SUR</strong> (Scality Utilization Reporting, since 9.5.0)</td><td>A more robust service that ingests the Raft journal from each session to compute consumption. Features a Repair mode (full scan) activated automatically on first startup.</td><td>Reliable storage reporting. Incompatible with an in-progress bucket migration.</td></tr></table><p><strong>Per-account quotas:</strong> <code>vaultclient create-account --quota &lt;bytes&gt;</code> (0 = no quota). Enforced in real time by UTAPI v2.</p><h2>Per-Bucket Rate Limiting (since 9.5.2.0)</h2><p>Per-bucket rate limiting protects SLAs by preventing a noisy tenant from saturating the cluster for others. Configured via a REST API with a dedicated service user.</p><table><tr><th>Parameter</th><th>Description</th></tr><tr><td><code>rate_limiting_default_bucket_rps_limit</code></td><td>Default rate limit in requests per second (RPS) per bucket.</td></tr><tr><td><code>rate_limiting_default_burst_capacity</code></td><td>Burst capacity (short spikes tolerated above the limit).</td></tr><tr><td><code>rate_limiting_bucket_config_cache_ttl</code></td><td>Configuration cache TTL (ms). A limit change can take up to 30 seconds to propagate.</td></tr></table><p>Exceeding the limit returns <strong>HTTP 429 SlowDown</strong> — identical to AWS S3 behavior, and therefore transparent to AWS-compatible clients.</p><h2>S3 Analytics — ClickHouse (since 9.5.0)</h2><p><strong>S3 Analytics</strong> collects all S3 operations from Cloudserver, sends them via <strong>FluentBit</strong> to <strong>ClickHouse</strong> (a columnar OLAP database). It feeds the Grafana dashboards for S3 monitoring and Lifecycle.</p><ul><li>Completely replaces Elasticsearch/Logstash (deprecated since 9.5.0)</li><li>6 nodes recommended for 500 million operations/day</li><li>100 GB minimum storage per node</li><li>ZooKeeper coordinates ClickHouse nodes</li><li>Shard expansion is <strong>irreversible</strong></li></ul><h2>Server Access Logging (since 9.5.2.0)</h2><p><strong>Server Access Logging (SAL)</strong> records all S3 requests on a source bucket and writes them as objects to a target bucket. Useful for auditing and billing.</p><ul><li>Pipeline: Cloudserver → FluentBit → log-courier → target bucket</li><li>Asynchronous batch delivery — no guaranteed order, possible duplication</li><li>The target bucket should <strong>not be the same</strong> as the source (feedback loop)</li></ul><h2>Bucket Notifications</h2><p><strong>Bucket Notifications</strong> send S3 events to external queues (SNS-style) when operations are performed on a bucket.</p><table><tr><th>Event</th><th>Triggered by</th></tr><tr><td><code>ObjectCreated:*</code></td><td>PUT, POST, COPY, CompleteMultipartUpload</td></tr><tr><td><code>ObjectRemoved:*</code></td><td>Explicit DELETE by a client (not by lifecycle)</td></tr><tr><td><code>LifecycleExpiration:Delete</code></td><td>Deletion by a lifecycle Expire rule</td></tr><tr><td><code>LifecycleExpiration:DeleteMarkerCreated</code></td><td>Delete marker creation by lifecycle</td></tr><tr><td><code>ObjectTagging:Put / Delete</code></td><td>Modification of an object\'s tags</td></tr></table><p>Scality destination ARN format: <code>arn:scality:bucketnotif:::destination_name</code>. Backend: Kafka.</p><h2>Terraform Provider for Scality S3</h2><p>Scality provides an <strong>official Terraform provider</strong> for provisioning S3 resources (buckets, IAM accounts, policies) as infrastructure-as-code. Available at <code>github.com/scality/scality-s3-tf-modules</code>.</p><h3>Supported resources</h3><table><tr><th>Terraform Resource</th><th>S3 Equivalent</th></tr><tr><td><code>scality_s3_bucket</code></td><td>Bucket creation/configuration (versioning, lifecycle, ACL)</td></tr><tr><td><code>scality_iam_account</code></td><td>Vault IAM account</td></tr><tr><td><code>scality_iam_user</code></td><td>IAM user with access key/secret key</td></tr><tr><td><code>scality_iam_policy</code></td><td>JSON IAM policy (Allow/Deny)</td></tr></table><pre># Example Terraform configuration\nterraform {\n  required_providers {\n    scality = {\n      source = "scality/s3"\n    }\n  }\n}\n\nresource "scality_s3_bucket" "my_bucket" {\n  bucket = "my-bucket-prod"\n  versioning_enabled = true\n  lifecycle_rules = [...]\n}</pre><p class="alert-i"><strong>Use case:</strong> Automated provisioning of hundreds of S3 buckets with standardized configurations (lifecycle, ACL, notifications). Useful in DevOps environments with GitOps and CI/CD.</p><h2>Apache Spark and the RING — Compute / Storage Separation</h2><p><strong>Apache Spark</strong> is an open-source distributed processing engine. It is <strong>not an internal RING component</strong> — it interacts with the RING exclusively via the standard S3 API.</p><div class="alert alert-i"><strong>Data lake architecture:</strong> Spark (compute) &lt;-&gt; S3 API &lt;-&gt; RING (storage). The RING stores the data (Parquet, CSV, JSON...). Spark reads and writes these objects via S3. The RING does not know it is Spark, and Spark does not need to know the internal architecture of the RING.</div><h3>Typical use cases</h3><ul><li><strong>Data lake analytics</strong>: Spark SQL on Parquet tables in the RING</li><li><strong>Machine learning</strong>: training datasets read by Spark MLlib from the RING</li><li><strong>Batch ETL</strong>: data transformation read from and written to the RING</li></ul><h3>Spark configuration for the RING</h3><pre>spark.hadoop.fs.s3a.endpoint=https://&lt;ring-s3-endpoint&gt;\nspark.hadoop.fs.s3a.access.key=&lt;access_key&gt;\nspark.hadoop.fs.s3a.secret.key=&lt;secret_key&gt;\nspark.hadoop.fs.s3a.path.style.access=true</pre><div class="kbox"><h3>Key Takeaways</h3><ul><li>Lifecycle: Expire, NoncurrentVersionExpiration, ExpireDeleteMarkers, AbortIncompleteMultipartUpload</li><li>Tag filter = expensive (extra metadata calls); prefer prefix filters</li><li>Lifecycle does not generate ObjectRemoved → use LifecycleExpiration:Delete in Notifications</li><li>UTAPI = billing API (RPS per account/bucket); SUR = robust reporting via Raft journal</li><li>Rate limiting = HTTP 429 SlowDown; config propagation up to 30s (cache TTL)</li><li>S3 Analytics = ClickHouse replaces Elasticsearch since 9.5.0</li><li>SAL = per-bucket audit logs, asynchronous batch, no duplication guarantee</li></ul></div>',
quiz_en:[
  {q:"What does an S3 Lifecycle Policy allow you to do?",opts:["Automatically encrypt objects","Define lifecycle rules: transition to another tier, expiration, deletion of old versions","Replicate objects to another bucket","Audit access to objects"],ans:1,expl:"Lifecycle Policies automate object lifecycle management: transition to cheaper storage after X days, object expiration, deletion of non-current versions."},
  {q:"What is Rate Limiting in Cloudserver?",opts:["Limits the maximum size of objects","Controls S3 request throughput per account or bucket to protect the RING","Limits CRR replication","Controls the number of buckets per account"],ans:1,expl:"Rate limiting in Cloudserver caps the number of S3 requests per second per account or bucket. It protects the RING against overload and ensures fair QoS between tenants."},
  {q:"Which technology does Scality S3 Analytics use?",opts:["Apache Spark","Elasticsearch","ClickHouse","MongoDB"],ans:2,expl:"Scality S3 Analytics uses ClickHouse, a high-performance columnar analytical database. It ingests S3 access logs and enables fast analytical queries."},
  {q:"What are Bucket Notifications?",opts:["Emails sent when a bucket is full","Mechanism notifying an external system (webhook, Kafka) upon S3 events (object creation, deletion)","Prometheus alerts per bucket","SOFS SMB notifications"],ans:1,expl:"Bucket Notifications send S3 events (PUT, DELETE...) to external endpoints (webhooks, Kafka topics). This allows S3 to be integrated into event-driven architectures."},
  {q:"What is S3 Server Access Logging?",opts:["Supervisord logs from Cloudserver","Detailed logging of all S3 requests to a dedicated log bucket, for audit and compliance","Prometheus monitoring logs","CRR replication logs"],ans:1,expl:"Server Access Logging records every S3 request (who, what, when, from where) in a log bucket. Essential for auditing, security, and regulatory compliance."},
  {q:"How does Legal Hold work?",opts:["A lock on an entire bucket","A per-object lock preventing any deletion/modification, independent of the retention policy, until explicitly lifted","An automatic 7-year limit","A network lock on the bucket"],ans:1,expl:"Legal Hold is a per-object lock independent of the retention policy. Even if the retention period has expired, the object cannot be deleted while Legal Hold is active. Useful for preserving evidence."},
  {q:"What is the difference between the internal Vault KMS and KMIP?",opts:["There is no difference","Internal KMS: Vault manages keys (simple, all-in-one). KMIP: integration with an external KMS via standard protocol (HSM, certified compliance)","KMIP is simpler","Internal KMS does not encrypt data"],ans:1,expl:"Internal KMS (Vault) is integrated and easy to configure. KMIP allows integration with a certified external KMS (physical HSM, Thales, HashiCorp) for strict compliance requirements (FIPS 140-2, CC)."},
  {q:"A multi-tenant customer wants to guarantee that a single tenant cannot saturate S3 capacity. Which feature should be used?",opts:["Object Lock in Governance mode","Per-account Rate Limiting, combined with per-bucket storage quotas via UTAPI","Lifecycle Policy with automatic expiration","Bucket Notifications to alert on overload"],ans:1,expl:"Rate Limiting caps request throughput per account (protects against CPU/network spikes), and UTAPI allows monitoring and enforcing storage quotas. Both together ensure resource isolation between tenants."},
  {q:"Why is S3 Versioning a prerequisite for enabling Object Lock?",opts:["It is an arbitrary constraint of the Scality implementation","Object Lock guarantees immutability of each object version; without versioning, there is no concept of a protected version and a PUT would overwrite the existing object","Versioning improves Object Lock performance","Object Lock also works without versioning"],ans:1,expl:"Object Lock operates at the object version level. With versioning, each PUT creates a new version — the old protected version is preserved. Without versioning, a PUT would replace the object, bypassing WORM protection. Versioning is therefore structurally required for Object Lock."},
  {q:"When should you use Bucket Notifications rather than regularly polling the S3 LIST API?",opts:["Never: polling is always preferable","Whenever detection latency must be low and event volume is high: notifications are more efficient and less costly in S3 requests","Bucket Notifications are not supported by Scality","Polling is mandatory for Kafka integrations"],ans:1,expl:"High-frequency S3 LIST polling generates many API requests and detects events with a delay. Bucket Notifications send the event in near-real-time as soon as it occurs, without active polling. For event-driven architectures (image processing pipelines, real-time indexing), notifications are far superior."}
]}

{id:'18',num:'18',title:'Infrastructure, Ports et Cycle de Vie Produit',desc:'Prerequis matériels et OS, tuning système, ports réseau par service, Platformcheck, versions supportées, breaking changes',
content:'<h2>Prerequis Materiels et Dimensionnement</h2><h3>Nœuds de Stockage (obligatoirement physiques)</h3><p>Les nœuds de stockage RING <strong>ne peuvent pas être des VMs</strong>. Ils doivent être des serveurs physiques baremetal.</p><table><tr><th>Composant</th><th>Exigence</th></tr><tr><td>RAM</td><td>128 GB minimum</td></tr><tr><td>Disques OS</td><td>~500 GB, 2 HDDs en RAID 1</td></tr><tr><td>Disques DATA</td><td>4 TB+ par disque, HDDs 7200 rpm, RAID 0 individuel. Cache write-back avec BBU obligatoire.</td></tr><tr><td>Disques Metadata</td><td>2 SSD/NVMe 480 GB+ en RAID 0, ext4, montés avant installation. PatrolRead DESACTIVE.</td></tr><tr><td>Réseau RING</td><td>2 x 10 Gb/s LACP 802.3ad layer3+4, lacp_rate=fast</td></tr><tr><td>Alimentation</td><td>Double PSU obligatoire</td></tr></table><p class="alert-d"><strong>RAID 0 sur les disques DATA :</strong> Chaque disque DATA est en RAID 0 individuel (pas de RAID entre disques). La protection des données est assurée par le RING lui-même (ARC/COS), pas par le RAID. <strong>PatrolRead doit être désactivé</strong> sur tous les controleurs RAID — il cause des ralentissements IO impactant les performances.</p><h3>Nœuds S3 Connector</h3><table><tr><th>Composant</th><th>Exigence minimale</th></tr><tr><td>RAM</td><td>32 GB</td></tr><tr><td>Disques OS</td><td>2000 GB+ RAID 1 (dont 400 GB+ pour /var/log)</td></tr><tr><td>CPU</td><td>8 vCPUs minimum. 12-24 cores selon le feature set (UTAPI, CRR, SSE = "advanced")</td></tr><tr><td>Réseau frontend</td><td>2 x 10 Gb/s LACP (vers clients S3)</td></tr><tr><td>Réseau backend</td><td>2 x 10 Gb/s LACP (vers le RING)</td></tr></table><h3>Supervisor</h3><table><tr><th>Composant</th><th>Exigence</th></tr><tr><td>RAM</td><td>16 GB (32+ si >12 serveurs)</td></tr><tr><td>Disques</td><td>500 GB RAID 1</td></tr><tr><td>CPU</td><td>4 vCPUs</td></tr><tr><td>Déploiement</td><td>VM avec failover hyperviseur recommande</td></tr></table><h2>OS et Tuning Système</h2><h3>Systèmes d\'exploitation supportes (RING 9.5.2.3)</h3><table><tr><th>OS</th><th>Version</th><th>Statut</th></tr><tr><td>RHEL</td><td>8.10</td><td>Supporte et valide</td></tr><tr><td>Rocky Linux</td><td>8.10</td><td>Supporte et valide</td></tr><tr><td>RHEL</td><td>9.6 / 9.7</td><td>Supporte</td></tr><tr><td>Rocky Linux</td><td>9.6 / 9.7</td><td>Supporte</td></tr><tr><td>RHEL 7 / CentOS 7</td><td>Toutes</td><td>EOL depuis juin 2024 — NON supporte</td></tr></table><p>Architecture CPU : <strong>x86-64v3 minimum</strong> (depuis RING 9.5.0). Installation OS : mode <strong>Minimal obligatoire</strong> (pas de GUI, pas de Samba pré-installé).</p><h3>Partitionnement minimal</h3><table><tr><th>Partition</th><th>Taille</th></tr><tr><td>/boot</td><td>1 GB</td></tr><tr><td>/</td><td>50-100 GB (100-120 GB pour le Supervisor)</td></tr><tr><td>/var</td><td>400 GB+ — <strong>partition SEPAREE obligatoire</strong></td></tr></table><p>Seul filesystem supporte pour les données RING : <strong>ext4</strong>.</p><h3>Tuning OS applique par l\'installer</h3><table><tr><th>Paramètre</th><th>Valeur imposee</th><th>Raison</th></tr><tr><td>vm.swappiness</td><td>1</td><td>Minimise le swap pour éviter les latences IO</td></tr><tr><td>Transparent Huge Pages</td><td>disabled</td><td>Cause des latences aléatoires avec les applications mémoire intensives</td></tr><tr><td>NUMA</td><td>disabled (interleaving BIOS)</td><td>Évite les inégalités d\'accès mémoire entre CPUs</td></tr><tr><td>irqbalance</td><td>--oneshot au boot uniquement</td><td>Évite la redistribution dynamique des interruptions</td></tr><tr><td>SELinux</td><td>disabled avant installation</td><td>Peut être re-active après via procédure Scality</td></tr><tr><td>net.core.somaxconn</td><td>4096</td><td>File d\'attente de connexions TCP</td></tr><tr><td>ulimit -n</td><td>65535</td><td>Nombre de fichiers ouverts simultanes</td></tr></table><p class="alert-w"><strong>Logiciels incompatibles :</strong> Salt pre-existant (supprimer salt-minion + /etc/salt), mlocate, GUI desktop, Transparent Huge Pages, NUMA actif, Samba pré-installé sur un nœud RING. <strong>NTP/Chrony obligatoire</strong> — ne jamais changer l\'heure d\'un serveur RING en cours d\'exécution (peut corrompre l\'état interne).</p><h2>Ports Réseau par Service</h2><h3>Infrastructure RING — Stockage</h3><table><tr><th>Service</th><th>Port</th><th>Protocole</th></tr><tr><td>bizstorenode (Chord P2P)</td><td>TCP 4244-4255</td><td>Inter-noeuds RING</td></tr><tr><td>bizstorenode admin (ringsh)</td><td>TCP 8084-8095</td><td>Administration</td></tr><tr><td>srebuildd / sproxyd REST</td><td>TCP 81, 10000, 10002</td><td>Rebuild et stockage</td></tr><tr><td>Salt Master</td><td>TCP 4505, 4506</td><td>Gestion de configuration</td></tr><tr><td>Supervisor GUI/API</td><td>TCP 80, 443, 3080, 2443, 3443, 4443</td><td>Administration</td></tr><tr><td>Grafana</td><td>TCP 3000</td><td>Monitoring</td></tr><tr><td>ZooKeeper (DLM)</td><td>TCP 2888, 3888</td><td>Coordination cluster</td></tr></table><h3>S3 Connector</h3><table><tr><th>Service</th><th>Port</th><th>Usage</th></tr><tr><td>S3 Frontend (clients)</td><td>TCP 80, 443</td><td>API S3 HTTP/HTTPS</td></tr><tr><td>Vault (IAM)</td><td>TCP 8500</td><td>Authentification interne</td></tr><tr><td>bucketd (metadata)</td><td>TCP 9000</td><td>Opérations sur buckets</td></tr><tr><td>sproxyd (vers RING)</td><td>TCP 8181, 4243</td><td>Stockage données dans RING</td></tr><tr><td>Redis local</td><td>TCP 6479</td><td>Cache sessions/CRR</td></tr><tr><td>Kafka (CRR)</td><td>TCP 9092</td><td>Queue de réplication</td></tr><tr><td>ZooKeeper S3</td><td>TCP 22181</td><td>Coordination Backbeat</td></tr><tr><td>KMIP (SSE externe)</td><td>TCP 5696</td><td>Chiffrement (KMS externe)</td></tr><tr><td>ADFS/SAML</td><td>TCP 443</td><td>Federation d\'identites SSO</td></tr><tr><td>FluentBit → ClickHouse</td><td>TCP 8123</td><td>Logs S3 Analytics</td></tr></table><h3>Monitoring</h3><table><tr><th>Service</th><th>Port</th></tr><tr><td>Prometheus scrape nœuds</td><td>TCP 9091, 9097, 9200, 9427</td></tr><tr><td>AlertManager</td><td>TCP 9093</td></tr><tr><td>Thanos gRPC mTLS</td><td>TCP 11903, 11905</td></tr><tr><td>Thanos Query FE</td><td>TCP 11902</td></tr></table><h2>Platformcheck et Installation</h2><p>Le <strong>Platformcheck</strong> est l\'outil de vérification pre/post-installation de Scality. Il est <strong>read-only</strong> et peut être lance a tout moment pour vérifier l\'état du système.</p><table><tr><th>Criticité</th><th>Signification</th><th>Action</th></tr><tr><td><strong>CRITICAL</strong></td><td>Problème bloquant. L\'installation echoue ou le RING sera instable.</td><td>Corriger AVANT de continuer.</td></tr><tr><td><strong>WARNING</strong></td><td>Problème non bloquant mais pouvant impacter les performances.</td><td>Corriger si possible.</td></tr><tr><td><strong>OK</strong></td><td>Vérification reussie.</td><td>Rien a faire.</td></tr></table><p>Rapport disponible sur : <code>http://&lt;supervisor&gt;:8000/platformcheck/report-&lt;date&gt;</code></p><h2>Cycle de Vie Produit et Versions Supportees</h2><table><tr><th>Version</th><th>Type</th><th>Active Maintenance</th><th>Extended Maintenance</th></tr><tr><td>RING 7.x</td><td>—</td><td>Decembre 2022</td><td>Mars 2024 (EOL)</td></tr><tr><td><strong>RING 8.x (8.5 LTS)</strong></td><td>LTS</td><td><strong>Septembre 2026</strong></td><td>Septembre 2028</td></tr><tr><td><strong>RING 9.x (9.5 LTS)</strong></td><td>LTS</td><td><strong>Juillet 2029</strong></td><td>Juillet 2031</td></tr></table><ul><li><strong>Active Maintenance</strong> : corrections proactives + améliorations performance. RING 8.5 et 9.5 sont en Active Maintenance.</li><li><strong>Extended Maintenance</strong> (option payante) : corrections reactives P1 uniquement. Nouveaux déploiements non supportes.</li><li><strong>Chemin d\'upgrade obligatoire</strong> : RING 7.x → RING 8.5 (derniere release) → RING 9.5 LTS. Le saut direct 7→9 est interdit.</li></ul><h2>Breaking Changes Importants (9.5.x)</h2><table><tr><th>Changement</th><th>Version</th><th>Impact</th></tr><tr><td>Clé objet S3 limitée a 915 bytes</td><td>9.5.1</td><td>Objets avec des clés longues reçoivent HTTP 400 KeyTooLong. ARTESCA impose la même limite → important pour les setups CRR vers ARTESCA.</td></tr><tr><td>PutObject max 5 GB</td><td>9.5.1</td><td>PUT directs >5 GB retournent HTTP 400 EntityTooLarge. Utiliser MPU pour les gros fichiers.</td></tr><tr><td>s3:ReplicateObject obligatoire</td><td>9.5.2.0</td><td>Action pre-upgrade obligatoire pour les clusters CRR.</td></tr><tr><td>Events Notifications renommes</td><td>9.5.1</td><td>ObjectRemoved remplace par LifecycleExpiration:Delete. Mettre a jour les configurations de notifications existantes.</td></tr><tr><td>Vérification Host header S3C Console</td><td>9.5.2</td><td>L\'en-tete Host est vérifié. Variable env_s3_frontend_enforce_console_host_header disponible.</td></tr><tr><td>Elasticsearch supprimé</td><td>9.5.0</td><td>Remplace par ClickHouse. Les configurations Elasticsearch existantes sont caduques.</td></tr></table><h2>Réseau Flapping — Vulnérabilité du RING</h2><p>Le RING Scality est <strong>sensible aux instabilites réseau</strong> (flapping). Un réseau instable — même brieve­ment — peut provoquer des consequences graves : re-elections de leader, dégradation de la protection, voire perte de cohérence.</p><table><tr><th>Symptome réseau</th><th>Impact sur le RING</th></tr><tr><td>Perte de paquets > 0%</td><td>Retransmissions TCP → latences élevées → timeouts Chord → nœuds marqués DOWN</td></tr><tr><td>MTU incohérent (jumbo frames)</td><td>Fragmentation silencieuse → retransmissions → performance dégradée. Très difficile a diagnostiquer.</td></tr><tr><td>Interface flapping (lien up/down)</td><td>LACP peut prendre 30 secondes pour re-basculer si lacp_rate=slow (utiliser toujours <code>lacp_rate=fast</code>)</td></tr><tr><td>Latence inter-sites > 10ms</td><td>Elections Raft répétées (S3RaftElectionWarning), performance CRR dégradée</td></tr></table><h3>Vérification réseau avant/après incident</h3><pre># Test debit inter-noeuds (minimum 10 Gb/s effectif)\niperf3 -s                           # sur le serveur cible\niperf3 -c &lt;ip_nœud_cible&gt; -P 4    # depuis le nœud source\n\n# Vérifier les retransmissions TCP (doit être ~0)\nss -s | grep retrans\ncat /proc/net/snmp | grep -i retrans\n\n# Vérifier la cohérence MTU\nip link show | grep mtu\nping -M do -s 8972 &lt;ip_nœud&gt;     # test MTU 9000 (8972 + 28 headers)\n\n# Vérifier le LACP\ncat /proc/net/bonding/bond0 | grep -E "speed|mode|rate|MII"</pre><div class="kbox"><h3>Points Clés a Retenir</h3><ul><li>Stockage : baremetal OBLIGATOIRE, 128GB RAM, RAID 0 sur DATA, SSD metadata, BBU obligatoire</li><li>PatrolRead DESACTIVE sur tous les controleurs RAID</li><li>OS : RHEL/Rocky 8.10 ou 9.6/9.7 uniquement, x86-64v3, install Minimal, /var partition séparée</li><li>Tuning : swappiness=1, THP disabled, NUMA disabled, NTP obligatoire</li><li>Ports clés : Chord 4244-4255, Salt 4505/4506, Kafka 9092, ZK S3 22181, KMIP 5696</li><li>Platformcheck : CRITICAL = bloquant, WARNING = a corriger, OK = bon</li><li>RING 8.5 LTS → 2028 ; RING 9.5 LTS → 2031. Upgrade 7→9 interdit (passer par 8.5)</li><li>Breaking changes : clé 915B, PUT 5GB, s3:ReplicateObject, events Notifications renommes</li></ul></div>',
quiz:[
  {q:"Quel est le prérequis OS recommandé pour Scality RING v9 ?",opts:["Ubuntu 20.04","CentOS 7","RHEL/CentOS 8 ou Rocky Linux 8","Debian 11"],ans:2,expl:"Scality RING v9 est supporté sur RHEL/CentOS 8 ou Rocky Linux 8. Les versions antérieures (CentOS 7) ne sont plus supportées pour RING v9."},
  {q:"Quel paramètre kernel est recommandé pour les nœuds de stockage RING ?",opts:["vm.swappiness=60","vm.swappiness=10 ou 1 pour minimiser le swap","net.ipv4.tcp_keepalive=1","fs.inotify.max_user_watches=8192"],ans:1,expl:"vm.swappiness très bas (1-10) est recommandé pour les nœuds RING afin de garder les données actives en RAM et minimiser la latence induite par le swap sur les I/O disque."},
  {q:"Sur quel port sproxyd écoute-t-il par défaut ?",opts:["8080","9090","81","8181"],ans:2,expl:"sproxyd écoute sur le port 81 par défaut pour les requêtes HTTP internes des connectors. Ce port est interne et ne doit pas être exposé directement aux clients."},
  {q:"Quel outil vérifie la conformité pré-déploiement de la plateforme ?",opts:["Salt highstate","Platformcheck","Prometheus","ringsh platformcheck"],ans:1,expl:"Platformcheck est l'outil Scality de validation pré-déploiement. Il vérifie les prérequis hardware, OS, réseau et BIOS avant d'installer le logiciel RING."},
  {q:"Quel protocole de bonding réseau est recommandé pour la redondance des liens ?",opts:["Round-robin simple","LACP (Link Aggregation Control Protocol)","Spanning Tree","VLAN tagging uniquement"],ans:1,expl:"LACP (802.3ad) est recommandé pour le bonding des liens réseau des nœuds RING. Il offre agrégation de débit ET redondance avec négociation active avec le switch."},
  {q:"Quelle est la fréquence de support des versions RING (LTS) ?",opts:["Support illimité","Support de 3 ans pour les versions LTS (Long Term Support)","Support de 6 mois uniquement","Pas de politique LTS officielle"],ans:1,expl:"Scality définit des versions LTS avec un support étendu (environ 3 ans). Se référer à la matrice de support officielle pour les dates de fin de support de chaque version."},
  {q:"Que sont les breaking changes dans le contexte des upgrades RING ?",opts:["Bugs introduits par l'upgrade","Changements incompatibles nécessitant une action manuelle (migration config, format données) avant ou après l'upgrade","Performances dégradées temporairement","Changements de l'interface graphique"],ans:1,expl:"Les breaking changes sont des changements incompatibles avec la version précédente. Ils sont documentés dans les release notes et peuvent nécessiter des migrations de configuration ou de données."},
  {q:"Quel type de stockage est recommandé pour les disques d'index biziod ?",opts:["HDD haute capacité","SSD ou NVMe pour les index, HDD pour les données","Stockage réseau NFS","RAID 5 matériel"],ans:1,expl:"biziod utilisé du SSD/NVMe pour son index (lookups rapides) et des HDD pour les données (haute capacité, coût). Cette séparation est architecturalement importante pour les performances."},
  {q:"Pourquoi Scality déconseille-t-il l'utilisation d'un RAID matériel pour les disques de données biziod ?",opts:["Le RAID matériel n'est pas supporté par Linux","biziod gère lui-même la redondance via ARC/COS au niveau du ring : un RAID matériel ajoute une complexité inutile, masque les pannes de disques individuels et peut interférer avec la gestion biziod","Le RAID matériel est trop cher","Le RAID logiciel est obligatoire"],ans:1,expl:"biziod et le ring gèrent la redondance des données via ARC/COS. Ajouter un RAID matériel en dessous est redondant, masque les défaillances de disques individuels (empêchant une détection précoce), et peut créer des conflits avec la gestion directe des blocs par biziod."},
  {q:"Quelle est la raison principale pour laquelle les nœuds RING nécessitent des interfaces réseau à 10 Gbps minimum ?",opts:["Pour respecter les standards IEEE","Le ring génère un trafic interne intense (P2P, rebuild, balance) qui s'ajoute aux flux clients ; une connectivité insuffisante crée un goulot d'étranglement et dégrade l'ensemble des performances","1 Gbps suffit pour les petits clusters","Pour le monitoring Prometheus uniquement"],ans:1,expl:"Le trafic réseau dans un cluster RING inclut : requêtes clients (données entrantes/sortantes), trafic P2P inter-noeuds (réplication, routage), et trafic de maintenance (rebuild, balance). La somme dépasse rapidement 1 Gbps. Le 10 Gbps ou plus est nécessaire pour absorber ces flux sans dégradation."}
],
title_en:'Infrastructure, Ports and Product Lifecycle',
desc_en:'Hardware and OS prerequisites, system tuning, network ports per service, Platformcheck, supported versions, breaking changes',
content_en:'<h2>Hardware Prerequisites and Sizing</h2><h3>Storage Nodes (must be physical)</h3><p>RING storage nodes <strong>cannot be VMs</strong>. They must be bare-metal physical servers.</p><table><tr><th>Component</th><th>Requirement</th></tr><tr><td>RAM</td><td>128 GB minimum</td></tr><tr><td>OS Disks</td><td>~500 GB, 2 HDDs in RAID 1</td></tr><tr><td>DATA Disks</td><td>4 TB+ per disk, 7200 rpm HDDs, individual RAID 0. Write-back cache with BBU mandatory.</td></tr><tr><td>Metadata Disks</td><td>2 SSD/NVMe 480 GB+ in RAID 0, ext4, mounted before installation. PatrolRead DISABLED.</td></tr><tr><td>RING Network</td><td>2 x 10 Gb/s LACP 802.3ad layer3+4, lacp_rate=fast</td></tr><tr><td>Power Supply</td><td>Dual PSU mandatory</td></tr></table><p class="alert-d"><strong>RAID 0 on DATA disks:</strong> Each DATA disk is in individual RAID 0 (no RAID across disks). Data protection is provided by the RING itself (ARC/COS), not by RAID. <strong>PatrolRead must be disabled</strong> on all RAID controllers — it causes IO slowdowns that impact performance.</p><h3>S3 Connector Nodes</h3><table><tr><th>Component</th><th>Minimum Requirement</th></tr><tr><td>RAM</td><td>32 GB</td></tr><tr><td>OS Disks</td><td>2000 GB+ RAID 1 (including 400 GB+ for /var/log)</td></tr><tr><td>CPU</td><td>8 vCPUs minimum. 12-24 cores depending on feature set (UTAPI, CRR, SSE = advanced)</td></tr><tr><td>Frontend Network</td><td>2 x 10 Gb/s LACP (toward S3 clients)</td></tr><tr><td>Backend Network</td><td>2 x 10 Gb/s LACP (toward the RING)</td></tr></table><h3>Supervisor</h3><table><tr><th>Component</th><th>Requirement</th></tr><tr><td>RAM</td><td>16 GB (32+ if &gt;12 servers)</td></tr><tr><td>Disks</td><td>500 GB RAID 1</td></tr><tr><td>CPU</td><td>4 vCPUs</td></tr><tr><td>Deployment</td><td>VM with hypervisor failover recommended</td></tr></table><h2>OS and System Tuning</h2><h3>Supported operating systems (RING 9.5.2.3)</h3><table><tr><th>OS</th><th>Version</th><th>Status</th></tr><tr><td>RHEL</td><td>8.10</td><td>Supported and validated</td></tr><tr><td>Rocky Linux</td><td>8.10</td><td>Supported and validated</td></tr><tr><td>RHEL</td><td>9.6 / 9.7</td><td>Supported</td></tr><tr><td>Rocky Linux</td><td>9.6 / 9.7</td><td>Supported</td></tr><tr><td>RHEL 7 / CentOS 7</td><td>All</td><td>EOL since June 2024 — NOT supported</td></tr></table><p>CPU architecture: <strong>x86-64v3 minimum</strong> (since RING 9.5.0). OS installation: <strong>Minimal mode mandatory</strong> (no GUI, no pre-installed Samba).</p><h3>Minimal partitioning</h3><table><tr><th>Partition</th><th>Size</th></tr><tr><td>/boot</td><td>1 GB</td></tr><tr><td>/</td><td>50-100 GB (100-120 GB for Supervisor)</td></tr><tr><td>/var</td><td>400 GB+ — <strong>SEPARATE partition mandatory</strong></td></tr></table><p>Only supported filesystem for RING data: <strong>ext4</strong>.</p><h3>OS tuning applied by the installer</h3><table><tr><th>Parameter</th><th>Enforced Value</th><th>Reason</th></tr><tr><td>vm.swappiness</td><td>1</td><td>Minimizes swapping to avoid IO latency</td></tr><tr><td>Transparent Huge Pages</td><td>disabled</td><td>Causes random latency with memory-intensive applications</td></tr><tr><td>NUMA</td><td>disabled (BIOS interleaving)</td><td>Avoids memory access imbalances between CPUs</td></tr><tr><td>irqbalance</td><td>--oneshot at boot only</td><td>Avoids dynamic rebalancing of interrupts</td></tr><tr><td>SELinux</td><td>disabled before installation</td><td>Can be re-enabled afterward via Scality procedure</td></tr><tr><td>net.core.somaxconn</td><td>4096</td><td>TCP connection backlog queue</td></tr><tr><td>ulimit -n</td><td>65535</td><td>Number of simultaneously open files</td></tr></table><p class="alert-w"><strong>Incompatible software:</strong> Pre-existing Salt (remove salt-minion + /etc/salt), mlocate, desktop GUI, Transparent Huge Pages, active NUMA, Samba pre-installed on a RING node. <strong>NTP/Chrony mandatory</strong> — never change the clock on a running RING server (may corrupt internal state).</p><h2>Network Ports per Service</h2><h3>RING Infrastructure — Storage</h3><table><tr><th>Service</th><th>Port</th><th>Protocol</th></tr><tr><td>bizstorenode (Chord P2P)</td><td>TCP 4244-4255</td><td>Inter-node RING</td></tr><tr><td>bizstorenode admin (ringsh)</td><td>TCP 8084-8095</td><td>Administration</td></tr><tr><td>srebuildd / sproxyd REST</td><td>TCP 81, 10000, 10002</td><td>Rebuild and storage</td></tr><tr><td>Salt Master</td><td>TCP 4505, 4506</td><td>Configuration management</td></tr><tr><td>Supervisor GUI/API</td><td>TCP 80, 443, 3080, 2443, 3443, 4443</td><td>Administration</td></tr><tr><td>Grafana</td><td>TCP 3000</td><td>Monitoring</td></tr><tr><td>ZooKeeper (DLM)</td><td>TCP 2888, 3888</td><td>Cluster coordination</td></tr></table><h3>S3 Connector</h3><table><tr><th>Service</th><th>Port</th><th>Usage</th></tr><tr><td>S3 Frontend (clients)</td><td>TCP 80, 443</td><td>S3 HTTP/HTTPS API</td></tr><tr><td>Vault (IAM)</td><td>TCP 8500</td><td>Internal authentication</td></tr><tr><td>bucketd (metadata)</td><td>TCP 9000</td><td>Bucket operations</td></tr><tr><td>sproxyd (toward RING)</td><td>TCP 8181, 4243</td><td>Data storage in RING</td></tr><tr><td>Redis local</td><td>TCP 6479</td><td>Session/CRR cache</td></tr><tr><td>Kafka (CRR)</td><td>TCP 9092</td><td>Replication queue</td></tr><tr><td>ZooKeeper S3</td><td>TCP 22181</td><td>Backbeat coordination</td></tr><tr><td>KMIP (external SSE)</td><td>TCP 5696</td><td>Encryption (external KMS)</td></tr><tr><td>ADFS/SAML</td><td>TCP 443</td><td>SSO identity federation</td></tr><tr><td>FluentBit → ClickHouse</td><td>TCP 8123</td><td>S3 Analytics logs</td></tr></table><h3>Monitoring</h3><table><tr><th>Service</th><th>Port</th></tr><tr><td>Prometheus scrape nodes</td><td>TCP 9091, 9097, 9200, 9427</td></tr><tr><td>AlertManager</td><td>TCP 9093</td></tr><tr><td>Thanos gRPC mTLS</td><td>TCP 11903, 11905</td></tr><tr><td>Thanos Query FE</td><td>TCP 11902</td></tr></table><h2>Platformcheck and Installation</h2><p>The <strong>Platformcheck</strong> is Scality\'s pre/post-installation verification tool. It is <strong>read-only</strong> and can be run at any time to check system state.</p><table><tr><th>Severity</th><th>Meaning</th><th>Action</th></tr><tr><td><strong>CRITICAL</strong></td><td>Blocking issue. Installation will fail or the RING will be unstable.</td><td>Fix BEFORE proceeding.</td></tr><tr><td><strong>WARNING</strong></td><td>Non-blocking issue that may impact performance.</td><td>Fix if possible.</td></tr><tr><td><strong>OK</strong></td><td>Check passed.</td><td>Nothing to do.</td></tr></table><p>Report available at: <code>http://&lt;supervisor&gt;:8000/platformcheck/report-&lt;date&gt;</code></p><h2>Product Lifecycle and Supported Versions</h2><table><tr><th>Version</th><th>Type</th><th>Active Maintenance</th><th>Extended Maintenance</th></tr><tr><td>RING 7.x</td><td>—</td><td>December 2022</td><td>March 2024 (EOL)</td></tr><tr><td><strong>RING 8.x (8.5 LTS)</strong></td><td>LTS</td><td><strong>September 2026</strong></td><td>September 2028</td></tr><tr><td><strong>RING 9.x (9.5 LTS)</strong></td><td>LTS</td><td><strong>July 2029</strong></td><td>July 2031</td></tr></table><ul><li><strong>Active Maintenance</strong>: proactive fixes + performance improvements. RING 8.5 and 9.5 are in Active Maintenance.</li><li><strong>Extended Maintenance</strong> (paid option): reactive P1 fixes only. New deployments not supported.</li><li><strong>Mandatory upgrade path</strong>: RING 7.x → RING 8.5 (latest release) → RING 9.5 LTS. Direct jump 7→9 is not permitted.</li></ul><h2>Important Breaking Changes (9.5.x)</h2><table><tr><th>Change</th><th>Version</th><th>Impact</th></tr><tr><td>S3 object key limited to 915 bytes</td><td>9.5.1</td><td>Objects with long keys receive HTTP 400 KeyTooLong. ARTESCA enforces the same limit → important for CRR setups toward ARTESCA.</td></tr><tr><td>PutObject max 5 GB</td><td>9.5.1</td><td>Direct PUTs &gt;5 GB return HTTP 400 EntityTooLarge. Use MPU for large files.</td></tr><tr><td>s3:ReplicateObject mandatory</td><td>9.5.2.0</td><td>Pre-upgrade action required for CRR clusters.</td></tr><tr><td>Notification Events renamed</td><td>9.5.1</td><td>ObjectRemoved replaced by LifecycleExpiration:Delete. Update existing notification configurations.</td></tr><tr><td>Host header verification in S3C Console</td><td>9.5.2</td><td>Host header is validated. Variable env_s3_frontend_enforce_console_host_header available.</td></tr><tr><td>Elasticsearch removed</td><td>9.5.0</td><td>Replaced by ClickHouse. Existing Elasticsearch configurations are obsolete.</td></tr></table><h2>Network Flapping — RING Vulnerability</h2><p>The Scality RING is <strong>sensitive to network instability</strong> (flapping). An unstable network — even briefly — can cause serious consequences: leader re-elections, protection degradation, or even loss of consistency.</p><table><tr><th>Network symptom</th><th>Impact on RING</th></tr><tr><td>Packet loss &gt; 0%</td><td>TCP retransmissions → high latency → Chord timeouts → nodes marked DOWN</td></tr><tr><td>Inconsistent MTU (jumbo frames)</td><td>Silent fragmentation → retransmissions → degraded performance. Very difficult to diagnose.</td></tr><tr><td>Interface flapping (link up/down)</td><td>LACP can take 30 seconds to failover if lacp_rate=slow (always use <code>lacp_rate=fast</code>)</td></tr><tr><td>Inter-site latency &gt; 10ms</td><td>Repeated Raft elections (S3RaftElectionWarning), degraded CRR performance</td></tr></table><h3>Network verification before/after an incident</h3><pre># Test inter-node throughput (minimum 10 Gb/s effective)\niperf3 -s                           # on the target server\niperf3 -c &lt;ip_target_node&gt; -P 4    # from the source node\n\n# Check TCP retransmissions (should be ~0)\nss -s | grep retrans\ncat /proc/net/snmp | grep -i retrans\n\n# Check MTU consistency\nip link show | grep mtu\nping -M do -s 8972 &lt;ip_node&gt;     # MTU 9000 test (8972 + 28 headers)\n\n# Check LACP\ncat /proc/net/bonding/bond0 | grep -E "speed|mode|rate|MII"</pre><div class="kbox"><h3>Key Takeaways</h3><ul><li>Storage: bare-metal MANDATORY, 128GB RAM, RAID 0 on DATA, SSD metadata, BBU mandatory</li><li>PatrolRead DISABLED on all RAID controllers</li><li>OS: RHEL/Rocky 8.10 or 9.6/9.7 only, x86-64v3, Minimal install, /var separate partition</li><li>Tuning: swappiness=1, THP disabled, NUMA disabled, NTP mandatory</li><li>Key ports: Chord 4244-4255, Salt 4505/4506, Kafka 9092, ZK S3 22181, KMIP 5696</li><li>Platformcheck: CRITICAL = blocking, WARNING = to fix, OK = good</li><li>RING 8.5 LTS → 2028; RING 9.5 LTS → 2031. Upgrade 7→9 not permitted (must go through 8.5)</li><li>Breaking changes: 915B key limit, PUT 5GB, s3:ReplicateObject, renamed Notification events</li></ul></div>',
quiz_en:[
  {q:"What is the recommended OS prerequisite for Scality RING v9?",opts:["Ubuntu 20.04","CentOS 7","RHEL/CentOS 8 or Rocky Linux 8","Debian 11"],ans:2,expl:"Scality RING v9 is supported on RHEL/CentOS 8 or Rocky Linux 8. Older versions (CentOS 7) are no longer supported for RING v9."},
  {q:"Which kernel parameter is recommended for RING storage nodes?",opts:["vm.swappiness=60","vm.swappiness=10 or 1 to minimize swapping","net.ipv4.tcp_keepalive=1","fs.inotify.max_user_watches=8192"],ans:1,expl:"A very low vm.swappiness (1-10) is recommended for RING nodes to keep active data in RAM and minimize the latency induced by swapping on disk I/O."},
  {q:"Which port does sproxyd listen on by default?",opts:["8080","9090","81","8181"],ans:2,expl:"sproxyd listens on port 81 by default for internal HTTP requests from connectors. This port is internal and should not be exposed directly to clients."},
  {q:"Which tool verifies pre-deployment platform compliance?",opts:["Salt highstate","Platformcheck","Prometheus","ringsh platformcheck"],ans:1,expl:"Platformcheck is Scality's pre-deployment validation tool. It verifies hardware, OS, network, and BIOS prerequisites before installing the RING software."},
  {q:"Which network bonding protocol is recommended for link redundancy?",opts:["Simple round-robin","LACP (Link Aggregation Control Protocol)","Spanning Tree","VLAN tagging only"],ans:1,expl:"LACP (802.3ad) is recommended for bonding network links on RING nodes. It provides both throughput aggregation and redundancy with active negotiation with the switch."},
  {q:"What is the RING version support frequency (LTS)?",opts:["Unlimited support","3-year support for LTS (Long Term Support) versions","6-month support only","No official LTS policy"],ans:1,expl:"Scality defines LTS versions with extended support (approximately 3 years). Refer to the official support matrix for end-of-support dates for each version."},
  {q:"What are breaking changes in the context of RING upgrades?",opts:["Bugs introduced by the upgrade","Incompatible changes requiring manual action (config migration, data format) before or after the upgrade","Temporarily degraded performance","Changes to the graphical interface"],ans:1,expl:"Breaking changes are changes incompatible with the previous version. They are documented in the release notes and may require configuration or data migrations."},
  {q:"Which storage type is recommended for Biziod index disks?",opts:["High-capacity HDD","SSD or NVMe for index, HDD for data","NFS network storage","Hardware RAID 5"],ans:1,expl:"Biziod uses SSD/NVMe for its index (fast lookups) and HDDs for data (high capacity, low cost). This separation is architecturally important for performance."},
  {q:"Why does Scality advise against using hardware RAID for Biziod data disks?",opts:["Hardware RAID is not supported by Linux","Biziod manages redundancy itself via ARC/COS at the RING level: hardware RAID adds unnecessary complexity, masks individual disk failures, and can interfere with Biziod management","Hardware RAID is too expensive","Software RAID is mandatory"],ans:1,expl:"Biziod and the RING manage data redundancy via ARC/COS. Adding hardware RAID underneath is redundant, masks individual disk failures (preventing early detection), and can create conflicts with Biziod's direct block management."},
