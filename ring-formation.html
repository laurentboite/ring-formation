{id:'13',num:'13',title:'Maintenance RING — Salt, Controle des Tâches, Orphans',desc:'SaltStack, throttling et mode maintenance (ringsh), cycle de vie des données (GC/Purge), types d\'orphelins',
content:'<h2>Salt / SaltStack — L\'Outil de Configuration de Scality</h2><p>Scality RING utilisé <strong>SaltStack</strong> comme outil de gestion de configuration et d\'orchestration. "Salt" dans les commandes Scality fait toujours référence a SaltStack — un logiciel de gestion d\'infrastructure comparable a Ansible ou Puppet, et <strong>non</strong> un "sel" cryptographique pour les hachages.</p><h3>Architecture SaltStack dans RING</h3><div class="adiag">Architecture Salt dans Scality RING :\n\n  [Salt Master]  -- sur le SUPERVISOR\n       |\n       |-- commandes/états/pillar\n       |\n  +----+----+----+----+\n  |    |    |    |    |\n [Salt Minion] x N    -- sur chaque serveur RING\n (storage, connector, monitoring...)\n\nConfiguration :\n  /srv/scality/pillar/scality-common.sls  -- paramètres globaux\n  /srv/scality/salt/                      -- états Salt (formulas)\n  /srv/scality/bin/bootstrap              -- script d\'initialisation</div><h3>Commandes Salt courantes dans RING</h3><table><tr><th>Commande</th><th>Effet</th></tr><tr><td><code>salt \'*\' saltutil.refresh_pillar</code></td><td>Recharge la configuration (pillar) sur tous les nœuds. A exécuter après toute modification de scality-common.sls.</td></tr><tr><td><code>salt-run state.orchestrate prometheus.orchestrate</code></td><td>Deploy ou reconfiguré l\'infrastructure Prometheus/Alertmanager. A exécuter après toute modification de la configuration de monitoring.</td></tr><tr><td><code>salt -G \'rôles:ROLE_STORE\' state.sls scality.garbage_collector.configured</code></td><td>Applique la configuration du Garbage Collector sur tous les serveurs de stockage.</td></tr><tr><td><code>salt -G \'rôles:ROLE_SUP\' state.sls ...</code></td><td>Applique un état Salt uniquement sur le Supervisor.</td></tr><tr><td><code>salt &lt;minion_id&gt; grains.get prometheus_ip</code></td><td>Récupère la valeur d\'un "grain" (métadonnée de nœud) — utile pour les remplacements de nœud.</td></tr></table><p class="alert-i"><strong>scaldisk et Salt :</strong> L\'outil <code>scaldisk</code> (ajout/récupération de disques) utilisé Salt en mode standalone pour exécuter ses opérations. Salt doit être installe en version 2015.8 a 2017.7 (inclus). <strong>Ne pas utiliser Salt pour ajouter des disques a tous les serveurs simultanément</strong> — cela peut perturber le re-balancing du RING.</p><h2>Cycle de Vie des Données — GC, Purge, Relocation</h2><p>La suppression d\'un objet dans RING est un processus <strong>asynchrone en 3 étapes</strong> pour garantir les performances et éviter les orphelins :</p><div class="adiag">Flux de suppression d\'un objet :\n\n1. DELETE S3 (synchrone)\n   Client -> Cloudserver -> repd\n   L\'objet est marqué "deleted" dans les métadonnées\n   -> Réponse immédiate au client (200 OK)\n   \n2. Garbage Collector Task (asynchrone)\n   Un objet cache special "GC object" liste les objets a supprimer\n   Le daemon GC traité ces listes en arrière-plan\n   -> Les blocs de données dans le RING sont marqués "a libérer"\n   \n3. Purge Task (asynchrone, délai 7 jours par défaut)\n   Après le délai de "purge retention", les blocs sont physiquement\n   désalloués dans les fichiers DAT des biziods\n   -> L\'espace est reellement récupère\n\n4. Relocation Task (si nécessaire)\n   Si un fichier DAT contient trop d\'espace non utilisé (trous),\n   les données valides sont copiées dans un nouveau fichier DAT\n   et l\'ancien est supprimé\n   -> Defragmentation des fichiers de stockage</div><h3>Les 3 tâches du Garbage Collector</h3><table><tr><th>Tâche</th><th>Rôle</th><th>Paramètres clés</th></tr><tr><td><strong>GC Task</strong></td><td>Traité les "GC objects" (listes d\'objets supprimés). Optimise les suppressions massives en les traitant en asynchrone.</td><td><code>chordgc_enable</code>, <code>chordgc_crawlfreq</code> (fréquence en secondes), <code>chordgc_maxjobs</code></td></tr><tr><td><strong>Purge Task</strong></td><td>Desallocation physique des objets marqués deleted. Délai de purge retention = 7 jours par défaut. Ce délai <strong>évite les orphelins</strong> lors de pannes ou maintenance.</td><td><code>chordpurgetombstoneexpirationtimevalue</code> (min 1 semaine recommande), <code>chordpurgeperiod</code> (≤ moitie de la valeur précédente)</td></tr><tr><td><strong>Relocation Task</strong></td><td>Defragmentation : crée un nouveau fichier DAT avec les données valides, supprimé l\'ancien. Libère l\'espace des trous dans les fichiers container.</td><td>Déclenche automatiquement quand le taux d\'espace non utilisé depasse un seuil.</td></tr></table><h2>Controle et Throttling des Tâches RING</h2><p>Les tâches automatiques peuvent impacter les I/O de production. L\'administrateur dispose de deux leviers.</p><h3>Throttling — Limiter l\'Impact sur la Production</h3><p>Le Throttling limite la bande passante consommée par chaque tâche de fond :</p><ul><li><strong>Par tâche</strong> : Rebuild throttle a 50 MB/s, GC a 10 MB/s</li><li><strong>Par priorité</strong> : les I/O de production sont toujours prioritaires sur les tâches de fond</li><li><strong>Plage horaire</strong> : possibilité de limiter les tâches lourdes a certaines plages horaires</li></ul><p>Configuration : Supervisor UI → <code>Administration &gt; General &gt; Task Throttling</code></p><h3>Mode Maintenance (ringsh) — Suspendre les Tâches</h3><p>Avant certaines opérations (remplacement de disque, upgrade d\'un node), il faut suspendre les tâches automatiques pour éviter qu\'elles perturbent la fenêtre de maintenance :</p><pre># Mode maintenance : désactiver les tâches automatiques\nringsh supervisor ringConfigSet &lt;RING&gt; join_auto 0        # désactivé auto-join\nringsh supervisor ringConfigSet &lt;RING&gt; rebuild_auto 0     # désactivé auto-rebuild\nringsh supervisor ringConfigSet &lt;RING&gt; chordpurge_enable 0 # désactivé chord purge\n\n# Reprise normale après maintenance\nringsh supervisor ringConfigSet &lt;RING&gt; join_auto 2        # réactive auto-join\nringsh supervisor ringConfigSet &lt;RING&gt; rebuild_auto 1     # réactive auto-rebuild\nringsh supervisor ringConfigSet &lt;RING&gt; chordpurge_enable 1 # réactive chord purge</pre><div class="alert alert-w">Toujours reajouter les tâches après la fenêtre de maintenance. Un RING laisse trop longtemps avec rebuild_auto=0 accumule des objets sous-repliques (état INCOMPLETE) sans déclenchement automatique du Rebuild.</div><h2>Les Orphelins dans RING</h2><p>Un <strong>orphelin</strong> est une donnée qui existe physiquement dans le RING mais qui n\'est plus référencée par aucune métadonnée. Les orphelins consomment de l\'espace disque inutilement et doivent être nettoyes.</p><h3>Types d\'orphelins</h3><table><tr><th>Type</th><th>Definition</th><th>Cause typique</th></tr><tr><td><strong>Disk Orphans</strong></td><td>Chunks sur disque (biziod) qui n\'ont plus de clé valide dans l\'index RING.</td><td>Panne durant une écriture, maintenance interrompue, bug de suppression partielle.</td></tr><tr><td><strong>S3 Orphans</strong></td><td>Données non référencées par les métadonnées S3 (ex: compte supprimé sans supprimer son contenu).</td><td>Suppression d\'un compte S3 sans purge prealable du contenu. Deletion incomplete.</td></tr><tr><td><strong>SOFS Orphans</strong></td><td>Données SOFS sans métadonnées associées (ex: volume supprimé sans supprimer les données liees).</td><td>Suppression de volume SOFS avec echec partiel.</td></tr><tr><td><strong>ARC Orphans</strong></td><td>Parties de fragments ARC (erasure coding) qui n\'ont pas ete correctement supprimées.</td><td>Suppression incomplete d\'un objet ARC (panne pendant la désallocation).</td></tr><tr><td><strong>ARC Incomplete Objects</strong></td><td>Objets ARC auxquels il manque trop de fragments pour être reconstruits.</td><td>Multiples pannes simultanées depassant le seuil de tolérance ARC.</td></tr></table><h3>Commandes de gestion des disk orphans</h3><pre># Lister tous les orphelins potentiels sur un nœud\nring> node listDiskOrphans\n\n# Lister les orphelins d\'un biziod spécifique\nring> node listDiskOrphans bizioname=cutebiziod0001\n\n# Supprimer les orphelins mémoire d\'un biziod\nring> node clearDiskOrphans cutebiziod0001\n\n# Nettoyer les objets hors-service (OOS)\nring> node cleanupOos disk0001</pre><h3>Capacité affichée dans le Dashboard</h3><p>Le tableau de bord Scality distingue plusieurs categories de capacité qui aident a identifier les problèmes d\'orphelins :</p><table><tr><th>Categorie</th><th>Description</th></tr><tr><td>Garbage collectable</td><td>Objets en attente de suppression asynchrone (GC objects). Doit diminuer périodiquement.</td></tr><tr><td>ARC Orphans</td><td>Fragments ARC non supprimés — indique des suppressions incompletes.</td></tr><tr><td>ARC Incomplete Objects</td><td>Objets ARC trop endommagées pour être reconstruits — nécessite une intervention.</td></tr><tr><td>Deleted</td><td>Objets marqués pour suppression, en attente de purge (7 jours).</td></tr><tr><td>COS Incomplete Objects</td><td>Objets répliques (COS) avec des copies manquantes.</td></tr></table><div class="kbox"><h3>Points Clés a Retenir</h3><ul><li>Salt dans Scality = SaltStack (gestion de configuration), pas un sel cryptographique</li><li>Après modification de scality-common.sls : toujours <code>salt \'*\' saltutil.refresh_pillar</code></li><li>Suppression RING = 3 phases asynchrones : GC Task → Purge Task (7j) → Relocation</li><li>Purge retention 7 jours = fenêtre de sécurité contre les orphelins lors de pannes</li><li>Disk orphans = <code>listDiskOrphans</code> pour identifier, <code>clearDiskOrphans</code> pour nettoyer</li><li>S3 orphans = données sans métadonnées (compte supprimé sans purge du contenu)</li><li>ARC Orphans = fragments ARC non supprimés → consomment de l\'espace inutilement</li><li>Throttling = limiter l\'impact des tâches via Supervisor → Administration &gt; Task Throttling</li><li>Mode maintenance = désactiver rebuild_auto + join_auto avant toute intervention sur un node</li></ul></div>',
quiz:[
  {q:"Quelle commande ringsh retire proprement un nœud du ring ?",opts:["nodeRemove","nodeLeave","nodeStop","ringNodeDelete"],ans:1,expl:"nodeLeave retire proprement un nœud du ring. Avant de partir, le nœud transfère ses données aux autres membres. Ne pas utiliser si le nœud est déjà physiquement inaccessible."},
  {q:"Quelle commande ringsh ajoute un nouveau nœud au ring ?",opts:["nodeAdd","nodeStart","nodeJoin","ringExpand"],ans:2,expl:"nodeJoin ajoute un nœud au ring. Il déclenche le rééquilibrage du keyspace et le transfert de données vers le nouveau nœud."},
  {q:"Quel outil de gestion de configuration Scality utilise-t-il pour le déploiement ?",opts:["Ansible","Puppet","SaltStack","Terraform"],ans:2,expl:"SaltStack est l'outil d'orchestration et de gestion de configuration de Scality RING. Les états Salt définissent la configuration cible des différents types de nœuds."},
  {q:"Que fait la commande ringConfigSet ?",opts:["Affiche la configuration actuelle du ring","Modifie les paramètres de configuration du ring (facteur de réplication, seuils)","Réinitialise le ring à sa configuration d'usine","Synchronise la configuration entre nœuds"],ans:1,expl:"ringConfigSet modifie les paramètres de configuration du ring. C'est une opération sensible qui peut nécessiter validation et redémarrage de services. Réservée à la maintenance."},
  {q:"Quels types d'orphelins existent dans le RING ?",opts:["Chord Orphans uniquement","Disk Orphans et Chord Orphans","Metadata Orphans et Data Orphans","Object Orphans et Bucket Orphans"],ans:1,expl:"Il y a deux types : Disk Orphans (données sur disque sans référence Chord) et Chord Orphans (références Chord sans données physiques). Les deux sont identifiés par Chord Purge."},
  {q:"Quel est l'impact du throttling sur les tâches de maintenance ?",opts:["Annule les tâches","Limite la consommation I/O des tâches de fond pour ne pas impacter les accès clients","Accélère les tâches de rebuild","Désactive les alarmes pendant la maintenance"],ans:1,expl:"Le throttling limite le débit I/O des tâches de fond (Rebuild, Repair, Balance) pour que les opérations clients ne soient pas dégradées. À ajuster selon la charge et l'urgence."},
  {q:"Que vérifie-t-on en priorité avant un nodeLeave ?",opts:["Que le nœud est redémarré","Que le ring peut absorber la perte : espace suffisant et protections ARC intactes","Que tous les clients sont déconnectés","Que CRR est désactivé"],ans:1,expl:"Avant nodeLeave, vérifier que le ring a suffisamment d'espace pour absorber la redistribution et que le COS peut maintenir ses garanties de protection sans ce nœud."},
  {q:"Quelle est la différence entre nodeLeave et marquer un nœud OOS_PERM ?",opts:["Il n'y a pas de différence","nodeLeave est une sortie propre avec transfert de données (nœud disponible). OOS_PERM déclare le nœud définitivement perdu et déclenche un rebuild depuis les fragments survivants","nodeLeave est pour les nœuds DATA, OOS_PERM pour les nœuds META","OOS_PERM est plus rapide que nodeLeave"],ans:1,expl:"nodeLeave suppose que le nœud est accessible et peut transférer ses données : sortie planifiée propre. OOS_PERM est utilisé quand le nœud est physiquement irrécupérable : le ring reconstruit les données depuis les autres fragments/répliques sans le nœud perdu."},
  {q:"Après un nodeJoin, quelle tâche surveiller en priorité dans ringsh ?",opts:["Repair","Chord Purge","Balance (rééquilibrage du keyspace vers le nouveau nœud)","Rebuild"],ans:2,expl:"Après un nodeJoin, le ring doit redistribuer une partie du keyspace vers le nouveau nœud via Balance. C'est la tâche critique à surveiller : elle transfère les données, consomme de la bande passante I/O et peut prendre du temps selon le volume."},
  {q:"Un administrateur veut augmenter le facteur de réplication d'un COS de 3 à 5. Quelle commande utilise-t-il et quel est l'impact immédiat ?",opts:["ringConfigSet — le ring réplique instantanément tous les objets existants à 5 copies","ringConfigSet — les nouveaux objets sont écrits avec 5 répliques mais les objets existants restent à 3 jusqu'au passage de Repair","nodeJoin — il faut ajouter des nœuds d'abord","Il est impossible de changer un COS après création"],ans:1,expl:"ringConfigSet modifie le COS. Les nouvelles écritures respectent immédiatement le nouveau facteur. Les objets existants sont mis à jour progressivement lors du passage de Repair (vérification et correction de l'intégrité de tous les objets). L'effet n'est pas instantané sur l'existant."}
],
title_en:'RING Maintenance — Salt, Task Control, Orphans',
desc_en:'SaltStack, throttling and maintenance mode (ringsh), data lifecycle (GC/Purge), orphan types',
content_en:'<h2>Salt / SaltStack — Scality\'s Configuration Tool</h2><p>Scality RING uses <strong>SaltStack</strong> as its configuration management and orchestration tool. "Salt" in Scality commands always refers to SaltStack — an infrastructure management tool comparable to Ansible or Puppet, and <strong>not</strong> a cryptographic salt for hashes.</p><h3>SaltStack Architecture in RING</h3><div class="adiag">Salt architecture in Scality RING:\n\n  [Salt Master]  -- on the SUPERVISOR\n       |\n       |-- commands/states/pillar\n       |\n  +----+----+----+----+\n  |    |    |    |    |\n [Salt Minion] x N    -- on each RING server\n (storage, connector, monitoring...)\n\nConfiguration:\n  /srv/scality/pillar/scality-common.sls  -- global parameters\n  /srv/scality/salt/                      -- Salt states (formulas)\n  /srv/scality/bin/bootstrap              -- initialization script</div><h3>Common Salt Commands in RING</h3><table><tr><th>Command</th><th>Effect</th></tr><tr><td><code>salt \'*\' saltutil.refresh_pillar</code></td><td>Reloads the configuration (pillar) on all nodes. Must be run after any modification to scality-common.sls.</td></tr><tr><td><code>salt-run state.orchestrate prometheus.orchestrate</code></td><td>Deploys or reconfigures the Prometheus/AlertManager infrastructure. Must be run after any monitoring configuration change.</td></tr><tr><td><code>salt -G \'roles:ROLE_STORE\' state.sls scality.garbage_collector.configured</code></td><td>Applies the Garbage Collector configuration to all storage servers.</td></tr><tr><td><code>salt -G \'roles:ROLE_SUP\' state.sls ...</code></td><td>Applies a Salt state only to the Supervisor.</td></tr><tr><td><code>salt &lt;minion_id&gt; grains.get prometheus_ip</code></td><td>Retrieves the value of a "grain" (node metadata) — useful for node replacements.</td></tr></table><p class="alert-i"><strong>scaldisk and Salt:</strong> The <code>scaldisk</code> tool (adding/recovering disks) uses Salt in standalone mode to carry out its operations. Salt must be installed in version 2015.8 to 2017.7 (inclusive). <strong>Do not use Salt to add disks to all servers simultaneously</strong> — this can disrupt RING re-balancing.</p><h2>Data Lifecycle — GC, Purge, Relocation</h2><p>Deleting an object in RING is an <strong>asynchronous 3-step process</strong> designed to guarantee performance and prevent orphans:</p><div class="adiag">Object deletion flow:\n\n1. DELETE S3 (synchronous)\n   Client -&gt; Cloudserver -&gt; repd\n   The object is marked "deleted" in the metadata\n   -&gt; Immediate response to the client (200 OK)\n\n2. Garbage Collector Task (asynchronous)\n   A special cache object "GC object" lists the objects to be deleted\n   The GC daemon processes these lists in the background\n   -&gt; Data blocks in the RING are marked "to be freed"\n\n3. Purge Task (asynchronous, 7-day delay by default)\n   After the "purge retention" delay, blocks are physically\n   deallocated in the biziod DAT files\n   -&gt; Space is truly reclaimed\n\n4. Relocation Task (if necessary)\n   If a DAT file contains too much unused space (holes),\n   valid data is copied into a new DAT file\n   and the old one is deleted\n   -&gt; Defragmentation of storage files</div><h3>The 3 Garbage Collector Tasks</h3><table><tr><th>Task</th><th>Role</th><th>Key Parameters</th></tr><tr><td><strong>GC Task</strong></td><td>Processes "GC objects" (lists of deleted objects). Optimizes bulk deletions by handling them asynchronously.</td><td><code>chordgc_enable</code>, <code>chordgc_crawlfreq</code> (frequency in seconds), <code>chordgc_maxjobs</code></td></tr><tr><td><strong>Purge Task</strong></td><td>Physical deallocation of objects marked as deleted. Purge retention delay = 7 days by default. This delay <strong>prevents orphans</strong> during failures or maintenance.</td><td><code>chordpurgetombstoneexpirationtimevalue</code> (min 1 week recommended), <code>chordpurgeperiod</code> (half the previous value or less)</td></tr><tr><td><strong>Relocation Task</strong></td><td>Defragmentation: creates a new DAT file with valid data, deletes the old one. Frees space from holes in container files.</td><td>Triggered automatically when the unused space ratio exceeds a threshold.</td></tr></table><h2>RING Task Control and Throttling</h2><p>Automatic tasks can impact production I/O. The administrator has two levers available.</p><h3>Throttling — Limiting Impact on Production</h3><p>Throttling limits the bandwidth consumed by each background task:</p><ul><li><strong>Per task</strong>: Rebuild throttled to 50 MB/s, GC to 10 MB/s</li><li><strong>By priority</strong>: production I/O always takes precedence over background tasks</li><li><strong>Time window</strong>: ability to restrict heavy tasks to specific time windows</li></ul><p>Configuration: Supervisor UI &gt; <code>Administration &gt; General &gt; Task Throttling</code></p><h3>Maintenance Mode (ringsh) — Suspending Tasks</h3><p>Before certain operations (disk replacement, node upgrade), automatic tasks must be suspended to prevent them from interfering with the maintenance window:</p><pre># Maintenance mode: disable automatic tasks\nringsh supervisor ringConfigSet &lt;RING&gt; join_auto 0        # disable auto-join\nringsh supervisor ringConfigSet &lt;RING&gt; rebuild_auto 0     # disable auto-rebuild\nringsh supervisor ringConfigSet &lt;RING&gt; chordpurge_enable 0 # disable chord purge\n\n# Resume normal operation after maintenance\nringsh supervisor ringConfigSet &lt;RING&gt; join_auto 2        # re-enable auto-join\nringsh supervisor ringConfigSet &lt;RING&gt; rebuild_auto 1     # re-enable auto-rebuild\nringsh supervisor ringConfigSet &lt;RING&gt; chordpurge_enable 1 # re-enable chord purge</pre><div class="alert alert-w">Always re-enable tasks after the maintenance window. A RING left too long with rebuild_auto=0 accumulates under-replicated objects (INCOMPLETE state) without automatic Rebuild triggering.</div><h2>Orphans in RING</h2><p>An <strong>orphan</strong> is data that physically exists in the RING but is no longer referenced by any metadata. Orphans consume disk space unnecessarily and must be cleaned up.</p><h3>Orphan Types</h3><table><tr><th>Type</th><th>Definition</th><th>Typical Cause</th></tr><tr><td><strong>Disk Orphans</strong></td><td>Chunks on disk (Biziod) that no longer have a valid key in the RING index.</td><td>Failure during a write, interrupted maintenance, partial deletion bug.</td></tr><tr><td><strong>S3 Orphans</strong></td><td>Data not referenced by S3 metadata (e.g., account deleted without deleting its content).</td><td>Deletion of an S3 account without prior purge of its content. Incomplete deletion.</td></tr><tr><td><strong>SOFS Orphans</strong></td><td>SOFS data with no associated metadata (e.g., volume deleted without deleting related data).</td><td>SOFS volume deletion with partial failure.</td></tr><tr><td><strong>ARC Orphans</strong></td><td>ARC erasure coding fragment parts that were not properly deleted.</td><td>Incomplete deletion of an ARC object (failure during deallocation).</td></tr><tr><td><strong>ARC Incomplete Objects</strong></td><td>ARC objects missing too many fragments to be reconstructed.</td><td>Multiple simultaneous failures exceeding the ARC tolerance threshold.</td></tr></table><h3>Disk Orphan Management Commands</h3><pre># List all potential orphans on a node\nring&gt; node listDiskOrphans\n\n# List orphans for a specific Biziod\nring&gt; node listDiskOrphans bizioname=cutebiziod0001\n\n# Clear in-memory orphans for a Biziod\nring&gt; node clearDiskOrphans cutebiziod0001\n\n# Clean up out-of-service (OOS) objects\nring&gt; node cleanupOos disk0001</pre><h3>Capacity Displayed in the Dashboard</h3><p>The Scality dashboard distinguishes several capacity categories that help identify orphan issues:</p><table><tr><th>Category</th><th>Description</th></tr><tr><td>Garbage collectable</td><td>Objects awaiting asynchronous deletion (GC objects). Should decrease periodically.</td></tr><tr><td>ARC Orphans</td><td>ARC fragments not yet deleted — indicates incomplete deletions.</td></tr><tr><td>ARC Incomplete Objects</td><td>ARC objects too damaged to be reconstructed — requires intervention.</td></tr><tr><td>Deleted</td><td>Objects marked for deletion, awaiting purge (7 days).</td></tr><tr><td>COS Incomplete Objects</td><td>Replicated (COS) objects with missing copies.</td></tr></table><div class="kbox"><h3>Key Takeaways</h3><ul><li>Salt in Scality = SaltStack (configuration management), not a cryptographic salt</li><li>After modifying scality-common.sls: always run <code>salt \'*\' saltutil.refresh_pillar</code></li><li>RING deletion = 3 asynchronous phases: GC Task &gt; Purge Task (7 days) &gt; Relocation</li><li>Purge retention of 7 days = safety window against orphans during failures</li><li>Disk orphans = <code>listDiskOrphans</code> to identify, <code>clearDiskOrphans</code> to clean up</li><li>S3 orphans = data without metadata (account deleted without purging content)</li><li>ARC Orphans = ARC fragments not deleted, consuming space unnecessarily</li><li>Throttling = limit task impact via Supervisor &gt; Administration &gt; Task Throttling</li><li>Maintenance mode = disable rebuild_auto + join_auto before any node intervention</li></ul></div>',
quiz_en:[
  {q:"Which ringsh command cleanly removes a node from the ring?",opts:["nodeRemove","nodeLeave","nodeStop","ringNodeDelete"],ans:1,expl:"nodeLeave cleanly removes a node from the ring. Before leaving, the node transfers its data to the other members. Do not use if the node is already physically unreachable."},
  {q:"Which ringsh command adds a new node to the ring?",opts:["nodeAdd","nodeStart","nodeJoin","ringExpand"],ans:2,expl:"nodeJoin adds a node to the ring. It triggers keyspace rebalancing and data transfer to the new node."},
  {q:"Which configuration management tool does Scality use for deployment?",opts:["Ansible","Puppet","SaltStack","Terraform"],ans:2,expl:"SaltStack is Scality RING's orchestration and configuration management tool. Salt states define the target configuration for the different types of nodes."},
  {q:"What does the ringConfigSet command do?",opts:["Displays the current ring configuration","Modifies ring configuration parameters (replication factor, thresholds)","Resets the ring to factory configuration","Synchronizes configuration between nodes"],ans:1,expl:"ringConfigSet modifies ring configuration parameters. It is a sensitive operation that may require validation and service restarts. Reserved for maintenance use."},
  {q:"What types of orphans exist in the RING?",opts:["Chord Orphans only","Disk Orphans and Chord Orphans","Metadata Orphans and Data Orphans","Object Orphans and Bucket Orphans"],ans:1,expl:"There are two types: Disk Orphans (data on disk with no Chord reference) and Chord Orphans (Chord references with no physical data). Both are identified by Chord Purge."},
  {q:"What is the impact of throttling on maintenance tasks?",opts:["It cancels the tasks","It limits the I/O consumption of background tasks so that client access is not degraded","It speeds up rebuild tasks","It disables alarms during maintenance"],ans:1,expl:"Throttling limits the I/O throughput of background tasks (Rebuild, Repair, Balance) so that client operations are not impacted. It should be adjusted according to load and urgency."},
  {q:"What is the first thing to check before a nodeLeave?",opts:["That the node has been restarted","That the ring can absorb the loss: sufficient space and ARC protections intact","That all clients are disconnected","That CRR is disabled"],ans:1,expl:"Before nodeLeave, verify that the ring has enough space to absorb the redistribution and that the COS can maintain its protection guarantees without this node."},
  {q:"What is the difference between nodeLeave and marking a node OOS_PERM?",opts:["There is no difference","nodeLeave is a clean exit with data transfer (node available). OOS_PERM declares the node permanently lost and triggers a rebuild from surviving fragments","nodeLeave is for DATA nodes, OOS_PERM for META nodes","OOS_PERM is faster than nodeLeave"],ans:1,expl:"nodeLeave assumes the node is accessible and can transfer its data: a planned clean exit. OOS_PERM is used when the node is physically unrecoverable: the ring rebuilds data from the other fragments/replicas without the lost node."},
  {q:"After a nodeJoin, which task should be monitored as a priority in ringsh?",opts:["Repair","Chord Purge","Balance (keyspace rebalancing toward the new node)","Rebuild"],ans:2,expl:"After a nodeJoin, the ring must redistribute part of the keyspace to the new node via Balance. This is the critical task to monitor: it transfers data, consumes I/O bandwidth, and may take time depending on the volume."},
  {q:"An administrator wants to increase the replication factor of a COS from 3 to 5. Which command is used and what is the immediate impact?",opts:["ringConfigSet — the ring instantly replicates all existing objects to 5 copies","ringConfigSet — new objects are written with 5 replicas but existing objects remain at 3 until Repair runs","nodeJoin — nodes must be added first","It is impossible to change a COS after creation"],ans:1,expl:"ringConfigSet modifies the COS. New writes immediately follow the new factor. Existing objects are updated progressively during the Repair pass (integrity check and correction of all objects). The effect on existing data is not instantaneous."}
]}

{id:'14',num:'14',title:'CRR — Réplication Multi-Sites',desc:'Cross-Region Réplication : Backbeat, Kafka, ZooKeeper, site-level vs bucket-level, objets existants, pause/resume',
content:'<h2>CRR — Cross-Region Réplication</h2><p>La <strong>Cross-Region Réplication (CRR)</strong> est le mécanisme de Scality pour répliquer de façon <strong>asynchrone</strong> les objets S3 d\'un cluster source vers un cluster destination. Elle est implémentée par <strong>Backbeat</strong>, le moteur de workflows asynchrones du S3 Connector.</p><h3>Architecture du pipeline CRR</h3><div class="adiag">CLUSTER SOURCE                          CLUSTER DESTINATION\n\n  Client S3\n     | PUT objet\n     v\n [Cloudserver]                          [Cloudserver]\n     | écrit métadonnées                      |\n     v                                        |\n  [repd]  --> journal Raft                    |\n     |                                        |\n     v                                        |\n [Backbeat Queue Populator]                   |\n     | détecte les nouveaux objets            |\n     | publie dans Kafka                      |\n     v                                        |\n   [Kafka]  topic: backbeat-replication       |\n     |                                        |\n     v                                        |\n [Backbeat Queue Processor]                   |\n     | lit les événements Kafka               |\n     | lit l\'objet depuis sproxyd source      |\n     | écrit l\'objet dans sproxyd destination |\n     +------> PUT objet ----------------------+\n     | écrit le statut CRR dans repd source   |\n     v                                        |\n  Statut: COMPLETED                      [repd destination]</div><h3>Site-Level vs Bucket-Level CRR</h3><table><tr><th>Mode</th><th>Description</th><th>Cas d\'usage</th><th>Contraintes</th></tr><tr><td><strong>Bucket-Level CRR</strong></td><td>Configuration explicite par bucket : l\'admin active la réplication bucket par bucket avec une policy JSON IAM.</td><td>Réplication selective, Object Lock, CRR granulaire.</td><td>Chaque bucket doit être configuré indépendamment. Compatible Object Lock.</td></tr><tr><td><strong>Site-Level CRR (Echo Mode)</strong></td><td>Mode "echo" automatique : tout bucket crée sur la source est automatiquement réplique sur la destination. Backbeat configuré les IAM policies automatiquement.</td><td>Mirror complet de site, DR simplifié.</td><td><strong>Incompatible avec Object Lock.</strong> Pas de granularite par bucket.</td></tr></table><h3>Statuts CRR d\'un objet</h3><table><tr><th>Statut</th><th>Signification</th></tr><tr><td><strong>PENDING</strong></td><td>Objet en attente de réplication dans la queue Kafka. Pas encore traité.</td></tr><tr><td><strong>PROCESSING</strong></td><td>Objet en cours de copie vers la destination.</td></tr><tr><td><strong>COMPLETED</strong></td><td>Objet réplique avec succes sur le cluster destination.</td></tr><tr><td><strong>FAILED</strong></td><td>Echec de la réplication (réseau, destination indisponible...). Redis conserve les entrées FAILED pour retry.</td></tr><tr><td><strong>REPLICA</strong></td><td>Objet qui EST une réplique (il est la destination). Ne doit pas être re-replique sauf en cas de DR failback.</td></tr></table><h2>Kafka et ZooKeeper dans CRR</h2><p><strong>Kafka</strong> est la queue de messages qui découplé le Queue Populator (détection) du Queue Processor (copie). Points clés :</p><ul><li>Topic principal : <code>backbeat-replication</code></li><li><strong>Retention 7 jours</strong> : si le cluster destination est indisponible plus de 7 jours, Kafka droppe les événements les plus anciens et les objets ne seront jamais répliques</li><li>Vérification sante : <code>/opt/scality/s3tools/bin/backbeat-topic-info</code></li></ul><p><strong>ZooKeeper</strong> coordonne :</p><ul><li>L\'election de leader dans les workers Backbeat</li><li>La synchronisation des offsets Kafka entre workers</li><li>En failover multi-sites : Ansible met a jour ZooKeeper (6 → 5 participants pour rétablir le quorum)</li></ul><h2>Replier des Objets Existants (crrExistingObjects.js)</h2><p>Les objets mis en place <strong>avant</strong> l\'activation d\'une policy CRR ne sont pas automatiquement répliques. Le script <code>crrExistingObjects.js</code> (container <code>s3utils</code>) permet de les traiter :</p><pre># Replier les objets en statut PENDING (non encore répliques)\ndocker exec s3utils node crrExistingObjects.js \\\n  --target-replication-status PENDING \\\n  --workers 10 \\\n  --max-updates 10000\n\n# Cas DR Failback : re-replier les REPLICA (répliques) vers la source\ndocker exec s3utils node crrExistingObjects.js \\\n  --target-replication-status REPLICA \\\n  --force-using-configuration</pre><p>Variables importantes :</p><ul><li><code>TARGET_REPLICATION_STATUS</code> : NEW, PENDING, COMPLETED, FAILED, REPLICA</li><li><code>WORKERS</code> : parallélisme (attention a la charge sur la source)</li><li><code>KEY_MARKER</code> / <code>VERSION_ID_MARKER</code> : reprendre un traitement en cours par batch</li><li><code>FORCE_USING_CONFIGURATION</code> : force l\'utilisation de la config CRR actuelle plutot que celle dans les métadonnées de l\'objet</li></ul><h2>Pause et Resume de la CRR</h2><p>Depuis les versions 7.4.9.0 / 7.8.0.4, la réplication peut être mise en pause sans perdre les objets en queue :</p><pre># Pause : arrête l\'ingestion de nouveaux objets dans Kafka\n# (finit de traiter la queue existante)\nansible-playbook tooling-playbooks/backbeat-pause-ingestion.yml\n\n# Resume\nansible-playbook tooling-playbooks/backbeat-resume-ingestion.yml</pre><p class="alert-w"><strong>Risque Kafka :</strong> Si la pause dure plus de <strong>7 jours</strong>, les événements Kafka les plus anciens sont supprimés (retention maximale). Les objets correspondants ne seront jamais répliques automatiquement. Utiliser <code>crrExistingObjects.js</code> avec <code>TARGET_REPLICATION_STATUS=PENDING</code> pour les récupérer.</p><h2>Metriques CRR via Backbeat API</h2><table><tr><th>Metrique</th><th>Endpoint</th><th>Interpretation</th></tr><tr><td>Backlog</td><td><code>/api/metrics/crr/all/backlog</code></td><td>Nombre et taille des objets en attente de réplication (15 dernieres minutes). Si croissant : le processor n\'arrive pas a suivre.</td></tr><tr><td>Throughput</td><td><code>/api/metrics/crr/all/throughput</code></td><td>Objets/sec et bytes/sec en cours de réplication. Utile pour le dimensionnement.</td></tr><tr><td>Completions</td><td><code>/api/metrics/crr/all/completions</code></td><td>Objets répliques avec succes (15 dernieres minutes).</td></tr></table><p class="alert-i"><strong>Action obligatoire pre-upgrade vers 9.5.2 :</strong> Les buckets CRR doivent accorder la permission <code>s3:ReplicateObject</code> au rôle de réplication IAM. Sans cette permission (non vérifiée avant 9.5.2), la CRR echoue avec <code>AccessDenied</code> après l\'upgrade.</p><h2>CRR Tuning — Optimisation des Performances</h2><p>Si le backlog CRR augmente (le processor n\'arrive pas a suivre le debit d\'ingestion), plusieurs paramètres peuvent être ajustes pour accelerer la réplication.</p><h3>Principe de convergence CRR</h3><p>Pour que la CRR "converge" (rattrape son retard), le <strong>processor doit répliquer plus vite que les nouvelles versions sont ajoutées a la queue Kafka</strong>. Si ce n\'est pas le cas, le backlog grossit indefiniment.</p><table><tr><th>Paramètre</th><th>Variable</th><th>Effet</th></tr><tr><td>Nombre de workers CRR</td><td><code>env_backbeat_réplication_workers</code></td><td>Parallélisme de copie. Augmenter pour accelerer sur un réseau rapide.</td></tr><tr><td>Taille des batches Kafka</td><td><code>env_backbeat_kafka_consumer_batch_size</code></td><td>Nombre de messages consommes par cycle. Augmenter reduit le overhead Kafka.</td></tr><tr><td>Concurrence par worker</td><td><code>env_backbeat_réplication_concurrency</code></td><td>Requêtes simultanées par worker. Utile si la latence réseau inter-sites est élevée.</td></tr></table><p class="alert-i"><strong>Après chaque modification :</strong> Monitorer le backlog via <code>/api/metrics/crr/all/backlog</code>. Si le backlog diminue, le tuning est efficace. Si le backlog continue de croitre malgre le tuning, investiguer la bande passante réseau inter-sites.</p><h2>TLS pour CRR</h2><p>La réplication CRR entre deux clusters peut être sécurisée par TLS mutuel (mTLS) pour authentifier les deux sites l\'un envers l\'autre.</p><h3>Certificats CRR</h3><table><tr><th>Fichier</th><th>Emplacement</th><th>Rôle</th></tr><tr><td><code>backbeat.crt</code></td><td><code>/scality/ssd*1/s3/scality-frontend-s3/certs/</code></td><td>Certificat public du site pour la CRR</td></tr><tr><td><code>backbeat.key</code></td><td>Même repertoire</td><td>Clé privée du site pour la CRR</td></tr><tr><td><code>backbeat-client.crt</code></td><td>Même repertoire (optionnel)</td><td>Certificat client pour authentification mutuelle</td></tr></table><pre># Vérifier les certificats CRR sur tous les nœuds stateful\nANSIBLE -i $INVENTORY -m shell \\\n  -a "ls -la /scality/ssd*1/s3/scality-frontend-s3/certs/backbeat*" \\\n  runners_metadata\n\n# Vérifier que le container backbeat tourne\nctrctl ps | grep scality-backbeat | grep -v scality-backbeat-queue</pre><div class="kbox"><h3>Points Clés a Retenir</h3><ul><li>CRR = réplication ASYNCHRONE via Backbeat (Queue Populator → Kafka → Queue Processor)</li><li>Site-level (echo) = réplication automatique de tous les buckets, incompatible Object Lock</li><li>Bucket-level = configuration explicite par bucket, compatible Object Lock</li><li>Kafka retention = 7 jours : une indisponibilite >7j nécessite crrExistingObjects.js</li><li>crrExistingObjects.js : outil pour replier les objets existants (PENDING, FAILED, REPLICA pour failback DR)</li><li>s3:ReplicateObject obligatoire depuis 9.5.2 dans les policies IAM CRR</li><li>Metriques CRR : backlog, throughput, completions via Backbeat API</li></ul></div>',
quiz:[
  {q:"Que signifie CRR ?",opts:["Cross-Ring Réplication","Cross-Region Réplication","Clustered Redundancy Réplication","Continuous Real-time Réplication"],ans:1,expl:"CRR = Cross-Region Réplication. Réplique de manière asynchrone les objets S3 entre deux sites ou buckets distincts, orchestrée par Backbeat."},
  {q:"Quel composant orchestre la réplication CRR ?",opts:["Cloudserver","Vault","Backbeat","membershipd"],ans:2,expl:"Backbeat est le moteur de réplication asynchrone. Il consomme les événements de création/modification d'objets depuis Kafka et les réplique vers le site ou bucket destination."},
  {q:"Quel système de messagerie Backbeat utilise-t-il pour la queue des tâches CRR ?",opts:["RabbitMQ","Redis","Kafka","ZooKeeper"],ans:2,expl:"Backbeat utilisé Kafka comme bus de messages pour mettre en queue les tâches de réplication. Kafka garantit la persistance et l'ordre des messages même en cas de panne."},
  {q:"Quelle est la différence entre site-level CRR et bucket-level CRR ?",opts:["Il n'y a pas de différence","Site-level réplique tout le site, bucket-level permet de choisir des buckets spécifiques","Bucket-level est synchrone, site-level est asynchrone","Site-level est plus rapide"],ans:1,expl:"Site-level CRR configuré la réplication pour tous les buckets d'un site vers un autre. Bucket-level CRR permet une granularité fine : choisir quels buckets sont répliqués et vers quelle destination."},
  {q:"Peut-on répliquer des objets existants lors de la mise en place de CRR ?",opts:["Non, CRR ne concerne que les nouveaux objets","Oui, via un mécanisme de backfill/rattrapage des objets existants","Oui, mais seulement les 7 derniers jours","Non, il faut re-uploader les objets"],ans:1,expl:"Backbeat dispose d'un mécanisme de rattrapage pour répliquer les objets existants lors de l'activation de CRR. Ce backfill est configurable et peut être limité à certaines dates ou préfixes."},
  {q:"Que se passe-t-il si CRR est en pause et que des objets sont écrits sur le site source ?",opts:["Les objets sont perdus","Les objets sont stockés localement et répliqués quand CRR reprend via la queue Kafka","Les écritures sont rejetées","Les objets sont répliqués synchroniquement en fallback"],ans:1,expl:"Kafka persiste les événements de réplication même si Backbeat est en pause. À la reprise, Backbeat consomme la queue et réplique les objets écrits pendant la pause."},
  {q:"Quel est le rôle de ZooKeeper dans l'architecture Backbeat/CRR ?",opts:["Stocker les objets répliqués","Coordination distribuée : découverte de services, gestion de configuration pour Kafka et Backbeat","Surveiller les métriques de réplication","Gérer les credentials de réplication"],ans:1,expl:"ZooKeeper est utilisé par Kafka (et Backbeat) pour la coordination distribuée : élection de leader pour les partitions Kafka, découverte de services et gestion de configuration distribuée."},
  {q:"Comment surveiller le lag de réplication CRR ?",opts:["Via ringsh replicationStatus","Via les métriques Backbeat dans Grafana (queue depth, réplication lag, bytes pending)","Via nodeStatus","Il n'y a pas de métrique de lag CRR"],ans:1,expl:"Backbeat expose des métriques de réplication accessibles via Prometheus/Grafana : profondeur de queue, lag en temps, bytes en attente. Ces indicateurs permettent de détecter un retard anormal."},
  {q:"Un opérateur observe que le lag CRR augmente progressivement depuis 2 heures. Quelle est la cause la plus probable et l'action à entreprendre ?",opts:["Le site destination est tombé : vérifier sa disponibilité","Le débit réseau inter-sites est insuffisant ou Backbeat manque de ressources : vérifier la bande passante, les métriques Backbeat et augmenter les workers si nécessaire","Kafka est plein : supprimer les messages anciens","CRR doit être redémarré manuellement toutes les 2 heures"],ans:1,expl:"Un lag croissant indique que la production d'événements dépasse la capacité de traitement. Causes possibles : bande passante inter-sites saturée, Backbeat sous-dimensionné (trop peu de workers), ou site destination lent. L'action : identifier le goulot via les métriques Backbeat et augmenter les ressources ou la bande passante."},
  {q:"Pourquoi CRR est-il asynchrone plutôt que synchrone dans l'architecture Scality ?",opts:["Scality n'a pas réussi à implémenter la réplication synchrone","La réplication synchrone impose d'attendre la confirmation du site distant pour chaque écriture, augmentant massivement la latence et rendant les écritures dépendantes de la connectivité inter-sites","La réplication asynchrone est moins fiable","La réplication synchrone est réservée aux architectures stretched"],ans:1,expl:"La réplication synchrone double (ou plus) la latence d'écriture car il faut attendre la confirmation du site distant. Sur des liens WAN avec 10-50ms de latence, cela dégraderait fortement les performances. CRR asynchrone découple la performance locale de la disponibilité du lien inter-sites, au prix d'un RPO non nul."}
],
title_en:'CRR — Multi-Site Replication',
desc_en:'Cross-Region Replication: Backbeat, Kafka, ZooKeeper, site-level vs bucket-level, existing objects, pause/resume',
content_en:'<h2>CRR — Cross-Region Replication</h2><p>The <strong>Cross-Region Replication (CRR)</strong> is Scality\'s mechanism for <strong>asynchronously</strong> replicating S3 objects from a source cluster to a destination cluster. It is implemented by <strong>Backbeat</strong>, the asynchronous workflow engine of the S3 Connector.</p><h3>CRR Pipeline Architecture</h3><div class="adiag">SOURCE CLUSTER                          DESTINATION CLUSTER\n\n  S3 Client\n     | PUT object\n     v\n [Cloudserver]                          [Cloudserver]\n     | writes metadata                       |\n     v                                        |\n  [repd]  --&gt; Raft journal                   |\n     |                                        |\n     v                                        |\n [Backbeat Queue Populator]                   |\n     | detects new objects                    |\n     | publishes to Kafka                     |\n     v                                        |\n   [Kafka]  topic: backbeat-replication       |\n     |                                        |\n     v                                        |\n [Backbeat Queue Processor]                   |\n     | reads Kafka events                     |\n     | reads object from source Sproxyd       |\n     | writes object to destination Sproxyd   |\n     +-----&gt; PUT object ----------------------+\n     | writes CRR status to source repd       |\n     v                                        |\n  Status: COMPLETED                      [repd destination]</div><h3>Site-Level vs Bucket-Level CRR</h3><table><tr><th>Mode</th><th>Description</th><th>Use Case</th><th>Constraints</th></tr><tr><td><strong>Bucket-Level CRR</strong></td><td>Explicit per-bucket configuration: the admin enables replication bucket by bucket with a JSON IAM policy.</td><td>Selective replication, Object Lock, granular CRR.</td><td>Each bucket must be configured independently. Compatible with Object Lock.</td></tr><tr><td><strong>Site-Level CRR (Echo Mode)</strong></td><td>Automatic "echo" mode: every bucket created on the source is automatically replicated to the destination. Backbeat configures IAM policies automatically.</td><td>Full site mirror, simplified DR.</td><td><strong>Incompatible with Object Lock.</strong> No per-bucket granularity.</td></tr></table><h3>CRR Object Statuses</h3><table><tr><th>Status</th><th>Meaning</th></tr><tr><td><strong>PENDING</strong></td><td>Object waiting for replication in the Kafka queue. Not yet processed.</td></tr><tr><td><strong>PROCESSING</strong></td><td>Object being copied to the destination.</td></tr><tr><td><strong>COMPLETED</strong></td><td>Object successfully replicated to the destination cluster.</td></tr><tr><td><strong>FAILED</strong></td><td>Replication failed (network issue, destination unavailable...). Redis retains FAILED entries for retry.</td></tr><tr><td><strong>REPLICA</strong></td><td>Object that IS a replica (it is the destination). Should not be re-replicated except in DR failback scenarios.</td></tr></table><h2>Kafka and ZooKeeper in CRR</h2><p><strong>Kafka</strong> is the message queue that decouples the Queue Populator (detection) from the Queue Processor (copy). Key points:</p><ul><li>Main topic: <code>backbeat-replication</code></li><li><strong>7-day retention</strong>: if the destination cluster is unavailable for more than 7 days, Kafka drops the oldest events and those objects will never be replicated</li><li>Health check: <code>/opt/scality/s3tools/bin/backbeat-topic-info</code></li></ul><p><strong>ZooKeeper</strong> coordinates:</p><ul><li>Leader election among Backbeat workers</li><li>Kafka offset synchronization between workers</li><li>In multi-site failover: Ansible updates ZooKeeper (6 to 5 participants to restore quorum)</li></ul><h2>Replicating Existing Objects (crrExistingObjects.js)</h2><p>Objects created <strong>before</strong> a CRR policy was activated are not automatically replicated. The <code>crrExistingObjects.js</code> script (container <code>s3utils</code>) allows them to be processed:</p><pre># Replicate objects with PENDING status (not yet replicated)\ndocker exec s3utils node crrExistingObjects.js \\\n  --target-replication-status PENDING \\\n  --workers 10 \\\n  --max-updates 10000\n\n# DR Failback: re-replicate REPLICA objects back to the source\ndocker exec s3utils node crrExistingObjects.js \\\n  --target-replication-status REPLICA \\\n  --force-using-configuration</pre><p>Key variables:</p><ul><li><code>TARGET_REPLICATION_STATUS</code>: NEW, PENDING, COMPLETED, FAILED, REPLICA</li><li><code>WORKERS</code>: parallelism (be mindful of load on the source)</li><li><code>KEY_MARKER</code> / <code>VERSION_ID_MARKER</code>: resume an in-progress batch processing run</li><li><code>FORCE_USING_CONFIGURATION</code>: forces use of the current CRR config rather than the one stored in the object\'s metadata</li></ul><h2>Pausing and Resuming CRR</h2><p>Since versions 7.4.9.0 / 7.8.0.4, replication can be paused without losing queued objects:</p><pre># Pause: stops ingestion of new objects into Kafka\n# (finishes processing the existing queue)\nansible-playbook tooling-playbooks/backbeat-pause-ingestion.yml\n\n# Resume\nansible-playbook tooling-playbooks/backbeat-resume-ingestion.yml</pre><p class="alert-w"><strong>Kafka Risk:</strong> If the pause lasts more than <strong>7 days</strong>, the oldest Kafka events are deleted (maximum retention). The corresponding objects will never be replicated automatically. Use <code>crrExistingObjects.js</code> with <code>TARGET_REPLICATION_STATUS=PENDING</code> to recover them.</p><h2>CRR Metrics via Backbeat API</h2><table><tr><th>Metric</th><th>Endpoint</th><th>Interpretation</th></tr><tr><td>Backlog</td><td><code>/api/metrics/crr/all/backlog</code></td><td>Number and size of objects waiting for replication (last 15 minutes). If increasing: the processor cannot keep up.</td></tr><tr><td>Throughput</td><td><code>/api/metrics/crr/all/throughput</code></td><td>Objects/sec and bytes/sec currently being replicated. Useful for sizing.</td></tr><tr><td>Completions</td><td><code>/api/metrics/crr/all/completions</code></td><td>Objects successfully replicated (last 15 minutes).</td></tr></table><p class="alert-i"><strong>Mandatory action before upgrading to 9.5.2:</strong> CRR buckets must grant the <code>s3:ReplicateObject</code> permission to the IAM replication role. Without this permission (not enforced before 9.5.2), CRR fails with <code>AccessDenied</code> after the upgrade.</p><h2>CRR Tuning — Performance Optimization</h2><p>If the CRR backlog is growing (the processor cannot keep up with the ingestion rate), several parameters can be adjusted to accelerate replication.</p><h3>CRR Convergence Principle</h3><p>For CRR to converge (catch up with its backlog), the <strong>processor must replicate faster than new versions are added to the Kafka queue</strong>. If this is not the case, the backlog grows indefinitely.</p><table><tr><th>Parameter</th><th>Variable</th><th>Effect</th></tr><tr><td>Number of CRR workers</td><td><code>env_backbeat_replication_workers</code></td><td>Copy parallelism. Increase to speed up replication on a fast network.</td></tr><tr><td>Kafka batch size</td><td><code>env_backbeat_kafka_consumer_batch_size</code></td><td>Number of messages consumed per cycle. Increasing it reduces Kafka overhead.</td></tr><tr><td>Concurrency per worker</td><td><code>env_backbeat_replication_concurrency</code></td><td>Simultaneous requests per worker. Useful when inter-site network latency is high.</td></tr></table><p class="alert-i"><strong>After each modification:</strong> Monitor the backlog via <code>/api/metrics/crr/all/backlog</code>. If the backlog decreases, the tuning is effective. If the backlog continues to grow despite tuning, investigate the inter-site network bandwidth.</p><h2>TLS for CRR</h2><p>CRR replication between two clusters can be secured with mutual TLS (mTLS) to authenticate both sites to each other.</p><h3>CRR Certificates</h3><table><tr><th>File</th><th>Location</th><th>Role</th></tr><tr><td><code>backbeat.crt</code></td><td><code>/scality/ssd*1/s3/scality-frontend-s3/certs/</code></td><td>Site\'s public certificate for CRR</td></tr><tr><td><code>backbeat.key</code></td><td>Same directory</td><td>Site\'s private key for CRR</td></tr><tr><td><code>backbeat-client.crt</code></td><td>Same directory (optional)</td><td>Client certificate for mutual authentication</td></tr></table><pre># Verify CRR certificates on all stateful nodes\nANSIBLE -i $INVENTORY -m shell \\\n  -a "ls -la /scality/ssd*1/s3/scality-frontend-s3/certs/backbeat*" \\\n  runners_metadata\n\n# Verify that the backbeat container is running\nctrctl ps | grep scality-backbeat | grep -v scality-backbeat-queue</pre><div class="kbox"><h3>Key Takeaways</h3><ul><li>CRR = ASYNCHRONOUS replication via Backbeat (Queue Populator &gt; Kafka &gt; Queue Processor)</li><li>Site-level (echo) = automatic replication of all buckets, incompatible with Object Lock</li><li>Bucket-level = explicit per-bucket configuration, compatible with Object Lock</li><li>Kafka retention = 7 days: unavailability over 7 days requires crrExistingObjects.js</li><li>crrExistingObjects.js: tool for replicating existing objects (PENDING, FAILED, REPLICA for DR failback)</li><li>s3:ReplicateObject required since 9.5.2 in CRR IAM policies</li><li>CRR metrics: backlog, throughput, completions via Backbeat API</li></ul></div>',
quiz_en:[
  {q:"What does CRR stand for?",opts:["Cross-Ring Replication","Cross-Region Replication","Clustered Redundancy Replication","Continuous Real-time Replication"],ans:1,expl:"CRR = Cross-Region Replication. It asynchronously replicates S3 objects between two distinct sites or buckets, orchestrated by Backbeat."},
  {q:"Which component orchestrates CRR replication?",opts:["Cloudserver","Vault","Backbeat","membershipd"],ans:2,expl:"Backbeat is the asynchronous replication engine. It consumes object creation/modification events from Kafka and replicates them to the destination site or bucket."},
  {q:"Which messaging system does Backbeat use for the CRR task queue?",opts:["RabbitMQ","Redis","Kafka","ZooKeeper"],ans:2,expl:"Backbeat uses Kafka as its message bus to queue replication tasks. Kafka guarantees message persistence and ordering even in the event of a failure."},
  {q:"What is the difference between site-level CRR and bucket-level CRR?",opts:["There is no difference","Site-level replicates the entire site, bucket-level allows specific buckets to be chosen","Bucket-level is synchronous, site-level is asynchronous","Site-level is faster"],ans:1,expl:"Site-level CRR configures replication for all buckets on a site to another site. Bucket-level CRR provides fine granularity: choose which buckets are replicated and to which destination."},
  {q:"Can existing objects be replicated when CRR is set up?",opts:["No, CRR only applies to new objects","Yes, via a backfill/catch-up mechanism for existing objects","Yes, but only for the last 7 days","No, objects must be re-uploaded"],ans:1,expl:"Backbeat provides a catch-up mechanism to replicate existing objects when CRR is activated. This backfill is configurable and can be scoped to certain dates or prefixes."},
  {q:"What happens if CRR is paused and objects are written to the source site?",opts:["The objects are lost","Objects are stored locally and replicated when CRR resumes via the Kafka queue","Writes are rejected","Objects are replicated synchronously as a fallback"],ans:1,expl:"Kafka persists replication events even when Backbeat is paused. On resume, Backbeat consumes the queue and replicates objects written during the pause."},
  {q:"What is the role of ZooKeeper in the Backbeat/CRR architecture?",opts:["Storing replicated objects","Distributed coordination: service discovery, configuration management for Kafka and Backbeat","Monitoring replication metrics","Managing replication credentials"],ans:1,expl:"ZooKeeper is used by Kafka (and Backbeat) for distributed coordination: leader election for Kafka partitions, service discovery, and distributed configuration management."},
  {q:"How is CRR replication lag monitored?",opts:["Via ringsh replicationStatus","Via Backbeat metrics in Grafana (queue depth, replication lag, bytes pending)","Via nodeStatus","There is no CRR lag metric"],ans:1,expl:"Backbeat exposes replication metrics accessible via Prometheus/Grafana: queue depth, time lag, bytes pending. These indicators allow detection of abnormal delays."},
  {q:"An operator observes the CRR lag increasing steadily for 2 hours. What is the most likely cause and the action to take?",opts:["The destination site is down: check its availability","Inter-site network bandwidth is insufficient or Backbeat lacks resources: check bandwidth, Backbeat metrics, and increase workers if needed","Kafka is full: delete old messages","CRR must be restarted manually every 2 hours"],ans:1,expl:"A growing lag indicates that event production exceeds processing capacity. Possible causes: saturated inter-site bandwidth, an under-dimensioned Backbeat (too few workers), or a slow destination site. The action: identify the bottleneck via Backbeat metrics and increase resources or bandwidth."},
  {q:"Why is CRR asynchronous rather than synchronous in the Scality architecture?",opts:["Scality was unable to implement synchronous replication","Synchronous replication requires waiting for confirmation from the remote site for every write, massively increasing latency and making writes dependent on inter-site connectivity","Asynchronous replication is less reliable","Synchronous replication is reserved for stretched architectures"],ans:1,expl:"Synchronous replication doubles (or more) write latency because confirmation from the remote site must be awaited. On WAN links with 10-50ms latency, this would severely degrade performance. Asynchronous CRR decouples local performance from inter-site link availability, at the cost of a non-zero RPO."}
]}

{id:'15',num:'15',title:'SSE et Object Lock (WORM)',desc:'Chiffrement côté serveur : KMS interne, KMIP, AWS KMS. Object Lock Governance vs Compliance, contraintes CRR',
content:'<h2>SSE — Server-Side Encryption</h2><p>Le <strong>Server-Side Encryption (SSE)</strong> chiffré les objets au moment de leur stockage dans le RING. Le client envoie les données en clair (ou via TLS), Scality les chiffré avant de les écrire sur disque. Le chiffrement est transparent pour le client S3.</p><h3>Architecture : Chiffrement Enveloppe</h3><div class="adiag">Principe du chiffrement enveloppe :\n\n  1. Objet a chiffrer\n         |\n         v\n  [Cloudserver]\n  - Génère une DATA KEY unique par objet (AES-256)\n  - Chiffre l\'objet avec la DATA KEY\n  - Demande au KMS de chiffrer la DATA KEY avec la MASTER KEY\n         |\n         v\n  [KMS (interne ou externe)]\n  - Retourne la DATA KEY chiffrée (ne voit jamais l\'objet)\n         |\n         v\n  Stockage dans le RING :\n  - Objet chiffré (dans les fichiers DAT biziod)\n  - DATA KEY chiffrée (dans les métadonnées repd)\n  - MASTER KEY ID (référence vers le KMS)\n\nPour dechiffrer :\n  - Cloudserver récupère la data key chiffrée depuis repd\n  - Le KMS dechiffre la data key avec la master key\n  - Cloudserver dechiffre l\'objet avec la data key\n  -> L\'objet en clair est retourne au client</div><h3>Types de KMS supportes</h3><table><tr><th>Type</th><th>Description</th><th>Production ?</th></tr><tr><td><strong>KMS Interne Scality</strong></td><td>Master key stockée dans les métadonnées Scality. Simple a déployer.</td><td>NON recommande en production — la master key est dans le même système que les données.</td></tr><tr><td><strong>AWS KMS (API)</strong></td><td>Utilisé l\'API AWS KMS pour générer et gérer les master keys. Nécessite une connexion vers AWS.</td><td>Oui — pour les environnements cloud hybrides.</td></tr><tr><td><strong>KMIP externe (cluster HA)</strong></td><td>Protocole standard Key Management Interoperability Protocol. Compatible : Thales CipherTrust, HashiCorp Vault, Hytrust KeyControl. Cluster HA depuis 9.5.0.</td><td>Oui — recommande en production on-premise.</td></tr></table><h3>Modes de configuration SSE</h3><p><strong>Chiffrement global</strong> : la variable <code>global_encryption_enabled: true</code> force AES-256 sur tous les nouveaux buckets. Les anciens buckets non chiffrés ne sont pas affectes.</p><p><strong>Clé par compte vs par bucket</strong> : <code>env_default_encryption_key_per_account: true</code> associé une seule master key par compte (AWS KMS uniquement), simplifiant la gestion lors de la suppression de comptes.</p><p><strong>Coexistence interne + externe</strong> (depuis 9.5.0) : possible d\'avoir des buckets avec KMS interne et d\'autres avec KMS externe dans le même cluster, sans migration des objets existants.</p><h3>Migration SSE</h3><p class="alert-w"><strong>Attention :</strong> Changer de KMS est une opération delicate. Les master keys actuelles doivent être disponibles dans le nouveau KMS avec les <strong>mêmes key IDs</strong>. Sinon, les données chiffrées avec les anciennes master keys deviennent inaccessibles. Procédure : exporter les master keys de l\'ancien KMS → importer dans le nouveau avec les mêmes IDs → reconfigurer Scality.</p><h2>Object Lock — WORM</h2><p>L\'<strong>Object Lock</strong> (Write Once Read Many) garantit qu\'un objet ne peut pas être modifie ou supprimé pendant une periode definie. Utilisé pour la conformite reglementaire (SEC 17a-4, CFTC, FINRA, GDPR).</p><h3>Activation et contraintes</h3><ul><li>Object Lock ne peut être active qu\'a la <strong>création du bucket</strong> (irréversible)</li><li>Le <strong>versioning est automatiquement active</strong> avec Object Lock</li><li>Incompatible avec le mode <strong>Site-Level CRR (echo)</strong></li><li>Compatible avec le mode <strong>Bucket-Level CRR</strong> (permission <code>s3:ReplicateObject</code> requise)</li></ul><h3>Modes de retention</h3><table><tr><th>Mode</th><th>Qui peut supprimer ?</th><th>Cas d\'usage</th></tr><tr><td><strong>Governance</strong></td><td>Les utilisateurs avec la permission <code>s3:BypassGovernanceRetention</code> peuvent modifier ou supprimer avant la fin de la periode. L\'admin peut également désactiver le mode.</td><td>Protection standard avec flexibilité admin. Audit, tests de conformite.</td></tr><tr><td><strong>Compliance</strong></td><td><strong>Personne</strong> ne peut supprimer ni modifier, pas même le root du compte ou l\'admin Scality, avant la fin de la periode de retention.</td><td>Conformite reglementaire stricte (finance, sante, juridique). Immuabilite totale.</td></tr></table><h3>Legal Hold</h3><p>Le <strong>Legal Hold</strong> (<code>s3:PutObjectLegalHold</code>) est un verrou indépendant de la periode de retention. Il bloqué toute suppression sans date d\'expiration — utile pour les litigations juridiques. Seul le retrait explicite du Legal Hold debloque la suppression.</p><div class="adiag">Combinaisons possibles :\n\n  Retention Governance + Legal Hold :\n    -> Suppression bloquée jusqu\'a fin retention ET retrait Legal Hold\n\n  Retention Compliance (5 ans) + Legal Hold :\n    -> Suppression impossible avant 5 ans ET retrait Legal Hold\n    -> Même le root du compte ne peut pas supprimer\n\n  Legal Hold seul (sans retention) :\n    -> Suppression bloquée jusqu\'au retrait explicite du Legal Hold\n    -> Pas de date d\'expiration automatique</div><div class="kbox"><h3>Points Clés a Retenir</h3><ul><li>SSE = chiffrement enveloppe : data key unique par objet, chiffrée par master key dans le KMS</li><li>KMS interne = non recommande en prod (master key dans le même système)</li><li>KMIP (Thales, HashiCorp Vault...) = recommande en production on-premise, cluster HA depuis 9.5.0</li><li>global_encryption_enabled: true = AES-256 sur tous les nouveaux buckets</li><li>Object Lock = activation a la création du bucket UNIQUEMENT (irréversible)</li><li>Governance = admin peut bypass ; Compliance = personne ne peut supprimer (immuabilite totale)</li><li>Legal Hold = verrou sans date, indépendant de la periode de retention</li><li>Object Lock incompatible avec Site-Level CRR (echo mode)</li></ul></div>',
quiz:[
  {q:"Que signifie SSE dans le contexte S3 ?",opts:["Secure Storage Engine","Server-Side Encryption : chiffrement des objets effectué par le serveur","Simple Storage Extension","Scality Security Engine"],ans:1,expl:"SSE (Server-Side Encryption) signifie que le chiffrement est effectué côté serveur avant d'écrire l'objet sur disque. Le client envoie des données en clair, le serveur chiffré."},
  {q:"Quels modes de gestion de clés SSE Scality supporte-t-il ?",opts:["KMS interne uniquement","KMS interne, KMIP (KMS externe), AWS KMS","SSL/TLS uniquement","AES-256 uniquement"],ans:1,expl:"Scality supporte 3 modes : KMS interne (Vault gère les clés), KMIP (intégration KMS externe comme Thales ou HashiCorp), et AWS KMS (pour les environnements hybrides AWS)."},
  {q:"Quelle est la différence entre Object Lock Governance et Compliance mode ?",opts:["Pas de différence","Governance : un admin peut supprimer le verrou. Compliance : personne ne peut supprimer l'objet avant l'expiration, même l'admin root","Compliance est pour les gouvernements uniquement","Governance est plus strict que Compliance"],ans:1,expl:"En Governance mode, un utilisateur avec permission spéciale peut supprimer le verrou. En Compliance mode, l'objet est inviolable jusqu'à expiration même pour root/admin. Compliance = WORM strict."},
  {q:"Qu'est-ce que UTAPI ?",opts:["Universal Transaction API","Usage Tracking API : collecte les métriques d'utilisation S3 par bucket/utilisateur","Unified Tenant Access Policy Interface","Update Transaction And Protocol Interface"],ans:1,expl:"UTAPI (Usage Tracking API) collecte et expose les métriques d'utilisation : octets stockés, nombre d'objets, requêtes, bande passante — par bucket et par utilisateur. Utilisé pour la facturation."},
  {q:"Qu'est-ce que le SUR ?",opts:["Scality Upgrade Ratio","Storage Utilization Ratio : taux d'utilisation de l'espace brut tenant compte de l'overhead ARC/réplication","Seuil d'Utilisation du Ring","Supervised Update Ratio"],ans:1,expl:"SUR = Storage Utilization Ratio. Mesure l'efficacité de l'utilisation de l'espace brut en tenant compte de l'overhead du schéma de protection (ARC ou réplication). Indicateur clé du dimensionnement."},
  {q:"Peut-on combiner CRR et Object Lock (WORM) ?",opts:["Non, incompatibles","Oui, mais avec des contraintes : le bucket destination doit aussi avoir Object Lock activé","Oui, sans contrainte","Non, CRR ne fonctionne qu'avec des objets non protégés"],ans:1,expl:"CRR et Object Lock sont compatibles mais le bucket de destination doit avoir Object Lock activé. Les métadonnées de rétention sont répliquées avec l'objet, préservant les garanties WORM sur le site destination."},
  {q:"Un client demande que ses données soient chiffrées avec une clé gérée par un HSM certifié FIPS 140-2. Quelle solution Scality utiliser ?",opts:["KMS interne Vault (simple et intégré)","KMIP avec un KMS externe certifié FIPS 140-2 (Thales, Entrust, etc.)","Chiffrement côté client uniquement","LUKS sur les disques suffit"],ans:1,expl:"KMIP permet d'intégrer un KMS externe certifié. Pour les exigences FIPS 140-2, il faut un HSM physique ou un KMS logiciel certifié, que KMIP connecte à Scality. Le KMS interne Vault n'a pas de certification FIPS 140-2."},
  {q:"Que se passe-t-il si un objet sous Object Lock Compliance atteint sa date d'expiration ?",opts:["Il est automatiquement supprimé par le ring","Il peut désormais être supprimé par l'utilisateur autorisé, mais n'est pas supprimé automatiquement sauf si une Lifecycle Policy le prévoit","Le verrou se renouvelle automatiquement","Il devient accessible en lecture seule uniquement"],ans:1,expl:"L'expiration de la période Object Lock Compliance lève le verrou WORM : l'objet peut être supprimé. Mais la suppression n'est pas automatique — il faut une action explicite ou une Lifecycle Policy configurée pour supprimer les objets expirés."}
],
title_en:'SSE and Object Lock (WORM)',
desc_en:'Server-side encryption: internal KMS, KMIP, AWS KMS. Object Lock Governance vs Compliance, CRR constraints',
content_en:'<h2>SSE — Server-Side Encryption</h2><p><strong>Server-Side Encryption (SSE)</strong> encrypts objects at the time they are stored in the RING. The client sends data in plaintext (or via TLS), and Scality encrypts it before writing it to disk. Encryption is transparent to the S3 client.</p><h3>Architecture: Envelope Encryption</h3><div class="adiag">Envelope encryption principle:\n\n  1. Object to encrypt\n         |\n         v\n  [Cloudserver]\n  - Generates a unique DATA KEY per object (AES-256)\n  - Encrypts the object with the DATA KEY\n  - Asks the KMS to encrypt the DATA KEY with the MASTER KEY\n         |\n         v\n  [KMS (internal or external)]\n  - Returns the encrypted DATA KEY (never sees the object)\n         |\n         v\n  Stored in the RING:\n  - Encrypted object (in Biziod DAT files)\n  - Encrypted DATA KEY (in repd metadata)\n  - MASTER KEY ID (reference to the KMS)\n\nTo decrypt:\n  - Cloudserver retrieves the encrypted data key from repd\n  - The KMS decrypts the data key with the master key\n  - Cloudserver decrypts the object with the data key\n  -&gt; The plaintext object is returned to the client</div><h3>Supported KMS Types</h3><table><tr><th>Type</th><th>Description</th><th>Production?</th></tr><tr><td><strong>Scality Internal KMS</strong></td><td>Master key stored in Scality metadata. Easy to deploy.</td><td>NOT recommended in production — the master key is in the same system as the data.</td></tr><tr><td><strong>AWS KMS (API)</strong></td><td>Uses the AWS KMS API to generate and manage master keys. Requires connectivity to AWS.</td><td>Yes — for hybrid cloud environments.</td></tr><tr><td><strong>External KMIP (HA cluster)</strong></td><td>Standard Key Management Interoperability Protocol. Compatible with: Thales CipherTrust, HashiCorp Vault, Hytrust KeyControl. HA cluster support since 9.5.0.</td><td>Yes — recommended for on-premise production environments.</td></tr></table><h3>SSE Configuration Modes</h3><p><strong>Global encryption</strong>: the <code>global_encryption_enabled: true</code> variable enforces AES-256 on all new buckets. Existing unencrypted buckets are not affected.</p><p><strong>Key per account vs per bucket</strong>: <code>env_default_encryption_key_per_account: true</code> associates a single master key per account (AWS KMS only), simplifying management when accounts are deleted.</p><p><strong>Internal + external coexistence</strong> (since 9.5.0): it is possible to have buckets with internal KMS and others with external KMS in the same cluster, without migrating existing objects.</p><h3>SSE Migration</h3><p class="alert-w"><strong>Warning:</strong> Changing KMS is a delicate operation. The current master keys must be available in the new KMS with the <strong>same key IDs</strong>. Otherwise, data encrypted with the old master keys becomes inaccessible. Procedure: export master keys from the old KMS, import into the new one with the same IDs, then reconfigure Scality.</p><h2>Object Lock — WORM</h2><p><strong>Object Lock</strong> (Write Once Read Many) guarantees that an object cannot be modified or deleted during a defined period. Used for regulatory compliance (SEC 17a-4, CFTC, FINRA, GDPR).</p><h3>Activation and Constraints</h3><ul><li>Object Lock can only be enabled at <strong>bucket creation</strong> (irreversible)</li><li><strong>Versioning is automatically enabled</strong> with Object Lock</li><li>Incompatible with <strong>Site-Level CRR (echo mode)</strong></li><li>Compatible with <strong>Bucket-Level CRR</strong> (permission <code>s3:ReplicateObject</code> required)</li></ul><h3>Retention Modes</h3><table><tr><th>Mode</th><th>Who Can Delete?</th><th>Use Case</th></tr><tr><td><strong>Governance</strong></td><td>Users with the <code>s3:BypassGovernanceRetention</code> permission can modify or delete before the retention period ends. The admin can also disable the mode.</td><td>Standard protection with administrative flexibility. Auditing, compliance testing.</td></tr><tr><td><strong>Compliance</strong></td><td><strong>No one</strong> can delete or modify — not even the account root or the Scality admin — before the retention period ends.</td><td>Strict regulatory compliance (finance, healthcare, legal). Full immutability.</td></tr></table><h3>Legal Hold</h3><p>The <strong>Legal Hold</strong> (<code>s3:PutObjectLegalHold</code>) is a lock independent of the retention period. It blocks all deletion with no expiration date — useful for legal proceedings. Only an explicit removal of the Legal Hold unblocks deletion.</p><div class="adiag">Possible combinations:\n\n  Governance Retention + Legal Hold:\n    -&gt; Deletion blocked until end of retention AND Legal Hold removal\n\n  Compliance Retention (5 years) + Legal Hold:\n    -&gt; Deletion impossible before 5 years AND Legal Hold removal\n    -&gt; Even the account root cannot delete\n\n  Legal Hold alone (without retention):\n    -&gt; Deletion blocked until explicit Legal Hold removal\n    -&gt; No automatic expiration date</div><div class="kbox"><h3>Key Takeaways</h3><ul><li>SSE = envelope encryption: unique data key per object, encrypted by master key in the KMS</li><li>Internal KMS = not recommended in production (master key in the same system)</li><li>KMIP (Thales, HashiCorp Vault...) = recommended for on-premise production, HA cluster since 9.5.0</li><li>global_encryption_enabled: true = AES-256 on all new buckets</li><li>Object Lock = activation at bucket creation ONLY (irreversible)</li><li>Governance = admin can bypass; Compliance = no one can delete (full immutability)</li><li>Legal Hold = time-unlimited lock, independent of the retention period</li><li>Object Lock incompatible with Site-Level CRR (echo mode)</li></ul></div>',
quiz_en:[
  {q:"What does SSE stand for in the S3 context?",opts:["Secure Storage Engine","Server-Side Encryption: encryption of objects performed by the server","Simple Storage Extension","Scality Security Engine"],ans:1,expl:"SSE (Server-Side Encryption) means that encryption is performed server-side before writing the object to disk. The client sends data in plaintext and the server encrypts it."},
  {q:"Which SSE key management modes does Scality support?",opts:["Internal KMS only","Internal KMS, KMIP (external KMS), AWS KMS","SSL/TLS only","AES-256 only"],ans:1,expl:"Scality supports 3 modes: internal KMS (Vault manages the keys), KMIP (external KMS integration such as Thales or HashiCorp), and AWS KMS (for hybrid AWS environments)."},
  {q:"What is the difference between Object Lock Governance and Compliance mode?",opts:["No difference","Governance: an admin can remove the lock. Compliance: no one can delete the object before expiration, not even the root admin","Compliance is for governments only","Governance is stricter than Compliance"],ans:1,expl:"In Governance mode, a user with a special permission can remove the lock. In Compliance mode, the object is inviolable until expiration even for root/admin. Compliance = strict WORM."},
  {q:"What is UTAPI?",opts:["Universal Transaction API","Usage Tracking API: collects S3 usage metrics per bucket/user","Unified Tenant Access Policy Interface","Update Transaction And Protocol Interface"],ans:1,expl:"UTAPI (Usage Tracking API) collects and exposes usage metrics: bytes stored, object count, requests, bandwidth — per bucket and per user. Used for billing."},
  {q:"What is the SUR?",opts:["Scality Upgrade Ratio","Storage Utilization Ratio: raw space utilization rate accounting for ARC/replication overhead","Ring Utilization Threshold","Supervised Update Ratio"],ans:1,expl:"SUR = Storage Utilization Ratio. Measures the efficiency of raw space utilization taking into account the overhead of the protection scheme (ARC or replication). A key sizing indicator."},
  {q:"Can CRR and Object Lock (WORM) be combined?",opts:["No, they are incompatible","Yes, but with constraints: the destination bucket must also have Object Lock enabled","Yes, with no constraints","No, CRR only works with unprotected objects"],ans:1,expl:"CRR and Object Lock are compatible but the destination bucket must have Object Lock enabled. Retention metadata is replicated with the object, preserving WORM guarantees on the destination site."},
  {q:"A customer requires their data to be encrypted with a key managed by a FIPS 140-2 certified HSM. Which Scality solution should be used?",opts:["Internal Vault KMS (simple and integrated)","KMIP with a FIPS 140-2 certified external KMS (Thales, Entrust, etc.)","Client-side encryption only","LUKS on the disks is sufficient"],ans:1,expl:"KMIP allows integration of a certified external KMS. For FIPS 140-2 requirements, a physical HSM or certified software KMS is needed, which KMIP connects to Scality. The internal Vault KMS does not hold a FIPS 140-2 certification."},
  {q:"What happens when an object under Object Lock Compliance reaches its expiration date?",opts:["It is automatically deleted by the ring","It can now be deleted by an authorized user, but is not automatically deleted unless a Lifecycle Policy is configured to do so","The lock renews automatically","It becomes read-only"],ans:1,expl:"The expiration of the Object Lock Compliance period lifts the WORM lock: the object can be deleted. However, deletion is not automatic — an explicit action or a Lifecycle Policy configured to delete expired objects is required."}
]}
