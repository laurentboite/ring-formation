  {q:"What is the main reason RING nodes require 10 Gbps network interfaces at minimum?",opts:["To comply with IEEE standards","The RING generates intense internal traffic (P2P, rebuild, balance) on top of client flows; insufficient connectivity creates a bottleneck and degrades overall performance","1 Gbps is sufficient for small clusters","For Prometheus monitoring only"],ans:1,expl:"Network traffic in a RING cluster includes: client requests (incoming/outgoing data), inter-node P2P traffic (replication, routing), and maintenance traffic (rebuild, balance). The combined total quickly exceeds 1 Gbps. 10 Gbps or more is required to absorb these flows without degradation."}
]},
{id:'19',num:'19',title:'Cartographie des Composants',desc:'Annuaire visuel de tous les composants tiers : MongoDB, Redis, Kafka, ZooKeeper, Keycloak, Loki, Fluent-bit, ClickHouse, node_exporter, NFS-Ganesha, Samba, TANG, Spark — rôle, interdépendances, impact panne',
content:'<h2>Pourquoi cette cartographie ?</h2><p>Le Scality RING mobilise une vingtaine de composants tiers. Comprendre leur rôle et leurs interdependances est essentiel pour diagnostiquer rapidement une panne. Cette carte sert de référence rapide : pour chaque composant, son rôle en 2 lignes et ce qui se passe s\'il tombe.</p><h2>Architecture en couches — Vue d\'ensemble</h2><div class="adiag">CLIENTS (S3, NFS, SMB, FUSE, CDMI)\n        |\n        v\nCONNECTEURS D\'ACCES\n  S3           : Cloudserver (Node.js)    port 443\n  Objet natif  : sproxyd                 port 81 (Apache httpd) / 10000\n  Fichier Linux: NFS-Ganesha             NFSv4.0\n  Fichier Win  : Samba + CTDB            SMB 3.0\n  Local        : sfused (FUSE)           POSIX\n        |\n        v\nSTACK S3 (XDM)\n  Auth/IAM          : Vault              port 8500\n  Metadata buckets  : bucketd (LevelDB)  port 9000\n  Metadata cache    : Redis + Sentinel   port 6479\n  Metadata durable  : MongoDB ReplicaSet\n  Metadata stateful : repd (Raft)\n  Async jobs        : Backbeat -> Kafka  port 9092\n                               -> ZooKeeper port 22181\n        |\n        v\nRING CORE\n  Routage P2P  : Bizstorenode (Chord DHT)  ports 4244-4255\n  Métadonnées  : MESA (Raft interne)\n  Appartenance : membershipd\n        |\n        v\nI/O LAYER\n  Accès bas niveau : Biziod (1 par disque)\n  Index : SSD · Données : HDD containers\n  Chiffrement : LUKS + TANG/clevis (NBDE)  · KMS externe : KMIP\n\nSERVICES TRANSVERSES\n  SSO admin  : Keycloak (depuis 9.4.0)  · Sécurité : Fail2ban\n  Config     : SaltStack                · Processus : supervisord\n  Pre-deploy : Platformcheck\n\nOBSERVABILITE\n  Metriques : node_exporter -+-> MARS -> Prometheus -> Thanos -> Grafana\n  Alerting  : AlertManager (port 9093) · Legacy : Nagios\n  Logs      : Fluent-bit -> Loki -> Grafana\n  Analytics : Fluent-bit -> ClickHouse (port 8123)\n\n[Spark, Starburst, Databricks... accès via API S3 — clients externes, pas composants internes]</div><h2>Annuaire des composants tiers</h2><h3>Stockage et métadonnées</h3><table><tr><th>Composant</th><th>Rôle dans le RING</th><th>Si tombe</th></tr><tr><td><strong>MongoDB</strong><br>(ReplicaSet)</td><td>Source de verite des métadonnées S3 : liste objets, ACL, versioning, tags. Chaque écriture S3 crée/modifie une entrée MongoDB.</td><td>Écritures S3 et LIST echouent. sproxyd seul continue mais objets orphelins dans S3.</td></tr><tr><td><strong>Redis + Sentinel</strong></td><td>Cache des métadonnées S3 chaudes. Sentinel assuré la HA Redis (1 master + 2 replicas).</td><td>Redis tombe : MongoDB prend la charge (perf dégradée). Quorum Sentinel perdu : plus de HA Redis.</td></tr><tr><td><strong>LevelDB</strong></td><td>Store cle-valeur embarque (Google) utilisé par bucketd et repd localement sur chaque nœud.</td><td>LevelDB corrompu : métadonnées locales perdues. Reconstruction possible depuis autres nœuds via Raft.</td></tr></table><h3>Messagerie et réplication asynchrone</h3><table><tr><th>Composant</th><th>Rôle</th><th>Si tombe</th></tr><tr><td><strong>Kafka</strong><br>(port 9092)</td><td>Bus de messages durables pour Backbeat. Chaque événement S3 publie dans Kafka. Backbeat consomme pour CRR, Lifecycle.</td><td>Queue CRR pausée. A la reprise, Kafka rejoue la queue. Pas de perte si Kafka est HA.</td></tr><tr><td><strong>ZooKeeper</strong><br>(port 22181)</td><td>Coordination Kafka : election leaders partitions, registre brokers. État partage Backbeat.</td><td>Kafka se fige si quorum ZK perdu. CRR/Lifecycle bloqués.</td></tr></table><h3>Accès fichier</h3><table><tr><th>Composant</th><th>Rôle</th><th>Si tombe</th></tr><tr><td><strong>NFS-Ganesha</strong></td><td>Serveur NFS userspace (NFSv4.0). Avantage vs kernel NFS : crash isole (pas de kernel panic), mise a jour sans recompilation noyau.</td><td>Clients NFS v4.0 perdent l\'accès. Données RING non affectées. Redémarrage service suffit.</td></tr><tr><td><strong>Samba / SerNet-Samba</strong></td><td>SMB 3.0 pour clients Windows. SerNet = distribution enterprise de Samba. <code>vfs objects = ring</code> doit être en première position.</td><td>smbd tombe : clients Windows perdent accès. CTDB redistribue les VIPs.</td></tr><tr><td><strong>CTDB</strong></td><td>Partage sessions SMB entre nœuds Samba. Gère les VIPs (IP virtuelles) pour failover SMB transparent (~30s).</td><td>Quorum CTDB perdu : arrêt Samba sur tous les nœuds du cluster.</td></tr><tr><td><strong>Apache httpd</strong></td><td>Frontend HTTP de sproxyd sur port 81. Forward les requêtes vers le daemon sproxyd (port 10000) via FastCGI. Gère TLS et logs d\'accès.</td><td>httpd tombe : PUT/GET via sproxyd impossibles (port 81 injoignable).</td></tr></table><h3>Sécurité et chiffrement</h3><table><tr><th>Composant</th><th>Rôle</th><th>Si tombe</th></tr><tr><td><strong>Keycloak</strong><br>(depuis 9.4.0)</td><td>SSO des interfaces d\'administration (Supervisor, Grafana). Protocoles SAML 2.0 et OIDC. Extensions Scality disponibles sur GitHub.</td><td>Accès Supervisor/Grafana via SSO impossible. Opérations S3 API non impactées (Vault est indépendant).</td></tr><tr><td><strong>TANG + clevis</strong></td><td>TANG = serveur NBDE fournissant la clé de dechiffrement LUKS au boot. clevis = client sur le nœud. Dechiffrement automatique si TANG accessible sur le réseau.</td><td>TANG inaccessible au boot : disques LUKS ne s\'ouvrent pas automatiquement. Passphrase de secours (hors-ligne) requise.</td></tr></table><h3>Observabilite</h3><table><tr><th>Composant</th><th>Rôle</th><th>Si tombe</th></tr><tr><td><strong>node_exporter</strong></td><td>Agent Prometheus par nœud : metriques OS (CPU, RAM, disques, réseau). Un agent par serveur physique.</td><td>Prometheus perd metriques OS ce nœud. Aucun impact service RING.</td></tr><tr><td><strong>MARS</strong></td><td>Composant interne Scality collectant les alarmes RING internes (biziod, bizstorenode) et les exposant au format Prometheus.</td><td>Prometheus perd metriques applicatives RING pour ce nœud. Metriques OS via node_exporter continuent.</td></tr><tr><td><strong>Fluent-bit</strong></td><td>Agent léger de collecte de logs (&lt; 1 MB RAM) par nœud. Forward vers Loki (centralisation) et ClickHouse (analytics S3).</td><td>Logs du nœud non centralises, accessibles localement. Aucun impact service RING.</td></tr><tr><td><strong>Loki</strong></td><td>Centralisation et indexation des logs (Grafana Labs). Indexe seulement les labels (pas le contenu) — moins gourmand qu\'Elasticsearch.</td><td>Logs inaccessibles depuis Grafana, presents localement. Aucun impact service RING.</td></tr><tr><td><strong>ClickHouse</strong><br>(port 8123)</td><td>Base analytique colonnaire hautes performances. Reçoit les logs d\'accès S3 via Fluent-bit. Remplace Elasticsearch (supprimé en 9.5.0).</td><td>S3 Analytics indisponible. Logs bufferises par Fluent-bit. Aucun impact opérations S3.</td></tr><tr><td><strong>Thanos</strong><br>(ports 11902-11905)</td><td>Extension Prometheus pour stockage long terme et agrégation multi-cluster. Thanos Query agrege les metriques de plusieurs shards Prometheus.</td><td>Metriques historiques inaccessibles dans Grafana. Données temps reel via Prometheus direct toujours disponibles.</td></tr></table><h3>Note sur Apache Spark</h3><div class="alert alert-i"><strong>Apache Spark n\'est PAS un composant interne du RING.</strong> Spark accède au RING via l\'API S3 standard comme n\'importe quel client. Le RING est le storage layer, Spark est le compute layer — séparation stricte. Usage : data lake analytics, ML, ETL batch sur objets stockés dans le RING.</div><div class="kbox"><h3>Points Clés a Retenir</h3><ul><li>MongoDB = source de verite métadonnées S3 ; Redis = cache (HA via Sentinel)</li><li>Kafka + ZooKeeper = messaging asynchrone pour Backbeat/CRR</li><li>Keycloak = SSO admin interfaces ; Vault = IAM S3 (access keys) — deux systèmes distincts</li><li>LUKS+TANG+clevis = dechiffrement automatique ; TANG inaccessible = passphrase manuelle au boot</li><li>node_exporter = metriques OS ; MARS = metriques internes RING ; les deux alimentent Prometheus</li><li>Fluent-bit -> Loki (logs) + ClickHouse (analytics S3) via même agent léger</li><li>Thanos = extension Prometheus long terme et multi-cluster</li><li>Spark = client S3 externe, PAS un composant interne RING</li></ul></div>',
quiz:[
  {q:"Si Keycloak tombe, quel service S3 est affecté ?",opts:["Les opérations S3 API (PUT/GET d'objets)","L'authentification des administrateurs au Supervisor et Grafana","L'authentification S3 via access key/secret (Vault)","La réplication CRR Backbeat"],ans:1,expl:"Keycloak gère le SSO des interfaces d'administration (Supervisor, Grafana). L'authentification S3 via access key/secret key est gérée par Vault, indépendamment de Keycloak."},
  {q:"Quelle est la différence entre MongoDB et Redis dans la stack S3 ?",opts:["MongoDB est le cache, Redis est la source de vérité","MongoDB est la source de vérité durable des métadonnées, Redis est un cache en mémoire pour les lectures fréquentes","Ils ont le même rôle mais Redis est plus rapide","MongoDB est pour les données, Redis pour les métadonnées"],ans:1,expl:"MongoDB stocké de façon durable toutes les métadonnées S3 (liste objets, ACL, versioning). Redis+Sentinel est un cache des métadonnées chaudes accélérant les lectures. Si Redis tombe, MongoDB prend la charge directement."},
  {q:"ZooKeeper tombe — qu'est-ce qui est impacté en premier ?",opts:["Le RING Core (Bizstorenode)","La capacité de Kafka à élire des leaders de partitions","Les opérations S3 GET directs","SaltStack ne peut plus déployer"],ans:1,expl:"ZooKeeper est utilisé par Kafka pour la coordination et l'élection des leaders de partitions. Si ZooKeeper perd le quorum, Kafka se fige et la queue CRR/Backbeat s'arrête."},
  {q:"Quelle est la différence fonctionnelle entre node_exporter et MARS ?",opts:["Ils font la même chose","node_exporter expose les métriques OS/hardware, MARS expose les métriques applicatives internes RING","MARS remplace node_exporter dans RING 9.5","node_exporter est pour les nœuds DATA, MARS pour META"],ans:1,expl:"node_exporter collecte les métriques kernel/système (CPU, RAM, disques, réseau). MARS collecte les métriques spécifiques aux composants Scality (état fragments, disques biziod, alarmes internes). Les deux alimentent Prometheus."},
  {q:"Si TANG est inaccessible au démarrage d'un nœud, que se passe-t-il ?",opts:["Le nœud démarre normalement","Les disques LUKS ne s'ouvrent pas automatiquement, une passphrase manuelle est requise","Le nœud entre en OOS automatiquement","LUKS est désactivé définitivement"],ans:1,expl:"TANG est le serveur NBDE qui fournit la clé de déchiffrement LUKS au démarrage. Si TANG est inaccessible, clevis ne peut pas obtenir la clé et les disques restent chiffrés. Une passphrase de secours (stockée hors-ligne) permet le déchiffrement manuel."},
  {q:"Pourquoi ClickHouse a-t-il remplacé Elasticsearch dans RING 9.5 ?",opts:["Elasticsearch était plus cher en licence","ClickHouse est optimisé pour les requêtes analytiques colonnaires avec moins de ressources qu'Elasticsearch","Elasticsearch ne supportait pas les logs S3","Pour réduire le nombre de composants"],ans:1,expl:"ClickHouse est une base analytique colonnaire : elle excelle sur les requêtes agrégées sur des milliards de lignes de logs. Elasticsearch est conçu pour la recherche full-text — coûteux en RAM et CPU pour ce cas d'usage analytique."},
  {q:"Quel composant collecte les logs sur chaque nœud et les forward vers Loki et ClickHouse ?",opts:["Loki","Grafana","Fluent-bit","Thanos"],ans:2,expl:"Fluent-bit est l'agent de collecte de logs léger déployé sur chaque nœud. Il forward vers Loki (centralisation) et ClickHouse (analytics S3). Rôle symétrique à node_exporter pour les métriques."},
  {q:"Apache Spark est-il un composant interne du RING ?",opts:["Oui, il gère le moteur de recherche de métadonnées","Non, Spark accède au RING via l'API S3 comme n'importe quel client","Oui, utilisé par Backbeat pour CRR","Non mais requis pour S3 Analytics"],ans:1,expl:"Spark est un moteur de traitement distribué externe. Il accède au RING via l'API S3 standard pour des workloads data lake, ML ou analytics. Le RING est le storage layer, Spark est le compute layer — séparation stricte."},
  {q:"Quelle est la chaîne complète logs dans RING 9.5 ?",opts:["node_exporter → Prometheus → Grafana","Fluent-bit → Loki → Grafana","MARS → Thanos → Grafana","AlertManager → Nagios → Grafana"],ans:1,expl:"La stack de logs est : Fluent-bit (collecte sur chaque nœud) → Loki (agrégation et indexation) → Grafana (visualisation). Grafana utilisé à la fois Prometheus (métriques) et Loki (logs) comme sources de données."},
  {q:"Si MongoDB est complètement down, que peut encore faire le service S3 ?",opts:["Rien — toutes les opérations S3 échouent","Les lectures récentes en cache Redis peuvent répondre partiellement, les écritures échouent immédiatement","Toutes les opérations S3 continuent normalement","Seul sproxyd continue pour les objets déjà connus"],ans:1,expl:"Redis cache les métadonnées chaudes. Si MongoDB est complètement down, les lectures en cache Redis peuvent encore répondre temporairement, mais les écritures (qui doivent aller dans MongoDB) échouent. Le cache expire et les lectures échouent aussi progressivement."}
],
title_en:'Component Map',
desc_en:'Visual directory of all third-party components: MongoDB, Redis, Kafka, ZooKeeper, Keycloak, Loki, Fluent-bit, ClickHouse, node_exporter, NFS-Ganesha, Samba, TANG, Spark — role, interdependencies, failure impact',
content_en:'<h2>Why this map?</h2><p>The Scality RING uses around twenty third-party components. Understanding their role and interdependencies is essential for quickly diagnosing a failure. This map serves as a quick reference: for each component, its role in 2 lines and what happens if it goes down.</p><h2>Layered Architecture — Overview</h2><div class="adiag">CLIENTS (S3, NFS, SMB, FUSE, CDMI)\n        |\n        v\nACCESS CONNECTORS\n  S3           : Cloudserver (Node.js)    port 443\n  Native object: sproxyd                 port 81 (Apache httpd) / 10000\n  Linux file   : NFS-Ganesha             NFSv4.0\n  Windows file : Samba + CTDB            SMB 3.0\n  Local        : sfused (FUSE)           POSIX\n        |\n        v\nS3 STACK (XDM)\n  Auth/IAM          : Vault              port 8500\n  Bucket metadata   : bucketd (LevelDB)  port 9000\n  Metadata cache    : Redis + Sentinel   port 6479\n  Durable metadata  : MongoDB ReplicaSet\n  Stateful metadata : repd (Raft)\n  Async jobs        : Backbeat -&gt; Kafka  port 9092\n                               -&gt; ZooKeeper port 22181\n        |\n        v\nRING CORE\n  P2P routing  : Bizstorenode (Chord DHT)  ports 4244-4255\n  Metadata     : MESA (internal Raft)\n  Membership   : membershipd\n        |\n        v\nI/O LAYER\n  Low-level access : Biziod (1 per disk)\n  Index: SSD · Data: HDD containers\n  Encryption: LUKS + TANG/clevis (NBDE)  · External KMS: KMIP\n\nCROSS-CUTTING SERVICES\n  Admin SSO  : Keycloak (since 9.4.0)  · Security: Fail2ban\n  Config     : SaltStack                · Processes: supervisord\n  Pre-deploy : Platformcheck\n\nOBSERVABILITY\n  Metrics : node_exporter -+-&gt; MARS -&gt; Prometheus -&gt; Thanos -&gt; Grafana\n  Alerting: AlertManager (port 9093) · Legacy: Nagios\n  Logs    : Fluent-bit -&gt; Loki -&gt; Grafana\n  Analytics: Fluent-bit -&gt; ClickHouse (port 8123)\n\n[Spark, Starburst, Databricks... access via S3 API — external clients, not internal components]</div><h2>Third-party component directory</h2><h3>Storage and metadata</h3><table><tr><th>Component</th><th>Role in the RING</th><th>If it goes down</th></tr><tr><td><strong>MongoDB</strong><br>(ReplicaSet)</td><td>Source of truth for S3 metadata: object list, ACLs, versioning, tags. Every S3 write creates/modifies a MongoDB entry.</td><td>S3 writes and LIST operations fail. sproxyd alone continues but objects become orphaned in S3.</td></tr><tr><td><strong>Redis + Sentinel</strong></td><td>Cache for hot S3 metadata. Sentinel provides Redis HA (1 master + 2 replicas).</td><td>Redis down: MongoDB takes the load (degraded performance). Sentinel quorum lost: no more Redis HA.</td></tr><tr><td><strong>LevelDB</strong></td><td>Embedded key-value store (Google) used by bucketd and repd locally on each node.</td><td>Corrupted LevelDB: local metadata lost. Reconstruction possible from other nodes via Raft.</td></tr></table><h3>Messaging and asynchronous replication</h3><table><tr><th>Component</th><th>Role</th><th>If it goes down</th></tr><tr><td><strong>Kafka</strong><br>(port 9092)</td><td>Durable message bus for Backbeat. Each S3 event is published to Kafka. Backbeat consumes for CRR, Lifecycle.</td><td>CRR queue paused. Upon recovery, Kafka replays the queue. No loss if Kafka is HA.</td></tr><tr><td><strong>ZooKeeper</strong><br>(port 22181)</td><td>Kafka coordination: partition leader election, broker registry. Shared Backbeat state.</td><td>Kafka freezes if ZooKeeper quorum is lost. CRR/Lifecycle blocked.</td></tr></table><h3>File access</h3><table><tr><th>Component</th><th>Role</th><th>If it goes down</th></tr><tr><td><strong>NFS-Ganesha</strong></td><td>Userspace NFS server (NFSv4.0). Advantage over kernel NFS: isolated crash (no kernel panic), updates without kernel recompilation.</td><td>NFSv4.0 clients lose access. RING data unaffected. Service restart is sufficient.</td></tr><tr><td><strong>Samba / SerNet-Samba</strong></td><td>SMB 3.0 for Windows clients. SerNet = enterprise Samba distribution. <code>vfs objects = ring</code> must be in first position.</td><td>smbd down: Windows clients lose access. CTDB redistributes VIPs.</td></tr><tr><td><strong>CTDB</strong></td><td>Shares SMB sessions between Samba nodes. Manages VIPs (virtual IPs) for transparent SMB failover (~30s).</td><td>CTDB quorum lost: Samba stops on all nodes in the cluster.</td></tr><tr><td><strong>Apache httpd</strong></td><td>HTTP frontend for sproxyd on port 81. Forwards requests to the sproxyd daemon (port 10000) via FastCGI. Handles TLS and access logs.</td><td>httpd down: PUT/GET via sproxyd impossible (port 81 unreachable).</td></tr></table><h3>Security and encryption</h3><table><tr><th>Component</th><th>Role</th><th>If it goes down</th></tr><tr><td><strong>Keycloak</strong><br>(since 9.4.0)</td><td>SSO for administration interfaces (Supervisor, Grafana). SAML 2.0 and OIDC protocols. Scality extensions available on GitHub.</td><td>Supervisor/Grafana access via SSO impossible. S3 API operations unaffected (Vault is independent).</td></tr><tr><td><strong>TANG + clevis</strong></td><td>TANG = NBDE server providing the LUKS decryption key at boot. clevis = client on the node. Automatic decryption if TANG is accessible on the network.</td><td>TANG inaccessible at boot: LUKS disks do not open automatically. Offline backup passphrase required.</td></tr></table><h3>Observability</h3><table><tr><th>Component</th><th>Role</th><th>If it goes down</th></tr><tr><td><strong>node_exporter</strong></td><td>Per-node Prometheus agent: OS metrics (CPU, RAM, disks, network). One agent per physical server.</td><td>Prometheus loses OS metrics for that node. No impact on RING service.</td></tr><tr><td><strong>MARS</strong></td><td>Internal Scality component collecting internal RING alarms (Biziod, Bizstorenode) and exposing them in Prometheus format.</td><td>Prometheus loses RING application metrics for that node. OS metrics via node_exporter continue.</td></tr><tr><td><strong>Fluent-bit</strong></td><td>Lightweight log collection agent (&lt; 1 MB RAM) per node. Forwards to Loki (centralization) and ClickHouse (S3 analytics).</td><td>Node logs not centralized, accessible locally. No impact on RING service.</td></tr><tr><td><strong>Loki</strong></td><td>Log centralization and indexing (Grafana Labs). Indexes labels only (not content) — less resource-hungry than Elasticsearch.</td><td>Logs inaccessible from Grafana, present locally. No impact on RING service.</td></tr><tr><td><strong>ClickHouse</strong><br>(port 8123)</td><td>High-performance columnar analytical database. Receives S3 access logs via Fluent-bit. Replaces Elasticsearch (removed in 9.5.0).</td><td>S3 Analytics unavailable. Logs buffered by Fluent-bit. No impact on S3 operations.</td></tr><tr><td><strong>Thanos</strong><br>(ports 11902-11905)</td><td>Prometheus extension for long-term storage and multi-cluster aggregation. Thanos Query aggregates metrics from multiple Prometheus shards.</td><td>Historical metrics inaccessible in Grafana. Real-time data via direct Prometheus still available.</td></tr></table><h3>Note on Apache Spark</h3><div class="alert alert-i"><strong>Apache Spark is NOT an internal RING component.</strong> Spark accesses the RING via the standard S3 API like any other client. The RING is the storage layer, Spark is the compute layer — strict separation. Use cases: data lake analytics, ML, batch ETL on objects stored in the RING.</div><div class="kbox"><h3>Key Takeaways</h3><ul><li>MongoDB = S3 metadata source of truth; Redis = cache (HA via Sentinel)</li><li>Kafka + ZooKeeper = asynchronous messaging for Backbeat/CRR</li><li>Keycloak = admin interface SSO; Vault = S3 IAM (access keys) — two distinct systems</li><li>LUKS+TANG+clevis = automatic decryption; TANG inaccessible = manual passphrase at boot</li><li>node_exporter = OS metrics; MARS = internal RING metrics; both feed Prometheus</li><li>Fluent-bit -&gt; Loki (logs) + ClickHouse (S3 analytics) via the same lightweight agent</li><li>Thanos = long-term and multi-cluster Prometheus extension</li><li>Spark = external S3 client, NOT an internal RING component</li></ul></div>',
quiz_en:[
  {q:"If Keycloak goes down, which S3 service is affected?",opts:["S3 API operations (PUT/GET objects)","Authentication of administrators to Supervisor and Grafana","S3 authentication via access key/secret (Vault)","CRR Backbeat replication"],ans:1,expl:"Keycloak manages SSO for administration interfaces (Supervisor, Grafana). S3 authentication via access key/secret key is handled by Vault, independently of Keycloak."},
  {q:"What is the difference between MongoDB and Redis in the S3 stack?",opts:["MongoDB is the cache, Redis is the source of truth","MongoDB is the durable source of truth for metadata, Redis is an in-memory cache for frequent reads","They have the same role but Redis is faster","MongoDB is for data, Redis for metadata"],ans:1,expl:"MongoDB durably stores all S3 metadata (object list, ACLs, versioning). Redis+Sentinel is a cache of hot metadata, accelerating reads. If Redis goes down, MongoDB takes the load directly."},
  {q:"ZooKeeper goes down — what is impacted first?",opts:["The RING Core (Bizstorenode)","Kafka's ability to elect partition leaders","Direct S3 GET operations","SaltStack can no longer deploy"],ans:1,expl:"ZooKeeper is used by Kafka for coordination and partition leader election. If ZooKeeper loses quorum, Kafka freezes and the CRR/Backbeat queue stops."},
  {q:"What is the functional difference between node_exporter and MARS?",opts:["They do the same thing","node_exporter exposes OS/hardware metrics, MARS exposes internal RING application metrics","MARS replaces node_exporter in RING 9.5","node_exporter is for DATA nodes, MARS for META nodes"],ans:1,expl:"node_exporter collects kernel/system metrics (CPU, RAM, disks, network). MARS collects metrics specific to Scality components (fragment state, Biziod disks, internal alarms). Both feed Prometheus."},
  {q:"If TANG is inaccessible at node startup, what happens?",opts:["The node starts normally","LUKS disks do not open automatically, a manual passphrase is required","The node automatically enters OOS","LUKS is permanently disabled"],ans:1,expl:"TANG is the NBDE server that provides the LUKS decryption key at startup. If TANG is inaccessible, clevis cannot obtain the key and disks remain encrypted. An offline backup passphrase allows manual decryption."},
  {q:"Why did ClickHouse replace Elasticsearch in RING 9.5?",opts:["Elasticsearch was more expensive to license","ClickHouse is optimized for columnar analytical queries with fewer resources than Elasticsearch","Elasticsearch did not support S3 logs","To reduce the number of components"],ans:1,expl:"ClickHouse is a columnar analytical database: it excels at aggregate queries over billions of log rows. Elasticsearch is designed for full-text search — expensive in RAM and CPU for this analytical use case."},
  {q:"Which component collects logs on each node and forwards them to Loki and ClickHouse?",opts:["Loki","Grafana","Fluent-bit","Thanos"],ans:2,expl:"Fluent-bit is the lightweight log collection agent deployed on each node. It forwards to Loki (centralization) and ClickHouse (S3 analytics). Its role for logs mirrors that of node_exporter for metrics."},
  {q:"Is Apache Spark an internal RING component?",opts:["Yes, it manages the metadata search engine","No, Spark accesses the RING via the S3 API like any other client","Yes, used by Backbeat for CRR","No but required for S3 Analytics"],ans:1,expl:"Spark is an external distributed processing engine. It accesses the RING via the standard S3 API for data lake, ML, or analytics workloads. The RING is the storage layer, Spark is the compute layer — strict separation."},
  {q:"What is the complete log chain in RING 9.5?",opts:["node_exporter → Prometheus → Grafana","Fluent-bit → Loki → Grafana","MARS → Thanos → Grafana","AlertManager → Nagios → Grafana"],ans:1,expl:"The log stack is: Fluent-bit (collection on each node) → Loki (aggregation and indexing) → Grafana (visualization). Grafana uses both Prometheus (metrics) and Loki (logs) as data sources."},
  {q:"If MongoDB is completely down, what can the S3 service still do?",opts:["Nothing — all S3 operations fail","Recent reads cached in Redis may respond partially; writes fail immediately","All S3 operations continue normally","Only sproxyd continues for already-known objects"],ans:1,expl:"Redis caches hot metadata. If MongoDB is completely down, reads from the Redis cache can still respond temporarily, but writes (which must go to MongoDB) fail immediately. The cache expires and reads also fail progressively."}
]}
];

var state={view:'home',tab:'theory',modIdx:0,scores:{},answers:{},lang:localStorage.getItem('ringLang')||'fr'};
try{var s=JSON.parse(localStorage.getItem('ringState')||'{}');state.scores=s.scores||{};}catch(e){}
function save(){try{localStorage.setItem('ringState',JSON.stringify({scores:state.scores}));}catch(e){}}

function goHome(){
  state.view='home';
  document.getElementById('homePage').classList.add('show');
  document.getElementById('modulePage').classList.remove('show');
  document.getElementById('glossaryPage').classList.remove('show');
  renderHome();renderSidebar();
}

function openModule(idx){
  state.view='module';state.modIdx=idx;state.tab='theory';
  if(!state.answers[MODS[idx].id])state.answers[MODS[idx].id]=new Array(MODS[idx].quiz.length).fill(-1);
  document.getElementById('homePage').classList.remove('show');
  document.getElementById('modulePage').classList.add('show');
  document.getElementById('glossaryPage').classList.remove('show');
  renderModule();renderSidebar();
  document.querySelector('#modulePage .mpbody').scrollTop=0;
}

function showTab(tab){
  state.tab=tab;
  document.getElementById('tabCours').classList.toggle('active',tab==='theory');
  document.getElementById('tabCours').textContent=L('Cours','Course');
  document.getElementById('tabQuiz').classList.toggle('active',tab==='quiz');
  document.getElementById('tabQuiz').textContent='Quiz';
  document.getElementById('theoryView').classList.toggle('show',tab==='theory');
  document.getElementById('quizView').classList.toggle('show',tab==='quiz');
  document.querySelector('#modulePage .mpbody').scrollTop=0;
}

var SIDEBAR_ORDER=['01','02','03','04','07','10','12','15','17','14','16','05','06','08','13','09','11','18','19'];
var SIDEBAR_GROUPS={'01':'Architecture RING','02':'Architecture RING','03':'Architecture RING','04':'Architecture RING','07':'Architecture RING','10':'SOFS','12':'S3 Connector','15':'S3 Connector','17':'S3 Connector','14':'CRR & Multi-site DR','16':'CRR & Multi-site DR','05':'Exploitation du RING','06':'Exploitation du RING','08':'Exploitation du RING','13':'Exploitation du RING','09':'Administration','11':'Administration','18':'Administration','19':'Composants Tiers'};


var SIDEBAR_GROUPS_EN={"Architecture RING": "RING Architecture", "SOFS": "SOFS", "S3 Connector": "S3 Connector", "CRR & Multi-site DR": "CRR & Multi-site DR", "Exploitation du RING": "RING Operations", "Administration": "Administration", "Composants Tiers": "Third-party Components"};
function L(fr,en){return state.lang==='en'?en:fr;}
function setLang(l){
  state.lang=l;
  localStorage.setItem('ringLang',l);
  document.getElementById('flagFr').classList.toggle('flag-active',l==='fr');
  document.getElementById('flagEn').classList.toggle('flag-active',l==='en');
  renderSidebar();
  if(state.view==='home')renderHome();
  else if(state.view==='module'){
    var savedTab=state.tab;
    renderModule();
    if(savedTab==='quiz')showTab('quiz');
  }
  else if(state.view==='glossary')renderGlossary();
}
function renderSidebar(){
  var nav=document.getElementById('sbNav');
  var html='';
  var lastGrp='';
  SIDEBAR_ORDER.forEach(function(id){
    var i=MODS.findIndex(function(m){return m.id===id;});
    if(i===-1)return;
    var m=MODS[i];
    var grpFr=SIDEBAR_GROUPS[id]||'';
    var grp=state.lang==='en'?(SIDEBAR_GROUPS_EN[grpFr]||grpFr):grpFr;
    if(grp!==lastGrp){lastGrp=grp;html+='<div class="nav-sec">'+grp+'</div>';}
    var sc=state.scores[m.id];
    var isDone=sc&&sc.score===sc.total;
    var isPartial=sc&&sc.score<sc.total;
    var isActive=state.view==='module'&&state.modIdx===i;
    var badge=sc?'<span class="nbadge">'+sc.score+'/'+sc.total+'</span>':'';
    var cls=['ni',isActive?'active':'',isDone?'done':'',isPartial?'partial':''].filter(Boolean).join(' ');
    html+='<div class="'+cls+'" onclick="openModule('+i+')"><span class="nid">'+m.num+'</span><span class="ntxt">'+L(m.title,m.title_en||m.title)+'</span>'+badge+'</div>';
  });
  html+='<div class="nav-sec">'+L('Référence','Reference')+'</div>';
  html+='<div class="ni'+(state.view==='glossary'?' active':'')+'" onclick="openGlossary()"><span class="nid">GL</span><span class="ntxt">'+L('Glossaire','Glossary')+'</span></div>';
  nav.innerHTML=html;
  var done=Object.keys(state.scores).length;
  var totalScore=Object.values(state.scores).reduce(function(a,b){return a+b.score;},0);
  var totalMax=Object.values(state.scores).reduce(function(a,b){return a+b.total;},0);
  var sl=document.getElementById('sbScoreLabel');if(sl)sl.textContent=L('Score Total','Total Score');
  var tv=document.getElementById('totScore');
  var ts=document.getElementById('totSub');
  if(done===0){tv.textContent='--';ts.textContent=L('Aucun module complété','No module completed');}
  else{tv.textContent=totalMax>0?Math.round(totalScore/totalMax*100)+'%':'--';ts.textContent=totalScore+'/'+totalMax+' pts · '+done+'/'+MODS.length+' modules';}
}

function renderHome(){
  var ht=document.getElementById('homeTitle');
  if(ht)ht.textContent=L('Formation Scality RING','Scality RING Training');
  var done=Object.keys(state.scores).length;
  var totalScore=Object.values(state.scores).reduce(function(a,b){return a+b.score;},0);
  var totalMax=Object.values(state.scores).reduce(function(a,b){return a+b.total;},0);
  var pct=totalMax>0?Math.round(totalScore/totalMax*100):0;
  document.getElementById('statsRow').innerHTML='<div class="stat-card"><div class="sv col-acc">'+MODS.length+'</div><div class="sl">'+L('Modules au total','Total modules')+'</div></div><div class="stat-card"><div class="sv col-ok">'+done+'</div><div class="sl">'+L('Quiz complétés','Quizzes completed')+'</div></div><div class="stat-card"><div class="sv col-info">'+pct+'%</div><div class="sl">'+L('Score moyen','Avg score')+'</div></div>';
  var grid=document.getElementById('moduleGrid');
  grid.innerHTML=MODS.map(function(m,i){
    var sc=state.scores[m.id];
    var isDone=sc&&sc.score===sc.total;
    var pct2=sc?Math.round(sc.score/sc.total*100):0;
    var pfClass=isDone?'ok':'acc';
    return '<div class="mc '+(isDone?'done':'')+'" onclick="openModule('+i+')"><div class="mid">Module '+m.num+'</div><div class="mtit">'+m.title+'</div><div class="mdesc">'+m.desc+'</div><div class="mfoot"><div class="pbar"><div class="pfill '+pfClass+'" style="width:'+pct2+'%"></div></div><span class="msc">'+(sc?sc.score+'/'+sc.total+' pts':L('Non commencé','Not started'))+'</span></div></div>';
  }).join('');
}

function renderModule(){
  var m=MODS[state.modIdx];
  document.getElementById('mpId').textContent='Module '+m.num;
  document.getElementById('mpTitle').textContent=L(m.title,m.title_en||m.title);
  document.getElementById('theoryView').innerHTML=L(m.content,m.content_en||m.content);
  document.getElementById('theoryView').classList.add('show');
  renderQuiz();
  document.getElementById('quizView').classList.remove('show');
  document.getElementById('tabCours').classList.add('active');
  document.getElementById('tabCours').textContent=L('Cours','Course');
  document.getElementById('tabQuiz').classList.remove('active');
  document.getElementById('tabQuiz').textContent='Quiz';
}

function renderQuiz(){
  var m=MODS[state.modIdx];
  var sc=state.scores[m.id];
  var quiz=L(m.quiz,m.quiz_en||m.quiz);
  var answers=state.answers[m.id]||new Array(quiz.length).fill(-1);
  var locked=!!sc;
  var html='<div class="quiz-hdr"><h2>Quiz &mdash; '+L(m.title,m.title_en||m.title)+'</h2><p>'+quiz.length+' questions &middot; '+L('Sélectionnez une réponse','Select one answer')+'</p></div>';
  var letters=['A','B','C','D'];
  quiz.forEach(function(q,qi){
    var sel=answers[qi];
    html+='<div class="qcard '+(locked&&sel!==-1?'answered':'')+'" id="qcard'+qi+'">';
    html+='<div class="qnum">Question '+(qi+1)+' / '+quiz.length+'</div>';
    html+='<div class="qtxt">'+q.q+'</div>';
    html+='<div class="opts">';
    q.opts.forEach(function(opt,oi){
      var cls='opt';
      if(locked)cls+=' locked';
      if(sel===oi){cls+=oi===q.ans?' correct':' wrong';}
      else if(locked&&oi===q.ans){cls+=' correct';}
      else if(sel===oi){cls+=' sel';}
      var click=locked?'':'onclick="selectOpt('+qi+','+oi+')"';
      html+='<div class="'+cls+'" '+click+'><span class="ol">'+letters[oi]+'</span><span>'+opt+'</span></div>';
    });
    html+='</div>';
    if(locked){html+='<div class="expl show">'+q.expl+'</div>';}
    else{html+='<div class="expl" id="expl'+qi+'"></div>';}
    html+='</div>';
  });
  html+='<div class="qa">';
  if(!locked){html+='<button class="btn btn-p" onclick="validateQuiz()">'+L('Valider le quiz','Submit quiz')+'</button><button class="btn btn-s" onclick="showTab(\'theory\')">&#8592; '+L('Retour au cours','Back to course')+'</button>';}
  html+='</div>';
  if(locked){
    var pct=Math.round(sc.score/sc.total*100);
    var cls2=pct>=80?'ex':pct>=50?'gd':'po';
    var label=pct>=80?L('Excellent !','Excellent!'):pct>=50?L('Bien !','Good!'):L('À revoir','Needs review');
    var msg=pct>=80?L('Vous maîtrisez ce module.','You have mastered this module.'):pct>=50?L('Quelques points à consolider.','A few points to reinforce.'):L('Relisez le cours avant de continuer.','Review the course before continuing.');
    var next=state.modIdx<MODS.length-1?'<button class="btn btn-ok" onclick="openModule('+(state.modIdx+1)+')">Module suivant &#8594;</button>':'<button class="btn btn-i" onclick="goHome()">'+L('Accueil','Home')+'</button>';
    html+='<div class="result-box show"><div style="font-size:13px;color:var(--t3)">Resultat</div><div class="rscore '+cls2+'">'+sc.score+'/'+sc.total+'</div><div class="rlabel">'+label+'</div><div class="rmsg">'+pct+'% de reussite &mdash; '+msg+'</div><div class="rnext"><button class="btn btn-s" onclick="resetQuiz()">'+L('Recommencer','Restart')+'</button>'+next+'</div></div>';
  }
  document.getElementById('quizView').innerHTML=html;
}

function selectOpt(qi,oi){
  var m=MODS[state.modIdx];
  if(!state.answers[m.id])state.answers[m.id]=new Array(m.quiz.length).fill(-1);
  var prev=state.answers[m.id][qi];
  if(prev!==-1){var p=document.getElementById('opt'+qi+'_'+prev);if(p)p.classList.remove('sel');}
  state.answers[m.id][qi]=oi;
  var el=document.querySelector('#qcard'+qi+' .opts .opt:nth-child('+(oi+1)+')');
  if(el)el.classList.add('sel');
}

function validateQuiz(){
  var m=MODS[state.modIdx];
  var answers=state.answers[m.id]||[];
  var score=0;
  quiz.forEach(function(q,qi){if(answers[qi]===q.ans)score++;});
  state.scores[m.id]={score:score,total:m.quiz.length};
  save();renderQuiz();renderSidebar();
}

function resetQuiz(){
  var m=MODS[state.modIdx];
  delete state.scores[m.id];
  state.answers[m.id]=new Array(m.quiz.length).fill(-1);
  save();renderQuiz();renderSidebar();
}

var GLOSSARY=[
  {term:'ARC',def:'Adaptive Ring Coding — schéma d\'erasure coding propriétaire Scality stockant des fragments de données sur plusieurs nœuds pour tolérer les pannes. Remplace la réplication classique avec une meilleure efficacité de stockage.',def_en:'Adaptive Ring Coding — Scality\'s proprietary erasure coding scheme that stores data fragments across multiple nodes to tolerate failures. Replaces classic replication with better storage efficiency.',refs:['02','04']},
  {term:'ARC_REBUILD_NOK',def:'Alarme indiquant qu\'un rebuild d\'objet en mode ARC a échoué. Le fragment corrompu ou manquant n\'a pas pu être reconstruit à partir des fragments survivants.',def_en:'Alarm indicating that an object rebuild in ARC mode has failed. The corrupted or missing fragment could not be reconstructed from the surviving fragments.',refs:['05']},
  {term:'AlertManager',def:'Composant Prometheus gérant le routage et la déduplication des alertes. Reçoit les alertes de Prometheus et les envoie vers les destinations configurées (email, PagerDuty, Slack).',def_en:'Prometheus component that handles alert routing and deduplication. Receives alerts from Prometheus and forwards them to configured destinations (email, PagerDuty, Slack).',refs:['05']},
  {term:'Backbeat',def:'Moteur de réplication asynchrone de Scality. Traite les tâches CRR, Lifecycle, Replication Metrics et autres workflows en arrière-plan via des queues Kafka.',def_en:'Scality\'s asynchronous replication engine. Processes CRR, Lifecycle, Replication Metrics, and other background workflows via Kafka queues.',refs:['14','16']},
  {term:'Balance',def:'Processus d\'équilibrage de la charge des données entre les disques et nœuds d\'un ring. Déclenché automatiquement lors de l\'ajout ou du retrait d\'un nœud.',def_en:'Process that redistributes data load evenly across the disks and nodes of a ring. Triggered automatically when a node is added or removed.',refs:['04','13']},
  {term:'Biziod',def:'Daemon d\'I/O bas niveau s\'exécutant sur chaque nœud de stockage. Gère les opérations de lecture/écriture sur les disques physiques pour le compte de sproxyd.',def_en:'Low-level I/O daemon running on each storage node. Handles read/write operations on physical disks on behalf of sproxyd.',refs:['02']},
  {term:'Bizstorenode',def:'Service regroupant biziod et les composants de stockage local sur un nœud RING. Unité de déploiement gérée par Salt pour les nœuds DATA et META.',def_en:'Service grouping Biziod and local storage components on a RING node. Deployment unit managed by Salt for DATA and META nodes.',refs:['02','09']},
  {term:'bseq',def:'Numéro de séquence de blob (blob sequence) — identifiant unique d\'une version d\'un objet sur le disque, utilisé par repd pour suivre les versions de données.',def_en:'Blob sequence number — unique identifier for a version of an object on disk, used by repd to track data versions.',refs:['02']},
  {term:'bucketd',def:'Service Scality gérant les métadonnées des buckets S3 (liste des objets, ACL, versioning). Utilise LevelDB comme backend de stockage.',def_en:'Scality service managing S3 bucket metadata (object listing, ACLs, versioning). Uses LevelDB as its storage backend.',refs:['12','15']},
  {term:'Chord',def:'Protocole d\'espace de clés distribué DHT utilisé par le RING pour répartir les objets entre nœuds selon leur hash. Détermine quels nœuds sont responsables de quels objets.',def_en:'DHT distributed keyspace protocol used by the RING to distribute objects among nodes according to their hash. Determines which nodes are responsible for which objects.',refs:['01','02']},
  {term:'Chord Purge',def:'Opération de nettoyage des entrées orphelines dans l\'espace Chord. Supprime les références à des objets qui n\'existent plus physiquement.',def_en:'Operation that cleans up orphaned entries in the Chord space. Removes references to objects that no longer exist physically.',refs:['06','13']},
  {term:'Cloudserver',def:'Implémentation Scality du protocole S3 (équivalent d\'Amazon S3). Expose une API S3 compatible et s\'appuie sur sproxyd et bucketd pour le stockage.',def_en:'Scality\'s implementation of the S3 protocol (equivalent to Amazon S3). Exposes a compatible S3 API and relies on sproxyd and bucketd for storage.',refs:['12','15','17']},
  {term:'CONF_MISMATCH',def:'Alarme signalant une incohérence de configuration entre nœuds du ring. Peut indiquer une différence de version logicielle ou de paramètre de configuration.',def_en:'Alarm signaling a configuration inconsistency between ring nodes. May indicate a difference in software version or configuration parameter.',refs:['05']},
  {term:'COS',def:'Class of Service — classe de stockage définissant les règles de protection des données (nombre de copies, schéma ARC, domaines de pannes) appliquées aux objets.',def_en:'Class of Service — storage class defining data protection rules (number of copies, ARC scheme, failure domains) applied to objects.',refs:['02','04']},
  {term:'CRR',def:'Cross-Region Replication — réplication asynchrone des objets S3 entre deux sites ou deux buckets, orchestrée par Backbeat.',def_en:'Cross-Region Replication — asynchronous replication of S3 objects between two sites or two buckets, orchestrated by Backbeat.',refs:['14','16']},
  {term:'cseq',def:'Numéro de séquence de chunk — identifiant de la version logique d\'un objet dans le ring, incrémenté à chaque mise à jour.',def_en:'Chunk sequence number — identifier for the logical version of an object in the ring, incremented with each update.',refs:['02']},
  {term:'CTDB',def:'Clustered TDB — couche de métadonnées distribuée utilisée par Samba/SOFS pour partager les informations de sessions SMB entre les nœuds du cluster.',def_en:'Clustered TDB — distributed metadata layer used by Samba/SOFS to share SMB session information across cluster nodes.',refs:['10']},
  {term:'DLM',def:'Distributed Lock Manager — gestionnaire de verrous distribués utilisé par SOFS pour coordonner les accès concurrents aux fichiers entre les nœuds du cluster.',def_en:'Distributed Lock Manager — distributed lock manager used by SOFS to coordinate concurrent file access across cluster nodes.',refs:['10']},
  {term:'Disk Orphans',def:'Objets présents physiquement sur disque mais sans référence dans les métadonnées du ring. Détectés lors d\'un Chord Purge et éligibles à la suppression.',def_en:'Objects physically present on disk but with no reference in the ring\'s metadata. Detected during a Chord Purge and eligible for deletion.',refs:['06','13']},
  {term:'Erasure Coding',def:'Technique de protection des données découpant un objet en fragments de données et de parité. Permet de reconstruire l\'objet même si certains fragments sont perdus, avec moins d\'espace que la réplication N×.',def_en:'Data protection technique that splits an object into data and parity fragments. Allows the object to be reconstructed even if some fragments are lost, using less space than N× replication.',refs:['02','04']},
  {term:'Fail2ban',def:'Outil de sécurité analysant les logs pour détecter et bloquer automatiquement les adresses IP effectuant des tentatives d\'intrusion répétées.',def_en:'Security tool that analyzes logs to automatically detect and block IP addresses making repeated intrusion attempts.',refs:['11']},
  {term:'Failure Domain',def:'Unité de panne indépendante (nœud, rack, datacenter) utilisée par le COS pour garantir que les fragments d\'un même objet sont distribués sur des domaines distincts.',def_en:'Independent failure unit (node, rack, datacenter) used by COS to ensure that fragments of the same object are distributed across distinct domains.',refs:['02','04']},
  {term:'FUSE',def:'Filesystem in Userspace — interface noyau Linux permettant à sfused d\'exposer le système de fichiers SOFS en espace utilisateur sans module noyau dédié.',def_en:'Filesystem in Userspace — Linux kernel interface allowing sfused to expose the SOFS filesystem in user space without a dedicated kernel module.',refs:['10']},
  {term:'GC',def:'Garbage Collector — processus de nettoyage supprimant les objets supprimés ou les versions obsolètes qui ne sont plus référencés dans les métadonnées.',def_en:'Garbage Collector — cleanup process that removes deleted objects or obsolete versions that are no longer referenced in the metadata.',refs:['06','13']},
  {term:'Grafana',def:'Plateforme de visualisation de métriques. Affiche les tableaux de bord de monitoring du RING en interrogeant Prometheus/Thanos comme source de données.',def_en:'Metrics visualization platform. Displays RING monitoring dashboards by querying Prometheus/Thanos as a data source.',refs:['05']},
  {term:'INCOMPLETE',def:'État d\'un objet dont tous les fragments n\'ont pas pu être écrits lors de l\'ingestion. L\'objet est présent mais dégradé ; un rebuild peut le compléter.',def_en:'State of an object for which not all fragments could be written during ingestion. The object is present but degraded; a rebuild can complete it.',refs:['05','06']},
  {term:'Kafka',def:'Plateforme de messagerie distribuée utilisée par Backbeat pour mettre en file d\'attente les événements de réplication, lifecycle et autres tâches asynchrones.',def_en:'Distributed messaging platform used by Backbeat to queue replication events, lifecycle events, and other asynchronous tasks.',refs:['14','16']},
  {term:'Keyspace',def:'Espace de clés du ring Chord — plage de valeurs de hash sur laquelle les objets sont distribués. Chaque nœud est responsable d\'une portion du keyspace.',def_en:'The Chord ring\'s key space — the range of hash values across which objects are distributed. Each node is responsible for a portion of the keyspace.',refs:['01','02']},
  {term:'KMIP',def:'Key Management Interoperability Protocol — protocole standard d\'interopérabilité pour les systèmes de gestion de clés de chiffrement, utilisé avec LUKS et NBDE.',def_en:'Key Management Interoperability Protocol — standard interoperability protocol for encryption key management systems, used with LUKS and NBDE.',refs:['11']},
  {term:'KMS',def:'Key Management Service — service de gestion des clés de chiffrement des données au repos. Intégré avec Vault pour le chiffrement côté serveur S3.',def_en:'Key Management Service — service for managing encryption keys for data at rest. Integrated with Vault for S3 server-side encryption.',refs:['11','17']},
  {term:'LACP',def:'Link Aggregation Control Protocol — protocole d\'agrégation de liens réseau (bonding) pour augmenter le débit et la redondance réseau des nœuds RING.',def_en:'Link Aggregation Control Protocol — network link aggregation (bonding) protocol used to increase throughput and network redundancy for RING nodes.',refs:['09']},
  {term:'Legal Hold',def:'Verrou légal sur un objet S3 empêchant toute suppression ou modification, indépendamment de la retention policy. Utilisé pour la préservation de preuves.',def_en:'Legal lock on an S3 object that prevents any deletion or modification, regardless of the retention policy. Used for evidence preservation.',refs:['17']},
  {term:'LevelDB',def:'Base de données clé-valeur embarquée (Google) utilisée par bucketd et repd pour stocker les métadonnées localement sur chaque nœud.',def_en:'Embedded key-value database (Google) used by bucketd and repd to store metadata locally on each node.',refs:['12','15']},
  {term:'Lifecycle Policy',def:'Règles S3 définissant le cycle de vie automatique des objets : transition vers un autre tier de stockage, expiration, suppression de versions non courantes.',def_en:'S3 rules defining the automatic lifecycle of objects: transition to another storage tier, expiration, deletion of non-current versions.',refs:['15','14']},

  {term:'Platformcheck',def:'Outil de diagnostic Scality vérifiant la conformité de la configuration système (réseau, stockage, OS, BIOS) par rapport aux prérequis de déploiement.',def_en:'Scality diagnostic tool that verifies the compliance of the system configuration (network, storage, OS, BIOS) against deployment prerequisites.',refs:['09']},
  {term:'Prometheus',def:'Système de monitoring et d\'alerte collectant les métriques des composants RING via scraping HTTP. Stocke les séries temporelles et évalue les règles d\'alerte.',def_en:'Monitoring and alerting system that collects metrics from RING components via HTTP scraping. Stores time series and evaluates alerting rules.',refs:['05']},
  {term:'Purge',def:'Opération de suppression définitive des objets marqués comme supprimés ou expirés. Libère l\'espace disque occupé par les données logiquement supprimées.',def_en:'Operation that permanently removes objects marked as deleted or expired. Frees disk space occupied by logically deleted data.',refs:['06','13']},
  {term:'Quorum Raft',def:'Nombre minimal de nœuds devant être disponibles pour qu\'un groupe Raft puisse élire un leader et continuer à accepter des écritures. Généralement ⌊N/2⌋+1.',def_en:'Minimum number of nodes that must be available for a Raft group to elect a leader and continue accepting writes. Generally ⌊N/2⌋+1.',refs:['03']},
  {term:'Raft',def:'Algorithme de consensus distribué utilisé par le ring META pour garantir la cohérence des métadonnées. Un leader est élu parmi les nœuds d\'un groupe ; les écritures passent par lui.',def_en:'Distributed consensus algorithm used by the META ring to ensure metadata consistency. A leader is elected among the nodes of a group; writes go through it.',refs:['03']},
  {term:'Rebuild',def:'Reconstruction des fragments manquants d\'un objet dégradé à partir des fragments survivants. Déclenché automatiquement lors d\'une panne nœud ou disque.',def_en:'Reconstruction of the missing fragments of a degraded object from the surviving fragments. Triggered automatically upon a node or disk failure.',refs:['04','06','13']},
  {term:'Relocation',def:'Déplacement planifié des données d\'un nœud vers d\'autres nœuds du ring, par exemple avant une opération de maintenance ou un retrait définitif.',def_en:'Planned migration of data from a node to other ring nodes, for example before a maintenance operation or permanent removal.',refs:['13']},
  {term:'Repair',def:'Opération de vérification et correction de l\'intégrité des objets du ring. Vérifie que chaque objet possède le bon nombre de fragments conformes à son COS.',def_en:'Operation that verifies and corrects the integrity of ring objects. Checks that each object has the correct number of fragments in conformance with its COS.',refs:['06','13']},
  {term:'repd',def:'Replication Daemon — daemon s\'exécutant sur chaque nœud META et DATA, responsable de la gestion locale des objets, de leur versioning (bseq) et de la cohérence avec LevelDB.',def_en:'Replication Daemon — daemon running on each META and DATA node, responsible for local object management, their versioning (bseq), and consistency with LevelDB.',refs:['02','03']},
  {term:'ringConfigSet',def:'Commande ringsh modifiant les paramètres de configuration du ring (ex: facteur de réplication, seuils d\'alarme). Requiert une validation et peut nécessiter un redémarrage.',def_en:'ringsh command that modifies ring configuration parameters (e.g., replication factor, alarm thresholds). Requires validation and may require a restart.',refs:['13']},
  {term:'RING DATA',def:'Sous-ring dédié au stockage des données (blobs) des objets. Les nœuds DATA hébergent biziod et sproxyd, et contribuent à l\'espace de stockage brut.',def_en:'Sub-ring dedicated to storing object data (blobs). DATA nodes host Biziod and sproxyd, and contribute to the raw storage capacity.',refs:['01','02']},
  {term:'RING META',def:'Sous-ring dédié au stockage des métadonnées des objets (index Chord, MESA). Les nœuds META gèrent les groupes Raft et le consensus des métadonnées.',def_en:'Sub-ring dedicated to storing object metadata (Chord index, MESA). META nodes manage Raft groups and metadata consensus.',refs:['01','02','03']},
  {term:'ringsh',def:'Shell interactif d\'administration du RING. Permet d\'exécuter des commandes de diagnostic (ringList, nodeStatus) et de maintenance (nodeJoin, nodeLeave) sur le cluster.',def_en:'Interactive RING administration shell. Used to run diagnostic commands (ringList, nodeStatus) and maintenance commands (nodeJoin, nodeLeave) on the cluster.',refs:['05','13']},
  {term:'RPO',def:'Recovery Point Objective — perte de données maximale tolérée exprimée en durée. Définit la fréquence minimale de synchronisation pour la reprise après sinistre.',def_en:'Recovery Point Objective — maximum tolerated data loss expressed as a duration. Defines the minimum synchronization frequency required for disaster recovery.',refs:['16']},
  {term:'RTO',def:'Recovery Time Objective — durée maximale tolérée d\'interruption de service. Définit le délai maximum pour restaurer le service après un incident.',def_en:'Recovery Time Objective — maximum tolerated service interruption duration. Defines the maximum delay to restore service after an incident.',refs:['16']},
  {term:'Salt / SaltStack',def:'Outil de gestion de configuration et d\'orchestration utilisé pour déployer et maintenir les composants Scality RING. Les états Salt décrivent la configuration cible des nœuds.',def_en:'Configuration management and orchestration tool used to deploy and maintain Scality RING components. Salt states describe the target configuration of nodes.',refs:['09','18']},
  {term:'scaldisk',def:'Outil de gestion des disques sur les nœuds RING. Permet d\'ajouter, retirer, ou vérifier l\'état des disques physiques intégrés au service de stockage.',def_en:'Disk management tool on RING nodes. Used to add, remove, or check the status of physical disks integrated into the storage service.',refs:['09','13']},
  {term:'sfused',def:'Service FUSE implémentant le filesystem SOFS côté client. Expose le namespace SOFS en tant que point de montage POSIX sur les serveurs d\'accès NFS/SMB.',def_en:'FUSE service implementing the SOFS filesystem on the client side. Exposes the SOFS namespace as a POSIX mount point on NFS/SMB access servers.',refs:['10']},
  {term:'SOFS',def:'Scale-Out File System — système de fichiers distribué Scality exposant une interface POSIX (NFS/SMB) au-dessus du ring de stockage d\'objets.',def_en:'Scale-Out File System — Scality\'s distributed filesystem exposing a POSIX interface (NFS/SMB) on top of the object storage ring.',refs:['10']},
  {term:'SPOF',def:'Single Point Of Failure — composant dont la défaillance entraîne l\'arrêt complet du service. L\'architecture RING vise à éliminer les SPOF par redondance.',def_en:'Single Point Of Failure — component whose failure causes a complete service outage. The RING architecture aims to eliminate SPOFs through redundancy.',refs:['01','04']},
  {term:'SPLIT LOOP',def:'Alarme critique indiquant que le ring s\'est fragmenté en deux partitions réseau qui ne se voient plus. Entraîne un split-brain et nécessite une intervention immédiate.',def_en:'Critical alarm indicating that the ring has split into two network partitions that can no longer communicate. Causes a split-brain and requires immediate intervention.',refs:['05','13']},
  {term:'sproxyd',def:'Daemon HTTP de stockage d\'objets s\'exécutant sur les nœuds DATA. Expose une API REST interne et délègue les I/O disque à biziod. Point d\'entrée des données dans le ring.',def_en:'HTTP object storage daemon running on DATA nodes. Exposes an internal REST API and delegates disk I/O to Biziod. Entry point for data into the ring.',refs:['02','04']},
  {term:'Supervisor',def:'Daemon de surveillance des processus (supervisord) assurant le redémarrage automatique des services Scality en cas de crash.',def_en:'Process monitoring daemon (supervisord) that ensures automatic restart of Scality services in the event of a crash.',refs:['09']},
  {term:'SupAPI',def:'Supervisor API — interface REST exposée par supervisord permettant de contrôler et surveiller l\'état des processus Scality sur chaque nœud.',def_en:'Supervisor API — REST interface exposed by supervisord for controlling and monitoring the status of Scality processes on each node.',refs:['09']},
  {term:'SUR',def:'Storage Utilization Ratio — taux d\'utilisation de l\'espace de stockage brut, tenant compte de l\'overhead de l\'erasure coding ou de la réplication selon le COS.',def_en:'Storage Utilization Ratio — raw storage space utilization rate, accounting for the overhead of erasure coding or replication depending on the COS.',refs:['04','05']},
  {term:'Thanos',def:'Extension de Prometheus offrant du stockage long terme et une vue agrégée multi-cluster des métriques. Utilisé pour les tableaux de bord Grafana historiques.',def_en:'Prometheus extension providing long-term storage and an aggregated multi-cluster view of metrics. Used for historical Grafana dashboards.',refs:['05']},
  {term:'Throttling',def:'Mécanisme de limitation du débit d\'I/O ou du nombre de requêtes par seconde, protégeant le ring contre les surcharges. Configurable par COS ou par tenant.',def_en:'Mechanism for limiting I/O throughput or the number of requests per second, protecting the ring against overload. Configurable per COS or per tenant.',refs:['15']},
  {term:'UTAPI',def:'Usage Tracking API — service Scality collectant et exposant les métriques d\'utilisation S3 par bucket et par utilisateur (octets stockés, requêtes, bande passante).',def_en:'Usage Tracking API — Scality service that collects and exposes S3 usage metrics per bucket and per user (bytes stored, requests, bandwidth).',refs:['15']},
  {term:'Vault',def:'Service d\'authentification et d\'autorisation IAM de Scality. Gère les comptes, utilisateurs, rôles et politiques S3 (équivalent AWS IAM), ainsi que les clés de chiffrement KMS.',def_en:'Scality\'s IAM authentication and authorization service. Manages S3 accounts, users, roles, and policies (equivalent to AWS IAM), as well as KMS encryption keys.',refs:['12','11','17']},
  {term:'Warm Standby (WSB)',def:'Mode de réplication entre deux sites où le site secondaire reçoit les données en quasi-temps réel mais n\'est pas actif. Bascule rapide possible en cas de panne du site primaire.',def_en:'Replication mode between two sites where the secondary site receives data in near-real time but is not active. Fast failover is possible if the primary site fails.',refs:['16']},
  {term:'XDM',def:'Cross-Domain Management — composant de gestion multi-site permettant d\'administrer plusieurs rings depuis une interface unifiée, avec politiques de CRR et de routage centralisées.',def_en:'Cross-Domain Management — multi-site management component enabling administration of multiple rings from a unified interface, with centralized CRR and routing policies.',refs:['03','14']},
  {term:'ZooKeeper',def:'Service de coordination distribué (Apache) utilisé par Kafka et certains composants Backbeat pour la synchronisation, la découverte de services et la gestion de configuration.',def_en:'Distributed coordination service (Apache) used by Kafka and certain Backbeat components for synchronization, service discovery, and configuration management.',refs:['14','16']},
  {term:'Apache httpd',def:'Serveur web Apache utilisé comme frontend HTTP de sproxyd. Écoute sur le port 81 et forward les requêtes vers le daemon sproxyd (port 10000) via FastCGI. Gère TLS et les logs d\'accès.',def_en:'Apache web server used as the HTTP frontend for sproxyd. Listens on port 81 and forwards requests to the sproxyd daemon (port 10000) via FastCGI. Handles TLS and access logging.',refs:['04','19']},
  {term:'Apache Spark',def:'Moteur de traitement distribué open-source. N\'est PAS un composant interne du RING — accède au RING via l\'API S3 standard. Le RING est le storage layer, Spark est le compute layer. Usage : data lake analytics, ML, ETL batch.',def_en:'Open-source distributed processing engine. It is NOT an internal RING component — it accesses the RING via the standard S3 API. The RING is the storage layer, Spark is the compute layer. Use cases: data lake analytics, ML, batch ETL.',refs:['17','19']},
  {term:'clevis',def:'Client NBDE côté nœud. Obtient la clé de déchiffrement LUKS depuis le serveur TANG au démarrage du nœud, permettant l\'ouverture automatique des disques chiffrés sans intervention humaine.',def_en:'Client-side NBDE component on each node. Retrieves the LUKS decryption key from the TANG server at node boot, enabling automatic unlocking of encrypted disks without human intervention.',refs:['06','11','19']},
  {term:'ClickHouse',def:'Base de données analytique colonnaire hautes performances. Reçoit les logs d\'accès S3 via Fluent-bit et permet des requêtes analytiques rapides (qui accède à quoi, quand, d\'où). Remplace Elasticsearch depuis RING 9.5.0.',def_en:'High-performance columnar analytics database. Receives S3 access logs via Fluent-bit and enables fast analytical queries (who accesses what, when, from where). Replaces Elasticsearch since RING 9.5.0.',refs:['17','18','19']},
  {term:'Elasticsearch',def:'Moteur de recherche et d\'analytique full-text utilisé dans les versions RING antérieures à 9.5.0 pour le statut S3 et les logs d\'accès. Remplacé par Prometheus/Thanos (statut) et ClickHouse (analytics) depuis 9.5.',def_en:'Full-text search and analytics engine used in RING versions prior to 9.5.0 for S3 status and access logs. Replaced by Prometheus/Thanos (status) and ClickHouse (analytics) since version 9.5.',refs:['05','08','19']},
  {term:'Fluent-bit',def:'Agent léger de collecte de logs (< 1 MB RAM) déployé sur chaque nœud RING. Forward les logs vers Loki (centralisation) et ClickHouse (analytics S3). Joue pour les logs le même rôle que node_exporter pour les métriques.',def_en:'Lightweight log collection agent (< 1 MB RAM) deployed on each RING node. Forwards logs to Loki (centralization) and ClickHouse (S3 analytics). Plays the same role for logs as node_exporter does for metrics.',refs:['05','18','19']},
  {term:'Keycloak',def:'Solution SSO (Single Sign-On) intégrée dans Scality RING depuis la version 9.4.0. Gère l\'authentification des administrateurs vers le Supervisor et Grafana via SAML 2.0 et OIDC. Distinct de Vault (IAM S3) : Keycloak = admins humains, Vault = applications S3.',def_en:'SSO (Single Sign-On) solution integrated into Scality RING since version 9.4.0. Manages administrator authentication to Supervisor and Grafana via SAML 2.0 and OIDC. Distinct from Vault (S3 IAM): Keycloak = human admins, Vault = S3 applications.',refs:['09','19']},
  {term:'Loki',def:'Système de centralisation et d\'indexation des logs (Grafana Labs). Contrairement à Elasticsearch, Loki indexe uniquement les métadonnées (labels) et non le contenu des logs — moins gourmand en ressources. Interrogeable depuis Grafana.',def_en:'Log centralization and indexing system (Grafana Labs). Unlike Elasticsearch, Loki indexes only metadata (labels) rather than log content — less resource-intensive. Queryable from Grafana.',refs:['05','18','19']},
  {term:'MongoDB',def:'Base de données NoSQL utilisée comme source de vérité des métadonnées S3 : liste des objets par bucket, ACL, versioning, tags. Déployée en ReplicaSet pour la HA. Redis est son cache en amont.',def_en:'NoSQL database used as the source of truth for S3 metadata: per-bucket object listing, ACLs, versioning, tags. Deployed as a ReplicaSet for HA. Redis serves as its upstream cache.',refs:['03','12','19']},
  {term:'NFS-Ganesha',def:'Serveur NFS userspace supportant NFSv4.0. Avantage par rapport au NFS kernel : un crash est isolé (pas de kernel panic) et les mises à jour ne nécessitent pas de recompilation noyau. Utilisé par SOFS pour l\'accès NFS.',def_en:'Userspace NFS server supporting NFSv4.0. Advantage over kernel NFS: a crash is isolated (no kernel panic) and updates do not require kernel recompilation. Used by SOFS for NFS access.',refs:['04','10','19']},
  {term:'node_exporter',def:'Agent Prometheus déployé sur chaque nœud. Expose les métriques OS et hardware : CPU, RAM, disques, réseau, charge système. Complément de MARS qui expose les métriques applicatives internes RING.',def_en:'Prometheus agent deployed on each node. Exposes OS and hardware metrics: CPU, RAM, disks, network, system load. Complements MARS, which exposes internal RING application metrics.',refs:['05','19']},
  {term:'Redis',def:'Base de données en mémoire utilisée comme cache des métadonnées S3 chaudes. Réduit la charge sur MongoDB pour les lectures fréquentes (LIST, HEAD). Déployé en mode HA via Redis Sentinel (1 master + N replicas).',def_en:'In-memory database used as a cache for hot S3 metadata. Reduces load on MongoDB for frequent reads (LIST, HEAD). Deployed in HA mode via Redis Sentinel (1 master + N replicas).',refs:['03','12','19']},
  {term:'Reed-Solomon',def:'Algorithme de codes correcteurs d\'erreurs utilisé par l\'erasure coding ARC du RING. Permet de reconstruire les fragments manquants d\'un objet à partir d\'un sous-ensemble des fragments survivants.',def_en:'Error-correcting code algorithm used by the RING\'s ARC erasure coding. Enables reconstruction of an object\'s missing fragments from a subset of the surviving fragments.',refs:['02','19']},
  {term:'Samba',def:'Implémentation open-source du protocole SMB/CIFS. Utilisé dans SOFS pour exposer les partages Windows (SMB 3.0). SerNet-Samba est la distribution enterprise de Samba avec support commercial. La règle vfs objects = ring doit être en première position.',def_en:'Open-source implementation of the SMB/CIFS protocol. Used in SOFS to expose Windows shares (SMB 3.0). SerNet-Samba is the enterprise Samba distribution with commercial support. The vfs objects = ring rule must be in the first position.',refs:['04','10','19']},
  {term:'TANG',def:'Serveur NBDE (Network-Bound Disk Encryption) fournissant les clés de déchiffrement LUKS aux nœuds au démarrage. Si TANG est inaccessible (réseau coupé, serveur éteint), les disques LUKS ne s\'ouvrent pas automatiquement.',def_en:'NBDE (Network-Bound Disk Encryption) server that provides LUKS decryption keys to nodes at boot time. If TANG is unreachable (network down, server off), LUKS disks do not open automatically.',refs:['06','11','19']}
];

function openGlossary(){
  state.view='glossary';
  document.getElementById('homePage').classList.remove('show');
  document.getElementById('modulePage').classList.remove('show');
  document.getElementById('glossaryPage').classList.add('show');
  renderGlossary();renderSidebar();
}

function glossJump(letter){
  var el=document.getElementById('gl-'+letter);
  if(el)el.scrollIntoView({behavior:'smooth'});
}

function renderGlossary(){
  var sorted=GLOSSARY.slice().sort(function(a,b){return a.term.localeCompare(b.term,'fr',{sensitivity:'base'});});
  var letters={};
  sorted.forEach(function(e){
    var l=e.term[0].toUpperCase();
    if(!letters[l])letters[l]=[];
    letters[l].push(e);
  });
  var keys=Object.keys(letters).sort();
  var nav='<div class="gloss-alpha">';
  keys.forEach(function(l){nav+='<span class="gl-al" onclick="glossJump(\''+l+'\')">'+l+'</span>';});
  nav+='</div>';
  var body='';
  keys.forEach(function(l){
    body+='<div class="gloss-lhdr" id="gl-'+l+'">'+l+'</div>';
    letters[l].forEach(function(e){
      var refs='';
      if(e.refs&&e.refs.length){
        refs='<div class="gl-ref">';
        e.refs.forEach(function(id,i){
          var mi=MODS.findIndex(function(m){return m.id===id;});
          if(mi>=0){
            if(i>0)refs+=' &bull; ';
            refs+='<span onclick="openModule('+mi+')">'+MODS[mi].num+' – '+L(MODS[mi].title,MODS[mi].title_en||MODS[mi].title)+'</span>';
          }
        });
        refs+='</div>';
      }
      body+='<div class="gloss-entry"><div class="gl-term">'+e.term+'</div><div class="gl-def">'+L(e.def,e.def_en||e.def)+'</div>'+refs+'</div>';
    });
  });
  var gh=document.getElementById('glossPageTitle');if(gh)gh.textContent=L('Glossaire des termes Scality RING','Scality RING Glossary');
  document.getElementById('glossBody').innerHTML=nav+body;
}

function toggleSidebar(){
  var sb=document.querySelector('.sb');
  var btn=document.getElementById('sbToggle');
  var collapsed=sb.classList.toggle('collapsed');
  btn.innerHTML=collapsed?'&#8250;':'&#8249;';
  localStorage.setItem('sbCollapsed',collapsed?'1':'');
}
(function(){
  var initLang=localStorage.getItem('ringLang')||'fr';
  state.lang=initLang;
  var fFr=document.getElementById('flagFr');
  var fEn=document.getElementById('flagEn');
  if(fFr)fFr.classList.toggle('flag-active',initLang==='fr');
  if(fEn)fEn.classList.toggle('flag-active',initLang==='en');
  if(localStorage.getItem('sbCollapsed')==='1'){
    document.querySelector('.sb').classList.add('collapsed');
    document.getElementById('sbToggle').innerHTML='&#8250;';
  }
})();


renderSidebar();
renderHome();
</script>
</body>
</html>
