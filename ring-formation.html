strong>scaldisk et Salt :</strong> L\'outil <code>scaldisk</code> (ajout/recuperation de disques) utilise Salt en mode standalone pour executer ses operations. Salt doit etre installe en version 2015.8 a 2017.7 (inclus). <strong>Ne pas utiliser Salt pour ajouter des disques a tous les serveurs simultanement</strong> — cela peut perturber le re-balancing du RING.</p><h2>Cycle de Vie des Donnees — GC, Purge, Relocation</h2><p>La suppression d\'un objet dans RING est un processus <strong>asynchrone en 3 etapes</strong> pour garantir les performances et eviter les orphelins :</p><div class="adiag">Flux de suppression d\'un objet :\n\n1. DELETE S3 (synchrone)\n   Client -> Cloudserver -> repd\n   L\'objet est marque "deleted" dans les metadonnees\n   -> Reponse immediate au client (200 OK)\n   \n2. Garbage Collector Task (asynchrone)\n   Un objet cache special "GC object" liste les objets a supprimer\n   Le daemon GC traite ces listes en arriere-plan\n   -> Les blocs de donnees dans le RING sont marques "a liberer"\n   \n3. Purge Task (asynchrone, delai 7 jours par defaut)\n   Apres le delai de "purge retention", les blocs sont physiquement\n   desalloues dans les fichiers DAT des biziods\n   -> L\'espace est reellement recupere\n\n4. Relocation Task (si necessaire)\n   Si un fichier DAT contient trop d\'espace non utilise (trous),\n   les donnees valides sont copiees dans un nouveau fichier DAT\n   et l\'ancien est supprime\n   -> Defragmentation des fichiers de stockage</div><h3>Les 3 taches du Garbage Collector</h3><table><tr><th>Tache</th><th>Role</th><th>Parametres cles</th></tr><tr><td><strong>GC Task</strong></td><td>Traite les "GC objects" (listes d\'objets supprimes). Optimise les suppressions massives en les traitant en asynchrone.</td><td><code>chordgc_enable</code>, <code>chordgc_crawlfreq</code> (frequence en secondes), <code>chordgc_maxjobs</code></td></tr><tr><td><strong>Purge Task</strong></td><td>Desallocation physique des objets marques deleted. Delai de purge retention = 7 jours par defaut. Ce delai <strong>evite les orphelins</strong> lors de pannes ou maintenance.</td><td><code>chordpurgetombstoneexpirationtimevalue</code> (min 1 semaine recommande), <code>chordpurgeperiod</code> (≤ moitie de la valeur precedente)</td></tr><tr><td><strong>Relocation Task</strong></td><td>Defragmentation : cree un nouveau fichier DAT avec les donnees valides, supprime l\'ancien. Libere l\'espace des trous dans les fichiers container.</td><td>Declenche automatiquement quand le taux d\'espace non utilise depasse un seuil.</td></tr></table><h2>Les Orphelins dans RING</h2><p>Un <strong>orphelin</strong> est une donnee qui existe physiquement dans le RING mais qui n\'est plus referencee par aucune metadonnee. Les orphelins consomment de l\'espace disque inutilement et doivent etre nettoyes.</p><h3>Types d\'orphelins</h3><table><tr><th>Type</th><th>Definition</th><th>Cause typique</th></tr><tr><td><strong>Disk Orphans</strong></td><td>Chunks sur disque (biziod) qui n\'ont plus de cle valide dans l\'index RING.</td><td>Panne durant une ecriture, maintenance interrompue, bug de suppression partielle.</td></tr><tr><td><strong>S3 Orphans</strong></td><td>Donnees non referencees par les metadonnees S3 (ex: compte supprime sans supprimer son contenu).</td><td>Suppression d\'un compte S3 sans purge prealable du contenu. Deletion incomplete.</td></tr><tr><td><strong>SOFS Orphans</strong></td><td>Donnees SOFS sans metadonnees associees (ex: volume supprime sans supprimer les donnees liees).</td><td>Suppression de volume SOFS avec echec partiel.</td></tr><tr><td><strong>ARC Orphans</strong></td><td>Parties de fragments ARC (erasure coding) qui n\'ont pas ete correctement supprimees.</td><td>Suppression incomplete d\'un objet ARC (panne pendant la desallocation).</td></tr><tr><td><strong>ARC Incomplete Objects</strong></td><td>Objets ARC auxquels il manque trop de fragments pour etre reconstruits.</td><td>Multiples pannes simultanees depassant le seuil de tolerance ARC.</td></tr></table><h3>Commandes de gestion des disk orphans</h3><pre># Lister tous les orphelins potentiels sur un noeud\nring> node listDiskOrphans\n\n# Lister les orphelins d\'un biziod specifique\nring> node listDiskOrphans bizioname=cutebiziod0001\n\n# Supprimer les orphelins memoire d\'un biziod\nring> node clearDiskOrphans cutebiziod0001\n\n# Nettoyer les objets hors-service (OOS)\nring> node cleanupOos disk0001</pre><h3>Capacite affichee dans le Dashboard</h3><p>Le tableau de bord Scality distingue plusieurs categories de capacite qui aident a identifier les problemes d\'orphelins :</p><table><tr><th>Categorie</th><th>Description</th></tr><tr><td>Garbage collectable</td><td>Objets en attente de suppression asynchrone (GC objects). Doit diminuer periodiquement.</td></tr><tr><td>ARC Orphans</td><td>Fragments ARC non supprimes — indique des suppressions incompletes.</td></tr><tr><td>ARC Incomplete Objects</td><td>Objets ARC trop endommagees pour etre reconstruits — necessite une intervention.</td></tr><tr><td>Deleted</td><td>Objets marques pour suppression, en attente de purge (7 jours).</td></tr><tr><td>COS Incomplete Objects</td><td>Objets repliques (COS) avec des copies manquantes.</td></tr></table><div class="kbox"><h3>Points Cles a Retenir</h3><ul><li>Salt dans Scality = SaltStack (gestion de configuration), pas un sel cryptographique</li><li>Apres modification de scality-common.sls : toujours <code>salt \'*\' saltutil.refresh_pillar</code></li><li>Suppression RING = 3 phases asynchrones : GC Task → Purge Task (7j) → Relocation</li><li>Purge retention 7 jours = fenetre de securite contre les orphelins lors de pannes</li><li>Disk orphans = <code>listDiskOrphans</code> pour identifier, <code>clearDiskOrphans</code> pour nettoyer</li><li>S3 orphans = donnees sans metadonnees (compte supprime sans purge du contenu)</li><li>ARC Orphans = fragments ARC non supprimes → consomment de l\'espace inutilement</li></ul></div>',
quiz:[
{q:"Qu\'est-ce que 'Salt' dans le contexte de Scality RING ?",opts:["Un sel cryptographique pour le hachage des cles","L\'outil de gestion de configuration SaltStack (comparable a Ansible/Puppet)","Un service de chiffrement des donnees au repos","Un protocole de synchronisation entre datacenters"],ans:1,expl:"Salt dans Scality = SaltStack, l\'outil de gestion de configuration et d\'orchestration. Il est utilise sur le Supervisor (Salt Master) pour deployer et configurer tous les composants RING via les Salt Minions sur chaque serveur."},
{q:"Apres avoir modifie /srv/scality/pillar/scality-common.sls, quelle commande doit etre executee en premier ?",opts:["salt-run state.orchestrate prometheus.orchestrate","salt \'*\' saltutil.refresh_pillar","systemctl restart scality-supervisor","ringsh supervisor ringConfigSet ..."],ans:1,expl:"Apres toute modification de scality-common.sls, la commande 'salt * saltutil.refresh_pillar' doit etre executee pour que tous les noeuds Salt Minions rechargent la nouvelle configuration (pillar). Sans cette etape, les noeuds continuent d\'utiliser l\'ancienne configuration."},
{q:"Quel est le delai de purge retention par defaut dans RING avant qu\'un objet marque 'deleted' soit physiquement desalloue ?",opts:["1 heure","24 heures","7 jours","30 jours"],ans:2,expl:"Le delai de purge retention est de 7 jours par defaut (604800 secondes). Ce delai est intentionnel : il evite la creation d\'orphelins si une panne survient pendant la suppression, en laissant le temps au GC de finaliser le processus avant la desallocation physique."},
{q:"Un compte S3 a ete supprime sans supprimer prealablement son contenu. Quel type d\'orphelins va se creer ?",opts:["Disk orphans","ARC orphans","S3 orphans","SOFS orphans"],ans:2,expl:"Des S3 orphans sont crees quand des donnees dans le RING ne sont plus referencees par les metadonnees S3. C\'est typiquement le cas quand un compte S3 est supprime sans que son contenu (objets) ait ete supprime au prealable."},
{q:"Quelle commande ringsh permet de lister les chunks orphelins potentiels sur un biziod specifique ?",opts:["ring> node cleanupOos disk0001","ring> node listDiskOrphans bizioname=cutebiziod0001","ring> node clearDiskOrphans cutebiziod0001","ring> disk listOrphans --biziod cutebiziod0001"],ans:1,expl:"La commande 'ring> node listDiskOrphans bizioname=cutebiziod0001' liste les cles orphelines potentielles sur un biziod specifique. La commande clearDiskOrphans supprime ensuite la liste memoire de ces orphelins. La commande cleanupOos traite les objets hors-service (OOS), pas les orphelins."},
{q:"Quelle est la difference entre 'ARC Orphans' et 'ARC Incomplete Objects' dans le dashboard RING ?",opts:["Ce sont deux noms pour la meme chose","ARC Orphans = fragments non supprimes ; ARC Incomplete Objects = objets avec trop de fragments manquants pour etre reconstruits","ARC Orphans = objets COS ; ARC Incomplete Objects = objets ARC","ARC Orphans = dans le DATA RING ; ARC Incomplete = dans le META RING"],ans:1,expl:"ARC Orphans sont des parties de fragments ARC qui n\'ont pas ete correctement supprimees (consomment de l\'espace inutilement). ARC Incomplete Objects sont des objets ARC auxquels il manque trop de fragments (au-dela de la tolerance 5 sur 12) pour etre reconstruits — ces objets sont definitivamente perdus."}
]}
,
{id:'ME',num:'E',title:'CRR — Replication Multi-Sites',desc:'Cross-Region Replication : Backbeat, Kafka, ZooKeeper, site-level vs bucket-level, objets existants, pause/resume',
content:'<h2>CRR — Cross-Region Replication</h2><p>La <strong>Cross-Region Replication (CRR)</strong> est le mecanisme de Scality pour repliquer de facon <strong>asynchrone</strong> les objets S3 d\'un cluster source vers un cluster destination. Elle est implementee par <strong>Backbeat</strong>, le moteur de workflows asynchrones du S3 Connector.</p><h3>Architecture du pipeline CRR</h3><div class="adiag">CLUSTER SOURCE                          CLUSTER DESTINATION\n\n  Client S3\n     | PUT objet\n     v\n [Cloudserver]                          [Cloudserver]\n     | ecrit metadonnees                      |\n     v                                        |\n  [repd]  --> journal Raft                    |\n     |                                        |\n     v                                        |\n [Backbeat Queue Populator]                   |\n     | detecte les nouveaux objets            |\n     | publie dans Kafka                      |\n     v                                        |\n   [Kafka]  topic: backbeat-replication       |\n     |                                        |\n     v                                        |\n [Backbeat Queue Processor]                   |\n     | lit les evenements Kafka               |\n     | lit l\'objet depuis sproxyd source      |\n     | ecrit l\'objet dans sproxyd destination |\n     +------> PUT objet ----------------------+\n     | ecrit le statut CRR dans repd source   |\n     v                                        |\n  Statut: COMPLETED                      [repd destination]</div><h3>Site-Level vs Bucket-Level CRR</h3><table><tr><th>Mode</th><th>Description</th><th>Cas d\'usage</th><th>Contraintes</th></tr><tr><td><strong>Bucket-Level CRR</strong></td><td>Configuration explicite par bucket : l\'admin active la replication bucket par bucket avec une policy JSON IAM.</td><td>Replication selective, Object Lock, CRR granulaire.</td><td>Chaque bucket doit etre configure independamment. Compatible Object Lock.</td></tr><tr><td><strong>Site-Level CRR (Echo Mode)</strong></td><td>Mode "echo" automatique : tout bucket cree sur la source est automatiquement replique sur la destination. Backbeat configure les IAM policies automatiquement.</td><td>Mirror complet de site, DR simplifie.</td><td><strong>Incompatible avec Object Lock.</strong> Pas de granularite par bucket.</td></tr></table><h3>Statuts CRR d\'un objet</h3><table><tr><th>Statut</th><th>Signification</th></tr><tr><td><strong>PENDING</strong></td><td>Objet en attente de replication dans la queue Kafka. Pas encore traite.</td></tr><tr><td><strong>PROCESSING</strong></td><td>Objet en cours de copie vers la destination.</td></tr><tr><td><strong>COMPLETED</strong></td><td>Objet replique avec succes sur le cluster destination.</td></tr><tr><td><strong>FAILED</strong></td><td>Echec de la replication (reseau, destination indisponible...). Redis conserve les entrees FAILED pour retry.</td></tr><tr><td><strong>REPLICA</strong></td><td>Objet qui EST une replique (il est la destination). Ne doit pas etre re-replique sauf en cas de DR failback.</td></tr></table><h2>Kafka et ZooKeeper dans CRR</h2><p><strong>Kafka</strong> est la queue de messages qui decouple le Queue Populator (detection) du Queue Processor (copie). Points cles :</p><ul><li>Topic principal : <code>backbeat-replication</code></li><li><strong>Retention 7 jours</strong> : si le cluster destination est indisponible plus de 7 jours, Kafka droppe les evenements les plus anciens et les objets ne seront jamais repliques</li><li>Verification sante : <code>/opt/scality/s3tools/bin/backbeat-topic-info</code></li></ul><p><strong>ZooKeeper</strong> coordonne :</p><ul><li>L\'election de leader dans les workers Backbeat</li><li>La synchronisation des offsets Kafka entre workers</li><li>En failover multi-sites : Ansible met a jour ZooKeeper (6 → 5 participants pour retablir le quorum)</li></ul><h2>Replier des Objets Existants (crrExistingObjects.js)</h2><p>Les objets mis en place <strong>avant</strong> l\'activation d\'une policy CRR ne sont pas automatiquement repliques. Le script <code>crrExistingObjects.js</code> (container <code>s3utils</code>) permet de les traiter :</p><pre># Replier les objets en statut PENDING (non encore repliques)\ndocker exec s3utils node crrExistingObjects.js \\\n  --target-replication-status PENDING \\\n  --workers 10 \\\n  --max-updates 10000\n\n# Cas DR Failback : re-replier les REPLICA (repliques) vers la source\ndocker exec s3utils node crrExistingObjects.js \\\n  --target-replication-status REPLICA \\\n  --force-using-configuration</pre><p>Variables importantes :</p><ul><li><code>TARGET_REPLICATION_STATUS</code> : NEW, PENDING, COMPLETED, FAILED, REPLICA</li><li><code>WORKERS</code> : parallelisme (attention a la charge sur la source)</li><li><code>KEY_MARKER</code> / <code>VERSION_ID_MARKER</code> : reprendre un traitement en cours par batch</li><li><code>FORCE_USING_CONFIGURATION</code> : force l\'utilisation de la config CRR actuelle plutot que celle dans les metadonnees de l\'objet</li></ul><h2>Pause et Resume de la CRR</h2><p>Depuis les versions 7.4.9.0 / 7.8.0.4, la replication peut etre mise en pause sans perdre les objets en queue :</p><pre># Pause : arrete l\'ingestion de nouveaux objets dans Kafka\n# (finit de traiter la queue existante)\nansible-playbook tooling-playbooks/backbeat-pause-ingestion.yml\n\n# Resume\nansible-playbook tooling-playbooks/backbeat-resume-ingestion.yml</pre><p class="alert-w"><strong>Risque Kafka :</strong> Si la pause dure plus de <strong>7 jours</strong>, les evenements Kafka les plus anciens sont supprimes (retention maximale). Les objets correspondants ne seront jamais repliques automatiquement. Utiliser <code>crrExistingObjects.js</code> avec <code>TARGET_REPLICATION_STATUS=PENDING</code> pour les recuperer.</p><h2>Metriques CRR via Backbeat API</h2><table><tr><th>Metrique</th><th>Endpoint</th><th>Interpretation</th></tr><tr><td>Backlog</td><td><code>/api/metrics/crr/all/backlog</code></td><td>Nombre et taille des objets en attente de replication (15 dernieres minutes). Si croissant : le processor n\'arrive pas a suivre.</td></tr><tr><td>Throughput</td><td><code>/api/metrics/crr/all/throughput</code></td><td>Objets/sec et bytes/sec en cours de replication. Utile pour le dimensionnement.</td></tr><tr><td>Completions</td><td><code>/api/metrics/crr/all/completions</code></td><td>Objets repliques avec succes (15 dernieres minutes).</td></tr></table><p class="alert-i"><strong>Action obligatoire pre-upgrade vers 9.5.2 :</strong> Les buckets CRR doivent accorder la permission <code>s3:ReplicateObject</code> au role de replication IAM. Sans cette permission (non verifiee avant 9.5.2), la CRR echoue avec <code>AccessDenied</code> apres l\'upgrade.</p><h2>CRR Tuning — Optimisation des Performances</h2><p>Si le backlog CRR augmente (le processor n\'arrive pas a suivre le debit d\'ingestion), plusieurs parametres peuvent etre ajustes pour accelerer la replication.</p><h3>Principe de convergence CRR</h3><p>Pour que la CRR "converge" (rattrape son retard), le <strong>processor doit repliquer plus vite que les nouvelles versions sont ajoutees a la queue Kafka</strong>. Si ce n\'est pas le cas, le backlog grossit indefiniment.</p><table><tr><th>Parametre</th><th>Variable</th><th>Effet</th></tr><tr><td>Nombre de workers CRR</td><td><code>env_backbeat_replication_workers</code></td><td>Parallelisme de copie. Augmenter pour accelerer sur un reseau rapide.</td></tr><tr><td>Taille des batches Kafka</td><td><code>env_backbeat_kafka_consumer_batch_size</code></td><td>Nombre de messages consommes par cycle. Augmenter reduit le overhead Kafka.</td></tr><tr><td>Concurrence par worker</td><td><code>env_backbeat_replication_concurrency</code></td><td>Requetes simultanees par worker. Utile si la latence reseau inter-sites est elevee.</td></tr></table><p class="alert-i"><strong>Apres chaque modification :</strong> Monitorer le backlog via <code>/api/metrics/crr/all/backlog</code>. Si le backlog diminue, le tuning est efficace. Si le backlog continue de croitre malgre le tuning, investiguer la bande passante reseau inter-sites.</p><h2>TLS pour CRR</h2><p>La replication CRR entre deux clusters peut etre securisee par TLS mutuel (mTLS) pour authentifier les deux sites l\'un envers l\'autre.</p><h3>Certificats CRR</h3><table><tr><th>Fichier</th><th>Emplacement</th><th>Role</th></tr><tr><td><code>backbeat.crt</code></td><td><code>/scality/ssd*1/s3/scality-frontend-s3/certs/</code></td><td>Certificat public du site pour la CRR</td></tr><tr><td><code>backbeat.key</code></td><td>Meme repertoire</td><td>Cle privee du site pour la CRR</td></tr><tr><td><code>backbeat-client.crt</code></td><td>Meme repertoire (optionnel)</td><td>Certificat client pour authentification mutuelle</td></tr></table><pre># Verifier les certificats CRR sur tous les noeuds stateful\nANSIBLE -i $INVENTORY -m shell \\\n  -a "ls -la /scality/ssd*1/s3/scality-frontend-s3/certs/backbeat*" \\\n  runners_metadata\n\n# Verifier que le container backbeat tourne\nctrctl ps | grep scality-backbeat | grep -v scality-backbeat-queue</pre><div class="kbox"><h3>Points Cles a Retenir</h3><ul><li>CRR = replication ASYNCHRONE via Backbeat (Queue Populator → Kafka → Queue Processor)</li><li>Site-level (echo) = replication automatique de tous les buckets, incompatible Object Lock</li><li>Bucket-level = configuration explicite par bucket, compatible Object Lock</li><li>Kafka retention = 7 jours : une indisponibilite >7j necessite crrExistingObjects.js</li><li>crrExistingObjects.js : outil pour replier les objets existants (PENDING, FAILED, REPLICA pour failback DR)</li><li>s3:ReplicateObject obligatoire depuis 9.5.2 dans les policies IAM CRR</li><li>Metriques CRR : backlog, throughput, completions via Backbeat API</li></ul></div>',
quiz:[
{q:"Quel composant Scality publie les evenements d\'objets dans Kafka pour declencher la replication CRR ?",opts:["Cloudserver directement","Backbeat Queue Populator","repd via Raft","ZooKeeper"],ans:1,expl:"Le Backbeat Queue Populator surveille le journal Raft de repd pour detecter les nouveaux objets a repliquer, puis publie des evenements dans le topic Kafka 'backbeat-replication'. Le Queue Processor lit ensuite ces evenements et effectue la copie vers la destination."},
{q:"Une politique CRR a ete activee sur un bucket contenant 10 millions d\'objets existants. Ces objets seront-ils automatiquement repliques ?",opts:["Oui, Backbeat les detecte automatiquement","Non, il faut utiliser crrExistingObjects.js avec TARGET_REPLICATION_STATUS=PENDING","Oui, mais seulement les 1000 plus recents","Non, il faut supprimer et re-creer les objets"],ans:1,expl:"Les objets existants avant l\'activation de la policy CRR ne sont pas dans le journal Raft recent et ne seront donc pas detectes par le Queue Populator. Le script crrExistingObjects.js est l\'outil prevu pour scanner les buckets et enqueuer les objets existants avec le statut PENDING."},
{q:"Le cluster destination CRR est indisponible depuis 9 jours. Quelle est la consequence sur la replication ?",opts:["Aucune : Kafka conserve les evenements indefiniment","Les evenements Kafka anterieurs a 7 jours sont perdus : ces objets ne seront jamais repliques automatiquement","La replication reprend automatiquement depuis le debut a la reconnexion","Backbeat bascule automatiquement sur un cluster de secours"],ans:1,expl:"Kafka a une retention de 7 jours par defaut. Apres 9 jours d\'indisponibilite, les 2 premiers jours d\'evenements sont definitivamente perdus. Pour recuperer ces objets, il faut utiliser crrExistingObjects.js avec TARGET_REPLICATION_STATUS=PENDING apres la remise en ligne du cluster destination."},
{q:"Quelle est la difference cle entre le mode Site-Level CRR (echo) et le mode Bucket-Level CRR ?",opts:["Site-level est synchrone, bucket-level est asynchrone","Site-level replique automatiquement tous les buckets et est incompatible Object Lock ; bucket-level est granulaire et compatible Object Lock","Site-level ne supporte pas Kafka, bucket-level si","Site-level est gratuit, bucket-level necessite une licence additionnelle"],ans:1,expl:"En mode site-level (echo), tout bucket cree sur la source est automatiquement replique, mais ce mode est incompatible avec Object Lock. En mode bucket-level, l\'admin configure la replication bucket par bucket via une policy IAM JSON — ce mode supporte Object Lock et permet une granularite fine."},
{q:"Lors d\'un DR Failback (la source principale est retablie apres un desastre), quelle commande permet de re-synchroniser les objets REPLICA vers la source ?",opts:["crrExistingObjects.js avec TARGET_REPLICATION_STATUS=FAILED","crrExistingObjects.js avec TARGET_REPLICATION_STATUS=REPLICA --force-using-configuration","backbeat-pause-ingestion.yml puis resume","Aucune : les REPLICA ne peuvent pas etre re-repliques"],ans:1,expl:"En cas de DR Failback, les objets sur le cluster destination ont le statut REPLICA. Le script crrExistingObjects.js avec TARGET_REPLICATION_STATUS=REPLICA et --force-using-configuration permet de les re-repliquer vers la source principale en utilisant la configuration CRR actuelle."},
{q:"La permission s3:ReplicateObject dans les policies IAM CRR est-elle obligatoire depuis quelle version ?",opts:["Depuis RING 7.x (toujours obligatoire)","Depuis RING 9.5.2.0 (non verifiee avant, maintenant enforced)","Seulement en mode Object Lock","Elle n\'est pas necessaire si on utilise le mode site-level"],ans:1,expl:"Avant RING 9.5.2.0, la permission s3:ReplicateObject n\'etait pas verifiee — la CRR fonctionnait meme sans elle. Depuis 9.5.2.0, elle est enforced et son absence cause des erreurs AccessDenied. C\'est une action pre-upgrade obligatoire documentee par Scality."},
{q:"Quel parametre Salt controle le nombre de workers paralleles dans le Queue Processor CRR ?",opts:["env_backbeat_replication_concurrency","env_backbeat_replication_workers","env_backbeat_kafka_consumer_batch_size","env_backbeat_queue_processor_threads"],ans:1,expl:"env_backbeat_replication_workers (defaut : 10) controle le parallelisme du Queue Processor CRR. A combiner avec env_backbeat_kafka_consumer_batch_size pour optimiser le debit. Augmenter ces valeurs accelere la replication mais consomme plus de CPU/RAM sur les noeuds S3."},
{q:"Ou sont stockes les certificats TLS (backbeat.crt, backbeat.key) utilises par la CRR ?",opts:["/etc/ssl/scality/certs/","/etc/scality/backbeat/certs/","/scality/ssd*1/s3/scality-frontend-s3/certs/","/var/scality/crr/certs/"],ans:2,expl:"Les certificats TLS CRR sont dans /scality/ssd*1/s3/scality-frontend-s3/certs/. backbeat.crt est le certificat serveur, backbeat.key la cle privee, backbeat-client.crt le certificat client pour les connexions sortantes vers le cluster destination. Ce chemin est sur le SSD de chaque noeud S3."}
]}
,
{id:'MF',num:'F',title:'SSE et Object Lock (WORM)',desc:'Chiffrement cote serveur : KMS interne, KMIP, AWS KMS. Object Lock Governance vs Compliance, contraintes CRR',
content:'<h2>SSE — Server-Side Encryption</h2><p>Le <strong>Server-Side Encryption (SSE)</strong> chiffre les objets au moment de leur stockage dans le RING. Le client envoie les donnees en clair (ou via TLS), Scality les chiffre avant de les ecrire sur disque. Le chiffrement est transparent pour le client S3.</p><h3>Architecture : Chiffrement Enveloppe</h3><div class="adiag">Principe du chiffrement enveloppe :\n\n  1. Objet a chiffrer\n         |\n         v\n  [Cloudserver]\n  - Genere une DATA KEY unique par objet (AES-256)\n  - Chiffre l\'objet avec la DATA KEY\n  - Demande au KMS de chiffrer la DATA KEY avec la MASTER KEY\n         |\n         v\n  [KMS (interne ou externe)]\n  - Retourne la DATA KEY chiffree (ne voit jamais l\'objet)\n         |\n         v\n  Stockage dans le RING :\n  - Objet chiffre (dans les fichiers DAT biziod)\n  - DATA KEY chiffree (dans les metadonnees repd)\n  - MASTER KEY ID (reference vers le KMS)\n\nPour dechiffrer :\n  - Cloudserver recupere la data key chiffree depuis repd\n  - Le KMS dechiffre la data key avec la master key\n  - Cloudserver dechiffre l\'objet avec la data key\n  -> L\'objet en clair est retourne au client</div><h3>Types de KMS supportes</h3><table><tr><th>Type</th><th>Description</th><th>Production ?</th></tr><tr><td><strong>KMS Interne Scality</strong></td><td>Master key stockee dans les metadonnees Scality. Simple a deployer.</td><td>NON recommande en production — la master key est dans le meme systeme que les donnees.</td></tr><tr><td><strong>AWS KMS (API)</strong></td><td>Utilise l\'API AWS KMS pour generer et gerer les master keys. Necessite une connexion vers AWS.</td><td>Oui — pour les environnements cloud hybrides.</td></tr><tr><td><strong>KMIP externe (cluster HA)</strong></td><td>Protocole standard Key Management Interoperability Protocol. Compatible : Thales CipherTrust, HashiCorp Vault, Hytrust KeyControl. Cluster HA depuis 9.5.0.</td><td>Oui — recommande en production on-premise.</td></tr></table><h3>Modes de configuration SSE</h3><p><strong>Chiffrement global</strong> : la variable <code>global_encryption_enabled: true</code> force AES-256 sur tous les nouveaux buckets. Les anciens buckets non chiffres ne sont pas affectes.</p><p><strong>Clé par compte vs par bucket</strong> : <code>env_default_encryption_key_per_account: true</code> associe une seule master key par compte (AWS KMS uniquement), simplifiant la gestion lors de la suppression de comptes.</p><p><strong>Coexistence interne + externe</strong> (depuis 9.5.0) : possible d\'avoir des buckets avec KMS interne et d\'autres avec KMS externe dans le meme cluster, sans migration des objets existants.</p><h3>Migration SSE</h3><p class="alert-w"><strong>Attention :</strong> Changer de KMS est une operation delicate. Les master keys actuelles doivent etre disponibles dans le nouveau KMS avec les <strong>memes key IDs</strong>. Sinon, les donnees chiffrees avec les anciennes master keys deviennent inaccessibles. Procedure : exporter les master keys de l\'ancien KMS → importer dans le nouveau avec les memes IDs → reconfigurer Scality.</p><h2>Object Lock — WORM</h2><p>L\'<strong>Object Lock</strong> (Write Once Read Many) garantit qu\'un objet ne peut pas etre modifie ou supprime pendant une periode definie. Utilise pour la conformite reglementaire (SEC 17a-4, CFTC, FINRA, GDPR).</p><h3>Activation et contraintes</h3><ul><li>Object Lock ne peut etre active qu\'a la <strong>creation du bucket</strong> (irréversible)</li><li>Le <strong>versioning est automatiquement active</strong> avec Object Lock</li><li>Incompatible avec le mode <strong>Site-Level CRR (echo)</strong></li><li>Compatible avec le mode <strong>Bucket-Level CRR</strong> (permission <code>s3:ReplicateObject</code> requise)</li></ul><h3>Modes de retention</h3><table><tr><th>Mode</th><th>Qui peut supprimer ?</th><th>Cas d\'usage</th></tr><tr><td><strong>Governance</strong></td><td>Les utilisateurs avec la permission <code>s3:BypassGovernanceRetention</code> peuvent modifier ou supprimer avant la fin de la periode. L\'admin peut egalement desactiver le mode.</td><td>Protection standard avec flexibilite admin. Audit, tests de conformite.</td></tr><tr><td><strong>Compliance</strong></td><td><strong>Personne</strong> ne peut supprimer ni modifier, pas meme le root du compte ou l\'admin Scality, avant la fin de la periode de retention.</td><td>Conformite reglementaire stricte (finance, sante, juridique). Immuabilite totale.</td></tr></table><h3>Legal Hold</h3><p>Le <strong>Legal Hold</strong> (<code>s3:PutObjectLegalHold</code>) est un verrou independant de la periode de retention. Il bloque toute suppression sans date d\'expiration — utile pour les litigations juridiques. Seul le retrait explicite du Legal Hold debloque la suppression.</p><div class="adiag">Combinaisons possibles :\n\n  Retention Governance + Legal Hold :\n    -> Suppression bloquee jusqu\'a fin retention ET retrait Legal Hold\n\n  Retention Compliance (5 ans) + Legal Hold :\n    -> Suppression impossible avant 5 ans ET retrait Legal Hold\n    -> Meme le root du compte ne peut pas supprimer\n\n  Legal Hold seul (sans retention) :\n    -> Suppression bloquee jusqu\'au retrait explicite du Legal Hold\n    -> Pas de date d\'expiration automatique</div><div class="kbox"><h3>Points Cles a Retenir</h3><ul><li>SSE = chiffrement enveloppe : data key unique par objet, chiffree par master key dans le KMS</li><li>KMS interne = non recommande en prod (master key dans le meme systeme)</li><li>KMIP (Thales, HashiCorp Vault...) = recommande en production on-premise, cluster HA depuis 9.5.0</li><li>global_encryption_enabled: true = AES-256 sur tous les nouveaux buckets</li><li>Object Lock = activation a la creation du bucket UNIQUEMENT (irreversible)</li><li>Governance = admin peut bypass ; Compliance = personne ne peut supprimer (immuabilite totale)</li><li>Legal Hold = verrou sans date, independant de la periode de retention</li><li>Object Lock incompatible avec Site-Level CRR (echo mode)</li></ul></div>',
quiz:[
{q:"Dans le chiffrement enveloppe utilise par Scality SSE, qu\'est-ce que le KMS chiffre exactement ?",opts:["L\'objet entier directement","La data key unique par objet (pas l\'objet lui-meme)","Les metadonnees S3 uniquement","Le checksum MD5 de l\'objet"],ans:1,expl:"Le KMS ne voit jamais les donnees de l\'objet. Il chiffre uniquement la DATA KEY (cle de donnees unique par objet, generee par Cloudserver). L\'objet est chiffre localement par Cloudserver avec la data key. Seule la data key chiffree est stockee dans les metadonnees repd avec un reference vers le KMS."},
{q:"Quel type de KMS est recommande en production on-premise pour Scality RING 9.5 ?",opts:["KMS interne Scality (le plus simple)","AWS KMS (via API)","KMIP externe en cluster HA (Thales CipherTrust, HashiCorp Vault...)","Aucun chiffrement n\'est recommande en production"],ans:2,expl:"Le KMS interne Scality stocke la master key dans les metadonnees Scality — le 'gardien' et les donnees sont dans le meme systeme, ce qui reduit la securite. En production on-premise, Scality recommande un KMS KMIP externe (Thales CipherTrust, HashiCorp Vault, Hytrust KeyControl) en cluster HA, disponible depuis RING 9.5.0."},
{q:"Un bucket S3 a ete cree sans Object Lock. L\'equipe de conformite demande de l\'activer pour ce bucket. Que faire ?",opts:["Activer Object Lock via la console Scality","Impossible : Object Lock ne peut etre active qu\'a la creation du bucket","Supprimer et recreer le bucket avec Object Lock","Contacter le support Scality pour une activation post-creation"],ans:1,expl:"Object Lock est une propriete irreversible qui ne peut etre configuree qu\'au moment de la creation du bucket. Un bucket existant sans Object Lock ne peut pas l\'obtenir. La seule solution est de creer un nouveau bucket avec Object Lock active, puis de migrer les donnees (et activer CRR pour la transition si necessaire)."},
{q:"Quelle est la difference entre le mode Compliance et le mode Governance de l\'Object Lock ?",opts:["Compliance est temporaire, Governance est permanent","En Compliance, personne (pas meme l\'admin) ne peut supprimer avant la fin de retention ; en Governance, les admins avec s3:BypassGovernanceRetention le peuvent","Compliance s\'applique aux versions, Governance aux delete markers","Governance necessite KMIP, Compliance fonctionne avec le KMS interne"],ans:1,expl:"C\'est la difference fondamentale. En mode Compliance, l\'immuabilite est totale — meme le root du compte ou l\'administrateur Scality ne peuvent pas supprimer l\'objet avant la fin de la periode de retention. C\'est ce mode qui est requis pour les conformites reglementaires strictes (SEC 17a-4, FINRA). En mode Governance, les utilisateurs privilegies peuvent contourner la protection."},
{q:"Un objet est sous Object Lock Compliance (3 ans restants) ET un Legal Hold est active. Quand peut-il etre supprime ?",opts:["Dans 3 ans (Legal Hold ne change rien)","Jamais (Legal Hold est permanent)","Quand le Legal Hold est retire ET apres la fin des 3 ans de retention","Des que le Legal Hold est retire, la retention ne compte plus"],ans:2,expl:"Les deux protections sont cumulatives et independantes. L\'objet ne peut etre supprime que quand LES DEUX conditions sont levees : (1) le Legal Hold doit etre explicitement retire via s3:PutObjectLegalHold, ET (2) la periode de retention Compliance de 3 ans doit etre ecoulee. Le Legal Hold n\'a pas de date d\'expiration automatique."},
{q:"La variable global_encryption_enabled: true est activee sur un cluster. Que se passe-t-il pour les anciens buckets non chiffres ?",opts:["Tous les anciens objets sont chiffres automatiquement","Les anciens buckets et objets ne sont pas affectes (seuls les NOUVEAUX buckets sont chiffres)","Une erreur est retournee au demarrage du cluster","Les GET sur les anciens objets echouent avec une erreur de dechiffrement"],ans:1,expl:"La variable global_encryption_enabled: true s\'applique uniquement aux nouveaux buckets crees apres son activation. Les buckets existants et leurs objets restent dans leur etat (non chiffres). Il n\'y a pas de migration automatique des donnees existantes. Pour chiffrer les anciens objets, il faudrait les copier vers de nouveaux buckets chiffres."}
]}
,
{id:'MG',num:'G',title:'Multi-site et Disaster Recovery',desc:'Topologies stretched vs asynchrone, Warm Standby (WSB), procedures de failover/failback, bseq de rattrapage',
content:'<h2>Topologies Multi-Sites Scality</h2><p>Scality RING supporte deux paradigmes de deploiement multi-sites fondamentalement differents :</p><table><tr><th>Modele</th><th>RPO</th><th>Basculement</th><th>Description</th></tr><tr><td><strong>Stretched (geo-etire)</strong></td><td>0 (synchrone)</td><td>Automatique (secondes)</td><td>Un seul RING logique reparti physiquement sur 2 ou 3 sites. Les ecritures sont synchrones entre sites. La perte d\'un site ne cause pas de perte de donnees.</td></tr><tr><td><strong>Asynchrone (CRR)</strong></td><td>Non nul (minutes)</td><td>Manuel</td><td>Deux RINGs independants avec replication asynchrone via CRR/Backbeat. RPO = temps de lag de replication. Basculement manuel require.</td></tr></table><h3>Topologies Stretched Supportees</h3><div class="adiag">Topologies geographiques supportees (Stretched) :\n\n  3 SITES (failover automatique si 1 site tombe) :\n  Site A (4 serveurs) + Site B (4 serveurs) + Site C (4 serveurs)\n  -> Perte d\'un site : quorum maintenu (2/3 sites)\n  -> 12 serveurs minimum\n\n  2 SITES + WITNESS :\n  Site A (majority : 5 md) + Site B (minority : 3 md) + Site C (1 witness)\n  -> Witness = ZooKeeper seul, pas de donnees\n  -> Perte du Site B : failover automatique (majority + witness)\n  -> Perte du Site A : failover manuel requis\n  -> 9 serveurs minimum + 1 witness\n\n  Metadata S3 (repd) :\n  5 noeuds actifs (md1 a md5) + 1 Warm Standby (wsb1)\n  Les noeuds sont repartis entre les sites selon la topologie</div><h2>Warm Standby (WSB)</h2><p>Le <strong>Warm Standby</strong> est un noeud metadata passif qui suit en "shadow" un noeud actif. Il est pre-configure mais n\'est pas membre actif des sessions Raft.</p><table><tr><th>Aspect</th><th>Noeud Actif (md)</th><th>Warm Standby (wsb)</th></tr><tr><td>Nom dans l\'inventaire</td><td><code>md1-cluster1</code></td><td><code>wsb1-cluster1</code></td></tr><tr><td>Membre Raft</td><td>Oui (vote pour les elections)</td><td>Non (spectateur, suit le journal)</td></tr><tr><td>Trafic S3</td><td>Oui (serveur des requetes)</td><td>Non (aucun trafic en mode standby)</td></tr><tr><td>Activation</td><td>Toujours actif</td><td>Activate via Ansible (<code>-t DR</code>) en cas de perte de site</td></tr></table><h3>Metriques de suivi du rattrapage : bseq</h3><p>La metrique <code>bseq</code> (backup sequence) indique le dernier index du journal Raft copie sur un noeud. Elle est critique pour valider qu\'un noeud (ou WSB) a bien rattrape le leader avant d\'activer un basculement :</p><pre># Verifier les sequences Raft de tous les noeuds\ncurl -s http://prometheus:9090/api/v1/query \\\n  \'?query=s3_metadata_stateful_raft_bseq\'\n\n# Un noeud est "a jour" quand son bseq = cseq du leader\n# Pendant le rattrapage : bseq < cseq (ecart decreissant)</pre><h2>Procedures de Failover et Failback</h2><h3>Perte du site MINORITY (scenario simple)</h3><div class="adiag">Etat initial : Site A (majority) + Site B (minority, DOWN)\n\n  md1-cluster1 (Site A) : LEADER  [UP]\n  md2-cluster1 (Site A) : follower [UP]\n  md3-cluster1 (Site A) : follower [UP]\n  md4-cluster1 (Site B) : follower [DOWN] <- site perdu\n  md5-cluster1 (Site B) : follower [DOWN] <- site perdu\n  wsb1-cluster1 (Site B): standby  [DOWN]\n\n  Quorum = 3/5 = OK (majority intact)\n  Impact : warnings mais le S3 continue a fonctionner\n  Action : reparer ou remplacer les noeuds Site B</div><h3>Perte du site MAJORITY (scenario critique)</h3><div class="adiag">Etat : Site A (majority, DOWN) + Site B (minority)\n\n  md1 a md3 (Site A) : [DOWN]\n  md4-cluster1 (Site B) : follower [UP]\n  md5-cluster1 (Site B) : follower [UP]\n  wsb1-cluster1 (Site B): standby  [UP]\n\n  Quorum = 2/5 < 3 = PERDU -> S3 bloque !\n\n  Procedure de DR (failover vers Site B) :\n  1. Verifier que wsb1 a un bseq recent (pas trop de lag)\n  2. ansible-playbook ... -t DR  # active wsb1 comme membre Raft\n  3. ZooKeeper reconfigure : 5 -> 3 participants\n  4. Nouveau quorum = 2/3 noeuds = OK\n  5. Redis Sentinel reset : redis-cli sentinel reset scality-s3\n  6. S3 reprend sur Site B seul\n\n  RTO : quelques minutes a quelques heures</div><h3>Failback — Retour a la normale</h3><p>Apres la restauration du site majority (Site A) :</p><ol><li>Verifier les stats Backbeat CRR (backlog proche de zero) avant de basculer</li><li>Arreter les containers S3 sur Site B (avant de reajouter Site A pour eviter des corruptions metadata)</li><li>Rejoindre les noeuds Site A comme followers (bseq doit rattraper le leader)</li><li>Attendre que bseq soit a parite avec cseq sur tous les noeuds Site A</li><li>Utiliser <code>crrExistingObjects.js --target-replication-status REPLICA</code> pour re-synchroniser les objets crees pendant le DR</li><li>Rebasculer le leader vers Site A (optionnel, le RING se reequilibre seul)</li><li>Desactiver wsb1 et le remettre en mode standby</li></ol><p class="alert-d"><strong>Critique :</strong> Ne jamais reajouter le site recupere sans s\'assurer que les containers S3 sont arretes dessus. Un site qui "revient" avec des donnees plus anciennes et qui commence a repondre aux requetes peut creer des corruptions metadata (split brain).</p><div class="kbox"><h3>Points Cles a Retenir</h3><ul><li>Stretched = 1 RING logique, synchrone, RPO=0, failover auto (3 sites) ou manuel (2 sites)</li><li>Asynchrone (CRR) = 2 RINGs independants, RPO non nul, failover toujours manuel</li><li>WSB (Warm Standby) = noeud passif pre-configure, active via Ansible -t DR</li><li>bseq = backup sequence : metrique pour verifier le rattrapage d\'un noeud apres une panne</li><li>Perte minority = quorum maintenu, S3 continue ; perte majority = DR obligatoire</li><li>Failback : toujours arreter les containers sur le site recupere AVANT de le reajouter</li><li>Redis Sentinel reset obligatoire apres failover : redis-cli sentinel reset scality-s3</li></ul></div>',
quiz:[
{q:"Quelle est la difference fondamentale entre un deploiement 'stretched' et un deploiement 'asynchrone (CRR)' en termes de RPO ?",opts:["Aucune difference, les deux ont RPO=0","Stretched = RPO=0 (synchrone) ; CRR = RPO non nul (minutes de lag)","Stretched = RPO de quelques secondes ; CRR = RPO=0","CRR a toujours un meilleur RPO que le stretched"],ans:1,expl:"En mode stretched, le RING est un systeme distribue synchrone : les ecritures sont confirmees sur plusieurs sites simultanement, donc RPO=0. En mode CRR, la replication est asynchrone : il y a un delai entre l\'ecriture source et la copie destination. Le RPO correspond au lag de replication Backbeat — typiquement quelques minutes."},
{q:"Qu\'est-ce qu\'un noeud Warm Standby (WSB) dans une architecture Scality multi-sites ?",opts:["Un noeud de stockage de secours pour les donnees","Un noeud metadata passif pre-configure qui suit le journal Raft sans etre membre actif, active via Ansible en cas de perte de site","Un backup du Supervisor","Un replica Redis en mode veille"],ans:1,expl:"Le WSB (wsb1-clusterX) est un noeud metadata pre-configure sur le site minority. Il suit le journal Raft du cluster sans participer aux votes (pas membre actif). En cas de perte du site majority, l\'admin active le WSB via un playbook Ansible (-t DR) pour restaurer le quorum Raft sur le site survivant."},
{q:"Pourquoi la metrique 'bseq' est-elle critique lors d\'un failback (retour du site primary apres un DR) ?",opts:["Elle mesure la bande passante reseau entre les sites","Elle indique si un noeud a rattrape le journal Raft du leader, evitant un split brain avec des donnees obsoletes","Elle compte le nombre d\'objets repliques par CRR","Elle indique la duree restante avant que Kafka perde des evenements"],ans:1,expl:"bseq (backup sequence) est le dernier index du journal Raft copie sur un noeud. Si bseq d\'un noeud recupere est en retard par rapport au cseq du leader, le noeud a des metadonnees obsoletes. L\'ajouter au cluster avant que bseq soit a parite peut causer des corruptions (split brain). Il faut attendre que bseq rejoigne cseq avant de le reajouter."},
{q:"Lors d\'un failover apres perte du site majority, quelle commande Redis est obligatoire apres l\'activation du WSB ?",opts:["redis-cli FLUSHALL","redis-cli sentinel reset scality-s3","redis-cli BGSAVE","redis-cli CONFIG REWRITE"],ans:1,expl:"Apres un failover qui change la topologie des noeuds metadata, Redis Sentinel doit etre reinitialise pour prendre en compte la nouvelle topologie. La commande 'redis-cli sentinel reset scality-s3' force les sentinels a reconstruire leur vision du cluster Redis. Sans cela, Sentinel peut tenter de reconnaitre des masters qui n\'existent plus."},
{q:"Lors d\'un failback, le site primary recupere est mis en ligne. Quelle action doit etre effectuee EN PREMIER ?",opts:["Demarrer les containers S3 sur le site recupere pour reprendre le trafic","Arreter les containers S3 sur le site recupere AVANT de le reajouter au cluster","Executer crrExistingObjects.js depuis le site recupere","Reinitialiser Redis Sentinel sur le site recupere"],ans:1,expl:"C\'est la regle de securite critique du failback. Si les containers S3 du site recupere demarrent avec des metadonnees obsoletes (antecedentes au DR), ils peuvent repondre aux requetes S3 avec des donnees incorrectes et causer un split brain. Il faut d\'abord arreter tous les containers S3 sur le site recupere, le reajouter comme follower, attendre que bseq rattrape le leader, PUIS redemarrer les containers."}
]}
,
{id:'MH',num:'H',title:'Features Avancees S3',desc:'Lifecycle policies, UTAPI/SUR (metriques facturation), rate limiting, S3 Analytics ClickHouse, Server Access Logging, Bucket Notifications',
content:'<h2>Lifecycle Policies — Expiration Automatique</h2><p>Les <strong>lifecycle policies</strong> permettent d\'automatiser la gestion du cycle de vie des objets S3 : expiration automatique, suppression de versions, nettoyage des uploads incomplets. Elles sont configurees en JSON compatible AWS.</p><h3>Operations disponibles</h3><table><tr><th>Action</th><th>Description</th></tr><tr><td><strong>Expire</strong></td><td>Supprime les objets apres N jours ou a une date donnee. Sur bucket versionne : cree un delete marker.</td></tr><tr><td><strong>NoncurrentVersionExpiration</strong></td><td>Supprime les anciennes versions d\'objets apres N jours de non-currentite.</td></tr><tr><td><strong>ExpireObjectDeleteMarkers</strong></td><td>Supprime les delete markers "orphelins" (qui n\'ont plus aucune version sous eux).</td></tr><tr><td><strong>AbortIncompleteMultipartUpload</strong></td><td>Abandonne les MPUs incomplets apres N jours. Critique pour liberer l\'espace des uploads abandonnes.</td></tr></table><h3>Exemple de policy JSON</h3><pre>{\n  "Rules": [\n    {\n      "ID": "expire-old-versions",\n      "Status": "Enabled",\n      "Filter": {"Prefix": "archive/"},\n      "NoncurrentVersionExpiration": {"NoncurrentDays": 30}\n    },\n    {\n      "ID": "cleanup-failed-uploads",\n      "Status": "Enabled",\n      "Filter": {},\n      "AbortIncompleteMultipartUpload": {"DaysAfterInitiation": 7}\n    }\n  ]\n}</pre><p class="alert-i"><strong>Filtrage par tag :</strong> Les regles avec filtre par tag sont plus couteuses — elles necessitent des appels metadata supplementaires pour lire les tags de chaque objet. Privilegier les filtres par prefixe quand c\'est possible.</p><p><strong>Exclusions :</strong> La variable <code>env_backbeat_lifecycle_conductor_filter_enabled</code> permet d\'exclure des buckets ou comptes entiers du scan lifecycle — utile pour les buckets a tres forte activite.</p><p class="alert-w"><strong>Attention :</strong> Les suppressions par lifecycle ne generent <strong>pas</strong> d\'evenements <code>ObjectRemoved</code> dans les Bucket Notifications. Utiliser <code>LifecycleExpiration:Delete</code> a la place.</p><h2>UTAPI et SUR — Metriques de Consommation</h2><p>Scality propose deux services complementaires pour mesurer la consommation de stockage S3, essentiels en environnement <strong>multi-tenant</strong> (facturation par compte ou bucket).</p><table><tr><th>Service</th><th>Role</th><th>Usage</th></tr><tr><td><strong>UTAPI v2</strong></td><td>API REST authentifiee (SigV4) qui expose : nombre d\'objets, octets stockes, bande passante, operations — par compte, bucket ou utilisateur.</td><td>Facturation, rapports de consommation. Permission IAM : <code>utapi:ListMetrics</code>.</td></tr><tr><td><strong>SUR</strong> (Scality Utilization Reporting, depuis 9.5.0)</td><td>Service plus robuste qui ingere le journal Raft de chaque session pour calculer la consommation. Dispose d\'un mode "Repair" (scan complet) active automatiquement au premier demarrage.</td><td>Reporting de stockage fiable. Incompatible avec une migration de bucket en cours.</td></tr></table><p><strong>Quotas par compte :</strong> <code>vaultclient create-account --quota &lt;bytes&gt;</code> (0 = pas de quota). Enforces en temps reel par UTAPI v2.</p><h2>Rate Limiting par Bucket (depuis 9.5.2.0)</h2><p>Le rate limiting par bucket protege les SLAs en evitant qu\'un tenant "bruyant" sature le cluster pour les autres. Configure via une API REST avec un utilisateur service dedie.</p><table><tr><th>Parametre</th><th>Description</th></tr><tr><td><code>rate_limiting_default_bucket_rps_limit</code></td><td>Limite en requetes par seconde (RPS) par bucket par defaut.</td></tr><tr><td><code>rate_limiting_default_burst_capacity</code></td><td>Capacite de burst (pics courts toleres au-dessus de la limite).</td></tr><tr><td><code>rate_limiting_bucket_config_cache_ttl</code></td><td>TTL du cache de configuration (ms). Un changement de limite peut prendre jusqu\'a 30 secondes a se propager.</td></tr></table><p>Un depassement de limite retourne <strong>HTTP 429 "SlowDown"</strong> — identique au comportement AWS S3, donc transparent pour les clients compatibles AWS.</p><h2>S3 Analytics — ClickHouse (depuis 9.5.0)</h2><p><strong>S3 Analytics</strong> collecte toutes les operations S3 depuis CloudServer, les envoie via <strong>FluentBit</strong> a <strong>ClickHouse</strong> (base de donnees columnaire OLAP). Il alimente les dashboards Grafana de monitoring S3 et de Lifecycle.</p><ul><li>Remplace completement Elasticsearch/Logstash (deprecated depuis 9.5.0)</li><li>6 noeuds recommandes pour 500 millions operations/jour</li><li>100 GB minimum de stockage par noeud</li><li>ZooKeeper coordonne les noeuds ClickHouse</li><li>Extension par shards <strong>irreversible</strong></li></ul><h2>Server Access Logging (depuis 9.5.2.0)</h2><p>Le <strong>Server Access Logging (SAL)</strong> enregistre toutes les requetes S3 sur un bucket source et les ecrit sous forme d\'objets dans un bucket cible. Utile pour l\'audit et la facturation.</p><ul><li>Pipeline : CloudServer → FluentBit → log-courier → bucket cible</li><li>Livraison asynchrone par batch — pas d\'ordre garanti, possible duplication</li><li>Le bucket cible ne devrait <strong>pas etre le meme</strong> que la source (feedback loop)</li></ul><h2>Bucket Notifications</h2><p>Les <strong>Bucket Notifications</strong> envoient des evenements S3 vers des queues externes (style SNS) lorsque des operations sont effectuees sur un bucket.</p><table><tr><th>Evenement</th><th>Declenche par</th></tr><tr><td><code>ObjectCreated:*</code></td><td>PUT, POST, COPY, CompleteMultipartUpload</td></tr><tr><td><code>ObjectRemoved:*</code></td><td>DELETE explicite par un client (pas par lifecycle)</td></tr><tr><td><code>LifecycleExpiration:Delete</code></td><td>Suppression par une regle lifecycle Expire</td></tr><tr><td><code>LifecycleExpiration:DeleteMarkerCreated</code></td><td>Creation d\'un delete marker par lifecycle</td></tr><tr><td><code>ObjectTagging:Put / Delete</code></td><td>Modification des tags d\'un objet</td></tr></table><p>Le format ARN de destination Scality : <code>arn:scality:bucketnotif:::nom_destination</code>. Backend : Kafka.</p><h2>Terraform Provider pour S3 Scality</h2><p>Scality fournit un <strong>provider Terraform officiel</strong> pour provisionner des ressources S3 (buckets, comptes IAM, policies) en infrastructure-as-code. Disponible sur <code>github.com/scality/scality-s3-tf-modules</code>.</p><h3>Ressources supportees</h3><table><tr><th>Ressource Terraform</th><th>Equivalent S3</th></tr><tr><td><code>scality_s3_bucket</code></td><td>Creation/configuration de bucket (versioning, lifecycle, ACL)</td></tr><tr><td><code>scality_iam_account</code></td><td>Compte IAM Vault</td></tr><tr><td><code>scality_iam_user</code></td><td>Utilisateur IAM avec access key/secret key</td></tr><tr><td><code>scality_iam_policy</code></td><td>Policy IAM JSON (Allow/Deny)</td></tr></table><pre># Exemple de configuration Terraform\nterraform {\n  required_providers {\n    scality = {\n      source = "scality/s3"\n    }\n  }\n}\n\nresource "scality_s3_bucket" "mon_bucket" {\n  bucket = "mon-bucket-prod"\n  versioning_enabled = true\n  lifecycle_rules = [...]\n}</pre><p class="alert-i"><strong>Cas d\'usage :</strong> Provisionnement automatise de centaines de buckets S3 avec des configurations standardisees (lifecycle, ACL, notifications). Utile dans les environnements DevOps avec GitOps et CI/CD.</p><div class="kbox"><h3>Points Cles a Retenir</h3><ul><li>Lifecycle : Expire, NoncurrentVersionExpiration, ExpireDeleteMarkers, AbortIncompleteMultipartUpload</li><li>Filtre tag = couteux (appels metadata extra) ; privilegier les filtres prefix</li><li>Lifecycle ne genere pas ObjectRemoved → utiliser LifecycleExpiration:Delete dans les Notifications</li><li>UTAPI = API facturation (RPS par compte/bucket) ; SUR = reporting robuste via journal Raft</li><li>Rate limiting = HTTP 429 SlowDown ; propagation config jusqu\'a 30s (cache TTL)</li><li>S3 Analytics = ClickHouse remplace Elasticsearch depuis 9.5.0</li><li>SAL = audit logs par bucket, batch asynchrone, pas de duplication garantie</li></ul></div>',
quiz:[
{q:"Un bucket S3 versionne accumule des millions de delete markers apres de nombreuses suppressions. Quelle regle lifecycle permet de les supprimer automatiquement ?",opts:["Expire avec NoncurrentDays: 0","NoncurrentVersionExpiration","ExpireObjectDeleteMarkers (Expire orphan Delete Markers)","AbortIncompleteMultipartUpload"],ans:2,expl:"ExpireObjectDeleteMarkers supprime les delete markers 'orphelins' — ceux qui n\'ont plus aucune version non-current sous eux. Ces markers orphelins s\'accumulent apres des suppressions sur des buckets versionnes et consomment de l\'espace. AbortIncompleteMultipartUpload nettoie les uploads incomplets, NoncurrentVersionExpiration supprime les anciennes versions d\'objets."},
{q:"Un client signale que ses objets uploadles entre minuit et 1h sont manquants dans les Server Access Logs. Quelle est l\'explication la plus probable ?",opts:["Un bug du service SAL","Normal : SAL est asynchrone par batch, les logs peuvent etre livres avec du retard ou des lacunes","Le bucket source et le bucket cible sont le meme","SAL ne supporte pas les uploads MPU"],ans:1,expl:"Server Access Logging est asynchrone et delivre les logs par batch sans garantie d\'ordre ni de livraison complete. Des lacunes temporaires sont normales — les logs peuvent etre livres avec du retard. Le manuel Scality precise qu\'il n\'y a pas de garantie de non-duplication ni d\'ordre inter-objets. SAL ne doit pas etre utilise comme source de verite absolue pour l\'audit."},
{q:"Quelle est la difference entre UTAPI et SUR dans Scality RING 9.5 ?",opts:["Ce sont deux noms pour le meme service","UTAPI = API de facturation en temps reel ; SUR = reporting robuste asynchrone via journal Raft, depuis 9.5.0","UTAPI mesure le stockage, SUR mesure la bande passante","SUR = UTAPI v1 (deprecated), UTAPI = v2 (actuel)"],ans:1,expl:"UTAPI (UTilization API) est une API REST qui expose les metriques de consommation en temps reel par compte/bucket/utilisateur — principal outil de facturation multi-tenant. SUR (Scality Utilization Reporting, depuis 9.5.0) est un service complementaire plus robuste qui ingere le journal Raft des sessions metadata de facon asynchrone pour calculer la consommation. SUR a un mode 'Repair' (scan complet) active au premier demarrage."},
{q:"Un client recoit des erreurs HTTP 429 'SlowDown' depuis quelques minutes sur un bucket specifique. Que signifie cette erreur ?",opts:["La connexion reseau est saturee","Le rate limiting par bucket a ete atteint : la limite RPS configuree pour ce bucket est depassee","Le cluster RING est en mode maintenance","Vault est indisponible (erreur d\'authentification)"],ans:1,expl:"HTTP 429 SlowDown est le code retourne par le rate limiting de bucket Scality (disponible depuis 9.5.2.0). La limite RPS configuree pour ce bucket specifique a ete depassee. Cette erreur est identique au comportement AWS S3, donc les clients compatibles AWS gerent generalement le retry automatiquement avec backoff exponentiel."},
{q:"S3 Analytics dans RING 9.5 utilise quel backend de stockage pour les logs d\'operations S3 ?",opts:["Elasticsearch","Redis","ClickHouse (base columnaire OLAP)","Une base PostgreSQL sur le Supervisor"],ans:2,expl:"Depuis RING 9.5.0, S3 Analytics utilise ClickHouse, une base de donnees columnaire OLAP (Online Analytical Processing) qui remplace Elasticsearch et Logstash (tous deux deprecated en 9.5.0). Les logs CloudServer transitent via FluentBit vers ClickHouse. ZooKeeper coordonne les noeuds ClickHouse pour la synchronisation."},
{q:"Une notification bucket est configuree avec l\'evenement ObjectRemoved. Des objets sont supprimes par une regle lifecycle Expire. Les notifications sont-elles envoyees ?",opts:["Oui, ObjectRemoved couvre toutes les suppressions","Non : les suppressions par lifecycle ne generent pas ObjectRemoved — il faut utiliser LifecycleExpiration:Delete","Oui, mais avec un delai de 5 minutes","Cela depend de la version de RING (comportement change en 9.5.1)"],ans:1,expl:"C\'est un comportement important et contre-intuitif. Les suppressions via lifecycle ne declenchent PAS l\'evenement ObjectRemoved. Pour recevoir des notifications lors de suppressions par lifecycle, il faut configurer les evenements LifecycleExpiration:Delete (suppression d\'objet) et LifecycleExpiration:DeleteMarkerCreated (creation d\'un delete marker sur bucket versionne)."},
{q:"Le Terraform Provider Scality S3 (scality-s3-tf-modules) permet de provisionner quels types de ressources ?",opts:["Uniquement les buckets S3","Buckets S3, policies IAM, roles et groupes d'utilisateurs","Uniquement les comptes IAM","La configuration du RING lui-meme (nodes, keyspace)"],ans:1,expl:"Le Terraform Provider Scality S3 (github.com/scality/scality-s3-tf-modules) supporte les ressources bucket (avec policies, versioning, lifecycle, CORS) et IAM (comptes, roles, groupes, policies). Il ne gere pas la configuration infrastructure du RING, qui reste sous SaltStack."}
]}
,
{id:'MI',num:'I',title:'Infrastructure, Ports et Cycle de Vie Produit',desc:'Prerequis materiels et OS, tuning systeme, ports reseau par service, Platformcheck, versions supportees, breaking changes',
content:'<h2>Prerequis Materiels et Dimensionnement</h2><h3>Noeuds de Stockage (obligatoirement physiques)</h3><p>Les noeuds de stockage RING <strong>ne peuvent pas etre des VMs</strong>. Ils doivent etre des serveurs physiques baremetal.</p><table><tr><th>Composant</th><th>Exigence</th></tr><tr><td>RAM</td><td>128 GB minimum</td></tr><tr><td>Disques OS</td><td>~500 GB, 2 HDDs en RAID 1</td></tr><tr><td>Disques DATA</td><td>4 TB+ par disque, HDDs 7200 rpm, RAID 0 individuel. Cache write-back avec BBU obligatoire.</td></tr><tr><td>Disques Metadata</td><td>2 SSD/NVMe 480 GB+ en RAID 0, ext4, montes avant installation. PatrolRead DESACTIVE.</td></tr><tr><td>Reseau RING</td><td>2 x 10 Gb/s LACP 802.3ad layer3+4, lacp_rate=fast</td></tr><tr><td>Alimentation</td><td>Double PSU obligatoire</td></tr></table><p class="alert-d"><strong>RAID 0 sur les disques DATA :</strong> Chaque disque DATA est en RAID 0 individuel (pas de RAID entre disques). La protection des donnees est assuree par le RING lui-meme (ARC/COS), pas par le RAID. <strong>PatrolRead doit etre desactive</strong> sur tous les controleurs RAID — il cause des ralentissements IO impactant les performances.</p><h3>Noeuds S3 Connector</h3><table><tr><th>Composant</th><th>Exigence minimale</th></tr><tr><td>RAM</td><td>32 GB</td></tr><tr><td>Disques OS</td><td>2000 GB+ RAID 1 (dont 400 GB+ pour /var/log)</td></tr><tr><td>CPU</td><td>8 vCPUs minimum. 12-24 cores selon le feature set (UTAPI, CRR, SSE = "advanced")</td></tr><tr><td>Reseau frontend</td><td>2 x 10 Gb/s LACP (vers clients S3)</td></tr><tr><td>Reseau backend</td><td>2 x 10 Gb/s LACP (vers le RING)</td></tr></table><h3>Supervisor</h3><table><tr><th>Composant</th><th>Exigence</th></tr><tr><td>RAM</td><td>16 GB (32+ si >12 serveurs)</td></tr><tr><td>Disques</td><td>500 GB RAID 1</td></tr><tr><td>CPU</td><td>4 vCPUs</td></tr><tr><td>Deploiement</td><td>VM avec failover hyperviseur recommande</td></tr></table><h2>OS et Tuning Systeme</h2><h3>Systemes d\'exploitation supportes (RING 9.5.2.3)</h3><table><tr><th>OS</th><th>Version</th><th>Statut</th></tr><tr><td>RHEL</td><td>8.10</td><td>Supporte et valide</td></tr><tr><td>Rocky Linux</td><td>8.10</td><td>Supporte et valide</td></tr><tr><td>RHEL</td><td>9.6 / 9.7</td><td>Supporte</td></tr><tr><td>Rocky Linux</td><td>9.6 / 9.7</td><td>Supporte</td></tr><tr><td>RHEL 7 / CentOS 7</td><td>Toutes</td><td>EOL depuis juin 2024 — NON supporte</td></tr></table><p>Architecture CPU : <strong>x86-64v3 minimum</strong> (depuis RING 9.5.0). Installation OS : mode <strong>Minimal obligatoire</strong> (pas de GUI, pas de Samba pre-installe).</p><h3>Partitionnement minimal</h3><table><tr><th>Partition</th><th>Taille</th></tr><tr><td>/boot</td><td>1 GB</td></tr><tr><td>/</td><td>50-100 GB (100-120 GB pour le Supervisor)</td></tr><tr><td>/var</td><td>400 GB+ — <strong>partition SEPAREE obligatoire</strong></td></tr></table><p>Seul filesystem supporte pour les donnees RING : <strong>ext4</strong>.</p><h3>Tuning OS applique par l\'installer</h3><table><tr><th>Parametre</th><th>Valeur imposee</th><th>Raison</th></tr><tr><td>vm.swappiness</td><td>1</td><td>Minimise le swap pour eviter les latences IO</td></tr><tr><td>Transparent Huge Pages</td><td>disabled</td><td>Cause des latences aleatoires avec les applications memoire intensives</td></tr><tr><td>NUMA</td><td>disabled (interleaving BIOS)</td><td>Evite les inegalites d\'acces memoire entre CPUs</td></tr><tr><td>irqbalance</td><td>--oneshot au boot uniquement</td><td>Evite la redistribution dynamique des interruptions</td></tr><tr><td>SELinux</td><td>disabled avant installation</td><td>Peut etre re-active apres via procedure Scality</td></tr><tr><td>net.core.somaxconn</td><td>4096</td><td>File d\'attente de connexions TCP</td></tr><tr><td>ulimit -n</td><td>65535</td><td>Nombre de fichiers ouverts simultanes</td></tr></table><p class="alert-w"><strong>Logiciels incompatibles :</strong> Salt pre-existant (supprimer salt-minion + /etc/salt), mlocate, GUI desktop, Transparent Huge Pages, NUMA actif, Samba pre-installe sur un noeud RING. <strong>NTP/Chrony obligatoire</strong> — ne jamais changer l\'heure d\'un serveur RING en cours d\'execution (peut corrompre l\'etat interne).</p><h2>Ports Reseau par Service</h2><h3>Infrastructure RING — Stockage</h3><table><tr><th>Service</th><th>Port</th><th>Protocole</th></tr><tr><td>bizstorenode (Chord P2P)</td><td>TCP 4244-4255</td><td>Inter-noeuds RING</td></tr><tr><td>bizstorenode admin (ringsh)</td><td>TCP 8084-8095</td><td>Administration</td></tr><tr><td>srebuildd / sproxyd REST</td><td>TCP 81, 10000, 10002</td><td>Rebuild et stockage</td></tr><tr><td>Salt Master</td><td>TCP 4505, 4506</td><td>Gestion de configuration</td></tr><tr><td>Supervisor GUI/API</td><td>TCP 80, 443, 3080, 2443, 3443, 4443</td><td>Administration</td></tr><tr><td>Grafana</td><td>TCP 3000</td><td>Monitoring</td></tr><tr><td>ZooKeeper (DLM)</td><td>TCP 2888, 3888</td><td>Coordination cluster</td></tr></table><h3>S3 Connector</h3><table><tr><th>Service</th><th>Port</th><th>Usage</th></tr><tr><td>S3 Frontend (clients)</td><td>TCP 80, 443</td><td>API S3 HTTP/HTTPS</td></tr><tr><td>Vault (IAM)</td><td>TCP 8500</td><td>Authentification interne</td></tr><tr><td>bucketd (metadata)</td><td>TCP 9000</td><td>Operations sur buckets</td></tr><tr><td>sproxyd (vers RING)</td><td>TCP 8181, 4243</td><td>Stockage donnees dans RING</td></tr><tr><td>Redis local</td><td>TCP 6479</td><td>Cache sessions/CRR</td></tr><tr><td>Kafka (CRR)</td><td>TCP 9092</td><td>Queue de replication</td></tr><tr><td>ZooKeeper S3</td><td>TCP 22181</td><td>Coordination Backbeat</td></tr><tr><td>KMIP (SSE externe)</td><td>TCP 5696</td><td>Chiffrement (KMS externe)</td></tr><tr><td>ADFS/SAML</td><td>TCP 443</td><td>Federation d\'identites SSO</td></tr><tr><td>FluentBit → ClickHouse</td><td>TCP 8123</td><td>Logs S3 Analytics</td></tr></table><h3>Monitoring</h3><table><tr><th>Service</th><th>Port</th></tr><tr><td>Prometheus scrape noeuds</td><td>TCP 9091, 9097, 9200, 9427</td></tr><tr><td>AlertManager</td><td>TCP 9093</td></tr><tr><td>Thanos gRPC mTLS</td><td>TCP 11903, 11905</td></tr><tr><td>Thanos Query FE</td><td>TCP 11902</td></tr></table><h2>Platformcheck et Installation</h2><p>Le <strong>Platformcheck</strong> est l\'outil de verification pre/post-installation de Scality. Il est <strong>read-only</strong> et peut etre lance a tout moment pour verifier l\'etat du systeme.</p><table><tr><th>Criticite</th><th>Signification</th><th>Action</th></tr><tr><td><strong>CRITICAL</strong></td><td>Probleme bloquant. L\'installation echoue ou le RING sera instable.</td><td>Corriger AVANT de continuer.</td></tr><tr><td><strong>WARNING</strong></td><td>Probleme non bloquant mais pouvant impacter les performances.</td><td>Corriger si possible.</td></tr><tr><td><strong>OK</strong></td><td>Verification reussie.</td><td>Rien a faire.</td></tr></table><p>Rapport disponible sur : <code>http://&lt;supervisor&gt;:8000/platformcheck/report-&lt;date&gt;</code></p><h2>Cycle de Vie Produit et Versions Supportees</h2><table><tr><th>Version</th><th>Type</th><th>Active Maintenance</th><th>Extended Maintenance</th></tr><tr><td>RING 7.x</td><td>—</td><td>Decembre 2022</td><td>Mars 2024 (EOL)</td></tr><tr><td><strong>RING 8.x (8.5 LTS)</strong></td><td>LTS</td><td><strong>Septembre 2026</strong></td><td>Septembre 2028</td></tr><tr><td><strong>RING 9.x (9.5 LTS)</strong></td><td>LTS</td><td><strong>Juillet 2029</strong></td><td>Juillet 2031</td></tr></table><ul><li><strong>Active Maintenance</strong> : corrections proactives + ameliorations performance. RING 8.5 et 9.5 sont en Active Maintenance.</li><li><strong>Extended Maintenance</strong> (option payante) : corrections reactives P1 uniquement. Nouveaux deploiements non supportes.</li><li><strong>Chemin d\'upgrade obligatoire</strong> : RING 7.x → RING 8.5 (derniere release) → RING 9.5 LTS. Le saut direct 7→9 est interdit.</li></ul><h2>Breaking Changes Importants (9.5.x)</h2><table><tr><th>Changement</th><th>Version</th><th>Impact</th></tr><tr><td>Cle objet S3 limitee a 915 bytes</td><td>9.5.1</td><td>Objets avec des cles longues recoivent HTTP 400 KeyTooLong. ARTESCA impose la meme limite → important pour les setups CRR vers ARTESCA.</td></tr><tr><td>PutObject max 5 GB</td><td>9.5.1</td><td>PUT directs >5 GB retournent HTTP 400 EntityTooLarge. Utiliser MPU pour les gros fichiers.</td></tr><tr><td>s3:ReplicateObject obligatoire</td><td>9.5.2.0</td><td>Action pre-upgrade obligatoire pour les clusters CRR.</td></tr><tr><td>Events Notifications renommes</td><td>9.5.1</td><td>ObjectRemoved remplace par LifecycleExpiration:Delete. Mettre a jour les configurations de notifications existantes.</td></tr><tr><td>Verification Host header S3C Console</td><td>9.5.2</td><td>L\'en-tete Host est verifie. Variable env_s3_frontend_enforce_console_host_header disponible.</td></tr><tr><td>Elasticsearch supprime</td><td>9.5.0</td><td>Remplace par ClickHouse. Les configurations Elasticsearch existantes sont caduques.</td></tr></table><h2>Reseau Flapping — Vulnerabilite du RING</h2><p>Le RING Scality est <strong>sensible aux instabilites reseau</strong> (flapping). Un reseau instable — meme brieve­ment — peut provoquer des consequences graves : re-elections de leader, degradation de la protection, voire perte de coherence.</p><table><tr><th>Symptome reseau</th><th>Impact sur le RING</th></tr><tr><td>Perte de paquets > 0%</td><td>Retransmissions TCP → latences elevees → timeouts Chord → noeuds marques DOWN</td></tr><tr><td>MTU incoherent (jumbo frames)</td><td>Fragmentation silencieuse → retransmissions → performance degradee. Tres difficile a diagnostiquer.</td></tr><tr><td>Interface flapping (lien up/down)</td><td>LACP peut prendre 30 secondes pour re-basculer si lacp_rate=slow (utiliser toujours <code>lacp_rate=fast</code>)</td></tr><tr><td>Latence inter-sites > 10ms</td><td>Elections Raft repetees (S3RaftElectionWarning), performance CRR degradee</td></tr></table><h3>Verification reseau avant/apres incident</h3><pre># Test debit inter-noeuds (minimum 10 Gb/s effectif)\niperf3 -s                           # sur le serveur cible\niperf3 -c &lt;ip_noeud_cible&gt; -P 4    # depuis le noeud source\n\n# Verifier les retransmissions TCP (doit etre ~0)\nss -s | grep retrans\ncat /proc/net/snmp | grep -i retrans\n\n# Verifier la coherence MTU\nip link show | grep mtu\nping -M do -s 8972 &lt;ip_noeud&gt;     # test MTU 9000 (8972 + 28 headers)\n\n# Verifier le LACP\ncat /proc/net/bonding/bond0 | grep -E "speed|mode|rate|MII"</pre><div class="kbox"><h3>Points Cles a Retenir</h3><ul><li>Stockage : baremetal OBLIGATOIRE, 128GB RAM, RAID 0 sur DATA, SSD metadata, BBU obligatoire</li><li>PatrolRead DESACTIVE sur tous les controleurs RAID</li><li>OS : RHEL/Rocky 8.10 ou 9.6/9.7 uniquement, x86-64v3, install Minimal, /var partition separee</li><li>Tuning : swappiness=1, THP disabled, NUMA disabled, NTP obligatoire</li><li>Ports cles : Chord 4244-4255, Salt 4505/4506, Kafka 9092, ZK S3 22181, KMIP 5696</li><li>Platformcheck : CRITICAL = bloquant, WARNING = a corriger, OK = bon</li><li>RING 8.5 LTS → 2028 ; RING 9.5 LTS → 2031. Upgrade 7→9 interdit (passer par 8.5)</li><li>Breaking changes : cle 915B, PUT 5GB, s3:ReplicateObject, events Notifications renommes</li></ul></div>',
quiz:[
{q:"Les noeuds de stockage RING peuvent-ils etre des machines virtuelles (VMs) ?",opts:["Oui, les VMs sont supportees si le CPU est de type bare-metal","Non : les noeuds de stockage RING doivent etre des serveurs physiques (baremetal) obligatoirement","Oui, mais uniquement avec VMware vSphere Enterprise","Oui, si les disques sont passes en passthrough PCI direct"],ans:1,expl:"Les noeuds de stockage RING (bizstorenode + biziod) doivent obligatoirement etre des serveurs physiques baremetal. Les VMs introduisent une couche de virtualisation incompatible avec les performances et la determinisme IO requis par RING. Le Supervisor, en revanche, peut etre une VM (avec failover hyperviseur recommande)."},
{q:"Pourquoi les disques DATA des noeuds RING sont-ils configures en RAID 0 individuel (un RAID 0 par disque) plutot qu\'en RAID 5 ou RAID 6 ?",opts:["Pour maximiser les performances en lecture","La protection des donnees est assuree par le RING lui-meme (ARC/COS) — le RAID entre disques est redondant et ralentirait les IO","RAID 5 et 6 ne sont pas supportes par les controleurs RAID des serveurs Scality","Pour reduire le cout du stockage"],ans:1,expl:"Le RING assure lui-meme la protection des donnees via l\'erasure coding ARC (7+5 = 12 fragments) ou la replication COS. Un RAID supplementaire entre les disques DATA serait redondant et ajouterait une latence inutile. PatrolRead (verification d\'integrite RAID) doit egalement etre desactive car il genere des IO aleatoires qui perturbent les performances."},
{q:"Un client souhaite upgrader son RING 7.x directement vers RING 9.5 LTS. Est-ce possible ?",opts:["Oui, l\'upgrade direct 7→9 est supporte depuis RING 9.4","Non : le chemin obligatoire est RING 7.x → RING 8.5 (derniere release) → RING 9.5 LTS","Oui, mais uniquement si le client est en RING 7.10.x","Non, il faut passer par 7.10, 8.0, 8.5 puis 9.5"],ans:1,expl:"Le saut direct RING 7→9 est interdit par Scality. Le chemin d\'upgrade obligatoire est : RING 7.x → derniere release RING 8.5 LTS → RING 9.5 LTS. Cette contrainte existe car les migrations de schemas de donnees et de configuration doivent etre effectuees progressivement pour garantir l\'integrite du RING."},
{q:"Quel est l\'impact du breaking change 'cle objet limitee a 915 bytes' introduit en RING 9.5.1 ?",opts:["Les objets avec des cles longues sont silencieusement tronques","Les PUT d\'objets avec une cle >915 bytes retournent HTTP 400 KeyTooLong","La limite s\'applique uniquement aux nouvelles cles, pas aux existantes","Seul le mode CRR vers ARTESCA est affecte"],ans:1,expl:"Depuis 9.5.1, les cles d\'objets S3 de plus de 915 bytes sont rejetees avec HTTP 400 KeyTooLong. C\'est particulierement important pour les setups CRR vers ARTESCA qui impose la meme limite — des objets avec des cles longues existant sur un cluster RING 9.4 pourraient bloquer la replication vers ARTESCA apres upgrade. La limite est configurable via env_s3.override_object_key_byte_limit."},
{q:"Le Platformcheck retourne un resultat CRITICAL. Que cela signifie-t-il et quelle action prendre ?",opts:["Un avertissement non bloquant : l\'installation peut continuer","Un probleme bloquant : l\'installation doit etre stoppee et le probleme corrige avant de continuer","Un echec post-installation : contacter le support Scality","Une anomalie de performance : corriger lors de la prochaine fenetre de maintenance"],ans:1,expl:"Les resultats CRITICAL du Platformcheck indiquent des problemes bloquants qui rendront l\'installation impossible ou le RING instable. Ils DOIVENT etre corriges avant de continuer l\'installation. Les WARNING sont des problemes non bloquants mais pouvant impacter les performances. Le Platformcheck peut etre relance a tout moment (il est read-only et sans impact sur le systeme)."},
{q:"RING 8.5 LTS est en 'Extended Maintenance'. Qu\'est-ce que cela signifie operationnellement ?",opts:["RING 8.5 est pleinement supporte avec de nouvelles fonctionnalites","RING 8.5 est EOL : aucun support disponible","Seules les corrections reactives d\'incidents P1 critiques sont fournies ; les nouveaux deploiements ne sont pas supportes","RING 8.5 entre en Extended Maintenance en septembre 2026"],ans:2,expl:"L\'Extended Maintenance (option payante) couvre uniquement les corrections reactives sur les incidents P1 critiques. Il n\'y a plus de corrections proactives ni d\'ameliorations de performance. Les nouveaux deploiements sur une version en Extended Maintenance ne sont pas supportes par Scality. RING 8.5 entre en Extended Maintenance en septembre 2026 (Active Maintenance jusqu\'a cette date). RING 9.5 reste en Active Maintenance jusqu\'en juillet 2029."},
{q:"Un RING signale des erreurs intermittentes et timeouts sans pattern evident. Quelle est la premiere cause a investiguer selon les best practices Scality ?",opts:["Un manque de RAM sur les noeuds","Une instabilite reseau (network flapping) — le RING est tres sensible aux micro-coupures","Un disque en etat WARNING","Une version RING obsolete"],ans:1,expl:"Le RING est concu pour un reseau stable et dedie. Des micro-coupures (flapping) causent des timeouts de replication, des Rebuild intempestifs et des erreurs P2P. Les symptomes (erreurs sporadiques sans pattern clair) sont caracteristiques d'un probleme reseau. Verifier : coherence MTU (iperf3 -M 8972), LACP rate=fast, pertes de paquets."},
{q:"Pourquoi la configuration LACP 'lacp_rate=fast' est-elle obligatoire dans les clusters RING ?",opts:["lacp_rate=slow est le standard IEEE et suffisant","lacp_rate=fast permet la detection de panne en 1s au lieu de 30s, evitant des timeouts RING","Pour doubler la bande passante du bonding","Pour activer le mode Active-Backup"],ans:1,expl:"Avec lacp_rate=slow (defaut), la detection d'une panne de lien reseau prend 30 secondes — pendant ce temps les requetes RING timeout et des Rebuild peuvent se declencher. Avec lacp_rate=fast, la detection est en 1 seconde. Ce parametre est obligatoire dans la documentation Scality pour tous les clusters en production."}
]}
];

var state={view:'home',tab:'theory',modIdx:0,scores:{},answers:{}};
try{var s=JSON.parse(localStorage.getItem('ringState')||'{}');state.scores=s.scores||{};}catch(e){}
function save(){try{localStorage.setItem('ringState',JSON.stringify({scores:state.scores}));}catch(e){}}

function goHome(){
  state.view='home';
  document.getElementById('homePage').classList.add('show');
  document.getElementById('modulePage').classList.remove('show');
  renderHome();renderSidebar();
}

function openModule(idx){
  state.view='module';state.modIdx=idx;state.tab='theory';
  if(!state.answers[MODS[idx].id])state.answers[MODS[idx].id]=new Array(MODS[idx].quiz.length).fill(-1);
  document.getElementById('homePage').classList.remove('show');
  document.getElementById('modulePage').classList.add('show');
  renderModule();renderSidebar();
  document.querySelector('.mpbody').scrollTop=0;
}

function showTab(tab){
  state.tab=tab;
  document.getElementById('tabCours').classList.toggle('active',tab==='theory');
  document.getElementById('tabQuiz').classList.toggle('active',tab==='quiz');
  document.getElementById('theoryView').classList.toggle('show',tab==='theory');
  document.getElementById('quizView').classList.toggle('show',tab==='quiz');
  document.querySelector('.mpbody').scrollTop=0;
}

function renderSidebar(){
  var nav=document.getElementById('sbNav');
  var html='<div class="nav-sec">Modules de cours</div>';
  MODS.forEach(function(m,i){
    var sc=state.scores[m.id];
    var isDone=sc&&sc.score===sc.total;
    var isPartial=sc&&sc.score<sc.total;
    var isActive=state.view==='module'&&state.modIdx===i;
    var badge=sc?'<span class="nbadge">'+sc.score+'/'+sc.total+'</span>':'';
    var cls=['ni',isActive?'active':'',isDone?'done':'',isPartial?'partial':''].filter(Boolean).join(' ');
    html+='<div class="'+cls+'" onclick="openModule('+i+')"><span class="nid">'+m.num+'</span><span class="ntxt">'+m.title+'</span>'+badge+'</div>';
  });
  nav.innerHTML=html;
  var done=Object.keys(state.scores).length;
  var totalScore=Object.values(state.scores).reduce(function(a,b){return a+b.score;},0);
  var totalMax=Object.values(state.scores).reduce(function(a,b){return a+b.total;},0);
  var tv=document.getElementById('totScore');
  var ts=document.getElementById('totSub');
  if(done===0){tv.textContent='--';ts.textContent='Aucun quiz complete';}
  else{tv.textContent=totalMax>0?Math.round(totalScore/totalMax*100)+'%':'--';ts.textContent=totalScore+'/'+totalMax+' pts . '+done+'/'+MODS.length+' modules';}
}

function renderHome(){
  var done=Object.keys(state.scores).length;
  var totalScore=Object.values(state.scores).reduce(function(a,b){return a+b.score;},0);
  var totalMax=Object.values(state.scores).reduce(function(a,b){return a+b.total;},0);
  var pct=totalMax>0?Math.round(totalScore/totalMax*100):0;
  document.getElementById('statsRow').innerHTML='<div class="stat-card"><div class="sv col-acc">'+MODS.length+'</div><div class="sl">Modules au total</div></div><div class="stat-card"><div class="sv col-ok">'+done+'</div><div class="sl">Quiz completes</div></div><div class="stat-card"><div class="sv col-info">'+pct+'%</div><div class="sl">Score moyen</div></div>';
  var grid=document.getElementById('moduleGrid');
  grid.innerHTML=MODS.map(function(m,i){
    var sc=state.scores[m.id];
    var isDone=sc&&sc.score===sc.total;
    var pct2=sc?Math.round(sc.score/sc.total*100):0;
    var pfClass=isDone?'ok':'acc';
    return '<div class="mc '+(isDone?'done':'')+'" onclick="openModule('+i+')"><div class="mid">Module '+m.num+'</div><div class="mtit">'+m.title+'</div><div class="mdesc">'+m.desc+'</div><div class="mfoot"><div class="pbar"><div class="pfill '+pfClass+'" style="width:'+pct2+'%"></div></div><span class="msc">'+(sc?sc.score+'/'+sc.total+' pts':'Non commence')+'</span></div></div>';
  }).join('');
}

function renderModule(){
  var m=MODS[state.modIdx];
  document.getElementById('mpId').textContent='Module '+m.num;
  document.getElementById('mpTitle').textContent=m.title;
  document.getElementById('theoryView').innerHTML=m.content;
  document.getElementById('theoryView').classList.add('show');
  renderQuiz();
  document.getElementById('quizView').classList.remove('show');
  document.getElementById('tabCours').classList.add('active');
  document.getElementById('tabQuiz').classList.remove('active');
}

function renderQuiz(){
  var m=MODS[state.modIdx];
  var sc=state.scores[m.id];
  var answers=state.answers[m.id]||new Array(m.quiz.length).fill(-1);
  var locked=!!sc;
  var html='<div class="quiz-hdr"><h2>Quiz &mdash; '+m.title+'</h2><p>'+m.quiz.length+' questions &middot; Selectionnez une reponse par question</p></div>';
  var letters=['A','B','C','D'];
  m.quiz.forEach(function(q,qi){
    var sel=answers[qi];
    html+='<div class="qcard '+(locked&&sel!==-1?'answered':'')+'" id="qcard'+qi+'">';
    html+='<div class="qnum">Question '+(qi+1)+' / '+m.quiz.length+'</div>';
    html+='<div class="qtxt">'+q.q+'</div>';
    html+='<div class="opts">';
    q.opts.forEach(function(opt,oi){
      var cls='opt';
      if(locked)cls+=' locked';
      if(sel===oi){cls+=oi===q.ans?' correct':' wrong';}
      else if(locked&&oi===q.ans){cls+=' correct';}
      else if(sel===oi){cls+=' sel';}
      var click=locked?'':'onclick="selectOpt('+qi+','+oi+')"';
      html+='<div class="'+cls+'" '+click+'><span class="ol">'+letters[oi]+'</span><span>'+opt+'</span></div>';
    });
    html+='</div>';
    if(locked){html+='<div class="expl show">'+q.expl+'</div>';}
    else{html+='<div class="expl" id="expl'+qi+'"></div>';}
    html+='</div>';
  });
  html+='<div class="qa">';
  if(!locked){html+='<button class="btn btn-p" onclick="validateQuiz()">Valider le quiz</button><button class="btn btn-s" onclick="showTab(\'theory\')">&#8592; Retour au cours</button>';}
  html+='</div>';
  if(locked){
    var pct=Math.round(sc.score/sc.total*100);
    var cls2=pct>=80?'ex':pct>=50?'gd':'po';
    var label=pct>=80?'Excellent !':pct>=50?'Bien !':'A revoir';
    var msg=pct>=80?'Vous maitrisez ce module.':pct>=50?'Quelques points a consolider.':'Relisez le cours avant de continuer.';
    var next=state.modIdx<MODS.length-1?'<button class="btn btn-ok" onclick="openModule('+(state.modIdx+1)+')">Module suivant &#8594;</button>':'<button class="btn btn-i" onclick="goHome()">Accueil</button>';
    html+='<div class="result-box show"><div style="font-size:13px;color:var(--t3)">Resultat</div><div class="rscore '+cls2+'">'+sc.score+'/'+sc.total+'</div><div class="rlabel">'+label+'</div><div class="rmsg">'+pct+'% de reussite &mdash; '+msg+'</div><div class="rnext"><button class="btn btn-s" onclick="resetQuiz()">Recommencer</button>'+next+'</div></div>';
  }
  document.getElementById('quizView').innerHTML=html;
}

function selectOpt(qi,oi){
  var m=MODS[state.modIdx];
  if(!state.answers[m.id])state.answers[m.id]=new Array(m.quiz.length).fill(-1);
  var prev=state.answers[m.id][qi];
  if(prev!==-1){var p=document.getElementById('opt'+qi+'_'+prev);if(p)p.classList.remove('sel');}
  state.answers[m.id][qi]=oi;
  var el=document.querySelector('#qcard'+qi+' .opts .opt:nth-child('+(oi+1)+')');
  if(el)el.classList.add('sel');
}

function validateQuiz(){
  var m=MODS[state.modIdx];
  var answers=state.answers[m.id]||[];
  var score=0;
  m.quiz.forEach(function(q,qi){if(answers[qi]===q.ans)score++;});
  state.scores[m.id]={score:score,total:m.quiz.length};
  save();renderQuiz();renderSidebar();
}

function resetQuiz(){
  var m=MODS[state.modIdx];
  delete state.scores[m.id];
  state.answers[m.id]=new Array(m.quiz.length).fill(-1);
  save();renderQuiz();renderSidebar();
}

renderSidebar();
renderHome();
</script>
</body>
</html>
