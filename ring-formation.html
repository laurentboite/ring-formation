réintègre le disque et distribué des données dessus</div><p class="alert-w"><strong>Avant de commencer :</strong> Vérifier que le RING est dans un état sain (pas de INCOMPLETE, pas d\'autre Rebuild en cours). Remplacer un disque pendant un Rebuild actif peut degrader la protection sous le seuil de tolérance.</p><h2>LUKS — Chiffrement At-Rest des Disques</h2><p>Scality RING supporte le <strong>chiffrement LUKS</strong> (Linux Unified Key Setup) pour chiffrer les disques DATA et metadata au repos. Le chiffrement est transparent pour le RING — il opere au niveau bloc, en dessous de ext4.</p><h3>Principes LUKS sur RING</h3><table><tr><th>Aspect</th><th>Detail</th></tr><tr><td>Niveau</td><td>Chiffrement au niveau bloc (partition LUKS sous le filesystem ext4). Le RING ne voit que des blocs dechiffres — pas de modification logicielle RING.</td></tr><tr><td>Ouverture automatique</td><td>Options NBDE (Network-Bound Disk Encryption) via <strong>TANG + clevis</strong> : les disques s\'ouvrent automatiquement au boot si le serveur TANG est accessible — élimine la saisie manuelle de passphrase.</td></tr><tr><td>scaldisk + LUKS</td><td>La plupart des commandes scaldisk fonctionnent normalement avec LUKS. Exception : <code>scaldisk replace</code> nécessite des flags spécifiques (<code>--luks</code>) pour recreer la partition chiffrée.</td></tr><tr><td>Disques DATA vs Metadata</td><td>Procédures différentes : disques DATA (SAS/SATA) et disques metadata (SSD/NVMe) ont chacun leur procédure de remplacement LUKS.</td></tr></table><pre># Créer une partition LUKS sur un disque DATA\ncryptsetup luksFormat /dev/sdX\ncryptsetup open /dev/sdX disk07_crypt\n\n# Avec NBDE (ouverture automatique via TANG)\nclevis luks bind -d /dev/sdX tang \'{"url":"http://tang-server"}\'\n\n# scaldisk replace avec LUKS\nscaldisk replace --luks -c /dev/sdX -d disk07</pre><h2>Expansion de Capacité</h2><p>Deux types d\'expansion existent pour augmenter la capacité du RING :</p><table><tr><th>Type</th><th>Description</th><th>Impact keyspace</th></tr><tr><td><strong>Disk Expansion</strong></td><td>Ajout de disques sur des serveurs existants. Procédure simple : scaldisk add sur chaque serveur.</td><td>Pas de modification du keyspace. Le RING rééquilibre automatiquement.</td></tr><tr><td><strong>Server Expansion</strong></td><td>Ajout de nouveaux serveurs au RING. Plus complexe : nécessite la mise a jour du keyspace et la validation Scality.</td><td>Nouveau keyspace calcule par l\'équipe ExVT Scality. Application via procédure dédiée.</td></tr></table><p class="alert-d"><strong>Validation Scality obligatoire</strong> avant toute expansion serveurs. Soumettre un ticket de validation via Zendesk avec la configuration actuelle et prevue. Une expansion non validée peut desequilibrer le RING et degrader les performances.</p><h3>Vérifier l\'équilibre du RING après expansion</h3><pre># État de la mémoire et des disques sur tous les nœuds\ndate; salt -s \'*\' cmd.run \'free -h\'\ndate; salt -s \'*\' cmd.run \'df -h\'\n\n# Status du RING\nringsh supervisor ringStatus DATA\n\n# Si le RING est déséquilibre après ajout de disques :\n# Utiliser l\'outil scality-official-tooling/capacity_and_balances</pre><div class="kbox"><h3>Points Clés a Retenir</h3><ul><li>biziotools = niveau Biziod (containers, chunks, index) -- outil bas niveau</li><li>scaldisk = niveau cluster (déclaration, évacuation, sante) -- outil haut niveau</li><li>Cycle : OK -> WARNING -> ERROR -> OOS -> OOS_PERM (irréversible)</li><li>OOS_PERM = remplacement physique obligatoire, ne JAMAIS remettre en service</li><li>Attendre la fin du Rebuild avant de remplacer physiquement</li><li>SSD d\'index : critique, reconstruction longue si perdu, monitorer le wear level</li></ul></div>',
quiz:[
  {q:"Que signifie OOS_PERM pour un nœud RING ?",opts:["Nœud temporairement hors service","Nœud définitivement perdu, ses données doivent être reconstruites","Nœud en mode maintenance","Nœud surchargé"],ans:1,expl:"OOS_PERM (Out Of Service Permanent) signifie que le nœud est définitivement perdu. Le ring déclenche le rebuild des données de ce nœud sur les nœuds survivants."},
  {q:"Quel outil permet de gérer les disques physiques sur les nœuds RING ?",opts:["biziod","biziotools/scaldisk","repd","MESA"],ans:1,expl:"scaldisk (et biziotools) est l'outil de gestion des disques sur les nœuds RING. Il permet d'ajouter, retirer ou vérifier l'état des disques intégrés au service de stockage."},
  {q:"Qu'est-ce qu'un 'Disk Orphan' ?",opts:["Un disque non formaté","Un objet présent sur disque sans référence dans les métadonnées Chord","Un disque en erreur SMART","Un disque non assigné à un Bizstorenode"],ans:1,expl:"Un Disk Orphan est un objet physiquement présent sur disque mais sans entrée dans les métadonnées Chord. Il est éligible à la suppression via Chord Purge."},
  {q:"Quelle opération nettoie les Disk Orphans ?",opts:["Rebuild","Repair","Chord Purge","Balance"],ans:2,expl:"Chord Purge nettoie les entrées orphelines dans l'espace Chord. Il supprimé les références à des objets n'existant plus physiquement et peut identifier les Disk Orphans."},
  {q:"Qu'est-ce qu'un objet INCOMPLETE ?",opts:["Un objet chiffré partiellement","Un objet dont tous les fragments n'ont pas été écrits lors de l'ingestion","Un objet sans métadonnées S3","Un objet en cours de réplication"],ans:1,expl:"Un objet INCOMPLETE a été partiellement écrit : certains fragments manquent. Il est présent mais dégradé. Un Rebuild peut tenter de le compléter si des fragments suffisants existent."},
  {q:"Quel daemon gère les opérations I/O bas niveau sur les disques physiques ?",opts:["sproxyd","repd","biziod","membershipd"],ans:2,expl:"biziod est le daemon d'I/O bas niveau. Il gère directement les lectures/écritures sur les disques physiques pour le compte de sproxyd, en maintenant un index sur SSD."},
  {q:"Avant de remplacer physiquement un disque défaillant, quelle commande doit-on exécuter pour retirer proprement le disque du service ?",opts:["Éteindre directement le nœud","Utiliser scaldisk pour marquer le disque comme OOS avant de le retirer physiquement","Exécuter un Rebuild complet","Lancer Chord Purge sur le disque"],ans:1,expl:"Il faut d'abord signaler le retrait du disque via scaldisk pour que le ring redistribue les données vers d'autres disques avant le retrait physique. Retirer un disque à chaud sans préavis peut causer une perte temporaire d'accès aux objets."},
  {q:"Pourquoi biziod maintient-il ses fichiers de données sur HDD en taille fixe (containers) ?",opts:["Pour simplifier le chiffrement LUKS","Les containers de taille fixe évitent la fragmentation du système de fichiers et permettent une gestion directe des blocs, optimisant les performances I/O séquentielles sur HDD","Pour réduire l'espace disque utilisé","Le HDD ne supporte pas les fichiers de taille variable"],ans:1,expl:"Les containers de taille fixe sur HDD évitent la fragmentation. biziod gère lui-même l'allocation dans ces containers, contournant les limitations des systèmes de fichiers génériques et optimisant les I/O séquentiels pour les grandes écritures de blobs."}
],
title_en:'Disk Management',
desc_en:'Biziod, biziotools, scaldisk, disk states, OOS_PERM',
content_en:'<h2>The Two Disk Management Tools</h2><p>Scality provides two complementary CLI tools for disk management, operating at different levels of abstraction:</p><h3>biziotools — Biziod level (low level)</h3><p><code>biziotools</code> interacts directly with the Biziod daemon. It allows inspection of internal storage structures:</p><ul><li><strong>List container files</strong> on a given disk (their size, their fill rate)</li><li><strong>Inspect chunks</strong> inside containers (key, size, offset)</li><li><strong>Verify consistency</strong> between the SSD index and HDD data</li><li><strong>Force a flush</strong> of pending writes in a Biziod</li></ul><pre># biziotools examples\\nbiziotools list-containers /data/disk01\\nbiziotools chunk-info /data/disk01 &lt;chunk_id&gt;\\nbiziotools check-index /data/disk01</pre><h3>scaldisk — Cluster level (high level)</h3><p><code>scaldisk</code> operates at the cluster level for disk lifecycle management:</p><ul><li><strong>Register a new disk</strong> in the RING (after physical addition)</li><li><strong>Remove a disk</strong> cleanly (data evacuation before decommissioning)</li><li><strong>Check the health</strong> of a disk (SMART status, recent I/O errors)</li><li><strong>Force OOS state</strong> on a failing disk for immediate protection</li></ul><pre># scaldisk examples\\nscaldisk list                   # status of all disks\\nscaldisk add /dev/sdb           # add a disk to the RING\\nscaldisk evacuate /dev/sdb      # evacuate data before removal\\nscaldisk set-oos /dev/sdb       # force emergency OOS</pre><h2>Disk Lifecycle and States</h2><p>Each disk in the RING goes through several states over its lifetime. Understanding these states is essential for proactive management:</p><div class="adiag">+--------+     +----------+     +-------+     +---------+\\n|  NEW   | --> |   OK     | --> | WARN  | --> |  ERROR  |\\n+--------+     +----------+     +-------+     +---------+\\n(declared)     (operational)    (first         (significant\\n                                 signals)       errors)\\n                                                    |\\n                                                    v\\n                                               +--------+     +-----------+\\n                                               |  OOS   | --> | OOS_PERM  |\\n                                               +--------+     +-----------+\\n                                               (temporary      (physical\\n                                                removal)        replacement)</div><table><tr><th>State</th><th>Detailed meaning</th><th>Operational action</th></tr><tr><td><code>OK</code></td><td>Disk fully operational. No SMART errors, normal I/O, acceptable fill rate.</td><td>None. Monitor via Grafana.</td></tr><tr><td><code>WARNING</code></td><td>First signs of degradation: rising SMART counters, occasional I/O errors, periodic high latencies. Disk still functional.</td><td>Plan replacement soon. Increase monitoring frequency.</td></tr><tr><td><code>ERROR</code></td><td>Significant and repeated I/O errors. Disk still responding but unreliably. The RING may have marked some objects as INCOMPLETE.</td><td>Plan urgent replacement. Check data state (Rebuild in progress?).</td></tr><tr><td><code>OOS</code></td><td>Out of Service temporarily. The disk is removed from the RING but can be returned to service. The RING rebuilds missing data on other disks.</td><td>Maintenance in progress (temporary replacement, firmware update...). Do not leave in this state too long.</td></tr><tr><td><code>OOS_PERM</code></td><td>Out of Service Permanent. The disk is definitively declared out of service. The RING has rebuilt or is rebuilding the missing data.</td><td><strong>Replace the disk physically. NEVER return it to service.</strong></td></tr></table><div class="alert alert-d">OOS_PERM is irreversible: once a disk is marked OOS_PERM, it can no longer join the RING. Attempting to manually return it to service without following the new disk registration procedure would corrupt the MESA index.</div><h2>Disk Replacement Procedure</h2><ol><li><strong>Detection</strong>: the Supervisor or Grafana alerts on an ERROR or OOS_PERM disk.</li><li><strong>Software evacuation</strong>: the disk moves to OOS, the RING initiates Rebuild to reconstitute missing data on other available disks.</li><li><strong>Wait for Rebuild</strong>: do not replace physically until the RING has returned to RUN state (all data from the disk has been reconstituted elsewhere).</li><li><strong>Physical replacement</strong>: swap the failing disk.</li><li><strong>Registration</strong>: use <code>scaldisk add</code> to register the new disk in the RING.</li><li><strong>Rebalancing</strong>: the RING automatically initiates a Balance to distribute data onto the new disk.</li></ol><div class="alert alert-w">Replacing an OOS_PERM disk BEFORE the Rebuild completes is risky: if another disk fails during reconstruction, the data loss threshold may be reached (more than M ARC fragments lost simultaneously).</div><h2>Disk Capacity Management</h2><p>Monitoring disk fill rates is critical. Two thresholds trigger alerts in the Supervisor:</p><ul><li><strong>DISK USAGE WARNING</strong>: a configurable threshold (e.g., 75%) is reached. Preventive alert.</li><li><strong>DISK_FULL</strong>: the disk is full. The RING can no longer write new data to this disk. Critical state requiring immediate action (adding capacity or deleting data).</li></ul><h2>The SSD Index — Criticality and Protection</h2><p>The SSD index of each Biziod is the most critical component of the physical storage system. Its loss (without loss of the associated HDD) does not cause data loss but requires a costly reconstruction:</p><ul><li>Rebuilding the index involves re-reading <em>all HDD containers</em> to reconstruct the key-to-offset mapping table.</li><li>This operation can take several hours on large disks (multiple TB).</li><li>During reconstruction, the Biziod does not respond: its data appears missing, which may trigger an unnecessary ARC Rebuild.</li></ul><p>Best practices for index SSDs:</p><ul><li>Use <strong>enterprise-grade</strong> SSDs with power-loss protection (capacitors)</li><li>Monitor wear level via S.M.A.R.T.</li><li>Consider RAID1 on index SSDs for critical environments</li></ul><h2>DATA Disk Replacement</h2><p>When a DATA disk fails, the replacement procedure follows precise steps to avoid any data loss. The RING must be healthy (protection intact) before starting.</p><h3>scaldisk procedure (key steps)</h3><div class="adiag">1. Mark the disk as permanently out of service\\n   scaldisk iods set disk07 OOS_PERM\\n   -&gt; The RING stops using this disk and initiates Rebuild on the others\\n\\n2. Stop the scality-iod service for this disk\\n   systemctl stop scality-iod@disk07\\n\\n3. Physical disk replacement (hardware intervention)\\n\\n4. Register the new disk in Salt/scaldisk\\n   scaldisk add -c /dev/sdX        # add the new disk\\n   # or\\n   scaldisk replace -c /dev/sdX -d disk07  # direct replacement (with RAID plugin)\\n\\n5. Create a new store on the disk\\n   bizioopen -c -N disk07 bizobj://DATA_RING\\n\\n6. Clear the OOS_PERM flag\\n   scaldisk iods clear disk07\\n   -&gt; The RING reintegrates the disk and distributes data onto it</div><p class="alert-w"><strong>Before starting:</strong> Verify that the RING is in a healthy state (no INCOMPLETE, no other Rebuild in progress). Replacing a disk during an active Rebuild may degrade protection below the tolerance threshold.</p><h2>LUKS — At-Rest Disk Encryption</h2><p>Scality RING supports <strong>LUKS</strong> (Linux Unified Key Setup) encryption for encrypting DATA and metadata disks at rest. Encryption is transparent to the RING — it operates at the block level, below ext4.</p><h3>LUKS principles on RING</h3><table><tr><th>Aspect</th><th>Detail</th></tr><tr><td>Level</td><td>Block-level encryption (LUKS partition below the ext4 filesystem). The RING only sees decrypted blocks — no RING software modification required.</td></tr><tr><td>Automatic unlocking</td><td>NBDE (Network-Bound Disk Encryption) via <strong>TANG + clevis</strong>: disks unlock automatically at boot if the TANG server is reachable — eliminates manual passphrase entry.</td></tr><tr><td>scaldisk + LUKS</td><td>Most scaldisk commands work normally with LUKS. Exception: <code>scaldisk replace</code> requires specific flags (<code>--luks</code>) to recreate the encrypted partition.</td></tr><tr><td>DATA vs Metadata disks</td><td>Different procedures: DATA disks (SAS/SATA) and metadata disks (SSD/NVMe) each have their own LUKS replacement procedure.</td></tr></table><pre># Create a LUKS partition on a DATA disk\\ncryptsetup luksFormat /dev/sdX\\ncryptsetup open /dev/sdX disk07_crypt\\n\\n# With NBDE (automatic unlocking via TANG)\\nclevis luks bind -d /dev/sdX tang url:http://tang-server\\n\\n# scaldisk replace with LUKS\\nscaldisk replace --luks -c /dev/sdX -d disk07</pre><h2>Capacity Expansion</h2><p>Two types of expansion exist to increase RING capacity:</p><table><tr><th>Type</th><th>Description</th><th>Keyspace impact</th></tr><tr><td><strong>Disk Expansion</strong></td><td>Adding disks to existing servers. Simple procedure: scaldisk add on each server.</td><td>No keyspace modification. The RING rebalances automatically.</td></tr><tr><td><strong>Server Expansion</strong></td><td>Adding new servers to the RING. More complex: requires updating the keyspace and Scality validation.</td><td>New keyspace calculated by the Scality ExVT team. Applied via a dedicated procedure.</td></tr></table><p class="alert-d"><strong>Scality validation is mandatory</strong> before any server expansion. Submit a validation ticket via Zendesk with the current and planned configuration. An unvalidated expansion can unbalance the RING and degrade performance.</p><h3>Verify RING balance after expansion</h3><pre># Memory and disk status on all nodes\\ndate; salt -s \'*\' cmd.run \'free -h\'\\ndate; salt -s \'*\' cmd.run \'df -h\'\\n\\n# RING status\\nringsh supervisor ringStatus DATA\\n\\n# If the RING is unbalanced after adding disks:\\n# Use the scality-official-tooling/capacity_and_balances tool</pre><div class="kbox"><h3>Key Takeaways</h3><ul><li>biziotools = Biziod level (containers, chunks, index) -- low-level tool</li><li>scaldisk = cluster level (registration, evacuation, health) -- high-level tool</li><li>Lifecycle: OK -&gt; WARNING -&gt; ERROR -&gt; OOS -&gt; OOS_PERM (irreversible)</li><li>OOS_PERM = mandatory physical replacement, NEVER return to service</li><li>Wait for Rebuild to complete before physically replacing</li><li>SSD index: critical, lengthy reconstruction if lost, monitor wear level</li></ul></div>',
quiz_en:[
  {q:"What does OOS_PERM mean for a RING node?",opts:["Node temporarily out of service","Node permanently lost, its data must be rebuilt","Node in maintenance mode","Node overloaded"],ans:1,expl:"OOS_PERM (Out Of Service Permanent) means the node is definitively lost. The ring triggers a rebuild of that node's data onto the surviving nodes."},
  {q:"Which tool is used to manage physical disks on RING nodes?",opts:["biziod","biziotools/scaldisk","repd","MESA"],ans:1,expl:"scaldisk (and biziotools) is the disk management tool on RING nodes. It allows adding, removing, or checking the status of disks integrated into the storage service."},
  {q:"What is a 'Disk Orphan'?",opts:["An unformatted disk","An object physically present on disk with no reference in the Chord metadata","A disk with a SMART error","A disk not assigned to a Bizstorenode"],ans:1,expl:"A Disk Orphan is an object physically present on disk but with no entry in the Chord metadata. It is eligible for deletion via Chord Purge."},
  {q:"Which operation cleans up Disk Orphans?",opts:["Rebuild","Repair","Chord Purge","Balance"],ans:2,expl:"Chord Purge cleans up orphaned entries in the Chord space. It removes references to objects that no longer exist physically and can identify Disk Orphans."},
  {q:"What is an INCOMPLETE object?",opts:["A partially encrypted object","An object whose fragments were not all written during ingestion","An object without S3 metadata","An object being replicated"],ans:1,expl:"An INCOMPLETE object was partially written: some fragments are missing. It is present but degraded. A Rebuild can attempt to complete it if enough fragments exist."},
  {q:"Which daemon handles low-level I/O operations on physical disks?",opts:["sproxyd","repd","biziod","membershipd"],ans:2,expl:"biziod is the low-level I/O daemon. It directly manages reads and writes on physical disks on behalf of sproxyd, maintaining an index on SSD."},
  {q:"Before physically replacing a failing disk, which command must be run to cleanly remove the disk from service?",opts:["Shut down the node directly","Use scaldisk to mark the disk as OOS before physically removing it","Run a full Rebuild","Launch Chord Purge on the disk"],ans:1,expl:"The disk removal must first be signaled via scaldisk so that the ring redistributes data to other disks before the physical removal. Removing a disk hot without prior notice can cause temporary loss of access to objects."},
  {q:"Why does biziod keep its data files on HDD at a fixed size (containers)?",opts:["To simplify LUKS encryption","Fixed-size containers avoid filesystem fragmentation and allow direct block management, optimizing sequential I/O performance on HDD","To reduce disk space usage","HDD does not support variable-size files"],ans:1,expl:"Fixed-size containers on HDD avoid fragmentation. biziod manages allocation within these containers itself, bypassing the limitations of generic filesystems and optimizing sequential I/O for large blob writes."}
]},
{id:'07',num:'07',title:'Tâches Automatiques du RING',desc:'Rebuild, Repair, Balance, Relocation, GC, Purge — tâches déclenchées et gérées automatiquement par le RING',
content:'<h2>Vue d\'Ensemble des Tâches de Fond</h2><p>Le RING exécute en permanence des <strong>tâches de fond (background tasks)</strong> pour maintenir l\'intégrité, l\'équilibre et la disponibilité des données. Ces tâches sont orchestrées par le Supervisor et s\'executent de façon asynchrone sans impacter (idéalement) les I/O de production. Chacune répond a un besoin precis :</p><table><tr><th>Tâche</th><th>Declencheur principal</th><th>Objectif</th><th>Priorité</th></tr><tr><td><strong>Rebuild</strong></td><td>Fragments ARC manquants (panne disque/serveur)</td><td>Reconstituer les fragments ARC perdus</td><td>HAUTE</td></tr><tr><td><strong>Repair</strong></td><td>Répliques COS insuffisantes</td><td>Ramener COS au nombre de répliques requis</td><td>HAUTE</td></tr><tr><td><strong>Balance</strong></td><td>Déséquilibre de charge entre nodes</td><td>Repartir les données uniformément</td><td>MOYENNE</td></tr><tr><td><strong>Relocation</strong></td><td>Ajout de nouveaux nodes (expansion)</td><td>Migrer les objets vers les nouveaux nodes</td><td>MOYENNE</td></tr><tr><td><strong>Garbage Collector</strong></td><td>Deletion d\'objets / fragments orphelins</td><td>Libérer l\'espace disque des objets supprimés</td><td>BASSE</td></tr><tr><td><strong>Purge</strong></td><td>Versioning S3 / anciennes versions</td><td>Supprimer les versions d\'objets obsoletes</td><td>BASSE</td></tr><tr><td><strong>Chord Purge</strong></td><td>Fin de maintenance d\'un node</td><td>Nettoyer les entrées P2P obsoletes</td><td>BASSE</td></tr></table><h2>Rebuild — La Tâche la Plus Critique</h2><p>Le <strong>Rebuild</strong> est la tâche la plus importante car elle protège directement contre la perte de données. Elle est déclenchée automatiquement des qu\'un fragment ARC est détecte comme manquant.</p><h3>Deroulement d\'un Rebuild ARC</h3><ol><li><strong>Détection</strong> : un Biziod cible est inaccessible. Le Bizstorenode responsable détecte que le fragment est manquant.</li><li><strong>Évaluation</strong> : combien de fragments sont disponibles ? Si &gt;= K fragments disponibles, le Rebuild est possible.</li><li><strong>Récupération</strong> : le RING lit les K fragments disponibles depuis leurs Biziod respectifs.</li><li><strong>Decodage</strong> : l\'objet original est reconstruit en mémoire (decodage Reed-Solomon).</li><li><strong>Re-encodage</strong> : les fragments manquants sont recalcules.</li><li><strong>Écriture</strong> : les nouveaux fragments sont écrits sur des Biziod de remplacement (autre disque, autre serveur).</li><li><strong>Mise a jour MESA</strong> : l\'entrée MESA est mise a jour avec les nouveaux emplacements.</li></ol><div class="alert alert-d">Si le nombre de fragments disponibles tombe en dessous de K (seuil minimum pour le decodage), le Rebuild echoue et l\'objet est irrécupérable. Le RING passe en état ARC_REBUILD_NOK. Contacter Scality Support immédiatement.</div><h3>Suivi du Rebuild</h3><p>Le Rebuild est visible dans la section Tasks du Supervisor avec :</p><ul><li>Nombre d\'objets en cours de reconstruction</li><li>Vitesse de progression (objets/heure)</li><li>Estimation du temps restant</li></ul><h2>Repair — Reconstruction des Répliques COS</h2><p>Le <strong>Repair</strong> est l\'equivalent du Rebuild pour les objets en réplication COS. Il est déclenche quand un objet COS a moins de répliques que le facteur requis :</p><ul><li>Le RING détecte qu\'un objet COS 3 n\'a que 2 répliques (panne d\'un node).</li><li>Une des répliques existantes est lue.</li><li>L\'objet est réécrit sur un Bizstorenode disponible pour recreer la 3eme réplique manquante.</li><li>MESA est mise a jour.</li></ul><p>L\'état <code>INCOMPLETE</code> dans le Supervisor indique que des objets ont un nombre insuffisant de répliques COS (Repair en attente ou en cours).</p><h2>Balance — Équilibrage des Données</h2><p>Le <strong>Balance</strong> est déclenche lorsqu\'une inégalité de remplissage est détectée entre Bizstorenode. Les scenarios classiques :</p><ul><li><strong>Après un upgrade</strong> : un node arrête et redémarre vide peut attirer moins de nouvelles données que les autres.</li><li><strong>Après un Rebuild intensif</strong> : certains disques sont plus charges que d\'autres après la reconstruction.</li><li><strong>Après une expansion</strong> : les nouveaux nodes sont vides, les anciens sont pleins.</li></ul><div class="alert alert-w">Lors d\'un upgrade RING, ne pas passer au serveur suivant tant que le Balance n\'est pas termine sur le serveur précédent. Un Balance interrompu laisse le RING dans un état déséquilibre qui risque de provoquer un DISK_FULL premature sur certains nodes.</div><h2>Relocation — Migration Lors d\'une Expansion</h2><p>Quand de nouveaux Bizstorenode rejoignent le RING (expansion), ils obtiennent des segments du keyspace des anciens nodes. La <strong>Relocation</strong> migre les objets correspondants vers leur nouvel emplacement :</p><ol><li>Calcul des nouveaux segments de keyspace pour les nouveaux nodes.</li><li>Pour chaque objet dont la clé appartient desormais a un nouveau node : lecture depuis l\'ancien emplacement, écriture vers le nouveau.</li><li>Mise a jour MESA.</li><li>Suppression de l\'ancienne copie (GC).</li></ol><h2>Garbage Collector — Nettoyage des Orphelins</h2><p>Le <strong>GC</strong> libère l\'espace occupe par des chunks qui ne sont plus références dans MESA :</p><ul><li>Chunks écrits mais dont l\'objet a ete supprimé ensuite</li><li>Fragments partiels d\'une écriture avortée (timeout, erreur réseau)</li><li>Anciennes versions d\'objets dont le Purge n\'a pas encore ete exécute</li></ul><p>Le GC tourne en basse priorité car il n\'est pas urgent — les chunks orphelins n\'affectent pas la disponibilité, seulement la capacité disque disponible.</p><p class="alert-i"><strong>Controle admin des tâches :</strong> le throttling et les commandes ringsh (mode maintenance) sont couverts dans le module <strong>MD — Maintenance RING</strong>.</p><div class="kbox"><h3>Points Clés a Retenir</h3><ul><li>Toutes ces tâches sont <strong>automatiques</strong> — le RING les déclenche sans intervention humaine</li><li>Rebuild = reconstitution fragments ARC perdus (priorité HAUTE, tâche la plus critique)</li><li>Repair = reconstitution répliques COS manquantes (même priorité que Rebuild)</li><li>ARC_REBUILD_NOK = Rebuild impossible, données irrécupérables → Scality Support immédiatement</li><li>Balance = rééquilibrage du remplissage entre nodes (après upgrade ou expansion)</li><li>Relocation = migration des objets vers les nouveaux nodes lors d\'une expansion</li><li>GC/Purge = nettoyage asynchrone des objets supprimés (basse priorité, délai 7 jours)</li></ul></div>',
quiz:[
  {q:"Quelle tâche reconstruit les fragments manquants après une panne nœud ?",opts:["Balance","Repair","Rebuild","Relocation"],ans:2,expl:"Rebuild reconstruit les fragments manquants d'un objet dégradé à partir des fragments survivants. Il est déclenché automatiquement après une panne nœud ou disque."},
  {q:"Quelle est la différence entre Rebuild et Repair ?",opts:["Pas de différence, ce sont des synonymes","Rebuild reconstruit les fragments manquants, Repair vérifie et corrige l'intégrité de tous les objets","Repair est manuel, Rebuild est automatique","Rebuild est pour les métadonnées, Repair pour les données"],ans:1,expl:"Rebuild cible les objets spécifiquement identifiés comme dégradés (fragments manquants). Repair est une vérification complète de l'intégrité de tous les objets du ring, plus exhaustif mais plus lent."},
  {q:"Quand la tâche Balance est-elle déclenchée ?",opts:["Toutes les 24h automatiquement","Uniquement en mode maintenance","Lors de l'ajout ou du retrait d'un nœud, pour redistribuer équitablement les données","Après chaque écriture d'objet"],ans:2,expl:"Balance est déclenchée lors d'un changement de topologie (ajout/retrait nœud). Elle redistribue les données pour que chaque nœud garde une charge proportionnelle à sa capacité."},
  {q:"Pourquoi est-il risqué d'augmenter le throttling de Rebuild à 100% pendant les heures de production ?",opts:["Cela ne présente aucun risque","Un Rebuild à plein régime consomme toutes les I/O disque, dégradant fortement les performances des clients et risquant de violer les SLA","Le Rebuild s'arrête automatiquement à 50%","Cela annule la tâche Balance"],ans:1,expl:"Le throttling limite la consommation des ressources I/O par les tâches de fond. Sans throttling, Rebuild monopolise les disques et dégrade les temps de réponse des requêtes clients. Un équilibre est nécessaire entre vitesse de rebuild et QoS client."},
  {q:"Un Repair découvre des objets INCOMPLETE que Rebuild ne parvient pas à reconstruire. Que cela indique-t-il ?",opts:["Le ring a besoin d'être redémarré","Trop de fragments sont manquants pour permettre la reconstruction : le seuil ARC est dépassé, les données sont irrécupérables sans intervention externe","Un bug dans Repair","Il faut augmenter le COS"],ans:1,expl:"Si Rebuild échoue à reconstruire un objet INCOMPLETE, cela signifie que le nombre de fragments survivants est inférieur au seuil minimal (k fragments de données en ARC). Les données sont irrécupérables sans une source externe comme un backup ou un site DR."},
  {q:"Quelle tâche identifié les références Chord pointant vers des objets physiquement absents ?",opts:["Rebuild","Balance","Repair","Chord Purge"],ans:3,expl:"Chord Purge analyse les références dans l'espace Chord et identifié celles ne correspondant à aucun objet physique sur disque (Chord Orphans). Il nettoie aussi les Disk Orphans (objets physiques sans référence Chord)."},
  {q:"Dans quel ordre logique les tâches automatiques s'enchaînent-elles typiquement après une panne nœud ?",opts:["Balance -> Rebuild -> Repair","Rebuild (reconstruction urgente) -> Balance (rééquilibrage) -> Repair (vérification intégrité)","Repair -> Rebuild -> Balance","Chord Purge -> Rebuild -> Balance"],ans:1,expl:"Après une panne : Rebuild est déclenché en priorité pour restaurer la protection des objets dégradés. Puis Balance redistribue la charge. Repair peut ensuite faire une vérification complète de l'intégrité. Chord Purge nettoie les orphelins en dernier."},
  {q:"À quoi sert le paramètre de priorité des tâches de fond dans ringsh ?",opts:["Il fixe l'ordre d'exécution des tâches de manière absolue","Il ajuste dynamiquement l'allocation des ressources I/O entre les tâches de fond et les requêtes clients selon la charge","Il empêche certaines tâches de démarrer","Il configuré le nombre de threads par tâche"],ans:1,expl:"La priorité des tâches de fond permet de configurer combien de ressources I/O chaque tâche (Rebuild, Repair, Balance) peut utiliser par rapport aux requêtes clients. Cela permet d'accélérer le rebuild en maintenance sans impacter les clients en production."}
],
title_en:'Automatic RING Tasks',
desc_en:'Rebuild, Repair, Balance, Relocation, GC, Purge — tasks triggered and managed automatically by the RING',
content_en:'<h2>Background Tasks Overview</h2><p>The RING continuously runs <strong>background tasks</strong> to maintain data integrity, balance, and availability. These tasks are orchestrated by the Supervisor and execute asynchronously without (ideally) impacting production I/O. Each task addresses a specific need:</p><table><tr><th>Task</th><th>Main Trigger</th><th>Objective</th><th>Priority</th></tr><tr><td><strong>Rebuild</strong></td><td>Missing ARC fragments (disk/server failure)</td><td>Reconstruct lost ARC fragments</td><td>HIGH</td></tr><tr><td><strong>Repair</strong></td><td>Insufficient COS replicas</td><td>Restore COS to the required replica count</td><td>HIGH</td></tr><tr><td><strong>Balance</strong></td><td>Load imbalance between nodes</td><td>Distribute data evenly</td><td>MEDIUM</td></tr><tr><td><strong>Relocation</strong></td><td>Addition of new nodes (expansion)</td><td>Migrate objects to the new nodes</td><td>MEDIUM</td></tr><tr><td><strong>Garbage Collector</strong></td><td>Deletion of objects / orphan fragments</td><td>Free disk space from deleted objects</td><td>LOW</td></tr><tr><td><strong>Purge</strong></td><td>S3 versioning / old versions</td><td>Delete obsolete object versions</td><td>LOW</td></tr><tr><td><strong>Chord Purge</strong></td><td>End of node maintenance</td><td>Clean up obsolete P2P entries</td><td>LOW</td></tr></table><h2>Rebuild — The Most Critical Task</h2><p>The <strong>Rebuild</strong> is the most important task because it directly protects against data loss. It is triggered automatically as soon as an ARC fragment is detected as missing.</p><h3>ARC Rebuild Workflow</h3><ol><li><strong>Detection</strong>: a target Biziod is unreachable. The responsible Bizstorenode detects that the fragment is missing.</li><li><strong>Assessment</strong>: how many fragments are available? If &gt;= K fragments are available, the Rebuild is possible.</li><li><strong>Recovery</strong>: the RING reads the K available fragments from their respective Biziod instances.</li><li><strong>Decoding</strong>: the original object is reconstructed in memory (Reed-Solomon decoding).</li><li><strong>Re-encoding</strong>: the missing fragments are recalculated.</li><li><strong>Writing</strong>: the new fragments are written to replacement Biziod instances (another disk, another server).</li><li><strong>MESA Update</strong>: the MESA entry is updated with the new locations.</li></ol><div class="alert alert-d">If the number of available fragments drops below K (the minimum threshold for decoding), the Rebuild fails and the object is unrecoverable. The RING enters the ARC_REBUILD_NOK state. Contact Scality Support immediately.</div><h3>Rebuild Monitoring</h3><p>The Rebuild is visible in the Tasks section of the Supervisor with: number of objects currently being reconstructed, progress rate (objects/hour), estimated time remaining.</p><h2>Repair — COS Replica Reconstruction</h2><p>The <strong>Repair</strong> is the COS replication equivalent of Rebuild. It is triggered when a COS object has fewer replicas than the required replication factor. The RING detects that a COS 3 object has only 2 replicas (node failure), reads one existing replica, rewrites the object to an available Bizstorenode to recreate the missing 3rd replica, and updates MESA. The <code>INCOMPLETE</code> state in the Supervisor indicates objects with an insufficient number of COS replicas (Repair pending or in progress).</p><h2>Balance — Data Balancing</h2><p>The <strong>Balance</strong> is triggered when a fill-level inequality is detected between Bizstorenode instances. Common scenarios: after an upgrade (a restarted empty node attracts fewer writes), after intensive Rebuild (some disks more loaded), after expansion (new nodes empty, old ones full).</p><div class="alert alert-w">During a RING upgrade, do not move to the next server until Balance has completed on the previous one. An interrupted Balance leaves the RING in an unbalanced state that risks a premature DISK_FULL on certain nodes.</div><h2>Relocation — Migration During Expansion</h2><p>When new Bizstorenode instances join the RING, they are assigned keyspace segments from existing nodes. <strong>Relocation</strong> migrates the corresponding objects to their new location: calculate new keyspace segments, read from old location and write to new location for each affected object, update MESA, delete the old copy (GC).</p><h2>Garbage Collector — Orphan Cleanup</h2><p>The <strong>GC</strong> frees space occupied by chunks no longer referenced in MESA: chunks whose object was deleted, partial fragments from aborted writes (timeout, network error), and old object versions whose Purge has not yet executed. The GC runs at low priority — orphan chunks do not affect availability, only available disk capacity.</p><p class="alert-i"><strong>Admin task control:</strong> throttling and ringsh commands (maintenance mode) are covered in the <strong>MD — RING Maintenance</strong> module.</p><div class="kbox"><h3>Key Takeaways</h3><ul><li>All these tasks are <strong>automatic</strong> — the RING triggers them without human intervention</li><li>Rebuild = reconstruction of lost ARC fragments (HIGH priority, most critical task)</li><li>Repair = reconstruction of missing COS replicas (same priority as Rebuild)</li><li>ARC_REBUILD_NOK = Rebuild impossible, data unrecoverable, contact Scality Support immediately</li><li>Balance = rebalancing of fill levels between nodes (after upgrade or expansion)</li><li>Relocation = migration of objects to new nodes during an expansion</li><li>GC/Purge = asynchronous cleanup of deleted objects (low priority, 7-day delay)</li></ul></div>',
quiz_en:[
  {q:"Which task reconstructs missing fragments after a node failure?",opts:["Balance","Repair","Rebuild","Relocation"],ans:2,expl:"Rebuild reconstructs the missing fragments of a degraded object from the surviving fragments. It is triggered automatically after a node or disk failure."},
  {q:"What is the difference between Rebuild and Repair?",opts:["There is no difference, they are synonyms","Rebuild reconstructs missing fragments, Repair checks and corrects the integrity of all objects","Repair is manual, Rebuild is automatic","Rebuild is for metadata, Repair is for data"],ans:1,expl:"Rebuild targets objects specifically identified as degraded (missing fragments). Repair is a complete integrity check of all objects in the ring — more exhaustive but slower."},
  {q:"When is the Balance task triggered?",opts:["Automatically every 24 hours","Only in maintenance mode","When a node is added or removed, to redistribute data evenly","After every object write"],ans:2,expl:"Balance is triggered by a topology change (node addition/removal). It redistributes data so that each node maintains a load proportional to its capacity."},
  {q:"Why is it risky to increase Rebuild throttling to 100% during production hours?",opts:["There is no risk","A full-speed Rebuild consumes all disk I/O, severely degrading client performance and risking SLA violations","Rebuild automatically stops at 50%","It cancels the Balance task"],ans:1,expl:"Throttling limits the I/O resource consumption of background tasks. Without throttling, Rebuild monopolizes disks and degrades client request response times. A balance between rebuild speed and client QoS is necessary."},
  {q:"A Repair discovers INCOMPLETE objects that Rebuild cannot reconstruct. What does this indicate?",opts:["The ring needs to be restarted","Too many fragments are missing: the ARC threshold has been exceeded, data is unrecoverable without external intervention","A bug in Repair","COS needs to be increased"],ans:1,expl:"If Rebuild fails to reconstruct an INCOMPLETE object, the number of surviving fragments is below the minimum threshold (k data fragments in ARC). Data is unrecoverable without an external source such as a backup or DR site."},
  {q:"Which task identifies Chord references pointing to physically absent objects?",opts:["Rebuild","Balance","Repair","Chord Purge"],ans:3,expl:"Chord Purge analyzes references in the Chord space and identifies those that do not correspond to any physical object on disk (Chord Orphans). It also cleans up Disk Orphans (physical objects with no Chord reference)."},
  {q:"In what logical order do the automatic tasks typically chain together after a node failure?",opts:["Balance -> Rebuild -> Repair","Rebuild (urgent reconstruction) -> Balance (rebalancing) -> Repair (integrity check)","Repair -> Rebuild -> Balance","Chord Purge -> Rebuild -> Balance"],ans:1,expl:"After a failure: Rebuild is triggered first to restore protection for degraded objects. Then Balance redistributes the load. Repair then performs a full integrity check. Chord Purge cleans up orphans last."},
  {q:"What does the background task priority parameter in ringsh do?",opts:["It sets the absolute execution order of tasks","It dynamically adjusts I/O resource allocation between background tasks and client requests based on load","It prevents certain tasks from starting","It configures the number of threads per task"],ans:1,expl:"The background task priority allows configuring how much I/O resource each task (Rebuild, Repair, Balance) can use relative to client requests. This allows accelerating rebuild during maintenance without impacting clients in production."}
]},
{id:'08',num:'08',title:'Gestion des Erreurs',desc:'INCOMPLETE, ARC_REBUILD_NOK, CONF_MISMATCH, SPLIT LOOP et resolutions',
content:'<h2>Tableau de Référence des États d\'Erreur</h2><table><tr><th>État</th><th>Severite</th><th>Impact immédiat</th><th>Action requise</th></tr><tr><td><code>INCOMPLETE</code></td><td>Avertissement</td><td>Certains objets sous-repliques, risque si autre panne</td><td>Surveiller le Rebuild/Repair</td></tr><tr><td><code>ARC_REBUILD_NOK</code></td><td>CRITIQUE</td><td>Données potentiellement irrécupérables</td><td>Contacter Scality Support IMMEDIATEMENT</td></tr><tr><td><code>DISK_FULL</code></td><td>CRITIQUE</td><td>Écritures bloquées sur ce disque</td><td>Libérer de l\'espace ou ajouter de la capacité</td></tr><tr><td><code>DISK USAGE WARNING</code></td><td>Avertissement</td><td>Disque approche de la saturation</td><td>Planifier ajout de capacité</td></tr><tr><td><code>CONF_MISMATCH</code></td><td>Informatif</td><td>Aucun (normal post-upgrade Supervisor)</td><td>Rien -- se corrige lors de l\'upgrade des nodes</td></tr><tr><td><code>SPLIT LOOP</code></td><td>CRITIQUE</td><td>Partitionnement du cluster, risque de split-brain</td><td>Diagnostiquer réseau, ne pas écrire</td></tr><tr><td><code>NOT STABILIZED</code></td><td>Transitoire</td><td>RING en cours de convergence (normal post-join/leave)</td><td>Attendre la stabilisation automatique</td></tr></table><h2>INCOMPLETE — Analyse Detaillee</h2><p>L\'état INCOMPLETE signifie que le RING a détecte des objets dont le nombre de répliques (COS) ou de fragments valides (ARC) est inférieur au minimum requis. C\'est une alerte preventive — les données sont encore accessibles mais moins bien protégées.</p><h3>Causes courantes</h3><ul><li>Panne d\'un serveur storage (un node est DOWN ou en OOS)</li><li>Panne d\'un disque (un Biziod ne répond plus)</li><li>Congestion réseau causant des timeouts d\'écriture</li><li>Phase transitoire après un nodeLeave (normal, temporaire)</li></ul><h3>Résolution</h3><ul><li>Les tâches <strong>Rebuild</strong> (pour ARC) et <strong>Repair</strong> (pour COS) corrigent automatiquement l\'INCOMPLETE.</li><li>Si le node/disque est en panne permanente, il faut le remplacer et laisser le Rebuild se terminer.</li><li>Si l\'INCOMPLETE persiste sans raison apparente (tous les nodes sont UP), investiguer les logs Biziod.</li></ul><h2>ARC_REBUILD_NOK — Urgence Absolue</h2><div class="alert alert-d">ARC_REBUILD_NOK est l\'état le plus grave du RING. Il indique que des objets ARC ont perdu plus de M fragments (le nombre de fragments de parite) simultanément. Ces objets sont mathematiquement irrécupérables — aucune reconstruction n\'est possible.</div><h3>Causes</h3><ul><li>Panne simultanée de plusieurs serveurs/disques (par exemple : incendie, coupure de courant affectant plusieurs racks)</li><li>Bug dans le Rebuild qui a echoue silencieusement sur plusieurs fragments</li><li>Corruption de données systématique (bit rot sur plusieurs disques sans ECC)</li></ul><h3>Procédure d\'urgence</h3><ol><li><strong>Stopper toutes les écritures</strong> si possible pour éviter d\'aggraver la situation.</li><li><strong>Contacter Scality Support immédiatement</strong> avec les logs du Supervisor.</li><li><strong>Ne pas tenter de correction manuelle</strong> — les procédures Scality Support sont spécifiques a chaque cas.</li><li><strong>Evaluer les sauvegardes</strong> disponibles pour les objets affectes.</li></ol><h2>CONF_MISMATCH — État Normal Post-Upgrade</h2><div class="alert alert-i">CONF_MISMATCH ne représente AUCUN risque pour les données. C\'est simplement une indication que les packages logiciels ne sont pas tous a la même version sur tous les nodes. Il est ATTENDU après l\'upgrade du Supervisor et avant l\'upgrade des storage nodes.</div><h3>Causes</h3><ul><li>Le Supervisor vient d\'être upgrade mais les storage nodes ont encore l\'ancienne version.</li><li>Un node a ete ajoute recemment avec une version différente.</li></ul><h3>Résolution</h3><ul><li>CONF_MISMATCH <strong>disparait automatiquement</strong> quand tous les storage nodes sont upgrages a la même version.</li><li>Ne <strong>JAMAIS</strong> cliquer "Apply Configuration" dans l\'UI pendant un upgrade : cela appliquerait la configuration de la nouvelle version sur des nodes avec l\'ancien code, causant une interruption de service.</li></ul><h2>SPLIT LOOP — Partitionnement Réseau</h2><p>Le <strong>SPLIT LOOP</strong> (ou split brain) est un des états les plus dangereux. Il survient quand le cluster se divise en deux groupes de nodes qui ne peuvent plus communiquer entre eux :</p><div class="adiag">État normal :\n[Node1] --- [Node2] --- [Node3] --- [Node4] --- [Node5]\n   Tous se voient, quorum maintenu\n\nSPLIT LOOP :\n[Node1] --- [Node2]    X    [Node3] --- [Node4] --- [Node5]\nGroupe A (2 nodes)          Groupe B (3 nodes)\n\nProbleme : les 2 groupes peuvent accepter des écritures indépendantes\n           -> Risque de divergence des données</div><h3>Causes</h3><ul><li>Panne d\'un switch réseau central</li><li>Problème de cable entre des segments du réseau</li><li>Configuration VLAN incorrecte</li><li>Saturation de bande passante réseau inter-nodes</li></ul><h3>Procédure de résolution</h3><ol><li><strong>Stopper immédiatement les écritures</strong> sur les deux groupes si possible.</li><li><strong>Diagnostiquer la connectivité</strong> : ping entre tous les nodes, vérifier les interfaces réseau, les switches.</li><li><strong>Corriger la cause réseau</strong> (remplacer le switch, reparer le cable, corriger la config VLAN).</li><li>Une fois la connectivité rétablie, le RING se re-synchronise automatiquement (NOT_STABILIZED puis RUN).</li><li>Vérifier l\'intégrité des données avec Scality Support si des écritures ont eu lieu pendant le split.</li></ol><h2>Analyse des Logs — Outils</h2><pre># Logs sproxyd (erreurs HTTP 5xx)\ngrep \'http_code="5\' /var/log/scality-sproxyd.log\n\n# Rechercher une requête par son ID\ngrep \'reqid="0000653D0000D09"\' /var/log/scality-sproxyd.log\n\n# Vérifier les processus sproxyd\nnetstat -tnlp | grep :81     # Apache frontal\nnetstat -tnlp | grep :10000  # Daemon sproxyd\n\n# Logs Bizstorenode\ncat /var/log/scality-node/current\n\n# Logs Biziod (par disque)\ncat /var/log/scality-biziod-&lt;disk_id&gt;/current</pre><h2>P1 Troubleshooting — Arbre de Decision</h2><p>Un incident P1 correspond a une <strong>interruption totale de service</strong> ou une <strong>dégradation majeure</strong> impactant les utilisateurs finaux. La procédure de diagnostic suit un arbre de decision structure.</p><h3>Arbre de decision P1</h3><div class="adiag">SYMPTOMES P1 :\n"It\'s slow" / Latences élevées / Timeouts / Erreurs 500 en masse\n\nETAPE 1 : Vérifier la sante globale du RING\n  ringsh supervisor ringStatus DATA\n  ringsh supervisor ringStatus META\n  -> Si RING degraded/rebuilding : voir module M7 (tâches RING)\n  -> Si RING OK : passer a l\'étape 2\n\nETAPE 2 : Vérifier la sante des disques et serveurs\n  scaldisk iods list          # disques OOS ?\n  salt -s \'*\' cmd.run \'df -h\' # espace disque OK ?\n  salt -s \'*\' cmd.run \'free -h\' # RAM OK ?\n  -> Si disque plein/OOS : traiter en priorité\n\nETAPE 3 : Vérifier le réseau\n  # Vérifier les retransmissions TCP (doit être ~0)\n  # Tester le debit entre nœuds avec iperf3\n  # Vérifier la cohérence MTU (jumbo frames)\n  -> Si retransmissions > 0 : problème réseau, escalader\n\nETAPE 4 : Si S3 en erreur\n  -> Vérifier les containers S3 (ctrctl ps)\n  -> Vérifier les alertes Raft (Prometheus)\n  -> Suivre une requête dans les logs S3\n\nETAPE 5 : Si SOFS en erreur\n  -> Vérifier CTDB et sfused (voir module MA)</div><h3>Commandes de diagnostic S3 rapide</h3><pre># Taux d\'erreurs S3 en temps reel (nécessite pv installe)\ntail -f /var/log/s3/scality-s3/logs/s3-0.log | grep elapsed | pv -i 1 -l -r > /dev/null\n\n# Taux de 500 en temps reel\ntail -f /var/log/s3/scality-s3/logs/s3-0.log | grep \'"httpCode":5\' | pv -i 1 -l -r > /dev/null\n\n# Suivre une requête lente par son request_id\ngrep "request_id_from_500_log" /var/log/s3/scality-s3/logs/*.log\n\n# Identifier si la latence vient des métadonnées (bucketd/repd)\n# ou du stockage (sproxyd → RING)\negrep \'elapsed\' /var/log/s3/scality-s3/logs/s3-0.log | awk -F\'elapsed":\' \'{print $2}\' | sort -n | tail -20\n\n# Health check S3 complet\n/usr/bin/scality-compute-s3-health -d -c /etc/scality/s3-healthcheck/config.yaml 2>&1</pre><div class="kbox"><h3>Points Clés a Retenir</h3><ul><li>INCOMPLETE = sous-replication temporaire (Rebuild/Repair corrige automatiquement)</li><li>ARC_REBUILD_NOK = URGENCE : données irrécupérables, Scality Support immédiatement</li><li>CONF_MISMATCH = NORMAL post-upgrade Supervisor, ne JAMAIS cliquer Apply Config</li><li>SPLIT LOOP = partitionnement réseau : stopper les écritures, reparer le réseau</li><li>DISK_FULL = saturation disque : aucune nouvelle écriture possible sur ce disque</li><li>sproxyd : port 81 (Apache), port 10000 (daemon interne)</li></ul></div>',
quiz:[
  {q:"Que signifie l'alarme SPLIT LOOP ?",opts:["Boucle infinie dans le code Scality","Fragmentation du ring en partitions réseau isolées (split-brain)","Erreur de réplication CRR","Disque en boucle de rebuild"],ans:1,expl:"SPLIT LOOP est une alarme critique : le ring s'est fragmenté en partitions qui ne se voient plus. Provoque un split-brain et nécessite une intervention immédiate pour éviter la corruption."},
  {q:"Que faire en premier face à une alarme ARC_REBUILD_NOK ?",opts:["Redémarrer le nœud","Vérifier le statut des nœuds (nodeList) et identifier les nœuds OOS ou OOS_PERM","Reformater les disques","Désactiver les alarmes"],ans:1,expl:"ARC_REBUILD_NOK signifie qu'un rebuild a échoué. La première étape est de vérifier quels nœuds sont OOS/OOS_PERM via nodeList pour comprendre pourquoi les fragments ne peuvent pas être reconstruits."},
  {q:"L'alarme CONF_MISMATCH indique quoi ?",opts:["Un objet corrompu","Une incohérence de configuration entre nœuds du ring","Un quota S3 dépassé","Un certificat SSL expiré"],ans:1,expl:"CONF_MISMATCH signale une incohérence de configuration entre nœuds. Peut indiquer une différence de version logicielle ou de paramètre. À investiguer via Salt et la comparaison des configs."},
  {q:"Quelle est la cause la plus fréquente d'un nœud passant en OOS (pas OOS_PERM) ?",opts:["Défaillance permanente du matériel","Interruption réseau temporaire ou redémarrage du service","Remplacement de disque","Upgrade du logiciel"],ans:1,expl:"OOS (Out Of Service) est généralement temporaire : coupure réseau, redémarrage service, maintenance planifiée. Le nœud peut rejoindre automatiquement le ring à son retour, contrairement à OOS_PERM."},
  {q:"Qu'est-ce que l'alarme INCOMPLETE indique comme action ?",opts:["Supprimer l'objet immédiatement","Lancer un Rebuild pour tenter de compléter les fragments manquants","Augmenter le COS","Réduire le throttling"],ans:1,expl:"Un objet INCOMPLETE a des fragments manquants depuis l'écriture. Un Rebuild peut tenter de le compléter en écrivant les fragments manquants si les données originales sont reconstituables depuis les fragments existants."},
  {q:"Dans quel module trouve-t-on les commandes de maintenance ringsh (nodeLeave, nodeJoin) ?",opts:["M5 Monitoring","M6 Gestion des Disques","MD Maintenance RING","M8 Gestion des Erreurs"],ans:2,expl:"Les commandes de maintenance ringsh (nodeLeave, nodeJoin, ringConfigSet) sont documentées dans le module MD dédié à la Maintenance RING. M5 ne couvre que les commandes de diagnostic."},
  {q:"Un opérateur reçoit une alarme DISKFULL sur un nœud. Quelle est la première action à éviter absolument ?",opts:["Vérifier l'espace disque réel avec df","Supprimer manuellement des fichiers de données biziod pour libérer de l'espace","Vérifier si des Disk Orphans peuvent être purgés","Contacter le support Scality"],ans:1,expl:"Supprimer manuellement des fichiers biziod peut corrompre des objets intègres et causer une perte de données irrécupérable. La gestion de l'espace doit toujours passer par les outils Scality (Chord Purge, scaldisk) qui comprennent la structure interne."},
  {q:"Vous observez une latence élevée sur les requêtes S3 GET mais pas sur les PUT. Quel composant investiguer en premier ?",opts:["Cloudserver","bucketd","biziod côté lecture (index SSD dégradé ou trop de fragments à reconstruire à la volée)","Vault"],ans:2,expl:"Les latences GET élevées sur fond de PUT normaux pointent vers biziod en lecture. Deux causes probables : l'index SSD est dégradé (ralentissant les lookups) ou de nombreux objets dégradés nécessitent une reconstruction à la volée depuis les fragments ARC, consommant CPU et I/O."}
],
title_en:'Error Management',
desc_en:'INCOMPLETE, ARC_REBUILD_NOK, CONF_MISMATCH, SPLIT LOOP and resolutions',
content_en:'<h2>Error State Reference Table</h2><table><tr><th>State</th><th>Severity</th><th>Immediate Impact</th><th>Required Action</th></tr><tr><td><code>INCOMPLETE</code></td><td>Warning</td><td>Some objects under-replicated, risk if another failure occurs</td><td>Monitor Rebuild/Repair</td></tr><tr><td><code>ARC_REBUILD_NOK</code></td><td>CRITICAL</td><td>Data potentially unrecoverable</td><td>Contact Scality Support IMMEDIATELY</td></tr><tr><td><code>DISK_FULL</code></td><td>CRITICAL</td><td>Writes blocked on this disk</td><td>Free space or add capacity</td></tr><tr><td><code>DISK USAGE WARNING</code></td><td>Warning</td><td>Disk approaching saturation</td><td>Plan capacity addition</td></tr><tr><td><code>CONF_MISMATCH</code></td><td>Informational</td><td>None (normal post-Supervisor upgrade)</td><td>Nothing — self-corrects upon node upgrade</td></tr><tr><td><code>SPLIT LOOP</code></td><td>CRITICAL</td><td>Cluster partitioning, split-brain risk</td><td>Diagnose network, stop writes</td></tr><tr><td><code>NOT STABILIZED</code></td><td>Transient</td><td>RING converging (normal post-join/leave)</td><td>Wait for automatic stabilization</td></tr></table><h2>INCOMPLETE — Detailed Analysis</h2><p>The INCOMPLETE state means the RING has detected objects whose replica count (COS) or valid fragment count (ARC) is below the required minimum. It is a preventive alert — data is still accessible but less well protected. Common causes: storage server failure (node DOWN or OOS), disk failure (Biziod not responding), network congestion causing write timeouts, transient phase after nodeLeave. The Rebuild (for ARC) and Repair (for COS) tasks correct INCOMPLETE automatically. If node/disk is permanently failed, replace it and let Rebuild complete. If INCOMPLETE persists with all nodes UP, investigate Biziod logs.</p><h2>ARC_REBUILD_NOK — Absolute Emergency</h2><div class="alert alert-d">ARC_REBUILD_NOK is the most severe state in the RING. It indicates that ARC objects have simultaneously lost more than M fragments (the number of parity fragments). These objects are mathematically unrecoverable — no reconstruction is possible.</div><p>Causes: simultaneous failure of multiple servers/disks (fire, power outage affecting multiple racks), bug in Rebuild that silently failed on multiple fragments, systematic data corruption (bit rot on multiple disks without ECC). Emergency procedure: (1) Stop all writes if possible. (2) Contact Scality Support immediately with Supervisor logs. (3) Do not attempt manual correction. (4) Evaluate available backups for affected objects.</p><h2>CONF_MISMATCH — Normal Post-Upgrade State</h2><div class="alert alert-i">CONF_MISMATCH represents NO risk to data. It simply indicates that software packages are not all at the same version on all nodes. It is EXPECTED after upgrading the Supervisor and before upgrading the storage nodes.</div><p>Resolution: CONF_MISMATCH disappears automatically when all storage nodes are upgraded to the same version. NEVER click Apply Configuration in the UI during an upgrade — this would apply the new version configuration to nodes still running old code, causing a service interruption.</p><h2>SPLIT LOOP — Network Partitioning</h2><p>The <strong>SPLIT LOOP</strong> (or split brain) is one of the most dangerous states. It occurs when the cluster splits into two groups of nodes that can no longer communicate with each other. Causes: failure of a central network switch, cable problem between network segments, incorrect VLAN configuration, inter-node network bandwidth saturation. Resolution procedure: (1) Immediately stop writes on both groups if possible. (2) Diagnose connectivity: ping between all nodes, check network interfaces and switches. (3) Fix the network cause (replace switch, repair cable, correct VLAN config). (4) Once connectivity is restored, the RING re-synchronizes automatically (NOT_STABILIZED then RUN). (5) Verify data integrity with Scality Support if writes occurred during the split.</p><div class="adiag">Normal state:\n[Node1] --- [Node2] --- [Node3] --- [Node4] --- [Node5]\n   All can see each other, quorum maintained\n\nSPLIT LOOP:\n[Node1] --- [Node2]    X    [Node3] --- [Node4] --- [Node5]\nGroup A (2 nodes)          Group B (3 nodes)\n\nProblem: the 2 groups may accept independent writes\n         -> Risk of data divergence</div><h2>Log Analysis — Tools</h2><pre># sproxyd logs (HTTP 5xx errors)\ngrep \'http_code=5\' /var/log/scality-sproxyd.log\n# Search for a request by its ID\ngrep \'reqid=0000653D0000D09\' /var/log/scality-sproxyd.log\n# Check sproxyd processes\nnetstat -tnlp | grep :81     # Apache frontend\nnetstat -tnlp | grep :10000  # sproxyd daemon\n# Bizstorenode logs\ncat /var/log/scality-node/current\n# Biziod logs (per disk)\ncat /var/log/scality-biziod-disk_id/current</pre><h2>P1 Troubleshooting — Decision Tree</h2><p>A P1 incident corresponds to a total service outage or major degradation impacting end users. Step 1: check overall RING health (ringsh supervisor ringStatus DATA/META). Step 2: check disk and server health (scaldisk iods list, df -h, free -h). Step 3: check the network (TCP retransmissions ~0, iperf3 throughput test, MTU consistency). Step 4: if S3 errors, check S3 containers (ctrctl ps), Raft alerts (Prometheus), trace requests through S3 logs. Step 5: if SOFS errors, check CTDB and sfused.</p><div class="kbox"><h3>Key Takeaways</h3><ul><li>INCOMPLETE = temporary under-replication (Rebuild/Repair corrects automatically)</li><li>ARC_REBUILD_NOK = EMERGENCY: data unrecoverable, contact Scality Support immediately</li><li>CONF_MISMATCH = NORMAL post-Supervisor upgrade, NEVER click Apply Config</li><li>SPLIT LOOP = network partitioning: stop writes, repair the network</li><li>DISK_FULL = disk saturation: no new writes possible on this disk</li><li>sproxyd: port 81 (Apache), port 10000 (internal daemon)</li></ul></div>',
quiz_en:[
  {q:"What does the SPLIT LOOP alarm mean?",opts:["Infinite loop in Scality code","Fragmentation of the ring into isolated network partitions (split-brain)","CRR replication error","Disk in a rebuild loop"],ans:1,expl:"SPLIT LOOP is a critical alarm: the ring has fragmented into partitions that can no longer see each other. It causes a split-brain and requires immediate intervention to avoid corruption."},
  {q:"What should you do first when facing an ARC_REBUILD_NOK alarm?",opts:["Restart the node","Check node status (nodeList) and identify nodes that are OOS or OOS_PERM","Reformat the disks","Disable the alarms"],ans:1,expl:"ARC_REBUILD_NOK means a rebuild has failed. The first step is to check which nodes are OOS/OOS_PERM via nodeList to understand why the fragments cannot be reconstructed."},
  {q:"What does the CONF_MISMATCH alarm indicate?",opts:["A corrupted object","A configuration inconsistency between ring nodes","An exceeded S3 quota","An expired SSL certificate"],ans:1,expl:"CONF_MISMATCH signals a configuration inconsistency between nodes. It may indicate a software version difference or parameter mismatch. Investigate via Salt and config comparison."},
  {q:"What is the most common cause of a node going OOS (not OOS_PERM)?",opts:["Permanent hardware failure","Temporary network interruption or service restart","Disk replacement","Software upgrade"],ans:1,expl:"OOS (Out Of Service) is generally temporary: network outage, service restart, planned maintenance. The node can automatically rejoin the ring upon return, unlike OOS_PERM."},
  {q:"What action does the INCOMPLETE alarm indicate?",opts:["Delete the object immediately","Trigger a Rebuild to attempt to complete the missing fragments","Increase the COS","Reduce throttling"],ans:1,expl:"An INCOMPLETE object has missing fragments from the time of writing. A Rebuild can attempt to complete it by writing the missing fragments if the original data can be reconstructed from the existing fragments."},
  {q:"In which module are the ringsh maintenance commands (nodeLeave, nodeJoin) found?",opts:["M5 Monitoring","M6 Disk Management","MD RING Maintenance","M8 Error Management"],ans:2,expl:"The ringsh maintenance commands (nodeLeave, nodeJoin, ringConfigSet) are documented in the MD module dedicated to RING Maintenance. M5 covers only diagnostic commands."},
  {q:"An operator receives a DISKFULL alarm on a node. What is the first action to absolutely avoid?",opts:["Check actual disk space with df","Manually delete biziod data files to free space","Check if Disk Orphans can be purged","Contact Scality support"],ans:1,expl:"Manually deleting biziod files can corrupt intact objects and cause unrecoverable data loss. Space management must always go through Scality tools (Chord Purge, scaldisk) that understand the internal structure."},
  {q:"You observe high latency on S3 GET requests but not on PUT requests. Which component should you investigate first?",opts:["Cloudserver","bucketd","biziod on the read side (degraded SSD index or too many fragments requiring on-the-fly reconstruction)","Vault"],ans:2,expl:"High GET latencies against normal PUT performance point to biziod on reads. Two likely causes: the SSD index is degraded (slowing lookups) or many degraded objects require on-the-fly reconstruction from ARC fragments, consuming CPU and I/O."}
]},
{id:'09',num:'09',title:'Sécurité et Administration',desc:'Rôles, SSO, Fail2ban, ordre de demarrage/arrêt',
content:'<h2>Les 4 Rôles du RING — Matrice de Permissions</h2><p>Le Supervisor utilisé un modèle de <strong>Role-Based Access Control (RBAC)</strong> avec 4 rôles prédéfinis. Chaque utilisateur se voit assigner un ou plusieurs rôles lors de sa création dans l\'interface Identity.</p><table><tr><th>Rôle</th><th>Lecture</th><th>Écriture</th><th>Cas d\'usage</th></tr><tr><td><strong>RING Admin</strong></td><td>Tout</td><td>Tout</td><td>Administrateur système Scality. Accès complet a toutes les opérations : configuration RING, gestion des disques, upgrade, utilisateurs.</td></tr><tr><td><strong>Identity Manager</strong></td><td>Tout (lecture seule)</td><td>Gestion des utilisateurs UNIQUEMENT</td><td>Responsable sécurité ou DBA qui gère les accès sans pouvoir modifier la configuration du RING.</td></tr><tr><td><strong>Monitoring Manager</strong></td><td>Tout</td><td>Dashboards Grafana uniquement</td><td>Équipe monitoring/NOC qui visualise et personnalise les dashboards sans pouvoir modifier le RING.</td></tr><tr><td><strong>RING Viewer</strong></td><td>Tout (lecture seule)</td><td>Aucune</td><td>Auditeurs, équipes applicatives qui ont besoin de visibilite sur l\'état du stockage sans droit de modification.</td></tr></table><div class="alert alert-i">Un même utilisateur peut avoir plusieurs rôles. Par exemple, un administrateur senior peut être a la fois RING Admin et Identity Manager.</div><h2>Authentification SSO — Depuis RING 9.4.0</h2><p>Avant RING 9.4.0, l\'authentification des utilisateurs du Supervisor était gérée de façon basique (LDAP ou comptes locaux simples). Depuis <strong>9.4.0</strong>, le Supervisor intègre un système de <strong>Single Sign-On (SSO)</strong> complet base sur un Identity Provider (IdP) interne.</p><h3>Premiers pas après l\'installation</h3><ul><li>Credentials initiaux : <code>admin</code> / <code>Default_passw0rd</code></li><li><strong>Changer le mot de passe immédiatement</strong> après la première connexion</li><li>Créer les utilisateurs supplémentaires via l\'interface <code>Identity</code> du Supervisor</li></ul><h3>Gestion des utilisateurs (interface Identity)</h3><ul><li>Création : nom, email, mot de passe, rôle(s) assigne(s)</li><li>Politique de mot de passe : longueur minimum, complexité, expiration configurable</li><li>Desactivation d\'un compte sans le supprimer (audit trail preserve)</li><li>Export/import de la liste des utilisateurs (utile lors d\'upgrades)</li></ul><div class="alert alert-w">Lors d\'un upgrade depuis une version &lt; 9.4.0 vers 9.4.0+ : le système d\'authentification change complètement. Les anciens comptes ne sont pas migres automatiquement. Il faut <strong>exporter la liste des utilisateurs AVANT l\'upgrade</strong> et les recreer manuellement dans la nouvelle interface Identity. Utiliser la variable d\'environnement <code>SCALITY_SUPERVISOR_FQDN</code> lors de la migration SSO.</div><h3>Migration SSO (upgrade depuis &lt; 9.4.0)</h3><pre># Avant l\'upgrade : noter tous les utilisateurs existants\n# Après l\'upgrade du Supervisor :\nexport SCALITY_SUPERVISOR_FQDN=supervisor.mondomaine.com\n# Puis recreer les utilisateurs via l\'interface Identity</pre><h2>Authentication Throttling — Fail2ban</h2><p>Le Supervisor intègre <strong>Fail2ban</strong> pour se protéger contre les attaques par force brute sur l\'interface d\'authentification :</p><ul><li><strong>Principe</strong> : après N tentatives d\'authentification échouées depuis la même IP, Fail2ban bloqué cette IP pendant une durée configurable.</li><li><strong>Configuration</strong> : Administration &gt; Security &gt; Authentication Throttling dans le Supervisor</li><li><strong>Paramètres</strong> : seuil de tentatives (défaut: 5), durée de blocage (défaut: 10 min), liste blanche d\'IPs exemptees</li><li><strong>Logs</strong> : les IP bloquées sont loggées dans <code>/var/log/fail2ban.log</code> sur le Supervisor</li></ul><pre># Debloquer une IP manuellement (si admin se bloqué lui-même)\nfail2ban-client set supervisor unbanip &lt;adresse_ip&gt;\n\n# Voir les IPs actuellement bloquées\nfail2ban-client status supervisor</pre><h2>Communications HTTPS et Certificats TLS</h2><p>Toutes les communications vers et depuis le Supervisor sont obligatoirement chiffrées en <strong>HTTPS/TLS</strong> :</p><ul><li>Certificat auto-signe génère a l\'installation (a remplacer par un certificat CA en production)</li><li>Certificat configurable dans <code>/etc/scality/supervisor/ssl/</code></li><li>Les Connectors communiquent avec le Supervisor via HTTPS (agents Salt)</li><li>Le port HTTPS du Supervisor est 443 par défaut</li></ul><h2>Ordre d\'Arrêt et de Demarrage — Règle Absolue</h2><p>L\'ordre des opérations d\'arrêt et de demarrage du cluster est <strong>non-negociable</strong>. Un ordre incorrect provoque des erreurs visibles par les clients ou des interruptions de service evitables.</p><div class="adiag">ARRET (ordre obligatoire) :\n  1. CONNECTORS  (S3, NFS, SMB, sproxyd, FUSE...)\n       -> Les clients reçoivent un signal propre d\'indisponibilite\n       -> Les écritures en cours se terminent ou sont annulées proprement\n  2. STORAGE SERVERS  (systemctl stop scality-node)\n       -> Les Bizstorenode s\'arrêtent proprement\n       -> Les données en buffer sont flushées sur les Biziod\n  3. SUPERVISOR\n       -> L\'orchestrateur s\'arrête en dernier\n\nDEMARRAGE (ordre strictement inverse) :\n  1. SUPERVISOR\n       -> L\'orchestrateur doit être opérationnel en premier\n  2. STORAGE SERVERS  (systemctl start scality-node)\n       -> Les nodes rejoignent le RING (nodeJoin automatique si join_auto=2)\n  3. CONNECTORS\n       -> Les accès clients sont retablis uniquement quand le RING est stable</div><div class="alert alert-d">Si les Storage Servers sont arrêtés AVANT les Connectors : les Connectors continuent de recevoir des requêtes clients mais ne peuvent plus accéder aux données -> erreurs 5xx visibles par les applications. Toujours arrêter les Connectors en premier.</div><h2>Sécurité Réseau</h2><ul><li><strong>Réseau de stockage (backend)</strong> : réseau dédié entre Bizstorenode/Biziod, isole du réseau client pour la performance et la sécurité. Typiquement un réseau 10 GbE ou 25 GbE dédié.</li><li><strong>Réseau management</strong> : accès SSH au Supervisor et aux serveurs, isole du réseau client.</li><li><strong>Réseau client (frontend)</strong> : connexions des Connectors vers les applications clientes.</li></ul><h2>Keycloak — Identity Provider SSO (depuis 9.4.0)</h2><p><strong>Keycloak</strong> est la solution SSO intégrée dans Scality RING depuis la version 9.4.0. Il centralise l\'authentification pour toutes les interfaces d\'administration.</p><h3>Rôle de Keycloak dans le RING</h3><table><tr><th>Interface</th><th>Avant 9.4.0</th><th>Depuis 9.4.0</th></tr><tr><td>Supervisor GUI</td><td>Authentification locale</td><td>SSO via Keycloak</td></tr><tr><td>Grafana</td><td>Compte local</td><td>SSO via Keycloak</td></tr><tr><td>S3 Console</td><td>Vault IAM</td><td>SSO via Keycloak possible</td></tr></table><p>Keycloak supporte <strong>SAML 2.0</strong> et <strong>OpenID Connect (OIDC)</strong>. Il peut s\'intégrer avec des annuaires LDAP/Active Directory. Scality fournit des extensions spécifiques (depot <code>scality/keycloak-extensions</code> sur GitHub).</p><h3>Distinction critique : Keycloak vs Vault</h3><div class="alert alert-i"><strong>Keycloak et Vault ont des rôles complètement distincts :</strong><br>- <strong>Keycloak</strong> = SSO pour les administrateurs humains → accès Supervisor, Grafana<br>- <strong>Vault</strong> = IAM pour les applications S3 → access keys, secret keys, policies<br><br>Si Keycloak tombe : les admins ne peuvent plus se connecter au Supervisor via SSO. Les opérations S3 (PUT/GET) via access key/secret key continuent car elles passent par Vault.</div><h3>Impact d\'une panne Keycloak</h3><ul><li>Accès Supervisor GUI via SSO : impossible</li><li>Accès Grafana via SSO : impossible</li><li>Opérations S3 API (access key) : non impactées</li><li>ringsh en ligne de commande : non impacte</li></ul><div class="alert alert-w">Toujours maintenir un compte local d\'urgence sur le Supervisor. En cas de panne Keycloak, ce compte permet un accès de secours.</div><div class="kbox"><h3>Points Clés a Retenir</h3><ul><li>4 rôles RBAC : RING Admin (tout), Identity Manager (users), Monitoring Manager (read+Grafana), RING Viewer (read-only)</li><li>SSO depuis 9.4.0 : credentials initiaux admin/Default_passw0rd, changer immédiatement</li><li>Upgrade depuis &lt;9.4.0 : exporter les users AVANT, les recreer dans Identity après</li><li>Fail2ban : protection brute force, configurable dans le Supervisor</li><li>Arrêt : Connectors -> Storage Servers -> Supervisor (obligatoire dans cet ordre)</li><li>Demarrage : Supervisor -> Storage Servers -> Connectors (ordre inverse)</li></ul></div>',
quiz:[
  {q:"Quel outil de gestion de configuration orchestre le déploiement des composants RING ?",opts:["Ansible","Puppet","Salt / SaltStack","Chef"],ans:2,expl:"Scality RING utilisé SaltStack pour le déploiement et la gestion de configuration. Les états Salt décrivent la configuration cible de chaque type de nœud."},
  {q:"Dans quel ordre doit-on arrêter les composants RING ?",opts:["Connectors -> Supervisor -> Storage","Storage -> Connectors -> Supervisor","Supervisor -> Connectors -> Storage","L'ordre n'a pas d'importance"],ans:0,expl:"L'ordre correct est : Connectors d'abord (stopper les accès clients), puis les services de stockage, puis Supervisor en dernier. Inverser risque de corrompre des écritures en cours."},
  {q:"Quel outil détecte et bloqué automatiquement les IP faisant des attaques par force brute ?",opts:["Vault","Fail2ban","MARS","Platformcheck"],ans:1,expl:"Fail2ban analyse les logs et bannit automatiquement les IP effectuant trop de tentatives d'authentification échouées. C'est la première ligne de défense contre les attaques par brute force."},
  {q:"À quoi sert Platformcheck ?",opts:["Vérifier l'intégrité des objets","Outil de diagnostic vérifiant la conformité de la configuration système (réseau, OS, BIOS) par rapport aux prérequis Scality","Surveiller les métriques Prometheus","Gérer les certificats SSL"],ans:1,expl:"Platformcheck vérifie que la plateforme répond aux prérequis Scality : version OS, configuration réseau, BIOS, stockage. À exécuter avant tout déploiement ou upgrade."},
  {q:"Pourquoi SaltStack est-il préféré à une gestion manuelle des configurations sur un cluster RING ?",opts:["SaltStack est obligatoire par licence Scality","SaltStack garantit la cohérence de configuration sur tous les nœuds simultanément et permet le rollback, évitant les dérives de configuration (CONF_MISMATCH)","SaltStack est plus rapide pour les petits clusters","La gestion manuelle est équivalente pour moins de 10 nœuds"],ans:1,expl:"Avec des dizaines ou centaines de nœuds, la gestion manuelle introduit inévitablement des dérives de configuration. SaltStack applique l'état désiré sur tous les nœuds de façon idempotente, détecte les écarts et peut les corriger automatiquement."},
  {q:"Qu'est-ce que le principe du moindre privilège appliqué à l'administration RING ?",opts:["Tous les admins ont les droits root sur tous les nœuds","Chaque service et utilisateur n'a que les permissions strictement nécessaires à sa fonction, limitant l'impact d'une compromission","Le ring refuse toutes les connexions par défaut","Les comptes de service partagent un seul mot de passe"],ans:1,expl:"Le principe du moindre privilège (least privilege) limite la surface d'attaque : un compte compromis ne peut faire que ce pour quoi il était autorisé. En pratique : comptes de service dédiés, RBAC sur les buckets S3, accès SSH limité aux IPs d'administration."},
  {q:"Lors du démarrage du RING après une maintenance complète, quel est le bon ordre ?",opts:["Connectors -> Storage -> Supervisor","Supervisor -> Storage -> Connectors","Storage -> Supervisor -> Connectors","L'ordre est indifférent"],ans:1,expl:"Au démarrage : Supervisor d'abord (il gère les processus), puis Storage (les données doivent être disponibles), puis Connectors en dernier (ils n'exposent l'API qu'une fois le ring opérationnel). C'est l'inverse de l'ordre d'arrêt."},
  {q:"Comment vérifier qu'aucune dérive de configuration n'existe entre les nœuds après un upgrade partiel ?",opts:["Comparer manuellement les fichiers de config sur chaque nœud","Utiliser Salt pour appliquer un highstate et vérifier les différences (salt '*' state.highstate test=True)","Redémarrer tous les nœuds","Vérifier uniquement le nœud master Salt"],ans:1,expl:"salt '*' state.highstate test=True applique les états Salt en mode simulation sur tous les minions et rapporte les différences entre l'état actuel et l'état désiré, sans modifier quoi que ce soit. C'est l'outil idéal pour détecter les dérives post-upgrade."}
],
title_en:'Security and Administration',
desc_en:'Roles, SSO, Fail2ban, startup/shutdown order',
content_en:'<h2>The 4 RING Roles — Permissions Matrix</h2><p>The Supervisor uses a <strong>Role-Based Access Control (RBAC)</strong> model with 4 predefined roles. Each user is assigned one or more roles when their account is created in the Identity interface.</p><table><tr><th>Role</th><th>Read</th><th>Write</th><th>Use Case</th></tr><tr><td><strong>RING Admin</strong></td><td>Everything</td><td>Everything</td><td>Scality system administrator. Full access to all operations: RING configuration, disk management, upgrades, user management.</td></tr><tr><td><strong>Identity Manager</strong></td><td>Everything (read-only)</td><td>User management ONLY</td><td>Security officer or DBA who manages access without being able to modify RING configuration.</td></tr><tr><td><strong>Monitoring Manager</strong></td><td>Everything</td><td>Grafana dashboards only</td><td>Monitoring/NOC team who views and customizes dashboards without being able to modify the RING.</td></tr><tr><td><strong>RING Viewer</strong></td><td>Everything (read-only)</td><td>None</td><td>Auditors, application teams who need visibility into storage status without modification rights.</td></tr></table><div class="alert alert-i">A single user can have multiple roles. For example, a senior administrator can be both RING Admin and Identity Manager.</div><h2>SSO Authentication — Since RING 9.4.0</h2><p>Before RING 9.4.0, Supervisor user authentication was handled in a basic way (LDAP or simple local accounts). Since 9.4.0, the Supervisor integrates a complete <strong>Single Sign-On (SSO)</strong> system based on an internal Identity Provider (IdP). Initial credentials: admin / Default_passw0rd — change immediately after first login. Create additional users via the Identity interface. Password policy includes minimum length, complexity, configurable expiration. Accounts can be deactivated without deleting (audit trail preserved). Export/import of the user list is available (useful during upgrades).</p><div class="ale
