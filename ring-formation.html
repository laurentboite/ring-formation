spark.hadoop.fs.s3a.path.style.access=true</pre><div class="kbox"><h3>Points Cles a Retenir</h3><ul><li>Lifecycle : Expire, NoncurrentVersionExpiration, ExpireDeleteMarkers, AbortIncompleteMultipartUpload</li><li>Filtre tag = couteux (appels metadata extra) ; privilegier les filtres prefix</li><li>Lifecycle ne genere pas ObjectRemoved → utiliser LifecycleExpiration:Delete dans les Notifications</li><li>UTAPI = API facturation (RPS par compte/bucket) ; SUR = reporting robuste via journal Raft</li><li>Rate limiting = HTTP 429 SlowDown ; propagation config jusqu\'a 30s (cache TTL)</li><li>S3 Analytics = ClickHouse remplace Elasticsearch depuis 9.5.0</li><li>SAL = audit logs par bucket, batch asynchrone, pas de duplication garantie</li></ul></div>',
quiz:[
  {q:"Que permet une Lifecycle Policy S3 ?",opts:["Chiffrer automatiquement les objets","Définir des règles de cycle de vie : transition vers autre tier, expiration, suppression versions anciennes","Répliquer les objets vers un autre bucket","Auditer les accès aux objets"],ans:1,expl:"Les Lifecycle Policies automatisent la gestion du cycle de vie des objets : transition vers stockage moins cher après X jours, expiration des objets, suppression des versions non courantes."},
  {q:"Qu'est-ce que le Rate Limiting dans Cloudserver ?",opts:["Limite la taille maximale des objets","Contrôle du débit de requêtes S3 par compte ou bucket pour protéger le ring","Limitation de la réplication CRR","Contrôle du nombre de buckets par compte"],ans:1,expl:"Le rate limiting dans Cloudserver limite le nombre de requêtes S3 par seconde par compte ou bucket. Protège le ring contre les surcharges et garantit une QoS équitable entre tenants."},
  {q:"Quelle technologie S3 Analytics Scality utilise-t-il ?",opts:["Apache Spark","Elasticsearch","ClickHouse","MongoDB"],ans:2,expl:"Scality S3 Analytics utilise ClickHouse, une base de données analytique colonnaire hautes performances. Elle ingère les logs d'accès S3 et permet des requêtes analytiques rapides."},
  {q:"Que sont les Bucket Notifications ?",opts:["Emails envoyés quand un bucket est plein","Mécanisme notifiant un système externe (webhook, Kafka) lors d'événements S3 (création, suppression d'objet)","Alertes Prometheus par bucket","Notifications SMB SOFS"],ans:1,expl:"Les Bucket Notifications envoient des événements S3 (PUT, DELETE...) vers des endpoints externes (webhooks, Kafka topics). Permet d'intégrer S3 dans des architectures event-driven."},
  {q:"Qu'est-ce que le Server Access Logging S3 ?",opts:["Logs supervisord du Cloudserver","Journalisation détaillée de toutes les requêtes S3 vers un bucket de logs dédié, pour audit et compliance","Logs de monitoring Prometheus","Logs de réplication CRR"],ans:1,expl:"Server Access Logging journalise chaque requête S3 (qui, quoi, quand, depuis où) dans un bucket de logs. Essentiel pour l'audit, la sécurité et la conformité réglementaire."},
  {q:"Comment fonctionne le Legal Hold ?",opts:["Verrou sur un bucket entier","Verrou par objet empêchant toute suppression/modification, indépendant de la retention policy, jusqu'à levée explicite","Limite automatique de 7 ans","Verrou réseau sur le bucket"],ans:1,expl:"Legal Hold est un verrou par objet indépendant de la retention policy. Même si la période de retention est expirée, l'objet ne peut être supprimé tant que le Legal Hold est actif. Utile pour la préservation de preuves."},
  {q:"Quelle est la différence entre KMS interne Vault et KMIP ?",opts:["Il n'y a pas de différence","KMS interne : Vault gère les clés (simple, tout-en-un). KMIP : intégration d'un KMS externe via protocole standard (HSM, compliance certifiée)","KMIP est plus simple","KMS interne ne chiffre pas les données"],ans:1,expl:"KMS interne (Vault) est intégré et simple à configurer. KMIP permet d'intégrer un KMS externe certifié (HSM physique, Thales, HashiCorp) pour des exigences de conformité strictes (FIPS 140-2, CC)."},
  {q:"Un client multi-tenant veut garantir qu'un seul tenant ne peut pas saturer la capacité S3. Quelle feature utiliser ?",opts:["Object Lock en mode Governance","Rate Limiting par compte, combiné à des quotas de stockage par bucket via UTAPI","Lifecycle Policy avec expiration automatique","Bucket Notifications pour alerter en cas de surcharge"],ans:1,expl:"Le Rate Limiting limite le débit de requêtes par compte (protège contre les pics CPU/réseau), et UTAPI permet de surveiller et appliquer des quotas de stockage. Les deux ensemble garantissent l'isolation des ressources entre tenants."},
  {q:"Pourquoi le S3 Versioning est-il un prérequis pour activer Object Lock ?",opts:["C'est une contrainte arbitraire de l'implémentation Scality","Object Lock garantit l'immutabilité de chaque version d'un objet ; sans versioning, il n'y aurait pas de concept de 'version protégée' et un PUT écraserait l'objet existant","Le versioning améliore les performances d'Object Lock","Object Lock fonctionne aussi sans versioning"],ans:1,expl:"Object Lock opère au niveau de la version d'objet. Avec le versioning, chaque PUT crée une nouvelle version — l'ancienne version protégée est préservée. Sans versioning, un PUT remplacerait l'objet, contournant la protection WORM. Le versioning est donc structurellement nécessaire à Object Lock."},
  {q:"Quand utiliser des Bucket Notifications plutôt qu'un polling régulier de l'API S3 LIST ?",opts:["Jamais : le polling est toujours préférable","Dès que la latence de détection doit être faible et que le volume d'événements est élevé : les notifications sont plus efficaces et moins coûteuses en requêtes S3","Les Bucket Notifications ne sont pas supportées par Scality","Le polling est obligatoire pour les intégrations Kafka"],ans:1,expl:"Le polling S3 LIST à haute fréquence génère beaucoup de requêtes API et détecte les événements avec retard. Les Bucket Notifications envoient l'événement en temps quasi-réel dès qu'il se produit, sans requête active. Pour les architectures event-driven (pipelines de traitement d'images, indexation temps réel), les notifications sont bien supérieures."}
]}
,
{id:'MI',num:'I',title:'Infrastructure, Ports et Cycle de Vie Produit',desc:'Prerequis materiels et OS, tuning systeme, ports reseau par service, Platformcheck, versions supportees, breaking changes',
content:'<h2>Prerequis Materiels et Dimensionnement</h2><h3>Noeuds de Stockage (obligatoirement physiques)</h3><p>Les noeuds de stockage RING <strong>ne peuvent pas etre des VMs</strong>. Ils doivent etre des serveurs physiques baremetal.</p><table><tr><th>Composant</th><th>Exigence</th></tr><tr><td>RAM</td><td>128 GB minimum</td></tr><tr><td>Disques OS</td><td>~500 GB, 2 HDDs en RAID 1</td></tr><tr><td>Disques DATA</td><td>4 TB+ par disque, HDDs 7200 rpm, RAID 0 individuel. Cache write-back avec BBU obligatoire.</td></tr><tr><td>Disques Metadata</td><td>2 SSD/NVMe 480 GB+ en RAID 0, ext4, montes avant installation. PatrolRead DESACTIVE.</td></tr><tr><td>Reseau RING</td><td>2 x 10 Gb/s LACP 802.3ad layer3+4, lacp_rate=fast</td></tr><tr><td>Alimentation</td><td>Double PSU obligatoire</td></tr></table><p class="alert-d"><strong>RAID 0 sur les disques DATA :</strong> Chaque disque DATA est en RAID 0 individuel (pas de RAID entre disques). La protection des donnees est assuree par le RING lui-meme (ARC/COS), pas par le RAID. <strong>PatrolRead doit etre desactive</strong> sur tous les controleurs RAID — il cause des ralentissements IO impactant les performances.</p><h3>Noeuds S3 Connector</h3><table><tr><th>Composant</th><th>Exigence minimale</th></tr><tr><td>RAM</td><td>32 GB</td></tr><tr><td>Disques OS</td><td>2000 GB+ RAID 1 (dont 400 GB+ pour /var/log)</td></tr><tr><td>CPU</td><td>8 vCPUs minimum. 12-24 cores selon le feature set (UTAPI, CRR, SSE = "advanced")</td></tr><tr><td>Reseau frontend</td><td>2 x 10 Gb/s LACP (vers clients S3)</td></tr><tr><td>Reseau backend</td><td>2 x 10 Gb/s LACP (vers le RING)</td></tr></table><h3>Supervisor</h3><table><tr><th>Composant</th><th>Exigence</th></tr><tr><td>RAM</td><td>16 GB (32+ si >12 serveurs)</td></tr><tr><td>Disques</td><td>500 GB RAID 1</td></tr><tr><td>CPU</td><td>4 vCPUs</td></tr><tr><td>Deploiement</td><td>VM avec failover hyperviseur recommande</td></tr></table><h2>OS et Tuning Systeme</h2><h3>Systemes d\'exploitation supportes (RING 9.5.2.3)</h3><table><tr><th>OS</th><th>Version</th><th>Statut</th></tr><tr><td>RHEL</td><td>8.10</td><td>Supporte et valide</td></tr><tr><td>Rocky Linux</td><td>8.10</td><td>Supporte et valide</td></tr><tr><td>RHEL</td><td>9.6 / 9.7</td><td>Supporte</td></tr><tr><td>Rocky Linux</td><td>9.6 / 9.7</td><td>Supporte</td></tr><tr><td>RHEL 7 / CentOS 7</td><td>Toutes</td><td>EOL depuis juin 2024 — NON supporte</td></tr></table><p>Architecture CPU : <strong>x86-64v3 minimum</strong> (depuis RING 9.5.0). Installation OS : mode <strong>Minimal obligatoire</strong> (pas de GUI, pas de Samba pre-installe).</p><h3>Partitionnement minimal</h3><table><tr><th>Partition</th><th>Taille</th></tr><tr><td>/boot</td><td>1 GB</td></tr><tr><td>/</td><td>50-100 GB (100-120 GB pour le Supervisor)</td></tr><tr><td>/var</td><td>400 GB+ — <strong>partition SEPAREE obligatoire</strong></td></tr></table><p>Seul filesystem supporte pour les donnees RING : <strong>ext4</strong>.</p><h3>Tuning OS applique par l\'installer</h3><table><tr><th>Parametre</th><th>Valeur imposee</th><th>Raison</th></tr><tr><td>vm.swappiness</td><td>1</td><td>Minimise le swap pour eviter les latences IO</td></tr><tr><td>Transparent Huge Pages</td><td>disabled</td><td>Cause des latences aleatoires avec les applications memoire intensives</td></tr><tr><td>NUMA</td><td>disabled (interleaving BIOS)</td><td>Evite les inegalites d\'acces memoire entre CPUs</td></tr><tr><td>irqbalance</td><td>--oneshot au boot uniquement</td><td>Evite la redistribution dynamique des interruptions</td></tr><tr><td>SELinux</td><td>disabled avant installation</td><td>Peut etre re-active apres via procedure Scality</td></tr><tr><td>net.core.somaxconn</td><td>4096</td><td>File d\'attente de connexions TCP</td></tr><tr><td>ulimit -n</td><td>65535</td><td>Nombre de fichiers ouverts simultanes</td></tr></table><p class="alert-w"><strong>Logiciels incompatibles :</strong> Salt pre-existant (supprimer salt-minion + /etc/salt), mlocate, GUI desktop, Transparent Huge Pages, NUMA actif, Samba pre-installe sur un noeud RING. <strong>NTP/Chrony obligatoire</strong> — ne jamais changer l\'heure d\'un serveur RING en cours d\'execution (peut corrompre l\'etat interne).</p><h2>Ports Reseau par Service</h2><h3>Infrastructure RING — Stockage</h3><table><tr><th>Service</th><th>Port</th><th>Protocole</th></tr><tr><td>bizstorenode (Chord P2P)</td><td>TCP 4244-4255</td><td>Inter-noeuds RING</td></tr><tr><td>bizstorenode admin (ringsh)</td><td>TCP 8084-8095</td><td>Administration</td></tr><tr><td>srebuildd / sproxyd REST</td><td>TCP 81, 10000, 10002</td><td>Rebuild et stockage</td></tr><tr><td>Salt Master</td><td>TCP 4505, 4506</td><td>Gestion de configuration</td></tr><tr><td>Supervisor GUI/API</td><td>TCP 80, 443, 3080, 2443, 3443, 4443</td><td>Administration</td></tr><tr><td>Grafana</td><td>TCP 3000</td><td>Monitoring</td></tr><tr><td>ZooKeeper (DLM)</td><td>TCP 2888, 3888</td><td>Coordination cluster</td></tr></table><h3>S3 Connector</h3><table><tr><th>Service</th><th>Port</th><th>Usage</th></tr><tr><td>S3 Frontend (clients)</td><td>TCP 80, 443</td><td>API S3 HTTP/HTTPS</td></tr><tr><td>Vault (IAM)</td><td>TCP 8500</td><td>Authentification interne</td></tr><tr><td>bucketd (metadata)</td><td>TCP 9000</td><td>Operations sur buckets</td></tr><tr><td>sproxyd (vers RING)</td><td>TCP 8181, 4243</td><td>Stockage donnees dans RING</td></tr><tr><td>Redis local</td><td>TCP 6479</td><td>Cache sessions/CRR</td></tr><tr><td>Kafka (CRR)</td><td>TCP 9092</td><td>Queue de replication</td></tr><tr><td>ZooKeeper S3</td><td>TCP 22181</td><td>Coordination Backbeat</td></tr><tr><td>KMIP (SSE externe)</td><td>TCP 5696</td><td>Chiffrement (KMS externe)</td></tr><tr><td>ADFS/SAML</td><td>TCP 443</td><td>Federation d\'identites SSO</td></tr><tr><td>FluentBit → ClickHouse</td><td>TCP 8123</td><td>Logs S3 Analytics</td></tr></table><h3>Monitoring</h3><table><tr><th>Service</th><th>Port</th></tr><tr><td>Prometheus scrape noeuds</td><td>TCP 9091, 9097, 9200, 9427</td></tr><tr><td>AlertManager</td><td>TCP 9093</td></tr><tr><td>Thanos gRPC mTLS</td><td>TCP 11903, 11905</td></tr><tr><td>Thanos Query FE</td><td>TCP 11902</td></tr></table><h2>Platformcheck et Installation</h2><p>Le <strong>Platformcheck</strong> est l\'outil de verification pre/post-installation de Scality. Il est <strong>read-only</strong> et peut etre lance a tout moment pour verifier l\'etat du systeme.</p><table><tr><th>Criticite</th><th>Signification</th><th>Action</th></tr><tr><td><strong>CRITICAL</strong></td><td>Probleme bloquant. L\'installation echoue ou le RING sera instable.</td><td>Corriger AVANT de continuer.</td></tr><tr><td><strong>WARNING</strong></td><td>Probleme non bloquant mais pouvant impacter les performances.</td><td>Corriger si possible.</td></tr><tr><td><strong>OK</strong></td><td>Verification reussie.</td><td>Rien a faire.</td></tr></table><p>Rapport disponible sur : <code>http://&lt;supervisor&gt;:8000/platformcheck/report-&lt;date&gt;</code></p><h2>Cycle de Vie Produit et Versions Supportees</h2><table><tr><th>Version</th><th>Type</th><th>Active Maintenance</th><th>Extended Maintenance</th></tr><tr><td>RING 7.x</td><td>—</td><td>Decembre 2022</td><td>Mars 2024 (EOL)</td></tr><tr><td><strong>RING 8.x (8.5 LTS)</strong></td><td>LTS</td><td><strong>Septembre 2026</strong></td><td>Septembre 2028</td></tr><tr><td><strong>RING 9.x (9.5 LTS)</strong></td><td>LTS</td><td><strong>Juillet 2029</strong></td><td>Juillet 2031</td></tr></table><ul><li><strong>Active Maintenance</strong> : corrections proactives + ameliorations performance. RING 8.5 et 9.5 sont en Active Maintenance.</li><li><strong>Extended Maintenance</strong> (option payante) : corrections reactives P1 uniquement. Nouveaux deploiements non supportes.</li><li><strong>Chemin d\'upgrade obligatoire</strong> : RING 7.x → RING 8.5 (derniere release) → RING 9.5 LTS. Le saut direct 7→9 est interdit.</li></ul><h2>Breaking Changes Importants (9.5.x)</h2><table><tr><th>Changement</th><th>Version</th><th>Impact</th></tr><tr><td>Cle objet S3 limitee a 915 bytes</td><td>9.5.1</td><td>Objets avec des cles longues recoivent HTTP 400 KeyTooLong. ARTESCA impose la meme limite → important pour les setups CRR vers ARTESCA.</td></tr><tr><td>PutObject max 5 GB</td><td>9.5.1</td><td>PUT directs >5 GB retournent HTTP 400 EntityTooLarge. Utiliser MPU pour les gros fichiers.</td></tr><tr><td>s3:ReplicateObject obligatoire</td><td>9.5.2.0</td><td>Action pre-upgrade obligatoire pour les clusters CRR.</td></tr><tr><td>Events Notifications renommes</td><td>9.5.1</td><td>ObjectRemoved remplace par LifecycleExpiration:Delete. Mettre a jour les configurations de notifications existantes.</td></tr><tr><td>Verification Host header S3C Console</td><td>9.5.2</td><td>L\'en-tete Host est verifie. Variable env_s3_frontend_enforce_console_host_header disponible.</td></tr><tr><td>Elasticsearch supprime</td><td>9.5.0</td><td>Remplace par ClickHouse. Les configurations Elasticsearch existantes sont caduques.</td></tr></table><h2>Reseau Flapping — Vulnerabilite du RING</h2><p>Le RING Scality est <strong>sensible aux instabilites reseau</strong> (flapping). Un reseau instable — meme brieve­ment — peut provoquer des consequences graves : re-elections de leader, degradation de la protection, voire perte de coherence.</p><table><tr><th>Symptome reseau</th><th>Impact sur le RING</th></tr><tr><td>Perte de paquets > 0%</td><td>Retransmissions TCP → latences elevees → timeouts Chord → noeuds marques DOWN</td></tr><tr><td>MTU incoherent (jumbo frames)</td><td>Fragmentation silencieuse → retransmissions → performance degradee. Tres difficile a diagnostiquer.</td></tr><tr><td>Interface flapping (lien up/down)</td><td>LACP peut prendre 30 secondes pour re-basculer si lacp_rate=slow (utiliser toujours <code>lacp_rate=fast</code>)</td></tr><tr><td>Latence inter-sites > 10ms</td><td>Elections Raft repetees (S3RaftElectionWarning), performance CRR degradee</td></tr></table><h3>Verification reseau avant/apres incident</h3><pre># Test debit inter-noeuds (minimum 10 Gb/s effectif)\niperf3 -s                           # sur le serveur cible\niperf3 -c &lt;ip_noeud_cible&gt; -P 4    # depuis le noeud source\n\n# Verifier les retransmissions TCP (doit etre ~0)\nss -s | grep retrans\ncat /proc/net/snmp | grep -i retrans\n\n# Verifier la coherence MTU\nip link show | grep mtu\nping -M do -s 8972 &lt;ip_noeud&gt;     # test MTU 9000 (8972 + 28 headers)\n\n# Verifier le LACP\ncat /proc/net/bonding/bond0 | grep -E "speed|mode|rate|MII"</pre><div class="kbox"><h3>Points Cles a Retenir</h3><ul><li>Stockage : baremetal OBLIGATOIRE, 128GB RAM, RAID 0 sur DATA, SSD metadata, BBU obligatoire</li><li>PatrolRead DESACTIVE sur tous les controleurs RAID</li><li>OS : RHEL/Rocky 8.10 ou 9.6/9.7 uniquement, x86-64v3, install Minimal, /var partition separee</li><li>Tuning : swappiness=1, THP disabled, NUMA disabled, NTP obligatoire</li><li>Ports cles : Chord 4244-4255, Salt 4505/4506, Kafka 9092, ZK S3 22181, KMIP 5696</li><li>Platformcheck : CRITICAL = bloquant, WARNING = a corriger, OK = bon</li><li>RING 8.5 LTS → 2028 ; RING 9.5 LTS → 2031. Upgrade 7→9 interdit (passer par 8.5)</li><li>Breaking changes : cle 915B, PUT 5GB, s3:ReplicateObject, events Notifications renommes</li></ul></div>',
quiz:[
  {q:"Quel est le prérequis OS recommandé pour Scality RING v9 ?",opts:["Ubuntu 20.04","CentOS 7","RHEL/CentOS 8 ou Rocky Linux 8","Debian 11"],ans:2,expl:"Scality RING v9 est supporté sur RHEL/CentOS 8 ou Rocky Linux 8. Les versions antérieures (CentOS 7) ne sont plus supportées pour RING v9."},
  {q:"Quel paramètre kernel est recommandé pour les noeuds de stockage RING ?",opts:["vm.swappiness=60","vm.swappiness=10 ou 1 pour minimiser le swap","net.ipv4.tcp_keepalive=1","fs.inotify.max_user_watches=8192"],ans:1,expl:"vm.swappiness très bas (1-10) est recommandé pour les noeuds RING afin de garder les données actives en RAM et minimiser la latence induite par le swap sur les I/O disque."},
  {q:"Sur quel port sproxyd écoute-t-il par défaut ?",opts:["8080","9090","81","8181"],ans:2,expl:"sproxyd écoute sur le port 81 par défaut pour les requêtes HTTP internes des connectors. Ce port est interne et ne doit pas être exposé directement aux clients."},
  {q:"Quel outil vérifie la conformité pré-déploiement de la plateforme ?",opts:["Salt highstate","Platformcheck","Prometheus","ringsh platformcheck"],ans:1,expl:"Platformcheck est l'outil Scality de validation pré-déploiement. Il vérifie les prérequis hardware, OS, réseau et BIOS avant d'installer le logiciel RING."},
  {q:"Quel protocole de bonding réseau est recommandé pour la redondance des liens ?",opts:["Round-robin simple","LACP (Link Aggregation Control Protocol)","Spanning Tree","VLAN tagging uniquement"],ans:1,expl:"LACP (802.3ad) est recommandé pour le bonding des liens réseau des noeuds RING. Il offre agrégation de débit ET redondance avec négociation active avec le switch."},
  {q:"Quelle est la fréquence de support des versions RING (LTS) ?",opts:["Support illimité","Support de 3 ans pour les versions LTS (Long Term Support)","Support de 6 mois uniquement","Pas de politique LTS officielle"],ans:1,expl:"Scality définit des versions LTS avec un support étendu (environ 3 ans). Se référer à la matrice de support officielle pour les dates de fin de support de chaque version."},
  {q:"Que sont les breaking changes dans le contexte des upgrades RING ?",opts:["Bugs introduits par l'upgrade","Changements incompatibles nécessitant une action manuelle (migration config, format données) avant ou après l'upgrade","Performances dégradées temporairement","Changements de l'interface graphique"],ans:1,expl:"Les breaking changes sont des changements incompatibles avec la version précédente. Ils sont documentés dans les release notes et peuvent nécessiter des migrations de configuration ou de données."},
  {q:"Quel type de stockage est recommandé pour les disques d'index biziod ?",opts:["HDD haute capacité","SSD ou NVMe pour les index, HDD pour les données","Stockage réseau NFS","RAID 5 matériel"],ans:1,expl:"biziod utilise du SSD/NVMe pour son index (lookups rapides) et des HDD pour les données (haute capacité, coût). Cette séparation est architecturalement importante pour les performances."},
  {q:"Pourquoi Scality déconseille-t-il l'utilisation d'un RAID matériel pour les disques de données biziod ?",opts:["Le RAID matériel n'est pas supporté par Linux","biziod gère lui-même la redondance via ARC/COS au niveau du ring : un RAID matériel ajoute une complexité inutile, masque les pannes de disques individuels et peut interférer avec la gestion biziod","Le RAID matériel est trop cher","Le RAID logiciel est obligatoire"],ans:1,expl:"biziod et le ring gèrent la redondance des données via ARC/COS. Ajouter un RAID matériel en dessous est redondant, masque les défaillances de disques individuels (empêchant une détection précoce), et peut créer des conflits avec la gestion directe des blocs par biziod."},
  {q:"Quelle est la raison principale pour laquelle les noeuds RING nécessitent des interfaces réseau à 10 Gbps minimum ?",opts:["Pour respecter les standards IEEE","Le ring génère un trafic interne intense (P2P, rebuild, balance) qui s'ajoute aux flux clients ; une connectivité insuffisante crée un goulot d'étranglement et dégrade l'ensemble des performances","1 Gbps suffit pour les petits clusters","Pour le monitoring Prometheus uniquement"],ans:1,expl:"Le trafic réseau dans un cluster RING inclut : requêtes clients (données entrantes/sortantes), trafic P2P inter-noeuds (réplication, routage), et trafic de maintenance (rebuild, balance). La somme dépasse rapidement 1 Gbps. Le 10 Gbps ou plus est nécessaire pour absorber ces flux sans dégradation."}
]},
{id:'MJ',num:'J',title:'Cartographie des Composants',desc:'Annuaire visuel de tous les composants tiers : MongoDB, Redis, Kafka, ZooKeeper, Keycloak, Loki, Fluent-bit, ClickHouse, node_exporter, NFS-Ganesha, Samba, TANG, Spark — rôle, interdépendances, impact panne',
content:'<h2>Pourquoi cette cartographie ?</h2><p>Le Scality RING mobilise une vingtaine de composants tiers. Comprendre leur role et leurs interdependances est essentiel pour diagnostiquer rapidement une panne. Cette carte sert de reference rapide : pour chaque composant, son role en 2 lignes et ce qui se passe s\'il tombe.</p><h2>Architecture en couches — Vue d\'ensemble</h2><div class="adiag">CLIENTS (S3, NFS, SMB, FUSE, CDMI)
        |
        v
CONNECTEURS D\'ACCES
  S3           : Cloudserver (Node.js)    port 443
  Objet natif  : sproxyd                 port 81 (Apache httpd) / 10000
  Fichier Linux: NFS-Ganesha             NFSv4.0
  Fichier Win  : Samba + CTDB            SMB 3.0
  Local        : sfused (FUSE)           POSIX
        |
        v
STACK S3 (XDM)
  Auth/IAM          : Vault              port 8500
  Metadata buckets  : bucketd (LevelDB)  port 9000
  Metadata cache    : Redis + Sentinel   port 6479
  Metadata durable  : MongoDB ReplicaSet
  Metadata stateful : repd (Raft)
  Async jobs        : Backbeat -> Kafka  port 9092
                               -> ZooKeeper port 22181
        |
        v
RING CORE
  Routage P2P  : Bizstorenode (Chord DHT)  ports 4244-4255
  Metadonnees  : MESA (Raft interne)
  Appartenance : membershipd
        |
        v
I/O LAYER
  Acces bas niveau : Biziod (1 par disque)
  Index : SSD · Donnees : HDD containers
  Chiffrement : LUKS + TANG/clevis (NBDE)  · KMS externe : KMIP

SERVICES TRANSVERSES
  SSO admin  : Keycloak (depuis 9.4.0)  · Securite : Fail2ban
  Config     : SaltStack                · Processus : supervisord
  Pre-deploy : Platformcheck

OBSERVABILITE
  Metriques : node_exporter -+-> MARS -> Prometheus -> Thanos -> Grafana
  Alerting  : AlertManager (port 9093) · Legacy : Nagios
  Logs      : Fluent-bit -> Loki -> Grafana
  Analytics : Fluent-bit -> ClickHouse (port 8123)

[Spark, Starburst, Databricks... acces via API S3 — clients externes, pas composants internes]</div><h2>Annuaire des composants tiers</h2><h3>Stockage et metadonnees</h3><table><tr><th>Composant</th><th>Role dans le RING</th><th>Si tombe</th></tr><tr><td><strong>MongoDB</strong><br>(ReplicaSet)</td><td>Source de verite des metadonnees S3 : liste objets, ACL, versioning, tags. Chaque ecriture S3 cree/modifie une entree MongoDB.</td><td>Ecritures S3 et LIST echouent. sproxyd seul continue mais objets orphelins dans S3.</td></tr><tr><td><strong>Redis + Sentinel</strong></td><td>Cache des metadonnees S3 chaudes. Sentinel assure la HA Redis (1 master + 2 replicas).</td><td>Redis tombe : MongoDB prend la charge (perf degradee). Quorum Sentinel perdu : plus de HA Redis.</td></tr><tr><td><strong>LevelDB</strong></td><td>Store cle-valeur embarque (Google) utilise par bucketd et repd localement sur chaque noeud.</td><td>LevelDB corrompu : metadonnees locales perdues. Reconstruction possible depuis autres noeuds via Raft.</td></tr></table><h3>Messagerie et replication asynchrone</h3><table><tr><th>Composant</th><th>Role</th><th>Si tombe</th></tr><tr><td><strong>Kafka</strong><br>(port 9092)</td><td>Bus de messages durables pour Backbeat. Chaque evenement S3 publie dans Kafka. Backbeat consomme pour CRR, Lifecycle.</td><td>Queue CRR pausee. A la reprise, Kafka rejoue la queue. Pas de perte si Kafka est HA.</td></tr><tr><td><strong>ZooKeeper</strong><br>(port 22181)</td><td>Coordination Kafka : election leaders partitions, registre brokers. Etat partage Backbeat.</td><td>Kafka se fige si quorum ZK perdu. CRR/Lifecycle bloques.</td></tr></table><h3>Acces fichier</h3><table><tr><th>Composant</th><th>Role</th><th>Si tombe</th></tr><tr><td><strong>NFS-Ganesha</strong></td><td>Serveur NFS userspace (NFSv4.0). Avantage vs kernel NFS : crash isole (pas de kernel panic), mise a jour sans recompilation noyau.</td><td>Clients NFS v4.0 perdent l\'acces. Donnees RING non affectees. Redemarrage service suffit.</td></tr><tr><td><strong>Samba / SerNet-Samba</strong></td><td>SMB 3.0 pour clients Windows. SerNet = distribution enterprise de Samba. <code>vfs objects = ring</code> doit etre en premiere position.</td><td>smbd tombe : clients Windows perdent acces. CTDB redistribue les VIPs.</td></tr><tr><td><strong>CTDB</strong></td><td>Partage sessions SMB entre noeuds Samba. Gere les VIPs (IP virtuelles) pour failover SMB transparent (~30s).</td><td>Quorum CTDB perdu : arret Samba sur tous les noeuds du cluster.</td></tr><tr><td><strong>Apache httpd</strong></td><td>Frontend HTTP de sproxyd sur port 81. Forward les requetes vers le daemon sproxyd (port 10000) via FastCGI. Gere TLS et logs d\'acces.</td><td>httpd tombe : PUT/GET via sproxyd impossibles (port 81 injoignable).</td></tr></table><h3>Securite et chiffrement</h3><table><tr><th>Composant</th><th>Role</th><th>Si tombe</th></tr><tr><td><strong>Keycloak</strong><br>(depuis 9.4.0)</td><td>SSO des interfaces d\'administration (Supervisor, Grafana). Protocoles SAML 2.0 et OIDC. Extensions Scality disponibles sur GitHub.</td><td>Acces Supervisor/Grafana via SSO impossible. Operations S3 API non impactees (Vault est independant).</td></tr><tr><td><strong>TANG + clevis</strong></td><td>TANG = serveur NBDE fournissant la cle de dechiffrement LUKS au boot. clevis = client sur le noeud. Dechiffrement automatique si TANG accessible sur le reseau.</td><td>TANG inaccessible au boot : disques LUKS ne s\'ouvrent pas automatiquement. Passphrase de secours (hors-ligne) requise.</td></tr></table><h3>Observabilite</h3><table><tr><th>Composant</th><th>Role</th><th>Si tombe</th></tr><tr><td><strong>node_exporter</strong></td><td>Agent Prometheus par noeud : metriques OS (CPU, RAM, disques, reseau). Un agent par serveur physique.</td><td>Prometheus perd metriques OS ce noeud. Aucun impact service RING.</td></tr><tr><td><strong>MARS</strong></td><td>Composant interne Scality collectant les alarmes RING internes (biziod, bizstorenode) et les exposant au format Prometheus.</td><td>Prometheus perd metriques applicatives RING pour ce noeud. Metriques OS via node_exporter continuent.</td></tr><tr><td><strong>Fluent-bit</strong></td><td>Agent leger de collecte de logs (&lt; 1 MB RAM) par noeud. Forward vers Loki (centralisation) et ClickHouse (analytics S3).</td><td>Logs du noeud non centralises, accessibles localement. Aucun impact service RING.</td></tr><tr><td><strong>Loki</strong></td><td>Centralisation et indexation des logs (Grafana Labs). Indexe seulement les labels (pas le contenu) — moins gourmand qu\'Elasticsearch.</td><td>Logs inaccessibles depuis Grafana, presents localement. Aucun impact service RING.</td></tr><tr><td><strong>ClickHouse</strong><br>(port 8123)</td><td>Base analytique colonnaire hautes performances. Recoit les logs d\'acces S3 via Fluent-bit. Remplace Elasticsearch (supprime en 9.5.0).</td><td>S3 Analytics indisponible. Logs bufferises par Fluent-bit. Aucun impact operations S3.</td></tr><tr><td><strong>Thanos</strong><br>(ports 11902-11905)</td><td>Extension Prometheus pour stockage long terme et agregation multi-cluster. Thanos Query agrege les metriques de plusieurs shards Prometheus.</td><td>Metriques historiques inaccessibles dans Grafana. Donnees temps reel via Prometheus direct toujours disponibles.</td></tr></table><h3>Note sur Apache Spark</h3><div class="alert alert-i"><strong>Apache Spark n\'est PAS un composant interne du RING.</strong> Spark accede au RING via l\'API S3 standard comme n\'importe quel client. Le RING est le storage layer, Spark est le compute layer — separation stricte. Usage : data lake analytics, ML, ETL batch sur objets stockes dans le RING.</div><div class="kbox"><h3>Points Cles a Retenir</h3><ul><li>MongoDB = source de verite metadonnees S3 ; Redis = cache (HA via Sentinel)</li><li>Kafka + ZooKeeper = messaging asynchrone pour Backbeat/CRR</li><li>Keycloak = SSO admin interfaces ; Vault = IAM S3 (access keys) — deux systemes distincts</li><li>LUKS+TANG+clevis = dechiffrement automatique ; TANG inaccessible = passphrase manuelle au boot</li><li>node_exporter = metriques OS ; MARS = metriques internes RING ; les deux alimentent Prometheus</li><li>Fluent-bit -> Loki (logs) + ClickHouse (analytics S3) via meme agent leger</li><li>Thanos = extension Prometheus long terme et multi-cluster</li><li>Spark = client S3 externe, PAS un composant interne RING</li></ul></div>',
quiz:[
  {q:"Si Keycloak tombe, quel service S3 est affecté ?",opts:["Les opérations S3 API (PUT/GET d'objets)","L'authentification des administrateurs au Supervisor et Grafana","L'authentification S3 via access key/secret (Vault)","La réplication CRR Backbeat"],ans:1,expl:"Keycloak gère le SSO des interfaces d'administration (Supervisor, Grafana). L'authentification S3 via access key/secret key est gérée par Vault, indépendamment de Keycloak."},
  {q:"Quelle est la différence entre MongoDB et Redis dans la stack S3 ?",opts:["MongoDB est le cache, Redis est la source de vérité","MongoDB est la source de vérité durable des métadonnées, Redis est un cache en mémoire pour les lectures fréquentes","Ils ont le même rôle mais Redis est plus rapide","MongoDB est pour les données, Redis pour les métadonnées"],ans:1,expl:"MongoDB stocke de façon durable toutes les métadonnées S3 (liste objets, ACL, versioning). Redis+Sentinel est un cache des métadonnées chaudes accélérant les lectures. Si Redis tombe, MongoDB prend la charge directement."},
  {q:"ZooKeeper tombe — qu'est-ce qui est impacté en premier ?",opts:["Le RING Core (Bizstorenode)","La capacité de Kafka à élire des leaders de partitions","Les opérations S3 GET directs","SaltStack ne peut plus déployer"],ans:1,expl:"ZooKeeper est utilisé par Kafka pour la coordination et l'élection des leaders de partitions. Si ZooKeeper perd le quorum, Kafka se fige et la queue CRR/Backbeat s'arrête."},
  {q:"Quelle est la différence fonctionnelle entre node_exporter et MARS ?",opts:["Ils font la même chose","node_exporter expose les métriques OS/hardware, MARS expose les métriques applicatives internes RING","MARS remplace node_exporter dans RING 9.5","node_exporter est pour les noeuds DATA, MARS pour META"],ans:1,expl:"node_exporter collecte les métriques kernel/système (CPU, RAM, disques, réseau). MARS collecte les métriques spécifiques aux composants Scality (état fragments, disques biziod, alarmes internes). Les deux alimentent Prometheus."},
  {q:"Si TANG est inaccessible au démarrage d'un nœud, que se passe-t-il ?",opts:["Le nœud démarre normalement","Les disques LUKS ne s'ouvrent pas automatiquement, une passphrase manuelle est requise","Le nœud entre en OOS automatiquement","LUKS est désactivé définitivement"],ans:1,expl:"TANG est le serveur NBDE qui fournit la clé de déchiffrement LUKS au démarrage. Si TANG est inaccessible, clevis ne peut pas obtenir la clé et les disques restent chiffrés. Une passphrase de secours (stockée hors-ligne) permet le déchiffrement manuel."},
  {q:"Pourquoi ClickHouse a-t-il remplacé Elasticsearch dans RING 9.5 ?",opts:["Elasticsearch était plus cher en licence","ClickHouse est optimisé pour les requêtes analytiques colonnaires avec moins de ressources qu'Elasticsearch","Elasticsearch ne supportait pas les logs S3","Pour réduire le nombre de composants"],ans:1,expl:"ClickHouse est une base analytique colonnaire : elle excelle sur les requêtes agrégées sur des milliards de lignes de logs. Elasticsearch est conçu pour la recherche full-text — coûteux en RAM et CPU pour ce cas d'usage analytique."},
  {q:"Quel composant collecte les logs sur chaque nœud et les forward vers Loki et ClickHouse ?",opts:["Loki","Grafana","Fluent-bit","Thanos"],ans:2,expl:"Fluent-bit est l'agent de collecte de logs léger déployé sur chaque nœud. Il forward vers Loki (centralisation) et ClickHouse (analytics S3). Rôle symétrique à node_exporter pour les métriques."},
  {q:"Apache Spark est-il un composant interne du RING ?",opts:["Oui, il gère le moteur de recherche de métadonnées","Non, Spark accède au RING via l'API S3 comme n'importe quel client","Oui, utilisé par Backbeat pour CRR","Non mais requis pour S3 Analytics"],ans:1,expl:"Spark est un moteur de traitement distribué externe. Il accède au RING via l'API S3 standard pour des workloads data lake, ML ou analytics. Le RING est le storage layer, Spark est le compute layer — séparation stricte."},
  {q:"Quelle est la chaîne complète logs dans RING 9.5 ?",opts:["node_exporter → Prometheus → Grafana","Fluent-bit → Loki → Grafana","MARS → Thanos → Grafana","AlertManager → Nagios → Grafana"],ans:1,expl:"La stack de logs est : Fluent-bit (collecte sur chaque nœud) → Loki (agrégation et indexation) → Grafana (visualisation). Grafana utilise à la fois Prometheus (métriques) et Loki (logs) comme sources de données."},
  {q:"Si MongoDB est complètement down, que peut encore faire le service S3 ?",opts:["Rien — toutes les opérations S3 échouent","Les lectures récentes en cache Redis peuvent répondre partiellement, les écritures échouent immédiatement","Toutes les opérations S3 continuent normalement","Seul sproxyd continue pour les objets déjà connus"],ans:1,expl:"Redis cache les métadonnées chaudes. Si MongoDB est complètement down, les lectures en cache Redis peuvent encore répondre temporairement, mais les écritures (qui doivent aller dans MongoDB) échouent. Le cache expire et les lectures échouent aussi progressivement."}
]}
];

var state={view:'home',tab:'theory',modIdx:0,scores:{},answers:{}};
try{var s=JSON.parse(localStorage.getItem('ringState')||'{}');state.scores=s.scores||{};}catch(e){}
function save(){try{localStorage.setItem('ringState',JSON.stringify({scores:state.scores}));}catch(e){}}

function goHome(){
  state.view='home';
  document.getElementById('homePage').classList.add('show');
  document.getElementById('modulePage').classList.remove('show');
  document.getElementById('glossaryPage').classList.remove('show');
  renderHome();renderSidebar();
}

function openModule(idx){
  state.view='module';state.modIdx=idx;state.tab='theory';
  if(!state.answers[MODS[idx].id])state.answers[MODS[idx].id]=new Array(MODS[idx].quiz.length).fill(-1);
  document.getElementById('homePage').classList.remove('show');
  document.getElementById('modulePage').classList.add('show');
  document.getElementById('glossaryPage').classList.remove('show');
  renderModule();renderSidebar();
  document.querySelector('#modulePage .mpbody').scrollTop=0;
}

function showTab(tab){
  state.tab=tab;
  document.getElementById('tabCours').classList.toggle('active',tab==='theory');
  document.getElementById('tabQuiz').classList.toggle('active',tab==='quiz');
  document.getElementById('theoryView').classList.toggle('show',tab==='theory');
  document.getElementById('quizView').classList.toggle('show',tab==='quiz');
  document.querySelector('#modulePage .mpbody').scrollTop=0;
}

var SIDEBAR_ORDER=['M1','M2','M3','M4','M7','MA','MC','MF','MH','ME','MG','M5','M6','M8','MD','M9','MB','MI','MJ'];
var SIDEBAR_GROUPS={'M1':'Architecture RING','M2':'Architecture RING','M3':'Architecture RING','M4':'Architecture RING','M7':'Architecture RING','MA':'SOFS','MC':'S3 Connector','MF':'S3 Connector','MH':'S3 Connector','ME':'CRR & Multi-site DR','MG':'CRR & Multi-site DR','M5':'Exploitation du RING','M6':'Exploitation du RING','M8':'Exploitation du RING','MD':'Exploitation du RING','M9':'Administration','MB':'Administration','MI':'Administration','MJ':'Composants Tiers'};

function renderSidebar(){
  var nav=document.getElementById('sbNav');
  var html='';
  var lastGrp='';
  SIDEBAR_ORDER.forEach(function(id){
    var i=MODS.findIndex(function(m){return m.id===id;});
    if(i===-1)return;
    var m=MODS[i];
    var grp=SIDEBAR_GROUPS[id]||'';
    if(grp!==lastGrp){lastGrp=grp;html+='<div class="nav-sec">'+grp+'</div>';}
    var sc=state.scores[m.id];
    var isDone=sc&&sc.score===sc.total;
    var isPartial=sc&&sc.score<sc.total;
    var isActive=state.view==='module'&&state.modIdx===i;
    var badge=sc?'<span class="nbadge">'+sc.score+'/'+sc.total+'</span>':'';
    var cls=['ni',isActive?'active':'',isDone?'done':'',isPartial?'partial':''].filter(Boolean).join(' ');
    html+='<div class="'+cls+'" onclick="openModule('+i+')"><span class="nid">'+m.num+'</span><span class="ntxt">'+m.title+'</span>'+badge+'</div>';
  });
  html+='<div class="nav-sec">Référence</div>';
  html+='<div class="ni'+(state.view==='glossary'?' active':'')+'" onclick="openGlossary()"><span class="nid">GL</span><span class="ntxt">Glossaire</span></div>';
  nav.innerHTML=html;
  var done=Object.keys(state.scores).length;
  var totalScore=Object.values(state.scores).reduce(function(a,b){return a+b.score;},0);
  var totalMax=Object.values(state.scores).reduce(function(a,b){return a+b.total;},0);
  var tv=document.getElementById('totScore');
  var ts=document.getElementById('totSub');
  if(done===0){tv.textContent='--';ts.textContent='Aucun quiz complete';}
  else{tv.textContent=totalMax>0?Math.round(totalScore/totalMax*100)+'%':'--';ts.textContent=totalScore+'/'+totalMax+' pts . '+done+'/'+MODS.length+' modules';}
}

function renderHome(){
  var done=Object.keys(state.scores).length;
  var totalScore=Object.values(state.scores).reduce(function(a,b){return a+b.score;},0);
  var totalMax=Object.values(state.scores).reduce(function(a,b){return a+b.total;},0);
  var pct=totalMax>0?Math.round(totalScore/totalMax*100):0;
  document.getElementById('statsRow').innerHTML='<div class="stat-card"><div class="sv col-acc">'+MODS.length+'</div><div class="sl">Modules au total</div></div><div class="stat-card"><div class="sv col-ok">'+done+'</div><div class="sl">Quiz completes</div></div><div class="stat-card"><div class="sv col-info">'+pct+'%</div><div class="sl">Score moyen</div></div>';
  var grid=document.getElementById('moduleGrid');
  grid.innerHTML=MODS.map(function(m,i){
    var sc=state.scores[m.id];
    var isDone=sc&&sc.score===sc.total;
    var pct2=sc?Math.round(sc.score/sc.total*100):0;
    var pfClass=isDone?'ok':'acc';
    return '<div class="mc '+(isDone?'done':'')+'" onclick="openModule('+i+')"><div class="mid">Module '+m.num+'</div><div class="mtit">'+m.title+'</div><div class="mdesc">'+m.desc+'</div><div class="mfoot"><div class="pbar"><div class="pfill '+pfClass+'" style="width:'+pct2+'%"></div></div><span class="msc">'+(sc?sc.score+'/'+sc.total+' pts':'Non commence')+'</span></div></div>';
  }).join('');
}

function renderModule(){
  var m=MODS[state.modIdx];
  document.getElementById('mpId').textContent='Module '+m.num;
  document.getElementById('mpTitle').textContent=m.title;
  document.getElementById('theoryView').innerHTML=m.content;
  document.getElementById('theoryView').classList.add('show');
  renderQuiz();
  document.getElementById('quizView').classList.remove('show');
  document.getElementById('tabCours').classList.add('active');
  document.getElementById('tabQuiz').classList.remove('active');
}

function renderQuiz(){
  var m=MODS[state.modIdx];
  var sc=state.scores[m.id];
  var answers=state.answers[m.id]||new Array(m.quiz.length).fill(-1);
  var locked=!!sc;
  var html='<div class="quiz-hdr"><h2>Quiz &mdash; '+m.title+'</h2><p>'+m.quiz.length+' questions &middot; Selectionnez une reponse par question</p></div>';
  var letters=['A','B','C','D'];
  m.quiz.forEach(function(q,qi){
    var sel=answers[qi];
    html+='<div class="qcard '+(locked&&sel!==-1?'answered':'')+'" id="qcard'+qi+'">';
    html+='<div class="qnum">Question '+(qi+1)+' / '+m.quiz.length+'</div>';
    html+='<div class="qtxt">'+q.q+'</div>';
    html+='<div class="opts">';
    q.opts.forEach(function(opt,oi){
      var cls='opt';
      if(locked)cls+=' locked';
      if(sel===oi){cls+=oi===q.ans?' correct':' wrong';}
      else if(locked&&oi===q.ans){cls+=' correct';}
      else if(sel===oi){cls+=' sel';}
      var click=locked?'':'onclick="selectOpt('+qi+','+oi+')"';
      html+='<div class="'+cls+'" '+click+'><span class="ol">'+letters[oi]+'</span><span>'+opt+'</span></div>';
    });
    html+='</div>';
    if(locked){html+='<div class="expl show">'+q.expl+'</div>';}
    else{html+='<div class="expl" id="expl'+qi+'"></div>';}
    html+='</div>';
  });
  html+='<div class="qa">';
  if(!locked){html+='<button class="btn btn-p" onclick="validateQuiz()">Valider le quiz</button><button class="btn btn-s" onclick="showTab(\'theory\')">&#8592; Retour au cours</button>';}
  html+='</div>';
  if(locked){
    var pct=Math.round(sc.score/sc.total*100);
    var cls2=pct>=80?'ex':pct>=50?'gd':'po';
    var label=pct>=80?'Excellent !':pct>=50?'Bien !':'A revoir';
    var msg=pct>=80?'Vous maitrisez ce module.':pct>=50?'Quelques points a consolider.':'Relisez le cours avant de continuer.';
    var next=state.modIdx<MODS.length-1?'<button class="btn btn-ok" onclick="openModule('+(state.modIdx+1)+')">Module suivant &#8594;</button>':'<button class="btn btn-i" onclick="goHome()">Accueil</button>';
    html+='<div class="result-box show"><div style="font-size:13px;color:var(--t3)">Resultat</div><div class="rscore '+cls2+'">'+sc.score+'/'+sc.total+'</div><div class="rlabel">'+label+'</div><div class="rmsg">'+pct+'% de reussite &mdash; '+msg+'</div><div class="rnext"><button class="btn btn-s" onclick="resetQuiz()">Recommencer</button>'+next+'</div></div>';
  }
  document.getElementById('quizView').innerHTML=html;
}

function selectOpt(qi,oi){
  var m=MODS[state.modIdx];
  if(!state.answers[m.id])state.answers[m.id]=new Array(m.quiz.length).fill(-1);
  var prev=state.answers[m.id][qi];
  if(prev!==-1){var p=document.getElementById('opt'+qi+'_'+prev);if(p)p.classList.remove('sel');}
  state.answers[m.id][qi]=oi;
  var el=document.querySelector('#qcard'+qi+' .opts .opt:nth-child('+(oi+1)+')');
  if(el)el.classList.add('sel');
}

function validateQuiz(){
  var m=MODS[state.modIdx];
  var answers=state.answers[m.id]||[];
  var score=0;
  m.quiz.forEach(function(q,qi){if(answers[qi]===q.ans)score++;});
  state.scores[m.id]={score:score,total:m.quiz.length};
  save();renderQuiz();renderSidebar();
}

function resetQuiz(){
  var m=MODS[state.modIdx];
  delete state.scores[m.id];
  state.answers[m.id]=new Array(m.quiz.length).fill(-1);
  save();renderQuiz();renderSidebar();
}

var GLOSSARY=[
  {term:'ARC',def:'Adaptive Ring Coding — schéma d\'erasure coding propriétaire Scality stockant des fragments de données sur plusieurs nœuds pour tolérer les pannes. Remplace la réplication classique avec une meilleure efficacité de stockage.',refs:['M2','M4']},
  {term:'ARC_REBUILD_NOK',def:'Alarme indiquant qu\'un rebuild d\'objet en mode ARC a échoué. Le fragment corrompu ou manquant n\'a pas pu être reconstruit à partir des fragments survivants.',refs:['M5']},
  {term:'AlertManager',def:'Composant Prometheus gérant le routage et la déduplication des alertes. Reçoit les alertes de Prometheus et les envoie vers les destinations configurées (email, PagerDuty, Slack).',refs:['M5']},
  {term:'Backbeat',def:'Moteur de réplication asynchrone de Scality. Traite les tâches CRR, Lifecycle, Replication Metrics et autres workflows en arrière-plan via des queues Kafka.',refs:['ME','MG']},
  {term:'Balance',def:'Processus d\'équilibrage de la charge des données entre les disques et nœuds d\'un ring. Déclenché automatiquement lors de l\'ajout ou du retrait d\'un nœud.',refs:['M4','MD']},
  {term:'Biziod',def:'Daemon d\'I/O bas niveau s\'exécutant sur chaque nœud de stockage. Gère les opérations de lecture/écriture sur les disques physiques pour le compte de sproxyd.',refs:['M2']},
  {term:'Bizstorenode',def:'Service regroupant biziod et les composants de stockage local sur un nœud RING. Unité de déploiement gérée par Salt pour les nœuds DATA et META.',refs:['M2','M9']},
  {term:'bseq',def:'Numéro de séquence de blob (blob sequence) — identifiant unique d\'une version d\'un objet sur le disque, utilisé par repd pour suivre les versions de données.',refs:['M2']},
  {term:'bucketd',def:'Service Scality gérant les métadonnées des buckets S3 (liste des objets, ACL, versioning). Utilise LevelDB comme backend de stockage.',refs:['MC','MF']},
  {term:'Chord',def:'Protocole d\'espace de clés distribué DHT utilisé par le RING pour répartir les objets entre nœuds selon leur hash. Détermine quels nœuds sont responsables de quels objets.',refs:['M1','M2']},
  {term:'Chord Purge',def:'Opération de nettoyage des entrées orphelines dans l\'espace Chord. Supprime les références à des objets qui n\'existent plus physiquement.',refs:['M6','MD']},
  {term:'Cloudserver',def:'Implémentation Scality du protocole S3 (équivalent d\'Amazon S3). Expose une API S3 compatible et s\'appuie sur sproxyd et bucketd pour le stockage.',refs:['MC','MF','MH']},
  {term:'CONF_MISMATCH',def:'Alarme signalant une incohérence de configuration entre nœuds du ring. Peut indiquer une différence de version logicielle ou de paramètre de configuration.',refs:['M5']},
  {term:'COS',def:'Class of Service — classe de stockage définissant les règles de protection des données (nombre de copies, schéma ARC, domaines de pannes) appliquées aux objets.',refs:['M2','M4']},
  {term:'CRR',def:'Cross-Region Replication — réplication asynchrone des objets S3 entre deux sites ou deux buckets, orchestrée par Backbeat.',refs:['ME','MG']},
  {term:'cseq',def:'Numéro de séquence de chunk — identifiant de la version logique d\'un objet dans le ring, incrémenté à chaque mise à jour.',refs:['M2']},
  {term:'CTDB',def:'Clustered TDB — couche de métadonnées distribuée utilisée par Samba/SOFS pour partager les informations de sessions SMB entre les nœuds du cluster.',refs:['MA']},
  {term:'DLM',def:'Distributed Lock Manager — gestionnaire de verrous distribués utilisé par SOFS pour coordonner les accès concurrents aux fichiers entre les nœuds du cluster.',refs:['MA']},
  {term:'Disk Orphans',def:'Objets présents physiquement sur disque mais sans référence dans les métadonnées du ring. Détectés lors d\'un Chord Purge et éligibles à la suppression.',refs:['M6','MD']},
  {term:'Erasure Coding',def:'Technique de protection des données découpant un objet en fragments de données et de parité. Permet de reconstruire l\'objet même si certains fragments sont perdus, avec moins d\'espace que la réplication N×.',refs:['M2','M4']},
  {term:'Fail2ban',def:'Outil de sécurité analysant les logs pour détecter et bloquer automatiquement les adresses IP effectuant des tentatives d\'intrusion répétées.',refs:['MB']},
  {term:'Failure Domain',def:'Unité de panne indépendante (nœud, rack, datacenter) utilisée par le COS pour garantir que les fragments d\'un même objet sont distribués sur des domaines distincts.',refs:['M2','M4']},
  {term:'FUSE',def:'Filesystem in Userspace — interface noyau Linux permettant à sfused d\'exposer le système de fichiers SOFS en espace utilisateur sans module noyau dédié.',refs:['MA']},
  {term:'GC',def:'Garbage Collector — processus de nettoyage supprimant les objets supprimés ou les versions obsolètes qui ne sont plus référencés dans les métadonnées.',refs:['M6','MD']},
  {term:'Grafana',def:'Plateforme de visualisation de métriques. Affiche les tableaux de bord de monitoring du RING en interrogeant Prometheus/Thanos comme source de données.',refs:['M5']},
  {term:'INCOMPLETE',def:'État d\'un objet dont tous les fragments n\'ont pas pu être écrits lors de l\'ingestion. L\'objet est présent mais dégradé ; un rebuild peut le compléter.',refs:['M5','M6']},
  {term:'Kafka',def:'Plateforme de messagerie distribuée utilisée par Backbeat pour mettre en file d\'attente les événements de réplication, lifecycle et autres tâches asynchrones.',refs:['ME','MG']},
  {term:'Keyspace',def:'Espace de clés du ring Chord — plage de valeurs de hash sur laquelle les objets sont distribués. Chaque nœud est responsable d\'une portion du keyspace.',refs:['M1','M2']},
  {term:'KMIP',def:'Key Management Interoperability Protocol — protocole standard d\'interopérabilité pour les systèmes de gestion de clés de chiffrement, utilisé avec LUKS et NBDE.',refs:['MB']},
  {term:'KMS',def:'Key Management Service — service de gestion des clés de chiffrement des données au repos. Intégré avec Vault pour le chiffrement côté serveur S3.',refs:['MB','MH']},
  {term:'LACP',def:'Link Aggregation Control Protocol — protocole d\'agrégation de liens réseau (bonding) pour augmenter le débit et la redondance réseau des nœuds RING.',refs:['M9']},
  {term:'Legal Hold',def:'Verrou légal sur un objet S3 empêchant toute suppression ou modification, indépendamment de la retention policy. Utilisé pour la préservation de preuves.',refs:['MH']},
  {term:'LevelDB',def:'Base de données clé-valeur embarquée (Google) utilisée par bucketd et repd pour stocker les métadonnées localement sur chaque nœud.',refs:['MC','MF']},
  {term:'Lifecycle Policy',def:'Règles S3 définissant le cycle de vie automatique des objets : transition vers un autre tier de stockage, expiration, suppression de versions non courantes.',refs:['MF','ME']},
  {term:'LUKS',def:'Linux Unified Key Setup — standard de chiffrement de disque Linux. Utilisé pour chiffrer les disques des nœuds RING au repos (encryption at rest).',refs:['MB']},
  {term:'MARS',def:'Module d\'Alarmes et de Remontée de Supervision — composant interne Scality collectant et normalisant les événements d\'alarme des nœuds pour les exposer à Prometheus.',refs:['M5']},
  {term:'membershipd',def:'Daemon de gestion de l\'appartenance au ring. Maintient la vue cohérente des membres actifs du cluster et orchestre les changements de topologie (nodeJoin/nodeLeave).',refs:['M2','MD']},
  {term:'MESA',def:'Metadata Engine for Scality Architecture — couche de métadonnées distribuée du RING gérant l\'index des objets et leur localisation, stockée dans le ring META.',refs:['M2','M3']},
  {term:'Mode Maintenance',def:'État d\'un nœud retiré temporairement du service actif pour maintenance. Les données sont rééquilibrées et le nœud ne reçoit plus de nouvelles écritures.',refs:['MD']},
  {term:'NBDE',def:'Network-Bound Disk Encryption — mécanisme de déchiffrement automatique des disques LUKS au démarrage, conditionné à la disponibilité d\'un serveur Tang sur le réseau.',refs:['MB']},
  {term:'nodeJoin',def:'Commande ringsh ajoutant un nœud au ring. Déclenche le rééquilibrage du keyspace et le transfert des données vers le nouveau nœud.',refs:['MD']},
  {term:'nodeLeave',def:'Commande ringsh retirant proprement un nœud du ring. Les données dont il était responsable sont redistribuées avant son départ effectif.',refs:['MD']},
  {term:'Object Lock (WORM)',def:'Fonctionnalité S3 bloquant la modification ou suppression d\'un objet pendant une durée définie (Governance ou Compliance mode). Implémente le stockage WORM.',refs:['MH']},
  {term:'OOS',def:'Out Of Service — état d\'un nœud inaccessible temporairement. Le ring continue à fonctionner en dégradé et le nœud peut rejoindre automatiquement à son retour.',refs:['M5','MD']},
  {term:'OOS_PERM',def:'Out Of Service Permanent — état d\'un nœud définitivement perdu. Déclenche le rebuild des données de ce nœud sur les autres membres du ring.',refs:['M5','MD']},
  {term:'Orphelins',def:'Voir "Disk Orphans". Objets physiquement présents sur disque mais sans entrée dans les métadonnées Chord. À nettoyer via Chord Purge.',refs:['M6','MD']},
  {term:'Platformcheck',def:'Outil de diagnostic Scality vérifiant la conformité de la configuration système (réseau, stockage, OS, BIOS) par rapport aux prérequis de déploiement.',refs:['M9']},
  {term:'Prometheus',def:'Système de monitoring et d\'alerte collectant les métriques des composants RING via scraping HTTP. Stocke les séries temporelles et évalue les règles d\'alerte.',refs:['M5']},
  {term:'Purge',def:'Opération de suppression définitive des objets marqués comme supprimés ou expirés. Libère l\'espace disque occupé par les données logiquement supprimées.',refs:['M6','MD']},
  {term:'Quorum Raft',def:'Nombre minimal de nœuds devant être disponibles pour qu\'un groupe Raft puisse élire un leader et continuer à accepter des écritures. Généralement ⌊N/2⌋+1.',refs:['M3']},
  {term:'Raft',def:'Algorithme de consensus distribué utilisé par le ring META pour garantir la cohérence des métadonnées. Un leader est élu parmi les nœuds d\'un groupe ; les écritures passent par lui.',refs:['M3']},
  {term:'Rebuild',def:'Reconstruction des fragments manquants d\'un objet dégradé à partir des fragments survivants. Déclenché automatiquement lors d\'une panne nœud ou disque.',refs:['M4','M6','MD']},
  {term:'Relocation',def:'Déplacement planifié des données d\'un nœud vers d\'autres nœuds du ring, par exemple avant une opération de maintenance ou un retrait définitif.',refs:['MD']},
  {term:'Repair',def:'Opération de vérification et correction de l\'intégrité des objets du ring. Vérifie que chaque objet possède le bon nombre de fragments conformes à son COS.',refs:['M6','MD']},
  {term:'repd',def:'Replication Daemon — daemon s\'exécutant sur chaque nœud META et DATA, responsable de la gestion locale des objets, de leur versioning (bseq) et de la cohérence avec LevelDB.',refs:['M2','M3']},
  {term:'ringConfigSet',def:'Commande ringsh modifiant les paramètres de configuration du ring (ex: facteur de réplication, seuils d\'alarme). Requiert une validation et peut nécessiter un redémarrage.',refs:['MD']},
  {term:'RING DATA',def:'Sous-ring dédié au stockage des données (blobs) des objets. Les nœuds DATA hébergent biziod et sproxyd, et contribuent à l\'espace de stockage brut.',refs:['M1','M2']},
  {term:'RING META',def:'Sous-ring dédié au stockage des métadonnées des objets (index Chord, MESA). Les nœuds META gèrent les groupes Raft et le consensus des métadonnées.',refs:['M1','M2','M3']},
  {term:'ringsh',def:'Shell interactif d\'administration du RING. Permet d\'exécuter des commandes de diagnostic (ringList, nodeStatus) et de maintenance (nodeJoin, nodeLeave) sur le cluster.',refs:['M5','MD']},
  {term:'RPO',def:'Recovery Point Objective — perte de données maximale tolérée exprimée en durée. Définit la fréquence minimale de synchronisation pour la reprise après sinistre.',refs:['MG']},
  {term:'RTO',def:'Recovery Time Objective — durée maximale tolérée d\'interruption de service. Définit le délai maximum pour restaurer le service après un incident.',refs:['MG']},
  {term:'Salt / SaltStack',def:'Outil de gestion de configuration et d\'orchestration utilisé pour déployer et maintenir les composants Scality RING. Les états Salt décrivent la configuration cible des nœuds.',refs:['M9','MI']},
  {term:'scaldisk',def:'Outil de gestion des disques sur les nœuds RING. Permet d\'ajouter, retirer, ou vérifier l\'état des disques physiques intégrés au service de stockage.',refs:['M9','MD']},
  {term:'sfused',def:'Service FUSE implémentant le filesystem SOFS côté client. Expose le namespace SOFS en tant que point de montage POSIX sur les serveurs d\'accès NFS/SMB.',refs:['MA']},
  {term:'SOFS',def:'Scale-Out File System — système de fichiers distribué Scality exposant une interface POSIX (NFS/SMB) au-dessus du ring de stockage d\'objets.',refs:['MA']},
  {term:'SPOF',def:'Single Point Of Failure — composant dont la défaillance entraîne l\'arrêt complet du service. L\'architecture RING vise à éliminer les SPOF par redondance.',refs:['M1','M4']},
  {term:'SPLIT LOOP',def:'Alarme critique indiquant que le ring s\'est fragmenté en deux partitions réseau qui ne se voient plus. Entraîne un split-brain et nécessite une intervention immédiate.',refs:['M5','MD']},
  {term:'sproxyd',def:'Daemon HTTP de stockage d\'objets s\'exécutant sur les nœuds DATA. Expose une API REST interne et délègue les I/O disque à biziod. Point d\'entrée des données dans le ring.',refs:['M2','M4']},
  {term:'Supervisor',def:'Daemon de surveillance des processus (supervisord) assurant le redémarrage automatique des services Scality en cas de crash.',refs:['M9']},
  {term:'SupAPI',def:'Supervisor API — interface REST exposée par supervisord permettant de contrôler et surveiller l\'état des processus Scality sur chaque nœud.',refs:['M9']},
  {term:'SUR',def:'Storage Utilization Ratio — taux d\'utilisation de l\'espace de stockage brut, tenant compte de l\'overhead de l\'erasure coding ou de la réplication selon le COS.',refs:['M4','M5']},
  {term:'Thanos',def:'Extension de Prometheus offrant du stockage long terme et une vue agrégée multi-cluster des métriques. Utilisé pour les tableaux de bord Grafana historiques.',refs:['M5']},
  {term:'Throttling',def:'Mécanisme de limitation du débit d\'I/O ou du nombre de requêtes par seconde, protégeant le ring contre les surcharges. Configurable par COS ou par tenant.',refs:['MF']},
  {term:'UTAPI',def:'Usage Tracking API — service Scality collectant et exposant les métriques d\'utilisation S3 par bucket et par utilisateur (octets stockés, requêtes, bande passante).',refs:['MF']},
  {term:'Vault',def:'Service d\'authentification et d\'autorisation IAM de Scality. Gère les comptes, utilisateurs, rôles et politiques S3 (équivalent AWS IAM), ainsi que les clés de chiffrement KMS.',refs:['MC','MB','MH']},
  {term:'Warm Standby (WSB)',def:'Mode de réplication entre deux sites où le site secondaire reçoit les données en quasi-temps réel mais n\'est pas actif. Bascule rapide possible en cas de panne du site primaire.',refs:['MG']},
  {term:'XDM',def:'Cross-Domain Management — composant de gestion multi-site permettant d\'administrer plusieurs rings depuis une interface unifiée, avec politiques de CRR et de routage centralisées.',refs:['M3','ME']},
  {term:'ZooKeeper',def:'Service de coordination distribué (Apache) utilisé par Kafka et certains composants Backbeat pour la synchronisation, la découverte de services et la gestion de configuration.',refs:['ME','MG']},
  {term:'Apache httpd',def:'Serveur web Apache utilisé comme frontend HTTP de sproxyd. Écoute sur le port 81 et forward les requêtes vers le daemon sproxyd (port 10000) via FastCGI. Gère TLS et les logs d\'accès.',refs:['M4','MJ']},
  {term:'Apache Spark',def:'Moteur de traitement distribué open-source. N\'est PAS un composant interne du RING — accède au RING via l\'API S3 standard. Le RING est le storage layer, Spark est le compute layer. Usage : data lake analytics, ML, ETL batch.',refs:['MH','MJ']},
  {term:'clevis',def:'Client NBDE côté nœud. Obtient la clé de déchiffrement LUKS depuis le serveur TANG au démarrage du nœud, permettant l\'ouverture automatique des disques chiffrés sans intervention humaine.',refs:['M6','MB','MJ']},
  {term:'ClickHouse',def:'Base de données analytique colonnaire hautes performances. Reçoit les logs d\'accès S3 via Fluent-bit et permet des requêtes analytiques rapides (qui accède à quoi, quand, d\'où). Remplace Elasticsearch depuis RING 9.5.0.',refs:['MH','MI','MJ']},
  {term:'Elasticsearch',def:'Moteur de recherche et d\'analytique full-text utilisé dans les versions RING antérieures à 9.5.0 pour le statut S3 et les logs d\'accès. Remplacé par Prometheus/Thanos (statut) et ClickHouse (analytics) depuis 9.5.',refs:['M5','M8','MJ']},
  {term:'Fluent-bit',def:'Agent léger de collecte de logs (< 1 MB RAM) déployé sur chaque nœud RING. Forward les logs vers Loki (centralisation) et ClickHouse (analytics S3). Joue pour les logs le même rôle que node_exporter pour les métriques.',refs:['M5','MI','MJ']},
  {term:'Keycloak',def:'Solution SSO (Single Sign-On) intégrée dans Scality RING depuis la version 9.4.0. Gère l\'authentification des administrateurs vers le Supervisor et Grafana via SAML 2.0 et OIDC. Distinct de Vault (IAM S3) : Keycloak = admins humains, Vault = applications S3.',refs:['M9','MJ']},
  {term:'Loki',def:'Système de centralisation et d\'indexation des logs (Grafana Labs). Contrairement à Elasticsearch, Loki indexe uniquement les métadonnées (labels) et non le contenu des logs — moins gourmand en ressources. Interrogeable depuis Grafana.',refs:['M5','MI','MJ']},
  {term:'MongoDB',def:'Base de données NoSQL utilisée comme source de vérité des métadonnées S3 : liste des objets par bucket, ACL, versioning, tags. Déployée en ReplicaSet pour la HA. Redis est son cache en amont.',refs:['M3','MC','MJ']},
  {term:'NFS-Ganesha',def:'Serveur NFS userspace supportant NFSv4.0. Avantage par rapport au NFS kernel : un crash est isolé (pas de kernel panic) et les mises à jour ne nécessitent pas de recompilation noyau. Utilisé par SOFS pour l\'accès NFS.',refs:['M4','MA','MJ']},
  {term:'node_exporter',def:'Agent Prometheus déployé sur chaque nœud. Expose les métriques OS et hardware : CPU, RAM, disques, réseau, charge système. Complément de MARS qui expose les métriques applicatives internes RING.',refs:['M5','MJ']},
  {term:'Redis',def:'Base de données en mémoire utilisée comme cache des métadonnées S3 chaudes. Réduit la charge sur MongoDB pour les lectures fréquentes (LIST, HEAD). Déployé en mode HA via Redis Sentinel (1 master + N replicas).',refs:['M3','MC','MJ']},
  {term:'Reed-Solomon',def:'Algorithme de codes correcteurs d\'erreurs utilisé par l\'erasure coding ARC du RING. Permet de reconstruire les fragments manquants d\'un objet à partir d\'un sous-ensemble des fragments survivants.',refs:['M2','MJ']},
  {term:'Samba',def:'Implémentation open-source du protocole SMB/CIFS. Utilisé dans SOFS pour exposer les partages Windows (SMB 3.0). SerNet-Samba est la distribution enterprise de Samba avec support commercial. La règle vfs objects = ring doit être en première position.',refs:['M4','MA','MJ']},
  {term:'TANG',def:'Serveur NBDE (Network-Bound Disk Encryption) fournissant les clés de déchiffrement LUKS aux nœuds au démarrage. Si TANG est inaccessible (réseau coupé, serveur éteint), les disques LUKS ne s\'ouvrent pas automatiquement.',refs:['M6','MB','MJ']}
];

function openGlossary(){
  state.view='glossary';
  document.getElementById('homePage').classList.remove('show');
  document.getElementById('modulePage').classList.remove('show');
  document.getElementById('glossaryPage').classList.add('show');
  renderGlossary();renderSidebar();
}

function glossJump(letter){
  var el=document.getElementById('gl-'+letter);
  if(el)el.scrollIntoView({behavior:'smooth'});
}

function renderGlossary(){
  var sorted=GLOSSARY.slice().sort(function(a,b){return a.term.localeCompare(b.term,'fr',{sensitivity:'base'});});
  var letters={};
  sorted.forEach(function(e){
    var l=e.term[0].toUpperCase();
    if(!letters[l])letters[l]=[];
    letters[l].push(e);
  });
  var keys=Object.keys(letters).sort();
  var nav='<div class="gloss-alpha">';
  keys.forEach(function(l){nav+='<span class="gl-al" onclick="glossJump(\''+l+'\')">'+l+'</span>';});
  nav+='</div>';
  var body='';
  keys.forEach(function(l){
    body+='<div class="gloss-lhdr" id="gl-'+l+'">'+l+'</div>';
    letters[l].forEach(function(e){
      var refs='';
      if(e.refs&&e.refs.length){
        refs='<div class="gl-ref">';
        e.refs.forEach(function(id,i){
          var mi=MODS.findIndex(function(m){return m.id===id;});
          if(mi>=0){
            if(i>0)refs+=' &bull; ';
            refs+='<span onclick="openModule('+mi+')">'+MODS[mi].num+' – '+MODS[mi].title+'</span>';
          }
        });
        refs+='</div>';
      }
      body+='<div class="gloss-entry"><div class="gl-term">'+e.term+'</div><div class="gl-def">'+e.def+'</div>'+refs+'</div>';
    });
  });
  document.getElementById('glossBody').innerHTML=nav+body;
}

renderSidebar();
renderHome();
</script>
