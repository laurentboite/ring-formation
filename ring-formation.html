title_en:'SOFS — Complete Configuration',
desc_en:'SOFS architecture, connectors, SMB/NFS, Recycle, Quotas, DLM',
content_en:'<h2>What is SOFS?</h2><p><strong>SOFS (Scale-Out File System)</strong> is an abstraction layer that presents the RING object storage as a <strong>POSIX file system</strong>. Each SOFS file is mapped to a unique blob in the RING (1:1 relationship): the file name is used as the key, and the content is stored as a RING object via the sproxyd protocol.</p><p>SOFS allows traditional applications (that speak NFS or SMB) to use the power of the Scality RING without modification, while benefiting from its advantages (scale-out, high availability, geographic replication).</p><h2>SOFS Architecture — Overview</h2><div class="adiag">     CLIENT APPLICATIONS\n   (Windows, Linux, CDMI...)\n           |\n   [Public network / LAN]\n           |\n+----------+----------+\n| Connector A         |  <-- private network -->  | Connector B         |\n| sfused              |                         | sfused              |\n| membershipd         |                         | membershipd         |\n| smbd/nmbd (SMB)     |                         | smbd/nmbd (SMB)     |\n| CTDB (clustering)   |                         | CTDB (clustering)   |\n+----------+----------+                         +--------------------+\n           |                                             |\n           +------------------+------------------------+\n                              |\n                     ZooKeeper Cluster\n                     (DLM, coordination)\n                              |\n           +------------------+------------------------+\n           |                                           |\n     RING DATA (SOFS objects)              RING META (SOFS metadata, COS 4+)</div><h2>Key SOFS Components</h2><h3>sfused — The FUSE Driver</h3><p><code>sfused</code> is the daemon that mounts the SOFS volume locally via FUSE (Filesystem in Userspace). It translates POSIX syscall requests (open, read, write, mkdir...) into RING operations:</p><ul><li>A <code>read()</code> on a file becomes a <code>GET sproxyd</code> to the RING</li><li>A <code>write()</code> becomes a <code>PUT sproxyd</code> (full object replacement)</li><li>A <code>mkdir()</code> creates a metadata entry in RING META (COS 4+)</li><li>Its main configuration file: <code>/etc/scality/sfused.conf</code> (JSON format)</li></ul><h3>membershipd — Volume Membership</h3><p><code>membershipd</code> is the daemon that manages the <strong>connector\'s membership in the SOFS volume</strong>. It registers with ZooKeeper to indicate that this connector is active on this volume:</p><ul><li>Allows the DLM to know which connectors are active on the volume</li><li>Coordinates failover: if a connector goes down, membershipd detects it and releases its DLM locks</li><li>Runs in parallel with sfused on each connector server</li></ul><h3>ZooKeeper — Distributed Coordination</h3><p>ZooKeeper is the distributed coordination service used by SOFS for:</p><ul><li><strong>DLM (Distributed Lock Manager)</strong>: arbitrates file locks between multiple connectors</li><li><strong>Membership</strong>: registry of active connectors on each volume</li><li><strong>Quorum</strong>: ZooKeeper operates in quorum mode (3 or 5 nodes recommended)</li></ul><div class="alert alert-w">ZooKeeper is MANDATORY when multiple connectors simultaneously access the same SOFS volume. Without ZooKeeper/DLM, concurrent writes from multiple connectors would cause data corruption.</div><h2>The 5 Types of SOFS Connectors</h2><table><tr><th>Connector</th><th>Active services</th><th>Protocol</th><th>Specifics</th></tr><tr><td><strong>FUSE (localfs)</strong></td><td>sfused + membershipd</td><td>Local POSIX</td><td>Local file access only, no direct network access for clients</td></tr><tr><td><strong>SMB/CIFS</strong></td><td>sfused + membershipd + smbd + nmbd + winbindd*</td><td>SMB 3.0</td><td>AD optional, CTDB for HA/VIP, ring module must be first in vfs objects</td></tr><tr><td><strong>NFSv3</strong></td><td>sfused + membershipd + kernel nfsd</td><td>NFS v3</td><td>Kerberos NOT supported, full POSIX semantics</td></tr><tr><td><strong>NFSv3+v4</strong></td><td>ganesha + membershipd</td><td>NFS v3 and v4.0</td><td>Kerberos supported (v4 only), NFSv4.0 only (not 4.1/4.2)</td></tr><tr><td><strong>CDMI</strong></td><td>dewpoint + sfused + membershipd</td><td>CDMI/HTTP</td><td>Apache/nginx + FastCGI, SNIA Cloud Storage standard</td></tr></table><p>*winbindd is optional. It is required only for Active Directory integration (Windows user authentication).</p><h2>SOFS Features — Detailed Description</h2><h3>MARS — Multi-site Asynchronous Replication</h3><p>MARS (Multi-site Asynchronous Replication for SOFS) allows replicating a SOFS volume to a remote site:</p><ul><li><strong>Asynchronous</strong>: writes on the source site are confirmed immediately, replication to the target site happens in the background</li><li><strong>Use cases</strong>: Disaster Recovery Plan (DRP), ransomware protection (the replicated site is read-only)</li><li>All connectors of the volume must be configured to participate in MARS</li></ul><h3>DLM — Distributed Lock Manager</h3><p>The DLM manages distributed locks on SOFS files:</p><ul><li>Essential when multiple connectors (e.g.: 2 SMB servers in a cluster) access the same volume</li><li>Prevents corruption caused by concurrent writes to the same file</li><li>Relies on ZooKeeper for inter-connector coordination</li><li>Configured in <code>/etc/scality/sfused.conf</code> DLM section</li></ul><h3>CTDB — SMB Clustering</h3><p>CTDB (Cluster Trivial DataBase) is the Samba clustering technology that enables:</p><ul><li><strong>VIP failover</strong>: a virtual IP floats between SMB nodes. If a node fails, clients automatically reconnect via the VIP without reconfiguration</li><li><strong>Load balancing</strong>: distribution of active SMB connections between cluster nodes</li><li><strong>Session persistence</strong>: SMB sessions are shared between nodes to avoid interruptions</li></ul><h2>Complete SMB Configuration</h2><h3>Configuration files</h3><ul><li><code>/etc/scality/cifs/smb.conf</code>: main configuration (SerNet-Samba)</li><li><code>/etc/scality/cifs/global_names.conf</code>: server name, workgroup</li><li><code>/etc/scality/cifs/global_ad.conf</code>: Active Directory configuration</li></ul><h3>Configuration example</h3><pre>## global_names.conf\nnetbios name = STORAGESRV01\nserver string = Scality SOFS SMB Server\nworkgroup = MYDOMAIN\n\n## global_ad.conf (if Active Directory)\nsecurity = ads\nrealm = MYDOMAIN.LOCAL\nidmap config MYDOMAIN : backend = rid\nidmap config MYDOMAIN : range = 2600000-4999999\n\n## smb.conf (SOFS share)\n[sofs-share]\n  path = /sofs/volume1\n  read only = no\n  vfs objects = ring catia fruit streams_xattr acl_xattr\n  nt acl support = yes\n  inherit acls = Yes\n  map acl inherit = Yes</pre><div class="alert alert-d">CRITICAL: <code>ring</code> must always be FIRST in <code>vfs objects</code>. Correct example: <code>vfs objects = ring catia fruit streams_xattr acl_xattr</code>. If ring is not first, ACLs and metadata are not properly stored in the RING, causing silent corruption.</div><h3>Joining the Active Directory domain</h3><pre># Join the AD domain\nnet ads join -U administrator\n\n# Verify membership\nnet ads info\n\n# List accessible AD users\nwbinfo -u</pre><h2>SOFS Recycle — Distributed Trash</h2><p>The SOFS Recycle is a <strong>versioned trash</strong> feature that allows recovering deleted files. When a file is deleted, instead of being destroyed, it is moved to a special <code>.recycle</code> directory.</p><h3>Three operating modes</h3><table><tr><th>Mode</th><th>Parameter</th><th>Who sees .recycle</th><th>Who can restore/empty</th></tr><tr><td>Invisible</td><td>invisible=true</td><td>Admin only (hidden)</td><td>Admin only</td></tr><tr><td>Privileged</td><td>privileged=true</td><td>Everyone</td><td>Admin only</td></tr><tr><td>Standard</td><td>privileged=false</td><td>Everyone</td><td>File owner + Admin</td></tr></table><h3>Structure of /etc/scality/sfused.conf</h3><pre>{\n  "recycle": {\n    "enable": true,\n    "versioning": true,    // keep multiple versions of the same file\n    "privileged": false,   // owner can restore\n    "root_name": ".recycle"\n  },\n  "lifecycle_policy": {\n    "enable": true,\n    "base_path": ".recycle",\n    "max_versions_per_hour": 60,\n    "max_versions_per_day": 999999,\n    "max_versions_per_week": 999999,\n    "max_versions_per_month": 999999,\n    "time_frame_days": 31,     // keep for 31 days max\n    "workers": 4\n  }\n}</pre><div class="alert alert-d">The lifecycle_policy is MANDATORY if Recycle is enabled. Without it, the trash grows indefinitely until it fills the SOFS volume and blocks all writes.</div><h2>SOFS Quotas</h2><p>SOFS quotas allow limiting the space used at the volume, user, or group level. They are managed via the <strong>adminapi REST</strong> of sfused (local Unix socket):</p><h3>Types of quotas</h3><ul><li><strong>Volume quota</strong>: maximum size of the entire SOFS volume</li><li><strong>User quota</strong>: maximum space per user (UID)</li><li><strong>Group quota</strong>: maximum space per group (GID)</li></ul><h3>Quota management commands</h3><pre># Get the adminapi socket\nSOCKET=$(cat /var/run/scality/scality-sfused-adminapi)\n\n# Read the current volume quota\ncurl -s $SOCKET/fs/quota/volume | python3 -m json.tool\n\n# Modify the volume quota (edit /tmp/volume_quota.json)\ncurl -s $SOCKET/fs/quota/volume --output /tmp/volume_quota.json\nvim /tmp/volume_quota.json\ncurl -s -XPUT $SOCKET/fs/quota/volume -T /tmp/volume_quota.json\n\n# User quota (uid 1234)\ncurl -s $SOCKET/fs/quota/user/1234 | python3 -m json.tool</pre><div class="kbox"><h3>Key Points to Remember</h3><ul><li>sfused = FUSE driver that translates POSIX syscalls into RING operations (sproxyd)</li><li>membershipd = connector registration in ZooKeeper</li><li>DLM + ZooKeeper = MANDATORY if multiple connectors access the same volume</li><li>CTDB = VIP failover + Samba clustering for SMB HA</li><li>vfs objects: "ring" must ALWAYS be in FIRST position</li><li>Recycle: 3 modes; lifecycle_policy MANDATORY to avoid saturation</li><li>Quotas: volume / user / group via adminapi REST on local Unix socket</li></ul></div>',
quiz_en:[
  {q:"What does SOFS stand for?",opts:["Scality Object File System","Scale-Out File System","Secure Object File Store","Shared Object FUSE System"],ans:1,expl:"SOFS = Scale-Out File System. It is the Scality distributed file system exposing a POSIX interface (NFS/SMB) on top of the object ring."},
  {q:"Which component exposes the SOFS namespace as a local mount point?",opts:["biziod","repd","sfused","bucketd"],ans:2,expl:"sfused is the FUSE daemon that mounts the SOFS namespace as a local POSIX directory. NFS and Samba/SMB rely on this mount to export the filesystem to clients."},
  {q:"What is the role of CTDB in SOFS?",opts:["Store SOFS metadata in LevelDB","Distributed Samba metadata layer to share SMB sessions between nodes","Manage user quotas","Encrypt SOFS data"],ans:1,expl:"CTDB (Clustered TDB) is used by Samba in SOFS to share SMB session information between cluster nodes, ensuring transparency for Windows clients."},
  {q:"What does the DLM do in the SOFS architecture?",opts:["Distributes data across disks","Distributed Lock Manager to coordinate concurrent file access","Manages inter-site replication","Monitors disk space"],ans:1,expl:"DLM (Distributed Lock Manager) coordinates concurrent file access between SOFS nodes. Without DLM, two nodes could modify the same file simultaneously and corrupt the data."},
  {q:"Which protocol do Linux/Unix clients use to access SOFS?",opts:["SMB/CIFS","iSCSI","NFS","WebDAV"],ans:2,expl:"Linux/Unix clients use NFS to access SOFS. Windows clients use SMB via Samba. sfused exposes the same SOFS namespace to both protocols."},
  {q:"Why does SOFS use a DLM rather than letting each node manage its own locks?",opts:["The DLM is required by NFS v4","Without a centralized DLM, two clients on two different nodes could write simultaneously to the same file, causing silent corruption","The DLM improves read performance","The DLM replaces CTDB in newer versions"],ans:1,expl:"SOFS is a distributed filesystem: multiple nodes serve clients in parallel. The DLM guarantees mutual exclusion on files by coordinating locks between nodes, ensuring POSIX consistency (one write at a time per file)."},
  {q:"What happens if sfused goes down on a SOFS node serving NFS clients?",opts:["Other nodes automatically take over without interruption","NFS clients mounted on this node lose access; sfused must be restarted or clients redirected to another node","CTDB automatically switches NFS connections","Data is lost"],ans:1,expl:"sfused is the access point to the SOFS namespace on this node. Its failure interrupts NFS/SMB access on this node. Clients must be redirected (via DNS round-robin or VIP) to another active SOFS node. Data is not lost as it is in the ring."},
  {q:"How does SOFS expose a consistent namespace to all nodes when each has its own sfused?",opts:["Each node has its own independent copy of the namespace","All sfused daemons access the same namespace in the RING via MESA for metadata and RING DATA for data, guaranteeing a consistent view","A master node holds the actual namespace","The namespace is synchronized every 5 minutes"],ans:1,expl:"SOFS stores filesystem metadata (inodes, directories) in MESA (Raft consistency) and data in RING DATA. All sfused nodes read/write from this same shared storage, guaranteeing a consistent view of the namespace regardless of which node is accessed."}
]},
{id:'11',num:'11',title:'Procédure d\'Upgrade RING',desc:'Prerequis, chemins de version, sequence Supervisor -> Storage -> Connectors',
content:'<h2>Principes Fondamentaux de l\'Upgrade RING</h2><p>Un upgrade RING est une <strong>opération critique</strong> qui doit être planifiée rigoureusement. La règle d\'or : <strong>un seul composant a la fois, dans l\'ordre prescrit, avec validation a chaque étape</strong>. Un upgrade mal exécute peut causer une interruption de service ou, dans les cas extremes, une perte de données.</p><h2>Matrice de Compatibilite des Versions</h2><div class="alert alert-d">Upgrade direct RING 7 vers RING 9 : STRICTEMENT INTERDIT. La base de données MESA et le format des containers Biziod ont change de façon incompatible entre RING 7 et RING 9. Un upgrade direct corromprait les données.</div><table><tr><th>Version source</th><th>Version cible</th><th>Chemin</th></tr><tr><td>RING 7.x</td><td>RING 9.x</td><td>INTERDIT direct. Aller RING 7 -> RING 8 -> RING 9</td></tr><tr><td>RING 8.x</td><td>RING 9.5.2</td><td>Direct supporte</td></tr><tr><td>RING 9.0 - 9.4</td><td>RING 9.5.2</td><td>Direct supporte</td></tr><tr><td>SOFS connectors &lt; 8.5.8.7</td><td>RING 9</td><td>Upgrade intermédiaire obligatoire vers 8.5.8.7 d\'abord</td></tr><tr><td>SOFS connectors 9.0 ou 9.1</td><td>RING 9.2+</td><td>Arrêter TOUS les connectors du volume avant d\'upgrader le premier</td></tr></table><h3>Cas special SOFS 9.0/9.1 -> 9.2+</h3><p>Entre RING 9.1 et 9.2, le <strong>format de stockage des métadonnées SOFS a change</strong>. Un connector 9.1 et un connector 9.2 sur le même volume sont incompatibles. La procédure est :</p><ol><li>Arrêter TOUS les connectors SOFS du volume simultanément</li><li>Upgrader tous les connectors en une seule fenêtre de maintenance</li><li>Redémarrer tous les connectors</li></ol><h2>Prerequis — Checklist Pre-Upgrade</h2><h3>1. Ticket Scality Support (OBLIGATOIRE)</h3><p>Avant tout upgrade, <strong>ouvrir un ticket Scality Support</strong> est OBLIGATOIRE. L\'équipe Support :</p><ul><li>Valide que l\'environnement est pret pour l\'upgrade (version courante, OS, espace disque)</li><li>Confirme le chemin de version exact (pas d\'étape intermédiaire oubliée)</li><li>Est disponible pour assister en cas de problème pendant l\'upgrade</li></ul><h3>2. Terminal persistant (Tmux ou Screen)</h3><p>Une déconnexion SSH en milieu d\'upgrade est catastrophique. Tmux et Screen maintiennent la session active même si la connexion est interrompue :</p><pre># Demarrer une session tmux\ntmux new -s upgrade\n\n# Se rattacher après déconnexion\ntmux attach -t upgrade\n\n# Ou avec Screen\nscreen -S upgrade\nscreen -r upgrade  # rattachement</pre><h3>3. Vérifications pre-upgrade</h3><pre># Vérifier le RING est en état RUN\nringsh supervisor ringList\nringsh supervisor ringStatus &lt;RING&gt;\n\n# Vérifier l\'espace /var\ndf -h /var\n\n# Vérifier PermitRootLogin\ngrep PermitRootLogin /etc/ssh/sshd_config\n\n# Vérifier la version scaldisk (doit = version RING courante)\nscaldisk --version</pre><h3>4. Cas CRR pre-upgrade</h3><div class="alert alert-w">Si le Cross-Region Réplication (CRR) est active sur le S3 Connector ET que vous upgradez depuis une version &lt; 9.5.2.0, une <strong>procédure de pre-upgrade CRR obligatoire</strong> doit être exécutée. Elle vide les queues de réplication en attente avant l\'upgrade pour éviter toute corruption. Contacter Scality Support pour la procédure exacte.</div><h2>Sequence Complete d\'Upgrade</h2><div class="adiag">PHASE 1 : PREPARATION\n  1. Vérifier versions + matrice de compatibilite\n  2. Ouvrir ticket Scality Support\n  3. Exécuter CRR pre-upgrade si applicable\n  4. Ouvrir terminal Tmux/Screen\n  5. Vérifier état RING : RUN obligatoire\n  6. Telecharger archive .run + vérifier sha256\n  7. Uploader sur le Supervisor\n  8. chmod +x installer.run\n  9. FORCE_PY3=1 ./installer.run -y --extract-only\n 10. Vérifier rôle Prometheus (si upgrade depuis &lt; 9.5.0)\n 11. /srv/scality/bin/precheck_upgrade --offline\n 12. Migration SSO si upgrade depuis &lt; 9.4.0.0\n\nPHASE 2 : UPGRADE SUPERVISOR\n 13. /srv/scality/scripts/prépare_upgrade\n     -> Attendre : "prépare_upgrade completed successfully"\n 14. salt \'*\' state.sls scality.req.platform.kernel\n     -> Met a jour les paramètres kernel sysctl sur tous les serveurs\n 15. /srv/scality/scripts/supervisor_upgrade\n     -> Attendre : "supervisor_upgrade completed successfully"\n     -> Le Supervisor redémarre\n     -> L\'UI affiche CONF_MISMATCH -> NORMAL, NE PAS CLIQUER Apply Config\n\nPHASE 3 : UPGRADE STORAGE SERVERS (un par un)\n 16. Pour chaque storage server :\n     a. Entrer en mode maintenance (tous les RINGs)\n     b. Vérifier état RING : RUN ou CONF_MISMATCH uniquement\n     c. nodeLeave -> attendre état OUT_OF_SERVICE\n     d. systemctl stop scality-node\n     e. yum update packages scality\n     f. systemctl start scality-node\n     g. nodeJoin -> attendre état RUN\n     h. Appliquer logging + sagentd\n     i. Passer au serveur SUIVANT seulement si RUN\n 17. Exit maintenance mode (tous les RINGs)\n\nPHASE 4 : UPGRADE CONNECTORS SOFS (si applicable)</div><h2>Phase 3 — Upgrade d\'un Storage Server en Detail</h2><h3>Étape a : Mode maintenance</h3><pre># Pour CHAQUE RING du cluster\nfor RING in $(ringsh supervisor ringList | grep -v "^$"); do\n  echo "Maintenance mode pour RING: $RING"\n  ringsh supervisor ringConfigSet ${RING} join_auto 0\n  ringsh supervisor ringConfigSet ${RING} rebuild_auto 0\n  ringsh supervisor ringConfigSet ${RING} chordpurge_enable 0\ndone</pre><h3>Étape b : Vérifier l\'état du RING</h3><pre>ringsh supervisor ringStatus &lt;RING&gt;\n# Doit afficher : RUN ou CONF_MISMATCH RUN\n# JAMAIS commencer si : INCOMPLETE, SPLIT LOOP, ARC_REBUILD_NOK</pre><h3>Étape c : nodeLeave</h3><pre># Retirer tous les nodes du serveur du RING\nfor NODE in $(ringsh supervisor nodeList &lt;RING&gt; | grep storage_server_name); do\n  ringsh supervisor nodeLeave ${NODE}:/\ndone\n# Attendre que tous les nodes soient en état OUT_OF_SERVICE\nwatch -n5 "ringsh supervisor nodeList &lt;RING&gt;"</pre><h3>Étapes d-e-f : Upgrade packages</h3><pre># Sur le serveur storage (via SSH)\nsystemctl stop scality-node\n\n# Deverrouiller les packages (si RING >= 8.3.0)\nyum versionlock delete python3-scaldisk scality-node\n\n# Mettre a jour les packages Scality\nyum update --disableplugin=versionlock \\*scality\\*\nyum clean all\n\ndystemctl start scality-node</pre><h3>Étape g : nodeJoin et validation</h3><pre># Rejoindre le RING\nfor NODE in $(ringsh supervisor nodeList &lt;RING&gt; | grep storage_server_name); do\n  ringsh supervisor nodeJoin ${NODE}:/\ndone\n\n# Attendre l\'état RUN\nwatch -n5 "ringsh supervisor ringStatus &lt;RING&gt;"\n# NE PAS passer au serveur suivant avant d\'avoir RUN</pre><h3>Étape h : Appliquer la configuration de logging</h3><pre>salt-call state.apply scality.node.log\nsalt-call state.apply scality.sagentd.registered</pre><h3>Étape 17 : Sortie du mode maintenance (APRES tous les serveurs)</h3><pre>for RING in $(ringsh supervisor ringList | grep -v "^$"); do\n  ringsh supervisor ringConfigSet ${RING} join_auto 2\n  ringsh supervisor ringConfigSet ${RING} rebuild_auto 1\n  ringsh supervisor ringConfigSet ${RING} chordpurge_enable 1\ndone</pre><h2>Phase 4 — Upgrade des Connectors SOFS</h2><p>Les connectors SOFS sont upgrages <strong>en dernier</strong>, après tous les storage nodes. Règles importantes :</p><ul><li>Les connectors SOFS peuvent généralement être upgrages un par un (service continu si plusieurs connectors par volume)</li><li><strong>Exception SOFS 9.1 -> 9.2+</strong> : tous les connectors du volume doivent être arrêtés avant d\'upgrader le premier (voir matrice de compatibilite)</li><li>Avant l\'upgrade d\'un connector : vérifier que sfused et membershipd sont en état sain</li><li>Après l\'upgrade : vérifier que le volume est monté et accessible</li></ul><pre># Pre-check connector SOFS avant upgrade\nsystemctl status scality-sfused\nsystemctl status scality-membershipd\ndf -h /sofs/volume1  # vérifier le montage</pre><div class="kbox"><h3>Points Clés a Retenir</h3><ul><li>RING 7 -> RING 9 INTERDIT directement : passer par RING 8 obligatoirement</li><li>Ticket Scality Support OBLIGATOIRE avant de commencer</li><li>Tmux/Screen OBLIGATOIRE : une déconnexion SSH en cours d\'upgrade est catastrophique</li><li>Ordre strict : Supervisor -> Storage Servers (UN PAR UN) -> Connectors SOFS</li><li>Entre chaque storage server : attendre RUN (CONF_MISMATCH accepte, INCOMPLETE interdit)</li><li>CONF_MISMATCH post-upgrade Supervisor = NORMAL, NE PAS cliquer Apply Config</li><li>CRR pre-upgrade : obligatoire si CRR actif et upgrade depuis &lt; 9.5.2.0</li></ul></div>',
quiz:[
  {q:"Dans quel ordre doit-on upgrader les composants RING ?",opts:["Storage -> Supervisor -> Connectors","Connectors -> Storage -> Supervisor","Supervisor -> Storage -> Connectors","Tous en parallèle"],ans:2,expl:"L'ordre correct est Supervisor d'abord (gestionnaire de processus), puis Storage (nœuds de stockage), puis Connectors (protocoles d'accès). Cet ordre garantit que les services sont opérationnels avant que les accès clients soient rétablis."},
  {q:"Que doit-on vérifier avant de lancer un upgrade RING ?",opts:["Que tous les disques sont pleins","Les prérequis : version source/cible, santé du ring (nodeList), espace disque, backups","Que CRR est désactivé","Que tous les clients sont déconnectés"],ans:1,expl:"Avant tout upgrade : vérifier la compatibilité des versions (chemin d'upgrade supporté), l'état de santé du ring via nodeList, l'espace disque disponible et la présence de backups des configurations."},
  {q:"Que signifie LUKS dans le contexte de la sécurité RING ?",opts:["Linux Unified Key Setup : chiffrement de disque au repos","Linux Update Key System : gestion des updates","Layered Unix Key Storage : coffre-fort de clés","Local User Key Service : service IAM"],ans:0,expl:"LUKS (Linux Unified Key Setup) est le standard de chiffrement de disque Linux. Scality l'utilisé pour le chiffrement at-rest des disques des nœuds, protégeant les données en cas de vol physique."},
  {q:"Quel protocole permet le déchiffrement automatique des disques LUKS au démarrage ?",opts:["KMIP","NBDE avec serveur Tang","SSL/TLS","KMS AWS"],ans:1,expl:"NBDE (Network-Bound Disk Encryption) avec un serveur Tang permet le déchiffrement automatique au démarrage si le nœud peut joindre le serveur Tang. Si le nœud est volé et isolé, les disques restent chiffrés."},
  {q:"Qu'est-ce que KMIP dans le contexte Scality ?",opts:["Key Management Interoperability Protocol : protocole standard pour les systèmes de gestion de clés","Kubernetes Monitoring Intégration Platform","Key Metadata Index Protocol","Scality n'utilisé pas KMIP"],ans:0,expl:"KMIP est un protocole standard d'interopérabilité pour les KMS. Scality supporte KMIP pour intégrer des KMS externes (Thales, HashiCorp Vault, etc.) pour la gestion des clés de chiffrement."},
  {q:"Quel est l'impact d'un upgrade sur les SLA de disponibilité des données ?",opts:["Les données sont inaccessibles pendant tout l'upgrade","L'upgrade est rolling : les données restent accessibles, seul un sous-ensemble de nœuds est indisponible à la fois","L'upgrade nécessite un arrêt complet du ring","L'upgrade n'affecte pas les SLA"],ans:1,expl:"L'upgrade RING est conçu en rolling (glissant) : les nœuds sont upgradés les uns après les autres. Le ring continue à servir les requêtes avec les nœuds déjà upgradés, minimisant l'impact."},
  {q:"Pourquoi est-il impératif de vérifier que le ring est sain (aucun nœud OOS) avant de démarrer un upgrade ?",opts:["C'est une simple recommandation cosmétique","Upgrader un nœud le met temporairement hors service ; si le ring a déjà des nœuds OOS, la perte d'un nœud supplémentaire peut faire passer certains objets sous le seuil de reconstruction","L'upgrade échoue automatiquement si un nœud est OOS","Pour respecter la fenêtre de maintenance"],ans:1,expl:"Durant un rolling upgrade, chaque nœud est redémarré successivement. Si le ring est déjà dégradé (nœuds OOS), ajouter un nœud OOS supplémentaire peut rendre des objets irrécupérables. Un ring sain à 100% avant l'upgrade est non-négociable."},
  {q:"Qu'est-ce qu'un chemin d'upgrade supporté dans la matrice de versions Scality ?",opts:["N'importe quelle version peut upgrader vers n'importe quelle autre","Une séquence de versions par lesquelles il faut passer (ex: 9.4 -> 9.5 -> 9.5.2) sans sauter d'étape, validée et testée par Scality","Un chemin réseau optimisé pour l'upgrade","La version vers laquelle l'upgrade est le plus rapide"],ans:1,expl:"Scality qualifie des chemins d'upgrade spécifiques. Sauter des versions intermédiaires peut causer des incompatibilités de format de données ou de configuration non gérées. La matrice d'upgrade dans les release notes définit les séquences autorisées."}
],
title_en:'RING Upgrade Procedure',
desc_en:'Prerequisites, version paths, Supervisor -> Storage -> Connectors sequence',
content_en:'<h2>Fundamental Principles of RING Upgrade</h2><p>A RING upgrade is a <strong>critical operation</strong> that must be rigorously planned. The golden rule: <strong>one component at a time, in the prescribed order, with validation at each step</strong>. A poorly executed upgrade can cause a service interruption or, in extreme cases, data loss.</p><h2>Version Compatibility Matrix</h2><div class="alert alert-d">Direct upgrade RING 7 to RING 9: STRICTLY FORBIDDEN. The MESA database and the Biziod container format have changed incompatibly between RING 7 and RING 9. A direct upgrade would corrupt the data.</div><table><tr><th>Source version</th><th>Target version</th><th>Path</th></tr><tr><td>RING 7.x</td><td>RING 9.x</td><td>Direct upgrade FORBIDDEN. Go RING 7 -> RING 8 -> RING 9</td></tr><tr><td>RING 8.x</td><td>RING 9.5.2</td><td>Direct supported</td></tr><tr><td>RING 9.0 - 9.4</td><td>RING 9.5.2</td><td>Direct supported</td></tr><tr><td>SOFS connectors &lt; 8.5.8.7</td><td>RING 9</td><td>Intermediate upgrade to 8.5.8.7 required first</td></tr><tr><td>SOFS connectors 9.0 or 9.1</td><td>RING 9.2+</td><td>Stop ALL connectors of the volume before upgrading the first one</td></tr></table><h3>Special case SOFS 9.0/9.1 -> 9.2+</h3><p>Between RING 9.1 and 9.2, the <strong>SOFS metadata storage format changed</strong>. A 9.1 connector and a 9.2 connector on the same volume are incompatible. The procedure is:</p><ol><li>Stop ALL SOFS connectors of the volume simultaneously</li><li>Upgrade all connectors in a single maintenance window</li><li>Restart all connectors</li></ol><h2>Prerequisites — Pre-Upgrade Checklist</h2><h3>1. Scality Support Ticket (MANDATORY)</h3><p>Before any upgrade, <strong>opening a Scality Support ticket is MANDATORY</strong>. The Support team:</p><ul><li>Validates that the environment is ready for upgrade (current version, OS, disk space)</li><li>Confirms the exact version path (no missed intermediate step)</li><li>Is available to assist in case of problems during the upgrade</li></ul><h3>2. Persistent terminal (Tmux or Screen)</h3><p>An SSH disconnection in the middle of an upgrade is catastrophic. Tmux and Screen keep the session active even if the connection is interrupted:</p><pre># Start a tmux session\ntmux new -s upgrade\n\n# Reattach after disconnection\ntmux attach -t upgrade\n\n# Or with Screen\nscreen -S upgrade\nscreen -r upgrade  # reattach</pre><h3>3. Pre-upgrade checks</h3><pre># Verify the RING is in RUN state\nringsh supervisor ringList\nringsh supervisor ringStatus &lt;RING&gt;\n\n# Check /var space\ndf -h /var\n\n# Check PermitRootLogin\ngrep PermitRootLogin /etc/ssh/sshd_config\n\n# Check scaldisk version (must = current RING version)\nscaldisk --version</pre><h3>4. CRR pre-upgrade case</h3><div class="alert alert-w">If Cross-Region Replication (CRR) is active on the S3 Connector AND you are upgrading from a version &lt; 9.5.2.0, a <strong>mandatory CRR pre-upgrade procedure</strong> must be executed. It drains the pending replication queues before the upgrade to avoid any corruption. Contact Scality Support for the exact procedure.</div><h2>Complete Upgrade Sequence</h2><div class="adiag">PHASE 1: PREPARATION\n  1. Check versions + compatibility matrix\n  2. Open Scality Support ticket\n  3. Execute CRR pre-upgrade if applicable\n  4. Open Tmux/Screen terminal\n  5. Check RING state: RUN mandatory\n  6. Download .run archive + verify sha256\n  7. Upload to Supervisor\n  8. chmod +x installer.run\n  9. FORCE_PY3=1 ./installer.run -y --extract-only\n 10. Check Prometheus role (if upgrading from < 9.5.0)\n 11. /srv/scality/bin/precheck_upgrade --offline\n 12. SSO migration if upgrading from < 9.4.0.0\n\nPHASE 2: UPGRADE SUPERVISOR\n 13. /srv/scality/scripts/prepare_upgrade\n     -> Wait for: "prepare_upgrade completed successfully"\n 14. salt \'*\' state.sls scality.req.platform.kernel\n     -> Updates kernel sysctl parameters on all servers\n 15. /srv/scality/scripts/supervisor_upgrade\n     -> Wait for: "supervisor_upgrade completed successfully"\n     -> Supervisor restarts\n     -> UI shows CONF_MISMATCH -> NORMAL, DO NOT CLICK Apply Config\n\nPHASE 3: UPGRADE STORAGE SERVERS (one by one)\n 16. For each storage server:\n     a. Enter maintenance mode (all RINGs)\n     b. Check RING state: RUN or CONF_MISMATCH only\n     c. nodeLeave -> wait for OUT_OF_SERVICE state\n     d. systemctl stop scality-node\n     e. yum update scality packages\n     f. systemctl start scality-node\n     g. nodeJoin -> wait for RUN state\n     h. Apply logging + sagentd\n     i. Move to NEXT server only if RUN\n 17. Exit maintenance mode (all RINGs)\n\nPHASE 4: UPGRADE SOFS CONNECTORS (if applicable)</div><h2>Phase 3 — Upgrading a Storage Server in Detail</h2><h3>Step a: Maintenance mode</h3><pre># For EACH RING in the cluster\nfor RING in $(ringsh supervisor ringList | grep -v "^$"); do\n  echo "Maintenance mode for RING: $RING"\n  ringsh supervisor ringConfigSet ${RING} join_auto 0\n  ringsh supervisor ringConfigSet ${RING} rebuild_auto 0\n  ringsh supervisor ringConfigSet ${RING} chordpurge_enable 0\ndone</pre><h3>Step b: Check RING state</h3><pre>ringsh supervisor ringStatus &lt;RING&gt;\n# Must show: RUN or CONF_MISMATCH RUN\n# NEVER start if: INCOMPLETE, SPLIT LOOP, ARC_REBUILD_NOK</pre><h3>Step c: nodeLeave</h3><pre># Remove all nodes of the server from the RING\nfor NODE in $(ringsh supervisor nodeList &lt;RING&gt; | grep storage_server_name); do\n  ringsh supervisor nodeLeave ${NODE}:/\ndone\n# Wait until all nodes are in OUT_OF_SERVICE state\nwatch -n5 "ringsh supervisor nodeList &lt;RING&gt;"</pre><h3>Steps d-e-f: Upgrade packages</h3><pre># On the storage server (via SSH)\nsystemctl stop scality-node\n\n# Unlock packages (if RING >= 8.3.0)\nyum versionlock delete python3-scaldisk scality-node\n\n# Update Scality packages\nyum update --disableplugin=versionlock \\*scality\\*\nyum clean all\n\nsystemctl start scality-node</pre><h3>Step g: nodeJoin and validation</h3><pre># Rejoin the RING\nfor NODE in $(ringsh supervisor nodeList &lt;RING&gt; | grep storage_server_name); do\n  ringsh supervisor nodeJoin ${NODE}:/\ndone\n\n# Wait for RUN state\nwatch -n5 "ringsh supervisor ringStatus &lt;RING&gt;"\n# DO NOT move to the next server before getting RUN</pre><h3>Step h: Apply logging configuration</h3><pre>salt-call state.apply scality.node.log\nsalt-call state.apply scality.sagentd.registered</pre><h3>Step 17: Exit maintenance mode (AFTER all servers)</h3><pre>for RING in $(ringsh supervisor ringList | grep -v "^$"); do\n  ringsh supervisor ringConfigSet ${RING} join_auto 2\n  ringsh supervisor ringConfigSet ${RING} rebuild_auto 1\n  ringsh supervisor ringConfigSet ${RING} chordpurge_enable 1\ndone</pre><h2>Phase 4 — Upgrading SOFS Connectors</h2><p>SOFS connectors are upgraded <strong>last</strong>, after all storage nodes. Important rules:</p><ul><li>SOFS connectors can generally be upgraded one by one (continuous service if multiple connectors per volume)</li><li><strong>SOFS 9.1 -> 9.2+ exception</strong>: all connectors of the volume must be stopped before upgrading the first one (see compatibility matrix)</li><li>Before upgrading a connector: verify that sfused and membershipd are in a healthy state</li><li>After upgrade: verify that the volume is mounted and accessible</li></ul><pre># Pre-check SOFS connector before upgrade\nsystemctl status scality-sfused\nsystemctl status scality-membershipd\ndf -h /sofs/volume1  # verify the mount</pre><div class="kbox"><h3>Key Points to Remember</h3><ul><li>RING 7 -> RING 9 FORBIDDEN directly: must go through RING 8</li><li>Scality Support ticket MANDATORY before starting</li><li>Tmux/Screen MANDATORY: an SSH disconnection during an upgrade is catastrophic</li><li>Strict order: Supervisor -> Storage Servers (ONE BY ONE) -> SOFS Connectors</li><li>Between each storage server: wait for RUN (CONF_MISMATCH accepted, INCOMPLETE forbidden)</li><li>CONF_MISMATCH after Supervisor upgrade = NORMAL, DO NOT click Apply Config</li><li>CRR pre-upgrade: mandatory if CRR active and upgrading from &lt; 9.5.2.0</li></ul></div>',
quiz_en:[
  {q:"In what order should RING components be upgraded?",opts:["Storage -> Supervisor -> Connectors","Connectors -> Storage -> Supervisor","Supervisor -> Storage -> Connectors","All in parallel"],ans:2,expl:"The correct order is Supervisor first (process manager), then Storage (storage nodes), then Connectors (access protocols). This order ensures services are operational before client access is restored."},
  {q:"What should be checked before launching a RING upgrade?",opts:["That all disks are full","Prerequisites: source/target version, ring health (nodeList), disk space, backups","That CRR is disabled","That all clients are disconnected"],ans:1,expl:"Before any upgrade: check version compatibility (supported upgrade path), ring health via nodeList, available disk space, and the presence of configuration backups."},
  {q:"What does LUKS stand for in the context of RING security?",opts:["Linux Unified Key Setup: disk encryption at rest","Linux Update Key System: update management","Layered Unix Key Storage: key vault","Local User Key Service: IAM service"],ans:0,expl:"LUKS (Linux Unified Key Setup) is the Linux disk encryption standard. Scality uses it for at-rest encryption of node disks, protecting data in case of physical theft."},
  {q:"Which protocol allows automatic decryption of LUKS disks at boot?",opts:["KMIP","NBDE with Tang server","SSL/TLS","AWS KMS"],ans:1,expl:"NBDE (Network-Bound Disk Encryption) with a Tang server allows automatic decryption at boot if the node can reach the Tang server. If the node is stolen and isolated, the disks remain encrypted."},
  {q:"What is KMIP in the Scality context?",opts:["Key Management Interoperability Protocol: standard protocol for key management systems","Kubernetes Monitoring Integration Platform","Key Metadata Index Protocol","Scality does not use KMIP"],ans:0,expl:"KMIP is a standard interoperability protocol for KMS. Scality supports KMIP to integrate external KMS systems (Thales, HashiCorp Vault, etc.) for encryption key management."},
  {q:"What is the impact of an upgrade on data availability SLAs?",opts:["Data is inaccessible during the entire upgrade","The upgrade is rolling: data remains accessible, only a subset of nodes is unavailable at a time","The upgrade requires a complete ring shutdown","The upgrade does not affect SLAs"],ans:1,expl:"The RING upgrade is designed as a rolling upgrade: nodes are upgraded one after another. The ring continues to serve requests with already-upgraded nodes, minimizing impact."},
  {q:"Why is it imperative to verify the ring is healthy (no OOS nodes) before starting an upgrade?",opts:["It is a simple cosmetic recommendation","Upgrading a node temporarily takes it out of service; if the ring already has OOS nodes, losing an additional node may push some objects below the reconstruction threshold","The upgrade automatically fails if a node is OOS","To respect the maintenance window"],ans:1,expl:"During a rolling upgrade, each node is restarted successively. If the ring is already degraded (OOS nodes), adding an additional OOS node may make some objects unrecoverable. A 100% healthy ring before upgrade is non-negotiable."},
  {q:"What is a supported upgrade path in the Scality version matrix?",opts:["Any version can upgrade to any other","A sequence of versions to pass through (e.g.: 9.4 -> 9.5 -> 9.5.2) without skipping steps, validated and tested by Scality","A network path optimized for upgrade","The version to which the upgrade is fastest"],ans:1,expl:"Scality qualifies specific upgrade paths. Skipping intermediate versions can cause data format or configuration incompatibilities that are not handled. The upgrade matrix in the release notes defines the allowed sequences."}
]},
{id:'12',num:'12',title:'S3 Connector — repd et Raft',desc:'Architecture interne S3 : repd, Raft sessions, bucketd, vault, alertes',
content:'<h2>Architecture Interne du S3 Connector</h2><p>Le S3 Connector Scality est une pile de <strong>services conteneurise (Docker)</strong> qui offre une API S3 compatible AWS. La plupart de ces services sont <strong>stateless</strong> (ils peuvent être redemarres ou scales indépendamment), a l\'exception du service de métadonnées stateful base sur <strong>Raft</strong>.</p><div class="adiag">+----------------------------------------------------------+\n|                   S3 CONNECTOR STACK                    |\n|                                                          |\n|  [S3 Frontend]  &lt;-- load balancer HTTP                  |\n|       |                                                  |\n|  [Cloudserver]  -- API S3 (stateless, scalable)          |\n|    /       \\                                             |\n| [Vault]   [S3 Metadata]                                  |\n| (IAM)     (buckets/objets)                               |\n|    |            |                                        |\n| [repd-vault] [repd]  -- services STATEFUL (Raft)         |\n|                |                                         |\n|        [RING DATA via sproxyd]                           |\n+----------------------------------------------------------+\n\nServices ancillaires :\n  Backbeat (CRR/Lifecycle) . Redis-Sentinel . Prometheus\n  Zookeeper . UTAPI (facturation)</div><h2>Les Services du S3 Connector</h2><table><tr><th>Service</th><th>Stateful ?</th><th>Rôle</th></tr><tr><td><strong>S3 Frontend</strong></td><td>Non</td><td>Load balancer HTTP devant Cloudserver. Termine le TLS.</td></tr><tr><td><strong>Cloudserver</strong></td><td>Non</td><td>Implémente l\'API S3 AWS. Traduit les requêtes S3 en appels Vault (IAM) + S3 Metadata + RING sproxyd.</td></tr><tr><td><strong>Vault</strong></td><td>Non</td><td>Service IAM : authentifié les requêtes S3 (access key / secret key), gère les comptes, users, groupes, policies.</td></tr><tr><td><strong>bucketd</strong></td><td>Non</td><td>Service de gestion des buckets. Interface entre Cloudserver et le service de métadonnées.</td></tr><tr><td><strong>repd</strong></td><td><strong>Oui (Raft)</strong></td><td>Service de métadonnées S3 : stocké de façon durable et consistante les métadonnées de buckets et d\'objets.</td></tr><tr><td><strong>repd-vault</strong></td><td><strong>Oui (Raft)</strong></td><td>Service de métadonnées IAM : stocké les comptes, users, groupes, policies de façon durable.</td></tr><tr><td><strong>Redis-Sentinel</strong></td><td>Partiel</td><td>Cache distribué pour les métadonnées chaudes. Accelere les lookups. Sentinel assuré la HA de Redis.</td></tr><tr><td><strong>Backbeat</strong></td><td>Partiel</td><td>Workflows asynchrones : CRR (réplication inter-clusters), Lifecycle (expiration objets), Ingestion.</td></tr><tr><td><strong>Prometheus</strong></td><td>Oui</td><td>Collecte les metriques de tous les services S3. Alimente Grafana.</td></tr><tr><td><strong>ZooKeeper</strong></td><td>Oui</td><td>Coordination distribuée pour Backbeat et certains services S3.</td></tr><tr><td><strong>UTAPI</strong></td><td>Non</td><td>Utilization API : mesure et expose la consommation par compte/bucket pour la facturation.</td></tr></table><h2>repd — Le Service de Métadonnées Stateful</h2><p><code>repd</code> (Réplication Daemon) est <strong>le coeur stateful du S3 Connector</strong>. C\'est lui qui assuré la persistance et la cohérence forte des métadonnées S3. Il est critique car :</p><ul><li>Chaque PUT S3 écrit des métadonnées dans repd (clé, taille, ETag, ACL, tags, version...)</li><li>Chaque GET S3 lit les métadonnées depuis repd pour localiser l\'objet dans le RING</li><li>Chaque LIST S3 parcourt les métadonnées dans repd pour retourner la liste des objets d\'un bucket</li></ul><h3>Backend de stockage de repd : LevelDB</h3><p>repd expose une API de métadonnées. En interne, les données sont persistées dans un moteur de stockage embarque. Le backend utilisé par défaut est <strong>LevelDB</strong>, développé par Google :</p><ul><li><strong>LevelDB</strong> : base cle-valeur embarquée (pas de serveur séparé), stockage sur disque en "sorted string tables" (SST files). Très performante pour les écritures sequentielles et les lectures d\'objets individuels. Chaque session Raft (chaque nœud repd) maintient son propre fichier LevelDB local — Raft garantit que tous les nœuds voient les mêmes données.</li><li><strong>MongoDB</strong> : backend alternatif supporte pour les très grands volumes de métadonnées (millions de buckets/objets). Externe a repd, nécessite son propre cluster.</li></ul><p class="alert-i"><strong>Note sur RocksDB :</strong> RocksDB (fork de LevelDB par Facebook, plus performant) n\'est <strong>pas mentionne dans la documentation officielle Scality RING 9.5</strong>. Ne pas confondre : c\'est LevelDB qui est le backend embarque de repd dans la version actuelle.</p><h2>Raft Sessions — Le Protocole de Consensus</h2><p>Raft est un algorithme de consensus distribué crée pour être <strong>comprehensible et correct</strong>. Il est utilisé par repd pour garantir que toutes les instances du service de métadonnées voient les mêmes données dans le même ordre.</p><h3>Composants d\'une Raft Session</h3><div class="adiag">Raft Session "s3-metadata-0" (5 nœuds) :\n\nEtat initial (tout va bien) :\n  [Node1: LEADER] -- répond aux écritures, réplique vers followers\n  [Node2: follower] -- réplique depuis le leader\n  [Node3: follower] -- réplique depuis le leader\n  [Node4: follower] -- réplique depuis le leader\n  [Node5: follower] -- réplique depuis le leader\n\n  Quorum écriture = 3/5 nœuds (majorite simple)\n  Quorum lecture = 1 nœud (n\'importe lequel)\n\nSi Node1 (leader) tombe :\n  [Node1: DOWN]\n  [Node2: CANDIDATE] -- déclenche une election\n  [Node3: follower]  -- vote pour Node2\n  [Node4: follower]  -- vote pour Node2\n  [Node5: follower]  -- vote pour Node2\n  -> Node2 elu nouveau LEADER en quelques secondes\n  -> Quorum = 3/4 = OK, écritures reprennent</div><h3>Les 3 états d\'un nœud Raft</h3><table><tr><th>État</th><th>Description</th><th>Quand</th></tr><tr><td><strong>Leader</strong></td><td>Nœud qui gère toutes les écritures. Il envoie les "heartbeats" aux followers pour signaler qu\'il est vivant. Il réplique chaque écriture vers les followers avant de confirmer au client.</td><td>Elu par vote majoritaire. 1 seul leader par session a tout moment.</td></tr><tr><td><strong>Follower</strong></td><td>Nœud passif qui répond aux requêtes du leader (réplication). Peut servir les lectures selon la configuration. Si il ne reçoit plus de heartbeat, il devient Candidate.</td><td>État par défaut de tous les nœuds sauf le leader.</td></tr><tr><td><strong>Candidate</strong></td><td>Nœud qui a déclaré son intention d\'être leader et demande des votes. Si il obtient la majorite, il devient Leader.</td><td>Quand un follower timeout sans heartbeat du leader.</td></tr></table><h3>Numeros de sequence Raft (metriques clés)</h3><p>Chaque entrée du log Raft est numérotée sequentiellement. Ces numéros permettent de détecter les desynchronisations :</p><ul><li><code>raft_aseq</code> : "applied sequence" — dernier index applique a la base de données locale</li><li><code>raft_cseq</code> : "commit sequence" — dernier index valide par le quorum (commite)</li><li><code>raft_bseq</code> : "base sequence" — premier index encore en mémoire (avant compaction)</li><li><code>raft_term</code> : numéro du "mandat" du leader actuel (incremente a chaque election)</li></ul><p>Une alerte <code>S3RaftFollowerDesynchCritical</code> se déclenche si : <code>max(cseq) - min(cseq) &gt; 10000</code> — un follower est a plus de 10000 opérations de retard par rapport au leader.</p><h2>Diagnostiquer une Raft Session en Problème</h2><h3>Vérifier l\'état de la session</h3><pre># Depuis le Supervisor ou un nœud du cluster S3\n# Les metriques Raft sont exposées par Prometheus\n# Interroger Prometheus directement :\ncurl -s http://prometheus:9090/api/v1/query \\\n  \'?query=s3_metadata_stateful_raft_is_leader\' | python3 -m json.tool\n\n# Résultat : 1 = leader, 0 = follower/candidate\n# Vérifier qu\'il y a exactement 1 leader par session</pre><h3>Scénarios d\'incidents Raft</h3><table><tr><th>Scenario</th><th>Alerte</th><th>Impact</th><th>Résolution</th></tr><tr><td>Leader tombe</td><td>S3RaftNoLeaderCritical (après 5 min)</td><td>Écritures S3 bloquées temporairement</td><td>L\'election automatique resout en quelques secondes. Si bloqué : redémarrer les nœuds repd un par un.</td></tr><tr><td>2 nœuds DOWN sur 5</td><td>S3RaftNotEnoughFollowersWarning</td><td>Quorum maintenu (3/5) mais fragile</td><td>Redémarrer ou remplacer les nœuds DOWN rapidement.</td></tr><tr><td>3 nœuds DOWN sur 5</td><td>S3RaftNotEnoughFollowersCritical</td><td>Quorum perdu : écritures BLOQUEES</td><td>Urgence : restaurer au moins 1 nœud DOWN pour retrouver 3/5 nœuds actifs.</td></tr><tr><td>Elections répétées</td><td>S3RaftElectionWarning</td><td>Instabilité : performances dégradées, risque de perte de leader</td><td>Investiguer la latence réseau et la charge CPU des nœuds repd.</td></tr><tr><td>Follower en retard</td><td>S3RaftFollowerDesynchCritical</td><td>Le follower a un état ancien (peut servir des lectures périmées)</td><td>Vérifier les I/O et la bande passante. Redémarrer le follower en retard.</td></tr></table><h2>bucketd — Gestionnaire de Buckets</h2><p><code>bucketd</code> est le service intermédiaire entre Cloudserver et repd. Il ne stocké pas lui-même des données : il <strong>orchestre les opérations sur les buckets</strong> en dialoguant avec repd.</p><h3>Flux d\'une requête ListObjects</h3><div class="adiag">Client S3 : GET /?list-type=2\n       |\n       v\n  [S3 Frontend]  (load balancer)\n       |\n       v\n  [Cloudserver]  -- reçoit la requête, authentifié via Vault\n       |\n       v\n   [bucketd]     -- traduit la requête en scan d\'index de métadonnées\n       |\n       v\n   [repd]        -- parcourt le LevelDB local (Raft leader)\n                     retourne la liste paginée\n       |\n       v\n  [Cloudserver]  -- formate la réponse XML S3\n       |\n       v\n   Client S3 : réponse XML avec la liste des objets</div><h3>Opérations gérées par bucketd</h3><table><tr><th>Opération S3</th><th>Rôle de bucketd</th></tr><tr><td>CreateBucket</td><td>Crée l\'entrée de bucket dans repd (namespace, versioning, ACL)</td></tr><tr><td>DeleteBucket</td><td>Vérifié que le bucket est vide puis supprimé l\'entrée dans repd</td></tr><tr><td>ListObjects / ListObjectsV2</td><td>Scan pagine de l\'index de métadonnées dans repd</td></tr><tr><td>GetBucketVersioning</td><td>Lit la configuration de versioning du bucket dans repd</td></tr><tr><td>PutBucketAcl / Policy</td><td>Écrit les ACL/policies du bucket dans repd</td></tr></table><p class="alert-d"><strong>S3BucketdDownCritical</strong> : si bucketd est DOWN, toutes les opérations sur les buckets sont bloquées (CreateBucket, DeleteBucket, ListObjects) même si Cloudserver est UP. Les GET/PUT d\'objets individuels existants peuvent continuer si Cloudserver peut contourner bucketd pour les métadonnées d\'objet simples.</p><h2>Redis-Sentinel — Cache Distribué Haute Disponibilité</h2><p>XDM utilisé <strong>Redis-Sentinel</strong> pour fournir une base de données en mémoire hautement disponible. Comme le decrit la documentation Scality : <em>"Redis-Sentinel is useful for short-term database needs, such as for a quick or temporary job, or for sharing as a shared database between two or more services."</em></p><h3>Services utilisant Redis-Sentinel</h3><table><tr><th>Service</th><th>Usage de Redis</th></tr><tr><td><strong>Backbeat (CRR)</strong></td><td>Stocké l\'état de pause/resume de la réplication inter-clusters. Redis conserve la file des objets en attente de réplication et les flags pause/retry.</td></tr><tr><td><strong>Cloudserver</strong></td><td>Cache de sessions et de métadonnées chaudes. Reduit la pression sur repd pour les objets fréquemment accedes.</td></tr><tr><td><strong>Backbeat API</strong></td><td>Base partagée pour les jobs Backbeat (lifecycle, ingestion). Coordonne les workers Backbeat.</td></tr></table><h3>Architecture Redis-Sentinel</h3><div class="adiag">Redis-Sentinel sur 3 nœuds (exemple) :\n\n  [Sentinel-1]  [Sentinel-2]  [Sentinel-3]\n       |              |              |\n       +----[Redis Master]----+\n       |                     |\n  [Redis Replica-1]   [Redis Replica-2]\n\nRole des sentinels :\n  - Surveille la sante du master en permanence\n  - Si master tombe : vote a la majorite pour promouvoir un replica\n  - Notifie les clients du nouveau master\n\nRisque : Redis est IN-MEMORY. Un restart = perte des données non flushées.\nUsage dans RING = données TEMPORAIRES uniquement (jobs, cache, flags CRR).</div><p class="alert-w"><strong>Important :</strong> Redis-Sentinel garantit la HA mais <strong>pas</strong> la durabilité. Les données Redis ne sont pas persistées de façon fiable. Pour les métadonnées S3 durables, c\'est repd (LevelDB + Raft) qui est utilisé, pas Redis.</p><h2>Vault — Service IAM</h2><p><code>vault</code> est le service d\'<strong>Identity and Access Management (IAM)</strong> du S3 Connector. Il gère :</p><ul><li><strong>Comptes S3</strong> : création, suppression, listing</li><li><strong>Utilisateurs IAM</strong> : clés d\'accès (AccessKey/SecretKey), permissions</li><li><strong>Groupes et Rôles</strong> : politiques d\'accès multi-utilisateurs</li><li><strong>Policies</strong> : politiques JSON compatibles AWS IAM (Allow/Deny)</li></ul><p>Vault s\'appuie sur <code>repd-vault</code> pour stocker ses données de façon durable via Raft. L\'alerte <code>S3VaultDownCritical</code> bloqué toute authentification S3 : aucune requête ne peut être validée.</p><div class="kbox"><h3>Points Clés a Retenir</h3><ul><li>repd = daemon de métadonnées S3 STATEFUL (Raft) : clé pour chaque PUT/GET/LIST</li><li>repd-vault = même principe pour les métadonnées IAM (comptes, users, policies)</li><li>Raft session = Leader (1) + Followers (N) : quorum = N/2+1 nœuds</li><li>S3RaftNoLeaderCritical = écritures S3 bloquées, election auto en quelques secondes</li><li>S3RaftNotEnoughFollowersCritical = quorum perdu (>N/2 nœuds DOWN) = écritures BLOQUEES</li><li>bucketd = orchestre les opérations sur les buckets (ListObjects, CreateBucket...)</li><li>Vault = IAM/authentification (clés d\'accès, policies)</li><li>raft_term = numéro du mandat du leader (incremente a chaque election)</li><li>LevelDB = backend embarque de repd (par défaut) — NOT RocksDB ni MongoDB</li><li>Redis-Sentinel = cache IN-MEMORY pour CRR pause/retry, Cloudserver, Backbeat API — pas de durabilité forte</li></ul></div>',
quiz:[
  {q:"Quel est le rôle de repd dans l'architecture S3 Scality ?",opts:["Expose l'API S3 aux clients","Daemon de gestion locale des objets, versioning (bseq) et cohérence avec LevelDB","Gère les groupes Raft","Authentifie les requêtes S3"],ans:1,expl:"repd (Réplication Daemon) tourne sur chaque nœud META et DATA. Il gère le stockage local des objets, leur versioning via bseq, et maintient la cohérence avec LevelDB."},
  {q:"Qu'est-ce que bseq ?",opts:["Numéro de bucket séquentiel","Numéro de séquence de blob, identifiant unique d'une version d'objet sur disque","Taille du buffer d'écriture","Type de COS binaire"],ans:1,expl:"bseq (blob sequence number) est l'identifiant de version d'un objet sur disque. Chaque mise à jour incrémente le bseq. repd utilisé ce numéro pour le versioning et la cohérence."},
  {q:"Combien de nœuds minimaux pour un groupe Raft fonctionnel ?",opts:["1","2","3","5"],ans:2,expl:"Un groupe Raft nécessite au minimum 3 nœuds pour avoir un quorum. Avec 3 nœuds, le quorum est 2 (floor(3/2)+1). Un seul nœud peut être perdu sans perte du service."},
  {q:"Que gère Vault dans l'architecture S3 Scality ?",opts:["Le stockage des objets","Service IAM : comptes, utilisateurs, rôles, politiques S3 et clés KMS","Les métriques d'utilisation","La réplication CRR"],ans:1,expl:"Vault est le service IAM (Identity and Access Management) de Scality. Il gère les comptes, utilisateurs S3, credentials, rôles et politiques d'accès, équivalent à AWS IAM."},
  {q:"Quel service stocké les métadonnées des buckets S3 (liste objets, ACL, versioning) ?",opts:["repd","MESA","bucketd","Vault"],ans:2,expl:"bucketd est le service dédié aux métadonnées des buckets S3 : liste des objets, ACL, versioning, tags par objet. Il utilisé LevelDB localement et est indépendant de MESA."},
  {q:"Que se passe-t-il quand le leader d'un groupe Raft repd devient OOS ?",opts:["Toutes les écritures sont perdues","Les followers élissent automatiquement un nouveau leader après timeout","Les clients reçoivent une erreur 503 permanente","Un opérateur doit relancer repd manuellement"],ans:1,expl:"Raft prévoit l'élection automatique d'un nouveau leader. Les followers détectent l'absence du leader via timeout et lancent une élection. Le service reprend sans intervention."},
  {q:"Dans quel cas une alarme repd Raft apparaît-elle ?",opts:["Quand un bucket est plein","Quand un groupe Raft n'a plus de quorum (trop de nœuds OOS)","Quand un objet est INCOMPLETE","Quand CRR est en pause"],ans:1,expl:"Une alarme repd Raft se déclenche quand un groupe Raft perd son quorum (trop de nœuds OOS). Sans quorum, le groupe ne peut plus élire de leader et les écritures sont bloquées."},
  {q:"Quel est le rôle de cseq vs bseq ?",opts:["Ce sont des synonymes","cseq est la version logique de l'objet dans le ring (incrémenté à chaque update), bseq est la version physique sur disque","cseq est pour les objets CRR, bseq pour les objets locaux","cseq est le checksum, bseq est le numéro de séquence"],ans:1,expl:"cseq (chunk sequence) identifié la version logique d'un objet dans le ring Chord. bseq (blob sequence) est la version physique sur un disque spécifique. Les deux sont utilisés pour la cohérence et le versioning."},
  {q:"Quelle est la fonction principale de membershipd ?",opts:["Gérer les memberships des buckets S3","Maintenir la vue cohérente des membres actifs du cluster et orchestrer les changements de topologie","Monitorer la santé des disques","Gérer l'authentification des nœuds"],ans:1,expl:"membershipd est le daemon de gestion de l'appartenance au ring. Il maintient la liste des nœuds actifs et coordonne les opérations nodeJoin/nodeLeave via un protocole de consensus."},
  {q:"Si Vault est indisponible, quelles opérations S3 continuent de fonctionner ?",opts:["Toutes les opérations fonctionnent sans Vault","Aucune opération S3 n'est possible car toute requête nécessite une vérification IAM","Les opérations sur les buckets publics peuvent fonctionner mais les requêtes authentifiées échouent","Seules les lectures fonctionnent"],ans:1,expl:"Vault est le point d'authentification et d'autorisation centralisé. Sans Vault, Cloudserver ne peut pas vérifier les credentials S3 (access key / secret key) ni valider les politiques IAM. Toutes les requêtes authentifiées échouent avec une erreur d'authentification."}

title_en:'S3 Connector — repd and Raft',
desc_en:'S3 internal architecture: repd, Raft sessions, bucketd, vault, alerts',
content_en:'<h2>Internal Architecture of the S3 Connector</h2><p>The Scality S3 Connector is a stack of <strong>containerized services (Docker)</strong> that provides an AWS-compatible S3 API. Most of these services are <strong>stateless</strong> (they can be restarted or scaled independently), except for the stateful metadata service based on <strong>Raft</strong>.</p><div class="adiag">+----------------------------------------------------------+\n|                   S3 CONNECTOR STACK                    |\n|                                                          |\n|  [S3 Frontend]  <-- HTTP load balancer                  |\n|       |                                                  |\n|  [Cloudserver]  -- S3 API (stateless, scalable)          |\n|    /       \\                                             |\n| [Vault]   [S3 Metadata]                                  |\n| (IAM)     (buckets/objects)                              |\n|    |            |                                        |\n| [repd-vault] [repd]  -- STATEFUL services (Raft)         |\n|                |                                         |\n|        [RING DATA via sproxyd]                           |\n+----------------------------------------------------------+\n\nAncillary services:\n  Backbeat (CRR/Lifecycle) . Redis-Sentinel . Prometheus\n  ZooKeeper . UTAPI (billing)</div><h2>S3 Connector Services</h2><table><tr><th>Service</th><th>Stateful?</th><th>Role</th></tr><tr><td><strong>S3 Frontend</strong></td><td>No</td><td>HTTP load balancer in front of Cloudserver. Terminates TLS.</td></tr><tr><td><strong>Cloudserver</strong></td><td>No</td><td>Implements the AWS S3 API. Translates S3 requests into Vault (IAM) + S3 Metadata + RING sproxyd calls.</td></tr><tr><td><strong>Vault</strong></td><td>No</td><td>IAM service: authenticates S3 requests (access key / secret key), manages accounts, users, groups, policies.</td></tr><tr><td><strong>bucketd</strong></td><td>No</td><td>Bucket management service. Interface between Cloudserver and the metadata service.</td></tr><tr><td><strong>repd</strong></td><td><strong>Yes (Raft)</strong></td><td>S3 metadata service: durably and consistently stores bucket and object metadata.</td></tr><tr><td><strong>repd-vault</strong></td><td><strong>Yes (Raft)</strong></td><td>IAM metadata service: durably stores accounts, users, groups, and policies.</td></tr><tr><td><strong>Redis-Sentinel</strong></td><td>Partial</td><td>Distributed cache for hot metadata. Speeds up lookups. Sentinel ensures Redis HA.</td></tr><tr><td><strong>Backbeat</strong></td><td>Partial</td><td>Asynchronous workflows: CRR (inter-cluster replication), Lifecycle (object expiration), Ingestion.</td></tr><tr><td><strong>Prometheus</strong></td><td>Yes</td><td>Collects metrics from all S3 services. Feeds Grafana.</td></tr><tr><td><strong>ZooKeeper</strong></td><td>Yes</td><td>Distributed coordination for Backbeat and certain S3 services.</td></tr><tr><td><strong>UTAPI</strong></td><td>No</td><td>Utilization API: measures and exposes consumption by account/bucket for billing.</td></tr></table><h2>repd — The Stateful Metadata Service</h2><p><code>repd</code> (Replication Daemon) is <strong>the stateful core of the S3 Connector</strong>. It ensures the persistence and strong consistency of S3 metadata. It is critical because:</p><ul><li>Every S3 PUT writes metadata into repd (key, size, ETag, ACL, tags, version...)</li><li>Every S3 GET reads metadata from repd to locate the object in the RING</li><li>Every S3 LIST traverses metadata in repd to return the list of objects in a bucket</li></ul><h3>repd storage backend: LevelDB</h3><p>repd exposes a metadata API. Internally, data is persisted in an embedded storage engine. The default backend is <strong>LevelDB</strong>, developed by Google:</p><ul><li><strong>LevelDB</strong>: embedded key-value store (no separate server), disk storage in "sorted string tables" (SST files). Very performant for sequential writes and individual object reads. Each Raft session (each repd node) maintains its own local LevelDB file — Raft guarantees that all nodes see the same data.</li><li><strong>MongoDB</strong>: alternative backend supported for very large metadata volumes (millions of buckets/objects). External to repd, requires its own cluster.</li></ul><p class="alert-i"><strong>Note on RocksDB:</strong> RocksDB (a Facebook fork of LevelDB, more performant) is <strong>not mentioned in the official Scality RING 9.5 documentation</strong>. Do not confuse: LevelDB is the embedded backend of repd in the current version.</p><h2>Raft Sessions — The Consensus Protocol</h2><p>Raft is a distributed consensus algorithm designed to be <strong>understandable and correct</strong>. It is used by repd to guarantee that all instances of the metadata service see the same data in the same order.</p><h3>Components of a Raft Session</h3><div class="adiag">Raft Session "s3-metadata-0" (5 nodes):\n\nInitial state (all good):\n  [Node1: LEADER] -- responds to writes, replicates to followers\n  [Node2: follower] -- replicates from leader\n  [Node3: follower] -- replicates from leader\n  [Node4: follower] -- replicates from leader\n  [Node5: follower] -- replicates from leader\n\n  Write quorum = 3/5 nodes (simple majority)\n  Read quorum = 1 node (any)\n\nIf Node1 (leader) goes down:\n  [Node1: DOWN]\n  [Node2: CANDIDATE] -- triggers an election\n  [Node3: follower]  -- votes for Node2\n  [Node4: follower]  -- votes for Node2\n  [Node5: follower]  -- votes for Node2\n  -> Node2 elected new LEADER within seconds\n  -> Quorum = 3/4 = OK, writes resume</div><h3>The 3 states of a Raft node</h3><table><tr><th>State</th><th>Description</th><th>When</th></tr><tr><td><strong>Leader</strong></td><td>Node that handles all writes. It sends "heartbeats" to followers to signal it is alive. It replicates each write to followers before confirming to the client.</td><td>Elected by majority vote. Only 1 leader per session at any time.</td></tr><tr><td><strong>Follower</strong></td><td>Passive node that responds to leader requests (replication). Can serve reads depending on configuration. If it no longer receives heartbeats, it becomes a Candidate.</td><td>Default state for all nodes except the leader.</td></tr><tr><td><strong>Candidate</strong></td><td>Node that has declared its intention to be leader and is requesting votes. If it obtains the majority, it becomes Leader.</td><td>When a follower times out without a heartbeat from the leader.</td></tr></table><h3>Raft sequence numbers (key metrics)</h3><p>Each entry in the Raft log is numbered sequentially. These numbers allow detecting desynchronizations:</p><ul><li><code>raft_aseq</code>: "applied sequence" — last index applied to the local database</li><li><code>raft_cseq</code>: "commit sequence" — last index validated by the quorum (committed)</li><li><code>raft_bseq</code>: "base sequence" — first index still in memory (before compaction)</li><li><code>raft_term</code>: current leader\'s "term" number (incremented at each election)</li></ul><p>An <code>S3RaftFollowerDesynchCritical</code> alert fires if: <code>max(cseq) - min(cseq) &gt; 10000</code> — a follower is more than 10,000 operations behind the leader.</p><h2>Diagnosing a Problematic Raft Session</h2><h3>Check the session state</h3><pre># From the Supervisor or an S3 cluster node\n# Raft metrics are exposed by Prometheus\n# Query Prometheus directly:\ncurl -s http://prometheus:9090/api/v1/query \\\n  \'?query=s3_metadata_stateful_raft_is_leader\' | python3 -m json.tool\n\n# Result: 1 = leader, 0 = follower/candidate\n# Verify there is exactly 1 leader per session</pre><h3>Raft incident scenarios</h3><table><tr><th>Scenario</th><th>Alert</th><th>Impact</th><th>Resolution</th></tr><tr><td>Leader goes down</td><td>S3RaftNoLeaderCritical (after 5 min)</td><td>S3 writes temporarily blocked</td><td>Automatic election resolves in seconds. If stuck: restart repd nodes one by one.</td></tr><tr><td>2 nodes DOWN out of 5</td><td>S3RaftNotEnoughFollowersWarning</td><td>Quorum maintained (3/5) but fragile</td><td>Restart or replace DOWN nodes quickly.</td></tr><tr><td>3 nodes DOWN out of 5</td><td>S3RaftNotEnoughFollowersCritical</td><td>Quorum lost: writes BLOCKED</td><td>Emergency: restore at least 1 DOWN node to get back to 3/5 active nodes.</td></tr><tr><td>Repeated elections</td><td>S3RaftElectionWarning</td><td>Instability: degraded performance, risk of leader loss</td><td>Investigate network latency and CPU load of repd nodes.</td></tr><tr><td>Lagging follower</td><td>S3RaftFollowerDesynchCritical</td><td>The follower has stale state (may serve outdated reads)</td><td>Check I/O and bandwidth. Restart the lagging follower.</td></tr></table><h2>bucketd — Bucket Manager</h2><p><code>bucketd</code> is the intermediary service between Cloudserver and repd. It does not store data itself: it <strong>orchestrates operations on buckets</strong> by communicating with repd.</p><h3>Flow of a ListObjects request</h3><div class="adiag">S3 Client: GET /?list-type=2\n       |\n       v\n  [S3 Frontend]  (load balancer)\n       |\n       v\n  [Cloudserver]  -- receives the request, authenticates via Vault\n       |\n       v\n   [bucketd]     -- translates the request into a metadata index scan\n       |\n       v\n   [repd]        -- scans the local LevelDB (Raft leader)\n                     returns the paginated list\n       |\n       v\n  [Cloudserver]  -- formats the S3 XML response\n       |\n       v\n   S3 Client: XML response with list of objects</div><h3>Operations managed by bucketd</h3><table><tr><th>S3 Operation</th><th>bucketd role</th></tr><tr><td>CreateBucket</td><td>Creates the bucket entry in repd (namespace, versioning, ACL)</td></tr><tr><td>DeleteBucket</td><td>Verifies the bucket is empty then deletes the entry in repd</td></tr><tr><td>ListObjects / ListObjectsV2</td><td>Paginated scan of the metadata index in repd</td></tr><tr><td>GetBucketVersioning</td><td>Reads the bucket versioning configuration from repd</td></tr><tr><td>PutBucketAcl / Policy</td><td>Writes bucket ACLs/policies to repd</td></tr></table><p class="alert-d"><strong>S3BucketdDownCritical</strong>: if bucketd is DOWN, all bucket operations are blocked (CreateBucket, DeleteBucket, ListObjects) even if Cloudserver is UP. Individual existing object GET/PUT operations may continue if Cloudserver can bypass bucketd for simple object metadata.</p><h2>Redis-Sentinel — High Availability Distributed Cache</h2><p>XDM uses <strong>Redis-Sentinel</strong> to provide a highly available in-memory database. As described in the Scality documentation: <em>"Redis-Sentinel is useful for short-term database needs, such as for a quick or temporary job, or for sharing as a shared database between two or more services."</em></p><h3>Services using Redis-Sentinel</h3><table><tr><th>Service</th><th>Redis usage</th></tr><tr><td><strong>Backbeat (CRR)</strong></td><td>Stores the pause/resume state of inter-cluster replication. Redis keeps the queue of objects awaiting replication and pause/retry flags.</td></tr><tr><td><strong>Cloudserver</strong></td><td>Session cache and hot metadata. Reduces pressure on repd for frequently accessed objects.</td></tr><tr><td><strong>Backbeat API</strong></td><td>Shared database for Backbeat jobs (lifecycle, ingestion). Coordinates Backbeat workers.</td></tr></table><h3>Redis-Sentinel architecture</h3><div class="adiag">Redis-Sentinel on 3 nodes (example):\n\n  [Sentinel-1]  [Sentinel-2]  [Sentinel-3]\n       |              |              |\n       +----[Redis Master]----+\n       |                     |\n  [Redis Replica-1]   [Redis Replica-2]\n\nRole of sentinels:\n  - Monitors master health continuously\n  - If master goes down: majority vote to promote a replica\n  - Notifies clients of the new master\n\nRisk: Redis is IN-MEMORY. A restart = loss of non-flushed data.\nUsage in RING = TEMPORARY data only (jobs, cache, CRR flags).</div><p class="alert-w"><strong>Important:</strong> Redis-Sentinel guarantees HA but <strong>not</strong> durability. Redis data is not reliably persisted. For durable S3 metadata, repd (LevelDB + Raft) is used, not Redis.</p><h2>Vault — IAM Service</h2><p><code>vault</code> is the <strong>Identity and Access Management (IAM)</strong> service of the S3 Connector. It manages:</p><ul><li><strong>S3 accounts</strong>: creation, deletion, listing</li><li><strong>IAM users</strong>: access keys (AccessKey/SecretKey), permissions</li><li><strong>Groups and Roles</strong>: multi-user access policies</li><li><strong>Policies</strong>: AWS IAM-compatible JSON policies (Allow/Deny)</li></ul><p>Vault relies on <code>repd-vault</code> to durably store its data via Raft. The <code>S3VaultDownCritical</code> alert blocks all S3 authentication: no request can be validated.</p><div class="kbox"><h3>Key Points to Remember</h3><ul><li>repd = STATEFUL S3 metadata daemon (Raft): key for every PUT/GET/LIST</li><li>repd-vault = same principle for IAM metadata (accounts, users, policies)</li><li>Raft session = Leader (1) + Followers (N): quorum = N/2+1 nodes</li><li>S3RaftNoLeaderCritical = S3 writes blocked, automatic election in seconds</li><li>S3RaftNotEnoughFollowersCritical = quorum lost (>N/2 nodes DOWN) = writes BLOCKED</li><li>bucketd = orchestrates bucket operations (ListObjects, CreateBucket...)</li><li>Vault = IAM/authentication (access keys, policies)</li><li>raft_term = leader\'s term number (incremented at each election)</li><li>LevelDB = embedded backend of repd (default) — NOT RocksDB or MongoDB</li><li>Redis-Sentinel = IN-MEMORY cache for CRR pause/retry, Cloudserver, Backbeat API — no strong durability</li></ul></div>',
quiz_en:[
  {q:"What is the role of repd in the Scality S3 architecture?",opts:["Exposes the S3 API to clients","Local object management daemon, versioning (bseq) and consistency with LevelDB","Manages Raft groups","Authenticates S3 requests"],ans:1,expl:"repd (Replication Daemon) runs on each META and DATA node. It manages local object storage, their versioning via bseq, and maintains consistency with LevelDB."},
  {q:"What is bseq?",opts:["Sequential bucket number","Blob sequence number, unique identifier of an object version on disk","Write buffer size","Binary COS type"],ans:1,expl:"bseq (blob sequence number) is the version identifier of an object on disk. Each update increments the bseq. repd uses this number for versioning and consistency."},
  {q:"How many minimum nodes are needed for a functional Raft group?",opts:["1","2","3","5"],ans:2,expl:"A Raft group requires a minimum of 3 nodes to have a quorum. With 3 nodes, quorum is 2 (floor(3/2)+1). A single node can be lost without service loss."},
  {q:"What does Vault manage in the Scality S3 architecture?",opts:["Object storage","IAM service: accounts, users, roles, S3 policies and KMS keys","Usage metrics","CRR replication"],ans:1,expl:"Vault is the IAM (Identity and Access Management) service of Scality. It manages S3 accounts, users, credentials, roles, and access policies, equivalent to AWS IAM."},
  {q:"Which service stores S3 bucket metadata (object list, ACL, versioning)?",opts:["repd","MESA","bucketd","Vault"],ans:2,expl:"bucketd is the dedicated service for S3 bucket metadata: object list, ACL, versioning, per-object tags. It uses LevelDB locally and is independent of MESA."},
  {q:"What happens when the leader of a repd Raft group goes OOS?",opts:["All writes are lost","Followers automatically elect a new leader after timeout","Clients receive a permanent 503 error","An operator must manually restart repd"],ans:1,expl:"Raft provides for automatic election of a new leader. Followers detect the absence of the leader via timeout and launch an election. Service resumes without intervention."},
  {q:"In what case does a repd Raft alarm appear?",opts:["When a bucket is full","When a Raft group loses quorum (too many OOS nodes)","When an object is INCOMPLETE","When CRR is paused"],ans:1,expl:"A repd Raft alarm fires when a Raft group loses its quorum (too many OOS nodes). Without quorum, the group can no longer elect a leader and writes are blocked."},
  {q:"What is the role of cseq vs bseq?",opts:["They are synonyms","cseq is the logical version of the object in the ring (incremented at each update), bseq is the physical version on disk","cseq is for CRR objects, bseq for local objects","cseq is the checksum, bseq is the sequence number"],ans:1,expl:"cseq (chunk sequence) identifies the logical version of an object in the Chord ring. bseq (blob sequence) is the physical version on a specific disk. Both are used for consistency and versioning."},
  {q:"What is the main function of membershipd?",opts:["Manage S3 bucket memberships","Maintain a consistent view of active cluster members and orchestrate topology changes","Monitor disk health","Manage node authentication"],ans:1,expl:"membershipd is the ring membership management daemon. It maintains the list of active nodes and coordinates nodeJoin/nodeLeave operations via a consensus protocol."},
  {q:"If Vault is unavailable, which S3 operations continue to work?",opts:["All operations work without Vault","No S3 operation is possible as every request requires IAM verification","Operations on public buckets may work but authenticated requests fail","Only reads work"],ans:1,expl:"Vault is the centralized authentication and authorization point. Without Vault, Cloudserver cannot verify S3 credentials (access key / secret key) nor validate IAM policies. All authenticated requests fail with an authentication error."}
]}
