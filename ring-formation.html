rt alert-w">When upgrading from a version less than 9.4.0 to 9.4.0+: the authentication system changes completely. Old accounts are not automatically migrated. Export the user list BEFORE the upgrade and manually recreate them in the new Identity interface. Use the SCALITY_SUPERVISOR_FQDN environment variable during SSO migration.</div><h3>SSO Migration (upgrade from less than 9.4.0)</h3><pre># Before the upgrade: record all existing users\n# After the Supervisor upgrade:\nexport SCALITY_SUPERVISOR_FQDN=supervisor.mydomain.com\n# Then recreate users via the Identity interface</pre><h2>Authentication Throttling — Fail2ban</h2><p>The Supervisor integrates <strong>Fail2ban</strong> to protect against brute-force attacks on the authentication interface. After N failed authentication attempts from the same IP, Fail2ban blocks that IP for a configurable duration. Configuration: Administration > Security > Authentication Throttling in the Supervisor. Parameters: attempt threshold (default: 5), block duration (default: 10 min), whitelist of exempt IPs. Blocked IPs are logged in /var/log/fail2ban.log on the Supervisor.</p><pre># Manually unblock an IP (if an admin locked themselves out)\nfail2ban-client set supervisor unbanip ip_address\n# View currently blocked IPs\nfail2ban-client status supervisor</pre><h2>HTTPS Communications and TLS Certificates</h2><p>All communications to and from the Supervisor are mandatorily encrypted with HTTPS/TLS. A self-signed certificate is generated at installation (replace with a CA certificate in production). The certificate is configurable in /etc/scality/supervisor/ssl/. Connectors communicate with the Supervisor via HTTPS (Salt agents). Default HTTPS port: 443.</p><h2>Shutdown and Startup Order — Absolute Rule</h2><p>The order of cluster shutdown and startup operations is non-negotiable. An incorrect order causes client-visible errors or avoidable service interruptions.</p><div class="adiag">SHUTDOWN (mandatory order):\n  1. CONNECTORS (S3, NFS, SMB, sproxyd, FUSE...)\n       Clients receive a clean unavailability signal\n       In-flight writes complete or are cleanly aborted\n  2. STORAGE SERVERS (systemctl stop scality-node)\n       Bizstorenode instances shut down cleanly\n       Buffered data is flushed to Biziod\n  3. SUPERVISOR\n       The orchestrator shuts down last\n\nSTARTUP (strictly reverse order):\n  1. SUPERVISOR\n       The orchestrator must be operational first\n  2. STORAGE SERVERS (systemctl start scality-node)\n       Nodes rejoin the RING (automatic nodeJoin if join_auto=2)\n  3. CONNECTORS\n       Client access is restored only when the RING is stable</div><div class="alert alert-d">If Storage Servers are stopped BEFORE Connectors: Connectors continue to receive client requests but can no longer access data — 5xx errors visible to applications. Always stop Connectors first.</div><h2>Network Security</h2><ul><li><strong>Storage network (backend)</strong>: dedicated network between Bizstorenode/Biziod instances, isolated from the client network for performance and security. Typically a dedicated 10 GbE or 25 GbE network.</li><li><strong>Management network</strong>: SSH access to the Supervisor and servers, isolated from the client network.</li><li><strong>Client network (frontend)</strong>: Connector connections to client applications.</li></ul><h2>Keycloak — SSO Identity Provider (since 9.4.0)</h2><p><strong>Keycloak</strong> is the SSO solution integrated into Scality RING since version 9.4.0. It centralizes authentication for all administration interfaces. Keycloak supports SAML 2.0 and OpenID Connect (OIDC) and can integrate with LDAP/Active Directory directories. Scality provides specific extensions (the scality/keycloak-extensions repository on GitHub).</p><table><tr><th>Interface</th><th>Before 9.4.0</th><th>Since 9.4.0</th></tr><tr><td>Supervisor GUI</td><td>Local authentication</td><td>SSO via Keycloak</td></tr><tr><td>Grafana</td><td>Local account</td><td>SSO via Keycloak</td></tr><tr><td>S3 Console</td><td>Vault IAM</td><td>SSO via Keycloak possible</td></tr></table><div class="alert alert-i"><strong>Keycloak and Vault have completely distinct roles:</strong> Keycloak = SSO for human administrators (Supervisor, Grafana access). Vault = IAM for S3 applications (access keys, secret keys, policies). If Keycloak goes down: admins cannot connect to the Supervisor via SSO, but S3 operations via access key/secret key continue through Vault unaffected. ringsh command-line access is also unaffected.</div><div class="alert alert-w">Always maintain an emergency local account on the Supervisor. In case of a Keycloak outage, this account provides a fallback access method.</div><div class="kbox"><h3>Key Takeaways</h3><ul><li>4 RBAC roles: RING Admin (everything), Identity Manager (users), Monitoring Manager (read+Grafana), RING Viewer (read-only)</li><li>SSO since 9.4.0: initial credentials admin/Default_passw0rd, change immediately</li><li>Upgrade from less than 9.4.0: export users BEFORE, recreate them in Identity after</li><li>Fail2ban: brute-force protection, configurable in the Supervisor</li><li>Shutdown: Connectors -> Storage Servers -> Supervisor (mandatory order)</li><li>Startup: Supervisor -> Storage Servers -> Connectors (reverse order)</li></ul></div>',
quiz_en:[
  {q:"Which configuration management tool orchestrates the deployment of RING components?",opts:["Ansible","Puppet","Salt / SaltStack","Chef"],ans:2,expl:"Scality RING uses SaltStack for deployment and configuration management. Salt states describe the target configuration for each type of node."},
  {q:"In what order should RING components be shut down?",opts:["Connectors -> Supervisor -> Storage","Storage -> Connectors -> Supervisor","Supervisor -> Connectors -> Storage","The order does not matter"],ans:0,expl:"The correct order is: Connectors first (stop client access), then storage services, then Supervisor last. Reversing the order risks corrupting in-flight writes."},
  {q:"Which tool automatically detects and blocks IPs performing brute-force attacks?",opts:["Vault","Fail2ban","MARS","Platformcheck"],ans:1,expl:"Fail2ban analyzes logs and automatically bans IPs making too many failed authentication attempts. It is the first line of defense against brute-force attacks."},
  {q:"What is Platformcheck used for?",opts:["Checking object integrity","A diagnostic tool that verifies system configuration compliance (network, OS, BIOS) against Scality prerequisites","Monitoring Prometheus metrics","Managing SSL certificates"],ans:1,expl:"Platformcheck verifies that the platform meets Scality prerequisites: OS version, network configuration, BIOS, storage. Should be run before any deployment or upgrade."},
  {q:"Why is SaltStack preferred over manual configuration management on a RING cluster?",opts:["SaltStack is mandatory by Scality license","SaltStack guarantees configuration consistency across all nodes simultaneously and enables rollback, preventing configuration drift (CONF_MISMATCH)","SaltStack is faster for small clusters","Manual management is equivalent for fewer than 10 nodes"],ans:1,expl:"With dozens or hundreds of nodes, manual management inevitably introduces configuration drift. SaltStack applies the desired state to all nodes idempotently, detects discrepancies, and can correct them automatically."},
  {q:"What does the principle of least privilege mean when applied to RING administration?",opts:["All admins have root access on all nodes","Each service and user has only the permissions strictly necessary for their function, limiting the impact of a compromise","The ring rejects all connections by default","Service accounts share a single password"],ans:1,expl:"The least privilege principle limits the attack surface: a compromised account can only do what it was authorized to do. In practice: dedicated service accounts, RBAC on S3 buckets, SSH access limited to administration IPs."},
  {q:"When starting the RING after a full maintenance window, what is the correct order?",opts:["Connectors -> Storage -> Supervisor","Supervisor -> Storage -> Connectors","Storage -> Supervisor -> Connectors","The order is irrelevant"],ans:1,expl:"At startup: Supervisor first (it manages processes), then Storage (data must be available), then Connectors last (they only expose the API once the ring is operational). This is the reverse of the shutdown order."},
  {q:"How do you verify that no configuration drift exists between nodes after a partial upgrade?",opts:["Manually compare config files on each node","Use Salt to apply a highstate and check differences (salt '*' state.highstate test=True)","Restart all nodes","Check only the Salt master node"],ans:1,expl:"salt '*' state.highstate test=True applies Salt states in simulation mode across all minions and reports the differences between the current state and the desired state, without modifying anything. It is the ideal tool for detecting post-upgrade drift."}
]},
{id:'10',num:'10',title:'SOFS — Configuration Complete',desc:'Architecture SOFS, connectors, SMB/NFS, Recycle, Quotas, DLM',
content:'<h2>Qu\'est-ce que SOFS ?</h2><p><strong>SOFS (Scale-Out File System)</strong> est une couche d\'abstraction qui presente le stockage objet du RING sous la forme d\'un <strong>système de fichiers POSIX</strong>. Chaque fichier SOFS est mappe a un unique blob dans le RING (relation 1:1) : le nom du fichier est utilisé comme clé, et le contenu est stocké comme un objet RING via le protocole sproxyd.</p><p>SOFS permet aux applications traditionnelles (qui parlent NFS ou SMB) d\'utiliser la puissance du RING Scality sans modification, tout en beneficiant de ses avantages (scale-out, haute disponibilité, réplication geographique).</p><h2>Architecture SOFS — Vue d\'Ensemble</h2><div class="adiag">     APPLICATIONS CLIENTES\n   (Windows, Linux, CDMI...)\n           |\n   [Réseau public / LAN]\n           |\n+----------+----------+\n| Connector A         |  &lt;-- réseau prive --&gt;  | Connector B         |\n| sfused              |                         | sfused              |\n| membershipd         |                         | membershipd         |\n| smbd/nmbd (SMB)     |                         | smbd/nmbd (SMB)     |\n| CTDB (clustering)   |                         | CTDB (clustering)   |\n+----------+----------+                         +--------------------+\n           |                                             |\n           +------------------+------------------------+\n                              |\n                     ZooKeeper Cluster\n                     (DLM, coordination)\n                              |\n           +------------------+------------------------+\n           |                                           |\n     RING DATA (objets SOFS)              RING META (métadonnées SOFS, COS 4+)</div><h2>Les Composants Clés de SOFS</h2><h3>sfused — Le Driver FUSE</h3><p><code>sfused</code> est le daemon qui monté le volume SOFS localement via FUSE (Filesystem in Userspace). Il traduit les appels syscall POSIX (open, read, write, mkdir...) en opérations RING :</p><ul><li>Une <code>read()</code> sur un fichier devient un <code>GET sproxyd</code> vers le RING</li><li>Une <code>write()</code> devient un <code>PUT sproxyd</code> (remplacement complet de l\'objet)</li><li>Un <code>mkdir()</code> crée une entrée de métadonnée dans le RING META (COS 4+)</li><li>Son fichier de configuration principal : <code>/etc/scality/sfused.conf</code> (format JSON)</li></ul><h3>membershipd — Appartenance au Volume</h3><p><code>membershipd</code> est le daemon qui gère l\'<strong>appartenance du connector au volume SOFS</strong>. Il s\'enregistre aupres de ZooKeeper pour indiquer que ce connector est actif sur ce volume :</p><ul><li>Permet au DLM de savoir quels connectors sont actifs sur le volume</li><li>Coordonne le failover : si un connector tombe, membershipd le détecte et libère ses verrous DLM</li><li>S\'exécute en parallèle avec sfused sur chaque serveur connector</li></ul><h3>ZooKeeper — Coordination Distribuee</h3><p>ZooKeeper est le service de coordination distribué utilisé par SOFS pour :</p><ul><li><strong>DLM (Distributed Lock Manager)</strong> : arbitre les verrous sur les fichiers entre plusieurs connectors</li><li><strong>Membership</strong> : registre des connectors actifs sur chaque volume</li><li><strong>Quorum</strong> : ZooKeeper fonctionne en mode quorum (3 ou 5 nœuds recommandes)</li></ul><div class="alert alert-w">ZooKeeper est OBLIGATOIRE quand plusieurs connectors accèdent simultanément au même volume SOFS. Sans ZooKeeper/DLM, des écritures concurrentes de plusieurs connectors provoqueraient des corruptions de données.</div><h2>Les 5 Types de Connectors SOFS</h2><table><tr><th>Connector</th><th>Services actifs</th><th>Protocole</th><th>Specificites</th></tr><tr><td><strong>FUSE (localfs)</strong></td><td>sfused + membershipd</td><td>POSIX local</td><td>Accès fichier local uniquement, pas d\'accès réseau direct aux clients</td></tr><tr><td><strong>SMB/CIFS</strong></td><td>sfused + membershipd + smbd + nmbd + winbindd*</td><td>SMB 3.0</td><td>AD optionnel, CTDB pour HA/VIP, module ring en premier dans vfs objects</td></tr><tr><td><strong>NFSv3</strong></td><td>sfused + membershipd + nfsd kernel</td><td>NFS v3</td><td>Kerberos NON supporte, semantique POSIX complete</td></tr><tr><td><strong>NFSv3+v4</strong></td><td>ganesha + membershipd</td><td>NFS v3 et v4.0</td><td>Kerberos supporte (v4 seulement), NFSv4.0 uniquement (pas 4.1/4.2)</td></tr><tr><td><strong>CDMI</strong></td><td>dewpoint + sfused + membershipd</td><td>CDMI/HTTP</td><td>Apache/nginx + FastCGI, standard SNIA Cloud Storage</td></tr></table><p>*winbindd est optionnel. Il est requis uniquement pour l\'intégration Active Directory (authentification des utilisateurs Windows).</p><h2>Features SOFS — Description Detaillee</h2><h3>MARS — Réplication Multisite Asynchrone</h3><p>MARS (Multi-site Asynchronous Réplication for SOFS) permet de répliquer un volume SOFS vers un site distant :</p><ul><li><strong>Asynchrone</strong> : les écritures sur le site source sont confirmées immédiatement, la réplication vers le site cible se fait en arrière-plan</li><li><strong>Use cases</strong> : Plan de Reprise d\'Activite (PRA), protection anti-ransomware (le site réplique est en read-only)</li><li>Tous les connectors du volume doivent être configurés pour participer a MARS</li></ul><h3>DLM — Distributed Lock Manager</h3><p>Le DLM gère les verrous distribués sur les fichiers SOFS :</p><ul><li>Indispensable quand plusieurs connectors (ex: 2 serveurs SMB en cluster) accèdent au même volume</li><li>Évite les corruptions dues aux écritures concurrentes sur le même fichier</li><li>Repose sur ZooKeeper pour la coordination inter-connectors</li><li>Configuré dans <code>/etc/scality/sfused.conf</code> section DLM</li></ul><h3>CTDB — Clustering SMB</h3><p>CTDB (Cluster Trivial DataBase) est la technologie de clustering Samba qui permet :</p><ul><li><strong>VIP failover</strong> : une IP virtuelle flotte entre les nœuds SMB. En cas de panne d\'un nœud, les clients reconnectent automatiquement via la VIP sans reconfiguration</li><li><strong>Load balancing</strong> : distribution des connexions SMB actives entre les nœuds du cluster</li><li><strong>Session persistence</strong> : les sessions SMB sont partagées entre nœuds pour éviter les interruptions</li></ul><h2>Configuration SMB Complete</h2><h3>Fichiers de configuration</h3><ul><li><code>/etc/scality/cifs/smb.conf</code> : configuration principale (SerNet-Samba)</li><li><code>/etc/scality/cifs/global_names.conf</code> : nom du serveur, workgroup</li><li><code>/etc/scality/cifs/global_ad.conf</code> : configuration Active Directory</li></ul><h3>Exemple de configuration</h3><pre>## global_names.conf\nnetbios name = STORAGESRV01\nserver string = Scality SOFS SMB Server\nworkgroup = MONDOMAINE\n\n## global_ad.conf (si Active Directory)\nsecurity = ads\nrealm = MONDOMAINE.LOCAL\nidmap config MONDOMAINE : backend = rid\nidmap config MONDOMAINE : range = 2600000-4999999\n\n## smb.conf (partage SOFS)\n[sofs-share]\n  path = /sofs/volume1\n  read only = no\n  vfs objects = ring catia fruit streams_xattr acl_xattr\n  nt acl support = yes\n  inherit acls = Yes\n  map acl inherit = Yes</pre><div class="alert alert-d">CRITIQUE : <code>ring</code> doit toujours être en PREMIER dans <code>vfs objects</code>. Exemple correct : <code>vfs objects = ring catia fruit streams_xattr acl_xattr</code>. Si ring n\'est pas en premier, les ACL et les métadonnées ne sont pas correctement stockées dans le RING, causant des corruptions silencieuses.</div><h3>Rejoindre le domaine Active Directory</h3><pre># Rejoindre le domaine AD\nnet ads join -U administrator\n\n# Vérifier l\'adhésion\nnet ads info\n\n# Lister les utilisateurs AD accessibles\nwbinfo -u</pre><h2>SOFS Recycle — Corbeille Distribuee</h2><p>La SOFS Recycle est une fonctionnalite de <strong>corbeille versionnée</strong> qui permet de récupérer des fichiers supprimés. Quand un fichier est supprimé, au lieu d\'être detruit, il est deplace dans un repertoire <code>.recycle</code> special.</p><h3>Trois modes de fonctionnement</h3><table><tr><th>Mode</th><th>Paramètre</th><th>Qui voit .recycle</th><th>Qui peut restaurer/vider</th></tr><tr><td>Invisible</td><td>invisible=true</td><td>Admin uniquement (hidden)</td><td>Admin uniquement</td></tr><tr><td>Privileged</td><td>privileged=true</td><td>Tout le monde</td><td>Admin uniquement</td></tr><tr><td>Standard</td><td>privileged=false</td><td>Tout le monde</td><td>Owner du fichier + Admin</td></tr></table><h3>Structure de /etc/scality/sfused.conf</h3><pre>{\n  "recycle": {\n    "enable": true,\n    "versioning": true,    // garder plusieurs versions du même fichier\n    "privileged": false,   // owner peut restaurer\n    "root_name": ".recycle"\n  },\n  "lifecycle_policy": {\n    "enable": true,\n    "base_path": ".recycle",\n    "max_versions_per_hour": 60,\n    "max_versions_per_day": 999999,\n    "max_versions_per_week": 999999,\n    "max_versions_per_month": 999999,\n    "time_frame_days": 31,     // garder pendant 31 jours max\n    "workers": 4\n  }\n}</pre><div class="alert alert-d">La lifecycle_policy est OBLIGATOIRE si la Recycle est activée. Sans elle, la corbeille grossit indefiniment jusqu\'a saturer le volume SOFS et bloquer toutes les écritures.</div><h2>Quotas SOFS</h2><p>Les quotas SOFS permettent de limiter l\'espace utilisé au niveau du volume, d\'un utilisateur ou d\'un groupe. Ils sont gérés via l\'<strong>adminapi REST</strong> de sfused (socket Unix local) :</p><h3>Types de quotas</h3><ul><li><strong>Quota volume</strong> : taille maximale du volume SOFS entier</li><li><strong>Quota utilisateur</strong> : espace max par utilisateur (UID)</li><li><strong>Quota groupe</strong> : espace max par groupe (GID)</li></ul><h3>Commandes de gestion des quotas</h3><pre># Récupérer le socket adminapi\nSOCKET=$(cat /var/run/scality/scality-sfused-adminapi)\n\n# Lire le quota volume actuel\ncurl -s $SOCKET/fs/quota/volume | python3 -m json.tool\n\n# Modifier le quota volume (editer /tmp/volume_quota.json)\ncurl -s $SOCKET/fs/quota/volume --output /tmp/volume_quota.json\nvim /tmp/volume_quota.json\ncurl -s -XPUT $SOCKET/fs/quota/volume -T /tmp/volume_quota.json\n\n# Quota utilisateur (uid 1234)\ncurl -s $SOCKET/fs/quota/user/1234 | python3 -m json.tool</pre><div class="kbox"><h3>Points Clés a Retenir</h3><ul><li>sfused = driver FUSE qui traduit les syscalls POSIX en opérations RING (sproxyd)</li><li>membershipd = enregistrement du connector dans ZooKeeper</li><li>DLM + ZooKeeper = OBLIGATOIRE si plusieurs connectors accès au même volume</li><li>CTDB = VIP failover + clustering Samba pour la HA SMB</li><li>vfs objects : "ring" doit TOUJOURS être en PREMIER position</li><li>Recycle Recycle : 3 modes ; lifecycle_policy OBLIGATOIRE pour éviter saturation</li><li>Quotas : volume / user / group via adminapi REST sur socket Unix local</li></ul></div>',
quiz:[
  {q:"Que signifie SOFS ?",opts:["Scality Object File System","Scale-Out File System","Secure Object File Store","Shared Object FUSE System"],ans:1,expl:"SOFS = Scale-Out File System. C'est le système de fichiers distribué Scality exposant une interface POSIX (NFS/SMB) au-dessus du ring d'objets."},
  {q:"Quel composant expose le namespace SOFS comme un point de montage local ?",opts:["biziod","repd","sfused","bucketd"],ans:2,expl:"sfused est le daemon FUSE qui monté le namespace SOFS comme un répertoire local POSIX. NFS et Samba/SMB s'appuient sur ce montage pour exporter le filesystem aux clients."},
  {q:"Quel est le rôle de CTDB dans SOFS ?",opts:["Stocker les métadonnées SOFS dans LevelDB","Couche de métadonnées distribuée Samba pour partager les sessions SMB entre nœuds","Gérer les quotas utilisateur","Chiffrer les données SOFS"],ans:1,expl:"CTDB (Clustered TDB) est utilisé par Samba dans SOFS pour partager les informations de sessions SMB entre les nœuds du cluster, assurant la transparence pour les clients Windows."},
  {q:"Que fait le DLM dans l'architecture SOFS ?",opts:["Distribué les données sur les disques","Gestionnaire de verrous distribués pour coordonner les accès concurrents aux fichiers","Gère la réplication entre sites","Monitore l'espace disque"],ans:1,expl:"DLM (Distributed Lock Manager) coordonne les accès concurrents aux fichiers entre nœuds SOFS. Sans DLM, deux nœuds pourraient modifier le même fichier simultanément et corrompre les données."},
  {q:"Quel protocole les clients Linux/Unix utilisent-ils pour accéder à SOFS ?",opts:["SMB/CIFS","iSCSI","NFS","WebDAV"],ans:2,expl:"Les clients Linux/Unix utilisent NFS pour accéder à SOFS. Les clients Windows utilisent SMB via Samba. sfused expose le même namespace SOFS aux deux protocoles."},
  {q:"Pourquoi SOFS utilise-t-il un DLM plutôt que de laisser chaque nœud gérer ses propres verrous ?",opts:["Le DLM est obligatoire par NFS v4","Sans DLM centralisé, deux clients sur deux nœuds différents pourraient écrire simultanément dans le même fichier, causant une corruption silencieuse","Le DLM améliore les performances de lecture","Le DLM remplace CTDB dans les nouvelles versions"],ans:1,expl:"SOFS est un filesystem distribué : plusieurs nœuds servent les clients en parallèle. Le DLM garantit l'exclusion mutuelle sur les fichiers en coordonnant les verrous entre nœuds, garantissant la cohérence POSIX (une seule écriture à la fois par fichier)."},
  {q:"Que se passe-t-il si sfused tombe sur un nœud SOFS servant des clients NFS ?",opts:["Les autres nœuds prennent automatiquement le relais sans interruption","Les clients NFS montés sur ce nœud perdent l'accès ; il faut redémarrer sfused ou rediriger les clients vers un autre nœud","CTDB bascule automatiquement les connexions NFS","Les données sont perdues"],ans:1,expl:"sfused est le point d'accès au namespace SOFS sur ce nœud. Sa chute interrompt les accès NFS/SMB sur ce nœud. Les clients doivent être redirigés (via DNS round-robin ou VIP) vers un autre nœud SOFS encore actif. Les données ne sont pas perdues car elles sont dans le ring."},
  {q:"Comment SOFS expose-t-il un namespace cohérent à tous les nœuds alors que chacun a son propre sfused ?",opts:["Chaque nœud a sa propre copie indépendante du namespace","Tous les sfused accèdent au même namespace dans le ring RING via MESA pour les métadonnées et le ring DATA pour les données, garantissant une vue cohérente","Un nœud maître détient le namespace réel","Le namespace est synchronisé toutes les 5 minutes"],ans:1,expl:"SOFS stocké les métadonnées du filesystem (inodes, répertoires) dans MESA (cohérence Raft) et les données dans le ring DATA. Tous les nœuds sfused lisent/écrivent dans ce même stockage partagé, garantissant une vue cohérente du namespace quel que soit le nœud accédé."}
