  {q:"Un opérateur remarque que Prometheus n'a plus de données depuis 2 heures. Quelle est la première cause à investiguer ?",opts:["Arrêter Grafana et le redémarrer","Vérifier que les exporters (MARS, node_exporter) sont actifs sur les noeuds et que Prometheus peut les joindre réseau","Augmenter la rétention Prometheus","Vider le cache Grafana"],ans:1,expl:"Si Prometheus n'a plus de données, la cause la plus probable est que le scrape échoue : exporter arrêté, problème réseau entre Prometheus et les noeuds, ou configuration de scrape incorrecte. Le restart de Grafana ne résoudrait rien car Grafana ne collecte pas les métriques."},
  {q:"Pourquoi utiliser AlertManager avec Prometheus plutôt que de gérer les alertes directement dans Grafana ?",opts:["Grafana ne supporte pas les alertes","AlertManager gère le routage, la déduplication, le groupement et les silences d'alertes de manière centralisée, indépendamment de la visualisation","AlertManager est moins cher","Prometheus n'envoie pas les alertes à Grafana"],ans:1,expl:"AlertManager sépare la logique d'alerte de la visualisation. Il gère la déduplication (évite le flood d'alertes), le groupement, le routage vers différents canaux (email, PagerDuty, Slack) et les silences planifiés — fonctions absentes de Grafana."}
]},
{id:'M6',num:'06',title:'Gestion des Disques',desc:'Biziod, biziotools, scaldisk, etats des disques, OOS_PERM',
content:'<h2>Les Deux Outils de Gestion des Disques</h2><p>Scality fournit deux outils CLI complementaires pour la gestion des disques, operant a des niveaux d\'abstraction differents :</p><h3>biziotools — Niveau Biziod (bas niveau)</h3><p><code>biziotools</code> interagit directement avec le daemon Biziod. Il permet d\'inspecter les structures internes de stockage :</p><ul><li><strong>Lister les fichiers container</strong> sur un disque donne (leur taille, leur taux de remplissage)</li><li><strong>Inspecter les chunks</strong> a l\'interieur des containers (cle, taille, offset)</li><li><strong>Verifier la coherence</strong> entre l\'index SSD et les donnees HDD</li><li><strong>Forcer le flush</strong> des ecritures en attente dans un Biziod</li></ul><pre># Exemples biziotools\nbiziotools list-containers /data/disk01\nbiziotools chunk-info /data/disk01 &lt;chunk_id&gt;\nbiziotools check-index /data/disk01</pre><h3>scaldisk — Niveau Cluster (haut niveau)</h3><p><code>scaldisk</code> opere au niveau du cluster pour la gestion du cycle de vie des disques :</p><ul><li><strong>Declarer un nouveau disque</strong> dans le RING (apres ajout physique)</li><li><strong>Retirer un disque</strong> proprement (evacuation des donnees avant decommission)</li><li><strong>Verifier la sante</strong> d\'un disque (etat SMART, erreurs I/O recentes)</li><li><strong>Forcer l\'etat OOS</strong> d\'un disque defaillant pour protection immediate</li></ul><pre># Exemples scaldisk\nscaldisk list                   # etat de tous les disques\nscaldisk add /dev/sdb           # ajouter un disque au RING\nscaldisk evacuate /dev/sdb      # evacuer les donnees avant retrait\nscaldisk set-oos /dev/sdb       # forcer OOS d\'urgence</pre><h2>Cycle de Vie et Etats des Disques</h2><p>Chaque disque dans le RING passe par plusieurs etats au cours de sa vie. Comprendre ces etats est essentiel pour la gestion proactive :</p><div class="adiag">+--------+     +----------+     +-------+     +---------+\n|  NEW   | --> |   OK     | --> | WARN  | --> |  ERROR  |\n+--------+     +----------+     +-------+     +---------+\n(declare)      (operationnel)   (premiers      (erreurs\n                                 signaux)       significatives)\n                                                    |\n                                                    v\n                                               +--------+     +-----------+\n                                               |  OOS   | --> | OOS_PERM  |\n                                               +--------+     +-----------+\n                                               (retrait        (remplacement\n                                                temporaire)     physique)</div><table><tr><th>Etat</th><th>Signification detaillee</th><th>Action operationnelle</th></tr><tr><td><code>OK</code></td><td>Disque pleinement operationnel. Aucune erreur SMART, I/O normaux, taux de remplissage acceptable.</td><td>Aucune. Surveiller via Grafana.</td></tr><tr><td><code>WARNING</code></td><td>Premiers signaux de degradation : compteurs SMART en augmentation, quelques erreurs I/O sporadiques, latences elevees occasionnelles. Disque encore fonctionnel.</td><td>Planifier le remplacement prochainement. Augmenter la frequence de monitoring.</td></tr><tr><td><code>ERROR</code></td><td>Erreurs I/O significatives et repetees. Le disque repond encore mais de facon non fiable. Le RING peut avoir marque certains objets comme INCOMPLETE.</td><td>Planifier le remplacement urgent. Verifier l\'etat des donnees (Rebuild en cours ?).</td></tr><tr><td><code>OOS</code></td><td>Out of Service temporaire. Le disque est retire du RING mais peut etre remis en service. Le RING reconstruit les donnees manquantes sur d\'autres disques.</td><td>Maintenance en cours (remplacement temporaire, firmware update...). Ne pas laisser trop longtemps.</td></tr><tr><td><code>OOS_PERM</code></td><td>Out of Service Permanent. Le disque est definitivement declare hors service. Le RING a reconstruit ou est en train de reconstruire les donnees manquantes.</td><td><strong>Remplacer physiquement le disque. Ne JAMAIS le remettre en service.</strong></td></tr></table><div class="alert alert-d">OOS_PERM est irreversible : une fois un disque marque OOS_PERM, il ne peut plus rejoindre le RING. Tenter de le remettre manuellement en service sans suivre la procedure de declaration d\'un nouveau disque corromprait l\'index MESA.</div><h2>Procedure de Remplacement d\'un Disque</h2><ol><li><strong>Detection</strong> : le Supervisor ou Grafana alerte sur un disque ERROR ou OOS_PERM.</li><li><strong>Evacuation logicielle</strong> : le disque passe en OOS, le RING lance le Rebuild pour reconstituer les donnees manquantes sur d\'autres disques disponibles.</li><li><strong>Attendre le Rebuild</strong> : ne pas remplacer physiquement avant que le RING soit revenu en etat RUN (toutes les donnees du disque ont ete reconstituees ailleurs).</li><li><strong>Remplacement physique</strong> : changer le disque defaillant.</li><li><strong>Declaration</strong> : utiliser <code>scaldisk add</code> pour declarer le nouveau disque dans le RING.</li><li><strong>Reequilibrage</strong> : le RING lance automatiquement un Balance pour repartir les donnees sur le nouveau disque.</li></ol><div class="alert alert-w">Remplacer un disque OOS_PERM AVANT la fin du Rebuild est risque : si un autre disque tombe en panne pendant la reconstruction, on peut atteindre le seuil de perte de donnees (plus de M fragments ARC perdus simultanement).</div><h2>Gestion de la Capacite Disque</h2><p>La surveillance du taux de remplissage des disques est critique. Deux seuils declenchent des alertes dans le Supervisor :</p><ul><li><strong>DISK USAGE WARNING</strong> : un seuil configurable (ex: 75%) est atteint. Alerte preventive.</li><li><strong>DISK_FULL</strong> : le disque est plein. Le RING ne peut plus ecrire de nouvelles donnees sur ce disque. Etat critique necessitant une action immediate (ajout de capacite ou suppression de donnees).</li></ul><h2>L\'Index SSD — Criticite et Protection</h2><p>L\'index SSD de chaque Biziod est le composant le plus critique du systeme de stockage physique. Sa perte (sans perte du HDD associe) ne cause pas de perte de donnees mais necessite une reconstruction couteuse :</p><ul><li>La reconstruction de l\'index consiste a relire <em>tous les containers HDD</em> pour reconstruire la table de correspondance cle->offset.</li><li>Cette operation peut durer plusieurs heures sur de grands disques (plusieurs TB).</li><li>Pendant la reconstruction, le Biziod ne repond pas : ses donnees semblent manquantes, ce qui peut declencher un Rebuild ARC inutile.</li></ul><p>Bonnes pratiques pour les SSD d\'index :</p><ul><li>Utiliser des SSD <strong>entreprise</strong> avec protection anti-panne de courant (condensateurs)</li><li>Monitorer le niveau d\'usure (wear level) via S.M.A.R.T.</li><li>Envisager RAID1 sur les SSD d\'index pour les environnements critiques</li></ul><h2>Remplacement d\'un Disque DATA</h2><p>Quand un disque DATA tombe en panne, la procedure de remplacement suit des etapes precises pour eviter toute perte de donnees. Le RING doit etre sain (protection integre) avant de commencer.</p><h3>Procedure scaldisk (etapes cles)</h3><div class="adiag">1. Marquer le disque comme hors service permanent\n   scaldisk iods set disk07 OOS_PERM\n   -> Le RING cesse d\'utiliser ce disque et lance le Rebuild sur les autres\n\n2. Arreter le service scality-iod pour ce disque\n   systemctl stop scality-iod@disk07\n\n3. Remplacement physique du disque (intervention hardware)\n\n4. Declarer le nouveau disque dans Salt/scaldisk\n   scaldisk add -c /dev/sdX        # ajoute le nouveau disque\n   # ou\n   scaldisk replace -c /dev/sdX -d disk07  # remplacement direct (avec RAID plugin)\n\n5. Creer un nouveau store sur le disque\n   bizioopen -c -N disk07 bizobj://DATA_RING\n\n6. Effacer le flag OOS_PERM\n   scaldisk iods clear disk07\n   -> Le RING reintegre le disque et distribue des donnees dessus</div><p class="alert-w"><strong>Avant de commencer :</strong> Verifier que le RING est dans un etat sain (pas de INCOMPLETE, pas d\'autre Rebuild en cours). Remplacer un disque pendant un Rebuild actif peut degrader la protection sous le seuil de tolerance.</p><h2>LUKS — Chiffrement At-Rest des Disques</h2><p>Scality RING supporte le <strong>chiffrement LUKS</strong> (Linux Unified Key Setup) pour chiffrer les disques DATA et metadata au repos. Le chiffrement est transparent pour le RING — il opere au niveau bloc, en dessous de ext4.</p><h3>Principes LUKS sur RING</h3><table><tr><th>Aspect</th><th>Detail</th></tr><tr><td>Niveau</td><td>Chiffrement au niveau bloc (partition LUKS sous le filesystem ext4). Le RING ne voit que des blocs dechiffres — pas de modification logicielle RING.</td></tr><tr><td>Ouverture automatique</td><td>Options NBDE (Network-Bound Disk Encryption) via <strong>TANG + clevis</strong> : les disques s\'ouvrent automatiquement au boot si le serveur TANG est accessible — elimine la saisie manuelle de passphrase.</td></tr><tr><td>scaldisk + LUKS</td><td>La plupart des commandes scaldisk fonctionnent normalement avec LUKS. Exception : <code>scaldisk replace</code> necessite des flags specifiques (<code>--luks</code>) pour recreer la partition chiffree.</td></tr><tr><td>Disques DATA vs Metadata</td><td>Procedures differentes : disques DATA (SAS/SATA) et disques metadata (SSD/NVMe) ont chacun leur procedure de remplacement LUKS.</td></tr></table><pre># Creer une partition LUKS sur un disque DATA\ncryptsetup luksFormat /dev/sdX\ncryptsetup open /dev/sdX disk07_crypt\n\n# Avec NBDE (ouverture automatique via TANG)\nclevis luks bind -d /dev/sdX tang \'{"url":"http://tang-server"}\'\n\n# scaldisk replace avec LUKS\nscaldisk replace --luks -c /dev/sdX -d disk07</pre><h2>Expansion de Capacite</h2><p>Deux types d\'expansion existent pour augmenter la capacite du RING :</p><table><tr><th>Type</th><th>Description</th><th>Impact keyspace</th></tr><tr><td><strong>Disk Expansion</strong></td><td>Ajout de disques sur des serveurs existants. Procedure simple : scaldisk add sur chaque serveur.</td><td>Pas de modification du keyspace. Le RING reequilibre automatiquement.</td></tr><tr><td><strong>Server Expansion</strong></td><td>Ajout de nouveaux serveurs au RING. Plus complexe : necessite la mise a jour du keyspace et la validation Scality.</td><td>Nouveau keyspace calcule par l\'equipe ExVT Scality. Application via procedure dediee.</td></tr></table><p class="alert-d"><strong>Validation Scality obligatoire</strong> avant toute expansion serveurs. Soumettre un ticket de validation via Zendesk avec la configuration actuelle et prevue. Une expansion non validee peut desequilibrer le RING et degrader les performances.</p><h3>Verifier l\'equilibre du RING apres expansion</h3><pre># Etat de la memoire et des disques sur tous les noeuds\ndate; salt -s \'*\' cmd.run \'free -h\'\ndate; salt -s \'*\' cmd.run \'df -h\'\n\n# Status du RING\nringsh supervisor ringStatus DATA\n\n# Si le RING est desequilibre apres ajout de disques :\n# Utiliser l\'outil scality-official-tooling/capacity_and_balances</pre><div class="kbox"><h3>Points Cles a Retenir</h3><ul><li>biziotools = niveau Biziod (containers, chunks, index) -- outil bas niveau</li><li>scaldisk = niveau cluster (declaration, evacuation, sante) -- outil haut niveau</li><li>Cycle : OK -> WARNING -> ERROR -> OOS -> OOS_PERM (irreversible)</li><li>OOS_PERM = remplacement physique obligatoire, ne JAMAIS remettre en service</li><li>Attendre la fin du Rebuild avant de remplacer physiquement</li><li>SSD d\'index : critique, reconstruction longue si perdu, monitorer le wear level</li></ul></div>',
quiz:[
  {q:"Que signifie OOS_PERM pour un noeud RING ?",opts:["Noeud temporairement hors service","Noeud définitivement perdu, ses données doivent être reconstruites","Noeud en mode maintenance","Noeud surchargé"],ans:1,expl:"OOS_PERM (Out Of Service Permanent) signifie que le noeud est définitivement perdu. Le ring déclenche le rebuild des données de ce noeud sur les noeuds survivants."},
  {q:"Quel outil permet de gérer les disques physiques sur les noeuds RING ?",opts:["biziod","biziotools/scaldisk","repd","MESA"],ans:1,expl:"scaldisk (et biziotools) est l'outil de gestion des disques sur les noeuds RING. Il permet d'ajouter, retirer ou vérifier l'état des disques intégrés au service de stockage."},
  {q:"Qu'est-ce qu'un 'Disk Orphan' ?",opts:["Un disque non formaté","Un objet présent sur disque sans référence dans les métadonnées Chord","Un disque en erreur SMART","Un disque non assigné à un Bizstorenode"],ans:1,expl:"Un Disk Orphan est un objet physiquement présent sur disque mais sans entrée dans les métadonnées Chord. Il est éligible à la suppression via Chord Purge."},
  {q:"Quelle opération nettoie les Disk Orphans ?",opts:["Rebuild","Repair","Chord Purge","Balance"],ans:2,expl:"Chord Purge nettoie les entrées orphelines dans l'espace Chord. Il supprime les références à des objets n'existant plus physiquement et peut identifier les Disk Orphans."},
  {q:"Qu'est-ce qu'un objet INCOMPLETE ?",opts:["Un objet chiffré partiellement","Un objet dont tous les fragments n'ont pas été écrits lors de l'ingestion","Un objet sans métadonnées S3","Un objet en cours de réplication"],ans:1,expl:"Un objet INCOMPLETE a été partiellement écrit : certains fragments manquent. Il est présent mais dégradé. Un Rebuild peut tenter de le compléter si des fragments suffisants existent."},
  {q:"Quel daemon gère les opérations I/O bas niveau sur les disques physiques ?",opts:["sproxyd","repd","biziod","membershipd"],ans:2,expl:"biziod est le daemon d'I/O bas niveau. Il gère directement les lectures/écritures sur les disques physiques pour le compte de sproxyd, en maintenant un index sur SSD."},
  {q:"Avant de remplacer physiquement un disque défaillant, quelle commande doit-on exécuter pour retirer proprement le disque du service ?",opts:["Éteindre directement le noeud","Utiliser scaldisk pour marquer le disque comme OOS avant de le retirer physiquement","Exécuter un Rebuild complet","Lancer Chord Purge sur le disque"],ans:1,expl:"Il faut d'abord signaler le retrait du disque via scaldisk pour que le ring redistribue les données vers d'autres disques avant le retrait physique. Retirer un disque à chaud sans préavis peut causer une perte temporaire d'accès aux objets."},
  {q:"Pourquoi biziod maintient-il ses fichiers de données sur HDD en taille fixe (containers) ?",opts:["Pour simplifier le chiffrement LUKS","Les containers de taille fixe évitent la fragmentation du système de fichiers et permettent une gestion directe des blocs, optimisant les performances I/O séquentielles sur HDD","Pour réduire l'espace disque utilisé","Le HDD ne supporte pas les fichiers de taille variable"],ans:1,expl:"Les containers de taille fixe sur HDD évitent la fragmentation. biziod gère lui-même l'allocation dans ces containers, contournant les limitations des systèmes de fichiers génériques et optimisant les I/O séquentiels pour les grandes écritures de blobs."}
]},
{id:'M7',num:'07',title:'Taches Automatiques du RING',desc:'Rebuild, Repair, Balance, Relocation, GC, Purge — taches declenchees et gerees automatiquement par le RING',
content:'<h2>Vue d\'Ensemble des Taches de Fond</h2><p>Le RING execute en permanence des <strong>taches de fond (background tasks)</strong> pour maintenir l\'integrite, l\'equilibre et la disponibilite des donnees. Ces taches sont orchestrees par le Supervisor et s\'executent de facon asynchrone sans impacter (idealement) les I/O de production. Chacune repond a un besoin precis :</p><table><tr><th>Tache</th><th>Declencheur principal</th><th>Objectif</th><th>Priorite</th></tr><tr><td><strong>Rebuild</strong></td><td>Fragments ARC manquants (panne disque/serveur)</td><td>Reconstituer les fragments ARC perdus</td><td>HAUTE</td></tr><tr><td><strong>Repair</strong></td><td>Repliques COS insuffisantes</td><td>Ramener COS au nombre de repliques requis</td><td>HAUTE</td></tr><tr><td><strong>Balance</strong></td><td>Desequilibre de charge entre nodes</td><td>Repartir les donnees uniformement</td><td>MOYENNE</td></tr><tr><td><strong>Relocation</strong></td><td>Ajout de nouveaux nodes (expansion)</td><td>Migrer les objets vers les nouveaux nodes</td><td>MOYENNE</td></tr><tr><td><strong>Garbage Collector</strong></td><td>Deletion d\'objets / fragments orphelins</td><td>Liberer l\'espace disque des objets supprimes</td><td>BASSE</td></tr><tr><td><strong>Purge</strong></td><td>Versioning S3 / anciennes versions</td><td>Supprimer les versions d\'objets obsoletes</td><td>BASSE</td></tr><tr><td><strong>Chord Purge</strong></td><td>Fin de maintenance d\'un node</td><td>Nettoyer les entrees P2P obsoletes</td><td>BASSE</td></tr></table><h2>Rebuild — La Tache la Plus Critique</h2><p>Le <strong>Rebuild</strong> est la tache la plus importante car elle protege directement contre la perte de donnees. Elle est declenchee automatiquement des qu\'un fragment ARC est detecte comme manquant.</p><h3>Deroulement d\'un Rebuild ARC</h3><ol><li><strong>Detection</strong> : un Biziod cible est inaccessible. Le Bizstorenode responsable detecte que le fragment est manquant.</li><li><strong>Evaluation</strong> : combien de fragments sont disponibles ? Si &gt;= K fragments disponibles, le Rebuild est possible.</li><li><strong>Recuperation</strong> : le RING lit les K fragments disponibles depuis leurs Biziod respectifs.</li><li><strong>Decodage</strong> : l\'objet original est reconstruit en memoire (decodage Reed-Solomon).</li><li><strong>Re-encodage</strong> : les fragments manquants sont recalcules.</li><li><strong>Ecriture</strong> : les nouveaux fragments sont ecrits sur des Biziod de remplacement (autre disque, autre serveur).</li><li><strong>Mise a jour MESA</strong> : l\'entree MESA est mise a jour avec les nouveaux emplacements.</li></ol><div class="alert alert-d">Si le nombre de fragments disponibles tombe en dessous de K (seuil minimum pour le decodage), le Rebuild echoue et l\'objet est irrecuperable. Le RING passe en etat ARC_REBUILD_NOK. Contacter Scality Support immediatement.</div><h3>Suivi du Rebuild</h3><p>Le Rebuild est visible dans la section Tasks du Supervisor avec :</p><ul><li>Nombre d\'objets en cours de reconstruction</li><li>Vitesse de progression (objets/heure)</li><li>Estimation du temps restant</li></ul><h2>Repair — Reconstruction des Repliques COS</h2><p>Le <strong>Repair</strong> est l\'equivalent du Rebuild pour les objets en replication COS. Il est declenche quand un objet COS a moins de repliques que le facteur requis :</p><ul><li>Le RING detecte qu\'un objet COS 3 n\'a que 2 repliques (panne d\'un node).</li><li>Une des repliques existantes est lue.</li><li>L\'objet est reecrit sur un Bizstorenode disponible pour recreer la 3eme replique manquante.</li><li>MESA est mise a jour.</li></ul><p>L\'etat <code>INCOMPLETE</code> dans le Supervisor indique que des objets ont un nombre insuffisant de repliques COS (Repair en attente ou en cours).</p><h2>Balance — Equilibrage des Donnees</h2><p>Le <strong>Balance</strong> est declenche lorsqu\'une inegalite de remplissage est detectee entre Bizstorenode. Les scenarios classiques :</p><ul><li><strong>Apres un upgrade</strong> : un node arrete et redemmarre vide peut attirer moins de nouvelles donnees que les autres.</li><li><strong>Apres un Rebuild intensif</strong> : certains disques sont plus charges que d\'autres apres la reconstruction.</li><li><strong>Apres une expansion</strong> : les nouveaux nodes sont vides, les anciens sont pleins.</li></ul><div class="alert alert-w">Lors d\'un upgrade RING, ne pas passer au serveur suivant tant que le Balance n\'est pas termine sur le serveur precedent. Un Balance interrompu laisse le RING dans un etat desequilibre qui risque de provoquer un DISK_FULL premature sur certains nodes.</div><h2>Relocation — Migration Lors d\'une Expansion</h2><p>Quand de nouveaux Bizstorenode rejoignent le RING (expansion), ils obtiennent des segments du keyspace des anciens nodes. La <strong>Relocation</strong> migre les objets correspondants vers leur nouvel emplacement :</p><ol><li>Calcul des nouveaux segments de keyspace pour les nouveaux nodes.</li><li>Pour chaque objet dont la cle appartient desormais a un nouveau node : lecture depuis l\'ancien emplacement, ecriture vers le nouveau.</li><li>Mise a jour MESA.</li><li>Suppression de l\'ancienne copie (GC).</li></ol><h2>Garbage Collector — Nettoyage des Orphelins</h2><p>Le <strong>GC</strong> libere l\'espace occupe par des chunks qui ne sont plus references dans MESA :</p><ul><li>Chunks ecrits mais dont l\'objet a ete supprime ensuite</li><li>Fragments partiels d\'une ecriture avortee (timeout, erreur reseau)</li><li>Anciennes versions d\'objets dont le Purge n\'a pas encore ete execute</li></ul><p>Le GC tourne en basse priorite car il n\'est pas urgent — les chunks orphelins n\'affectent pas la disponibilite, seulement la capacite disque disponible.</p><p class="alert-i"><strong>Controle admin des taches :</strong> le throttling et les commandes ringsh (mode maintenance) sont couverts dans le module <strong>MD — Maintenance RING</strong>.</p><div class="kbox"><h3>Points Cles a Retenir</h3><ul><li>Toutes ces taches sont <strong>automatiques</strong> — le RING les declenche sans intervention humaine</li><li>Rebuild = reconstitution fragments ARC perdus (priorite HAUTE, tache la plus critique)</li><li>Repair = reconstitution repliques COS manquantes (meme priorite que Rebuild)</li><li>ARC_REBUILD_NOK = Rebuild impossible, donnees irrecuperables → Scality Support immediatement</li><li>Balance = reequilibrage du remplissage entre nodes (apres upgrade ou expansion)</li><li>Relocation = migration des objets vers les nouveaux nodes lors d\'une expansion</li><li>GC/Purge = nettoyage asynchrone des objets supprimes (basse priorite, delai 7 jours)</li></ul></div>',
quiz:[
  {q:"Quelle tâche reconstruit les fragments manquants après une panne noeud ?",opts:["Balance","Repair","Rebuild","Relocation"],ans:2,expl:"Rebuild reconstruit les fragments manquants d'un objet dégradé à partir des fragments survivants. Il est déclenché automatiquement après une panne noeud ou disque."},
  {q:"Quelle est la différence entre Rebuild et Repair ?",opts:["Pas de différence, ce sont des synonymes","Rebuild reconstruit les fragments manquants, Repair vérifie et corrige l'intégrité de tous les objets","Repair est manuel, Rebuild est automatique","Rebuild est pour les métadonnées, Repair pour les données"],ans:1,expl:"Rebuild cible les objets spécifiquement identifiés comme dégradés (fragments manquants). Repair est une vérification complète de l'intégrité de tous les objets du ring, plus exhaustif mais plus lent."},
  {q:"Quand la tâche Balance est-elle déclenchée ?",opts:["Toutes les 24h automatiquement","Uniquement en mode maintenance","Lors de l'ajout ou du retrait d'un noeud, pour redistribuer équitablement les données","Après chaque écriture d'objet"],ans:2,expl:"Balance est déclenchée lors d'un changement de topologie (ajout/retrait noeud). Elle redistribue les données pour que chaque noeud garde une charge proportionnelle à sa capacité."},
  {q:"Pourquoi est-il risqué d'augmenter le throttling de Rebuild à 100% pendant les heures de production ?",opts:["Cela ne présente aucun risque","Un Rebuild à plein régime consomme toutes les I/O disque, dégradant fortement les performances des clients et risquant de violer les SLA","Le Rebuild s'arrête automatiquement à 50%","Cela annule la tâche Balance"],ans:1,expl:"Le throttling limite la consommation des ressources I/O par les tâches de fond. Sans throttling, Rebuild monopolise les disques et dégrade les temps de réponse des requêtes clients. Un équilibre est nécessaire entre vitesse de rebuild et QoS client."},
  {q:"Un Repair découvre des objets INCOMPLETE que Rebuild ne parvient pas à reconstruire. Que cela indique-t-il ?",opts:["Le ring a besoin d'être redémarré","Trop de fragments sont manquants pour permettre la reconstruction : le seuil ARC est dépassé, les données sont irrécupérables sans intervention externe","Un bug dans Repair","Il faut augmenter le COS"],ans:1,expl:"Si Rebuild échoue à reconstruire un objet INCOMPLETE, cela signifie que le nombre de fragments survivants est inférieur au seuil minimal (k fragments de données en ARC). Les données sont irrécupérables sans une source externe comme un backup ou un site DR."},
  {q:"Quelle tâche identifie les références Chord pointant vers des objets physiquement absents ?",opts:["Rebuild","Balance","Repair","Chord Purge"],ans:3,expl:"Chord Purge analyse les références dans l'espace Chord et identifie celles ne correspondant à aucun objet physique sur disque (Chord Orphans). Il nettoie aussi les Disk Orphans (objets physiques sans référence Chord)."},
  {q:"Dans quel ordre logique les tâches automatiques s'enchaînent-elles typiquement après une panne noeud ?",opts:["Balance -> Rebuild -> Repair","Rebuild (reconstruction urgente) -> Balance (rééquilibrage) -> Repair (vérification intégrité)","Repair -> Rebuild -> Balance","Chord Purge -> Rebuild -> Balance"],ans:1,expl:"Après une panne : Rebuild est déclenché en priorité pour restaurer la protection des objets dégradés. Puis Balance redistribue la charge. Repair peut ensuite faire une vérification complète de l'intégrité. Chord Purge nettoie les orphelins en dernier."},
  {q:"À quoi sert le paramètre de priorité des tâches de fond dans ringsh ?",opts:["Il fixe l'ordre d'exécution des tâches de manière absolue","Il ajuste dynamiquement l'allocation des ressources I/O entre les tâches de fond et les requêtes clients selon la charge","Il empêche certaines tâches de démarrer","Il configure le nombre de threads par tâche"],ans:1,expl:"La priorité des tâches de fond permet de configurer combien de ressources I/O chaque tâche (Rebuild, Repair, Balance) peut utiliser par rapport aux requêtes clients. Cela permet d'accélérer le rebuild en maintenance sans impacter les clients en production."}
]},
{id:'M8',num:'08',title:'Gestion des Erreurs',desc:'INCOMPLETE, ARC_REBUILD_NOK, CONF_MISMATCH, SPLIT LOOP et resolutions',
content:'<h2>Tableau de Reference des Etats d\'Erreur</h2><table><tr><th>Etat</th><th>Severite</th><th>Impact immediat</th><th>Action requise</th></tr><tr><td><code>INCOMPLETE</code></td><td>Avertissement</td><td>Certains objets sous-repliques, risque si autre panne</td><td>Surveiller le Rebuild/Repair</td></tr><tr><td><code>ARC_REBUILD_NOK</code></td><td>CRITIQUE</td><td>Donnees potentiellement irrecuperables</td><td>Contacter Scality Support IMMEDIATEMENT</td></tr><tr><td><code>DISK_FULL</code></td><td>CRITIQUE</td><td>Ecritures bloquees sur ce disque</td><td>Liberer de l\'espace ou ajouter de la capacite</td></tr><tr><td><code>DISK USAGE WARNING</code></td><td>Avertissement</td><td>Disque approche de la saturation</td><td>Planifier ajout de capacite</td></tr><tr><td><code>CONF_MISMATCH</code></td><td>Informatif</td><td>Aucun (normal post-upgrade Supervisor)</td><td>Rien -- se corrige lors de l\'upgrade des nodes</td></tr><tr><td><code>SPLIT LOOP</code></td><td>CRITIQUE</td><td>Partitionnement du cluster, risque de split-brain</td><td>Diagnostiquer reseau, ne pas ecrire</td></tr><tr><td><code>NOT STABILIZED</code></td><td>Transitoire</td><td>RING en cours de convergence (normal post-join/leave)</td><td>Attendre la stabilisation automatique</td></tr></table><h2>INCOMPLETE — Analyse Detaillee</h2><p>L\'etat INCOMPLETE signifie que le RING a detecte des objets dont le nombre de repliques (COS) ou de fragments valides (ARC) est inferieur au minimum requis. C\'est une alerte preventive — les donnees sont encore accessibles mais moins bien protegees.</p><h3>Causes courantes</h3><ul><li>Panne d\'un serveur storage (un node est DOWN ou en OOS)</li><li>Panne d\'un disque (un Biziod ne repond plus)</li><li>Congestion reseau causant des timeouts d\'ecriture</li><li>Phase transitoire apres un nodeLeave (normal, temporaire)</li></ul><h3>Resolution</h3><ul><li>Les taches <strong>Rebuild</strong> (pour ARC) et <strong>Repair</strong> (pour COS) corrigent automatiquement l\'INCOMPLETE.</li><li>Si le node/disque est en panne permanente, il faut le remplacer et laisser le Rebuild se terminer.</li><li>Si l\'INCOMPLETE persiste sans raison apparente (tous les nodes sont UP), investiguer les logs Biziod.</li></ul><h2>ARC_REBUILD_NOK — Urgence Absolue</h2><div class="alert alert-d">ARC_REBUILD_NOK est l\'etat le plus grave du RING. Il indique que des objets ARC ont perdu plus de M fragments (le nombre de fragments de parite) simultanement. Ces objets sont mathematiquement irrecuperables — aucune reconstruction n\'est possible.</div><h3>Causes</h3><ul><li>Panne simultanee de plusieurs serveurs/disques (par exemple : incendie, coupure de courant affectant plusieurs racks)</li><li>Bug dans le Rebuild qui a echoue silencieusement sur plusieurs fragments</li><li>Corruption de donnees systematique (bit rot sur plusieurs disques sans ECC)</li></ul><h3>Procedure d\'urgence</h3><ol><li><strong>Stopper toutes les ecritures</strong> si possible pour eviter d\'aggraver la situation.</li><li><strong>Contacter Scality Support immediatement</strong> avec les logs du Supervisor.</li><li><strong>Ne pas tenter de correction manuelle</strong> — les procedures Scality Support sont specifiques a chaque cas.</li><li><strong>Evaluer les sauvegardes</strong> disponibles pour les objets affectes.</li></ol><h2>CONF_MISMATCH — Etat Normal Post-Upgrade</h2><div class="alert alert-i">CONF_MISMATCH ne represente AUCUN risque pour les donnees. C\'est simplement une indication que les packages logiciels ne sont pas tous a la meme version sur tous les nodes. Il est ATTENDU apres l\'upgrade du Supervisor et avant l\'upgrade des storage nodes.</div><h3>Causes</h3><ul><li>Le Supervisor vient d\'etre upgrade mais les storage nodes ont encore l\'ancienne version.</li><li>Un node a ete ajoute recemment avec une version differente.</li></ul><h3>Resolution</h3><ul><li>CONF_MISMATCH <strong>disparait automatiquement</strong> quand tous les storage nodes sont upgrages a la meme version.</li><li>Ne <strong>JAMAIS</strong> cliquer "Apply Configuration" dans l\'UI pendant un upgrade : cela appliquerait la configuration de la nouvelle version sur des nodes avec l\'ancien code, causant une interruption de service.</li></ul><h2>SPLIT LOOP — Partitionnement Reseau</h2><p>Le <strong>SPLIT LOOP</strong> (ou split brain) est un des etats les plus dangereux. Il survient quand le cluster se divise en deux groupes de nodes qui ne peuvent plus communiquer entre eux :</p><div class="adiag">Etat normal :\n[Node1] --- [Node2] --- [Node3] --- [Node4] --- [Node5]\n   Tous se voient, quorum maintenu\n\nSPLIT LOOP :\n[Node1] --- [Node2]    X    [Node3] --- [Node4] --- [Node5]\nGroupe A (2 nodes)          Groupe B (3 nodes)\n\nProbleme : les 2 groupes peuvent accepter des ecritures independantes\n           -> Risque de divergence des donnees</div><h3>Causes</h3><ul><li>Panne d\'un switch reseau central</li><li>Probleme de cable entre des segments du reseau</li><li>Configuration VLAN incorrecte</li><li>Saturation de bande passante reseau inter-nodes</li></ul><h3>Procedure de resolution</h3><ol><li><strong>Stopper immediatement les ecritures</strong> sur les deux groupes si possible.</li><li><strong>Diagnostiquer la connectivite</strong> : ping entre tous les nodes, verifier les interfaces reseau, les switches.</li><li><strong>Corriger la cause reseau</strong> (remplacer le switch, reparer le cable, corriger la config VLAN).</li><li>Une fois la connectivite retablie, le RING se re-synchronise automatiquement (NOT_STABILIZED puis RUN).</li><li>Verifier l\'integrite des donnees avec Scality Support si des ecritures ont eu lieu pendant le split.</li></ol><h2>Analyse des Logs — Outils</h2><pre># Logs sproxyd (erreurs HTTP 5xx)\ngrep \'http_code="5\' /var/log/scality-sproxyd.log\n\n# Rechercher une requete par son ID\ngrep \'reqid="0000653D0000D09"\' /var/log/scality-sproxyd.log\n\n# Verifier les processus sproxyd\nnetstat -tnlp | grep :81     # Apache frontal\nnetstat -tnlp | grep :10000  # Daemon sproxyd\n\n# Logs Bizstorenode\ncat /var/log/scality-node/current\n\n# Logs Biziod (par disque)\ncat /var/log/scality-biziod-&lt;disk_id&gt;/current</pre><h2>P1 Troubleshooting — Arbre de Decision</h2><p>Un incident P1 correspond a une <strong>interruption totale de service</strong> ou une <strong>degradation majeure</strong> impactant les utilisateurs finaux. La procedure de diagnostic suit un arbre de decision structure.</p><h3>Arbre de decision P1</h3><div class="adiag">SYMPTOMES P1 :\n"It\'s slow" / Latences elevees / Timeouts / Erreurs 500 en masse\n\nETAPE 1 : Verifier la sante globale du RING\n  ringsh supervisor ringStatus DATA\n  ringsh supervisor ringStatus META\n  -> Si RING degraded/rebuilding : voir module M7 (taches RING)\n  -> Si RING OK : passer a l\'etape 2\n\nETAPE 2 : Verifier la sante des disques et serveurs\n  scaldisk iods list          # disques OOS ?\n  salt -s \'*\' cmd.run \'df -h\' # espace disque OK ?\n  salt -s \'*\' cmd.run \'free -h\' # RAM OK ?\n  -> Si disque plein/OOS : traiter en priorite\n\nETAPE 3 : Verifier le reseau\n  # Verifier les retransmissions TCP (doit etre ~0)\n  # Tester le debit entre noeuds avec iperf3\n  # Verifier la coherence MTU (jumbo frames)\n  -> Si retransmissions > 0 : probleme reseau, escalader\n\nETAPE 4 : Si S3 en erreur\n  -> Verifier les containers S3 (ctrctl ps)\n  -> Verifier les alertes Raft (Prometheus)\n  -> Suivre une requete dans les logs S3\n\nETAPE 5 : Si SOFS en erreur\n  -> Verifier CTDB et sfused (voir module MA)</div><h3>Commandes de diagnostic S3 rapide</h3><pre># Taux d\'erreurs S3 en temps reel (necessite pv installe)\ntail -f /var/log/s3/scality-s3/logs/s3-0.log | grep elapsed | pv -i 1 -l -r > /dev/null\n\n# Taux de 500 en temps reel\ntail -f /var/log/s3/scality-s3/logs/s3-0.log | grep \'"httpCode":5\' | pv -i 1 -l -r > /dev/null\n\n# Suivre une requete lente par son request_id\ngrep "request_id_from_500_log" /var/log/s3/scality-s3/logs/*.log\n\n# Identifier si la latence vient des metadonnees (bucketd/repd)\n# ou du stockage (sproxyd → RING)\negrep \'elapsed\' /var/log/s3/scality-s3/logs/s3-0.log | awk -F\'elapsed":\' \'{print $2}\' | sort -n | tail -20\n\n# Health check S3 complet\n/usr/bin/scality-compute-s3-health -d -c /etc/scality/s3-healthcheck/config.yaml 2>&1</pre><div class="kbox"><h3>Points Cles a Retenir</h3><ul><li>INCOMPLETE = sous-replication temporaire (Rebuild/Repair corrige automatiquement)</li><li>ARC_REBUILD_NOK = URGENCE : donnees irrecuperables, Scality Support immediatement</li><li>CONF_MISMATCH = NORMAL post-upgrade Supervisor, ne JAMAIS cliquer Apply Config</li><li>SPLIT LOOP = partitionnement reseau : stopper les ecritures, reparer le reseau</li><li>DISK_FULL = saturation disque : aucune nouvelle ecriture possible sur ce disque</li><li>sproxyd : port 81 (Apache), port 10000 (daemon interne)</li></ul></div>',
quiz:[
  {q:"Que signifie l'alarme SPLIT LOOP ?",opts:["Boucle infinie dans le code Scality","Fragmentation du ring en partitions réseau isolées (split-brain)","Erreur de réplication CRR","Disque en boucle de rebuild"],ans:1,expl:"SPLIT LOOP est une alarme critique : le ring s'est fragmenté en partitions qui ne se voient plus. Provoque un split-brain et nécessite une intervention immédiate pour éviter la corruption."},
  {q:"Que faire en premier face à une alarme ARC_REBUILD_NOK ?",opts:["Redémarrer le noeud","Vérifier le statut des noeuds (nodeList) et identifier les noeuds OOS ou OOS_PERM","Reformater les disques","Désactiver les alarmes"],ans:1,expl:"ARC_REBUILD_NOK signifie qu'un rebuild a échoué. La première étape est de vérifier quels noeuds sont OOS/OOS_PERM via nodeList pour comprendre pourquoi les fragments ne peuvent pas être reconstruits."},
  {q:"L'alarme CONF_MISMATCH indique quoi ?",opts:["Un objet corrompu","Une incohérence de configuration entre noeuds du ring","Un quota S3 dépassé","Un certificat SSL expiré"],ans:1,expl:"CONF_MISMATCH signale une incohérence de configuration entre noeuds. Peut indiquer une différence de version logicielle ou de paramètre. À investiguer via Salt et la comparaison des configs."},
  {q:"Quelle est la cause la plus fréquente d'un noeud passant en OOS (pas OOS_PERM) ?",opts:["Défaillance permanente du matériel","Interruption réseau temporaire ou redémarrage du service","Remplacement de disque","Upgrade du logiciel"],ans:1,expl:"OOS (Out Of Service) est généralement temporaire : coupure réseau, redémarrage service, maintenance planifiée. Le noeud peut rejoindre automatiquement le ring à son retour, contrairement à OOS_PERM."},
  {q:"Qu'est-ce que l'alarme INCOMPLETE indique comme action ?",opts:["Supprimer l'objet immédiatement","Lancer un Rebuild pour tenter de compléter les fragments manquants","Augmenter le COS","Réduire le throttling"],ans:1,expl:"Un objet INCOMPLETE a des fragments manquants depuis l'écriture. Un Rebuild peut tenter de le compléter en écrivant les fragments manquants si les données originales sont reconstituables depuis les fragments existants."},
  {q:"Dans quel module trouve-t-on les commandes de maintenance ringsh (nodeLeave, nodeJoin) ?",opts:["M5 Monitoring","M6 Gestion des Disques","MD Maintenance RING","M8 Gestion des Erreurs"],ans:2,expl:"Les commandes de maintenance ringsh (nodeLeave, nodeJoin, ringConfigSet) sont documentées dans le module MD dédié à la Maintenance RING. M5 ne couvre que les commandes de diagnostic."},
  {q:"Un opérateur reçoit une alarme DISKFULL sur un noeud. Quelle est la première action à éviter absolument ?",opts:["Vérifier l'espace disque réel avec df","Supprimer manuellement des fichiers de données biziod pour libérer de l'espace","Vérifier si des Disk Orphans peuvent être purgés","Contacter le support Scality"],ans:1,expl:"Supprimer manuellement des fichiers biziod peut corrompre des objets intègres et causer une perte de données irrécupérable. La gestion de l'espace doit toujours passer par les outils Scality (Chord Purge, scaldisk) qui comprennent la structure interne."},
  {q:"Vous observez une latence élevée sur les requêtes S3 GET mais pas sur les PUT. Quel composant investiguer en premier ?",opts:["Cloudserver","bucketd","biziod côté lecture (index SSD dégradé ou trop de fragments à reconstruire à la volée)","Vault"],ans:2,expl:"Les latences GET élevées sur fond de PUT normaux pointent vers biziod en lecture. Deux causes probables : l'index SSD est dégradé (ralentissant les lookups) ou de nombreux objets dégradés nécessitent une reconstruction à la volée depuis les fragments ARC, consommant CPU et I/O."}
]},
{id:'M9',num:'09',title:'Securite et Administration',desc:'Roles, SSO, Fail2ban, ordre de demarrage/arret',
content:'<h2>Les 4 Roles du RING — Matrice de Permissions</h2><p>Le Supervisor utilise un modele de <strong>Role-Based Access Control (RBAC)</strong> avec 4 roles predefined. Chaque utilisateur se voit assigner un ou plusieurs roles lors de sa creation dans l\'interface Identity.</p><table><tr><th>Role</th><th>Lecture</th><th>Ecriture</th><th>Cas d\'usage</th></tr><tr><td><strong>RING Admin</strong></td><td>Tout</td><td>Tout</td><td>Administrateur systeme Scality. Acces complet a toutes les operations : configuration RING, gestion des disques, upgrade, utilisateurs.</td></tr><tr><td><strong>Identity Manager</strong></td><td>Tout (lecture seule)</td><td>Gestion des utilisateurs UNIQUEMENT</td><td>Responsable securite ou DBA qui gere les acces sans pouvoir modifier la configuration du RING.</td></tr><tr><td><strong>Monitoring Manager</strong></td><td>Tout</td><td>Dashboards Grafana uniquement</td><td>Equipe monitoring/NOC qui visualise et personnalise les dashboards sans pouvoir modifier le RING.</td></tr><tr><td><strong>RING Viewer</strong></td><td>Tout (lecture seule)</td><td>Aucune</td><td>Auditeurs, equipes applicatives qui ont besoin de visibilite sur l\'etat du stockage sans droit de modification.</td></tr></table><div class="alert alert-i">Un meme utilisateur peut avoir plusieurs roles. Par exemple, un administrateur senior peut etre a la fois RING Admin et Identity Manager.</div><h2>Authentification SSO — Depuis RING 9.4.0</h2><p>Avant RING 9.4.0, l\'authentification des utilisateurs du Supervisor etait geree de facon basique (LDAP ou comptes locaux simples). Depuis <strong>9.4.0</strong>, le Supervisor integre un systeme de <strong>Single Sign-On (SSO)</strong> complet base sur un Identity Provider (IdP) interne.</p><h3>Premiers pas apres l\'installation</h3><ul><li>Credentials initiaux : <code>admin</code> / <code>Default_passw0rd</code></li><li><strong>Changer le mot de passe immediatement</strong> apres la premiere connexion</li><li>Creer les utilisateurs supplementaires via l\'interface <code>Identity</code> du Supervisor</li></ul><h3>Gestion des utilisateurs (interface Identity)</h3><ul><li>Creation : nom, email, mot de passe, role(s) assigne(s)</li><li>Politique de mot de passe : longueur minimum, complexite, expiration configurable</li><li>Desactivation d\'un compte sans le supprimer (audit trail preserve)</li><li>Export/import de la liste des utilisateurs (utile lors d\'upgrades)</li></ul><div class="alert alert-w">Lors d\'un upgrade depuis une version &lt; 9.4.0 vers 9.4.0+ : le systeme d\'authentification change completement. Les anciens comptes ne sont pas migres automatiquement. Il faut <strong>exporter la liste des utilisateurs AVANT l\'upgrade</strong> et les recreer manuellement dans la nouvelle interface Identity. Utiliser la variable d\'environnement <code>SCALITY_SUPERVISOR_FQDN</code> lors de la migration SSO.</div><h3>Migration SSO (upgrade depuis &lt; 9.4.0)</h3><pre># Avant l\'upgrade : noter tous les utilisateurs existants\n# Apres l\'upgrade du Supervisor :\nexport SCALITY_SUPERVISOR_FQDN=supervisor.mondomaine.com\n# Puis recreer les utilisateurs via l\'interface Identity</pre><h2>Authentication Throttling — Fail2ban</h2><p>Le Supervisor integre <strong>Fail2ban</strong> pour se proteger contre les attaques par force brute sur l\'interface d\'authentification :</p><ul><li><strong>Principe</strong> : apres N tentatives d\'authentification echouees depuis la meme IP, Fail2ban bloque cette IP pendant une duree configurable.</li><li><strong>Configuration</strong> : Administration &gt; Security &gt; Authentication Throttling dans le Supervisor</li><li><strong>Parametres</strong> : seuil de tentatives (defaut: 5), duree de blocage (defaut: 10 min), liste blanche d\'IPs exemptees</li><li><strong>Logs</strong> : les IP bloquees sont loggees dans <code>/var/log/fail2ban.log</code> sur le Supervisor</li></ul><pre># Debloquer une IP manuellement (si admin se bloque lui-meme)\nfail2ban-client set supervisor unbanip &lt;adresse_ip&gt;\n\n# Voir les IPs actuellement bloquees\nfail2ban-client status supervisor</pre><h2>Communications HTTPS et Certificats TLS</h2><p>Toutes les communications vers et depuis le Supervisor sont obligatoirement chiffrees en <strong>HTTPS/TLS</strong> :</p><ul><li>Certificat auto-signe genere a l\'installation (a remplacer par un certificat CA en production)</li><li>Certificat configurable dans <code>/etc/scality/supervisor/ssl/</code></li><li>Les Connectors communiquent avec le Supervisor via HTTPS (agents Salt)</li><li>Le port HTTPS du Supervisor est 443 par defaut</li></ul><h2>Ordre d\'Arret et de Demarrage — Regle Absolue</h2><p>L\'ordre des operations d\'arret et de demarrage du cluster est <strong>non-negociable</strong>. Un ordre incorrect provoque des erreurs visibles par les clients ou des interruptions de service evitables.</p><div class="adiag">ARRET (ordre obligatoire) :\n  1. CONNECTORS  (S3, NFS, SMB, sproxyd, FUSE...)\n       -> Les clients recoivent un signal propre d\'indisponibilite\n       -> Les ecritures en cours se terminent ou sont annulees proprement\n  2. STORAGE SERVERS  (systemctl stop scality-node)\n       -> Les Bizstorenode s\'arretent proprement\n       -> Les donnees en buffer sont flushees sur les Biziod\n  3. SUPERVISOR\n       -> L\'orchestrateur s\'arrete en dernier\n\nDEMARRAGE (ordre strictement inverse) :\n  1. SUPERVISOR\n       -> L\'orchestrateur doit etre operationnel en premier\n  2. STORAGE SERVERS  (systemctl start scality-node)\n       -> Les nodes rejoignent le RING (nodeJoin automatique si join_auto=2)\n  3. CONNECTORS\n       -> Les acces clients sont retablis uniquement quand le RING est stable</div><div class="alert alert-d">Si les Storage Servers sont arretes AVANT les Connectors : les Connectors continuent de recevoir des requetes clients mais ne peuvent plus acceder aux donnees -> erreurs 5xx visibles par les applications. Toujours arreter les Connectors en premier.</div><h2>Securite Reseau</h2><ul><li><strong>Reseau de stockage (backend)</strong> : reseau dedie entre Bizstorenode/Biziod, isole du reseau client pour la performance et la securite. Typiquement un reseau 10 GbE ou 25 GbE dedie.</li><li><strong>Reseau management</strong> : acces SSH au Supervisor et aux serveurs, isole du reseau client.</li><li><strong>Reseau client (frontend)</strong> : connexions des Connectors vers les applications clientes.</li></ul><h2>Keycloak — Identity Provider SSO (depuis 9.4.0)</h2><p><strong>Keycloak</strong> est la solution SSO integree dans Scality RING depuis la version 9.4.0. Il centralise l\'authentification pour toutes les interfaces d\'administration.</p><h3>Role de Keycloak dans le RING</h3><table><tr><th>Interface</th><th>Avant 9.4.0</th><th>Depuis 9.4.0</th></tr><tr><td>Supervisor GUI</td><td>Authentification locale</td><td>SSO via Keycloak</td></tr><tr><td>Grafana</td><td>Compte local</td><td>SSO via Keycloak</td></tr><tr><td>S3 Console</td><td>Vault IAM</td><td>SSO via Keycloak possible</td></tr></table><p>Keycloak supporte <strong>SAML 2.0</strong> et <strong>OpenID Connect (OIDC)</strong>. Il peut s\'integrer avec des annuaires LDAP/Active Directory. Scality fournit des extensions specifiques (depot <code>scality/keycloak-extensions</code> sur GitHub).</p><h3>Distinction critique : Keycloak vs Vault</h3><div class="alert alert-i"><strong>Keycloak et Vault ont des roles completement distincts :</strong><br>- <strong>Keycloak</strong> = SSO pour les administrateurs humains → acces Supervisor, Grafana<br>- <strong>Vault</strong> = IAM pour les applications S3 → access keys, secret keys, policies<br><br>Si Keycloak tombe : les admins ne peuvent plus se connecter au Supervisor via SSO. Les operations S3 (PUT/GET) via access key/secret key continuent car elles passent par Vault.</div><h3>Impact d\'une panne Keycloak</h3><ul><li>Acces Supervisor GUI via SSO : impossible</li><li>Acces Grafana via SSO : impossible</li><li>Operations S3 API (access key) : non impactees</li><li>ringsh en ligne de commande : non impacte</li></ul><div class="alert alert-w">Toujours maintenir un compte local d\'urgence sur le Supervisor. En cas de panne Keycloak, ce compte permet un acces de secours.</div><div class="kbox"><h3>Points Cles a Retenir</h3><ul><li>4 roles RBAC : RING Admin (tout), Identity Manager (users), Monitoring Manager (read+Grafana), RING Viewer (read-only)</li><li>SSO depuis 9.4.0 : credentials initiaux admin/Default_passw0rd, changer immediatement</li><li>Upgrade depuis &lt;9.4.0 : exporter les users AVANT, les recreer dans Identity apres</li><li>Fail2ban : protection brute force, configurable dans le Supervisor</li><li>Arret : Connectors -> Storage Servers -> Supervisor (obligatoire dans cet ordre)</li><li>Demarrage : Supervisor -> Storage Servers -> Connectors (ordre inverse)</li></ul></div>',
quiz:[
  {q:"Quel outil de gestion de configuration orchestre le déploiement des composants RING ?",opts:["Ansible","Puppet","Salt / SaltStack","Chef"],ans:2,expl:"Scality RING utilise SaltStack pour le déploiement et la gestion de configuration. Les états Salt décrivent la configuration cible de chaque type de noeud."},
  {q:"Dans quel ordre doit-on arrêter les composants RING ?",opts:["Connectors -> Supervisor -> Storage","Storage -> Connectors -> Supervisor","Supervisor -> Connectors -> Storage","L'ordre n'a pas d'importance"],ans:0,expl:"L'ordre correct est : Connectors d'abord (stopper les accès clients), puis les services de stockage, puis Supervisor en dernier. Inverser risque de corrompre des écritures en cours."},
  {q:"Quel outil détecte et bloque automatiquement les IP faisant des attaques par force brute ?",opts:["Vault","Fail2ban","MARS","Platformcheck"],ans:1,expl:"Fail2ban analyse les logs et bannit automatiquement les IP effectuant trop de tentatives d'authentification échouées. C'est la première ligne de défense contre les attaques par brute force."},
  {q:"À quoi sert Platformcheck ?",opts:["Vérifier l'intégrité des objets","Outil de diagnostic vérifiant la conformité de la configuration système (réseau, OS, BIOS) par rapport aux prérequis Scality","Surveiller les métriques Prometheus","Gérer les certificats SSL"],ans:1,expl:"Platformcheck vérifie que la plateforme répond aux prérequis Scality : version OS, configuration réseau, BIOS, stockage. À exécuter avant tout déploiement ou upgrade."},
  {q:"Pourquoi SaltStack est-il préféré à une gestion manuelle des configurations sur un cluster RING ?",opts:["SaltStack est obligatoire par licence Scality","SaltStack garantit la cohérence de configuration sur tous les noeuds simultanément et permet le rollback, évitant les dérives de configuration (CONF_MISMATCH)","SaltStack est plus rapide pour les petits clusters","La gestion manuelle est équivalente pour moins de 10 noeuds"],ans:1,expl:"Avec des dizaines ou centaines de noeuds, la gestion manuelle introduit inévitablement des dérives de configuration. SaltStack applique l'état désiré sur tous les noeuds de façon idempotente, détecte les écarts et peut les corriger automatiquement."},
  {q:"Qu'est-ce que le principe du moindre privilège appliqué à l'administration RING ?",opts:["Tous les admins ont les droits root sur tous les noeuds","Chaque service et utilisateur n'a que les permissions strictement nécessaires à sa fonction, limitant l'impact d'une compromission","Le ring refuse toutes les connexions par défaut","Les comptes de service partagent un seul mot de passe"],ans:1,expl:"Le principe du moindre privilège (least privilege) limite la surface d'attaque : un compte compromis ne peut faire que ce pour quoi il était autorisé. En pratique : comptes de service dédiés, RBAC sur les buckets S3, accès SSH limité aux IPs d'administration."},
  {q:"Lors du démarrage du RING après une maintenance complète, quel est le bon ordre ?",opts:["Connectors -> Storage -> Supervisor","Supervisor -> Storage -> Connectors","Storage -> Supervisor -> Connectors","L'ordre est indifférent"],ans:1,expl:"Au démarrage : Supervisor d'abord (il gère les processus), puis Storage (les données doivent être disponibles), puis Connectors en dernier (ils n'exposent l'API qu'une fois le ring opérationnel). C'est l'inverse de l'ordre d'arrêt."},
  {q:"Comment vérifier qu'aucune dérive de configuration n'existe entre les noeuds après un upgrade partiel ?",opts:["Comparer manuellement les fichiers de config sur chaque noeud","Utiliser Salt pour appliquer un highstate et vérifier les différences (salt '*' state.highstate test=True)","Redémarrer tous les noeuds","Vérifier uniquement le noeud master Salt"],ans:1,expl:"salt '*' state.highstate test=True applique les états Salt en mode simulation sur tous les minions et rapporte les différences entre l'état actuel et l'état désiré, sans modifier quoi que ce soit. C'est l'outil idéal pour détecter les dérives post-upgrade."}
]},
{id:'MA',num:'A',title:'SOFS — Configuration Complete',desc:'Architecture SOFS, connectors, SMB/NFS, Recycle, Quotas, DLM',
content:'<h2>Qu\'est-ce que SOFS ?</h2><p><strong>SOFS (Scale-Out File System)</strong> est une couche d\'abstraction qui presente le stockage objet du RING sous la forme d\'un <strong>systeme de fichiers POSIX</strong>. Chaque fichier SOFS est mappe a un unique blob dans le RING (relation 1:1) : le nom du fichier est utilise comme cle, et le contenu est stocke comme un objet RING via le protocole sproxyd.</p><p>SOFS permet aux applications traditionnelles (qui parlent NFS ou SMB) d\'utiliser la puissance du RING Scality sans modification, tout en beneficiant de ses avantages (scale-out, haute disponibilite, replication geographique).</p><h2>Architecture SOFS — Vue d\'Ensemble</h2><div class="adiag">     APPLICATIONS CLIENTES\n   (Windows, Linux, CDMI...)\n           |\n   [Reseau public / LAN]\n           |\n+----------+----------+\n| Connector A         |  &lt;-- reseau prive --&gt;  | Connector B         |\n| sfused              |                         | sfused              |\n| membershipd         |                         | membershipd         |\n| smbd/nmbd (SMB)     |                         | smbd/nmbd (SMB)     |\n| CTDB (clustering)   |                         | CTDB (clustering)   |\n+----------+----------+                         +--------------------+\n           |                                             |\n           +------------------+------------------------+\n                              |\n                     ZooKeeper Cluster\n                     (DLM, coordination)\n                              |\n           +------------------+------------------------+\n           |                                           |\n     RING DATA (objets SOFS)              RING META (metadonnees SOFS, COS 4+)</div><h2>Les Composants Cles de SOFS</h2><h3>sfused — Le Driver FUSE</h3><p><code>sfused</code> est le daemon qui monte le volume SOFS localement via FUSE (Filesystem in Userspace). Il traduit les appels syscall POSIX (open, read, write, mkdir...) en operations RING :</p><ul><li>Une <code>read()</code> sur un fichier devient un <code>GET sproxyd</code> vers le RING</li><li>Une <code>write()</code> devient un <code>PUT sproxyd</code> (remplacement complet de l\'objet)</li><li>Un <code>mkdir()</code> cree une entree de metadonnee dans le RING META (COS 4+)</li><li>Son fichier de configuration principal : <code>/etc/scality/sfused.conf</code> (format JSON)</li></ul><h3>membershipd — Appartenance au Volume</h3><p><code>membershipd</code> est le daemon qui gere l\'<strong>appartenance du connector au volume SOFS</strong>. Il s\'enregistre aupres de ZooKeeper pour indiquer que ce connector est actif sur ce volume :</p><ul><li>Permet au DLM de savoir quels connectors sont actifs sur le volume</li><li>Coordonne le failover : si un connector tombe, membershipd le detecte et libere ses verrous DLM</li><li>S\'execute en parallele avec sfused sur chaque serveur connector</li></ul><h3>ZooKeeper — Coordination Distribuee</h3><p>ZooKeeper est le service de coordination distribue utilise par SOFS pour :</p><ul><li><strong>DLM (Distributed Lock Manager)</strong> : arbitre les verrous sur les fichiers entre plusieurs connectors</li><li><strong>Membership</strong> : registre des connectors actifs sur chaque volume</li><li><strong>Quorum</strong> : ZooKeeper fonctionne en mode quorum (3 ou 5 noeuds recommandes)</li></ul><div class="alert alert-w">ZooKeeper est OBLIGATOIRE quand plusieurs connectors accedent simultanement au meme volume SOFS. Sans ZooKeeper/DLM, des ecritures concurrentes de plusieurs connectors provoqueraient des corruptions de donnees.</div><h2>Les 5 Types de Connectors SOFS</h2><table><tr><th>Connector</th><th>Services actifs</th><th>Protocole</th><th>Specificites</th></tr><tr><td><strong>FUSE (localfs)</strong></td><td>sfused + membershipd</td><td>POSIX local</td><td>Acces fichier local uniquement, pas d\'acces reseau direct aux clients</td></tr><tr><td><strong>SMB/CIFS</strong></td><td>sfused + membershipd + smbd + nmbd + winbindd*</td><td>SMB 3.0</td><td>AD optionnel, CTDB pour HA/VIP, module ring en premier dans vfs objects</td></tr><tr><td><strong>NFSv3</strong></td><td>sfused + membershipd + nfsd kernel</td><td>NFS v3</td><td>Kerberos NON supporte, semantique POSIX complete</td></tr><tr><td><strong>NFSv3+v4</strong></td><td>ganesha + membershipd</td><td>NFS v3 et v4.0</td><td>Kerberos supporte (v4 seulement), NFSv4.0 uniquement (pas 4.1/4.2)</td></tr><tr><td><strong>CDMI</strong></td><td>dewpoint + sfused + membershipd</td><td>CDMI/HTTP</td><td>Apache/nginx + FastCGI, standard SNIA Cloud Storage</td></tr></table><p>*winbindd est optionnel. Il est requis uniquement pour l\'integration Active Directory (authentification des utilisateurs Windows).</p><h2>Features SOFS — Description Detaillee</h2><h3>MARS — Replication Multisite Asynchrone</h3><p>MARS (Multi-site Asynchronous Replication for SOFS) permet de repliquer un volume SOFS vers un site distant :</p><ul><li><strong>Asynchrone</strong> : les ecritures sur le site source sont confirmees immediatement, la replication vers le site cible se fait en arriere-plan</li><li><strong>Use cases</strong> : Plan de Reprise d\'Activite (PRA), protection anti-ransomware (le site replique est en read-only)</li><li>Tous les connectors du volume doivent etre configures pour participer a MARS</li></ul><h3>DLM — Distributed Lock Manager</h3><p>Le DLM gere les verrous distribues sur les fichiers SOFS :</p><ul><li>Indispensable quand plusieurs connectors (ex: 2 serveurs SMB en cluster) accedent au meme volume</li><li>Evite les corruptions dues aux ecritures concurrentes sur le meme fichier</li><li>Repose sur ZooKeeper pour la coordination inter-connectors</li><li>Configure dans <code>/etc/scality/sfused.conf</code> section DLM</li></ul><h3>CTDB — Clustering SMB</h3><p>CTDB (Cluster Trivial DataBase) est la technologie de clustering Samba qui permet :</p><ul><li><strong>VIP failover</strong> : une IP virtuelle flotte entre les noeuds SMB. En cas de panne d\'un noeud, les clients reconnectent automatiquement via la VIP sans reconfiguration</li><li><strong>Load balancing</strong> : distribution des connexions SMB actives entre les noeuds du cluster</li><li><strong>Session persistence</strong> : les sessions SMB sont partagees entre noeuds pour eviter les interruptions</li></ul><h2>Configuration SMB Complete</h2><h3>Fichiers de configuration</h3><ul><li><code>/etc/scality/cifs/smb.conf</code> : configuration principale (SerNet-Samba)</li><li><code>/etc/scality/cifs/global_names.conf</code> : nom du serveur, workgroup</li><li><code>/etc/scality/cifs/global_ad.conf</code> : configuration Active Directory</li></ul><h3>Exemple de configuration</h3><pre>## global_names.conf\nnetbios name = STORAGESRV01\nserver string = Scality SOFS SMB Server\nworkgroup = MONDOMAINE\n\n## global_ad.conf (si Active Directory)\nsecurity = ads\nrealm = MONDOMAINE.LOCAL\nidmap config MONDOMAINE : backend = rid\nidmap config MONDOMAINE : range = 2600000-4999999\n\n## smb.conf (partage SOFS)\n[sofs-share]\n  path = /sofs/volume1\n  read only = no\n  vfs objects = ring catia fruit streams_xattr acl_xattr\n  nt acl support = yes\n  inherit acls = Yes\n  map acl inherit = Yes</pre><div class="alert alert-d">CRITIQUE : <code>ring</code> doit toujours etre en PREMIER dans <code>vfs objects</code>. Exemple correct : <code>vfs objects = ring catia fruit streams_xattr acl_xattr</code>. Si ring n\'est pas en premier, les ACL et les metadonnees ne sont pas correctement stockees dans le RING, causant des corruptions silencieuses.</div><h3>Rejoindre le domaine Active Directory</h3><pre># Rejoindre le domaine AD\nnet ads join -U administrator\n\n# Verifier l\'adhesion\nnet ads info\n\n# Lister les utilisateurs AD accessibles\nwbinfo -u</pre><h2>SOFS Recycle — Corbeille Distribuee</h2><p>La SOFS Recycle est une fonctionnalite de <strong>corbeille versionnee</strong> qui permet de recuperer des fichiers supprimes. Quand un fichier est supprime, au lieu d\'etre detruit, il est deplace dans un repertoire <code>.recycle</code> special.</p><h3>Trois modes de fonctionnement</h3><table><tr><th>Mode</th><th>Parametre</th><th>Qui voit .recycle</th><th>Qui peut restaurer/vider</th></tr><tr><td>Invisible</td><td>invisible=true</td><td>Admin uniquement (hidden)</td><td>Admin uniquement</td></tr><tr><td>Privileged</td><td>privileged=true</td><td>Tout le monde</td><td>Admin uniquement</td></tr><tr><td>Standard</td><td>privileged=false</td><td>Tout le monde</td><td>Owner du fichier + Admin</td></tr></table><h3>Structure de /etc/scality/sfused.conf</h3><pre>{\n  "recycle": {\n    "enable": true,\n    "versioning": true,    // garder plusieurs versions du meme fichier\n    "privileged": false,   // owner peut restaurer\n    "root_name": ".recycle"\n  },\n  "lifecycle_policy": {\n    "enable": true,\n    "base_path": ".recycle",\n    "max_versions_per_hour": 60,\n    "max_versions_per_day": 999999,\n    "max_versions_per_week": 999999,\n    "max_versions_per_month": 999999,\n    "time_frame_days": 31,     // garder pendant 31 jours max\n    "workers": 4\n  }\n}</pre><div class="alert alert-d">La lifecycle_policy est OBLIGATOIRE si la Recycle est activee. Sans elle, la corbeille grossit indefiniment jusqu\'a saturer le volume SOFS et bloquer toutes les ecritures.</div><h2>Quotas SOFS</h2><p>Les quotas SOFS permettent de limiter l\'espace utilise au niveau du volume, d\'un utilisateur ou d\'un groupe. Ils sont geres via l\'<strong>adminapi REST</strong> de sfused (socket Unix local) :</p><h3>Types de quotas</h3><ul><li><strong>Quota volume</strong> : taille maximale du volume SOFS entier</li><li><strong>Quota utilisateur</strong> : espace max par utilisateur (UID)</li><li><strong>Quota groupe</strong> : espace max par groupe (GID)</li></ul><h3>Commandes de gestion des quotas</h3><pre># Recuperer le socket adminapi\nSOCKET=$(cat /var/run/scality/scality-sfused-adminapi)\n\n# Lire le quota volume actuel\ncurl -s $SOCKET/fs/quota/volume | python3 -m json.tool\n\n# Modifier le quota volume (editer /tmp/volume_quota.json)\ncurl -s $SOCKET/fs/quota/volume --output /tmp/volume_quota.json\nvim /tmp/volume_quota.json\ncurl -s -XPUT $SOCKET/fs/quota/volume -T /tmp/volume_quota.json\n\n# Quota utilisateur (uid 1234)\ncurl -s $SOCKET/fs/quota/user/1234 | python3 -m json.tool</pre><div class="kbox"><h3>Points Cles a Retenir</h3><ul><li>sfused = driver FUSE qui traduit les syscalls POSIX en operations RING (sproxyd)</li><li>membershipd = enregistrement du connector dans ZooKeeper</li><li>DLM + ZooKeeper = OBLIGATOIRE si plusieurs connectors acces au meme volume</li><li>CTDB = VIP failover + clustering Samba pour la HA SMB</li><li>vfs objects : "ring" doit TOUJOURS etre en PREMIER position</li><li>Recycle Recycle : 3 modes ; lifecycle_policy OBLIGATOIRE pour eviter saturation</li><li>Quotas : volume / user / group via adminapi REST sur socket Unix local</li></ul></div>',
quiz:[
  {q:"Que signifie SOFS ?",opts:["Scality Object File System","Scale-Out File System","Secure Object File Store","Shared Object FUSE System"],ans:1,expl:"SOFS = Scale-Out File System. C'est le système de fichiers distribué Scality exposant une interface POSIX (NFS/SMB) au-dessus du ring d'objets."},
  {q:"Quel composant expose le namespace SOFS comme un point de montage local ?",opts:["biziod","repd","sfused","bucketd"],ans:2,expl:"sfused est le daemon FUSE qui monte le namespace SOFS comme un répertoire local POSIX. NFS et Samba/SMB s'appuient sur ce montage pour exporter le filesystem aux clients."},
  {q:"Quel est le rôle de CTDB dans SOFS ?",opts:["Stocker les métadonnées SOFS dans LevelDB","Couche de métadonnées distribuée Samba pour partager les sessions SMB entre noeuds","Gérer les quotas utilisateur","Chiffrer les données SOFS"],ans:1,expl:"CTDB (Clustered TDB) est utilisé par Samba dans SOFS pour partager les informations de sessions SMB entre les noeuds du cluster, assurant la transparence pour les clients Windows."},
  {q:"Que fait le DLM dans l'architecture SOFS ?",opts:["Distribue les données sur les disques","Gestionnaire de verrous distribués pour coordonner les accès concurrents aux fichiers","Gère la réplication entre sites","Monitore l'espace disque"],ans:1,expl:"DLM (Distributed Lock Manager) coordonne les accès concurrents aux fichiers entre noeuds SOFS. Sans DLM, deux noeuds pourraient modifier le même fichier simultanément et corrompre les données."},
  {q:"Quel protocole les clients Linux/Unix utilisent-ils pour accéder à SOFS ?",opts:["SMB/CIFS","iSCSI","NFS","WebDAV"],ans:2,expl:"Les clients Linux/Unix utilisent NFS pour accéder à SOFS. Les clients Windows utilisent SMB via Samba. sfused expose le même namespace SOFS aux deux protocoles."},
  {q:"Pourquoi SOFS utilise-t-il un DLM plutôt que de laisser chaque noeud gérer ses propres verrous ?",opts:["Le DLM est obligatoire par NFS v4","Sans DLM centralisé, deux clients sur deux noeuds différents pourraient écrire simultanément dans le même fichier, causant une corruption silencieuse","Le DLM améliore les performances de lecture","Le DLM remplace CTDB dans les nouvelles versions"],ans:1,expl:"SOFS est un filesystem distribué : plusieurs noeuds servent les clients en parallèle. Le DLM garantit l'exclusion mutuelle sur les fichiers en coordonnant les verrous entre noeuds, garantissant la cohérence POSIX (une seule écriture à la fois par fichier)."},
  {q:"Que se passe-t-il si sfused tombe sur un noeud SOFS servant des clients NFS ?",opts:["Les autres noeuds prennent automatiquement le relais sans interruption","Les clients NFS montés sur ce noeud perdent l'accès ; il faut redémarrer sfused ou rediriger les clients vers un autre noeud","CTDB bascule automatiquement les connexions NFS","Les données sont perdues"],ans:1,expl:"sfused est le point d'accès au namespace SOFS sur ce noeud. Sa chute interrompt les accès NFS/SMB sur ce noeud. Les clients doivent être redirigés (via DNS round-robin ou VIP) vers un autre noeud SOFS encore actif. Les données ne sont pas perdues car elles sont dans le ring."},
  {q:"Comment SOFS expose-t-il un namespace cohérent à tous les noeuds alors que chacun a son propre sfused ?",opts:["Chaque noeud a sa propre copie indépendante du namespace","Tous les sfused accèdent au même namespace dans le ring RING via MESA pour les métadonnées et le ring DATA pour les données, garantissant une vue cohérente","Un noeud maître détient le namespace réel","Le namespace est synchronisé toutes les 5 minutes"],ans:1,expl:"SOFS stocke les métadonnées du filesystem (inodes, répertoires) dans MESA (cohérence Raft) et les données dans le ring DATA. Tous les noeuds sfused lisent/écrivent dans ce même stockage partagé, garantissant une vue cohérente du namespace quel que soit le noeud accédé."}
]},
{id:'MB',num:'B',title:'Procedure d\'Upgrade RING',desc:'Prerequis, chemins de version, sequence Supervisor -> Storage -> Connectors',
content:'<h2>Principes Fondamentaux de l\'Upgrade RING</h2><p>Un upgrade RING est une <strong>operation critique</strong> qui doit etre planifiee rigoureusement. La regle d\'or : <strong>un seul composant a la fois, dans l\'ordre prescrit, avec validation a chaque etape</strong>. Un upgrade mal execute peut causer une interruption de service ou, dans les cas extremes, une perte de donnees.</p><h2>Matrice de Compatibilite des Versions</h2><div class="alert alert-d">Upgrade direct RING 7 vers RING 9 : STRICTEMENT INTERDIT. La base de donnees MESA et le format des containers Biziod ont change de facon incompatible entre RING 7 et RING 9. Un upgrade direct corromprait les donnees.</div><table><tr><th>Version source</th><th>Version cible</th><th>Chemin</th></tr><tr><td>RING 7.x</td><td>RING 9.x</td><td>INTERDIT direct. Aller RING 7 -> RING 8 -> RING 9</td></tr><tr><td>RING 8.x</td><td>RING 9.5.2</td><td>Direct supporte</td></tr><tr><td>RING 9.0 - 9.4</td><td>RING 9.5.2</td><td>Direct supporte</td></tr><tr><td>SOFS connectors &lt; 8.5.8.7</td><td>RING 9</td><td>Upgrade intermediaire obligatoire vers 8.5.8.7 d\'abord</td></tr><tr><td>SOFS connectors 9.0 ou 9.1</td><td>RING 9.2+</td><td>Arreter TOUS les connectors du volume avant d\'upgrader le premier</td></tr></table><h3>Cas special SOFS 9.0/9.1 -> 9.2+</h3><p>Entre RING 9.1 et 9.2, le <strong>format de stockage des metadonnees SOFS a change</strong>. Un connector 9.1 et un connector 9.2 sur le meme volume sont incompatibles. La procedure est :</p><ol><li>Arreter TOUS les connectors SOFS du volume simultanement</li><li>Upgrader tous les connectors en une seule fenetre de maintenance</li><li>Redemarrer tous les connectors</li></ol><h2>Prerequis — Checklist Pre-Upgrade</h2><h3>1. Ticket Scality Support (OBLIGATOIRE)</h3><p>Avant tout upgrade, <strong>ouvrir un ticket Scality Support</strong> est OBLIGATOIRE. L\'equipe Support :</p><ul><li>Valide que l\'environnement est pret pour l\'upgrade (version courante, OS, espace disque)</li><li>Confirme le chemin de version exact (pas d\'etape intermediaire oubliee)</li><li>Est disponible pour assister en cas de probleme pendant l\'upgrade</li></ul><h3>2. Terminal persistant (Tmux ou Screen)</h3><p>Une deconnexion SSH en milieu d\'upgrade est catastrophique. Tmux et Screen maintiennent la session active meme si la connexion est interrompue :</p><pre># Demarrer une session tmux\ntmux new -s upgrade\n\n# Se rattacher apres deconnexion\ntmux attach -t upgrade\n\n# Ou avec Screen\nscreen -S upgrade\nscreen -r upgrade  # rattachement</pre><h3>3. Verifications pre-upgrade</h3><pre># Verifier le RING est en etat RUN\nringsh supervisor ringList\nringsh supervisor ringStatus &lt;RING&gt;\n\n# Verifier l\'espace /var\ndf -h /var\n\n# Verifier PermitRootLogin\ngrep PermitRootLogin /etc/ssh/sshd_config\n\n# Verifier la version scaldisk (doit = version RING courante)\nscaldisk --version</pre><h3>4. Cas CRR pre-upgrade</h3><div class="alert alert-w">Si le Cross-Region Replication (CRR) est active sur le S3 Connector ET que vous upgradez depuis une version &lt; 9.5.2.0, une <strong>procedure de pre-upgrade CRR obligatoire</strong> doit etre executee. Elle vide les queues de replication en attente avant l\'upgrade pour eviter toute corruption. Contacter Scality Support pour la procedure exacte.</div><h2>Sequence Complete d\'Upgrade</h2><div class="adiag">PHASE 1 : PREPARATION\n  1. Verifier versions + matrice de compatibilite\n  2. Ouvrir ticket Scality Support\n  3. Executer CRR pre-upgrade si applicable\n  4. Ouvrir terminal Tmux/Screen\n  5. Verifier etat RING : RUN obligatoire\n  6. Telecharger archive .run + verifier sha256\n  7. Uploader sur le Supervisor\n  8. chmod +x installer.run\n  9. FORCE_PY3=1 ./installer.run -y --extract-only\n 10. Verifier role Prometheus (si upgrade depuis &lt; 9.5.0)\n 11. /srv/scality/bin/precheck_upgrade --offline\n 12. Migration SSO si upgrade depuis &lt; 9.4.0.0\n\nPHASE 2 : UPGRADE SUPERVISOR\n 13. /srv/scality/scripts/prepare_upgrade\n     -> Attendre : "prepare_upgrade completed successfully"\n 14. salt \'*\' state.sls scality.req.platform.kernel\n     -> Met a jour les parametres kernel sysctl sur tous les serveurs\n 15. /srv/scality/scripts/supervisor_upgrade\n     -> Attendre : "supervisor_upgrade completed successfully"\n     -> Le Supervisor redemmarre\n     -> L\'UI affiche CONF_MISMATCH -> NORMAL, NE PAS CLIQUER Apply Config\n\nPHASE 3 : UPGRADE STORAGE SERVERS (un par un)\n 16. Pour chaque storage server :\n     a. Entrer en mode maintenance (tous les RINGs)\n     b. Verifier etat RING : RUN ou CONF_MISMATCH uniquement\n     c. nodeLeave -> attendre etat OUT_OF_SERVICE\n     d. systemctl stop scality-node\n     e. yum update packages scality\n     f. systemctl start scality-node\n     g. nodeJoin -> attendre etat RUN\n     h. Appliquer logging + sagentd\n     i. Passer au serveur SUIVANT seulement si RUN\n 17. Exit maintenance mode (tous les RINGs)\n\nPHASE 4 : UPGRADE CONNECTORS SOFS (si applicable)</div><h2>Phase 3 — Upgrade d\'un Storage Server en Detail</h2><h3>Etape a : Mode maintenance</h3><pre># Pour CHAQUE RING du cluster\nfor RING in $(ringsh supervisor ringList | grep -v "^$"); do\n  echo "Maintenance mode pour RING: $RING"\n  ringsh supervisor ringConfigSet ${RING} join_auto 0\n  ringsh supervisor ringConfigSet ${RING} rebuild_auto 0\n  ringsh supervisor ringConfigSet ${RING} chordpurge_enable 0\ndone</pre><h3>Etape b : Verifier l\'etat du RING</h3><pre>ringsh supervisor ringStatus &lt;RING&gt;\n# Doit afficher : RUN ou CONF_MISMATCH RUN\n# JAMAIS commencer si : INCOMPLETE, SPLIT LOOP, ARC_REBUILD_NOK</pre><h3>Etape c : nodeLeave</h3><pre># Retirer tous les nodes du serveur du RING\nfor NODE in $(ringsh supervisor nodeList &lt;RING&gt; | grep storage_server_name); do\n  ringsh supervisor nodeLeave ${NODE}:/\ndone\n# Attendre que tous les nodes soient en etat OUT_OF_SERVICE\nwatch -n5 "ringsh supervisor nodeList &lt;RING&gt;"</pre><h3>Etapes d-e-f : Upgrade packages</h3><pre># Sur le serveur storage (via SSH)\nsystemctl stop scality-node\n\n# Deverrouiller les packages (si RING >= 8.3.0)\nyum versionlock delete python3-scaldisk scality-node\n\n# Mettre a jour les packages Scality\nyum update --disableplugin=versionlock \\*scality\\*\nyum clean all\n\ndystemctl start scality-node</pre><h3>Etape g : nodeJoin et validation</h3><pre># Rejoindre le RING\nfor NODE in $(ringsh supervisor nodeList &lt;RING&gt; | grep storage_server_name); do\n  ringsh supervisor nodeJoin ${NODE}:/\ndone\n\n# Attendre l\'etat RUN\nwatch -n5 "ringsh supervisor ringStatus &lt;RING&gt;"\n# NE PAS passer au serveur suivant avant d\'avoir RUN</pre><h3>Etape h : Appliquer la configuration de logging</h3><pre>salt-call state.apply scality.node.log\nsalt-call state.apply scality.sagentd.registered</pre><h3>Etape 17 : Sortie du mode maintenance (APRES tous les serveurs)</h3><pre>for RING in $(ringsh supervisor ringList | grep -v "^$"); do\n  ringsh supervisor ringConfigSet ${RING} join_auto 2\n  ringsh supervisor ringConfigSet ${RING} rebuild_auto 1\n  ringsh supervisor ringConfigSet ${RING} chordpurge_enable 1\ndone</pre><h2>Phase 4 — Upgrade des Connectors SOFS</h2><p>Les connectors SOFS sont upgrages <strong>en dernier</strong>, apres tous les storage nodes. Regles importantes :</p><ul><li>Les connectors SOFS peuvent generalement etre upgrages un par un (service continu si plusieurs connectors par volume)</li><li><strong>Exception SOFS 9.1 -> 9.2+</strong> : tous les connectors du volume doivent etre arretes avant d\'upgrader le premier (voir matrice de compatibilite)</li><li>Avant l\'upgrade d\'un connector : verifier que sfused et membershipd sont en etat sain</li><li>Apres l\'upgrade : verifier que le volume est monte et accessible</li></ul><pre># Pre-check connector SOFS avant upgrade\nsystemctl status scality-sfused\nsystemctl status scality-membershipd\ndf -h /sofs/volume1  # verifier le montage</pre><div class="kbox"><h3>Points Cles a Retenir</h3><ul><li>RING 7 -> RING 9 INTERDIT directement : passer par RING 8 obligatoirement</li><li>Ticket Scality Support OBLIGATOIRE avant de commencer</li><li>Tmux/Screen OBLIGATOIRE : une deconnexion SSH en cours d\'upgrade est catastrophique</li><li>Ordre strict : Supervisor -> Storage Servers (UN PAR UN) -> Connectors SOFS</li><li>Entre chaque storage server : attendre RUN (CONF_MISMATCH accepte, INCOMPLETE interdit)</li><li>CONF_MISMATCH post-upgrade Supervisor = NORMAL, NE PAS cliquer Apply Config</li><li>CRR pre-upgrade : obligatoire si CRR actif et upgrade depuis &lt; 9.5.2.0</li></ul></div>',
quiz:[
  {q:"Dans quel ordre doit-on upgrader les composants RING ?",opts:["Storage -> Supervisor -> Connectors","Connectors -> Storage -> Supervisor","Supervisor -> Storage -> Connectors","Tous en parallèle"],ans:2,expl:"L'ordre correct est Supervisor d'abord (gestionnaire de processus), puis Storage (noeuds de stockage), puis Connectors (protocoles d'accès). Cet ordre garantit que les services sont opérationnels avant que les accès clients soient rétablis."},
  {q:"Que doit-on vérifier avant de lancer un upgrade RING ?",opts:["Que tous les disques sont pleins","Les prérequis : version source/cible, santé du ring (nodeList), espace disque, backups","Que CRR est désactivé","Que tous les clients sont déconnectés"],ans:1,expl:"Avant tout upgrade : vérifier la compatibilité des versions (chemin d'upgrade supporté), l'état de santé du ring via nodeList, l'espace disque disponible et la présence de backups des configurations."},
  {q:"Que signifie LUKS dans le contexte de la sécurité RING ?",opts:["Linux Unified Key Setup : chiffrement de disque au repos","Linux Update Key System : gestion des updates","Layered Unix Key Storage : coffre-fort de clés","Local User Key Service : service IAM"],ans:0,expl:"LUKS (Linux Unified Key Setup) est le standard de chiffrement de disque Linux. Scality l'utilise pour le chiffrement at-rest des disques des noeuds, protégeant les données en cas de vol physique."},
  {q:"Quel protocole permet le déchiffrement automatique des disques LUKS au démarrage ?",opts:["KMIP","NBDE avec serveur Tang","SSL/TLS","KMS AWS"],ans:1,expl:"NBDE (Network-Bound Disk Encryption) avec un serveur Tang permet le déchiffrement automatique au démarrage si le noeud peut joindre le serveur Tang. Si le noeud est volé et isolé, les disques restent chiffrés."},
  {q:"Qu'est-ce que KMIP dans le contexte Scality ?",opts:["Key Management Interoperability Protocol : protocole standard pour les systèmes de gestion de clés","Kubernetes Monitoring Integration Platform","Key Metadata Index Protocol","Scality n'utilise pas KMIP"],ans:0,expl:"KMIP est un protocole standard d'interopérabilité pour les KMS. Scality supporte KMIP pour intégrer des KMS externes (Thales, HashiCorp Vault, etc.) pour la gestion des clés de chiffrement."},
  {q:"Quel est l'impact d'un upgrade sur les SLA de disponibilité des données ?",opts:["Les données sont inaccessibles pendant tout l'upgrade","L'upgrade est rolling : les données restent accessibles, seul un sous-ensemble de noeuds est indisponible à la fois","L'upgrade nécessite un arrêt complet du ring","L'upgrade n'affecte pas les SLA"],ans:1,expl:"L'upgrade RING est conçu en rolling (glissant) : les noeuds sont upgradés les uns après les autres. Le ring continue à servir les requêtes avec les noeuds déjà upgradés, minimisant l'impact."},
