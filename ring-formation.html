<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scality RING — Formation Interactive</title>
<style>
:root{--bg:#0f1117;--bg2:#1a1f2e;--bg3:#242938;--bg4:#2d3346;--acc:#f26522;--acc2:#ff8c4a;--ok:#22c55e;--err:#ef4444;--warn:#f59e0b;--info:#3b82f6;--t1:#e2e8f0;--t2:#94a3b8;--t3:#64748b;--bdr:#2d3346;--code:#0a0d14}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--t1);display:flex;min-height:100vh;overflow:hidden}
.sb{width:252px;min-width:252px;background:var(--bg2);border-right:1px solid var(--bdr);display:flex;flex-direction:column;height:100vh;overflow-y:auto}
.sb-logo{padding:18px 16px;border-bottom:1px solid var(--bdr)}
.sb-logo h1{font-size:15px;font-weight:800;color:var(--acc);letter-spacing:.3px}
.sb-logo p{font-size:11px;color:var(--t3);margin-top:2px}
.sb-nav{flex:1;padding:8px 0}
.nav-sec{padding:10px 16px 4px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--t3)}
.ni{display:flex;align-items:center;gap:8px;padding:9px 14px;cursor:pointer;transition:all .15s;border-left:3px solid transparent;font-size:12.5px;color:var(--t2)}
.ni:hover{background:var(--bg4);color:var(--t1)}
.ni.active{background:rgba(242,101,34,.12);border-left-color:var(--acc);color:var(--acc)}
.ni .nid{font-size:10px;font-weight:700;background:var(--bg3);padding:2px 5px;border-radius:4px;min-width:26px;text-align:center}
.ni.active .nid{background:var(--acc);color:#fff}
.ni .ntxt{flex:1;line-height:1.3}
.ni .nbadge{font-size:10px;padding:1px 6px;border-radius:8px;font-weight:600}
.ni.done .nbadge{background:rgba(34,197,94,.15);color:var(--ok)}
.ni.partial .nbadge{background:rgba(245,158,11,.15);color:var(--warn)}
.sb-foot{padding:14px;border-top:1px solid var(--bdr)}
.tot-box{background:var(--bg3);border-radius:8px;padding:12px;text-align:center}
.tot-box .tl{font-size:11px;color:var(--t3);margin-bottom:2px}
.tot-box .tv{font-size:26px;font-weight:800;color:var(--acc);line-height:1}
.tot-box .ts{font-size:11px;color:var(--t2);margin-top:2px}
.main{flex:1;overflow-y:auto;height:100vh}
.home{padding:36px 40px;display:none}
.home.show{display:block}
.home-hdr h1{font-size:28px;font-weight:800;background:linear-gradient(135deg,var(--acc),#ff9d6e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
.home-hdr p{color:var(--t2);font-size:14px;margin-bottom:28px}
.stats-row{display:flex;gap:12px;margin-bottom:28px}
.stat-card{background:var(--bg3);border:1px solid var(--bdr);border-radius:10px;padding:14px 18px;flex:1}
.stat-card .sv{font-size:22px;font-weight:800}
.stat-card .sl{font-size:11px;color:var(--t3);margin-top:2px}
.sv.col-acc{color:var(--acc)}.sv.col-ok{color:var(--ok)}.sv.col-info{color:#93c5fd}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.mc{background:var(--bg3);border:1px solid var(--bdr);border-radius:12px;padding:18px;cursor:pointer;transition:all .2s;position:relative}
.mc:hover{border-color:var(--acc);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.35)}
.mc.done{border-color:rgba(34,197,94,.3)}
.mc .mid{font-size:10px;font-weight:700;color:var(--acc);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.mc .mtit{font-size:15px;font-weight:600;margin-bottom:6px;line-height:1.3}
.mc .mdesc{font-size:12px;color:var(--t3);line-height:1.5}
.mc .mfoot{margin-top:14px;display:flex;align-items:center;gap:8px}
.pbar{flex:1;height:4px;background:var(--bg2);border-radius:2px;overflow:hidden}
.pfill{height:100%;border-radius:2px;transition:width .4s}
.pfill.acc{background:var(--acc)}.pfill.ok{background:var(--ok)}
.msc{font-size:11px;color:var(--t3);white-space:nowrap}
.mp{display:none;flex-direction:column;height:100vh}
.mp.show{display:flex}
.mphdr{padding:18px 32px;border-bottom:1px solid var(--bdr);background:var(--bg2);display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:10;flex-shrink:0}
.backbtn{background:var(--bg3);border:1px solid var(--bdr);color:var(--t2);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px;transition:all .15s}
.backbtn:hover{border-color:var(--acc);color:var(--acc)}
.mphdr-info{flex:1}
.mph-id{font-size:10px;color:var(--acc);font-weight:700;text-transform:uppercase;letter-spacing:1px}
.mph-title{font-size:18px;font-weight:700}
.tabs{display:flex;gap:4px}
.tbtn{padding:7px 14px;border-radius:6px;border:1px solid var(--bdr);background:transparent;color:var(--t2);cursor:pointer;font-size:12.5px;transition:all .15s}
.tbtn.active{background:var(--acc);border-color:var(--acc);color:#fff}
.mpbody{flex:1;overflow-y:auto}
.theory{padding:28px 36px;max-width:860px;display:none}
.theory.show{display:block}
.theory h2{font-size:18px;font-weight:700;color:var(--acc);margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--bdr)}
.theory h2:first-child{margin-top:0}
.theory h3{font-size:14px;font-weight:600;margin:16px 0 6px;color:var(--t1)}
.theory p{margin-bottom:10px;color:var(--t2);font-size:13.5px;line-height:1.7}
.theory ul,.theory ol{margin:6px 0 10px 20px;color:var(--t2);font-size:13.5px}
.theory li{margin-bottom:5px;line-height:1.6}
.theory strong{color:var(--t1)}
code{background:var(--code);color:#7dd3fc;padding:2px 5px;border-radius:3px;font-family:'SF Mono','Fira Code',monospace;font-size:11.5px}
pre{background:var(--code);border:1px solid var(--bdr);border-radius:8px;padding:14px;overflow-x:auto;margin:10px 0;font-family:'SF Mono','Fira Code',monospace;font-size:11.5px;line-height:1.7;color:#a5f3fc}
pre code{background:none;padding:0;color:inherit}
.theory table{width:100%;border-collapse:collapse;margin:10px 0;font-size:13px}
.theory th{background:var(--bg3);padding:9px 11px;text-align:left;font-weight:600;color:var(--t1);border-bottom:2px solid var(--acc)}
.theory td{padding:9px 11px;border-bottom:1px solid var(--bdr);color:var(--t2);vertical-align:top}
.theory tr:hover td{background:rgba(255,255,255,.02)}
.alert{border-radius:7px;padding:11px 14px;margin:10px 0;font-size:12.5px;display:flex;gap:8px;line-height:1.5}
.alert-w{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);color:#fbbf24}
.alert-i{background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.3);color:#93c5fd}
.alert-d{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#fca5a5}
.alert-s{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);color:#86efac}
.kbox{background:rgba(242,101,34,.06);border:1px solid rgba(242,101,34,.2);border-radius:9px;padding:14px 18px;margin:18px 0}
.kbox h3{color:var(--acc)!important;margin-top:0!important;font-size:11.5px!important;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px!important}
.kbox ul{margin:0!important;list-style:none!important}
.kbox li{padding:3px 0;display:flex;gap:8px;color:var(--t2);font-size:13px}
.kbox li::before{content:'→';color:var(--acc);flex-shrink:0}
.adiag{background:var(--code);border:1px solid var(--bdr);border-radius:7px;padding:14px;font-family:'SF Mono',monospace;font-size:11.5px;line-height:1.9;color:#7dd3fc;margin:10px 0;white-space:pre;overflow-x:auto}
.quiz{padding:28px 36px;max-width:780px;display:none}
.quiz.show{display:block}
.quiz-hdr{margin-bottom:22px}
.quiz-hdr h2{font-size:18px;font-weight:700;margin-bottom:3px}
.quiz-hdr p{color:var(--t3);font-size:12.5px}
.qcard{background:var(--bg3);border:1px solid var(--bdr);border-radius:11px;padding:18px;margin-bottom:14px;transition:border-color .2s}
.qcard.answered{border-color:var(--bg4)}
.qnum{font-size:10px;color:var(--acc);font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:7px}
.qtxt{font-size:14px;font-weight:500;margin-bottom:14px;line-height:1.5;color:var(--t1)}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{display:flex;align-items:flex-start;gap:9px;padding:9px 13px;background:var(--bg2);border:1px solid var(--bdr);border-radius:7px;cursor:pointer;transition:all .15s;font-size:13px;color:var(--t2);line-height:1.5}
.opt:hover:not(.locked){border-color:var(--acc);color:var(--t1);background:var(--bg4)}
.opt.sel{border-color:var(--acc);background:rgba(242,101,34,.1);color:var(--t1)}
.opt.correct{border-color:var(--ok);background:rgba(34,197,94,.1);color:#86efac}
.opt.wrong{border-color:var(--err);background:rgba(239,68,68,.1);color:#fca5a5}
.opt.locked{cursor:default}
.opt .ol{font-weight:700;color:var(--acc);min-width:14px;flex-shrink:0;margin-top:1px}
.opt.correct .ol,.opt.wrong .ol{color:inherit}
.expl{margin-top:10px;padding:9px 13px;background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.2);border-radius:7px;font-size:12px;color:#93c5fd;display:none;line-height:1.5}
.expl.show{display:block}
.qa{margin-top:20px;display:flex;gap:10px;align-items:center}
.btn{padding:9px 18px;border-radius:7px;border:none;cursor:pointer;font-size:13.5px;font-weight:500;transition:all .15s}
.btn-p{background:var(--acc);color:#fff}.btn-p:hover{background:var(--acc2)}
.btn-s{background:var(--bg3);color:var(--t2);border:1px solid var(--bdr)}.btn-s:hover{border-color:var(--acc);color:var(--acc)}
.btn-ok{background:var(--ok);color:#fff}.btn-ok:hover{background:#16a34a}
.btn-i{background:var(--info);color:#fff}.btn-i:hover{background:#2563eb}
.result-box{background:var(--bg3);border-radius:12px;padding:24px;margin-top:20px;text-align:center;display:none}
.result-box.show{display:block}
.rscore{font-size:52px;font-weight:800;margin:10px 0 4px}
.rscore.ex{color:var(--ok)}.rscore.gd{color:var(--warn)}.rscore.po{color:var(--err)}
.rlabel{font-size:17px;font-weight:600;margin-bottom:6px}
.rmsg{font-size:13px;color:var(--t3);margin-bottom:18px}
.rnext{display:flex;gap:10px;justify-content:center}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:3px}
</style>
</head>

<script>
var MODS=[
{id:'M1',num:'01',title:'Architecture RING',desc:'Structure 4 couches, routage P2P, Bizstorenode et Biziod',
content:'<h2>Qu\'est-ce que le Scality RING ?</h2><p>Le RING est une solution de <strong>stockage objet distribue scale-out</strong> developpe par Scality. Il stocke des objets (fichiers, blobs, donnees binaires) de facon redondante sur un cluster de serveurs physiques standards. Ses caracteristiques fondamentales sont :</p><ul><li><strong>Scalabilite horizontale (scale-out)</strong> : on ajoute des serveurs au cluster pour augmenter la capacite et les performances, sans interruption de service.</li><li><strong>Pas de point unique de defaillance (SPOF)</strong> : il n\'existe aucun noeud maitre, aucun coordinateur central. Tout noeud peut traiter n\'importe quelle requete.</li><li><strong>Adressage par contenu</strong> : chaque objet est identifie par un identifiant unique (hash ou cle) qui determine mechaniquement sa localisation dans le cluster.</li><li><strong>Durabilite configurable</strong> : la redundance est ajustable — replication simple (COS) pour les petits objets et metadonnees, erasure coding (ARC) pour les grands objets.</li></ul><h2>Architecture en 4 Couches</h2><p>Le RING est organise en <strong>4 couches superposees</strong> a responsabilites distinctes. Cette separation permet de faire evoluer chaque couche independamment :</p><div class="adiag">  APPLICATIONS CLIENTES (S3 SDK, NFS, SMB, HTTP...)\n          |\n+--------------------------------------------------+\n|  COUCHE 1 : CONNECTORS                          |\n|  S3 . sproxyd . NFSv3 . NFSv4 . SMB . FUSE . CDMI  |\n|  Traduit le protocole client en operations RING  |\n+--------------------------------------------------+\n          |\n+--------------------------------------------------+\n|  COUCHE 2 : STORAGE NODES (Bizstorenode)        |\n|  6 nodes virtuels par serveur physique          |\n|  Possede un segment du keyspace P2P global      |\n|  Route ou repond aux requetes objet             |\n+--------------------------------------------------+\n          |\n+--------------------------------------------------+\n|  COUCHE 3 : IO DAEMONS (Biziod)                 |\n|  1 daemon par disque physique                   |\n|  Ecrit/lit dans les fichiers container sur HDD  |\n|  Maintient l\'index de cles sur SSD              |\n+--------------------------------------------------+\n          |\n+--------------------------------------------------+\n|  COUCHE 4 : STOCKAGE PHYSIQUE                   |\n|  SSD : index Biziod (lookups rapides)           |\n|  HDD : fichiers container (donnees brutes)      |\n+--------------------------------------------------+</div><h2>Couche 1 — Les Connectors</h2><p>Les <strong>Connectors</strong> sont les points d\'entree du RING pour les applications clientes. Chaque connector traduit un protocole standard en operations internes RING (PUT, GET, DELETE sur un objet identifie par sa cle) :</p><table><tr><th>Connector</th><th>Protocole</th><th>Cas d\'usage</th></tr><tr><td>S3 Connector</td><td>HTTP/S3 AWS-compatible</td><td>Applications cloud-native, backup, archivage</td></tr><tr><td>sproxyd</td><td>HTTP REST natif Scality</td><td>Applications internes Scality, SOFS</td></tr><tr><td>NFSv3 / NFSv4</td><td>NFS</td><td>Acces fichiers Linux, montages NFS classiques</td></tr><tr><td>SMB/CIFS</td><td>SMB 3.0</td><td>Partages Windows, Active Directory</td></tr><tr><td>FUSE</td><td>POSIX/FUSE</td><td>Montage local direct sur le serveur connector</td></tr><tr><td>CDMI</td><td>CDMI/HTTP</td><td>API standard SNIA Cloud Storage</td></tr></table><p>Les Connectors sont <strong>decoples des Storage Nodes</strong> : ils peuvent etre sur des serveurs dedies ou co-localises selon l\'architecture. Un Connector defaillant n\'affecte pas la disponibilite des donnees — un autre Connector sur un autre serveur prend le relais.</p><h2>Couche 2 — Le Bizstorenode (Storage Node Virtuel)</h2><p>Le <strong>Bizstorenode</strong> est le noeud de stockage virtuel. C\'est le composant central du RING au niveau logiciel. Voici ses caracteristiques detaillees :</p><h3>Multiples instances par serveur physique</h3><p>Un serveur physique heberge <strong>exactement 6 Bizstorenode</strong>. Ce nombre n\'est pas arbitraire : il permet de presenter suffisamment de segments distincts dans le keyspace global pour garantir un bon equilibre de charge et une distribution uniforme des donnees, meme sur de petits clusters.</p><h3>Le keyspace et le routage P2P</h3><p>L\'ensemble des objets possibles est defini par un <strong>espace d\'adresses (keyspace)</strong> — un espace circulaire de hashes (par exemple 0 a 2^128). Cet espace est decoupu en segments, et chaque Bizstorenode est responsable d\'un ou plusieurs segments :</p><div class="adiag">Keyspace circulaire (vue simplifiee 3 serveurs = 18 Bizstorenode) :\n\n        0                  2^128\n        +------+------+------+------+------+------+\n        | bsn1 | bsn2 | bsn3 | bsn4 | ... | bsn18|\n        +------+------+------+------+------+------+\n            |                       |\n        Serveur 1               Serveur 3\n\nHash(cle_objet) -> position dans le keyspace\n                -> Bizstorenode responsable identifie</div><p>Quand un Connector recoit un PUT ou GET, il calcule le hash de la cle de l\'objet, l\'envoie a n\'importe quel Bizstorenode du cluster. Ce Bizstorenode, grace a la table de routage P2P, sait s\'il est responsable de cette cle ou doit la <strong>router vers le bon node</strong> en O(log N) sauts maximum.</p><h3>Responsabilites du Bizstorenode</h3><ul><li><strong>Reception des requetes</strong> : recoit les PUT/GET/DELETE des Connectors</li><li><strong>Routage P2P</strong> : transmet la requete au node responsable si necessaire</li><li><strong>Gestion de la redondance</strong> : coordonne l\'ecriture des repliques COS ou des fragments ARC sur les Biziod cibles</li><li><strong>Maintenance du keyspace</strong> : lors d\'ajout/retrait de nodes, le Bizstorenode gere le transfert des segments (Relocation, Balance)</li><li><strong>Communication avec MESA</strong> : met a jour l\'index des objets dans la base distribuee interne</li></ul><h2>Couche 3 — Le Biziod (IO Daemon par Disque)</h2><p>Le <strong>Biziod</strong> (Biz IO Daemon) est le daemon d\'entree/sortie de bas niveau. Il est instancie a raison d\'<strong>un Biziod par disque physique</strong> du serveur. C\'est lui qui gere physiquement les lectures et ecritures.</p><h3>Separation Index / Donnees</h3><p>Le Biziod maintient deux structures de donnees fondamentalement separees sur deux types de supports differents :</p><table><tr><th>Structure</th><th>Support</th><th>Contenu</th><th>Pourquoi</th></tr><tr><td><strong>Index</strong></td><td>SSD</td><td>Table de correspondance : cle objet -> position dans le container HDD</td><td>Lookup O(1) sur chaque requete : la latence SSD (0.1ms) vs HDD (5ms) multiplie les IOPS par 50</td></tr><tr><td><strong>Donnees</strong></td><td>HDD</td><td>Contenu binaire brut des objets (ou fragments ARC)</td><td>Les HDD offrent le meilleur ratio capacite/cout pour les donnees sequentielles</td></tr></table><h3>Les fichiers container</h3><p>Sur le HDD, le Biziod n\'ecrit pas un fichier par objet (ce qui serait catastrophique pour le systeme de fichiers). Il utilise des <strong>fichiers container de taille fixe</strong> (pre-alloues) :</p><ul><li>Chaque container est un gros fichier pre-alloue sur le HDD (ex : 1 GB ou plus)</li><li>Les objets sont ecrits sequentiellement dans ces containers (append-only)</li><li>L\'index SSD pointe vers la position exacte (container + offset) de chaque objet</li><li>La pre-allocation elimine la fragmentation et les appels systeme <code>fallocate</code> repetes</li><li>Lors de la suppression d\'un objet, sa position est marquee "libre" dans l\'index — le Garbage Collector recycle ensuite cet espace</li></ul><h3>Avantages de cette architecture Biziod</h3><ul><li><strong>Isolation des pannes</strong> : un disque HDD qui tombe n\'affecte que son Biziod. Les autres Biziod sur le meme serveur continuent.</li><li><strong>Scalabilite interne</strong> : ajouter des disques = ajouter des Biziod = augmenter la capacite et le parallelisme I/O</li><li><strong>Predictabilite</strong> : les containers pre-alloues garantissent des performances I/O stables sans fragmentation</li></ul><h2>Couche 4 — Le Stockage Physique</h2><p>La couche physique distingue deux roles complementaires :</p><ul><li><strong>SSD (Solid State Drive)</strong> : exclusivement pour les index Biziod. Chaque disque HDD du serveur a son SSD associe. La regle absolue : <em>jamais l\'index sur HDD, jamais les donnees sur SSD</em>.</li><li><strong>HDD (Hard Disk Drive)</strong> : contient les fichiers container. La capacite brute du RING est la somme des HDD de tous les serveurs du cluster.</li></ul><div class="alert alert-w">Attention : si un SSD d\'index tombe en panne (sans perte du HDD de donnees associe), les donnees ne sont pas perdues mais l\'index doit etre reconstruit. Cette operation peut prendre plusieurs heures. Toujours utiliser des SSD en RAID1 ou surveiller leur sante via S.M.A.R.T.</div><h2>Le Protocole Peer-to-Peer — Fonctionnement Detaille</h2><p>Le RING n\'a <strong>aucun coordinateur central</strong>. Voici comment une requete GET est traitee :</p><ol><li>Le Connector calcule <code>hash(cle_objet)</code> et envoie la requete GET a n\'importe quel Bizstorenode du cluster.</li><li>Ce Bizstorenode consulte sa <strong>table de routage P2P locale</strong> pour determiner si la cle appartient a son segment ou a un autre node.</li><li>Si ce n\'est pas son segment, il <strong>route la requete vers le node responsable</strong> (en O(log N) sauts).</li><li>Le node responsable identifie les Biziod cibles (replication COS ou fragments ARC).</li><li>Les Biziod consultent leur index SSD, lisent les donnees depuis le container HDD et repondent.</li><li>La reponse remonte vers le Connector qui la renvoie au client.</li></ol><p>Ce modele sans coordinateur central elimine le goulot d\'etranglement habituel des architectures maitre/esclave et permet une scalabilite lineaire theorique.</p><h2>Configuration de Reference : RING 3 Serveurs</h2><p>Un cluster RING minimal de production comporte <strong>3 serveurs</strong>. Voici les parametres de redondance applicables dans cette configuration :</p><table><tr><th>Type de donnee</th><th>Mecanisme</th><th>Nombre</th><th>Tolerance</th></tr><tr><td>Grands objets (data)</td><td>ARC 7+5</td><td>12 fragments sur 3 serveurs</td><td>Perte de 5 fragments quelconques</td></tr><tr><td>Petits objets (data)</td><td>COS 3</td><td>3 copies integrales</td><td>Perte de 1 serveur complet</td></tr><tr><td>Metadonnees SOFS</td><td>COS 4+</td><td>4 copies minimum</td><td>Perte de 1 serveur complet</td></tr><tr><td>Metadonnees S3</td><td>COS 5</td><td>5 copies</td><td>Quorum majoritaire</td></tr></table><div class="alert alert-d">Regle absolue sur un RING 3 serveurs : ne jamais avoir 2 serveurs en panne simultanement. Avec seulement 1 serveur disponible, le quorum des metadonnees S3 (COS 5) ne peut plus etre garanti et les operations d\'ecriture seront bloquees.</div><h2>Scalabilite — Ajout de Serveurs</h2><p>Le RING est concu pour la croissance lineaire. Quand on ajoute un serveur :</p><ol><li>6 nouveaux Bizstorenode sont declares et rejoignent le cluster (nodeJoin).</li><li>Ces nouveaux nodes obtiennent des segments du keyspace des anciens nodes (Relocation).</li><li>Les objets correspondants sont migres automatiquement en arriere-plan (Balance).</li><li>La capacite totale et le parallelisme I/O augmentent lineairement.</li></ol><p>Il n\'y a pas de limite theorique au nombre de serveurs. Les clusters Scality en production peuvent atteindre plusieurs centaines de noeuds.</p><h2>Keyspace RING — Distribution des Donnees</h2><p>Le <strong>keyspace</strong> definit comment les cles d\'objets sont distribuees sur les noeuds du RING via le protocole Chord. C\'est la "carte" qui indique a quel bizstorenode appartient chaque cle.</p><h3>Fichiers du keyspace</h3><table><tr><th>Fichier</th><th>Role</th></tr><tr><td><code>keyspace.json</code></td><td>Configuration reelle du keyspace : repartition des segments de cles entre les bizstorenode. Genere par l\'outil ExVT Scality.</td></tr><tr><td><code>sprov_context.json</code></td><td>Contexte de provisionnement : configuration du cluster (nombre de serveurs, disques, protection ARC/COS).</td></tr><tr><td><code>sprov_model.json</code></td><td>Modele de provisionnement : parametres de calcul du keyspace optimal pour la configuration materielle.</td></tr></table><h3>Keyspace precompute vs custom</h3><p>Scality fournit des <strong>keyspaces precomputes</strong> pour les configurations standard (ex: 6 serveurs 2 sites, 12 serveurs 3 sites). Si la configuration n\'est pas standard (nombre inhabituel de serveurs, diskgroups specifiques), un <strong>keyspace custom</strong> doit etre calcule par l\'equipe ExVT Scality et applique manuellement apres installation.</p><pre># Appliquer un keyspace custom apres installation\nringsh supervisor nodeJoinAll DATA   # rejoindre tous les noeuds au RING DATA\nringsh supervisor nodeJoinAll META   # rejoindre tous les noeuds au RING META\n\n# Verifier via le dashboard RING Administration Interface\n# Operations -> Ring Status -> tous les noeuds IN_SERVICE</pre><p class="alert-i">Le keyspace impacte directement la distribution des donnees et la performance. Une mauvaise configuration du keyspace peut creer des "hot spots" (surcharge de certains noeuds). L\'equipe ExVT Scality valide et calcule les keyspaces pour garantir une distribution optimale.</p><div class="kbox"><h3>Points Cles a Retenir</h3><ul><li>4 couches distinctes : Connectors -> Bizstorenode -> Biziod -> Disques physiques</li><li>6 Bizstorenode par serveur physique : segment du keyspace P2P chacun</li><li>1 Biziod par disque physique : index sur SSD, donnees en containers pre-alloues sur HDD</li><li>Routage P2P distribue par hash : pas de SPOF, O(log N) sauts maximum</li><li>RING 3 serveurs : ARC 7+5 (data), COS 3 (petits objets), COS 4+ (meta SOFS), COS 5 (meta S3)</li><li>Scalabilite lineaire : ajout de serveurs sans interruption de service</li></ul></div>',
quiz:[
{q:"Combien de Bizstorenode sont deployes sur chaque serveur physique RING ?",opts:["3","4","6","12"],ans:2,expl:"Il y a exactement 6 Bizstorenode par serveur physique. Chacun detient une partition du keyspace global."},
{q:"Ou le Biziod stocke-t-il l'index des objets pour des performances optimales ?",opts:["HDD (grande capacite)","SSD (acces rapide)","RAM (volatile)","Base de donnees externe"],ans:1,expl:"L'index est sur SSD pour des lookups rapides. Les donnees elles-memes sont sur HDD dans des fichiers container de taille fixe."},
{q:"Dans un RING 3 serveurs, combien de repliques pour les metadonnees S3 ?",opts:["3","4","5","7"],ans:2,expl:"Les metadonnees S3 utilisent 5 repliques COS pour une haute disponibilite et la resilience du quorum."},
{q:"Quel protocole le RING utilise-t-il pour le routage distribue entre nodes ?",opts:["HTTP/REST","TCP direct","Peer-to-Peer (P2P)","gRPC"],ans:2,expl:"Le RING utilise un protocole P2P. Le hash de la cle determine les nodes responsables, sans coordinateur central."},
{q:"Quelle couche expose les protocoles d'acces aux applications (S3, NFS, SMB...) ?",opts:["Biziod","Bizstorenode","Connectors","MESA"],ans:2,expl:"Les Connectors sont la couche la plus haute. Ils exposent S3, sproxyd, NFS, SMB, FUSE, CDMI aux applications clientes."},
{q:"Quels sont les 3 fichiers qui composent le keyspace d'un RING Scality ?",opts:["keyspace.json, partition.json, ring.json","keyspace.json, sprov_context.json, sprov_model.json","keyspace.cfg, nodes.json, meta.json","ring.conf, keyspace.map, chord.json"],ans:1,expl:"Le keyspace RING est defini par : keyspace.json (structure des partitions Chord), sprov_context.json (contexte de deploiement), sprov_model.json (modele de replication). Ces fichiers sont generes par l'equipe ExVT Scality pour les keyspaces custom."},
{q:"Qui est habilite a generer un keyspace personnalise (custom) pour un RING Scality ?",opts:["L'administrateur RING via ringsh","Uniquement l'equipe ExVT Scality","Le script Platformcheck a l'installation","Tout utilisateur RING Admin"],ans:1,expl:"Un keyspace custom necessite une validation par l'equipe ExVT (Expert Validation Team) de Scality. Une mauvaise partition Chord peut causer des pertes de donnees irreversibles. L'administrateur RING ne peut pas modifier le keyspace directement."}
]},
{id:'M2',num:'02',title:'Stockage : ARC et COS',desc:'Erasure coding ARC, replication COS, seuils et durabilite',
content:'<h2>Pourquoi deux mecanismes de stockage ?</h2><p>Le RING n\'utilise pas une strategie unique de protection des donnees. Il choisit automatiquement le mecanisme le plus adapte selon la <strong>taille de l\'objet</strong> :</p><ul><li>La <strong>replication (COS)</strong> est simple, rapide a lire, mais couteuse en espace disque : stocker 1 objet en COS 3 consomme 3x son volume.</li><li>L\'<strong>erasure coding (ARC)</strong> est plus economique en espace pour les gros objets, au prix d\'une complexite de calcul supplementaire (encodage/decodage).</li></ul><p>Un <strong>seuil de taille configurable</strong> separe les deux zones : en dessous du seuil -> COS, au dessus -> ARC. Typiquement ce seuil est entre 1 et 10 MB selon le profil de charge.</p><h2>COS — Chain of Servers (Replication)</h2><p>COS signifie <strong>Chain of Servers</strong>. L\'objet est stocke en copie integrale sur N Bizstorenode distincts, chacun sur un serveur physique different.</p><h3>Ecriture COS (ex : COS 3)</h3><ol><li>Le Connector envoie l\'objet au Bizstorenode responsable de la cle (node "primaire").</li><li>Le node primaire ecrit l\'objet dans son Biziod local.</li><li>Il <strong>relaie en parallele</strong> l\'objet aux 2 nodes "secondaires" de la chaine.</li><li>Chaque node secondaire confirme l\'ecriture.</li><li>Quand les 3 ecritures sont confirmees, le PUT retourne succes au client.</li></ol><h3>Lecture COS</h3><p>La lecture peut se faire depuis <strong>n\'importe lequel des N nodes</strong> qui possedent une copie. Le RING choisit le node le plus disponible (load balancing). En cas de panne d\'un node, les autres servent automatiquement les lectures sans intervention.</p><h3>Usages de COS dans le RING</h3><table><tr><th>Usage</th><th>Facteur COS</th><th>Justification</th></tr><tr><td>Petits objets (data)</td><td>COS 3</td><td>Acces rapide, replication simple sur 3 serveurs</td></tr><tr><td>Metadonnees SOFS</td><td>COS 4+</td><td>Criticite haute : les metadonnees SOFS pilotent tout le filesystem</td></tr><tr><td>Metadonnees S3</td><td>COS 5</td><td>Resilience maximale du quorum : 5 copies pour le calcul de majorite</td></tr></table><h2>ARC — Adaptive Reed-Solomon Coding (Erasure Coding)</h2><p>ARC est une implementation d\'<strong>erasure coding bas sur les codes de Reed-Solomon</strong>. C\'est la meme technologie utilisee dans les CD/DVD pour corriger les erreurs de lecture. Appliquee au stockage distribue, elle permet de reconstituer des donnees manquantes a partir de fragments partiels.</p><h3>Principe mathematique</h3><p>Un objet est <strong>decoupe en K fragments de donnees</strong> et <strong>M fragments de parite</strong> sont calcules mathematiquement :</p><div class="adiag">Objet original (100 MB) avec ARC 7+5 :\n\nDecoupage en 7 fragments de donnees egaux :\n  [D1: 14.3MB] [D2: 14.3MB] [D3: 14.3MB] [D4: 14.3MB]\n  [D5: 14.3MB] [D6: 14.3MB] [D7: 14.3MB]\n\nCalcul de 5 fragments de parite (Reed-Solomon) :\n  [P1: 14.3MB] [P2: 14.3MB] [P3: 14.3MB] [P4: 14.3MB] [P5: 14.3MB]\n\nTotal stocke : 12 x 14.3 MB = 171.4 MB (vs 300 MB en COS 3)\nRatio d\'efficacite : 100/171.4 = 58%\n\nPour reconstruire : n\'importe quels 7 fragments sur 12 suffisent.</div><h3>Ecriture ARC</h3><ol><li>Le Bizstorenode recoit l\'objet et l\'encode : calcul des K+M fragments.</li><li>Les K+M fragments sont distribues sur K+M Biziod distincts (max 1 par serveur physique dans un cluster bien dimensionne).</li><li>Chaque Biziod ecrit son fragment dans son container HDD.</li><li>Quand tous les fragments sont confirmes, le PUT retourne succes.</li></ol><h3>Lecture ARC</h3><p>Le Bizstorenode recupere au minimum K fragments parmi les K+M disponibles et recalcule l\'objet original par decodage Reed-Solomon. Si certains fragments sont sur des noeuds lents ou indisponibles, le RING peut recuperer K fragments depuis les noeuds les plus rapides.</p><h3>Reconstruction (Rebuild)</h3><p>Si M fragments ou moins sont perdus (panne de disque, panne de serveur), le RING peut <strong>reconstruire automatiquement les fragments manquants</strong> en tache de fond (tache Rebuild) :</p><ol><li>Detection : le RING detecte que des fragments sont manquants.</li><li>Recuperation : lecture des K fragments restants.</li><li>Decodage : reconstruction de l\'objet original en memoire.</li><li>Re-encodage : calcul des fragments manquants.</li><li>Ecriture : les fragments reconstruits sont ecrits sur des Biziod de remplacement.</li></ol><div class="alert alert-d">Si plus de M fragments (ici 5) sont perdus simultanement, l\'objet est irrecuperable. C\'est l\'etat ARC_REBUILD_NOK. Sur un RING 3 serveurs, 5 fragments peuvent etre distribues sur 1 serveur complet -> la perte de 1 serveur entier est toleree en ARC 7+5.</div><h2>Comparaison COS vs ARC</h2><table><tr><th>Critere</th><th>COS 3</th><th>ARC 7+5</th></tr><tr><td>Overhead espace</td><td>200% (3x le volume)</td><td>71% (1.71x le volume)</td></tr><tr><td>Tolerance pannes</td><td>1 serveur complet</td><td>5 fragments quelconques</td></tr><tr><td>Latence lecture</td><td>Tres faible (copie directe)</td><td>Faible (decode si fragment manquant)</td></tr><tr><td>Latence ecriture</td><td>Faible (replication parallele)</td><td>Moderate (encodage + 12 ecritures)</td></tr><tr><td>Usage optimal</td><td>Petits objets, metadonnees</td><td>Gros objets (video, backup, archives)</td></tr><tr><td>CPU</td><td>Minimal</td><td>Encodage/decodage Reed-Solomon</td></tr></table><h2>Le Seuil de Taille (Threshold)</h2><p>La decision COS/ARC est prise automatiquement par le RING selon un seuil configurable :</p><ul><li>Objets <strong>en dessous du seuil</strong> : stored as COS (replication integrale)</li><li>Objets <strong>au dessus du seuil</strong> : stored as ARC (erasure coding)</li><li>Le seuil est configure au niveau du RING et s\'applique globalement</li><li>Valeur typique : entre 1 MB et 10 MB selon le profil applicatif</li></ul><div class="alert alert-i">Un seuil bas (ex: 1 MB) protege les performances de lecture des petits objets mais augmente l\'overhead espace. Un seuil haut (ex: 10 MB) maximise l\'efficacite disque mais soumet plus d\'objets aux latences d\'encodage ARC.</div><div class="kbox"><h3>Points Cles a Retenir</h3><ul><li>COS = replication integrale sur N serveurs : simple, rapide, mais espace x N</li><li>ARC = erasure coding K+M : efficacite 58% (7+5), tolere la perte de M fragments</li><li>ARC 7+5 : 12 fragments, n\'importe quels 7 sur 12 reconstituent l\'objet</li><li>COS pour petits objets et metadonnees ; ARC pour grands objets</li><li>Seuil configurable : en dessous -> COS, au dessus -> ARC</li><li>ARC_REBUILD_NOK = plus de M fragments perdus = perte de donnees irrecuperable</li></ul></div>',
quiz:[
{q:"Quel mecanisme utilise l'erasure coding Reed-Solomon pour les grands objets ?",opts:["COS","ARC","MESA","SOFS"],ans:1,expl:"ARC (Adaptive Reed-Solomon Coding) utilise l'erasure coding. COS utilise la replication integrale."},
{q:"Dans une configuration ARC 7+5, combien de fragments peut-on perdre sans perte de donnees ?",opts:["2","5","7","12"],ans:1,expl:"La tolerance d'ARC 7+5 est de 5 fragments perdus (le chiffre apres le +). N'importe quels 7 fragments sur 12 reconstituent l'objet."},
{q:"Pour les metadonnees SOFS dans un RING 3 serveurs, quel mecanisme est utilise ?",opts:["ARC 7+5","COS 3","COS 4+","ARC 3+2"],ans:2,expl:"Les metadonnees SOFS utilisent COS 4+ (au moins 4 copies). Les metadonnees S3 utilisent COS 5."},
{q:"Un objet de 512 KB (seuil = 1 MB). Quel mecanisme est utilise ?",opts:["ARC","COS — l'objet est sous le seuil","MESA","Depend du connector"],ans:1,expl:"L'objet est inferieur au seuil (512 KB < 1 MB), donc stocke en COS (replication). Au-dessus du seuil -> ARC."}
]},
{id:'M3',num:'03',title:'MESA et Metadonnees',desc:'Base NoSQL interne MESA, Failure Domains, index S3',
content:'<h2>MESA — La Base NoSQL Interne du RING</h2><p><strong>MESA</strong> est l\'acronyme de la base de donnees NoSQL interne, entierement distribuee dans le RING. Contrairement aux solutions qui dependent d\'une base externe (ZooKeeper, etcd, Cassandra...), MESA est <strong>nativement integree</strong> dans les Bizstorenode et utilise le meme protocole P2P de routage que le reste du RING.</p><h3>Role de MESA</h3><p>MESA joue le role d\'<strong>index global des objets</strong>. Quand un objet est ecrit dans le RING :</p><ol><li>Le Bizstorenode cree une entree MESA contenant : la cle de l\'objet, sa taille, son type (COS ou ARC), les emplacements physiques de ses repliques/fragments (serveur + disque + offset), et ses metadonnees applicatives (Content-Type, tags, etc.).</li><li>Cette entree est elle-meme stockee en COS sur plusieurs Bizstorenode (redundance des metadonnees internes).</li><li>Lors d\'un GET, le RING retrouve d\'abord l\'entree MESA pour connaitre l\'emplacement des donnees, puis les lit directement.</li></ol><h3>Architecture MESA</h3><div class="adiag">Ecriture objet "monimage.jpg" :\n\n1. PUT(monimage.jpg) arrive sur Bizstorenode-A\n2. Bizstorenode-A calcule hash("monimage.jpg") -> 0xA3F2...\n3. Ecrit les donnees ARC sur les Biziod cibles\n4. Cree une entree MESA :\n   {\n     key:      "monimage.jpg",\n     size:     5200000,\n     type:     "ARC 7+5",\n     fragments:[ {srv:1,disk:3,offset:0x1A4000},\n                 {srv:2,disk:1,offset:0x2C8000}, ... ]\n   }\n5. L\'entree MESA est elle-meme stockee en COS sur 3 Bizstorenode</div><h3>Distribution et consistance de MESA</h3><ul><li>Les entrees MESA sont distribuees sur tous les Bizstorenode, en suivant le meme partitionnement P2P que les donnees.</li><li>MESA utilise un modele de <strong>consistance eventuelle</strong> : les lectures peuvent temporairement retourner des versions legèrement anterieures, mais la coherence est garantie a terme.</li><li>Le Garbage Collector s\'appuie sur MESA pour identifier les chunks orphelins (ecrits sur disque mais dont l\'entree MESA a ete supprimee).</li></ul><h2>RING DATA vs RING META — Architecture S3</h2><p>Pour le connector S3, Scality utilise une architecture a <strong>deux RINGs distincts</strong> :</p><div class="adiag">+-------------------+        +-------------------+\n|   RING DATA       |        |   RING META       |\n|                   |        |                   |\n|  Objets S3        |        |  Metadonnees S3   |\n|  (contenu brut)   |        |  (buckets, ACL,   |\n|  ARC ou COS       |        |   tags, version)  |\n|                   |        |  COS 5 repliques  |\n+-------------------+        +-------------------+\n         ^                            ^\n         |                            |\n         +----------+  +--------------+\n                    |  |\n              Cloudserver (S3 API)\n                    |\n               Client S3</div><p>Cette separation offre plusieurs avantages :</p><ul><li><strong>Scalabilite independante</strong> : on peut augmenter RING META sans toucher RING DATA et inversement.</li><li><strong>Protection renforcee des metadonnees</strong> : COS 5 pour les metadonnees S3 (vs COS 3 pour les donnees) car les metadonnees sont le catalogue de reference — les perdre serait pire que perdre les donnees elles-memes.</li><li><strong>Performance</strong> : le RING META peut etre configure avec des disques plus rapides car les metadonnees sont de petits objets frequemment accedes.</li></ul><h2>Failure Domains — Zones de Defaillance</h2><p>Un <strong>Failure Domain</strong> (ou Zone) est un groupe de serveurs susceptibles de tomber simultanement pour une raison commune : meme rack (meme alimentation, meme switch), meme salle, meme datacenter. La configuration des Failure Domains informe le RING de la topologie physique pour placer les repliques de facon optimale.</p><h3>Regles de placement</h3><p>Le RING s\'assure que les repliques d\'un meme objet sont <strong>placees dans des Failure Domains distincts</strong> :</p><div class="adiag">Exemple : COS 5 avec 3 Failure Domains (A, B, C)\n\nObjet X -> 5 repliques reparties :\n  Replique 1 -> Zone A (serveur 1)\n  Replique 2 -> Zone A (serveur 2)\n  Replique 3 -> Zone B (serveur 3)\n  Replique 4 -> Zone B (serveur 4)\n  Replique 5 -> Zone C (serveur 5)\n\nPanne Zone A complete -> 3 repliques encore disponibles\n                      -> Quorum S3 (3/5) maintenu\n                      -> Service intact</div><h3>Configuration minimale</h3><ul><li>RING 3 serveurs : 3 zones independantes (1 serveur = 1 zone) est le minimum recommande.</li><li>La perte d\'une zone entiere doit laisser assez de repliques pour maintenir le quorum.</li><li>Pour COS 5 : quorum = 3 repliques minimum -> on peut perdre 2 repliques (donc une zone de 2 serveurs max).</li></ul><div class="alert alert-w">Si les serveurs ne sont pas affectes a des Failure Domains distincts, le RING peut placer plusieurs repliques du meme objet sur des serveurs du meme rack. La panne du rack perd alors toutes ces repliques simultanement -> risque de perte de donnees.</div><h2>XDM — Extended Data Management (S3 Connector)</h2><p>XDM est la couche logicielle qui constitue le <strong>S3 Connector complet</strong>. Elle regroupe plusieurs services interdependants :</p><table><tr><th>Composant</th><th>Role</th><th>Technologie</th></tr><tr><td><strong>Cloudserver</strong></td><td>Expose l\'API S3 compatible AWS. Traduit les requetes S3 en operations RING DATA + RING META.</td><td>Node.js</td></tr><tr><td><strong>MongoDB</strong></td><td>Stocke les metadonnees S3 structurees (liste des buckets, ACL, tags, versions). C\'est la base de donnees persistante du S3 Connector.</td><td>MongoDB ReplicaSet</td></tr><tr><td><strong>Redis-Sentinel</strong></td><td>Cache distribue pour les metadonnees chaudes (lookups frequents). HA assure par Sentinel. Accelere les LIST et GET sur les metadonnees.</td><td>Redis + Sentinel</td></tr><tr><td><strong>Backbeat</strong></td><td>Gere les workflows asynchrones S3 : Cross-Region Replication (CRR), Object Lifecycle, Ingestion depuis sources externes.</td><td>Node.js, Kafka</td></tr><tr><td><strong>Prometheus</strong></td><td>Collecte et stocke les metriques du S3 Connector pour le monitoring Grafana.</td><td>Prometheus TSDB</td></tr></table><h3>Cross-Region Replication (CRR) via Backbeat</h3><p>Le CRR permet de repliquer automatiquement les objets S3 vers un ou plusieurs clusters distants :</p><ul><li>La replication est <strong>asynchrone</strong> : l\'ecriture sur le cluster source reussit immediatement, la replication vers la cible se fait en arriere-plan.</li><li>Backbeat maintient une <strong>queue de replication</strong> (Kafka) : si le cluster cible est temporairement indisponible, les objets sont repliques des que la connectivite est retablie.</li><li>Le statut de replication de chaque objet est suivi via un flag de metadonnee (<code>x-amz-replication-status</code>).</li><li>Attention : si on upgrade depuis une version &lt; 9.5.2.0 avec CRR actif, une <strong>procedure de pre-upgrade CRR obligatoire</strong> doit etre executee avant l\'upgrade.</li></ul><div class="kbox"><h3>Points Cles a Retenir</h3><ul><li>MESA = index interne distribue : cle -> localisation physique des donnees</li><li>Separations RING DATA (objets) / RING META (metadonnees S3, COS 5)</li><li>Failure Domains : placement des repliques dans des zones distinctes (anti-correlation de pannes)</li><li>XDM = Cloudserver + MongoDB + Redis-Sentinel + Backbeat + Prometheus</li><li>CRR (Backbeat) = replication asynchrone inter-clusters via queue Kafka</li><li>MongoDB = source de verite des metadonnees S3 (Redis = cache)</li></ul></div><h2>repd et Raft Sessions — Le Service de Metadonnees Stateful</h2><p>Le S3 Connector ne stocke pas ses metadonnees dans MongoDB uniquement. Il dispose d\'un service de metadonnees <strong>stateful fortement consistant</strong> base sur le protocole de consensus <strong>Raft</strong>. Ce service est expose via le daemon <code>repd</code>.</p><h3>repd — Replication Daemon</h3><p><code>repd</code> est le daemon qui expose l\'API du service de metadonnees S3. Il gere les lectures et ecritures sur les metadonnees de buckets et d\'objets. Il existe en deux variantes :</p><ul><li><code>repd</code> : metadonnees S3 objets et buckets</li><li><code>repd-vault</code> : metadonnees IAM (comptes, utilisateurs, groupes, policies)</li></ul><p>Chaque instance repd participe a un <strong>groupe Raft (Raft session)</strong> qui garantit la coherence forte des metadonnees meme en cas de panne partielle.</p><h3>Raft Sessions — Principe</h3><p>Raft est un algorithme de consensus distribue. Dans le contexte S3 Scality, chaque <strong>Raft session</strong> est un groupe de noeuds repd qui s\'accordent sur l\'etat des metadonnees :</p><div class="adiag">Raft Session "metadata-0" (exemple a 5 noeuds) :\n\n  [Leader repd-1]  &lt;-- ecritures forcees sur le leader\n       |                  le leader replique vers les followers\n  [Follower repd-2]\n  [Follower repd-3]  &gt;-- n\'importe lequel peut servir les lectures\n  [Follower repd-4]\n  [Follower repd-5]\n\nQuorum = ceil(5/2)+1 = 3 noeuds minimum\nSi leader tombe -> election automatique d\'un nouveau leader</div><h3>Regles du quorum Raft</h3><ul><li>Pour <strong>ecrire</strong> des metadonnees : le leader doit obtenir la confirmation d\'une <strong>majorite des noeuds</strong> (quorum = N/2 + 1).</li><li>Pour <strong>lire</strong> : n\'importe quel follower peut servir la lecture (coherence eventuelle) ou le leader pour une coherence forte.</li><li>Si le leader tombe : les followers <strong>declenchent une election</strong> pour elire un nouveau leader (quelques secondes max).</li><li>Si plus de la moitie des noeuds tombent : le quorum est perdu, les <strong>ecritures sont bloquees</strong> jusqu\'a retablissement.</li></ul><h3>Alertes Prometheus liees aux Raft sessions</h3><table><tr><th>Alerte Prometheus</th><th>Severite</th><th>Signification</th><th>Action</th></tr><tr><td>S3RaftNoLeaderCritical</td><td>CRITIQUE</td><td>Aucun leader dans la session depuis 5 min. Les ecritures de metadonnees sont bloquees.</td><td>Verifier l\'etat des noeuds repd, redemarrer si necessaire.</td></tr><tr><td>S3RaftNotEnoughFollowersCritical</td><td>CRITIQUE</td><td>Moins de 3 followers : quorum en danger. Une autre panne suffit a bloquer les ecritures.</td><td>Verifier la connectivite, redemarrer les noeuds repd en erreur.</td></tr><tr><td>S3RaftNotEnoughFollowersWarning</td><td>Avertissement</td><td>Exactement 3 followers : quorum minimal maintenu mais fragile.</td><td>Surveiller, preparer une intervention preventive.</td></tr><tr><td>S3RaftElectionWarning</td><td>Avertissement</td><td>Trop d\'elections en 5 minutes : instabilite du cluster Raft (reseau ou CPU).</td><td>Investiguer la latence reseau entre noeuds repd.</td></tr><tr><td>S3RaftFollowerDesynchCritical</td><td>CRITIQUE</td><td>Les followers ne rattrapent pas le leader (gap > 10000 operations). Retard de replication.</td><td>Verifier les I/O et la bande passante reseau des noeuds followers.</td></tr><tr><td>S3RepdServerDownCritical</td><td>CRITIQUE</td><td>Le service repd est completement indisponible.</td><td>Redemarrer repd en urgence.</td></tr><tr><td>S3MetadataVaultServerDownCritical</td><td>CRITIQUE</td><td>Le service repd-vault (IAM) est indisponible : authentification S3 bloquee.</td><td>Redemarrer repd-vault en urgence.</td></tr></table><div class="alert alert-d">Si S3RaftNoLeaderCritical se declenche, toutes les ecritures S3 (PUT, DELETE, creation de bucket) sont bloquees jusqu\'a l\'election d\'un nouveau leader. Les lectures restent fonctionnelles. Temps de resolution d\'une election normale : quelques secondes. Si le quorum est perdu (plus de N/2 noeuds DOWN), intervention manuelle requise.</div><div class="kbox"><h3>Points Cles repd / Raft Sessions</h3><ul><li>repd = daemon du service de metadonnees S3 stateful (fort consistant via Raft)</li><li>repd-vault = variante pour les metadonnees IAM (comptes, users, policies)</li><li>Raft session = groupe de noeuds repd avec 1 leader + N followers</li><li>Quorum = ceil(N/2)+1 noeuds : requis pour chaque ecriture de metadonnee</li><li>Election automatique si le leader tombe (quelques secondes)</li><li>Quorum perdu -> ecritures S3 bloquees, lectures OK</li><li>Surveiller : S3RaftNoLeaderCritical et S3RaftNotEnoughFollowersCritical</li></ul></div>',
quiz:[
{q:"Que stocke MESA dans le RING Scality ?",opts:["Les donnees des fichiers SOFS","L'index et les metadonnees de tous les objets","La configuration du Supervisor","Les logs systeme"],ans:1,expl:"MESA est la base NoSQL interne distribuee. Elle stocke l'index de tous les objets et leurs metadonnees, repartie sur les Bizstorenode."},
{q:"Dans un RING 3 serveurs, combien de repliques COS pour les metadonnees S3 ?",opts:["3","4","5","7"],ans:2,expl:"Les metadonnees S3 utilisent 5 repliques COS pour garantir le quorum et la haute disponibilite."},
{q:"A quoi servent les Failure Domains (Zones) dans le RING ?",opts:["Partitionner le keyspace","Grouper les serveurs pour resilience du quorum S3","Definir des zones NFS","Configurer les VLANs reseau"],ans:1,expl:"Les Failure Domains regroupent des serveurs physiquement isoles. Le quorum S3 requiert une majorite de zones disponibles."},
{q:"Quel composant XDM gere la replication Cross-Region (CRR) entre sites ?",opts:["MongoDB","Redis-Sentinel","Backbeat","Cloudserver"],ans:2,expl:"Backbeat gere le Cross-Region Replication (CRR) entre clusters S3. Cloudserver est l'API S3. MongoDB stocke les metadonnees S3."}
]},
{id:'M4',num:'04',title:'Connectors',desc:'S3, sproxyd, NFS, SMB, FUSE, CDMI — protocoles et contraintes',
content:'<h2>Role des Connectors dans l\'Architecture RING</h2><p>Les Connectors sont la <strong>couche d\'interface</strong> entre les applications clientes et le coeur de stockage RING. Chaque connector est un service independant qui traduit un protocole standard (S3, NFS, SMB...) en operations internes RING (PUT/GET/DELETE d\'objets identifies par hash). Ils peuvent etre deployes sur des serveurs dedies ou co-localises selon la charge.</p><h2>S3 Connector — Le Plus Complet</h2><p>Le S3 Connector expose une <strong>API compatible Amazon S3</strong>. C\'est le connector le plus utilise en production pour les architectures cloud-native.</p><h3>Operations supportees</h3><ul><li><strong>Gestion des buckets</strong> : CreateBucket, DeleteBucket, ListBuckets, GetBucketAcl, PutBucketPolicy, GetBucketLocation</li><li><strong>Gestion des objets</strong> : PutObject, GetObject, DeleteObject, HeadObject, CopyObject, ListObjects (V1 et V2)</li><li><strong>Multipart Upload</strong> : CreateMultipartUpload, UploadPart, CompleteMultipartUpload, AbortMultipartUpload (pour les tres gros objets)</li><li><strong>Versioning</strong> : activation par bucket, ListObjectVersions, DeleteMarker</li><li><strong>ACL et Policies</strong> : PutBucketAcl, PutObjectAcl, PutBucketPolicy</li><li><strong>Metadata</strong> : custom headers <code>x-amz-meta-*</code>, tags, Content-Type</li></ul><h3>Architecture interne du S3 Connector</h3><div class="adiag">Client S3\n    |\n  HTTPS:443\n    |\nCloudserver (Node.js) -- API S3 layer\n    |           |\nRING DATA   MongoDB / Redis\n(objets)    (metadonnees S3)\n    |\nBackbeat -- CRR, Lifecycle, Ingestion</div><h2>sproxyd — Le Connector REST Natif</h2><p>sproxyd est le <strong>connector HTTP REST natif de Scality</strong>. Contrairement au S3 Connector, il n\'a pas de notion de bucket ni de namespace : chaque objet est identifie uniquement par son <strong>hash</strong>. C\'est l\'interface la plus basse et la plus performante.</p><h3>Architecture sproxyd</h3><div class="adiag">Client HTTP\n    |\n  Port 81 (Apache httpd)\n    |\nmod_fastcgi\n    |\n  Port 10000 (daemon sproxyd)\n    |\nBizstorenode (PUT/GET/DELETE par hash)</div><h3>Operations sproxyd</h3><ul><li><strong>PUT</strong> : <code>PUT /proxy/chord/&lt;hash&gt;</code> -> stocke l\'objet sous ce hash</li><li><strong>GET</strong> : <code>GET /proxy/chord/&lt;hash&gt;</code> -> recupere l\'objet</li><li><strong>DELETE</strong> : <code>DELETE /proxy/chord/&lt;hash&gt;</code> -> supprime l\'objet</li></ul><p>sproxyd est utilise en interne par SOFS (sfused passe par sproxyd pour lire/ecrire les blobs dans le RING). Certaines applications haute performance utilisent sproxyd directement car il evite la couche metadonnees S3.</p><h2>NFS sur S3 — Semantique et Contraintes</h2><p>NFS sur S3 monte un <strong>bucket S3 comme un point de montage NFS</strong>. C\'est pratique pour offrir un acces fichier a des applications qui ne supportent pas S3 natif. Mais la semantique est celle de l\'objet, pas du fichier :</p><div class="alert alert-d">Contrainte fondamentale : NFS sur S3 ne supporte PAS les mises a jour partielles (pwrite, seek+write). Chaque ecriture sur un fichier reecrit l\'objet S3 en entier. Les applications qui font des ecritures partielles (SQLite, certains journaux) ne sont PAS compatibles avec NFS sur S3.</div><h3>NFSv3 sur S3</h3><ul><li>Services : sfused + membershipd (meme que SOFS)</li><li>Kerberos : <strong>non supporte</strong></li><li>Buckets : uniquement des buckets <strong>non-versions</strong></li><li>Semantique POSIX partielle : pas de locks distribues fiables</li></ul><h3>NFSv3+v4 sur S3 (ganesha)</h3><ul><li>Services : NFS-Ganesha + membershipd</li><li>Version NFS supportee : <strong>uniquement NFSv4.0</strong> (pas 4.1, pas 4.2)</li><li>Kerberos : <strong>supporte</strong> (contrairement a NFSv3)</li><li>Utilise NFS-Ganesha comme serveur NFS userspace (plus flexible que le NFS kernel)</li></ul><h2>SMB/CIFS — Acces Windows</h2><p>Le connector SMB expose les volumes SOFS comme des partages Windows via le protocole <strong>SMB 3.0</strong>. Il est base sur Samba (SerNet-Samba).</p><h3>Composants SMB</h3><table><tr><th>Service</th><th>Role</th></tr><tr><td>sfused</td><td>Monte le volume SOFS localement (FUSE)</td></tr><tr><td>smbd</td><td>Serveur SMB principal (partages de fichiers)</td></tr><tr><td>nmbd</td><td>Resolveur NetBIOS (navigation reseau Windows)</td></tr><tr><td>winbindd</td><td>Integration Active Directory (optionnel, requis pour AD)</td></tr><tr><td>CTDB</td><td>Clustering Samba pour la haute disponibilite (VIP failover)</td></tr></table><h3>Integration Active Directory</h3><p>Quand Active Directory est configure, les utilisateurs Windows s\'authentifient avec leurs credentials AD sur les partages SMB. La jointure au domaine se fait avec :</p><pre>net ads join -U administrator</pre><p>Le fichier de config principal est <code>/etc/scality/cifs/smb.conf</code>. La regle critique : le module <code>ring</code> doit etre en <strong>premiere position</strong> dans <code>vfs objects</code>.</p><h2>FUSE — Montage Local</h2><p>Le connector FUSE (localfs) monte le volume SOFS directement sur le serveur connector via FUSE (Filesystem in Userspace). C\'est le mode le plus simple :</p><ul><li>Acces POSIX complet depuis le serveur local uniquement</li><li>Services : sfused + membershipd</li><li>Usage : scripts d\'administration, ingestion locale de donnees</li><li>Pas d\'acces reseau direct (contrairement a NFS/SMB)</li></ul><h2>CDMI — Cloud Data Management Interface</h2><p>CDMI est un protocole standard SNIA pour le stockage cloud. Le connector Scality CDMI est base sur le daemon <code>dewpoint</code> :</p><ul><li>Necessite un serveur HTTP (Apache ou nginx) avec FastCGI</li><li>Monte un point de montage FUSE local comme base de donnees</li><li>Supporte les operations CDMI standard : containers, data objects, queries</li></ul><div class="alert alert-d">Le connector Zimbra est officiellement DEPRECIEE. Ne pas l\'utiliser dans les nouveaux deploiements ni pour les upgrades.</div><div class="kbox"><h3>Points Cles a Retenir</h3><ul><li>S3 Connector : API AWS-compatible complete (versioning, ACL, multipart, CRR)</li><li>sproxyd : REST natif par hash, port Apache 81, port daemon 10000</li><li>NFS sur S3 : PAS de mise a jour partielle, buckets non-versions, NFSv4.0 seulement</li><li>NFSv3 sur S3 : pas Kerberos ; NFSv3+v4 (ganesha) : Kerberos OK, v4.0 seulement</li><li>SMB : base SerNet-Samba, vfs objects = ring en PREMIER, CTDB pour HA</li><li>Zimbra connector DEPRECIEE</li></ul></div>',
quiz:[
{q:"Quel connector utilise un protocole HTTP REST natif Scality avec acces par hash ?",opts:["S3 Connector","sproxyd","NFSv3 sur S3","CDMI"],ans:1,expl:"sproxyd est le connector HTTP REST natif Scality. L'acces se fait par hash de l'objet. Port Apache 81, port daemon 10000."},
{q:"Les mises a jour partielles de fichiers sont-elles supportees via NFS sur S3 ?",opts:["Oui, pour les fichiers < 100 MB","Oui, via le multi-part upload","Non, la semantique est celle de l'objet","Oui, uniquement avec NFSv4"],ans:2,expl:"NFS sur S3 utilise la semantique objet : les mises a jour partielles sont impossibles. Chaque ecriture cree un nouvel objet complet."},
{q:"Quel connector Scality est officiellement DEPRECIEE ?",opts:["CDMI","sproxyd","Zimbra Connector","FUSE"],ans:2,expl:"Le Zimbra Connector est depreciee. Il ne doit plus etre utilise dans les nouveaux deploiements."},
{q:"Quelle version exacte de NFSv4 est supportee par le connector NFS sur S3 ?",opts:["NFSv4.0","NFSv4.1","NFSv4.2","Toutes les versions 4.x"],ans:0,expl:"Uniquement NFSv4.0 est supporte sur S3. NFSv4.1 et ulterieures ne sont pas supportees. Kerberos est supporte avec NFSv4."},
{q:"Quel port Apache ecoute le daemon sproxyd ?",opts:["80","81","443","10000"],ans:1,expl:"Le daemon sproxyd ecoute sur le port Apache 81. Le port 10000 est utilise pour la communication interne FastCGI -> sproxyd daemon."}
]},
{id:'M5',num:'05',title:'Monitoring et Observabilite',desc:'Supervisor, Prometheus sizing, Grafana, ringsh, SupAPI',
content:'<h2>Le Scality Supervisor — Portail Central d\'Administration</h2><p>Le <strong>Supervisor</strong> est l\'interface web centralisee pour administrer l\'ensemble du cluster RING. Il s\'appuie sur <strong>Salt</strong> (gestion de configuration distribuee) pour orchestrer les operations sur tous les serveurs. Acces obligatoirement en <strong>HTTPS</strong> : <code>https://&lt;supervisor-fqdn&gt;</code>.</p><h3>Sections principales du Supervisor</h3><table><tr><th>Section</th><th>Contenu</th></tr><tr><td><strong>Dashboard</strong></td><td>Vue globale de l\'etat du cluster : RINGs, nodes, disques, alertes actives en temps reel</td></tr><tr><td><strong>Administration</strong></td><td>Parametres RING (join_auto, rebuild_auto, chordpurge), gestion des disques, expansion du cluster</td></tr><tr><td><strong>Monitoring</strong></td><td>Metriques temps reel, lien vers Grafana, historique des alertes Nagios</td></tr><tr><td><strong>Tasks</strong></td><td>Suivi des taches en cours (Balance, Rebuild, GC, Repair) avec progression et logs</td></tr><tr><td><strong>Identity</strong></td><td>Gestion des utilisateurs et roles (SSO depuis 9.4.0)</td></tr><tr><td><strong>Logs</strong></td><td>Agregation centralisee des logs de tous les composants du cluster</td></tr></table><h3>Etats du RING dans le Supervisor</h3><table><tr><th>Etat affiche</th><th>Signification</th><th>Action</th></tr><tr><td>RUN</td><td>RING nominal, toutes les taches executees correctement</td><td>Aucune</td></tr><tr><td>RUN + CONF_MISMATCH</td><td>RING operationnel mais configuration differente entre nodes (normal post-upgrade Supervisor)</td><td>Continuer l\'upgrade des nodes</td></tr><tr><td>INCOMPLETE</td><td>Des objets ont moins de repliques que requis</td><td>Laisser Rebuild/Repair travailler ; investiguer si persistant</td></tr><tr><td>ARC_REBUILD_NOK</td><td>Reconstruction ARC impossible (trop de fragments perdus)</td><td>Contacter Scality Support IMMEDIATEMENT</td></tr><tr><td>SPLIT LOOP</td><td>Partitionnement reseau entre nodes</td><td>Diagnostiquer la connectivite reseau</td></tr></table><h2>SupAPI — Automatisation via REST</h2><p>Toutes les actions disponibles dans l\'UI du Supervisor sont egalement exposees via l\'<strong>API REST (SupAPI)</strong>. C\'est la base pour l\'automatisation, les scripts de maintenance et l\'integration dans des outils tiers (Ansible, scripts d\'ops, ITSM).</p><h3>Acces et authentification</h3><ul><li>Documentation interactive Swagger : <code>https://&lt;supervisor&gt;/apidoc/</code></li><li>Authentification par token <strong>JWT</strong> : obtenu via POST sur l\'endpoint de login</li><li>Le token a une duree de vie limitee (configurable, typiquement 1 heure)</li><li>Toutes les requetes portent le header <code>Authorization: Bearer &lt;token&gt;</code></li></ul><h3>Exemples d\'appels API courants</h3><pre># Obtenir un token JWT\ncurl -k -X POST https://supervisor/api/v0.1/auth/login \\\n  -H "Content-Type: application/json" \\\n  -d \'{"username":"admin","password":"monmotdepasse"}\'\n\n# Lister les RINGs du cluster\ncurl -k -H "Authorization: Bearer $TOKEN" \\\n  https://supervisor/api/v0.1/ring\n\n# Etat d\'un RING specifique\ncurl -k -H "Authorization: Bearer $TOKEN" \\\n  https://supervisor/api/v0.1/ring/myring/status\n\n# Lister les disques d\'un node\ncurl -k -H "Authorization: Bearer $TOKEN" \\\n  https://supervisor/api/v0.1/node/storage1/disk</pre><h2>Prometheus — Architecture de Collecte de Metriques</h2><p>La collecte de metriques du RING est assuree par <strong>Prometheus</strong>, deploye sur des serveurs dedies. Prometheus scrape periodiquement les endpoints <code>/metrics</code> de chaque composant RING et stocke les series temporelles dans sa base de donnees interne (TSDB). <strong>Grafana</strong> interroge ensuite Prometheus pour construire les tableaux de bord.</p><h3>Modele de sharding Prometheus</h3><p>Pour les grands clusters, un seul Prometheus ne peut pas ingerer toutes les metriques a temps. Scality utilise un modele de <strong>shards Prometheus</strong>, chaque shard couvrant un sous-ensemble de nodes :</p><div class="adiag">Formule : nb_shards = ceil(N_storage_nodes / 12)\n          nb_noeuds_prometheus = nb_shards x 2  (paire HA)\n\nTableau recapitulatif :\n  N nodes  | Shards | Noeuds Prometheus\n  ---------+--------+------------------\n     1-12  |   1    |        2\n    13-24  |   2    |        4\n    25-36  |   3    |        6\n    37-48  |   4    |        8</div><h3>Espace disque minimum sur /var</h3><table><tr><th>Configuration du cluster</th><th>Espace /var minimum</th></tr><tr><td>Moins de 12 storage nodes</td><td>Standard (50 GB)</td></tr><tr><td>&gt;= 12 nodes + 2 clusters S3 META (S3MC)</td><td><strong>100 GB</strong></td></tr><tr><td>&gt;= 18 nodes + 3 clusters S3 META (S3MC)</td><td><strong>150 GB</strong></td></tr></table><div class="alert alert-w">Verifier AVANT tout upgrade que /var dispose de l\'espace suffisant. Un manque d\'espace en cours d\'upgrade bloque le processus dans un etat intermediaire difficile a corriger.</div><h2>ringsh — Shell d\'Administration CLI</h2><p><code>ringsh</code> est l\'outil CLI de bas niveau installe sur le Supervisor. Il permet d\'administrer directement les composants RING sans passer par l\'UI, ce qui est essentiel pour les scripts d\'upgrade et les operations de maintenance avancees.</p><h3>Commandes essentielles</h3><pre># Navigation\nringsh supervisor ringList              # lister tous les RINGs\nringsh supervisor ringStatus &lt;RING&gt;    # etat d\'un RING (RUN/INCOMPLETE...)\nringsh supervisor nodeList &lt;RING&gt;      # lister les nodes d\'un RING\nringsh supervisor nodeStatus &lt;NODE&gt;:/ # etat detaille d\'un node\n\n# Gestion des nodes (upgrade/maintenance)\nringsh supervisor nodeLeave &lt;NODE&gt;:/  # retirer un node (avant arret)\nringsh supervisor nodeJoin &lt;NODE&gt;:/   # readmettre un node (apres demarrage)\n\n# Parametres maintenance\nringsh supervisor ringConfigSet &lt;RING&gt; join_auto 0\nringsh supervisor ringConfigSet &lt;RING&gt; rebuild_auto 0\nringsh supervisor ringConfigSet &lt;RING&gt; chordpurge_enable 0\n\n# Reprise apres maintenance\nringsh supervisor ringConfigSet &lt;RING&gt; join_auto 2\nringsh supervisor ringConfigSet &lt;RING&gt; rebuild_auto 1\nringsh supervisor ringConfigSet &lt;RING&gt; chordpurge_enable 1</pre><h3>Etats d\'un node (nodeStatus)</h3><ul><li><strong>RUN</strong> : node actif, participe au RING, repond aux requetes</li><li><strong>OUT_OF_SERVICE</strong> : node retire du RING apres nodeLeave, en attente de maintenance</li><li><strong>JOINING</strong> : node en cours de rejoindre le RING apres nodeJoin</li><li><strong>LEAVING</strong> : node en cours de quitter le RING apres nodeLeave</li></ul><h2>Grafana et Nagios</h2><ul><li><strong>Grafana</strong> : interface graphique de visualisation des metriques Prometheus. Dashboards pre-configures par Scality inclus avec le Supervisor.</li><li><strong>Nagios</strong> : outil d\'alerting traditionnel. Les checks Scality s\'integrent dans une infrastructure Nagios existante pour generer des alertes PagerDuty/mail/SMS.</li></ul><h2>Troubleshooting S3 "UNAVAILABLE" dans le Supervisor GUI</h2><p>Depuis RING 9.5, le calcul du statut S3 dans le Supervisor est base sur <strong>Prometheus/Thanos</strong> (et non plus Elasticsearch). Quand S3 apparait "UNAVAILABLE" en rouge dans le GUI, la procedure de diagnostic est :</p><pre># 1. Verifier les alertes Prometheus actives pour S3\n# URL directe :\nhttps://&lt;supervisor_fqdn&gt;/prometheus/alerts\n\n# 2. Ou via PromQL dans Grafana Explore :\nring_alerts{domain="s3", alertstate="firing"}\n\n# 3. Health check S3 manuel\n/usr/bin/scality-compute-s3-health -c /etc/scality/s3-healthcheck/config.yaml\n\n# 4. Verifier le cron health check\nls -lh /etc/cron.d/scality-compute-s3-health</pre><p>Causes frequentes de "S3 UNAVAILABLE" apres RING 9.5 :</p><ul><li>Un container S3 en crash (verifier avec <code>ctrctl ps</code> sur les noeuds md)</li><li>Une alerte Raft active (S3RaftNoLeaderCritical, S3RaftNotEnoughFollowersCritical)</li><li>Prometheus lui-meme en erreur (verifier le scrape des metriques S3)</li><li>Pic errone de metriques apres un restart Prometheus — attendre 2-3 minutes</li></ul><h2>Prometheus Sharding (RING 9.5+)</h2><p>Depuis RING 9.5, Prometheus peut etre <strong>sharde</strong> sur plusieurs serveurs pour les grands clusters. Chaque shard surveille un sous-ensemble des serveurs.</p><table><tr><th>Aspect</th><th>Detail</th></tr><tr><td>Outil de gestion</td><td><code>pdesc_manager.py</code> — gere les roles Prometheus dans le fichier cluster.csv</td></tr><tr><td>Configuration</td><td>Dans scality-common.sls : <code>prometheus.shards.shard1.monitored_servers</code></td></tr><tr><td>Apres modification</td><td><code>salt \'*\' saltutil.refresh_pillar</code> puis <code>salt-run state.orchestrate prometheus.orchestrate</code></td></tr><tr><td>Upgrade</td><td>A l\'upgrade RING 9.5, accepter les nouvelles regles de sharding proposees par pdesc_manager.py</td></tr></table><h2>Scality Cloud Monitor</h2><p>Le <strong>Scality Cloud Monitor</strong> est un service optionnel qui replique les dashboards Grafana et les alertes vers le cloud Scality. Il permet a l\'equipe Support Scality de surveiller le cluster client en temps reel.</p><ul><li>Activation via ticket support Scality (pas de configuration manuelle)</li><li>Les dashboards L1/L2 sont repliquer automatiquement</li><li>Aucune donnee client n\'est transmise, uniquement les metriques</li><li>Verifier l\'activation : <code>Cloud Monitor: Yes/No</code> dans la page client Confluence</li></ul><div class="kbox"><h3>Points Cles a Retenir</h3><ul><li>Supervisor = portail HTTPS centralise : Dashboard, Tasks, Monitoring, Identity, Logs</li><li>SupAPI Swagger : https://supervisor/apidoc/ — toutes les actions UI disponibles en REST</li><li>Authentification API : token JWT (Authorization: Bearer)</li><li>Prometheus sharding : ceil(N/12) shards, 2 noeuds par shard (paire HA)</li><li>/var : 100 GB min pour 12 nodes + 2 S3MC ; 150 GB pour 18 nodes + 3 S3MC</li><li>ringsh : CLI bas niveau pour nodeLeave/nodeJoin/ringConfigSet et maintenance avancee</li></ul></div>',
quiz:[
{q:"Pour un RING avec 24 storage nodes, combien de shards Prometheus sont necessaires ?",opts:["1","2","3","4"],ans:1,expl:"ceil(24/12) = 2 shards. Avec 2 shards -> 4 noeuds Prometheus (2 par shard)."},
{q:"Ou acceder a la documentation Swagger du SupAPI ?",opts:["https://supervisor/api/","https://supervisor/apidoc/","https://supervisor/swagger/","http://supervisor:8080/docs/"],ans:1,expl:"La documentation Swagger est a https://<supervisor>/apidoc/ -- noter le HTTPS obligatoire."},
{q:"Quel outil CLI permet l'administration bas niveau du RING ?",opts:["biziotools","scaldisk","ringsh","supctl"],ans:2,expl:"ringsh est le shell CLI pour l'administration bas niveau. Il permet de gerer les nodes, configurer les RINGs, verifier les statuts."},
{q:"Espace disque minimum sur /var pour un RING de 12 noeuds + 2 clusters S3 META ?",opts:["50 GB","100 GB","150 GB","200 GB"],ans:1,expl:"Scality requiert minimum 100 GB sur /var pour 12 noeuds + 2 S3 metadata clusters. Pour 18 noeuds + 3 clusters : 150 GB."},
{q:"Comment verifier l'etat sante du connecteur S3 en ligne de commande sur RING 9.5+ ?",opts:["curl http://supervisor/api/s3/status","scality-compute-s3-health","ringsh supervisor s3Status","systemctl status scality-s3"],ans:1,expl:"scality-compute-s3-health est le script officiel base sur Prometheus (requete ring_alerts{domain='s3'}) depuis RING 9.5. Il remplace les sondes legacy Zabbix. Il retourne OK si aucune alerte S3 n'est active, CRITICAL sinon."},
{q:"Pour un cluster RING de 13 storage nodes, combien de shards Prometheus doit-on configurer ?",opts:["1 shard","2 shards","3 shards","4 shards"],ans:1,expl:"La formule de sharding Prometheus est ceil(N/12). Pour 13 noeuds : ceil(13/12) = 2 shards -> 4 noeuds Prometheus (2 par shard). L'outil pdesc_manager.py genere la configuration a inclure dans scality-common.sls."}
]},
{id:'M6',num:'06',title:'Gestion des Disques',desc:'Biziod, biziotools, scaldisk, etats des disques, OOS_PERM',
content:'<h2>Les Deux Outils de Gestion des Disques</h2><p>Scality fournit deux outils CLI complementaires pour la gestion des disques, operant a des niveaux d\'abstraction differents :</p><h3>biziotools — Niveau Biziod (bas niveau)</h3><p><code>biziotools</code> interagit directement avec le daemon Biziod. Il permet d\'inspecter les structures internes de stockage :</p><ul><li><strong>Lister les fichiers container</strong> sur un disque donne (leur taille, leur taux de remplissage)</li><li><strong>Inspecter les chunks</strong> a l\'interieur des containers (cle, taille, offset)</li><li><strong>Verifier la coherence</strong> entre l\'index SSD et les donnees HDD</li><li><strong>Forcer le flush</strong> des ecritures en attente dans un Biziod</li></ul><pre># Exemples biziotools\nbiziotools list-containers /data/disk01\nbiziotools chunk-info /data/disk01 &lt;chunk_id&gt;\nbiziotools check-index /data/disk01</pre><h3>scaldisk — Niveau Cluster (haut niveau)</h3><p><code>scaldisk</code> opere au niveau du cluster pour la gestion du cycle de vie des disques :</p><ul><li><strong>Declarer un nouveau disque</strong> dans le RING (apres ajout physique)</li><li><strong>Retirer un disque</strong> proprement (evacuation des donnees avant decommission)</li><li><strong>Verifier la sante</strong> d\'un disque (etat SMART, erreurs I/O recentes)</li><li><strong>Forcer l\'etat OOS</strong> d\'un disque defaillant pour protection immediate</li></ul><pre># Exemples scaldisk\nscaldisk list                   # etat de tous les disques\nscaldisk add /dev/sdb           # ajouter un disque au RING\nscaldisk evacuate /dev/sdb      # evacuer les donnees avant retrait\nscaldisk set-oos /dev/sdb       # forcer OOS d\'urgence</pre><h2>Cycle de Vie et Etats des Disques</h2><p>Chaque disque dans le RING passe par plusieurs etats au cours de sa vie. Comprendre ces etats est essentiel pour la gestion proactive :</p><div class="adiag">+--------+     +----------+     +-------+     +---------+\n|  NEW   | --> |   OK     | --> | WARN  | --> |  ERROR  |\n+--------+     +----------+     +-------+     +---------+\n(declare)      (operationnel)   (premiers      (erreurs\n                                 signaux)       significatives)\n                                                    |\n                                                    v\n                                               +--------+     +-----------+\n                                               |  OOS   | --> | OOS_PERM  |\n                                               +--------+     +-----------+\n                                               (retrait        (remplacement\n                                                temporaire)     physique)</div><table><tr><th>Etat</th><th>Signification detaillee</th><th>Action operationnelle</th></tr><tr><td><code>OK</code></td><td>Disque pleinement operationnel. Aucune erreur SMART, I/O normaux, taux de remplissage acceptable.</td><td>Aucune. Surveiller via Grafana.</td></tr><tr><td><code>WARNING</code></td><td>Premiers signaux de degradation : compteurs SMART en augmentation, quelques erreurs I/O sporadiques, latences elevees occasionnelles. Disque encore fonctionnel.</td><td>Planifier le remplacement prochainement. Augmenter la frequence de monitoring.</td></tr><tr><td><code>ERROR</code></td><td>Erreurs I/O significatives et repetees. Le disque repond encore mais de facon non fiable. Le RING peut avoir marque certains objets comme INCOMPLETE.</td><td>Planifier le remplacement urgent. Verifier l\'etat des donnees (Rebuild en cours ?).</td></tr><tr><td><code>OOS</code></td><td>Out of Service temporaire. Le disque est retire du RING mais peut etre remis en service. Le RING reconstruit les donnees manquantes sur d\'autres disques.</td><td>Maintenance en cours (remplacement temporaire, firmware update...). Ne pas laisser trop longtemps.</td></tr><tr><td><code>OOS_PERM</code></td><td>Out of Service Permanent. Le disque est definitivement declare hors service. Le RING a reconstruit ou est en train de reconstruire les donnees manquantes.</td><td><strong>Remplacer physiquement le disque. Ne JAMAIS le remettre en service.</strong></td></tr></table><div class="alert alert-d">OOS_PERM est irreversible : une fois un disque marque OOS_PERM, il ne peut plus rejoindre le RING. Tenter de le remettre manuellement en service sans suivre la procedure de declaration d\'un nouveau disque corromprait l\'index MESA.</div><h2>Procedure de Remplacement d\'un Disque</h2><ol><li><strong>Detection</strong> : le Supervisor ou Grafana alerte sur un disque ERROR ou OOS_PERM.</li><li><strong>Evacuation logicielle</strong> : le disque passe en OOS, le RING lance le Rebuild pour reconstituer les donnees manquantes sur d\'autres disques disponibles.</li><li><strong>Attendre le Rebuild</strong> : ne pas remplacer physiquement avant que le RING soit revenu en etat RUN (toutes les donnees du disque ont ete reconstituees ailleurs).</li><li><strong>Remplacement physique</strong> : changer le disque defaillant.</li><li><strong>Declaration</strong> : utiliser <code>scaldisk add</code> pour declarer le nouveau disque dans le RING.</li><li><strong>Reequilibrage</strong> : le RING lance automatiquement un Balance pour repartir les donnees sur le nouveau disque.</li></ol><div class="alert alert-w">Remplacer un disque OOS_PERM AVANT la fin du Rebuild est risque : si un autre disque tombe en panne pendant la reconstruction, on peut atteindre le seuil de perte de donnees (plus de M fragments ARC perdus simultanement).</div><h2>Gestion de la Capacite Disque</h2><p>La surveillance du taux de remplissage des disques est critique. Deux seuils declenchent des alertes dans le Supervisor :</p><ul><li><strong>DISK USAGE WARNING</strong> : un seuil configurable (ex: 75%) est atteint. Alerte preventive.</li><li><strong>DISK_FULL</strong> : le disque est plein. Le RING ne peut plus ecrire de nouvelles donnees sur ce disque. Etat critique necessitant une action immediate (ajout de capacite ou suppression de donnees).</li></ul><h2>L\'Index SSD — Criticite et Protection</h2><p>L\'index SSD de chaque Biziod est le composant le plus critique du systeme de stockage physique. Sa perte (sans perte du HDD associe) ne cause pas de perte de donnees mais necessite une reconstruction couteuse :</p><ul><li>La reconstruction de l\'index consiste a relire <em>tous les containers HDD</em> pour reconstruire la table de correspondance cle->offset.</li><li>Cette operation peut durer plusieurs heures sur de grands disques (plusieurs TB).</li><li>Pendant la reconstruction, le Biziod ne repond pas : ses donnees semblent manquantes, ce qui peut declencher un Rebuild ARC inutile.</li></ul><p>Bonnes pratiques pour les SSD d\'index :</p><ul><li>Utiliser des SSD <strong>entreprise</strong> avec protection anti-panne de courant (condensateurs)</li><li>Monitorer le niveau d\'usure (wear level) via S.M.A.R.T.</li><li>Envisager RAID1 sur les SSD d\'index pour les environnements critiques</li></ul><h2>Remplacement d\'un Disque DATA</h2><p>Quand un disque DATA tombe en panne, la procedure de remplacement suit des etapes precises pour eviter toute perte de donnees. Le RING doit etre sain (protection integre) avant de commencer.</p><h3>Procedure scaldisk (etapes cles)</h3><div class="adiag">1. Marquer le disque comme hors service permanent\n   scaldisk iods set disk07 OOS_PERM\n   -> Le RING cesse d\'utiliser ce disque et lance le Rebuild sur les autres\n\n2. Arreter le service scality-iod pour ce disque\n   systemctl stop scality-iod@disk07\n\n3. Remplacement physique du disque (intervention hardware)\n\n4. Declarer le nouveau disque dans Salt/scaldisk\n   scaldisk add -c /dev/sdX        # ajoute le nouveau disque\n   # ou\n   scaldisk replace -c /dev/sdX -d disk07  # remplacement direct (avec RAID plugin)\n\n5. Creer un nouveau store sur le disque\n   bizioopen -c -N disk07 bizobj://DATA_RING\n\n6. Effacer le flag OOS_PERM\n   scaldisk iods clear disk07\n   -> Le RING reintegre le disque et distribue des donnees dessus</div><p class="alert-w"><strong>Avant de commencer :</strong> Verifier que le RING est dans un etat sain (pas de INCOMPLETE, pas d\'autre Rebuild en cours). Remplacer un disque pendant un Rebuild actif peut degrader la protection sous le seuil de tolerance.</p><h2>LUKS — Chiffrement At-Rest des Disques</h2><p>Scality RING supporte le <strong>chiffrement LUKS</strong> (Linux Unified Key Setup) pour chiffrer les disques DATA et metadata au repos. Le chiffrement est transparent pour le RING — il opere au niveau bloc, en dessous de ext4.</p><h3>Principes LUKS sur RING</h3><table><tr><th>Aspect</th><th>Detail</th></tr><tr><td>Niveau</td><td>Chiffrement au niveau bloc (partition LUKS sous le filesystem ext4). Le RING ne voit que des blocs dechiffres — pas de modification logicielle RING.</td></tr><tr><td>Ouverture automatique</td><td>Options NBDE (Network-Bound Disk Encryption) via <strong>TANG + clevis</strong> : les disques s\'ouvrent automatiquement au boot si le serveur TANG est accessible — elimine la saisie manuelle de passphrase.</td></tr><tr><td>scaldisk + LUKS</td><td>La plupart des commandes scaldisk fonctionnent normalement avec LUKS. Exception : <code>scaldisk replace</code> necessite des flags specifiques (<code>--luks</code>) pour recreer la partition chiffree.</td></tr><tr><td>Disques DATA vs Metadata</td><td>Procedures differentes : disques DATA (SAS/SATA) et disques metadata (SSD/NVMe) ont chacun leur procedure de remplacement LUKS.</td></tr></table><pre># Creer une partition LUKS sur un disque DATA\ncryptsetup luksFormat /dev/sdX\ncryptsetup open /dev/sdX disk07_crypt\n\n# Avec NBDE (ouverture automatique via TANG)\nclevis luks bind -d /dev/sdX tang \'{"url":"http://tang-server"}\'\n\n# scaldisk replace avec LUKS\nscaldisk replace --luks -c /dev/sdX -d disk07</pre><h2>Expansion de Capacite</h2><p>Deux types d\'expansion existent pour augmenter la capacite du RING :</p><table><tr><th>Type</th><th>Descrip
