  {q:"Pourquoi est-il impératif de vérifier que le ring est sain (aucun noeud OOS) avant de démarrer un upgrade ?",opts:["C'est une simple recommandation cosmétique","Upgrader un noeud le met temporairement hors service ; si le ring a déjà des noeuds OOS, la perte d'un noeud supplémentaire peut faire passer certains objets sous le seuil de reconstruction","L'upgrade échoue automatiquement si un noeud est OOS","Pour respecter la fenêtre de maintenance"],ans:1,expl:"Durant un rolling upgrade, chaque noeud est redémarré successivement. Si le ring est déjà dégradé (noeuds OOS), ajouter un noeud OOS supplémentaire peut rendre des objets irrécupérables. Un ring sain à 100% avant l'upgrade est non-négociable."},
  {q:"Qu'est-ce qu'un chemin d'upgrade supporté dans la matrice de versions Scality ?",opts:["N'importe quelle version peut upgrader vers n'importe quelle autre","Une séquence de versions par lesquelles il faut passer (ex: 9.4 -> 9.5 -> 9.5.2) sans sauter d'étape, validée et testée par Scality","Un chemin réseau optimisé pour l'upgrade","La version vers laquelle l'upgrade est le plus rapide"],ans:1,expl:"Scality qualifie des chemins d'upgrade spécifiques. Sauter des versions intermédiaires peut causer des incompatibilités de format de données ou de configuration non gérées. La matrice d'upgrade dans les release notes définit les séquences autorisées."}
]},
{id:'MC',num:'C',title:'S3 Connector — repd et Raft',desc:'Architecture interne S3 : repd, Raft sessions, bucketd, vault, alertes',
content:'<h2>Architecture Interne du S3 Connector</h2><p>Le S3 Connector Scality est une pile de <strong>services conteneurise (Docker)</strong> qui offre une API S3 compatible AWS. La plupart de ces services sont <strong>stateless</strong> (ils peuvent etre redemarres ou scales independamment), a l\'exception du service de metadonnees stateful base sur <strong>Raft</strong>.</p><div class="adiag">+----------------------------------------------------------+\n|                   S3 CONNECTOR STACK                    |\n|                                                          |\n|  [S3 Frontend]  &lt;-- load balancer HTTP                  |\n|       |                                                  |\n|  [Cloudserver]  -- API S3 (stateless, scalable)          |\n|    /       \\                                             |\n| [Vault]   [S3 Metadata]                                  |\n| (IAM)     (buckets/objets)                               |\n|    |            |                                        |\n| [repd-vault] [repd]  -- services STATEFUL (Raft)         |\n|                |                                         |\n|        [RING DATA via sproxyd]                           |\n+----------------------------------------------------------+\n\nServices ancillaires :\n  Backbeat (CRR/Lifecycle) . Redis-Sentinel . Prometheus\n  Zookeeper . UTAPI (facturation)</div><h2>Les Services du S3 Connector</h2><table><tr><th>Service</th><th>Stateful ?</th><th>Role</th></tr><tr><td><strong>S3 Frontend</strong></td><td>Non</td><td>Load balancer HTTP devant Cloudserver. Termine le TLS.</td></tr><tr><td><strong>Cloudserver</strong></td><td>Non</td><td>Implémente l\'API S3 AWS. Traduit les requetes S3 en appels Vault (IAM) + S3 Metadata + RING sproxyd.</td></tr><tr><td><strong>Vault</strong></td><td>Non</td><td>Service IAM : authentifie les requetes S3 (access key / secret key), gere les comptes, users, groupes, policies.</td></tr><tr><td><strong>bucketd</strong></td><td>Non</td><td>Service de gestion des buckets. Interface entre Cloudserver et le service de metadonnees.</td></tr><tr><td><strong>repd</strong></td><td><strong>Oui (Raft)</strong></td><td>Service de metadonnees S3 : stocke de facon durable et consistante les metadonnees de buckets et d\'objets.</td></tr><tr><td><strong>repd-vault</strong></td><td><strong>Oui (Raft)</strong></td><td>Service de metadonnees IAM : stocke les comptes, users, groupes, policies de facon durable.</td></tr><tr><td><strong>Redis-Sentinel</strong></td><td>Partiel</td><td>Cache distribue pour les metadonnees chaudes. Accelere les lookups. Sentinel assure la HA de Redis.</td></tr><tr><td><strong>Backbeat</strong></td><td>Partiel</td><td>Workflows asynchrones : CRR (replication inter-clusters), Lifecycle (expiration objets), Ingestion.</td></tr><tr><td><strong>Prometheus</strong></td><td>Oui</td><td>Collecte les metriques de tous les services S3. Alimente Grafana.</td></tr><tr><td><strong>ZooKeeper</strong></td><td>Oui</td><td>Coordination distribuee pour Backbeat et certains services S3.</td></tr><tr><td><strong>UTAPI</strong></td><td>Non</td><td>Utilization API : mesure et expose la consommation par compte/bucket pour la facturation.</td></tr></table><h2>repd — Le Service de Metadonnees Stateful</h2><p><code>repd</code> (Replication Daemon) est <strong>le coeur stateful du S3 Connector</strong>. C\'est lui qui assure la persistance et la coherence forte des metadonnees S3. Il est critique car :</p><ul><li>Chaque PUT S3 ecrit des metadonnees dans repd (cle, taille, ETag, ACL, tags, version...)</li><li>Chaque GET S3 lit les metadonnees depuis repd pour localiser l\'objet dans le RING</li><li>Chaque LIST S3 parcourt les metadonnees dans repd pour retourner la liste des objets d\'un bucket</li></ul><h3>Backend de stockage de repd : LevelDB</h3><p>repd expose une API de metadonnees. En interne, les donnees sont persistees dans un moteur de stockage embarque. Le backend utilise par defaut est <strong>LevelDB</strong>, developpe par Google :</p><ul><li><strong>LevelDB</strong> : base cle-valeur embarquee (pas de serveur separe), stockage sur disque en "sorted string tables" (SST files). Tres performante pour les ecritures sequentielles et les lectures d\'objets individuels. Chaque session Raft (chaque noeud repd) maintient son propre fichier LevelDB local — Raft garantit que tous les noeuds voient les memes donnees.</li><li><strong>MongoDB</strong> : backend alternatif supporte pour les tres grands volumes de metadonnees (millions de buckets/objets). Externe a repd, necessite son propre cluster.</li></ul><p class="alert-i"><strong>Note sur RocksDB :</strong> RocksDB (fork de LevelDB par Facebook, plus performant) n\'est <strong>pas mentionne dans la documentation officielle Scality RING 9.5</strong>. Ne pas confondre : c\'est LevelDB qui est le backend embarque de repd dans la version actuelle.</p><h2>Raft Sessions — Le Protocole de Consensus</h2><p>Raft est un algorithme de consensus distribue cree pour etre <strong>comprehensible et correct</strong>. Il est utilise par repd pour garantir que toutes les instances du service de metadonnees voient les memes donnees dans le meme ordre.</p><h3>Composants d\'une Raft Session</h3><div class="adiag">Raft Session "s3-metadata-0" (5 noeuds) :\n\nEtat initial (tout va bien) :\n  [Node1: LEADER] -- repond aux ecritures, replique vers followers\n  [Node2: follower] -- replique depuis le leader\n  [Node3: follower] -- replique depuis le leader\n  [Node4: follower] -- replique depuis le leader\n  [Node5: follower] -- replique depuis le leader\n\n  Quorum ecriture = 3/5 noeuds (majorite simple)\n  Quorum lecture = 1 noeud (n\'importe lequel)\n\nSi Node1 (leader) tombe :\n  [Node1: DOWN]\n  [Node2: CANDIDATE] -- declenche une election\n  [Node3: follower]  -- vote pour Node2\n  [Node4: follower]  -- vote pour Node2\n  [Node5: follower]  -- vote pour Node2\n  -> Node2 elu nouveau LEADER en quelques secondes\n  -> Quorum = 3/4 = OK, ecritures reprennent</div><h3>Les 3 etats d\'un noeud Raft</h3><table><tr><th>Etat</th><th>Description</th><th>Quand</th></tr><tr><td><strong>Leader</strong></td><td>Noeud qui gere toutes les ecritures. Il envoie les "heartbeats" aux followers pour signaler qu\'il est vivant. Il replique chaque ecriture vers les followers avant de confirmer au client.</td><td>Elu par vote majoritaire. 1 seul leader par session a tout moment.</td></tr><tr><td><strong>Follower</strong></td><td>Noeud passif qui repond aux requetes du leader (replication). Peut servir les lectures selon la configuration. Si il ne recoit plus de heartbeat, il devient Candidate.</td><td>Etat par defaut de tous les noeuds sauf le leader.</td></tr><tr><td><strong>Candidate</strong></td><td>Noeud qui a declare son intention d\'etre leader et demande des votes. Si il obtient la majorite, il devient Leader.</td><td>Quand un follower timeout sans heartbeat du leader.</td></tr></table><h3>Numeros de sequence Raft (metriques cles)</h3><p>Chaque entree du log Raft est numerotee sequentiellement. Ces numeros permettent de detecter les desynchronisations :</p><ul><li><code>raft_aseq</code> : "applied sequence" — dernier index applique a la base de donnees locale</li><li><code>raft_cseq</code> : "commit sequence" — dernier index valide par le quorum (commite)</li><li><code>raft_bseq</code> : "base sequence" — premier index encore en memoire (avant compaction)</li><li><code>raft_term</code> : numero du "mandat" du leader actuel (incremente a chaque election)</li></ul><p>Une alerte <code>S3RaftFollowerDesynchCritical</code> se declenche si : <code>max(cseq) - min(cseq) &gt; 10000</code> — un follower est a plus de 10000 operations de retard par rapport au leader.</p><h2>Diagnostiquer une Raft Session en Probleme</h2><h3>Verifier l\'etat de la session</h3><pre># Depuis le Supervisor ou un noeud du cluster S3\n# Les metriques Raft sont exposees par Prometheus\n# Interroger Prometheus directement :\ncurl -s http://prometheus:9090/api/v1/query \\\n  \'?query=s3_metadata_stateful_raft_is_leader\' | python3 -m json.tool\n\n# Resultat : 1 = leader, 0 = follower/candidate\n# Verifier qu\'il y a exactement 1 leader par session</pre><h3>Scénarios d\'incidents Raft</h3><table><tr><th>Scenario</th><th>Alerte</th><th>Impact</th><th>Resolution</th></tr><tr><td>Leader tombe</td><td>S3RaftNoLeaderCritical (apres 5 min)</td><td>Ecritures S3 bloquees temporairement</td><td>L\'election automatique resout en quelques secondes. Si bloque : redemarrer les noeuds repd un par un.</td></tr><tr><td>2 noeuds DOWN sur 5</td><td>S3RaftNotEnoughFollowersWarning</td><td>Quorum maintenu (3/5) mais fragile</td><td>Redemarrer ou remplacer les noeuds DOWN rapidement.</td></tr><tr><td>3 noeuds DOWN sur 5</td><td>S3RaftNotEnoughFollowersCritical</td><td>Quorum perdu : ecritures BLOQUEES</td><td>Urgence : restaurer au moins 1 noeud DOWN pour retrouver 3/5 noeuds actifs.</td></tr><tr><td>Elections repetees</td><td>S3RaftElectionWarning</td><td>Instabilite : performances degradees, risque de perte de leader</td><td>Investiguer la latence reseau et la charge CPU des noeuds repd.</td></tr><tr><td>Follower en retard</td><td>S3RaftFollowerDesynchCritical</td><td>Le follower a un etat ancien (peut servir des lectures perimees)</td><td>Verifier les I/O et la bande passante. Redemarrer le follower en retard.</td></tr></table><h2>bucketd — Gestionnaire de Buckets</h2><p><code>bucketd</code> est le service intermediaire entre Cloudserver et repd. Il ne stocke pas lui-meme des donnees : il <strong>orchestre les operations sur les buckets</strong> en dialoguant avec repd.</p><h3>Flux d\'une requete ListObjects</h3><div class="adiag">Client S3 : GET /?list-type=2\n       |\n       v\n  [S3 Frontend]  (load balancer)\n       |\n       v\n  [Cloudserver]  -- recoit la requete, authentifie via Vault\n       |\n       v\n   [bucketd]     -- traduit la requete en scan d\'index de metadonnees\n       |\n       v\n   [repd]        -- parcourt le LevelDB local (Raft leader)\n                     retourne la liste paginee\n       |\n       v\n  [Cloudserver]  -- formate la reponse XML S3\n       |\n       v\n   Client S3 : reponse XML avec la liste des objets</div><h3>Operations gerees par bucketd</h3><table><tr><th>Operation S3</th><th>Role de bucketd</th></tr><tr><td>CreateBucket</td><td>Cree l\'entree de bucket dans repd (namespace, versioning, ACL)</td></tr><tr><td>DeleteBucket</td><td>Verifie que le bucket est vide puis supprime l\'entree dans repd</td></tr><tr><td>ListObjects / ListObjectsV2</td><td>Scan pagine de l\'index de metadonnees dans repd</td></tr><tr><td>GetBucketVersioning</td><td>Lit la configuration de versioning du bucket dans repd</td></tr><tr><td>PutBucketAcl / Policy</td><td>Ecrit les ACL/policies du bucket dans repd</td></tr></table><p class="alert-d"><strong>S3BucketdDownCritical</strong> : si bucketd est DOWN, toutes les operations sur les buckets sont bloquees (CreateBucket, DeleteBucket, ListObjects) meme si Cloudserver est UP. Les GET/PUT d\'objets individuels existants peuvent continuer si Cloudserver peut contourner bucketd pour les metadonnees d\'objet simples.</p><h2>Redis-Sentinel — Cache Distribue Haute Disponibilite</h2><p>XDM utilise <strong>Redis-Sentinel</strong> pour fournir une base de donnees en memoire hautement disponible. Comme le decrit la documentation Scality : <em>"Redis-Sentinel is useful for short-term database needs, such as for a quick or temporary job, or for sharing as a shared database between two or more services."</em></p><h3>Services utilisant Redis-Sentinel</h3><table><tr><th>Service</th><th>Usage de Redis</th></tr><tr><td><strong>Backbeat (CRR)</strong></td><td>Stocke l\'etat de pause/resume de la replication inter-clusters. Redis conserve la file des objets en attente de replication et les flags pause/retry.</td></tr><tr><td><strong>Cloudserver</strong></td><td>Cache de sessions et de metadonnees chaudes. Reduit la pression sur repd pour les objets frequemment accedes.</td></tr><tr><td><strong>Backbeat API</strong></td><td>Base partagee pour les jobs Backbeat (lifecycle, ingestion). Coordonne les workers Backbeat.</td></tr></table><h3>Architecture Redis-Sentinel</h3><div class="adiag">Redis-Sentinel sur 3 noeuds (exemple) :\n\n  [Sentinel-1]  [Sentinel-2]  [Sentinel-3]\n       |              |              |\n       +----[Redis Master]----+\n       |                     |\n  [Redis Replica-1]   [Redis Replica-2]\n\nRole des sentinels :\n  - Surveille la sante du master en permanence\n  - Si master tombe : vote a la majorite pour promouvoir un replica\n  - Notifie les clients du nouveau master\n\nRisque : Redis est IN-MEMORY. Un restart = perte des donnees non flushees.\nUsage dans RING = donnees TEMPORAIRES uniquement (jobs, cache, flags CRR).</div><p class="alert-w"><strong>Important :</strong> Redis-Sentinel garantit la HA mais <strong>pas</strong> la durabilite. Les donnees Redis ne sont pas persistees de facon fiable. Pour les metadonnees S3 durables, c\'est repd (LevelDB + Raft) qui est utilise, pas Redis.</p><h2>Vault — Service IAM</h2><p><code>vault</code> est le service d\'<strong>Identity and Access Management (IAM)</strong> du S3 Connector. Il gere :</p><ul><li><strong>Comptes S3</strong> : creation, suppression, listing</li><li><strong>Utilisateurs IAM</strong> : cles d\'acces (AccessKey/SecretKey), permissions</li><li><strong>Groupes et Roles</strong> : politiques d\'acces multi-utilisateurs</li><li><strong>Policies</strong> : politiques JSON compatibles AWS IAM (Allow/Deny)</li></ul><p>Vault s\'appuie sur <code>repd-vault</code> pour stocker ses donnees de facon durable via Raft. L\'alerte <code>S3VaultDownCritical</code> bloque toute authentification S3 : aucune requete ne peut etre validee.</p><div class="kbox"><h3>Points Cles a Retenir</h3><ul><li>repd = daemon de metadonnees S3 STATEFUL (Raft) : cle pour chaque PUT/GET/LIST</li><li>repd-vault = meme principe pour les metadonnees IAM (comptes, users, policies)</li><li>Raft session = Leader (1) + Followers (N) : quorum = N/2+1 noeuds</li><li>S3RaftNoLeaderCritical = ecritures S3 bloquees, election auto en quelques secondes</li><li>S3RaftNotEnoughFollowersCritical = quorum perdu (>N/2 noeuds DOWN) = ecritures BLOQUEES</li><li>bucketd = orchestre les operations sur les buckets (ListObjects, CreateBucket...)</li><li>Vault = IAM/authentification (cles d\'acces, policies)</li><li>raft_term = numero du mandat du leader (incremente a chaque election)</li><li>LevelDB = backend embarque de repd (par defaut) — NOT RocksDB ni MongoDB</li><li>Redis-Sentinel = cache IN-MEMORY pour CRR pause/retry, Cloudserver, Backbeat API — pas de durabilite forte</li></ul></div>',
quiz:[
  {q:"Quel est le rôle de repd dans l'architecture S3 Scality ?",opts:["Expose l'API S3 aux clients","Daemon de gestion locale des objets, versioning (bseq) et cohérence avec LevelDB","Gère les groupes Raft","Authentifie les requêtes S3"],ans:1,expl:"repd (Replication Daemon) tourne sur chaque noeud META et DATA. Il gère le stockage local des objets, leur versioning via bseq, et maintient la cohérence avec LevelDB."},
  {q:"Qu'est-ce que bseq ?",opts:["Numéro de bucket séquentiel","Numéro de séquence de blob, identifiant unique d'une version d'objet sur disque","Taille du buffer d'écriture","Type de COS binaire"],ans:1,expl:"bseq (blob sequence number) est l'identifiant de version d'un objet sur disque. Chaque mise à jour incrémente le bseq. repd utilise ce numéro pour le versioning et la cohérence."},
  {q:"Combien de noeuds minimaux pour un groupe Raft fonctionnel ?",opts:["1","2","3","5"],ans:2,expl:"Un groupe Raft nécessite au minimum 3 noeuds pour avoir un quorum. Avec 3 noeuds, le quorum est 2 (floor(3/2)+1). Un seul noeud peut être perdu sans perte du service."},
  {q:"Que gère Vault dans l'architecture S3 Scality ?",opts:["Le stockage des objets","Service IAM : comptes, utilisateurs, rôles, politiques S3 et clés KMS","Les métriques d'utilisation","La réplication CRR"],ans:1,expl:"Vault est le service IAM (Identity and Access Management) de Scality. Il gère les comptes, utilisateurs S3, credentials, rôles et politiques d'accès, équivalent à AWS IAM."},
  {q:"Quel service stocke les métadonnées des buckets S3 (liste objets, ACL, versioning) ?",opts:["repd","MESA","bucketd","Vault"],ans:2,expl:"bucketd est le service dédié aux métadonnées des buckets S3 : liste des objets, ACL, versioning, tags par objet. Il utilise LevelDB localement et est indépendant de MESA."},
  {q:"Que se passe-t-il quand le leader d'un groupe Raft repd devient OOS ?",opts:["Toutes les écritures sont perdues","Les followers élissent automatiquement un nouveau leader après timeout","Les clients reçoivent une erreur 503 permanente","Un opérateur doit relancer repd manuellement"],ans:1,expl:"Raft prévoit l'élection automatique d'un nouveau leader. Les followers détectent l'absence du leader via timeout et lancent une élection. Le service reprend sans intervention."},
  {q:"Dans quel cas une alarme repd Raft apparaît-elle ?",opts:["Quand un bucket est plein","Quand un groupe Raft n'a plus de quorum (trop de noeuds OOS)","Quand un objet est INCOMPLETE","Quand CRR est en pause"],ans:1,expl:"Une alarme repd Raft se déclenche quand un groupe Raft perd son quorum (trop de noeuds OOS). Sans quorum, le groupe ne peut plus élire de leader et les écritures sont bloquées."},
  {q:"Quel est le rôle de cseq vs bseq ?",opts:["Ce sont des synonymes","cseq est la version logique de l'objet dans le ring (incrémenté à chaque update), bseq est la version physique sur disque","cseq est pour les objets CRR, bseq pour les objets locaux","cseq est le checksum, bseq est le numéro de séquence"],ans:1,expl:"cseq (chunk sequence) identifie la version logique d'un objet dans le ring Chord. bseq (blob sequence) est la version physique sur un disque spécifique. Les deux sont utilisés pour la cohérence et le versioning."},
  {q:"Quelle est la fonction principale de membershipd ?",opts:["Gérer les memberships des buckets S3","Maintenir la vue cohérente des membres actifs du cluster et orchestrer les changements de topologie","Monitorer la santé des disques","Gérer l'authentification des noeuds"],ans:1,expl:"membershipd est le daemon de gestion de l'appartenance au ring. Il maintient la liste des noeuds actifs et coordonne les opérations nodeJoin/nodeLeave via un protocole de consensus."},
  {q:"Si Vault est indisponible, quelles opérations S3 continuent de fonctionner ?",opts:["Toutes les opérations fonctionnent sans Vault","Aucune opération S3 n'est possible car toute requête nécessite une vérification IAM","Les opérations sur les buckets publics peuvent fonctionner mais les requêtes authentifiées échouent","Seules les lectures fonctionnent"],ans:1,expl:"Vault est le point d'authentification et d'autorisation centralisé. Sans Vault, Cloudserver ne peut pas vérifier les credentials S3 (access key / secret key) ni valider les politiques IAM. Toutes les requêtes authentifiées échouent avec une erreur d'authentification."}
]}

{id:'MD',num:'D',title:'Maintenance RING — Salt, Controle des Taches, Orphans',desc:'SaltStack, throttling et mode maintenance (ringsh), cycle de vie des donnees (GC/Purge), types d\'orphelins',
content:'<h2>Salt / SaltStack — L\'Outil de Configuration de Scality</h2><p>Scality RING utilise <strong>SaltStack</strong> comme outil de gestion de configuration et d\'orchestration. "Salt" dans les commandes Scality fait toujours reference a SaltStack — un logiciel de gestion d\'infrastructure comparable a Ansible ou Puppet, et <strong>non</strong> un "sel" cryptographique pour les hachages.</p><h3>Architecture SaltStack dans RING</h3><div class="adiag">Architecture Salt dans Scality RING :\n\n  [Salt Master]  -- sur le SUPERVISOR\n       |\n       |-- commandes/etats/pillar\n       |\n  +----+----+----+----+\n  |    |    |    |    |\n [Salt Minion] x N    -- sur chaque serveur RING\n (storage, connector, monitoring...)\n\nConfiguration :\n  /srv/scality/pillar/scality-common.sls  -- parametres globaux\n  /srv/scality/salt/                      -- etats Salt (formulas)\n  /srv/scality/bin/bootstrap              -- script d\'initialisation</div><h3>Commandes Salt courantes dans RING</h3><table><tr><th>Commande</th><th>Effet</th></tr><tr><td><code>salt \'*\' saltutil.refresh_pillar</code></td><td>Recharge la configuration (pillar) sur tous les noeuds. A executer apres toute modification de scality-common.sls.</td></tr><tr><td><code>salt-run state.orchestrate prometheus.orchestrate</code></td><td>Deploy ou reconfigure l\'infrastructure Prometheus/Alertmanager. A executer apres toute modification de la configuration de monitoring.</td></tr><tr><td><code>salt -G \'roles:ROLE_STORE\' state.sls scality.garbage_collector.configured</code></td><td>Applique la configuration du Garbage Collector sur tous les serveurs de stockage.</td></tr><tr><td><code>salt -G \'roles:ROLE_SUP\' state.sls ...</code></td><td>Applique un etat Salt uniquement sur le Supervisor.</td></tr><tr><td><code>salt &lt;minion_id&gt; grains.get prometheus_ip</code></td><td>Recupere la valeur d\'un "grain" (metadonnee de noeud) — utile pour les remplacements de noeud.</td></tr></table><p class="alert-i"><strong>scaldisk et Salt :</strong> L\'outil <code>scaldisk</code> (ajout/recuperation de disques) utilise Salt en mode standalone pour executer ses operations. Salt doit etre installe en version 2015.8 a 2017.7 (inclus). <strong>Ne pas utiliser Salt pour ajouter des disques a tous les serveurs simultanement</strong> — cela peut perturber le re-balancing du RING.</p><h2>Cycle de Vie des Donnees — GC, Purge, Relocation</h2><p>La suppression d\'un objet dans RING est un processus <strong>asynchrone en 3 etapes</strong> pour garantir les performances et eviter les orphelins :</p><div class="adiag">Flux de suppression d\'un objet :\n\n1. DELETE S3 (synchrone)\n   Client -> Cloudserver -> repd\n   L\'objet est marque "deleted" dans les metadonnees\n   -> Reponse immediate au client (200 OK)\n   \n2. Garbage Collector Task (asynchrone)\n   Un objet cache special "GC object" liste les objets a supprimer\n   Le daemon GC traite ces listes en arriere-plan\n   -> Les blocs de donnees dans le RING sont marques "a liberer"\n   \n3. Purge Task (asynchrone, delai 7 jours par defaut)\n   Apres le delai de "purge retention", les blocs sont physiquement\n   desalloues dans les fichiers DAT des biziods\n   -> L\'espace est reellement recupere\n\n4. Relocation Task (si necessaire)\n   Si un fichier DAT contient trop d\'espace non utilise (trous),\n   les donnees valides sont copiees dans un nouveau fichier DAT\n   et l\'ancien est supprime\n   -> Defragmentation des fichiers de stockage</div><h3>Les 3 taches du Garbage Collector</h3><table><tr><th>Tache</th><th>Role</th><th>Parametres cles</th></tr><tr><td><strong>GC Task</strong></td><td>Traite les "GC objects" (listes d\'objets supprimes). Optimise les suppressions massives en les traitant en asynchrone.</td><td><code>chordgc_enable</code>, <code>chordgc_crawlfreq</code> (frequence en secondes), <code>chordgc_maxjobs</code></td></tr><tr><td><strong>Purge Task</strong></td><td>Desallocation physique des objets marques deleted. Delai de purge retention = 7 jours par defaut. Ce delai <strong>evite les orphelins</strong> lors de pannes ou maintenance.</td><td><code>chordpurgetombstoneexpirationtimevalue</code> (min 1 semaine recommande), <code>chordpurgeperiod</code> (≤ moitie de la valeur precedente)</td></tr><tr><td><strong>Relocation Task</strong></td><td>Defragmentation : cree un nouveau fichier DAT avec les donnees valides, supprime l\'ancien. Libere l\'espace des trous dans les fichiers container.</td><td>Declenche automatiquement quand le taux d\'espace non utilise depasse un seuil.</td></tr></table><h2>Controle et Throttling des Taches RING</h2><p>Les taches automatiques peuvent impacter les I/O de production. L\'administrateur dispose de deux leviers.</p><h3>Throttling — Limiter l\'Impact sur la Production</h3><p>Le Throttling limite la bande passante consommee par chaque tache de fond :</p><ul><li><strong>Par tache</strong> : Rebuild throttle a 50 MB/s, GC a 10 MB/s</li><li><strong>Par priorite</strong> : les I/O de production sont toujours prioritaires sur les taches de fond</li><li><strong>Plage horaire</strong> : possibilite de limiter les taches lourdes a certaines plages horaires</li></ul><p>Configuration : Supervisor UI → <code>Administration &gt; General &gt; Task Throttling</code></p><h3>Mode Maintenance (ringsh) — Suspendre les Taches</h3><p>Avant certaines operations (remplacement de disque, upgrade d\'un node), il faut suspendre les taches automatiques pour eviter qu\'elles perturbent la fenetre de maintenance :</p><pre># Mode maintenance : desactiver les taches automatiques\nringsh supervisor ringConfigSet &lt;RING&gt; join_auto 0        # desactive auto-join\nringsh supervisor ringConfigSet &lt;RING&gt; rebuild_auto 0     # desactive auto-rebuild\nringsh supervisor ringConfigSet &lt;RING&gt; chordpurge_enable 0 # desactive chord purge\n\n# Reprise normale apres maintenance\nringsh supervisor ringConfigSet &lt;RING&gt; join_auto 2        # reactive auto-join\nringsh supervisor ringConfigSet &lt;RING&gt; rebuild_auto 1     # reactive auto-rebuild\nringsh supervisor ringConfigSet &lt;RING&gt; chordpurge_enable 1 # reactive chord purge</pre><div class="alert alert-w">Toujours reajouter les taches apres la fenetre de maintenance. Un RING laisse trop longtemps avec rebuild_auto=0 accumule des objets sous-repliques (etat INCOMPLETE) sans declenchement automatique du Rebuild.</div><h2>Les Orphelins dans RING</h2><p>Un <strong>orphelin</strong> est une donnee qui existe physiquement dans le RING mais qui n\'est plus referencee par aucune metadonnee. Les orphelins consomment de l\'espace disque inutilement et doivent etre nettoyes.</p><h3>Types d\'orphelins</h3><table><tr><th>Type</th><th>Definition</th><th>Cause typique</th></tr><tr><td><strong>Disk Orphans</strong></td><td>Chunks sur disque (biziod) qui n\'ont plus de cle valide dans l\'index RING.</td><td>Panne durant une ecriture, maintenance interrompue, bug de suppression partielle.</td></tr><tr><td><strong>S3 Orphans</strong></td><td>Donnees non referencees par les metadonnees S3 (ex: compte supprime sans supprimer son contenu).</td><td>Suppression d\'un compte S3 sans purge prealable du contenu. Deletion incomplete.</td></tr><tr><td><strong>SOFS Orphans</strong></td><td>Donnees SOFS sans metadonnees associees (ex: volume supprime sans supprimer les donnees liees).</td><td>Suppression de volume SOFS avec echec partiel.</td></tr><tr><td><strong>ARC Orphans</strong></td><td>Parties de fragments ARC (erasure coding) qui n\'ont pas ete correctement supprimees.</td><td>Suppression incomplete d\'un objet ARC (panne pendant la desallocation).</td></tr><tr><td><strong>ARC Incomplete Objects</strong></td><td>Objets ARC auxquels il manque trop de fragments pour etre reconstruits.</td><td>Multiples pannes simultanees depassant le seuil de tolerance ARC.</td></tr></table><h3>Commandes de gestion des disk orphans</h3><pre># Lister tous les orphelins potentiels sur un noeud\nring> node listDiskOrphans\n\n# Lister les orphelins d\'un biziod specifique\nring> node listDiskOrphans bizioname=cutebiziod0001\n\n# Supprimer les orphelins memoire d\'un biziod\nring> node clearDiskOrphans cutebiziod0001\n\n# Nettoyer les objets hors-service (OOS)\nring> node cleanupOos disk0001</pre><h3>Capacite affichee dans le Dashboard</h3><p>Le tableau de bord Scality distingue plusieurs categories de capacite qui aident a identifier les problemes d\'orphelins :</p><table><tr><th>Categorie</th><th>Description</th></tr><tr><td>Garbage collectable</td><td>Objets en attente de suppression asynchrone (GC objects). Doit diminuer periodiquement.</td></tr><tr><td>ARC Orphans</td><td>Fragments ARC non supprimes — indique des suppressions incompletes.</td></tr><tr><td>ARC Incomplete Objects</td><td>Objets ARC trop endommagees pour etre reconstruits — necessite une intervention.</td></tr><tr><td>Deleted</td><td>Objets marques pour suppression, en attente de purge (7 jours).</td></tr><tr><td>COS Incomplete Objects</td><td>Objets repliques (COS) avec des copies manquantes.</td></tr></table><div class="kbox"><h3>Points Cles a Retenir</h3><ul><li>Salt dans Scality = SaltStack (gestion de configuration), pas un sel cryptographique</li><li>Apres modification de scality-common.sls : toujours <code>salt \'*\' saltutil.refresh_pillar</code></li><li>Suppression RING = 3 phases asynchrones : GC Task → Purge Task (7j) → Relocation</li><li>Purge retention 7 jours = fenetre de securite contre les orphelins lors de pannes</li><li>Disk orphans = <code>listDiskOrphans</code> pour identifier, <code>clearDiskOrphans</code> pour nettoyer</li><li>S3 orphans = donnees sans metadonnees (compte supprime sans purge du contenu)</li><li>ARC Orphans = fragments ARC non supprimes → consomment de l\'espace inutilement</li><li>Throttling = limiter l\'impact des taches via Supervisor → Administration &gt; Task Throttling</li><li>Mode maintenance = desactiver rebuild_auto + join_auto avant toute intervention sur un node</li></ul></div>',
quiz:[
  {q:"Quelle commande ringsh retire proprement un noeud du ring ?",opts:["nodeRemove","nodeLeave","nodeStop","ringNodeDelete"],ans:1,expl:"nodeLeave retire proprement un noeud du ring. Avant de partir, le noeud transfère ses données aux autres membres. Ne pas utiliser si le noeud est déjà physiquement inaccessible."},
  {q:"Quelle commande ringsh ajoute un nouveau noeud au ring ?",opts:["nodeAdd","nodeStart","nodeJoin","ringExpand"],ans:2,expl:"nodeJoin ajoute un noeud au ring. Il déclenche le rééquilibrage du keyspace et le transfert de données vers le nouveau noeud."},
  {q:"Quel outil de gestion de configuration Scality utilise-t-il pour le déploiement ?",opts:["Ansible","Puppet","SaltStack","Terraform"],ans:2,expl:"SaltStack est l'outil d'orchestration et de gestion de configuration de Scality RING. Les états Salt définissent la configuration cible des différents types de noeuds."},
  {q:"Que fait la commande ringConfigSet ?",opts:["Affiche la configuration actuelle du ring","Modifie les paramètres de configuration du ring (facteur de réplication, seuils)","Réinitialise le ring à sa configuration d'usine","Synchronise la configuration entre noeuds"],ans:1,expl:"ringConfigSet modifie les paramètres de configuration du ring. C'est une opération sensible qui peut nécessiter validation et redémarrage de services. Réservée à la maintenance."},
  {q:"Quels types d'orphelins existent dans le RING ?",opts:["Chord Orphans uniquement","Disk Orphans et Chord Orphans","Metadata Orphans et Data Orphans","Object Orphans et Bucket Orphans"],ans:1,expl:"Il y a deux types : Disk Orphans (données sur disque sans référence Chord) et Chord Orphans (références Chord sans données physiques). Les deux sont identifiés par Chord Purge."},
  {q:"Quel est l'impact du throttling sur les tâches de maintenance ?",opts:["Annule les tâches","Limite la consommation I/O des tâches de fond pour ne pas impacter les accès clients","Accélère les tâches de rebuild","Désactive les alarmes pendant la maintenance"],ans:1,expl:"Le throttling limite le débit I/O des tâches de fond (Rebuild, Repair, Balance) pour que les opérations clients ne soient pas dégradées. À ajuster selon la charge et l'urgence."},
  {q:"Que vérifie-t-on en priorité avant un nodeLeave ?",opts:["Que le noeud est redémarré","Que le ring peut absorber la perte : espace suffisant et protections ARC intactes","Que tous les clients sont déconnectés","Que CRR est désactivé"],ans:1,expl:"Avant nodeLeave, vérifier que le ring a suffisamment d'espace pour absorber la redistribution et que le COS peut maintenir ses garanties de protection sans ce noeud."},
  {q:"Quelle est la différence entre nodeLeave et marquer un noeud OOS_PERM ?",opts:["Il n'y a pas de différence","nodeLeave est une sortie propre avec transfert de données (noeud disponible). OOS_PERM déclare le noeud définitivement perdu et déclenche un rebuild depuis les fragments survivants","nodeLeave est pour les noeuds DATA, OOS_PERM pour les noeuds META","OOS_PERM est plus rapide que nodeLeave"],ans:1,expl:"nodeLeave suppose que le noeud est accessible et peut transférer ses données : sortie planifiée propre. OOS_PERM est utilisé quand le noeud est physiquement irrécupérable : le ring reconstruit les données depuis les autres fragments/répliques sans le noeud perdu."},
  {q:"Après un nodeJoin, quelle tâche surveiller en priorité dans ringsh ?",opts:["Repair","Chord Purge","Balance (rééquilibrage du keyspace vers le nouveau noeud)","Rebuild"],ans:2,expl:"Après un nodeJoin, le ring doit redistribuer une partie du keyspace vers le nouveau noeud via Balance. C'est la tâche critique à surveiller : elle transfère les données, consomme de la bande passante I/O et peut prendre du temps selon le volume."},
  {q:"Un administrateur veut augmenter le facteur de réplication d'un COS de 3 à 5. Quelle commande utilise-t-il et quel est l'impact immédiat ?",opts:["ringConfigSet — le ring réplique instantanément tous les objets existants à 5 copies","ringConfigSet — les nouveaux objets sont écrits avec 5 répliques mais les objets existants restent à 3 jusqu'au passage de Repair","nodeJoin — il faut ajouter des noeuds d'abord","Il est impossible de changer un COS après création"],ans:1,expl:"ringConfigSet modifie le COS. Les nouvelles écritures respectent immédiatement le nouveau facteur. Les objets existants sont mis à jour progressivement lors du passage de Repair (vérification et correction de l'intégrité de tous les objets). L'effet n'est pas instantané sur l'existant."}
]}

{id:'ME',num:'E',title:'CRR — Replication Multi-Sites',desc:'Cross-Region Replication : Backbeat, Kafka, ZooKeeper, site-level vs bucket-level, objets existants, pause/resume',
content:'<h2>CRR — Cross-Region Replication</h2><p>La <strong>Cross-Region Replication (CRR)</strong> est le mecanisme de Scality pour repliquer de facon <strong>asynchrone</strong> les objets S3 d\'un cluster source vers un cluster destination. Elle est implementee par <strong>Backbeat</strong>, le moteur de workflows asynchrones du S3 Connector.</p><h3>Architecture du pipeline CRR</h3><div class="adiag">CLUSTER SOURCE                          CLUSTER DESTINATION\n\n  Client S3\n     | PUT objet\n     v\n [Cloudserver]                          [Cloudserver]\n     | ecrit metadonnees                      |\n     v                                        |\n  [repd]  --> journal Raft                    |\n     |                                        |\n     v                                        |\n [Backbeat Queue Populator]                   |\n     | detecte les nouveaux objets            |\n     | publie dans Kafka                      |\n     v                                        |\n   [Kafka]  topic: backbeat-replication       |\n     |                                        |\n     v                                        |\n [Backbeat Queue Processor]                   |\n     | lit les evenements Kafka               |\n     | lit l\'objet depuis sproxyd source      |\n     | ecrit l\'objet dans sproxyd destination |\n     +------> PUT objet ----------------------+\n     | ecrit le statut CRR dans repd source   |\n     v                                        |\n  Statut: COMPLETED                      [repd destination]</div><h3>Site-Level vs Bucket-Level CRR</h3><table><tr><th>Mode</th><th>Description</th><th>Cas d\'usage</th><th>Contraintes</th></tr><tr><td><strong>Bucket-Level CRR</strong></td><td>Configuration explicite par bucket : l\'admin active la replication bucket par bucket avec une policy JSON IAM.</td><td>Replication selective, Object Lock, CRR granulaire.</td><td>Chaque bucket doit etre configure independamment. Compatible Object Lock.</td></tr><tr><td><strong>Site-Level CRR (Echo Mode)</strong></td><td>Mode "echo" automatique : tout bucket cree sur la source est automatiquement replique sur la destination. Backbeat configure les IAM policies automatiquement.</td><td>Mirror complet de site, DR simplifie.</td><td><strong>Incompatible avec Object Lock.</strong> Pas de granularite par bucket.</td></tr></table><h3>Statuts CRR d\'un objet</h3><table><tr><th>Statut</th><th>Signification</th></tr><tr><td><strong>PENDING</strong></td><td>Objet en attente de replication dans la queue Kafka. Pas encore traite.</td></tr><tr><td><strong>PROCESSING</strong></td><td>Objet en cours de copie vers la destination.</td></tr><tr><td><strong>COMPLETED</strong></td><td>Objet replique avec succes sur le cluster destination.</td></tr><tr><td><strong>FAILED</strong></td><td>Echec de la replication (reseau, destination indisponible...). Redis conserve les entrees FAILED pour retry.</td></tr><tr><td><strong>REPLICA</strong></td><td>Objet qui EST une replique (il est la destination). Ne doit pas etre re-replique sauf en cas de DR failback.</td></tr></table><h2>Kafka et ZooKeeper dans CRR</h2><p><strong>Kafka</strong> est la queue de messages qui decouple le Queue Populator (detection) du Queue Processor (copie). Points cles :</p><ul><li>Topic principal : <code>backbeat-replication</code></li><li><strong>Retention 7 jours</strong> : si le cluster destination est indisponible plus de 7 jours, Kafka droppe les evenements les plus anciens et les objets ne seront jamais repliques</li><li>Verification sante : <code>/opt/scality/s3tools/bin/backbeat-topic-info</code></li></ul><p><strong>ZooKeeper</strong> coordonne :</p><ul><li>L\'election de leader dans les workers Backbeat</li><li>La synchronisation des offsets Kafka entre workers</li><li>En failover multi-sites : Ansible met a jour ZooKeeper (6 → 5 participants pour retablir le quorum)</li></ul><h2>Replier des Objets Existants (crrExistingObjects.js)</h2><p>Les objets mis en place <strong>avant</strong> l\'activation d\'une policy CRR ne sont pas automatiquement repliques. Le script <code>crrExistingObjects.js</code> (container <code>s3utils</code>) permet de les traiter :</p><pre># Replier les objets en statut PENDING (non encore repliques)\ndocker exec s3utils node crrExistingObjects.js \\\n  --target-replication-status PENDING \\\n  --workers 10 \\\n  --max-updates 10000\n\n# Cas DR Failback : re-replier les REPLICA (repliques) vers la source\ndocker exec s3utils node crrExistingObjects.js \\\n  --target-replication-status REPLICA \\\n  --force-using-configuration</pre><p>Variables importantes :</p><ul><li><code>TARGET_REPLICATION_STATUS</code> : NEW, PENDING, COMPLETED, FAILED, REPLICA</li><li><code>WORKERS</code> : parallelisme (attention a la charge sur la source)</li><li><code>KEY_MARKER</code> / <code>VERSION_ID_MARKER</code> : reprendre un traitement en cours par batch</li><li><code>FORCE_USING_CONFIGURATION</code> : force l\'utilisation de la config CRR actuelle plutot que celle dans les metadonnees de l\'objet</li></ul><h2>Pause et Resume de la CRR</h2><p>Depuis les versions 7.4.9.0 / 7.8.0.4, la replication peut etre mise en pause sans perdre les objets en queue :</p><pre># Pause : arrete l\'ingestion de nouveaux objets dans Kafka\n# (finit de traiter la queue existante)\nansible-playbook tooling-playbooks/backbeat-pause-ingestion.yml\n\n# Resume\nansible-playbook tooling-playbooks/backbeat-resume-ingestion.yml</pre><p class="alert-w"><strong>Risque Kafka :</strong> Si la pause dure plus de <strong>7 jours</strong>, les evenements Kafka les plus anciens sont supprimes (retention maximale). Les objets correspondants ne seront jamais repliques automatiquement. Utiliser <code>crrExistingObjects.js</code> avec <code>TARGET_REPLICATION_STATUS=PENDING</code> pour les recuperer.</p><h2>Metriques CRR via Backbeat API</h2><table><tr><th>Metrique</th><th>Endpoint</th><th>Interpretation</th></tr><tr><td>Backlog</td><td><code>/api/metrics/crr/all/backlog</code></td><td>Nombre et taille des objets en attente de replication (15 dernieres minutes). Si croissant : le processor n\'arrive pas a suivre.</td></tr><tr><td>Throughput</td><td><code>/api/metrics/crr/all/throughput</code></td><td>Objets/sec et bytes/sec en cours de replication. Utile pour le dimensionnement.</td></tr><tr><td>Completions</td><td><code>/api/metrics/crr/all/completions</code></td><td>Objets repliques avec succes (15 dernieres minutes).</td></tr></table><p class="alert-i"><strong>Action obligatoire pre-upgrade vers 9.5.2 :</strong> Les buckets CRR doivent accorder la permission <code>s3:ReplicateObject</code> au role de replication IAM. Sans cette permission (non verifiee avant 9.5.2), la CRR echoue avec <code>AccessDenied</code> apres l\'upgrade.</p><h2>CRR Tuning — Optimisation des Performances</h2><p>Si le backlog CRR augmente (le processor n\'arrive pas a suivre le debit d\'ingestion), plusieurs parametres peuvent etre ajustes pour accelerer la replication.</p><h3>Principe de convergence CRR</h3><p>Pour que la CRR "converge" (rattrape son retard), le <strong>processor doit repliquer plus vite que les nouvelles versions sont ajoutees a la queue Kafka</strong>. Si ce n\'est pas le cas, le backlog grossit indefiniment.</p><table><tr><th>Parametre</th><th>Variable</th><th>Effet</th></tr><tr><td>Nombre de workers CRR</td><td><code>env_backbeat_replication_workers</code></td><td>Parallelisme de copie. Augmenter pour accelerer sur un reseau rapide.</td></tr><tr><td>Taille des batches Kafka</td><td><code>env_backbeat_kafka_consumer_batch_size</code></td><td>Nombre de messages consommes par cycle. Augmenter reduit le overhead Kafka.</td></tr><tr><td>Concurrence par worker</td><td><code>env_backbeat_replication_concurrency</code></td><td>Requetes simultanees par worker. Utile si la latence reseau inter-sites est elevee.</td></tr></table><p class="alert-i"><strong>Apres chaque modification :</strong> Monitorer le backlog via <code>/api/metrics/crr/all/backlog</code>. Si le backlog diminue, le tuning est efficace. Si le backlog continue de croitre malgre le tuning, investiguer la bande passante reseau inter-sites.</p><h2>TLS pour CRR</h2><p>La replication CRR entre deux clusters peut etre securisee par TLS mutuel (mTLS) pour authentifier les deux sites l\'un envers l\'autre.</p><h3>Certificats CRR</h3><table><tr><th>Fichier</th><th>Emplacement</th><th>Role</th></tr><tr><td><code>backbeat.crt</code></td><td><code>/scality/ssd*1/s3/scality-frontend-s3/certs/</code></td><td>Certificat public du site pour la CRR</td></tr><tr><td><code>backbeat.key</code></td><td>Meme repertoire</td><td>Cle privee du site pour la CRR</td></tr><tr><td><code>backbeat-client.crt</code></td><td>Meme repertoire (optionnel)</td><td>Certificat client pour authentification mutuelle</td></tr></table><pre># Verifier les certificats CRR sur tous les noeuds stateful\nANSIBLE -i $INVENTORY -m shell \\\n  -a "ls -la /scality/ssd*1/s3/scality-frontend-s3/certs/backbeat*" \\\n  runners_metadata\n\n# Verifier que le container backbeat tourne\nctrctl ps | grep scality-backbeat | grep -v scality-backbeat-queue</pre><div class="kbox"><h3>Points Cles a Retenir</h3><ul><li>CRR = replication ASYNCHRONE via Backbeat (Queue Populator → Kafka → Queue Processor)</li><li>Site-level (echo) = replication automatique de tous les buckets, incompatible Object Lock</li><li>Bucket-level = configuration explicite par bucket, compatible Object Lock</li><li>Kafka retention = 7 jours : une indisponibilite >7j necessite crrExistingObjects.js</li><li>crrExistingObjects.js : outil pour replier les objets existants (PENDING, FAILED, REPLICA pour failback DR)</li><li>s3:ReplicateObject obligatoire depuis 9.5.2 dans les policies IAM CRR</li><li>Metriques CRR : backlog, throughput, completions via Backbeat API</li></ul></div>',
quiz:[
  {q:"Que signifie CRR ?",opts:["Cross-Ring Replication","Cross-Region Replication","Clustered Redundancy Replication","Continuous Real-time Replication"],ans:1,expl:"CRR = Cross-Region Replication. Réplique de manière asynchrone les objets S3 entre deux sites ou buckets distincts, orchestrée par Backbeat."},
  {q:"Quel composant orchestre la réplication CRR ?",opts:["Cloudserver","Vault","Backbeat","membershipd"],ans:2,expl:"Backbeat est le moteur de réplication asynchrone. Il consomme les événements de création/modification d'objets depuis Kafka et les réplique vers le site ou bucket destination."},
  {q:"Quel système de messagerie Backbeat utilise-t-il pour la queue des tâches CRR ?",opts:["RabbitMQ","Redis","Kafka","ZooKeeper"],ans:2,expl:"Backbeat utilise Kafka comme bus de messages pour mettre en queue les tâches de réplication. Kafka garantit la persistance et l'ordre des messages même en cas de panne."},
  {q:"Quelle est la différence entre site-level CRR et bucket-level CRR ?",opts:["Il n'y a pas de différence","Site-level réplique tout le site, bucket-level permet de choisir des buckets spécifiques","Bucket-level est synchrone, site-level est asynchrone","Site-level est plus rapide"],ans:1,expl:"Site-level CRR configure la réplication pour tous les buckets d'un site vers un autre. Bucket-level CRR permet une granularité fine : choisir quels buckets sont répliqués et vers quelle destination."},
  {q:"Peut-on répliquer des objets existants lors de la mise en place de CRR ?",opts:["Non, CRR ne concerne que les nouveaux objets","Oui, via un mécanisme de backfill/rattrapage des objets existants","Oui, mais seulement les 7 derniers jours","Non, il faut re-uploader les objets"],ans:1,expl:"Backbeat dispose d'un mécanisme de rattrapage pour répliquer les objets existants lors de l'activation de CRR. Ce backfill est configurable et peut être limité à certaines dates ou préfixes."},
  {q:"Que se passe-t-il si CRR est en pause et que des objets sont écrits sur le site source ?",opts:["Les objets sont perdus","Les objets sont stockés localement et répliqués quand CRR reprend via la queue Kafka","Les écritures sont rejetées","Les objets sont répliqués synchroniquement en fallback"],ans:1,expl:"Kafka persiste les événements de réplication même si Backbeat est en pause. À la reprise, Backbeat consomme la queue et réplique les objets écrits pendant la pause."},
  {q:"Quel est le rôle de ZooKeeper dans l'architecture Backbeat/CRR ?",opts:["Stocker les objets répliqués","Coordination distribuée : découverte de services, gestion de configuration pour Kafka et Backbeat","Surveiller les métriques de réplication","Gérer les credentials de réplication"],ans:1,expl:"ZooKeeper est utilisé par Kafka (et Backbeat) pour la coordination distribuée : élection de leader pour les partitions Kafka, découverte de services et gestion de configuration distribuée."},
  {q:"Comment surveiller le lag de réplication CRR ?",opts:["Via ringsh replicationStatus","Via les métriques Backbeat dans Grafana (queue depth, replication lag, bytes pending)","Via nodeStatus","Il n'y a pas de métrique de lag CRR"],ans:1,expl:"Backbeat expose des métriques de réplication accessibles via Prometheus/Grafana : profondeur de queue, lag en temps, bytes en attente. Ces indicateurs permettent de détecter un retard anormal."},
  {q:"Un opérateur observe que le lag CRR augmente progressivement depuis 2 heures. Quelle est la cause la plus probable et l'action à entreprendre ?",opts:["Le site destination est tombé : vérifier sa disponibilité","Le débit réseau inter-sites est insuffisant ou Backbeat manque de ressources : vérifier la bande passante, les métriques Backbeat et augmenter les workers si nécessaire","Kafka est plein : supprimer les messages anciens","CRR doit être redémarré manuellement toutes les 2 heures"],ans:1,expl:"Un lag croissant indique que la production d'événements dépasse la capacité de traitement. Causes possibles : bande passante inter-sites saturée, Backbeat sous-dimensionné (trop peu de workers), ou site destination lent. L'action : identifier le goulot via les métriques Backbeat et augmenter les ressources ou la bande passante."},
  {q:"Pourquoi CRR est-il asynchrone plutôt que synchrone dans l'architecture Scality ?",opts:["Scality n'a pas réussi à implémenter la réplication synchrone","La réplication synchrone impose d'attendre la confirmation du site distant pour chaque écriture, augmentant massivement la latence et rendant les écritures dépendantes de la connectivité inter-sites","La réplication asynchrone est moins fiable","La réplication synchrone est réservée aux architectures stretched"],ans:1,expl:"La réplication synchrone double (ou plus) la latence d'écriture car il faut attendre la confirmation du site distant. Sur des liens WAN avec 10-50ms de latence, cela dégraderait fortement les performances. CRR asynchrone découple la performance locale de la disponibilité du lien inter-sites, au prix d'un RPO non nul."}
]}
,
{id:'MF',num:'F',title:'SSE et Object Lock (WORM)',desc:'Chiffrement cote serveur : KMS interne, KMIP, AWS KMS. Object Lock Governance vs Compliance, contraintes CRR',
content:'<h2>SSE — Server-Side Encryption</h2><p>Le <strong>Server-Side Encryption (SSE)</strong> chiffre les objets au moment de leur stockage dans le RING. Le client envoie les donnees en clair (ou via TLS), Scality les chiffre avant de les ecrire sur disque. Le chiffrement est transparent pour le client S3.</p><h3>Architecture : Chiffrement Enveloppe</h3><div class="adiag">Principe du chiffrement enveloppe :\n\n  1. Objet a chiffrer\n         |\n         v\n  [Cloudserver]\n  - Genere une DATA KEY unique par objet (AES-256)\n  - Chiffre l\'objet avec la DATA KEY\n  - Demande au KMS de chiffrer la DATA KEY avec la MASTER KEY\n         |\n         v\n  [KMS (interne ou externe)]\n  - Retourne la DATA KEY chiffree (ne voit jamais l\'objet)\n         |\n         v\n  Stockage dans le RING :\n  - Objet chiffre (dans les fichiers DAT biziod)\n  - DATA KEY chiffree (dans les metadonnees repd)\n  - MASTER KEY ID (reference vers le KMS)\n\nPour dechiffrer :\n  - Cloudserver recupere la data key chiffree depuis repd\n  - Le KMS dechiffre la data key avec la master key\n  - Cloudserver dechiffre l\'objet avec la data key\n  -> L\'objet en clair est retourne au client</div><h3>Types de KMS supportes</h3><table><tr><th>Type</th><th>Description</th><th>Production ?</th></tr><tr><td><strong>KMS Interne Scality</strong></td><td>Master key stockee dans les metadonnees Scality. Simple a deployer.</td><td>NON recommande en production — la master key est dans le meme systeme que les donnees.</td></tr><tr><td><strong>AWS KMS (API)</strong></td><td>Utilise l\'API AWS KMS pour generer et gerer les master keys. Necessite une connexion vers AWS.</td><td>Oui — pour les environnements cloud hybrides.</td></tr><tr><td><strong>KMIP externe (cluster HA)</strong></td><td>Protocole standard Key Management Interoperability Protocol. Compatible : Thales CipherTrust, HashiCorp Vault, Hytrust KeyControl. Cluster HA depuis 9.5.0.</td><td>Oui — recommande en production on-premise.</td></tr></table><h3>Modes de configuration SSE</h3><p><strong>Chiffrement global</strong> : la variable <code>global_encryption_enabled: true</code> force AES-256 sur tous les nouveaux buckets. Les anciens buckets non chiffres ne sont pas affectes.</p><p><strong>Clé par compte vs par bucket</strong> : <code>env_default_encryption_key_per_account: true</code> associe une seule master key par compte (AWS KMS uniquement), simplifiant la gestion lors de la suppression de comptes.</p><p><strong>Coexistence interne + externe</strong> (depuis 9.5.0) : possible d\'avoir des buckets avec KMS interne et d\'autres avec KMS externe dans le meme cluster, sans migration des objets existants.</p><h3>Migration SSE</h3><p class="alert-w"><strong>Attention :</strong> Changer de KMS est une operation delicate. Les master keys actuelles doivent etre disponibles dans le nouveau KMS avec les <strong>memes key IDs</strong>. Sinon, les donnees chiffrees avec les anciennes master keys deviennent inaccessibles. Procedure : exporter les master keys de l\'ancien KMS → importer dans le nouveau avec les memes IDs → reconfigurer Scality.</p><h2>Object Lock — WORM</h2><p>L\'<strong>Object Lock</strong> (Write Once Read Many) garantit qu\'un objet ne peut pas etre modifie ou supprime pendant une periode definie. Utilise pour la conformite reglementaire (SEC 17a-4, CFTC, FINRA, GDPR).</p><h3>Activation et contraintes</h3><ul><li>Object Lock ne peut etre active qu\'a la <strong>creation du bucket</strong> (irréversible)</li><li>Le <strong>versioning est automatiquement active</strong> avec Object Lock</li><li>Incompatible avec le mode <strong>Site-Level CRR (echo)</strong></li><li>Compatible avec le mode <strong>Bucket-Level CRR</strong> (permission <code>s3:ReplicateObject</code> requise)</li></ul><h3>Modes de retention</h3><table><tr><th>Mode</th><th>Qui peut supprimer ?</th><th>Cas d\'usage</th></tr><tr><td><strong>Governance</strong></td><td>Les utilisateurs avec la permission <code>s3:BypassGovernanceRetention</code> peuvent modifier ou supprimer avant la fin de la periode. L\'admin peut egalement desactiver le mode.</td><td>Protection standard avec flexibilite admin. Audit, tests de conformite.</td></tr><tr><td><strong>Compliance</strong></td><td><strong>Personne</strong> ne peut supprimer ni modifier, pas meme le root du compte ou l\'admin Scality, avant la fin de la periode de retention.</td><td>Conformite reglementaire stricte (finance, sante, juridique). Immuabilite totale.</td></tr></table><h3>Legal Hold</h3><p>Le <strong>Legal Hold</strong> (<code>s3:PutObjectLegalHold</code>) est un verrou independant de la periode de retention. Il bloque toute suppression sans date d\'expiration — utile pour les litigations juridiques. Seul le retrait explicite du Legal Hold debloque la suppression.</p><div class="adiag">Combinaisons possibles :\n\n  Retention Governance + Legal Hold :\n    -> Suppression bloquee jusqu\'a fin retention ET retrait Legal Hold\n\n  Retention Compliance (5 ans) + Legal Hold :\n    -> Suppression impossible avant 5 ans ET retrait Legal Hold\n    -> Meme le root du compte ne peut pas supprimer\n\n  Legal Hold seul (sans retention) :\n    -> Suppression bloquee jusqu\'au retrait explicite du Legal Hold\n    -> Pas de date d\'expiration automatique</div><div class="kbox"><h3>Points Cles a Retenir</h3><ul><li>SSE = chiffrement enveloppe : data key unique par objet, chiffree par master key dans le KMS</li><li>KMS interne = non recommande en prod (master key dans le meme systeme)</li><li>KMIP (Thales, HashiCorp Vault...) = recommande en production on-premise, cluster HA depuis 9.5.0</li><li>global_encryption_enabled: true = AES-256 sur tous les nouveaux buckets</li><li>Object Lock = activation a la creation du bucket UNIQUEMENT (irreversible)</li><li>Governance = admin peut bypass ; Compliance = personne ne peut supprimer (immuabilite totale)</li><li>Legal Hold = verrou sans date, independant de la periode de retention</li><li>Object Lock incompatible avec Site-Level CRR (echo mode)</li></ul></div>',
quiz:[
  {q:"Que signifie SSE dans le contexte S3 ?",opts:["Secure Storage Engine","Server-Side Encryption : chiffrement des objets effectué par le serveur","Simple Storage Extension","Scality Security Engine"],ans:1,expl:"SSE (Server-Side Encryption) signifie que le chiffrement est effectué côté serveur avant d'écrire l'objet sur disque. Le client envoie des données en clair, le serveur chiffre."},
  {q:"Quels modes de gestion de clés SSE Scality supporte-t-il ?",opts:["KMS interne uniquement","KMS interne, KMIP (KMS externe), AWS KMS","SSL/TLS uniquement","AES-256 uniquement"],ans:1,expl:"Scality supporte 3 modes : KMS interne (Vault gère les clés), KMIP (intégration KMS externe comme Thales ou HashiCorp), et AWS KMS (pour les environnements hybrides AWS)."},
  {q:"Quelle est la différence entre Object Lock Governance et Compliance mode ?",opts:["Pas de différence","Governance : un admin peut supprimer le verrou. Compliance : personne ne peut supprimer l'objet avant l'expiration, même l'admin root","Compliance est pour les gouvernements uniquement","Governance est plus strict que Compliance"],ans:1,expl:"En Governance mode, un utilisateur avec permission spéciale peut supprimer le verrou. En Compliance mode, l'objet est inviolable jusqu'à expiration même pour root/admin. Compliance = WORM strict."},
  {q:"Qu'est-ce que UTAPI ?",opts:["Universal Transaction API","Usage Tracking API : collecte les métriques d'utilisation S3 par bucket/utilisateur","Unified Tenant Access Policy Interface","Update Transaction And Protocol Interface"],ans:1,expl:"UTAPI (Usage Tracking API) collecte et expose les métriques d'utilisation : octets stockés, nombre d'objets, requêtes, bande passante — par bucket et par utilisateur. Utilisé pour la facturation."},
  {q:"Qu'est-ce que le SUR ?",opts:["Scality Upgrade Ratio","Storage Utilization Ratio : taux d'utilisation de l'espace brut tenant compte de l'overhead ARC/réplication","Seuil d'Utilisation du Ring","Supervised Update Ratio"],ans:1,expl:"SUR = Storage Utilization Ratio. Mesure l'efficacité de l'utilisation de l'espace brut en tenant compte de l'overhead du schéma de protection (ARC ou réplication). Indicateur clé du dimensionnement."},
  {q:"Peut-on combiner CRR et Object Lock (WORM) ?",opts:["Non, incompatibles","Oui, mais avec des contraintes : le bucket destination doit aussi avoir Object Lock activé","Oui, sans contrainte","Non, CRR ne fonctionne qu'avec des objets non protégés"],ans:1,expl:"CRR et Object Lock sont compatibles mais le bucket de destination doit avoir Object Lock activé. Les métadonnées de rétention sont répliquées avec l'objet, préservant les garanties WORM sur le site destination."},
  {q:"Un client demande que ses données soient chiffrées avec une clé gérée par un HSM certifié FIPS 140-2. Quelle solution Scality utiliser ?",opts:["KMS interne Vault (simple et intégré)","KMIP avec un KMS externe certifié FIPS 140-2 (Thales, Entrust, etc.)","Chiffrement côté client uniquement","LUKS sur les disques suffit"],ans:1,expl:"KMIP permet d'intégrer un KMS externe certifié. Pour les exigences FIPS 140-2, il faut un HSM physique ou un KMS logiciel certifié, que KMIP connecte à Scality. Le KMS interne Vault n'a pas de certification FIPS 140-2."},
  {q:"Que se passe-t-il si un objet sous Object Lock Compliance atteint sa date d'expiration ?",opts:["Il est automatiquement supprimé par le ring","Il peut désormais être supprimé par l'utilisateur autorisé, mais n'est pas supprimé automatiquement sauf si une Lifecycle Policy le prévoit","Le verrou se renouvelle automatiquement","Il devient accessible en lecture seule uniquement"],ans:1,expl:"L'expiration de la période Object Lock Compliance lève le verrou WORM : l'objet peut être supprimé. Mais la suppression n'est pas automatique — il faut une action explicite ou une Lifecycle Policy configurée pour supprimer les objets expirés."}
]}

{id:'MG',num:'G',title:'Multi-site et Disaster Recovery',desc:'Topologies stretched vs asynchrone, Warm Standby (WSB), procedures de failover/failback, bseq de rattrapage',
content:'<h2>Topologies Multi-Sites Scality</h2><p>Scality RING supporte deux paradigmes de deploiement multi-sites fondamentalement differents :</p><table><tr><th>Modele</th><th>RPO</th><th>Basculement</th><th>Description</th></tr><tr><td><strong>Stretched (geo-etire)</strong></td><td>0 (synchrone)</td><td>Automatique (secondes)</td><td>Un seul RING logique reparti physiquement sur 2 ou 3 sites. Les ecritures sont synchrones entre sites. La perte d\'un site ne cause pas de perte de donnees.</td></tr><tr><td><strong>Asynchrone (CRR)</strong></td><td>Non nul (minutes)</td><td>Manuel</td><td>Deux RINGs independants avec replication asynchrone via CRR/Backbeat. RPO = temps de lag de replication. Basculement manuel require.</td></tr></table><h3>Topologies Stretched Supportees</h3><div class="adiag">Topologies geographiques supportees (Stretched) :\n\n  3 SITES (failover automatique si 1 site tombe) :\n  Site A (4 serveurs) + Site B (4 serveurs) + Site C (4 serveurs)\n  -> Perte d\'un site : quorum maintenu (2/3 sites)\n  -> 12 serveurs minimum\n\n  2 SITES + WITNESS :\n  Site A (majority : 5 md) + Site B (minority : 3 md) + Site C (1 witness)\n  -> Witness = ZooKeeper seul, pas de donnees\n  -> Perte du Site B : failover automatique (majority + witness)\n  -> Perte du Site A : failover manuel requis\n  -> 9 serveurs minimum + 1 witness\n\n  Metadata S3 (repd) :\n  5 noeuds actifs (md1 a md5) + 1 Warm Standby (wsb1)\n  Les noeuds sont repartis entre les sites selon la topologie</div><h2>Warm Standby (WSB)</h2><p>Le <strong>Warm Standby</strong> est un noeud metadata passif qui suit en "shadow" un noeud actif. Il est pre-configure mais n\'est pas membre actif des sessions Raft.</p><table><tr><th>Aspect</th><th>Noeud Actif (md)</th><th>Warm Standby (wsb)</th></tr><tr><td>Nom dans l\'inventaire</td><td><code>md1-cluster1</code></td><td><code>wsb1-cluster1</code></td></tr><tr><td>Membre Raft</td><td>Oui (vote pour les elections)</td><td>Non (spectateur, suit le journal)</td></tr><tr><td>Trafic S3</td><td>Oui (serveur des requetes)</td><td>Non (aucun trafic en mode standby)</td></tr><tr><td>Activation</td><td>Toujours actif</td><td>Activate via Ansible (<code>-t DR</code>) en cas de perte de site</td></tr></table><h3>Metriques de suivi du rattrapage : bseq</h3><p>La metrique <code>bseq</code> (backup sequence) indique le dernier index du journal Raft copie sur un noeud. Elle est critique pour valider qu\'un noeud (ou WSB) a bien rattrape le leader avant d\'activer un basculement :</p><pre># Verifier les sequences Raft de tous les noeuds\ncurl -s http://prometheus:9090/api/v1/query \\\n  \'?query=s3_metadata_stateful_raft_bseq\'\n\n# Un noeud est "a jour" quand son bseq = cseq du leader\n# Pendant le rattrapage : bseq < cseq (ecart decreissant)</pre><h2>Procedures de Failover et Failback</h2><h3>Perte du site MINORITY (scenario simple)</h3><div class="adiag">Etat initial : Site A (majority) + Site B (minority, DOWN)\n\n  md1-cluster1 (Site A) : LEADER  [UP]\n  md2-cluster1 (Site A) : follower [UP]\n  md3-cluster1 (Site A) : follower [UP]\n  md4-cluster1 (Site B) : follower [DOWN] <- site perdu\n  md5-cluster1 (Site B) : follower [DOWN] <- site perdu\n  wsb1-cluster1 (Site B): standby  [DOWN]\n\n  Quorum = 3/5 = OK (majority intact)\n  Impact : warnings mais le S3 continue a fonctionner\n  Action : reparer ou remplacer les noeuds Site B</div><h3>Perte du site MAJORITY (scenario critique)</h3><div class="adiag">Etat : Site A (majority, DOWN) + Site B (minority)\n\n  md1 a md3 (Site A) : [DOWN]\n  md4-cluster1 (Site B) : follower [UP]\n  md5-cluster1 (Site B) : follower [UP]\n  wsb1-cluster1 (Site B): standby  [UP]\n\n  Quorum = 2/5 < 3 = PERDU -> S3 bloque !\n\n  Procedure de DR (failover vers Site B) :\n  1. Verifier que wsb1 a un bseq recent (pas trop de lag)\n  2. ansible-playbook ... -t DR  # active wsb1 comme membre Raft\n  3. ZooKeeper reconfigure : 5 -> 3 participants\n  4. Nouveau quorum = 2/3 noeuds = OK\n  5. Redis Sentinel reset : redis-cli sentinel reset scality-s3\n  6. S3 reprend sur Site B seul\n\n  RTO : quelques minutes a quelques heures</div><h3>Failback — Retour a la normale</h3><p>Apres la restauration du site majority (Site A) :</p><ol><li>Verifier les stats Backbeat CRR (backlog proche de zero) avant de basculer</li><li>Arreter les containers S3 sur Site B (avant de reajouter Site A pour eviter des corruptions metadata)</li><li>Rejoindre les noeuds Site A comme followers (bseq doit rattraper le leader)</li><li>Attendre que bseq soit a parite avec cseq sur tous les noeuds Site A</li><li>Utiliser <code>crrExistingObjects.js --target-replication-status REPLICA</code> pour re-synchroniser les objets crees pendant le DR</li><li>Rebasculer le leader vers Site A (optionnel, le RING se reequilibre seul)</li><li>Desactiver wsb1 et le remettre en mode standby</li></ol><p class="alert-d"><strong>Critique :</strong> Ne jamais reajouter le site recupere sans s\'assurer que les containers S3 sont arretes dessus. Un site qui "revient" avec des donnees plus anciennes et qui commence a repondre aux requetes peut creer des corruptions metadata (split brain).</p><div class="kbox"><h3>Points Cles a Retenir</h3><ul><li>Stretched = 1 RING logique, synchrone, RPO=0, failover auto (3 sites) ou manuel (2 sites)</li><li>Asynchrone (CRR) = 2 RINGs independants, RPO non nul, failover toujours manuel</li><li>WSB (Warm Standby) = noeud passif pre-configure, active via Ansible -t DR</li><li>bseq = backup sequence : metrique pour verifier le rattrapage d\'un noeud apres une panne</li><li>Perte minority = quorum maintenu, S3 continue ; perte majority = DR obligatoire</li><li>Failback : toujours arreter les containers sur le site recupere AVANT de le reajouter</li><li>Redis Sentinel reset obligatoire apres failover : redis-cli sentinel reset scality-s3</li></ul></div>',
quiz:[
  {q:"Quelle est la différence entre une architecture stretched et une architecture asynchrone multi-site ?",opts:["Il n'y a pas de différence","Stretched : un seul ring couvrant deux sites (synchrone). Asynchrone : deux rings indépendants avec CRR","Stretched est plus lent","Asynchrone ne supporte pas le DR"],ans:1,expl:"Architecture stretched = un ring physiquement réparti sur 2 sites, écritures synchrones. Architecture asynchrone = 2 rings indépendants reliés par CRR, RPO non nul mais meilleure isolation des pannes."},
  {q:"Que signifie WSB (Warm Standby) ?",opts:["Write Standby Buffer","Warm Standby : site secondaire recevant les données en quasi-temps réel, prêt pour bascule rapide","Wide Scale Backup","Working Standby Bandwidth"],ans:1,expl:"Warm Standby (WSB) est un mode où le site secondaire reçoit les données via CRR et est maintenu 'chaud' (prêt). La bascule est rapide car les données sont déjà présentes, contrairement à un Cold Standby."},
  {q:"Qu'est-ce que le RPO ?",opts:["Recovery Point Objective : perte de données maximale tolérée en cas de sinistre","Recovery Process Order : ordre de redémarrage des services","Ring Protection Object : objet de protection du ring","Remote Proxy Operation"],ans:0,expl:"RPO (Recovery Point Objective) définit la perte de données maximale tolérée, exprimée en durée. Un RPO de 15 minutes signifie que 15 minutes de données peuvent être perdues en cas de sinistre."},
  {q:"Qu'est-ce que le RTO ?",opts:["Ring Topology Order","Recovery Time Objective : durée maximale tolérée d'interruption de service","Real-Time Operation","Replication Timeout Object"],ans:1,expl:"RTO (Recovery Time Objective) définit combien de temps le service peut rester indisponible après un incident. Il dicte la rapidité nécessaire de la procédure de failover."},
  {q:"Lors d'un failover vers le site secondaire, quelle est la première étape ?",opts:["Supprimer les données du site primaire","Vérifier la cohérence des données répliquées (lag CRR, bseq de rattrapage) avant de basculer le DNS","Reformater le site primaire","Désactiver Backbeat"],ans:1,expl:"Avant tout failover, vérifier le lag CRR et la cohérence via les bseq permet d'évaluer la perte de données potentielle (RPO effectif) et de décider si la bascule est acceptable."},
  {q:"Pourquoi une architecture stretched a-t-elle un RPO de zéro mais un RTO potentiellement plus élevé qu'une architecture asynchrone ?",opts:["C'est l'inverse : RPO non nul et RTO faible","RPO=0 car toute écriture est confirmée sur les deux sites synchroniquement. Mais si le lien inter-sites est coupé, le ring ne peut plus écrire (split-brain), augmentant potentiellement le RTO","L'architecture stretched n'a pas de RPO","RPO=0 uniquement pour les métadonnées"],ans:1,expl:"En architecture stretched, chaque écriture attend la confirmation des deux sites : RPO=0. Mais en cas de coupure du lien inter-sites, le ring se fragmente et peut refuser les écritures pour éviter le split-brain, impactant le RTO. L'architecture asynchrone tolère la coupure du lien (site local continue) mais au prix d'un RPO non nul."},
  {q:"Qu'est-ce qu'un Cold Standby par opposition à un Warm Standby ?",opts:["Un site Cold Standby est plus froid physiquement","Un site Cold Standby ne reçoit pas de données en temps réel : les données y sont copiées périodiquement (backup). La bascule est plus longue car il faut restaurer les données récentes","Un site Cold Standby est identique à un Warm Standby","Le Cold Standby est en lecture seule"],ans:1,expl:"Cold Standby : les données sont copiées périodiquement (ex: backup nocturne). RPO = temps depuis le dernier backup. La bascule nécessite une restauration. Warm Standby : données répliquées quasi en temps réel via CRR, bascule rapide avec RPO proche de zéro."},
  {q:"Comment tester un plan de DR sans impacter la production ?",opts:["Il est impossible de tester un DR sans impact","Effectuer des exercices de failover sur un environnement de test isolé, ou des tests partiels (failover d'un subset de buckets) en production avec retour en arrière planifié","Simuler uniquement sur papier","Attendre un vrai incident pour tester"],ans:1,expl:"Les tests DR doivent être réguliers pour valider les procédures et mesurer RTO/RPO réels. La bonne pratique est de tester sur un environnement de staging ou d'effectuer des drills partiels en production (failover d'un bucket non critique) avec procédure de rollback documentée."}
]}
,
{id:'MH',num:'H',title:'Features Avancees S3',desc:'Lifecycle policies, UTAPI/SUR (metriques facturation), rate limiting, S3 Analytics ClickHouse, Server Access Logging, Bucket Notifications',
content:'<h2>Lifecycle Policies — Expiration Automatique</h2><p>Les <strong>lifecycle policies</strong> permettent d\'automatiser la gestion du cycle de vie des objets S3 : expiration automatique, suppression de versions, nettoyage des uploads incomplets. Elles sont configurees en JSON compatible AWS.</p><h3>Operations disponibles</h3><table><tr><th>Action</th><th>Description</th></tr><tr><td><strong>Expire</strong></td><td>Supprime les objets apres N jours ou a une date donnee. Sur bucket versionne : cree un delete marker.</td></tr><tr><td><strong>NoncurrentVersionExpiration</strong></td><td>Supprime les anciennes versions d\'objets apres N jours de non-currentite.</td></tr><tr><td><strong>ExpireObjectDeleteMarkers</strong></td><td>Supprime les delete markers "orphelins" (qui n\'ont plus aucune version sous eux).</td></tr><tr><td><strong>AbortIncompleteMultipartUpload</strong></td><td>Abandonne les MPUs incomplets apres N jours. Critique pour liberer l\'espace des uploads abandonnes.</td></tr></table><h3>Exemple de policy JSON</h3><pre>{\n  "Rules": [\n    {\n      "ID": "expire-old-versions",\n      "Status": "Enabled",\n      "Filter": {"Prefix": "archive/"},\n      "NoncurrentVersionExpiration": {"NoncurrentDays": 30}\n    },\n    {\n      "ID": "cleanup-failed-uploads",\n      "Status": "Enabled",\n      "Filter": {},\n      "AbortIncompleteMultipartUpload": {"DaysAfterInitiation": 7}\n    }\n  ]\n}</pre><p class="alert-i"><strong>Filtrage par tag :</strong> Les regles avec filtre par tag sont plus couteuses — elles necessitent des appels metadata supplementaires pour lire les tags de chaque objet. Privilegier les filtres par prefixe quand c\'est possible.</p><p><strong>Exclusions :</strong> La variable <code>env_backbeat_lifecycle_conductor_filter_enabled</code> permet d\'exclure des buckets ou comptes entiers du scan lifecycle — utile pour les buckets a tres forte activite.</p><p class="alert-w"><strong>Attention :</strong> Les suppressions par lifecycle ne generent <strong>pas</strong> d\'evenements <code>ObjectRemoved</code> dans les Bucket Notifications. Utiliser <code>LifecycleExpiration:Delete</code> a la place.</p><h2>UTAPI et SUR — Metriques de Consommation</h2><p>Scality propose deux services complementaires pour mesurer la consommation de stockage S3, essentiels en environnement <strong>multi-tenant</strong> (facturation par compte ou bucket).</p><table><tr><th>Service</th><th>Role</th><th>Usage</th></tr><tr><td><strong>UTAPI v2</strong></td><td>API REST authentifiee (SigV4) qui expose : nombre d\'objets, octets stockes, bande passante, operations — par compte, bucket ou utilisateur.</td><td>Facturation, rapports de consommation. Permission IAM : <code>utapi:ListMetrics</code>.</td></tr><tr><td><strong>SUR</strong> (Scality Utilization Reporting, depuis 9.5.0)</td><td>Service plus robuste qui ingere le journal Raft de chaque session pour calculer la consommation. Dispose d\'un mode "Repair" (scan complet) active automatiquement au premier demarrage.</td><td>Reporting de stockage fiable. Incompatible avec une migration de bucket en cours.</td></tr></table><p><strong>Quotas par compte :</strong> <code>vaultclient create-account --quota &lt;bytes&gt;</code> (0 = pas de quota). Enforces en temps reel par UTAPI v2.</p><h2>Rate Limiting par Bucket (depuis 9.5.2.0)</h2><p>Le rate limiting par bucket protege les SLAs en evitant qu\'un tenant "bruyant" sature le cluster pour les autres. Configure via une API REST avec un utilisateur service dedie.</p><table><tr><th>Parametre</th><th>Description</th></tr><tr><td><code>rate_limiting_default_bucket_rps_limit</code></td><td>Limite en requetes par seconde (RPS) par bucket par defaut.</td></tr><tr><td><code>rate_limiting_default_burst_capacity</code></td><td>Capacite de burst (pics courts toleres au-dessus de la limite).</td></tr><tr><td><code>rate_limiting_bucket_config_cache_ttl</code></td><td>TTL du cache de configuration (ms). Un changement de limite peut prendre jusqu\'a 30 secondes a se propager.</td></tr></table><p>Un depassement de limite retourne <strong>HTTP 429 "SlowDown"</strong> — identique au comportement AWS S3, donc transparent pour les clients compatibles AWS.</p><h2>S3 Analytics — ClickHouse (depuis 9.5.0)</h2><p><strong>S3 Analytics</strong> collecte toutes les operations S3 depuis CloudServer, les envoie via <strong>FluentBit</strong> a <strong>ClickHouse</strong> (base de donnees columnaire OLAP). Il alimente les dashboards Grafana de monitoring S3 et de Lifecycle.</p><ul><li>Remplace completement Elasticsearch/Logstash (deprecated depuis 9.5.0)</li><li>6 noeuds recommandes pour 500 millions operations/jour</li><li>100 GB minimum de stockage par noeud</li><li>ZooKeeper coordonne les noeuds ClickHouse</li><li>Extension par shards <strong>irreversible</strong></li></ul><h2>Server Access Logging (depuis 9.5.2.0)</h2><p>Le <strong>Server Access Logging (SAL)</strong> enregistre toutes les requetes S3 sur un bucket source et les ecrit sous forme d\'objets dans un bucket cible. Utile pour l\'audit et la facturation.</p><ul><li>Pipeline : CloudServer → FluentBit → log-courier → bucket cible</li><li>Livraison asynchrone par batch — pas d\'ordre garanti, possible duplication</li><li>Le bucket cible ne devrait <strong>pas etre le meme</strong> que la source (feedback loop)</li></ul><h2>Bucket Notifications</h2><p>Les <strong>Bucket Notifications</strong> envoient des evenements S3 vers des queues externes (style SNS) lorsque des operations sont effectuees sur un bucket.</p><table><tr><th>Evenement</th><th>Declenche par</th></tr><tr><td><code>ObjectCreated:*</code></td><td>PUT, POST, COPY, CompleteMultipartUpload</td></tr><tr><td><code>ObjectRemoved:*</code></td><td>DELETE explicite par un client (pas par lifecycle)</td></tr><tr><td><code>LifecycleExpiration:Delete</code></td><td>Suppression par une regle lifecycle Expire</td></tr><tr><td><code>LifecycleExpiration:DeleteMarkerCreated</code></td><td>Creation d\'un delete marker par lifecycle</td></tr><tr><td><code>ObjectTagging:Put / Delete</code></td><td>Modification des tags d\'un objet</td></tr></table><p>Le format ARN de destination Scality : <code>arn:scality:bucketnotif:::nom_destination</code>. Backend : Kafka.</p><h2>Terraform Provider pour S3 Scality</h2><p>Scality fournit un <strong>provider Terraform officiel</strong> pour provisionner des ressources S3 (buckets, comptes IAM, policies) en infrastructure-as-code. Disponible sur <code>github.com/scality/scality-s3-tf-modules</code>.</p><h3>Ressources supportees</h3><table><tr><th>Ressource Terraform</th><th>Equivalent S3</th></tr><tr><td><code>scality_s3_bucket</code></td><td>Creation/configuration de bucket (versioning, lifecycle, ACL)</td></tr><tr><td><code>scality_iam_account</code></td><td>Compte IAM Vault</td></tr><tr><td><code>scality_iam_user</code></td><td>Utilisateur IAM avec access key/secret key</td></tr><tr><td><code>scality_iam_policy</code></td><td>Policy IAM JSON (Allow/Deny)</td></tr></table><pre># Exemple de configuration Terraform\nterraform {\n  required_providers {\n    scality = {\n      source = "scality/s3"\n    }\n  }\n}\n\nresource "scality_s3_bucket" "mon_bucket" {\n  bucket = "mon-bucket-prod"\n  versioning_enabled = true\n  lifecycle_rules = [...]\n}</pre><p class="alert-i"><strong>Cas d\'usage :</strong> Provisionnement automatise de centaines de buckets S3 avec des configurations standardisees (lifecycle, ACL, notifications). Utile dans les environnements DevOps avec GitOps et CI/CD.</p><h2>Apache Spark et le RING — Separation Compute / Storage</h2><p><strong>Apache Spark</strong> est un moteur de traitement distribue open-source. Il n\'est <strong>pas un composant interne du RING</strong> — il interagit avec le RING exclusivement via l\'API S3 standard.</p><div class="alert alert-i"><strong>Architecture data lake :</strong> Spark (compute) &lt;-&gt; API S3 &lt;-&gt; RING (storage). Le RING stocke les donnees (Parquet, CSV, JSON...). Spark lit et ecrit ces objets via S3. Ni le RING ne sait que c\'est Spark, ni Spark n\'a besoin de connaitre l\'architecture interne du RING.</div><h3>Cas d\'usage typiques</h3><ul><li><strong>Data lake analytics</strong> : Spark SQL sur tables Parquet dans le RING</li><li><strong>Machine learning</strong> : datasets de training lus par Spark MLlib depuis le RING</li><li><strong>ETL batch</strong> : transformation de donnees lues depuis et ecrites dans le RING</li></ul><h3>Configuration Spark pour le RING</h3><pre>spark.hadoop.fs.s3a.endpoint=https://&lt;ring-s3-endpoint&gt;
spark.hadoop.fs.s3a.access.key=&lt;access_key&gt;
spark.hadoop.fs.s3a.secret.key=&lt;secret_key&gt;
