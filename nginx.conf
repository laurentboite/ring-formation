worker_processes auto;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        gzip on;
        gzip_types text/html text/css application/javascript;
        location / {
            try_files $uri $uri/ =404;
        }
    }
}
